<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>镜头测试</title>
<!-- A throwaway test for docs/design/darkroom.md: which cameras does Safari expose on this iPhone, can each be
     opened by itself, does it switch lenses on its own, how big and how slow is an 800x700 latent image.
     Lives only in a test PR; not linked from the runtime and not in the service worker's SHELL. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a3ad7e; color: #1f2a14; font-family: ui-monospace, Menlo, monospace; }
  body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); box-sizing: border-box; }
  header { flex: none; padding: 10px 12px; border-bottom: 2px solid #1f2a14; }
  header h1 { margin: 0 0 8px; font-size: 17px; }
  .row { display: flex; gap: 8px; }
  button { flex: 1; min-height: 44px; font: inherit; font-size: 15px; background: #1f2a14; color: #a3ad7e; border: 0; padding: 8px; touch-action: manipulation; }
  button:disabled { background: #4a5a32; }
  main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 12px 24px; }
  p { margin: 0 0 10px; font-size: 15px; line-height: 1.5; }
  h2 { font-size: 13px; color: #4a5a32; margin: 16px 0 6px; font-weight: normal; }
  .cam { display: block; width: 100%; min-height: 48px; text-align: left; margin: 0 0 8px; background: #a3ad7e; color: #1f2a14; border: 2px solid #1f2a14; }
  .cam.on { background: #1f2a14; color: #a3ad7e; }
  video, #shot { display: block; width: 100%; background: #1f2a14; margin: 0 0 8px; }
  pre { margin: 0; font: inherit; font-size: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1>镜头测试 / Lens test</h1>
  <div class="row">
    <button id="start" type="button">授权并列出摄像头</button>
    <button id="copy" type="button" disabled>复制结果</button>
  </div>
</header>
<main>
  <p>1. 点「授权并列出摄像头」，允许使用相机。2. 逐个点下面的摄像头，看取景；对着近处的东西慢慢靠近，看画面会不会突然跳一下（自己换了镜头）。
     3. 每个摄像头点一次「拍一张潜影」。4. 点「复制结果」，把文字发给我，并告诉我哪个摄像头会自己跳。</p>
  <h2>摄像头 / Cameras</h2>
  <div id="list"><p>还没有列出。</p></div>
  <h2>取景 / Preview</h2>
  <video id="v" playsinline muted autoplay></video>
  <div class="row"><button id="shoot" type="button" disabled>拍一张潜影（800×700）</button></div>
  <img id="shot" alt="">
  <h2>结果 / Report</h2>
  <pre id="out"></pre>
</main>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var v = $("v"), out = $("out"), stream = null, current = null, report = [];
  function log(s) { report.push(s); out.textContent = report.join("\n"); }
  function stop() { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  function short(id) { return id ? id.slice(0, 8) : "-"; }

  log("UA: " + navigator.userAgent);
  log("screen: " + screen.width + "x" + screen.height + " @" + devicePixelRatio);

  $("start").onclick = function () {
    $("start").disabled = true;
    /* labels and the full list appear only after permission */
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false }).then(function (s) {
      var t = s.getVideoTracks()[0], st = t.getSettings();
      log("\ndefault environment camera: " + t.label + " id " + short(st.deviceId) + " " + st.width + "x" + st.height);
      s.getTracks().forEach(function (x) { x.stop(); });
      return navigator.mediaDevices.enumerateDevices();
    }).then(function (devs) {
      var cams = devs.filter(function (d) { return d.kind === "videoinput"; });
      log("\n" + cams.length + " cameras:");
      var list = $("list"); list.innerHTML = "";
      cams.forEach(function (d, i) {
        log("  " + (i + 1) + ". " + (d.label || "(no label)") + "  id " + short(d.deviceId));
        var b = document.createElement("button");
        b.type = "button"; b.className = "cam"; b.textContent = (i + 1) + ". " + (d.label || "(no label)");
        b.onclick = function () { open(d, b, i + 1); };
        list.appendChild(b);
      });
      $("copy").disabled = false;
    }).catch(function (e) { log("ERROR " + e.name + ": " + e.message); $("start").disabled = false; });
  };

  function open(d, b, n) {
    stop();
    Array.prototype.forEach.call(document.querySelectorAll(".cam"), function (x) { x.classList.remove("on"); });
    b.classList.add("on");
    $("shoot").disabled = true;
    navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: d.deviceId }, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false }).then(function (s) {
      stream = s; current = { n: n, label: d.label };
      v.srcObject = s;
      return v.play().then(function () { return s; });
    }).then(function (s) {
      var t = s.getVideoTracks()[0], st = t.getSettings(), caps = t.getCapabilities ? t.getCapabilities() : {};
      var c = [];
      ["width", "height", "frameRate", "zoom", "focusDistance", "facingMode"].forEach(function (k) {
        if (caps[k] !== undefined) c.push(k + " " + (typeof caps[k] === "object" && !Array.isArray(caps[k]) ? (caps[k].min + "-" + caps[k].max) : caps[k]));
      });
      log("\n[" + n + "] " + d.label);
      log("  opened " + st.width + "x" + st.height + (st.frameRate ? " @" + Math.round(st.frameRate) : "") +
          " facing " + (st.facingMode || "-") + (st.zoom !== undefined ? " zoom " + st.zoom : "") + " same id: " + (st.deviceId === d.deviceId));
      log("  caps: " + (c.join(", ") || "(none)"));
      fps(n);
      $("shoot").disabled = false;
    }).catch(function (e) { log("\n[" + n + "] " + d.label + "\n  ERROR " + e.name + ": " + e.message); });
  }

  /* frames a second the page really gets, over two seconds */
  function fps(n) {
    var count = 0, t0 = performance.now(), last = -1;
    function tick() {
      if (!current || current.n !== n) return;
      if (v.requestVideoFrameCallback) { count++; } else if (v.currentTime !== last) { count++; last = v.currentTime; }
      if (performance.now() - t0 < 2000) { if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(tick); else requestAnimationFrame(tick); }
      else log("  frames a second: " + Math.round(count / ((performance.now() - t0) / 1000)));
    }
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(tick); else requestAnimationFrame(tick);
  }

  /* the latent image the darkroom would keep: the centre 8:7 of the frame at 800x700, JPEG 0.8 */
  $("shoot").onclick = function () {
    if (!v.videoWidth) return;
    var t0 = performance.now(), W = 800, H = 700, vw = v.videoWidth, vh = v.videoHeight;
    var sw = vw, sh = vw * H / W; if (sh > vh) { sh = vh; sw = vh * W / H; }
    var c = document.createElement("canvas"); c.width = W; c.height = H;
    c.getContext("2d").drawImage(v, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, W, H);
    c.toBlob(function (blob) {
      var ms = Math.round(performance.now() - t0);
      log("  latent " + W + "x" + H + " from " + vw + "x" + vh + ": " + Math.round(blob.size / 1024) + " KB, " + ms + " ms");
      $("shot").src = URL.createObjectURL(blob);
    }, "image/jpeg", 0.8);
  };

  $("copy").onclick = function () {
    var text = report.join("\n");
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject(new Error("no clipboard"))).then(function () {
      $("copy").textContent = "已复制";
      setTimeout(function () { $("copy").textContent = "复制结果"; }, 1500);
    }, function () { log("\n(copy failed: select the report text by hand)"); });
  };
  window.addEventListener("pagehide", stop);
})();
</script>
</body>
</html>
