# Publishes the repo as a static site on the gh-pages branch (GitHub Pages).
#   push to main  -> site root:  https://nowheremanx.github.io/lopda/runtime/
#   pull request  -> pr/<n>/:    preview of the dev harness (and of runtime/ when it changed; platform.js gives it
#                    its own IndexedDB), removed when the PR closes.
#                    Only when the PR changes something a preview can show (see "Decide what to preview").
# Only git, rsync and the gh CLI are used; no third-party actions.
name: pages
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

# One push to gh-pages at a time, and never cancel one halfway.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Fork PRs get a read-only token and must not publish.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      ACTION: ${{ github.event.action }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SITE: https://nowheremanx.github.io/lopda
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A closed PR may have no merge ref left; the cleanup only needs any commit.
          ref: ${{ github.event.action == 'closed' && github.event.repository.default_branch || '' }}

      - name: Decide what to preview
        id: plan
        run: |
          # Pushes to main and closing a PR always publish (or clean up).
          if [ "${{ github.event_name }}" = "push" ] || [ "$ACTION" = "closed" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")
          # Registry apps the PR touches (and that still exist). The shell runs with pipefail,
          # so a grep that matches nothing must not end the step.
          APPS=$(printf '%s\n' "$CHANGED" | { grep '^registry/apps/' || true; } | cut -d/ -f3 | sort -u | while read -r id; do
            if [ -d "registry/apps/$id" ]; then echo "$id"; fi; done)
          # A runtime/ change is previewed through the runtime link only: the app links open sdk/dev.html,
          # which loads nothing from runtime/ but the sound chip, so listing every app would preview nothing new.
          RUNTIME=false
          if printf '%s\n' "$CHANGED" | grep -qE '^runtime/'; then RUNTIME=true; fi
          # The sdk scripts, the dev harness and the sound chip it shares with the runtime are what every app link
          # runs on, so a change there lists all apps. sdk/*.md and the templates are docs: they do not.
          if printf '%s\n' "$CHANGED" | grep -qE '^(sdk/(.*\.js|dev\.html)|runtime/chip\.js)$'; then APPS=$(ls registry/apps); fi
          # Docs, tests, CI only: nothing a preview could show, so no deploy and no comment.
          if [ -z "$APPS" ] && [ "$RUNTIME" = false ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No app, sdk script or runtime change: skipping the preview."
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          { echo "apps<<EOF"; echo "$APPS"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Prepare the gh-pages worktree
        if: steps.plan.outputs.deploy == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add ../site FETCH_HEAD
            git -C ../site checkout -B gh-pages
          else
            # First run: an orphan branch with no history.
            git worktree add --detach ../site
            git -C ../site checkout --orphan gh-pages
            git -C ../site rm -rf --quiet . || true
          fi

      - name: Publish this commit
        if: steps.plan.outputs.deploy == 'true' && (github.event_name == 'push' || github.event.action != 'closed')
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            DEST=../site
            # pr/ holds the open previews and .nojekyll must survive --delete.
            EXTRA="--exclude=/pr/ --exclude=/.nojekyll"
          else
            DEST=../site/pr/$PR
            mkdir -p "$DEST"
            EXTRA=""
          fi
          # Not part of the site: git data, dependencies, tests, scratch and CI files.
          rsync -a --delete $EXTRA \
            --exclude=/.git --exclude=/node_modules --exclude=/tests \
            --exclude=/_to_delete --exclude=/.github \
            ./ "$DEST"/
          touch ../site/.nojekyll

      - name: Remove the preview of a closed PR
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        run: rm -rf "../site/pr/$PR"

      - name: Commit and push (retry on a rejected push)
        if: steps.plan.outputs.deploy == 'true'
        run: |
          cd ../site
          git add -A
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -q -m "pages: ${{ github.event_name }} ${{ github.sha }}"
          for i in 1 2 3 4 5; do
            git push origin gh-pages && exit 0
            git fetch origin gh-pages
            git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
          done
          exit 1

      - name: Comment preview links on the PR
        if: steps.plan.outputs.deploy == 'true' && github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          APPS: ${{ steps.plan.outputs.apps }}
          RUNTIME: ${{ steps.plan.outputs.runtime }}
        run: |
          {
            echo '<!-- lopda-preview -->'
            echo '**Preview / 预览** (GitHub Pages takes about a minute to update / 页面约需一分钟更新)'
            echo
            # Every preview carries the whole site, so the runtime link always works. It is the one to use on a
            # phone: the dev harness is a desktop tool (small buttons, a log). For an app-only PR it says where to
            # find the changed apps: the preview's store lists this PR's registry.
            if [ "$RUNTIME" = true ] || [ -z "$APPS" ]; then
              echo "- runtime: $SITE/pr/$PR/runtime/"
            else
              NAMES=$(echo $APPS | sed 's/ /, /g'); if [ $(echo $APPS | wc -w) -gt 3 ]; then NAMES="any app / 任意 app"; fi
              echo "- runtime (on a phone; install from the store / 在商店里安装: $NAMES): $SITE/pr/$PR/runtime/"
            fi
            for id in $APPS; do
              echo "- $id (dev harness, desktop / 开发台，电脑上用): $SITE/pr/$PR/sdk/dev.html?app=registry/apps/$id"
            done
            echo
            echo "The preview shares its origin with the real site. Its runtime/ keeps its data in its own IndexedDB (lopda-pr-$PR), separate from the real handheld at the site root. The dev harness keeps PAD saves in localStorage under lopda-dev:<app id>; that is shared by all previews on this origin but not used by the real handheld."
            echo
            echo "预览与正式站点同源。预览里的 runtime/ 把数据放在自己的 IndexedDB（lopda-pr-$PR），和站点根目录的正式掌机互不相通。开发台把 PAD 存档放在 localStorage 的 lopda-dev:<app id> 下，所有预览共用，正式掌机不使用。"
          } > comment.md
          # Update the one comment carrying the marker, or create it.
          ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | contains("<!-- lopda-preview -->"))][0].id // empty' | head -n1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi
