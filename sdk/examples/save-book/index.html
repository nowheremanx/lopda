<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>存档本</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#a3ad7e;color:#1f2a14;font-family:monospace}
body{display:flex;flex-direction:column}
header{flex:none;padding:8px 12px 4px}
h1{font-size:18px;margin:0 0 3px}
#status{font-size:14px;line-height:1.25;min-height:18px;color:#4a5a32;overflow-wrap:anywhere}
/* scroll-padding keeps a row scrolled to by the keys clear of the sticky form (44 px tall + its 8 px padding) */
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 6px;scroll-padding-top:60px}
footer{flex:none;padding:4px 8px 6px;text-align:center;font-size:13px;color:#4a5a32}
.counter{display:flex;gap:8px;margin:0 0 8px}
button{font:inherit;color:#1f2a14;background:#a3ad7e;border:2px solid #1f2a14;min-height:44px;touch-action:manipulation;cursor:pointer}
button:focus,input:focus{outline:2px solid #1f2a14;outline-offset:1px}
button:disabled{color:#4a5a32}
.entry{flex:1;display:flex;align-items:center;justify-content:space-between;padding:4px 10px;text-align:left;font-size:16px;overflow-wrap:anywhere}
.entry strong{font-size:20px;margin-left:8px;flex:none}
.entry.selected,.primary{background:#1f2a14;color:#a3ad7e}
.remove{width:48px;flex:none;font-size:18px}
.remove:disabled{color:#4a5a32}
/* The form stays at the top of the scrolling area: adding a counter grows the list below it,
   so the input and the button never move under a thumb that is about to tap again. */
#addForm{position:sticky;top:0;z-index:1;display:flex;gap:8px;padding:8px 0;background:#a3ad7e}
input{min-width:0;flex:1;height:44px;box-sizing:border-box;font:16px monospace;padding:0 8px;color:#1f2a14;background:#a3ad7e;border:2px solid #1f2a14;caret-color:#1f2a14}
input::placeholder{color:#4a5a32}
#add{min-width:72px;padding:0 10px}
.line{font-size:14px;line-height:1.35;color:#4a5a32;overflow-wrap:anywhere;margin:6px 0}
.info{margin:8px 0}
.info button{width:100%;font-size:16px}
.hidden{display:none!important}
</style>
</head>
<body>
<header><h1 id="title">存档本</h1><div id="status"></div></header>
<main id="main">
  <div id="addForm">
    <input id="name" maxlength="16" autocomplete="off" enterkeyhint="done">
    <button id="add" class="primary" type="button"></button>
  </div>
  <div id="list"></div>
  <div id="inlineInfo" class="line"></div>
  <section id="infoScreen" class="hidden">
    <p id="infoDetail" class="line"></p>
    <button id="back" type="button"></button>
  </section>
</main>
<footer id="hint"></footer>
<script>
/*
 * Save Book demonstrates PAD.load, PAD.saveInfo and PAD.setSchema, including safe migration.
 * Schema 0: key "count" = number. Schema 1: key "tallies" = [{name, n}].
 */
(function () {
  var TXT = {
    zh: {
      title: '存档本', tip: '点计数器或按 A 加一', empty: '还没有计数器', name: '名称', add: '新增', full: '最多八个',
      corrupt: '存档损坏；请到设置清除', readfail: '存档无法读取；请到设置清除', newer: '存档格式较新；请到设置清除',
      schemaNew: '存档版本较新；请更新应用', badData: '存档内容不符；请到设置清除',
      back: '返回', schema: '格式', version: '应用', updated: '保存时间', bytes: '字节',
      keys: '↑↓ 选择　A 加一　START 信息', keysInfo: 'A / B 返回', added: '已新增', removed: '已删除', subtracted: '已减一',
      invalid: '请输入名称', remove: '删除计数器', subtract: '减一',
      loadErr: '读取失败；只读至设置清除存档'
    },
    en: {
      title: 'Save Book', tip: 'Tap a tally or press A to add one', empty: 'No tallies yet', name: 'Name', add: 'Add', full: 'Limit: eight',
      corrupt: 'Save damaged; clear it in Settings', readfail: 'Save unreadable; clear it in Settings', newer: 'Save format newer; clear it in Settings',
      schemaNew: 'Save schema newer; update this app', badData: 'Save data invalid; clear it in Settings',
      back: 'Back', schema: 'Schema', version: 'App', updated: 'Saved', bytes: 'Bytes',
      keys: '↑↓ Select　A +1　START Info', keysInfo: 'A / B back', added: 'Added', removed: 'Removed', subtracted: 'Subtracted',
      invalid: 'Enter a name', remove: 'Remove tally', subtract: 'Subtract one',
      loadErr: 'Load failed; read-only until cleared in Settings'
    }
  }[PAD.lang === 'en' ? 'en' : 'zh'];

  var lang = PAD.lang === 'en' ? 'en' : 'zh';
  var tallies = [];
  var selected = 0;
  var readOnly = false;
  var ready = false;
  var info = null;
  var infoPage = false;
  var list = document.getElementById('list');
  var status = document.getElementById('status');
  var hint = document.getElementById('hint');
  var form = document.getElementById('addForm');
  var nameInput = document.getElementById('name');
  var inlineInfo = document.getElementById('inlineInfo');
  var addButton = document.getElementById('add');
  var infoScreen = document.getElementById('infoScreen');
  var infoDetail = document.getElementById('infoDetail');
  var backButton = document.getElementById('back');

  document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
  document.title = TXT.title;
  document.getElementById('title').textContent = TXT.title;
  hint.textContent = TXT.keys;
  nameInput.placeholder = TXT.name;
  addButton.textContent = TXT.add;
  backButton.textContent = TXT.back;

  function say(text) {
    status.textContent = text;
  }

  function sound(name) {
    try {
      // PAD.sfx gives brief feedback for an app action.
      PAD.sfx(name);
    } catch (e) {}
  }

  function valid(value) {
    if (!Array.isArray(value) || value.length > 8) {
      return false;
    }
    for (var i = 0; i < value.length; i++) {
      var item = value[i];
      if (!item || typeof item.name !== 'string' || !item.name.trim() ||
          typeof item.n !== 'number' || !isFinite(item.n)) {
        return false;
      }
    }
    return true;
  }

  function save() {
    if (readOnly || !ready) {
      return;
    }
    if (PAD.setSchema) {
      // PAD.setSchema records schema 1 so the following save carries the new format number.
      PAD.setSchema(1);
    }
    // PAD.save writes the current list after a validated user edit.
    PAD.save('tallies', tallies);
    refreshInfo();
  }

  function infoText() {
    var missing = '—';
    var value = info || {};
    var date = missing;
    if (value.updated != null && value.updated !== 0) {
      date = new Date(value.updated).toLocaleString(lang === 'en' ? 'en-US' : 'zh-CN');
    }
    var schema = value.schema == null ? missing : value.schema;
    var version = value.version || missing;
    var bytes = value.bytes == null ? missing : value.bytes;
    return TXT.schema + ': ' + schema + '　' + TXT.version + ': ' + version +
      '　' + TXT.updated + ': ' + date + '　' + TXT.bytes + ': ' + bytes;
  }

  function refreshInfo() {
    if (!PAD.saveInfo) {
      info = null;
      render();
      return;
    }
    // PAD.saveInfo reads on-disk schema, app version, save time and byte size for this display.
    PAD.saveInfo().then(function (value) {
      info = value;
      render();
    }).catch(function () {
      info = null;
      render();
    });
  }

  function removeTally(index) {
    tallies.splice(index, 1);
    if (selected >= tallies.length) {
      selected = Math.max(0, tallies.length - 1);
    }
    say(TXT.removed);
    sound('miss');
    save();
    render();
  }

  function changeTally(index) {
    if (readOnly) {
      say(TXT.loadErr);
      sound('err');
      return;
    }
    if (!ready) {
      return;
    }
    if (tallies[index].n === 0) {
      removeTally(index);
      return;
    }
    tallies[index].n--;
    say(TXT.subtracted);
    sound('tick');
    save();
    render();
  }

  function render() {
    list.textContent = '';
    if (!tallies.length) {
      var empty = document.createElement('div');
      empty.className = 'line';
      empty.textContent = TXT.empty;
      list.appendChild(empty);
    }
    tallies.forEach(function (item, index) {
      var row = document.createElement('div');
      row.className = 'counter';
      var entry = document.createElement('button');
      entry.type = 'button';
      entry.className = 'entry' + (index === selected && !infoPage ? ' selected' : '');
      entry.setAttribute('aria-label', item.name + ' ' + item.n);
      var label = document.createElement('span');
      label.textContent = item.name;
      var count = document.createElement('strong');
      count.textContent = String(item.n);
      entry.appendChild(label);
      entry.appendChild(count);
      entry.addEventListener('click', function () {
        selected = index;
        increment();
      });

      var action = document.createElement('button');
      action.type = 'button';
      action.className = 'remove';
      action.textContent = item.n === 0 ? '×' : '−';
      action.setAttribute('aria-label', item.n === 0 ? TXT.remove : TXT.subtract);
      action.addEventListener('click', function () {
        changeTally(index);
      });
      row.appendChild(entry);
      row.appendChild(action);
      list.appendChild(row);
    });

    infoScreen.classList.toggle('hidden', !infoPage);
    list.classList.toggle('hidden', infoPage);
    form.classList.toggle('hidden', infoPage);
    inlineInfo.classList.toggle('hidden', infoPage);
    backButton.classList.toggle('hidden', !infoPage);
    // The footer lists only the keys this screen uses (UI.md 6): on the info page A and B just go back.
    hint.textContent = infoPage ? TXT.keysInfo : TXT.keys;
    infoDetail.textContent = infoText();
    addButton.disabled = readOnly || !ready || tallies.length >= 8;
    nameInput.disabled = readOnly || !ready || tallies.length >= 8;
    if (!readOnly && tallies.length < 8) {
      addButton.className = 'primary';
    }
    inlineInfo.textContent = infoText();
  }

  function increment() {
    if (readOnly) {
      say(TXT.loadErr);
      sound('err');
      return;
    }
    if (!ready || !tallies.length) {
      return;
    }
    tallies[selected].n++;
    say(TXT.tip);
    sound('tap');
    save();
    render();
  }

  function addTally() {
    if (readOnly || !ready) {
      return;
    }
    var name = nameInput.value.trim();
    if (!name) {
      say(TXT.invalid);
      sound('err');
      return;
    }
    if (tallies.length >= 8) {
      say(TXT.full);
      sound('err');
      return;
    }
    tallies.push({ name: name, n: 0 });
    selected = tallies.length - 1;
    nameInput.value = '';
    say(TXT.added);
    sound('ok');
    save();
    render();
  }

  function move(direction) {
    if (infoPage || !tallies.length) {
      return;
    }
    selected = (selected + direction + tallies.length) % tallies.length;
    render();
    var row = list.children[selected];
    if (row && row.scrollIntoView) {
      row.scrollIntoView({ block: 'nearest' });
    }
    sound('move');
  }

  function loadError(error) {
    readOnly = true;
    ready = true;
    var code = error && error.code;
    if (code === 'corrupt') {
      say(TXT.corrupt);
    } else if (code === 'readfail') {
      say(TXT.readfail);
    } else if (code === 'newer') {
      say(TXT.newer);
    } else {
      say(TXT.loadErr);
    }
    sound('err');
    render();
  }

  function migrateCount(oldCount) {
    tallies = [{ name: '1', n: oldCount }];
    selected = 0;
    save();
    // PAD.remove deletes the schema-0 key only after its value has been saved as schema 1.
    PAD.remove('count');
  }

  function start() {
    var metaPromise;
    if (PAD.saveInfo) {
      // PAD.saveInfo supplies the saved schema so newer data can be left untouched.
      metaPromise = PAD.saveInfo().catch(function () {
        return null;
      });
    } else {
      metaPromise = Promise.resolve(null);
    }
    metaPromise.then(function (meta) {
      info = meta;
      if (meta && typeof meta.schema === 'number' && meta.schema > 1) {
        readOnly = true;
        ready = true;
        say(TXT.schemaNew);
        render();
        return;
      }
      // PAD.load reads the current tally list; a rejection keeps the app read-only.
      PAD.load('tallies').then(function (saved) {
        if (saved !== null && !valid(saved)) {
          readOnly = true;
          ready = true;
          say(TXT.badData);
          render();
          return;
        }
        if (saved !== null) {
          tallies = saved.slice();
        }
        // PAD.load reads the legacy count so schema 0 can be migrated without losing it.
        PAD.load('count').then(function (oldCount) {
          ready = true;
          var schema = meta && meta.schema;
          if ((schema === 0 || schema == null) && oldCount !== null) {
            if (typeof oldCount !== 'number' || !isFinite(oldCount) || tallies.length) {
              readOnly = true;
              say(TXT.badData);
              render();
              return;
            }
            migrateCount(oldCount);
          } else if (oldCount !== null && saved === null) {
            readOnly = true;
            say(TXT.badData);
          }
          if (tallies.length) {
            selected = 0;
          }
          render();
        }).catch(loadError);
      }).catch(loadError);
    }).catch(function () {
      info = null;
      render();
    });
  }

  // No <form> submit here: apps run in a sandbox without allow-forms, so the browser drops
  // form submissions before any submit handler runs. The button and the Enter key call addTally directly.
  addButton.addEventListener('click', addTally);
  nameInput.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && !event.isComposing) {
      event.preventDefault();
      addTally();
    }
  });
  backButton.addEventListener('click', function () {
    infoPage = false;
    render();
    sound('move');
  });

  // PAD.on handles the chin pad and mapped keyboard keys for selection and confirmation.
  PAD.on('press', function (button) {
    if (infoPage) {
      if (button === 'a' || button === 'b') {
        infoPage = false;
        render();
        sound('move');
      }
      return;
    }
    if (button === 'up') {
      move(-1);
    } else if (button === 'down') {
      move(1);
    } else if (button === 'a') {
      if (document.activeElement === nameInput) {
        addTally();
      } else {
        increment();
      }
    } else if (button === 'b') {
      if (document.activeElement === nameInput) {
        nameInput.value = '';
        nameInput.blur();
        say('');
        sound('move');
      }
    } else if (button === 'start') {
      infoPage = true;
      refreshInfo();
      render();
      sound('move');
    }
  });

  say(TXT.tip);
  render();
  start();
})();
</script>
</body>
</html>
