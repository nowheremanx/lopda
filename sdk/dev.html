<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lo-PDA dev harness</title>
<!-- MIT License, see sdk/LICENSE. Serve the repo root with any static server, then open /sdk/dev.html -->
<style>
  :root { --ink:#1f2a14; --dark:#4a5a32; --mid:#7d8a58; --paper:#a3ad7e; --case:#262925; }
  body { margin:0; background:var(--case); color:#d9d2bf; font:14px/1.5 ui-monospace, Menlo, monospace; padding:16px; display:flex; gap:24px; flex-wrap:wrap; }
  .side { flex:1 1 280px; min-width:0; display:flex; flex-direction:column; gap:12px; }
  label, select, input, button { font:inherit; }
  select, input[type=text] { width:100%; box-sizing:border-box; padding:6px; background:#1b1d1a; color:#d9d2bf; border:1px solid #4a4f45; }
  button { padding:6px 12px; background:var(--paper); color:var(--ink); border:0; cursor:pointer; }
  .screen { width:360px; max-width:100%; height:560px; border:6px solid #11130f; border-radius:8px; background:var(--paper); }
  iframe { width:100%; height:100%; border:0; display:block; }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; background:#1b1d1a; padding:8px; min-height:3em; max-height:240px; overflow:auto; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .col { display:flex; flex-direction:column; gap:10px; align-items:center; }
  #pad { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:360px; }
  html { touch-action:manipulation; }
  #pad, #pad button { touch-action:none; }
  #pad button { min-width:52px; }
  #sense { display:flex; flex-direction:column; gap:8px; border:1px solid #4a4f45; padding:8px; }
  #tiltpad { position:relative; width:120px; height:120px; background:#1b1d1a; border:1px solid #4a4f45; touch-action:none; cursor:grab; flex:none; }
  #tiltpad::before, #tiltpad::after { content:""; position:absolute; background:#4a4f45; }
  #tiltpad::before { left:50%; top:0; bottom:0; width:1px; } #tiltpad::after { top:50%; left:0; right:0; height:1px; }
  #snapbox { display:flex; flex-direction:column; gap:8px; border:1px solid #4a4f45; padding:8px; }
  #snapcv { width:256px; max-width:100%; aspect-ratio:128/112; image-rendering:pixelated; background:#1b1d1a; display:block; }
  #tiltdot { position:absolute; width:16px; height:16px; margin:-8px 0 0 -8px; left:50%; top:50%; background:var(--paper); }
</style>
</head>
<body>
  <div class="col">
    <div class="screen"><iframe id="app" sandbox="allow-scripts" title="app"></iframe></div>
    <div id="pad" hidden>
      <button data-b="left">◀</button><button data-b="up">▲</button><button data-b="down">▼</button><button data-b="right">▶</button>
      <button data-b="select">SELECT</button><button data-b="start">START</button><button data-b="b">B</button><button data-b="a">A</button>
    </div>
  </div>
  <div class="side">
    <div>
      <label for="path">App folder (relative to repo root)</label>
      <input type="text" id="path" value="sdk/template">
    </div>
    <div class="row">
      <button id="load" type="button">Load</button>
      <button id="reload" type="button">Reload</button>
      <button id="wipe" type="button">Clear saved data</button>
    </div>
    <div class="row">
      <label for="lang">PAD.lang</label>
      <select id="lang" style="width:auto"><option value="zh">zh</option><option value="en">en</option><option value="">(none: older runtime)</option></select>
    </div>
    <div class="row">
      <label for="amb">Ambience</label>
      <select id="amb" style="width:auto"><option value="">(off)</option></select>
      <input type="range" id="amblevel" min="0" max="1" step="0.05" value="0.6" style="width:120px">
      <span id="amblv">0.60</span>
    </div>
    <div id="sense">
      <div>Sensors (PAD.motion, PAD.mic): <span id="sensestate">off</span></div>
      <div class="row">
        <div id="tiltpad" title="drag to tilt; let go to recentre"><div id="tiltdot"></div></div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <span id="tiltval">x 0 · y 0</span>
          <button id="shake" type="button">Shake</button>
          <label>Heading <input type="range" id="heading" min="0" max="359" value="0" style="width:120px"> <span id="headingv">0</span></label>
          <label><input type="checkbox" id="nocompass"> no compass (null)</label>
        </div>
      </div>
      <div class="row">
        <label>Mic level <input type="range" id="miclevel" min="0" max="1" step="0.03125" value="0" style="width:120px"> <span id="miclv">0</span></label>
        <label>Pitch (Hz, empty = null) <input type="text" id="pitch" value="" style="width:6em"></label>
      </div>
      <label><input type="checkbox" id="realmic"> use this computer's microphone</label>
    </div>
    <div id="snapbox">
      <div>Camera (PAD.camera.snap): <span id="snapstate">closed</span></div>
      <div class="row">
        <canvas id="snapcv" width="128" height="112"></canvas>
        <div style="display:flex;flex-direction:column;gap:6px">
          <button id="snapshoot" type="button" disabled>Shutter (A)</button>
          <button id="snapcancel" type="button" disabled>Cancel (B)</button>
          <label><input type="checkbox" id="realcam"> use this computer's camera</label>
        </div>
      </div>
      <video id="snapvideo" playsinline muted autoplay hidden></video>
    </div>
    <div class="row">
      <label for="notesans">PAD.notes.append answers</label>
      <select id="notesans" style="width:auto"><option value="saved">saved (the player pressed A)</option><option value="denied">denied (the player pressed B)</option></select>
    </div>
    <div id="filebox" hidden>
      <div id="filewhat"></div>
      <div class="row"><input type="file" id="filein"><button id="filecancel" type="button">Cancel</button></div>
    </div>
    <div id="wordbookbox" hidden>
      <div id="wordbookwhat"></div>
      <div class="row"><button id="wordbookyes" type="button">Allow</button><button id="wordbookno" type="button">Don't allow</button></div>
    </div>
    <div>Manifest</div><pre id="manifest"></pre>
    <div>PAD storage (this harness keeps it in localStorage)</div><pre id="store"></pre>
    <div>Errors and events</div><pre id="log"></pre>
  </div>
<script src="pad-shim.js"></script>
<!-- the runtime's sound chip, so music, custom sounds and ambience sound here as they do on the handheld -->
<script src="../runtime/chip.js"></script>
<!-- the runtime's StarDict reader and word list, so PAD.dict here answers from the same ECDICT as the handheld -->
<script src="../runtime/stardict.js"></script>
<script src="../runtime/wordlist.js"></script>
<!-- the runtime's sensor maths (quantizing, rate limits, level and pitch), so readings here look like the handheld's -->
<script src="../runtime/sensors.js"></script>
<!-- the runtime's rules for notes from apps (limits, the dialog's preview) and its speech (voices, limits) -->
<script src="../runtime/notetext.js"></script>
<script src="../runtime/speech.js"></script>
<!-- the runtime's viewfinder look (luma, the Bayer dither, exposure and contrast), so a snap here gives the handheld's tones -->
<script src="../runtime/finder.js"></script>
<script>
  var frame = document.getElementById("app"), html = "", appId = "dev", manifest = {};
  var log = function (s) { var p = document.getElementById("log"); p.textContent = (new Date().toLocaleTimeString() + "  " + s + "\n") + p.textContent; };
  var key = function () { return "lopda-dev:" + appId; };
  var readStore = function () { try { return JSON.parse(localStorage.getItem(key()) || "{}"); } catch (e) { return {}; } };
  var writeStore = function (s) { localStorage.setItem(key(), JSON.stringify(s)); showStore(); };
  var showStore = function () { document.getElementById("store").textContent = JSON.stringify(readStore(), null, 2); };
  /* PAD.dict (SPEC.md 6.7): the same wordlist.js source the handheld builds in runtime/apps/dict.js, over the same ECDICT
     files. words() reads only the 87 KB word list; the book loads on the first lookup and only once. No permission. */
  var SD = window.LopdaStarDict, WL = window.LopdaWordList;
  var fetchBytes = function (url) {
    return fetch(url).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); })
      .then(function (b) { return new Uint8Array(b); });
  };
  var dict = WL.source({
    words: function () {
      return fetchBytes("../runtime/vendor/ecdict/ecdict.words.gz").then(SD.gunzip)
        .then(function (b) { return new TextDecoder().decode(b); });
    },
    book: function () {
      var P = "../runtime/vendor/ecdict/ecdict";
      return Promise.all([
        fetch(P + ".ifo").then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); }),
        fetchBytes(P + ".idx"), fetchBytes(P + ".dict.dz"), fetchBytes(P + ".lemma.gz").then(SD.gunzip)
      ]).then(function (a) {
        var lemma = SD.parseLemma(new TextDecoder().decode(a[3]));
        return SD.open({ ifo: a[0], idx: a[1], dict: a[2] }).then(function (b) { return { book: b, lemma: lemma }; });
      });
    }
  });
  var dictLimit = null;   /* PAD.dict's 10 calls a second, like the handheld: a new one for every app start */

  function load() {
    runToken++;
    wbGranted = false; wbAsk = null;
    document.getElementById("wordbookbox").hidden = true;
    var base = document.getElementById("path").value.replace(/\/+$/, "");
    Promise.all([fetch("../" + base + "/manifest.json").then(function (r) { return r.json(); }),
                 fetch("../" + base + "/index.html").then(function (r) { return r.text(); })])
      .then(function (res) {
        var m = res[0]; html = res[1]; appId = m.id || "dev";
        /* empty framework blocks and data-src blocks are filled from sdk/ and the app's src/ folder,
           so you can edit and reload without running node tools/bundle-app.mjs */
        var filled = [], jobs = [];
        var fill = function (re, url, wrap, label) {
          var found = html.match(re);
          if (!found) return;
          jobs.push(fetch(url).then(function (r) { if (!r.ok) throw new Error(url + " not found"); return r.text(); }).then(function (text) {
            html = html.replace(found[0], function () { return wrap(text, found); });
            filled.push(label);
          }));
        };
        fill(/<script data-lo-3d="[^"]*">\s*<\/script>/, "lo-3d.js", function (lib) { return "<script data-lo-3d>\n" + lib + "<\/script>"; }, "lo-3d.js");
        fill(/<script data-lo-game="[^"]*">\s*<\/script>/, "lo-game.js", function (lib) { return "<script data-lo-game>\n" + lib + "<\/script>"; }, "lo-game.js");
        /* src/ blocks are always re-read, filled or not, so an edit shows on reload */
        var srcRe = /<script data-src="([^"]*)">[\s\S]*?<\/script>/g, sm, srcs = [];
        while ((sm = srcRe.exec(html))) srcs.push(sm[1]);
        srcs.forEach(function (p) {
          if (p.indexOf("src/") !== 0 || p.indexOf("..") >= 0 || !/\.js$/.test(p)) { log("data-src " + p + " is not allowed (src/...js only)"); return; }
          var esc = p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          fill(new RegExp('<script data-src="' + esc + '">[\\s\\S]*?<\\/script>'), "../" + base + "/" + p,
               function (code) { return '<script data-src="' + p + '">\n' + code + "<\/script>"; }, p);
        });
        return Promise.all(jobs).then(function () { return [m, html, filled]; });
      })
      .then(function (res) {
        var m = res[0]; html = res[1]; manifest = m;
        if (res[2].length) log("filled in: " + res[2].join(", "));
        document.getElementById("pad").hidden = m.buttons !== true;
        document.getElementById("manifest").textContent = JSON.stringify(m, null, 2);
        showStore(); run(); log("loaded " + base + " (" + html.length + " bytes)");
      })
      .catch(function (e) { log("load failed: " + e.message); });
  }
  /* Sound: the same chip and the same rules as the runtime (music and ambience wait for the first touch or key, stop when the
     app reloads, pause with the page). The master level is what an app gets at the handheld's default volume step. The named
     sounds play from chip.js's table too, as on the handheld. */
  var AC = window.AudioContext || window.webkitAudioContext, actx = null, master = null;
  function chipContext(make) {
    if (!actx && make && AC) {
      try { if (navigator.audioSession) navigator.audioSession.type = "ambient"; } catch (e) {}
      actx = new AC(); master = actx.createGain(); master.gain.value = 0.25; master.connect(actx.destination);
    }
    return actx;
  }
  var chip = window.LopdaChip && AC ? LopdaChip.host({
    context: chipContext,
    output: function () { return master; }
  }) : null;
  ["pointerdown", "touchend", "keydown"].forEach(function (t) { document.addEventListener(t, function () { if (chip) chip.unlock(); }, true); });
  document.addEventListener("visibilitychange", function () { if (!chip) return; if (document.hidden) chip.pause(); else chip.resume(); });
  /* like the runtime, a language change starts the app again */
  function run() {
    runToken++;
    if (chip) chip.stop();
    if (chip) document.getElementById("amb").value = "";
    senseStop("motion"); senseStop("mic"); speech.stop(); snapEnd(null);
    /* a word book answer still pending belongs to the frame that is going away: drop it rather than post into the next one */
    if (wbAsk) { wbAsk = null; document.getElementById("wordbookbox").hidden = true; }
    dictLimit = WL.limiter();
    var l = document.getElementById("lang").value, o = { music: !!chip, ambience: !!chip, sensors: true, notes: true, say: true, camera: true, dict: true };
    if (l) o.lang = l;
    frame.srcdoc = lopdaWrapApp(html, o);
  }
  document.getElementById("lang").onchange = function () { log("PAD.lang = " + (this.value || "undefined")); run(); };

  window.addEventListener("message", function (e) {
    if (e.source !== frame.contentWindow) return;
    var d = e.data; if (!d || !d.pad) return;
    var s = readStore();
    if (d.op === "load") frame.contentWindow.postMessage({ pad: 1, op: "loaded", i: d.i, v: d.k in s ? s[d.k] : null }, "*");
    else if (d.op === "save") { s[d.k] = d.v; writeStore(s); }
    else if (d.op === "remove") { delete s[d.k]; writeStore(s); }
    else if (d.op === "error") log("ERROR " + d.msg);
    else if (d.op === "exit") { runToken++; wbAsk = null; document.getElementById("wordbookbox").hidden = true; log("app asked to exit"); if (chip) chip.stop(); senseStop("motion"); senseStop("mic"); speech.stop(); snapEnd(null); frame.srcdoc = ""; }
    else if (d.op === "notes") notesOp(d);
    else if (d.op === "say") sayOp(d);
    else if (d.op === "sense") sense(d);
    else if (d.op === "snap") snapOp(d);
    else if (d.op === "dict") dictOp(d);
    else if (d.op === "sfx" && typeof d.name === "string") {
      log("sfx " + d.name);
      /* the ten named sounds, from the same chip.js table the handheld plays */
      if (chip && LopdaChip.named && LopdaChip.hasNamed(d.name)) {
        var ctx = chipContext(true);
        if (ctx) { if (ctx.state !== "running") try { ctx.resume(); } catch (x) {} LopdaChip.named(ctx, master, d.name); }
      }
    }
    else if (d.op === "sfx" && d.params) { log("sfx " + JSON.stringify(LopdaChip.sfxParams(d.params))); if (chip) chip.sfx(d.params); }
    else if (d.op === "music" && chip) {
      var r = chip.music(d);
      if (r && r.error) log("ERROR PAD.music: " + r.error);
      else if (r && r.dropped) log("ERROR " + r.dropped + " (this call was dropped)");
      else if (d.action === "play") { var st = chip.state(); log("music play" + (d.loop === false ? " once" : ", looping") + (st.waiting ? " (waits for a touch or key, as on the handheld)" : "")); }
      else log("music stop");
    }
    else if (d.op === "ambience" && chip) ambience(d, "");
    else if (d.op === "file") fileOp(d);
  });
  /* PAD.ambience from the app, or from the row on the right, which tries the presets by hand (it does what an app's call would) */
  function ambience(d, who) {
    var r = chip.ambience(d);
    if (r && r.error) { log("ERROR PAD.ambience: " + r.error); return; }
    if (r && r.held) { log(r.held); return; }
    var st = chip.state();
    /* the row on the right follows what plays */
    document.getElementById("amb").value = d.name || "";
    var a = LopdaChip.ambienceParams(d.name, d.level);
    if (a.name) { document.getElementById("amblevel").value = a.level; document.getElementById("amblv").textContent = a.level.toFixed(2); }
    log(who + "ambience " + (a.name ? a.name + " " + a.level.toFixed(2) : "off (fades out)") + (st.ambienceWaiting ? " (waits for a touch or key, as on the handheld)" : ""));
  }
  (function () {
    var sel = document.getElementById("amb"), lv = document.getElementById("amblevel"), shown = document.getElementById("amblv");
    if (!chip) { sel.disabled = lv.disabled = true; return; }
    LopdaChip.AMBIENCES.forEach(function (n) { var op = document.createElement("option"); op.value = op.textContent = n; sel.appendChild(op); });
    var go = function () { shown.textContent = (+lv.value).toFixed(2); ambience({ name: sel.value || null, level: +lv.value }, "(by hand) "); };
    sel.onchange = go; lv.onchange = go;
    lv.oninput = function () { shown.textContent = (+lv.value).toFixed(2); };
  })();
  /* PAD.notes.append. The handheld shows the player its own dialog (the app's name, the title, the first lines of the text)
     and writes on A; here the dialog's words go to the log and the call answers as the select on the right says. Nothing is
     stored. The limits and the permission are the runtime's (runtime/notetext.js). */
  function notesOp(d) {
    var NT = window.LopdaNoteText, reply = function (v) { frame.contentWindow.postMessage({ pad: 1, op: "noted", i: d.i, v: v }, "*"); };
    if ((manifest.permissions || []).indexOf("notes") < 0) { log('ERROR PAD.notes.append needs "permissions": ["notes"] in manifest.json'); reply("denied"); return; }
    var bad = NT.appCheck(d.title, d.text);
    if (bad) { log("ERROR PAD.notes.append: " + bad + " (denied)"); reply("denied"); return; }
    var v = document.getElementById("notesans").value === "saved" ? "saved" : "denied";
    log("notes.append dialog: 「" + (manifest.name || appId) + "」要写进记事本「" + d.title.trim() + "」：\n" + NT.preview(d.text) + "\n  -> " + v);
    reply(v);
  }
  /* PAD.say: this computer's voices when the browser has them, at the handheld's default volume step; otherwise the log only */
  var speech = window.LopdaSpeech.host({ window: window, volume: function () { return 0.42; } });
  document.addEventListener("visibilitychange", function () { if (document.hidden) speech.stop(); });
  function sayOp(d) {
    log("say (" + d.lang + "): " + d.text + (speech.synth() ? "" : "  [no speechSynthesis here: logged only]"));
    speech.say(appId, d.text, d.lang).then(function (v) {
      if (v === "unavailable") log("say -> unavailable" + (!speech.synth() ? "" : !speech.voice(d.lang) ? " (no " + d.lang + " voice on this computer)" : " (once a second at most)"));
      else log("say -> " + v);
      frame.contentWindow.postMessage({ pad: 1, op: "said", i: d.i, v: v }, "*");
    });
  }
  /* PAD.dict: the handheld answers from the built-in ECDICT; here the same files under ../runtime/vendor/ecdict/ stand in and
     the answer goes to the log instead of the screen. words() and lookup() need no permission. A bad query answers {error}
     (the app's promise rejects); a file that cannot be read and the 10-calls-a-second limit answer null, as on the handheld.
     The player's word book is localStorage "lopda-dev-wordbook" (an array, newest first). The first add or remove shows the
     permission box below once, as the handheld shows its own dialog once per app; reading needs that answer too. */
  var WB_KEY = "lopda-dev-wordbook", wbGranted = false, wbAsk = null;
  var runToken = 0;   /* a new run, a new load or an exit makes every answer still in flight stale */
  function readBook() {
    try { var a = JSON.parse(localStorage.getItem(WB_KEY) || "[]"); return Array.isArray(a) ? a.filter(function (w) { return typeof w === "string"; }) : []; }
    catch (e) { return []; }
  }
  function writeBook(a) { localStorage.setItem(WB_KEY, JSON.stringify(a)); }
  function wbReply(d, token, v) {
    if (token !== runToken) return;
    frame.contentWindow.postMessage({ pad: 1, op: "dicted", i: d.i, v: v }, "*");
  }
  function wbHas(book, w) {
    var k = w.toLowerCase();
    return book.some(function (x) { return x.toLowerCase() === k; });
  }
  /* the same book the runtime keeps: one entry per word, headwords only, ignoring case */
  function wbApply(d, token, head) {
    if (token !== runToken) return;
    var book = readBook();
    if (d.kind === "add") {
      if (!wbHas(book, head)) {
        if (book.length >= 2000) { log("dict.add " + head + " -> full"); wbReply(d, token, "full"); return; }
        book.unshift(head); writeBook(book);
      }
      log("dict.add " + head + " -> saved"); wbReply(d, token, "saved"); return;
    }
    var k = head.toLowerCase();
    writeBook(book.filter(function (x) { return x.toLowerCase() !== k; }));
    log("dict.remove " + head + " -> saved"); wbReply(d, token, "saved");
  }
  /* one permission box for the first add or remove, as the handheld shows its own dialog once per app */
  function wbAllow(d, token, head) {
    if (token !== runToken) return;
    if (wbGranted) { wbApply(d, token, head); return; }
    if (wbAsk) { log("dict." + d.kind + " -> null (the word book dialog is open)"); wbReply(d, token, null); return; }
    wbAsk = { d: d, token: token, head: head };
    document.getElementById("wordbookwhat").textContent = "「" + (manifest.name || appId) + "」想把单词加入你的生词本 / This app wants to use your word book: " + (d.kind === "remove" ? "remove " : "add ") + head;
    document.getElementById("wordbookbox").hidden = false;
    log("word book dialog: Allow or Don't allow on the right");
  }
  document.getElementById("wordbookyes").onclick = function () {
    var a = wbAsk; if (!a || a.token !== runToken) return;
    wbAsk = null; document.getElementById("wordbookbox").hidden = true; wbGranted = true;
    log("word book allowed"); wbApply(a.d, a.token, a.head);
  };
  document.getElementById("wordbookno").onclick = function () {
    var a = wbAsk; if (!a || a.token !== runToken) return;
    wbAsk = null; document.getElementById("wordbookbox").hidden = true;
    log("word book not allowed"); wbReply(a.d, a.token, "denied");
  };
  /* an add looks the word up first, as the runtime does: a word ECDICT does not know never opens the box */
  function wbAdd(d, token) {
    var w = d.word.toLowerCase();
    dict.lookup(w).then(function (e) {
      if (token !== runToken) return;
      if (!e || !e.word) { log("dict.add " + w + " -> null (not in the dictionary)"); wbReply(d, token, null); return; }
      wbAllow(d, token, e.word);
    }, function () {
      if (token !== runToken) return;
      log("dict.add " + w + " -> null (the dictionary could not be read)"); wbReply(d, token, null);
    });
  }
  function dictOp(d) {
    var token = runToken;
    var reply = function (v, error) {
      if (token !== runToken) return;
      frame.contentWindow.postMessage(error ? { pad: 1, op: "dicted", i: d.i, error: error } : { pad: 1, op: "dicted", i: d.i, v: v }, "*");
    };
    var book = d.kind === "inBook" || d.kind === "add" || d.kind === "remove";
    if (d.kind !== "words" && d.kind !== "lookup" && !book) { reply(null); return; }
    if (!dictLimit || !dictLimit(Date.now())) { log("dict." + d.kind + " -> null (over 10 a second)"); reply(null); return; }
    if (book) {
      var method = d.kind === "inBook" ? "inBook" : d.kind === "add" ? "addWord" : "removeWord";
      if ((manifest.permissions || []).indexOf("wordbook") < 0) {
        log('ERROR PAD.dict.' + method + ' needs "permissions": ["wordbook"] in manifest.json');
        reply(d.kind === "inBook" ? null : "denied"); return;
      }
      if (d.kind === "inBook") {
        var ok = Array.isArray(d.words) && d.words.length >= 1 && d.words.length <= 20 &&
          d.words.every(function (w) { return typeof w === "string" && /^[A-Za-z]{1,32}$/.test(w); });
        if (!ok) { reply(null); return; }
        if (!wbGranted) { log("dict.inBook -> null (no grant yet)"); reply(null); return; }
        var stored = readBook(), out = d.words.map(function (w) { return wbHas(stored, w); });
        log("dict.inBook " + JSON.stringify(d.words) + " -> " + JSON.stringify(out));
        reply(out); return;
      }
      if (typeof d.word !== "string" || !/^[A-Za-z]{1,32}$/.test(d.word)) { reply(null); return; }
      if (d.kind === "add") wbAdd(d, token);
      else wbAllow(d, token, d.word);
      return;
    }
    var p = d.kind === "words" ? dict.words(d.q) : dict.lookup(d.word);
    p.then(function (v) {
      if (v && v.error) { log("ERROR PAD.dict." + d.kind + ": " + v.error); reply(null, v.error); return; }
      if (d.kind === "words") log("dict.words " + JSON.stringify(d.q) + " -> " + (v ? v.words.length + " words" + (v.more ? " (more)" : "") : "null"));
      else log("dict.lookup " + d.word + " -> " + (v ? v.word : "null"));
      reply(v == null ? null : v);
    }, function (e) {
      log("dict." + d.kind + " -> null (" + String((e && e.message) || e) + ")");
      reply(null);
    });
  }
  /* PAD.exportFile / importFile. The handheld asks the player on its own dialog first; here an export
     downloads straight away and an import waits for the file input on the right. */
  var FILE_MAX = 2 * 1024 * 1024, pendingImport = null;
  var filed = function (i, v, error) { frame.contentWindow.postMessage(error ? { pad: 1, op: "filed", i: i, error: error } : { pad: 1, op: "filed", i: i, v: v }, "*"); };
  function fileOp(d) {
    if ((manifest.permissions || []).indexOf("files") < 0) {
      log('ERROR PAD.' + (d.kind === "export" ? "exportFile" : "importFile") + ' needs "permissions": ["files"] in manifest.json');
      filed(d.i, null, "files permission not granted"); return;
    }
    if (d.kind === "export") {
      var blob;
      var m = /^data:([^,;]*)(;base64)?,/.exec(d.data);
      if (m && m[2]) { var bin = atob(d.data.slice(m[0].length)), u8 = new Uint8Array(bin.length); for (var k = 0; k < bin.length; k++) u8[k] = bin.charCodeAt(k); blob = new Blob([u8], { type: d.type || m[1] }); }
      else if (m) blob = new Blob([decodeURIComponent(d.data.slice(m[0].length))], { type: d.type || m[1] });
      else blob = new Blob([d.data], { type: d.type || "text/plain" });
      if (blob.size > FILE_MAX) { filed(d.i, null, "file too large"); return; }
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = d.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      log("exportFile " + d.name + " (" + blob.size + " bytes, " + blob.type + ") downloaded");
      filed(d.i, "saved"); return;
    }
    if (pendingImport) filed(pendingImport.i, null);
    pendingImport = d;
    var input = document.getElementById("filein");
    input.value = ""; input.accept = (d.accept || []).join(",");
    document.getElementById("filewhat").textContent = "The app asks for a file" + (input.accept ? " (" + input.accept + ")" : "") + ":";
    document.getElementById("filebox").hidden = false;
    log("importFile: choose a file on the right, or Cancel");
  }
  function endImport(v) { var d = pendingImport; pendingImport = null; document.getElementById("filebox").hidden = true; if (d) filed(d.i, v); }
  document.getElementById("filecancel").onclick = function () { log("importFile cancelled"); endImport(null); };
  document.getElementById("filein").onchange = function () {
    var f = this.files && this.files[0]; if (!f || !pendingImport) return;
    if (f.size > FILE_MAX) { log("importFile: " + f.name + " is over 2 MB"); endImport(null); return; }
    var text = /^text\/|^application\/json$/.test(f.type), r = new FileReader();
    r.onload = function () { log("importFile " + f.name + " (" + f.size + " bytes)"); endImport({ name: f.name, type: f.type, data: r.result }); };
    r.onerror = function () { log("importFile: could not read " + f.name); endImport(null); };
    if (text) r.readAsText(f); else r.readAsDataURL(f);
  };
  /* PAD.motion / PAD.mic. The handheld asks the player on its own dialog first (and the phone may ask too); here start()
     answers "on" at once when the manifest declares the permission. The controls above stand in for the phone: the square
     is the tilt (drag it, let go and it recentres), Shake sends one shake, the slider is the compass, and the mic level and
     pitch are sent as they are, or measured from this computer's microphone. Same steps and rates as the runtime. */
  var LS = window.LopdaSensors, sensing = { motion: false, mic: false }, raw = { x: 0, y: 0, y0: 0 };
  var sendTilt = LS.limiter(LS.TILT_HZ, Date.now, setTimeout), sendSound = LS.limiter(LS.SOUND_HZ, Date.now, setTimeout);
  var micTimer = null, real = null;
  var post = function (m) { m.pad = 1; frame.contentWindow.postMessage(m, "*"); };
  function senseState() { document.getElementById("sensestate").textContent = (sensing.motion ? "motion on" : "motion off") + ", " + (sensing.mic ? "mic on" : "mic off"); }
  function tilt() {
    var x = LS.quantize(raw.x), y = LS.quantize(raw.y - raw.y0);
    var h = document.getElementById("nocompass").checked ? null : LS.heading(+document.getElementById("heading").value);
    document.getElementById("tiltval").textContent = "x " + x + " · y " + y + " · heading " + h;
    if (sensing.motion) sendTilt(function (v) { post({ op: "tilt", x: v.x, y: v.y, heading: v.heading }); }, { x: x, y: y, heading: h });
  }
  function sound() {
    var v;
    if (real) { real.an.getFloatTimeDomainData(real.buf); v = { level: LS.level(real.buf), pitch: LS.pitch(real.buf, real.ctx.sampleRate) }; document.getElementById("miclv").textContent = v.level + " · " + v.pitch; }
    else {
      var p = parseInt(document.getElementById("pitch").value, 10);
      v = { level: Math.round(+document.getElementById("miclevel").value * 32) / 32, pitch: p >= 50 && p <= 1500 ? p : null };
    }
    sendSound(function (x) { post({ op: "sound", level: x.level, pitch: x.pitch }); }, v);
  }
  function stopReal() { if (!real) return; real.stream.getTracks().forEach(function (t) { t.stop(); }); try { real.ctx.close(); } catch (e) {} real = null; }
  function startReal() {
    if (real || !sensing.mic || !document.getElementById("realmic").checked) return;
    if (!navigator.mediaDevices || !AC) { log("this browser has no microphone access"); return; }
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }).then(function (stream) {
      if (!sensing.mic || !document.getElementById("realmic").checked) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      var ctx = new AC(), an = ctx.createAnalyser(); an.fftSize = 2048;
      ctx.createMediaStreamSource(stream).connect(an);
      real = { stream: stream, ctx: ctx, an: an, buf: new Float32Array(2048) };
      log("listening to this computer's microphone");
    }, function (e) { log("microphone: " + e.name); document.getElementById("realmic").checked = false; });
  }
  function senseStop(kind) {
    if (!sensing[kind]) return;
    sensing[kind] = false;
    if (kind === "mic") { clearInterval(micTimer); micTimer = null; stopReal(); }
    sendTilt.reset(); sendSound.reset(); senseState();
  }
  function sense(d) {
    var kind = d.kind === "motion" || d.kind === "mic" ? d.kind : null, name = "PAD." + kind;
    if (!kind) return;
    if (d.action === "stop") { log(name + ".stop()"); senseStop(kind); return; }
    if (d.action === "zero") { log(name + ".zero()"); if (sensing.motion) { raw.y0 = raw.y; tilt(); } return; }
    if (d.action !== "start") return;
    var v = "on";
    if ((manifest.permissions || []).indexOf(kind) < 0) { log("ERROR " + name + '.start() needs "permissions": ["' + kind + '"] in manifest.json'); v = "denied"; }
    log(name + ".start() -> " + v);
    frame.contentWindow.postMessage({ pad: 1, op: "sensed", i: d.i, v: v }, "*");
    if (v !== "on" || sensing[kind]) return;
    sensing[kind] = true; senseState();
    if (kind === "motion") { raw.y0 = raw.y; sendTilt.reset(); tilt(); }
    else { sendSound.reset(); micTimer = setInterval(sound, 1000 / LS.SOUND_HZ); startReal(); }
  }
  (function () {
    var pad = document.getElementById("tiltpad"), dot = document.getElementById("tiltdot"), id = null;
    var place = function () { dot.style.left = (50 + raw.x * 50) + "%"; dot.style.top = (50 + raw.y * 50) + "%"; tilt(); };
    var aim = function (e) {
      var r = pad.getBoundingClientRect();
      raw.x = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width) * 2 - 1));
      raw.y = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height) * 2 - 1));
      place();
    };
    pad.addEventListener("pointerdown", function (e) { id = e.pointerId; try { pad.setPointerCapture(id); } catch (x) {} aim(e); });
    pad.addEventListener("pointermove", function (e) { if (e.pointerId === id) aim(e); });
    ["pointerup", "pointercancel"].forEach(function (t) { pad.addEventListener(t, function (e) { if (e.pointerId !== id) return; id = null; raw.x = 0; raw.y = 0; place(); }); });
    document.getElementById("shake").onclick = function () { if (sensing.motion) { post({ op: "shake" }); log("shake"); } else log("shake (motion is off: not sent)"); };
    document.getElementById("heading").oninput = function () { document.getElementById("headingv").textContent = this.value; tilt(); };
    document.getElementById("nocompass").onchange = tilt;
    document.getElementById("miclevel").oninput = function () { document.getElementById("miclv").textContent = this.value; };
    document.getElementById("realmic").onchange = function () { if (this.checked) startReal(); else stopReal(); };
    senseState();
  })();
  /* PAD.camera.snap. The handheld asks the player once on its own dialog, then opens its own viewfinder over the app for every
     snap; here the viewfinder is the panel on the right: a moving test pattern (or this computer's camera, if ticked) dithered
     with the runtime's own finder.js. Shutter (or A) answers {w, h, px}, Cancel (or B) answers null. */
  var FINDER = window.LopdaFinder, snapping = null, snapGrab = null;
  var snapCv = document.getElementById("snapcv"), snapCtx = snapCv.getContext("2d");
  function snapState(t) { document.getElementById("snapstate").textContent = t; }
  /* luma 0-1 for a test card: a grey ramp, bars, and a disc that drifts, so the finder looks alive */
  function pattern(w, h, t) {
    var lum = new Float32Array(w * h), cx = w * (0.5 + 0.3 * Math.sin(t / 900)), cy = h * 0.45, r = h * 0.2;
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var v = y < h * 0.7 ? x / (w - 1) : (Math.floor(x / (w / 8)) % 2 ? 0.85 : 0.15);
      var dx = x - cx, dy = y - cy;
      if (dx * dx + dy * dy < r * r) v = 1 - v * 0.6;
      lum[y * w + x] = v;
    }
    return lum;
  }
  function snapFrame() {
    var s = snapping, v = document.getElementById("snapvideo");
    var lum = s.stream && v.videoWidth ? snapGrab(v, v.videoWidth, v.videoHeight, s.w, s.h, false) : pattern(s.w, s.h, Date.now());
    return FINDER.ditherLuma(lum, s.w, s.h, 0, 0);
  }
  function snapDraw() {
    if (!snapping) return;
    var px = snapFrame(), img = snapCtx.createImageData(snapping.w, snapping.h), T = [[31, 42, 20], [74, 90, 50], [125, 138, 88], [163, 173, 126]];
    for (var i = 0; i < px.length; i++) { var c = T[px[i]]; img.data[i * 4] = c[0]; img.data[i * 4 + 1] = c[1]; img.data[i * 4 + 2] = c[2]; img.data[i * 4 + 3] = 255; }
    snapCtx.putImageData(img, 0, 0);
  }
  function snapCamera() {
    if (!snapping || snapping.stream || !document.getElementById("realcam").checked) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { log("this browser has no camera access: the test pattern stays"); return; }
    var s = snapping;
    navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(function (stream) {
      if (snapping !== s) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      s.stream = stream; var v = document.getElementById("snapvideo"); v.srcObject = stream; v.play().catch(function () {});
      if (!snapGrab) snapGrab = FINDER.grabber();
    }, function (e) { log("camera: " + e.name + " (the test pattern stays)"); document.getElementById("realcam").checked = false; });
  }
  function snapEnd(v) {
    var s = snapping; if (!s) return;
    snapping = null; clearInterval(s.timer);
    if (s.stream) s.stream.getTracks().forEach(function (t) { t.stop(); });
    document.getElementById("snapvideo").srcObject = null;
    document.getElementById("snapshoot").disabled = document.getElementById("snapcancel").disabled = true;
    snapState("closed");
    log("camera.snap -> " + (v ? "{w: " + v.w + ", h: " + v.h + ", px: Uint8Array(" + v.px.length + ")}" : "null"));
    if (v) frame.contentWindow.postMessage({ pad: 1, op: "snapped", i: s.i, v: v }, "*", [v.px.buffer]);
    else frame.contentWindow.postMessage({ pad: 1, op: "snapped", i: s.i, v: null }, "*");
  }
  function snapOp(d) {
    var reply = function (v) { frame.contentWindow.postMessage({ pad: 1, op: "snapped", i: d.i, v: v }, "*"); };
    if ((manifest.permissions || []).indexOf("camera") < 0) { log('ERROR PAD.camera.snap needs "permissions": ["camera"] in manifest.json'); reply(null); return; }
    if (snapping) { log("camera.snap: one is open already -> null"); reply(null); return; }
    var size = FINDER.SIZES[d.size] || FINDER.SIZES.small;
    snapping = { i: d.i, w: size.w, h: size.h, stream: null, timer: setInterval(snapDraw, 80) };
    snapCv.width = size.w; snapCv.height = size.h;
    document.getElementById("snapshoot").disabled = document.getElementById("snapcancel").disabled = false;
    snapState("open, " + size.w + "x" + size.h + ": Shutter (A) or Cancel (B)");
    log("camera.snap(" + d.size + "): the handheld asks once, then opens its viewfinder; here, the panel on the right");
    snapDraw(); snapCamera();
  }
  document.getElementById("snapshoot").onclick = function () { if (snapping) { var s = snapping; snapEnd({ w: s.w, h: s.h, px: snapFrame() }); } };
  document.getElementById("snapcancel").onclick = function () { snapEnd(null); };
  document.getElementById("realcam").onchange = function () {
    if (this.checked) snapCamera();
    else if (snapping && snapping.stream) { snapping.stream.getTracks().forEach(function (t) { t.stop(); }); snapping.stream = null; }
  };
  /* chin buttons: on-screen pad plus keyboard while the harness has focus. While the viewfinder is open, A shoots and B cancels,
     and nothing reaches the app, as on the handheld */
  var press = function (b, down) {
    if (snapping) { if (down && b === "a") document.getElementById("snapshoot").onclick(); else if (down && b === "b") snapEnd(null); return; }
    frame.contentWindow.postMessage({ pad: 1, op: "button", b: b, down: down }, "*");
  };
  Array.prototype.forEach.call(document.querySelectorAll("#pad button"), function (el) {
    var b = el.getAttribute("data-b");
    el.addEventListener("pointerdown", function (e) { e.preventDefault(); press(b, true); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (t) { el.addEventListener(t, function () { press(b, false); }); });
  });
  /* iOS Safari zooms on a double tap between keys (user-scalable=no is ignored); the pad needs no clicks */
  document.getElementById("pad").addEventListener("touchend", function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
  var KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", x: "a", z: "b", Enter: "start", Shift: "select" };
  document.addEventListener("keydown", function (e) { var b = KEYS[e.key]; if (b && e.target.nodeName !== "INPUT" && !e.repeat) { e.preventDefault(); press(b, true); } });
  document.addEventListener("keyup", function (e) { var b = KEYS[e.key]; if (b) press(b, false); });
  document.getElementById("load").onclick = load;
  document.getElementById("reload").onclick = run;
  document.getElementById("wipe").onclick = function () { localStorage.removeItem(key()); showStore(); log("cleared"); };
  var q = new URLSearchParams(location.search).get("app"); if (q) document.getElementById("path").value = q;
  var ql = new URLSearchParams(location.search).get("lang");
  document.getElementById("lang").value = ql != null ? ql : (/^zh/i.test(navigator.language) ? "zh" : "en");
  load();
</script>
</body>
</html>
