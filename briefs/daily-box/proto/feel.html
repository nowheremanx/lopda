<title>推箱手感样机</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* layout: one column, the handheld on top, the tuning drawer below */
:root{--case:#2b3320;--case2:#3a4429;--ink:#1f2a14;--dark:#4a5a32;--mid:#7d8a58;--paper:#a3ad7e;--label:#c9cfae;
--pix:"DotGothic16","PingFang SC","Noto Sans SC",sans-serif;color-scheme:dark}
html,body{background:var(--case);color:var(--label)}
body{font:15px/1.5 var(--pix);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:20px;margin:0;font-weight:400;letter-spacing:.04em}
.sub{margin:0;color:var(--mid);font-size:13px}
.lcd{background:var(--paper);padding:10px;border:4px solid var(--case2);border-radius:6px 6px 24px 6px;display:flex;justify-content:center}
canvas{image-rendering:pixelated;display:block;max-width:100%}
.pad{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px)}
.k{background:var(--ink);color:var(--label);border:0;font:inherit;font-size:18px;touch-action:none;-webkit-tap-highlight-color:transparent}
.k.on{background:var(--dark)}
.dpad .k{border-radius:6px}
.ab{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.ab .k{width:72px;height:44px;border-radius:22px;font-size:14px}
.ab .k.round{width:60px;height:60px;border-radius:50%;font-size:16px}
details{background:var(--case2);border-radius:6px;padding:10px 14px}
summary{cursor:pointer}
.row{display:grid;grid-template-columns:7.5em 1fr 4.2em;gap:8px;align-items:center;font-size:13px}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--mid)}
.tune{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.note{font-size:13px;color:var(--label);margin:0}
.note b{color:var(--paper);font-weight:400}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button{background:var(--ink);color:var(--label);border:0;border-radius:4px;padding:8px 12px;font:inherit;font-size:13px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
</style>
<main>
  <h1>推箱手感样机</h1>
  <p class="sub">测试场地，不是正式关卡。按住方向键试一试：一格一格走，推完一箱会停一下，箱子到位或推进死角后要松手再按。</p>
  <div class="lcd"><canvas id="lcd" width="160" height="144"></canvas></div>
  <div class="pad">
    <div class="dpad">
      <span></span><button class="k" id="k-up" data-d="up" aria-label="上">▲</button><span></span>
      <button class="k" id="k-left" data-d="left" aria-label="左">◀</button><span></span><button class="k" id="k-right" data-d="right" aria-label="右">▶</button>
      <span></span><button class="k" id="k-down" data-d="down" aria-label="下">▼</button><span></span>
    </div>
    <div class="ab">
      <button class="k round" id="k-b" aria-label="撤销">B 撤销</button>
      <button class="k" id="k-sel" aria-label="重来">重来</button>
      <button class="k" id="k-snd" aria-label="声音">声音 开</button>
    </div>
  </div>
  <details id="tune-box">
    <summary>调手感（数值）</summary>
    <div class="tune" id="tune"></div>
    <div class="btns" style="margin-top:10px"><button id="reset-tune">恢复默认</button></div>
  </details>
  <p class="note">键盘：方向键走，Z 或退格撤销，R 重来。<b>默认值</b>：走一格 120 毫秒；推一格 230 毫秒（先 50 毫秒顶住，再 180 毫秒慢起慢停）；按住 220 毫秒后开始连走；连推之间多停 150 毫秒；动画中按的键记住最后一个。</p>
</main>

var AC=null,snd=true;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state=="suspended")AC.resume();return AC;}
function tone(f,ms,type,vol,f2){var a=ac();if(!a||!snd)return;var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type||"square";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.linearRampToValueAtTime(f2,t+ms/1000);
 g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+ms/1000);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+ms/1000+.02);}
function noise(ms,vol,delay){var a=ac();if(!a||!snd)return;var n=a.sampleRate*ms/1000|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
 var s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type="lowpass";f.frequency.value=700;g.gain.value=vol;s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+(delay||0));}

 if(k=="goal"){setTimeout(function(){tone(660,60);setTimeout(function(){tone(990,90);},70);},P.brace+P.push-40);} if(k=="dead")setTimeout(function(){tone(150,140,"triangle",.08,90);},P.brace+P.push-40);
