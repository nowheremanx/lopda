/* ---- the sensor: one way to play, never the only one (SPEC.md 4 and 6.4) ---- */
var HAS_MOTION = typeof PAD !== "undefined" && !!PAD.motion;
var mode = HAS_MOTION ? "tilt" : "keys";   /* "tilt": the ball follows the handheld, and the D-pad still pushes */
var tilt = { x: 0, y: 0 }, live = false, wanted = false, asking = false;
var note = "", noteUntil = 0;
var shook = false;

function say(text, sec) { note = text; noteUntil = game.time + (sec || 3); }
function sensorOn() {
  if (mode !== "tilt" || !HAS_MOTION) return;
  wanted = true; asking = true;
  PAD.motion.start().then(function (r) {
    asking = false;
    if (!wanted) { PAD.motion.stop(); return; }        /* paused while the player was being asked */
    if (r === "on") { live = true; return; }
    mode = "keys";                                      /* for now: the player can switch back, and start() asks again */
    say(r === "none" ? T({ zh: "没有倾斜感应：用方向键", en: "No tilt: use the D-pad" })
                     : T({ zh: "倾斜未允许：用方向键", en: "Tilt off: use the D-pad" }), 4);
  });
}
function sensorOff() {
  wanted = false; live = false; tilt.x = tilt.y = 0;
  if (HAS_MOTION) PAD.motion.stop();
}
if (HAS_MOTION) {
  PAD.on("tilt", function (t) { if (wanted) { tilt.x = t.x; tilt.y = t.y; } });   /* the first reading can come before start() answers */
  PAD.on("shake", function () { if (live) shook = true; });
}

/* ---- saving: the furthest level reached, and the way of playing ---- */
var best = 0;
game.load("best").then(function (v) { if (typeof v === "number" && v > best) best = Math.min(v, LEVELS.length - 1); if (sel === 0) sel = best; });
game.load("mode").then(function (v) { if (v === "keys" || (v === "tilt" && HAS_MOTION)) mode = v; });

/* ---- the maze ---- */
var M, level = 0, ball, S0, G0, state, stateT, lastBump = 0;
function at(tx, ty) { return tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS ? "#" : M[ty][tx]; }
function find(ch) { for (var y = 0; y < ROWS; y++) { var x = M[y].indexOf(ch); if (x >= 0) return { x: x * TILE + 4, y: HUD + y * TILE + 4 }; } return null; }

/* the bonus room: holes anywhere but near the start, the goal and on top of the ball, always with a way through */
function shuffleHoles(n, avoid) {
  var base = LEVELS[level].map, tries = 0;
  do {
    M = base.map(function (r) { return r.split(""); });
    for (var k = 0; k < n; k++) {
      var tx = 1 + Math.floor(Math.random() * (COLS - 2)), ty = 1 + Math.floor(Math.random() * (ROWS - 2));
      if (M[ty][tx] !== "." || near(tx, ty, S0) || near(tx, ty, G0) || (avoid && near(tx, ty, avoid))) { k--; if (++tries > 2000) break; continue; }
      M[ty][tx] = "O";
    }
    M = M.map(function (r) { return r.join(""); });
  } while (!reachable() && ++tries < 4000);
  function near(tx, ty, p) { return Math.abs(tx * TILE + 4 - p.x) < 20 && Math.abs(HUD + ty * TILE + 4 - p.y) < 20; }
}
function reachable() {
  var s = [[(S0.x - 4) / TILE, (S0.y - HUD - 4) / TILE]], seen = {};
  while (s.length) {
    var c = s.pop(), k = c[0] + "," + c[1], ch = at(c[0], c[1]);
    if (seen[k] || ch === "#" || ch === "O") continue;
    seen[k] = 1; if (ch === "G") return true;
    s.push([c[0] + 1, c[1]], [c[0] - 1, c[1]], [c[0], c[1] + 1], [c[0], c[1] - 1]);
  }
  return false;
}

function loadLevel(n) {
  level = n; M = LEVELS[n].map.slice();
  S0 = find("S"); G0 = find("G");
  if (LEVELS[n].holes) shuffleHoles(LEVELS[n].holes);
  placeBall();
}
function placeBall() { ball = { x: S0.x, y: S0.y, vx: 0, vy: 0, r: R }; state = "roll"; stateT = 0; }

/* a hole's pit, inset on the sides that are not another hole so a row of holes is one trench */
function pit(tx, ty) {
  var i = 1.5;
  return { l: tx * TILE + (at(tx - 1, ty) === "O" ? 0 : i), r: (tx + 1) * TILE - (at(tx + 1, ty) === "O" ? 0 : i),
           t: HUD + ty * TILE + (at(tx, ty - 1) === "O" ? 0 : i), b: HUD + (ty + 1) * TILE - (at(tx, ty + 1) === "O" ? 0 : i) };
}
function wallHit(x, y) {
  for (var ty = Math.floor((y - R - HUD) / TILE); ty <= Math.floor((y + R - 0.01 - HUD) / TILE); ty++)
    for (var tx = Math.floor((x - R) / TILE); tx <= Math.floor((x + R - 0.01) / TILE); tx++)
      if (at(tx, ty) === "#") return { x: tx, y: ty };
  return null;
}
function bump(v) {
  if (Math.abs(v) > 45 && game.time - lastBump > 0.12) {
    lastBump = game.time;
    game.sfx({ wave: "noise", from: 1800, to: 900, ms: 30, attack: 1, decay: 28, vol: Math.min(0.5, Math.abs(v) / 260) });
  }
}

function roll(dt) {
  var ax = 0, ay = 0;
  if (live) { ax += tilt.x * TILT_ACC; ay -= tilt.y * TILT_ACC; }   /* top edge lowered (y > 0): the ball rolls up the screen */
  if (game.btn("left")) ax -= KEY_ACC; if (game.btn("right")) ax += KEY_ACC;
  if (game.btn("up")) ay -= KEY_ACC; if (game.btn("down")) ay += KEY_ACC;
  var p = game.pointer;
  if (p.down && p.y >= HUD && p.y < FOOT) {             /* touch: the ball is pulled toward the finger */
    var dx = p.x - ball.x, dy = p.y - ball.y, d = Math.sqrt(dx * dx + dy * dy);
    if (d > 3) { ax += dx / d * KEY_ACC; ay += dy / d * KEY_ACC; }
  }
  ball.vx += ax * dt; ball.vy += ay * dt;
  ball.vx -= ball.vx * DRAG * dt; ball.vy -= ball.vy * DRAG * dt;
  var sp = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
  if (sp > MAX_V) { ball.vx *= MAX_V / sp; ball.vy *= MAX_V / sp; }
  if (!ax && !ay && sp < 3) { ball.vx = ball.vy = 0; }   /* a ball at rest stays at rest */

  ball.x += ball.vx * dt;
  var w = wallHit(ball.x, ball.y);
  if (w) { bump(ball.vx); ball.x = ball.vx > 0 ? w.x * TILE - R : (w.x + 1) * TILE + R; ball.vx = -ball.vx * 0.3; }
  ball.y += ball.vy * dt;
  w = wallHit(ball.x, ball.y);
  if (w) { bump(ball.vy); ball.y = ball.vy > 0 ? HUD + w.y * TILE - R : HUD + (w.y + 1) * TILE + R; ball.vy = -ball.vy * 0.3; }

  var tx = Math.floor(ball.x / TILE), ty = Math.floor((ball.y - HUD) / TILE);
  if (at(tx, ty) === "O") {
    var q = pit(tx, ty);
    if (ball.x > q.l && ball.x < q.r && ball.y > q.t && ball.y < q.b) {
      state = "fall"; stateT = 0; ball.hx = (q.l + q.r) / 2; ball.hy = (q.t + q.b) / 2;
      game.sfx({ wave: "square", duty: 2, from: 660, to: 110, ms: 380, attack: 2, decay: 360, vol: 0.5 });
      return;
    }
  }
  var gx = ball.x - G0.x, gy = ball.y - G0.y;
  if (gx * gx + gy * gy < 16) clear();
}

function clear() {
  state = "clear"; stateT = 0; sensorOff();             /* nothing to tilt for until the next level starts */
  ball.vx = ball.vy = 0; ball.x = G0.x; ball.y = G0.y;
  game.sfx("win");
  if (level + 1 > best && level + 1 < LEVELS.length) { best = level + 1; game.save("best", best); }
}

async function pause() {
  sensorOff();
  game.sfx("tap");
  var acts = [["go", { zh: "继续", en: "Resume" }]];
  if (HAS_MOTION && mode === "tilt") acts.push(["zero", { zh: "校准", en: "Recentre" }]);
  acts.push(["again", { zh: "重来", en: "Restart" }]);
  if (HAS_MOTION) acts.push(["mode", mode === "tilt" ? { zh: "按键玩法", en: "Play with keys" } : { zh: "倾斜玩法", en: "Play with tilt" }]);
  acts.push(["levels", { zh: "选关", en: "Levels" }]);
  var i = await game.choose(acts.map(function (a) { return T(a[1]); }), { title: T({ zh: "暂停", en: "Paused" }) });
  var act = i < 0 ? "go" : acts[i][0];                   /* B resumes */
  if (act === "levels") { game.go("title"); return; }
  if (act === "again") placeBall();
  if (act === "mode") {
    mode = mode === "tilt" ? "keys" : "tilt"; game.save("mode", mode);
    say(mode === "tilt" ? T({ zh: "倾斜机身，或用方向键", en: "Tilt, or use the D-pad" }) : T({ zh: "方向键推球", en: "The D-pad pushes" }), 2);
  }
  sensorOn();                                            /* start() takes the way the handheld is held now as level */
  if (act === "zero") say(T({ zh: "现在的姿势就是水平", en: "Level = how you hold it" }), 2);
}

/* ---- drawing ---- */
var BALL = LoGame.sprite([".000.", "03310", "03110", "01110", ".000."]);
var FLAG = LoGame.sprite(["0...", "000.", "0000", "000.", "0...", "0...", "0..."]);

function drawMaze(g) {
  for (var ty = 0; ty < ROWS; ty++) for (var tx = 0; tx < COLS; tx++) {
    var ch = M[ty][tx], x = tx * TILE, y = HUD + ty * TILE;
    if (ch === "#") {
      g.rect(x, y, TILE, TILE, g.DARK);
      if (at(tx, ty - 1) !== "#") g.rect(x, y, TILE, 1, g.MID);       /* a lit top edge */
      if (at(tx, ty + 1) !== "#") g.rect(x, y + TILE - 1, TILE, 1, g.INK);
    } else if (ch === "O") {
      var q = pit(tx, ty);
      g.rect(q.l, q.t, q.r - q.l, q.b - q.t, g.INK);
    } else if (ch === "G") {
      g.dither(x - 2, y - 2, TILE + 4, TILE + 4, g.MID, 2);
      g.circle(x + 4, y + 4, 4, g.DARK, false);
    }
  }
  g.sprite(FLAG, G0.x - 1, G0.y - 8);
}

function drawBall(g) {
  if (state === "fall") {
    var k = Math.min(1, stateT / 0.4), x = LoGame.lerp(ball.x, ball.hx, k), y = LoGame.lerp(ball.y, ball.hy, k);
    if (k < 0.5) g.sprite(BALL, x - 2, y - 2); else if (k < 0.9) g.rect(x - 1, y - 1, 2, 2, g.DARK);
    return;
  }
  g.rect(ball.x - 1, ball.y + 2, 4, 1, g.MID);               /* shadow */
  g.sprite(BALL, ball.x - 2, ball.y - 2);
}

function drawHud(g) {
  g.rect(0, 0, 160, HUD, g.INK);
  g.text(T({ zh: "第{n}关 {name}", en: "{n} {name}" }, { n: level + 1, name: T(LEVELS[level].name) }), 3, 1, { color: g.PAPER });
  /* how the sensor stands: a bubble level while tilt is live, else the word for keys */
  if (live) {
    g.frame(140, 2, 17, 12, g.PAPER);
    g.rect(147 + Math.round(tilt.x * 6), 7 - Math.round(tilt.y * 3.5), 3, 2, g.PAPER);
  } else {
    var w = asking ? "…" : mode === "tilt" ? T({ zh: "倾斜", en: "TILT" }) : T({ zh: "按键", en: "KEYS" });
    g.text(w, 157, 1, { color: g.PAPER, align: "right" });
  }
}

function drawFoot(g, text) {
  var n = game.time < noteUntil;                        /* a line about the sensor takes the footer for a moment */
  g.rect(0, FOOT, 160, 176 - FOOT, n ? g.INK : g.PAPER);
  g.rect(0, FOOT, 160, 1, g.INK);
  g.text(n ? note : text, 80, FOOT + 2, { align: "center", color: n ? g.PAPER : g.INK });
}

/* ---- the title: a small tray rolling its own ball, then the keys with their pictures ---- */
var KEYS = {
  pad: LoGame.sprite(["...000...", "...010...", "000010000", "011111110", "000010000", "...010...", "...000..."]),
  a: LoGame.sprite(["..00000..", ".0111110.", "011131110", "011313110", "011333110", "011313110", ".0111110.", "..00000.."]),
  pill: LoGame.sprite([".000000000.", "01111111110", "01111111110", "01111111110", ".000000000."])
};
var TRAY = ["................", ".###......#.....", "...#..O...#..G..", "...#......#.....", "...######.......", "......O........."];
var TX = 16, TY = 26;                                   /* the tray's floor, 16x6 tiles */
var ROUTE = [[0, 5], [0, 0], [11, 0], [11, 2], [13, 2]];
var ROUTE_LEN = 0;
for (var ri = 1; ri < ROUTE.length; ri++) ROUTE_LEN += (Math.abs(ROUTE[ri][0] - ROUTE[ri - 1][0]) + Math.abs(ROUTE[ri][1] - ROUTE[ri - 1][1])) * TILE;
function routeAt(d) {                                   /* the point d px along the route, in screen pixels */
  for (var i = 1; i < ROUTE.length; i++) {
    var a = ROUTE[i - 1], b = ROUTE[i], l = (Math.abs(b[0] - a[0]) + Math.abs(b[1] - a[1])) * TILE;
    if (d <= l || i === ROUTE.length - 1) {
      var k = l ? Math.min(1, d / l) : 0;
      return { x: TX + (a[0] + (b[0] - a[0]) * k) * TILE + 4, y: TY + (a[1] + (b[1] - a[1]) * k) * TILE + 4 };
    }
    d -= l;
  }
}

function drawTray(g) {
  g.dither(TX - 1, TY + 50, 132, 4, g.MID, 2);          /* its shadow on the table */
  g.rect(TX - 4, TY - 4, 136, 56, g.INK);
  g.rect(TX - 3, TY - 3, 134, 54, g.DARK);
  g.rect(TX - 3, TY - 3, 134, 1, g.MID);
  g.rect(TX, TY, 128, 48, g.PAPER);
  for (var ty = 0; ty < 6; ty++) for (var tx = 0; tx < 16; tx++) {
    var ch = TRAY[ty][tx], x = TX + tx * TILE, y = TY + ty * TILE, up = ty > 0 ? TRAY[ty - 1][tx] : ".", dn = ty < 5 ? TRAY[ty + 1][tx] : ".";
    if (ch === "#") {
      g.rect(x, y, TILE, TILE, g.DARK);
      if (up !== "#") g.rect(x, y, TILE, 1, g.MID);
      if (dn !== "#") g.rect(x, y + TILE - 1, TILE, 1, g.INK);
    } else if (ch === "O") {
      g.rect(x + 1, y + 1, 6, 6, g.INK);
    } else if (ch === "G") {
      g.dither(x - 2, y - 2, TILE + 4, TILE + 4, g.MID, 2);
      g.circle(x + 4, y + 4, 4, g.DARK, false);
      g.sprite(FLAG, x + 3, y - 4);
    }
  }
  /* the ball: rolls the route, rests at the flag, starts again */
  var speed = 48, run = ROUTE_LEN / speed, t = game.time % (run + 1.4), d = Math.min(ROUTE_LEN, t * speed);
  for (var s = Math.max(0, d - 28); s < d - 5; s += 4) { var p = routeAt(s); g.pixel(p.x, p.y, g.MID); }
  var b = routeAt(d);
  g.rect(b.x - 1, b.y + 2, 4, 1, g.MID);
  g.sprite(BALL, b.x - 2, b.y - 2);
}

function keyRow(g, icon, name, what, y) {
  var s = KEYS[icon];
  g.sprite(s, 13 - (s.w >> 1), y + 7 - (s.h >> 1));
  g.text(name, 24, y, { color: g.DARK });
  g.text(what, 70, y);
}

var sel = 0;
game.scene("title", {
  enter: function () { sensorOff(); },
  update: function () {
    var d = game.dir();
    if (d.x) { var n = LoGame.clamp(sel + d.x, 0, best); if (n !== sel) { sel = n; game.sfx("move"); } else game.sfx("err"); }
    if (game.pressed("select") && HAS_MOTION) { mode = mode === "tilt" ? "keys" : "tilt"; game.save("mode", mode); game.sfx("tick"); }
    if (game.pressed("a") || game.pressed("start") || (game.pointer.pressed && game.pointer.y > 156)) { game.sfx("ok"); game.go("play", sel); }
  },
  draw: function (g) {
    g.clear(g.PAPER);
    g.rect(0, 0, 160, 18, g.INK);
    var title = T({ zh: "滚珠迷宫", en: "BALL MAZE" }), tw = g.measure(title);
    g.text(title, 80, 2, { align: "center", color: g.PAPER });
    g.sprite(BALL, 80 - (tw >> 1) - 11, 6); g.sprite(BALL, 80 + (tw >> 1) + 6, 6);
    drawTray(g);
    g.text(T({ zh: "滚到旗子那里，别掉进洞", en: "Roll to the flag" }), 80, 82, { align: "center" });
    g.rect(8, 97, 144, 1, g.MID);
    var y = 100;
    keyRow(g, "pad", T({ zh: "方向键", en: "D-pad" }), T({ zh: "推球", en: "push" }), y); y += 14;
    keyRow(g, "a", "A", T({ zh: "这一关重来", en: "restart" }), y); y += 14;
    keyRow(g, "pill", "START", HAS_MOTION ? T({ zh: "暂停、校准", en: "pause, level" }) : T({ zh: "暂停", en: "pause" }), y); y += 14;
    if (HAS_MOTION) keyRow(g, "pill", "SELECT", mode === "tilt" ? T({ zh: "玩法：倾斜", en: "play: TILT" }) : T({ zh: "玩法：按键", en: "play: KEYS" }), y);
    else g.text(T({ zh: "这台掌机不能倾斜，用方向键", en: "No tilt here: use the D-pad" }), 80, y, { align: "center", color: g.DARK });
    /* the level picker and the start, in one dark band */
    g.rect(0, 158, 160, 18, g.INK);
    g.text((sel > 0 ? "< " : "  ") + T({ zh: "第{n}关", en: "Level {n}" }, { n: sel + 1 }) + (sel < best ? " >" : "  "), 6, 160, { color: g.PAPER });
    if (Math.floor(game.time * 2) % 2 === 0) g.text(T({ zh: "按 A 开始", en: "Press A" }), 154, 160, { align: "right", color: g.PAPER });
  }
});

game.scene("play", {
  enter: function (n) { loadLevel(typeof n === "number" ? n : 0); sensorOn();
    if (mode === "tilt" && HAS_MOTION) say(T({ zh: "倾斜机身，或用方向键", en: "Tilt, or use the D-pad" }), 2.5); },
  exit: function () { sensorOff(); },
  update: function (dt) {
    stateT += dt;
    if (state !== "clear" && game.pressed("start")) { pause(); return; }
    if (state === "clear") {
      if (stateT > 0.4 && game.ok()) {
        if (level + 1 < LEVELS.length) { game.sfx("ok"); loadLevel(level + 1); sensorOn(); }
        else { game.sfx("ok"); game.go("title"); }
      }
      return;
    }
    if (game.pressed("a")) { game.sfx("tap"); placeBall(); return; }
    if (game.pressed("select") && live) { PAD.motion.zero(); game.sfx("tick"); say(T({ zh: "现在的姿势就是水平", en: "Level = how you hold it" }), 1.5); }
    if (LEVELS[level].holes && (shook || game.pressed("b"))) {   /* the bonus room: shake (or B) lays the holes out again */
      shook = false; shuffleHoles(LEVELS[level].holes, ball); game.sfx({ wave: "noise", from: 400, to: 2400, ms: 220, attack: 10, decay: 200, vol: 0.5 });
      game.shake(2, 0.25);
    }
    shook = false;
    if (state === "fall") { if (stateT > 0.6) placeBall(); return; }
    roll(Math.min(dt, 1 / 30));
  },
  draw: function (g) {
    g.clear(g.PAPER);
    drawMaze(g);
    drawBall(g);
    drawHud(g);
    if (state === "clear") {
      var last = level + 1 >= LEVELS.length;
      g.window(20, 64, 120, 46);
      g.text(last ? T({ zh: "全部通关！", en: "All cleared!" }) : T({ zh: "过关！", en: "Cleared!" }), 80, 72, { align: "center" });
      g.text(T({ zh: "第{n}关", en: "Level {n}" }, { n: level + 1 }), 80, 90, { align: "center", color: g.DARK });
    }
    var foot = state === "clear" ? T({ zh: "A 继续", en: "A next" }) : LEVELS[level].holes ? (live ? T({ zh: "摇一摇或 B 洗牌", en: "Shake or B: new holes" }) : T({ zh: "B 洗牌  A 重来", en: "B new holes  A restart" }))
             : live ? T({ zh: "SELECT 校准 START 暂停", en: "SELECT zero  START pause" })
             : T({ zh: "A 重来  START 暂停", en: "A restart  START pause" });
    drawFoot(g, foot);
  }
});

game.start("title");
</script>
