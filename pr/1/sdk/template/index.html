<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>计数器</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a3ad7e; color: #1f2a14; font-family: monospace; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; box-sizing: border-box; text-align: center; }
  #n { font-size: 64px; line-height: 1; }
  button { font: inherit; font-size: 18px; padding: 10px 24px; background: #1f2a14; color: #a3ad7e; border: 0; box-shadow: 3px 3px 0 #4a5a32; touch-action: manipulation; }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #4a5a32; }
  p { margin: 0; color: #4a5a32; }
</style>
</head>
<body>
<main>
  <p id="tip"></p>
  <div id="n">0</div>
  <button id="add" type="button"></button>
</main>
<script>
  /* two languages: PAD.lang is "zh" or "en"; older runtimes give none, so fall back to your default */
  var TXT = {
    zh: { tip: "点按钮或按 A 加一，B 清零。关掉再打开，数字还在。", add: "加一" },
    en: { tip: "Tap the button or press A to add one, B to reset. It remembers.", add: "+1" }
  }[PAD.lang === "en" ? "en" : "zh"];
  document.getElementById("tip").textContent = TXT.tip;
  document.getElementById("add").textContent = TXT.add;
  var n = 0, el = document.getElementById("n");
  PAD.load("count").then(function (v) { n = v || 0; el.textContent = n; });
  function set(v, sound) { n = v; el.textContent = n; PAD.save("count", n); PAD.sfx(sound); }
  document.getElementById("add").addEventListener("pointerdown", function (e) {
    e.preventDefault(); set(n + 1, "tap");
  });
  /* chin buttons (manifest "buttons": true); the keyboard works too: X = A, Z = B */
  PAD.on("press", function (b) {
    if (b === "a") set(n + 1, "tap");
    if (b === "b") set(0, "miss");
  });
</script>
</body>
</html>
