<script data-src="src/art.js">
/* wang-dachui / art.js — the alley, the school, the kitchen and the people in them.
 *
 * Everything is drawn with the four Lo-PDA tones: ink 0, dark 1, mid 2, paper 3.
 * The look is a woodcut picture book: big silhouettes, hard light, brick and paper
 * texture, rain as short diagonal strokes. Portraits are 48x58 busts; the son's
 * head is deliberately too big for his body.
 *
 * MIT License. Copyright (c) 2026 Haowei Wu.
 */

var ART = (function () {
  "use strict";

  var INK = 0, DARK = 1, MID = 2, PAPER = 3;

  /* ---------------- small helpers ---------------- */

  function bricks(g, x, y, w, h, base, mortar) {
    g.rect(x, y, w, h, base);
    for (var yy = 0; yy < h; yy += 6) {
      g.rect(x, y + yy, w, 1, mortar);
      var off = ((yy / 6) | 0) % 2 ? 5 : 0;
      for (var xx = off; xx < w; xx += 11) g.rect(x + xx, y + yy, 1, Math.min(6, h - yy), mortar);
    }
  }

  function bricksLit(g, x, y, w, h) {
    bricks(g, x, y, w, h, DARK, INK);
    for (var i = 0; i < 18; i++) {
      var bx = x + (i * 37 + 11) % w, by = y + (i * 23 + 7) % h;
      g.rect(bx, by, 3, 1, MID);
    }
  }

  function rain(g, t, n, tone, len) {
    tone = tone == null ? MID : tone;
    len = len || 4;
    for (var i = 0; i < n; i++) {
      var x = (i * 37 + Math.floor(t * 95) + (i % 3) * 11) % 172 - 6;
      var y = (i * 23 + Math.floor(t * 150) + (i % 5) * 7) % 150 - 4;
      g.line(x, y, x - 2, y + len, tone);
      if (i % 6 === 0) g.pixel(x - 1, y + len + 1, PAPER);
    }
  }

  function cone(g, cx, top, w, h, tone) {
    tone = tone == null ? PAPER : tone;
    for (var yy = 0; yy < h; yy += 2) {
      var half = Math.round(w / 2 + yy * 0.36);
      g.dither(cx - half, top + yy, half * 2, 2, tone, 1);
    }
  }

  function glow(g, cx, cy, r, tone) {
    for (var yy = -r; yy <= r; yy++) {
      var half = Math.round(Math.sqrt(Math.max(0, r * r - yy * yy)));
      g.dither(cx - half, cy + yy, half * 2, 1, tone == null ? PAPER : tone, 1);
    }
  }

  function smoke(g, x, y, t, n) {
    for (var i = 0; i < (n || 5); i++) {
      var yy = y - i * 4;
      var xx = x + Math.round(Math.sin(t * 1.7 + i * 0.9) * (2 + i));
      g.pixel(xx, yy, i % 2 ? MID : DARK);
      g.pixel(xx + 1, yy - 1, MID);
    }
  }

  function dust(g, t, n, x0, y0, w, h) {
    for (var i = 0; i < n; i++) {
      var x = x0 + (i * 47 + Math.floor(t * (6 + i % 3))) % w;
      var y = y0 + (i * 29 + Math.floor(t * 3)) % h;
      g.pixel(x, y, i % 4 ? MID : PAPER);
    }
  }

  function stars(g, t, n, maxY) {
    for (var i = 0; i < n; i++) {
      var x = (i * 53 + 7) % 160, y = 3 + (i * 19) % (maxY || 40);
      if (Math.floor(t * 1.5 + i) % 7) g.pixel(x, y, i % 3 ? MID : PAPER);
    }
  }

  function windows(g, x, y, cols, rows, w, h, gap, lit) {
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      var on = lit(c, r);
      if (on) g.rect(x + c * (w + gap), y + r * (h + gap), w, h, on === 2 ? PAPER : MID);
      else g.rect(x + c * (w + gap), y + r * (h + gap), w, h, DARK);
    }
  }

  function tree(g, x, y, h, t, tone) {
    g.rect(x - 1, y, 3, h, INK);
    g.rect(x - 5, y - 2, 3, h * 0.35, INK);
    g.rect(x + 4, y + 2, 3, h * 0.3, INK);
    var cy = y - 4;
    g.circle(x, cy, 9, tone == null ? DARK : tone, true);
    g.circle(x - 6, cy + 3, 6, tone == null ? DARK : tone, true);
    g.circle(x + 7, cy + 2, 7, tone == null ? DARK : tone, true);
    for (var i = 0; i < 9; i++) {
      var lx = x - 9 + (i * 7) % 18, ly = cy - 4 + (i * 5) % 14;
      g.pixel(lx, ly, MID);
      if (i % 3 === 0) g.line(lx, ly, lx + 2, ly + 1, MID);
    }
  }

  function cat(g, x, y, t) {
    g.rect(x, y, 9, 5, INK);
    g.circle(x + 2, y + 1, 2, INK, true);
    g.pixel(x + 1, y - 2, INK); g.pixel(x + 3, y - 2, INK);
    g.line(x + 9, y + 1, x + 13 + Math.round(Math.sin(t * 2) * 2), y - 2, INK);
    g.pixel(x + 2, y + 1, PAPER);
  }

  function bicycle(g, x, y, s) {
    s = s || 1;
    g.circle(x, y, 6, INK, false);
    g.circle(x + 16, y, 6, INK, false);
    g.line(x, y, x + 6, y - 7, INK);
    g.line(x + 6, y - 7, x + 11, y, INK);
    g.line(x + 11, y, x + 16, y, INK);
    g.line(x + 11, y, x + 8, y - 3, INK);
    g.line(x + 6, y - 7, x + 9, y - 9, INK);
    g.line(x + 8, y - 9, x + 12, y - 9, INK);
    for (var i = 0; i < 6; i++) {
      var a = i * 1.05;
      g.pixel(x + Math.round(Math.cos(a) * 5), y + Math.round(Math.sin(a) * 5), MID);
      g.pixel(x + 16 + Math.round(Math.cos(a) * 5), y + Math.round(Math.sin(a) * 5), MID);
    }
  }

  function bin(g, x, y) {
    g.rect(x, y, 13, 16, DARK);
    g.frame(x, y, 13, 16, INK);
    g.rect(x - 1, y - 2, 15, 3, INK);
    g.rect(x + 4, y - 5, 5, 3, INK);
    g.rect(x + 3, y + 3, 7, 1, MID);
  }

  function figure(g, x, y, h, o) {
    o = o || {};
    var body = o.tone == null ? INK : o.tone;
    var headR = Math.max(3, Math.round(h * 0.13));
    var hy = y + headR;
    g.circle(x, hy, headR, o.skin ? PAPER : body, true);
    if (o.skin) g.circle(x, hy, headR, INK, false);
    if (o.hair) {
      g.rect(x - headR, hy - headR, headR * 2, Math.max(2, Math.round(headR * 0.6)), INK);
    }
    var sh = hy + headR;
    g.rect(x - headR - 1, sh, headR * 2 + 2, Math.round(h * 0.34), o.skin ? (o.vest ? PAPER : body) : body);
    if (o.vest) {
      g.frame(x - headR - 1, sh, headR * 2 + 2, Math.round(h * 0.34), INK);
      g.rect(x - headR, sh + 2, 2, Math.round(h * 0.26), MID);
      g.rect(x + headR - 1, sh + 2, 2, Math.round(h * 0.26), MID);
    }
    var legY = sh + Math.round(h * 0.34);
    g.rect(x - headR + 1, legY, 2, y + h - legY, body);
    g.rect(x + headR - 2, legY, 2, y + h - legY, body);
    if (o.arms === "up" || o.pose === "fight") {
      g.line(x - headR, sh + 3, x - headR - 4, sh - 1, body);
      g.line(x + headR, sh + 3, x + headR + 4, sh - 1, body);
      g.circle(x - headR - 4, sh - 2, 2, body, true);
      g.circle(x + headR + 4, sh - 2, 2, body, true);
    } else if (o.arms === "out") {
      g.line(x - headR, sh + 4, x - headR - 6, sh + 6, body);
      g.line(x + headR, sh + 4, x + headR + 6, sh + 6, body);
    }
    if (o.basin) {
      g.rect(x - headR - 1, hy - headR - 3, headR * 2 + 2, 4, PAPER);
      g.frame(x - headR - 1, hy - headR - 3, headR * 2 + 2, 4, INK);
      g.rect(x - headR, hy - headR - 2, headR * 2, 1, MID);
    }
  }

  function crowd(g, y, n, t, tone) {
    for (var i = 0; i < n; i++) {
      var x = 4 + i * (152 / n) + (i % 2) * 2;
      var bob = Math.round(Math.sin(t * 1.5 + i * 0.7));
      g.circle(x, y + bob, 4, tone == null ? INK : tone, true);
      g.rect(x - 5, y + 4 + bob, 11, 8, tone == null ? INK : tone);
      if (i % 3 === 0) g.rect(x - 7, y + 2 + bob, 2, 1, MID);
    }
  }

  function vignette(g) {
    g.dither(0, 0, 160, 3, INK, 1);
    g.dither(0, 141, 160, 3, INK, 1);
    g.dither(0, 0, 3, 144, INK, 1);
    g.dither(157, 0, 3, 144, INK, 1);
  }

  function paperGrain(g, t) {
    for (var i = 0; i < 26; i++) {
      var x = (i * 61 + Math.floor(t * 2)) % 160, y = (i * 43 + 9) % 144;
      if (g.get(x, y) === PAPER) g.pixel(x, y, MID);
    }
  }

  /* ---------------- portraits ---------------- */

  function eyes(g, x, y, o) {
    var mood = o.mood, blink = o.blink;
    if (blink || mood === "solemn" || mood === "cry") {
      g.rect(x, y + 2, 7, 1, INK);
      g.rect(x + 11, y + 2, 7, 1, INK);
      return;
    }
    var h = mood === "shock" ? 4 : mood === "angry" || mood === "defiant" ? 2 : 3;
    g.rect(x, y, 7, h, INK);
    g.rect(x + 11, y, 7, h, INK);
    if (mood !== "angry" && mood !== "defiant") {
      g.pixel(x + 3, y + 1, PAPER);
      g.pixel(x + 14, y + 1, PAPER);
    }
  }

  function brows(g, x, y, mood) {
    if (mood === "angry" || mood === "defiant" || mood === "shout") {
      g.line(x, y + 2, x + 6, y, INK);
      g.line(x + 12, y, x + 18, y + 2, INK);
    } else if (mood === "sad" || mood === "hurt" || mood === "cry") {
      g.line(x, y, x + 6, y + 2, INK);
      g.line(x + 12, y + 2, x + 18, y, INK);
    } else if (mood === "smug" || mood === "smile") {
      g.rect(x, y + 1, 6, 1, INK);
      g.rect(x + 12, y, 6, 1, INK);
    } else {
      g.rect(x, y + 1, 7, 1, INK);
      g.rect(x + 11, y + 1, 7, 1, INK);
    }
  }

  function mouth(g, x, y, mood) {
    if (mood === "shout" || mood === "angry") {
      g.rect(x, y, 10, 4, INK);
      g.rect(x + 2, y + 1, 6, 1, PAPER);
    } else if (mood === "shock") {
      g.rect(x + 2, y, 6, 4, INK);
      g.rect(x + 3, y + 1, 4, 2, PAPER);
    } else if (mood === "smile") {
      g.line(x, y, x + 3, y + 2, INK);
      g.line(x + 3, y + 2, x + 7, y + 2, INK);
      g.line(x + 7, y + 2, x + 10, y, INK);
    } else if (mood === "smug") {
      g.rect(x, y, 8, 1, INK);
      g.pixel(x + 9, y - 1, INK);
    } else if (mood === "sad" || mood === "hurt" || mood === "cry") {
      g.line(x, y + 2, x + 4, y + 3, INK);
      g.line(x + 4, y + 3, x + 9, y + 2, INK);
    } else {
      g.rect(x, y + 1, 9, 1, INK);
    }
  }

  function dad(g, mood, x, y, o) {
    var bob = o.bob || 0;
    y += bob;
    g.rect(x + 3, y + 42, 42, 16, INK);
    g.rect(x + 9, y + 44, 30, 14, DARK);
    g.rect(x + 12, y + 42, 4, 8, DARK);
    g.rect(x + 32, y + 42, 4, 8, DARK);
    g.rect(x + 13, y + 47, 22, 1, MID);
    g.rect(x + 19, y + 35, 10, 9, PAPER);
    g.rect(x + 19, y + 41, 10, 3, MID);
    g.rect(x + 12, y + 10, 24, 26, PAPER);
    g.frame(x + 12, y + 10, 24, 26, INK);
    g.rect(x + 9, y + 20, 3, 7, PAPER); g.frame(x + 9, y + 20, 3, 7, INK);
    g.rect(x + 36, y + 20, 3, 7, PAPER); g.frame(x + 36, y + 20, 3, 7, INK);
    g.rect(x + 10, y + 5, 28, 7, INK);
    g.rect(x + 12, y + 11, 5, 2, INK);
    g.rect(x + 29, y + 11, 5, 2, INK);
    if (o.basin) {
      g.rect(x + 4, y - 4, 40, 9, PAPER);
      g.frame(x + 4, y - 4, 40, 9, INK);
      g.rect(x + 6, y - 2, 36, 1, MID);
      g.rect(x + 6, y + 2, 36, 2, MID);
      g.rect(x + 4, y + 5, 40, 2, INK);
      g.rect(x + 10, y - 3, 3, 1, DARK);
    }
    g.rect(x + 14, y + 12, 3, 2, MID);
    brows(g, x + 15, y + 18, mood);
    eyes(g, x + 15, y + 21, { mood: mood, blink: o.blink });
    g.rect(x + 23, y + 24, 2, 4, MID);
    mouth(g, x + 17, y + 30, mood);
    /* stubble */
    g.dither(x + 15, y + 31, 19, 4, MID, 1);
    g.rect(x + 14, y + 34, 2, 1, MID);
    /* tie-less collar and a cigarette */
    g.rect(x + 18, y + 43, 12, 1, MID);
    if (o.smoke) {
      g.rect(x + 34, y + 30, 7, 1, PAPER);
      g.rect(x + 40, y + 30, 1, 1, INK);
      smoke(g, x + 40, y + 27, o.t || 0, 4);
    }
    if (mood === "shock") {
      g.rect(x + 37, y + 14, 2, 3, PAPER);
      g.rect(x + 37, y + 18, 2, 1, PAPER);
    }
    if (mood === "angry") g.rect(x + 36, y + 8, 3, 1, MID);
    if (mood === "tired") {
      g.rect(x + 14, y + 26, 6, 1, MID);
      g.rect(x + 26, y + 26, 6, 1, MID);
    }
  }

  function son(g, mood, x, y, o) {
    var bob = o.bob || 0;
    y += bob;
    g.rect(x + 8, y + 44, 32, 14, INK);
    g.rect(x + 11, y + 46, 26, 12, DARK);
    g.rect(x + 18, y + 44, 12, 4, MID);
    g.rect(x + 22, y + 48, 4, 1, INK);
    g.rect(x + 20, y + 36, 8, 8, PAPER);
    /* the big head */
    g.rect(x + 7, y + 6, 34, 31, PAPER);
    g.frame(x + 7, y + 6, 34, 31, INK);
    g.rect(x + 4, y + 18, 4, 9, PAPER); g.frame(x + 4, y + 18, 4, 9, INK);
    g.rect(x + 40, y + 18, 4, 9, PAPER); g.frame(x + 40, y + 18, 4, 9, INK);
    /* bowl cut */
    g.rect(x + 6, y + 2, 36, 9, INK);
    g.rect(x + 8, y + 11, 4, 3, INK);
    g.rect(x + 14, y + 11, 5, 2, INK);
    g.rect(x + 21, y + 11, 4, 2, INK);
    g.rect(x + 27, y + 11, 5, 3, INK);
    g.rect(x + 34, y + 11, 4, 2, INK);
    g.rect(x + 9, y + 3, 3, 1, MID);
    if (o.basin) {
      g.rect(x + 4, y - 4, 40, 9, PAPER);
      g.frame(x + 4, y - 4, 40, 9, INK);
      g.rect(x + 6, y - 2, 36, 1, MID);
      g.rect(x + 6, y + 2, 36, 2, MID);
      g.rect(x + 4, y + 5, 40, 2, INK);
      g.rect(x + 10, y - 3, 3, 1, DARK);
    }
    brows(g, x + 12, y + 18, mood);
    eyes(g, x + 12, y + 21, { mood: mood, blink: o.blink });
    g.rect(x + 23, y + 25, 2, 4, MID);
    mouth(g, x + 18, y + 31, mood);
    /* cheek marks */
    if (mood === "smile") {
      g.dither(x + 9, y + 26, 4, 3, MID, 2);
      g.dither(x + 35, y + 26, 4, 3, MID, 2);
    }
    if (mood === "hurt") {
      g.dither(x + 29, y + 25, 7, 5, DARK, 2);
      g.rect(x + 31, y + 24, 3, 1, MID);
    }
    if (mood === "shock") {
      g.rect(x + 38, y + 13, 2, 4, PAPER);
      g.rect(x + 38, y + 18, 2, 1, PAPER);
      g.rect(x + 7, y + 13, 2, 4, PAPER);
    }
    if (mood === "angry") g.rect(x + 37, y + 9, 3, 1, MID);
    if (o.talk) {
      g.rect(x + 20, y + 32, 4, 2, INK);
      g.rect(x + 21, y + 32, 2, 1, PAPER);
    }
  }

  function teacher(g, mood, x, y, o) {
    var bob = o.bob || 0;
    y += bob;
    g.rect(x + 4, y + 42, 40, 16, INK);
    g.rect(x + 9, y + 44, 30, 14, DARK);
    g.rect(x + 23, y + 44, 1, 14, PAPER);
    g.rect(x + 16, y + 42, 16, 3, MID);
    g.rect(x + 19, y + 35, 10, 8, PAPER);
    g.rect(x + 13, y + 10, 22, 25, PAPER);
    g.frame(x + 13, y + 10, 22, 25, INK);
    g.rect(x + 10, y + 20, 3, 6, PAPER); g.frame(x + 10, y + 20, 3, 6, INK);
    g.rect(x + 35, y + 20, 3, 6, PAPER); g.frame(x + 35, y + 20, 3, 6, INK);
    g.rect(x + 11, y + 6, 26, 7, INK);
    g.rect(x + 29, y + 12, 5, 3, INK);
    g.rect(x + 13, y + 7, 4, 1, MID);
    /* glasses */
    g.frame(x + 14, y + 20, 9, 7, INK);
    g.frame(x + 25, y + 20, 9, 7, INK);
    g.rect(x + 23, y + 23, 2, 1, INK);
    g.dither(x + 15, y + 21, 7, 5, MID, 1);
    g.dither(x + 26, y + 21, 7, 5, MID, 1);
    g.rect(x + 17, y + 22, 2, 2, INK);
    g.rect(x + 28, y + 22, 2, 2, INK);
    brows(g, x + 14, y + 17, mood);
    g.rect(x + 23, y + 25, 2, 3, MID);
    mouth(g, x + 18, y + 31, mood);
    /* whistle on a cord */
    g.rect(x + 19, y + 43, 4, 2, PAPER);
    g.frame(x + 19, y + 43, 4, 2, INK);
    g.line(x + 19, y + 43, x + 17, y + 38, MID);
    if (mood === "shock") {
      g.rect(x + 35, y + 13, 2, 4, PAPER);
      g.rect(x + 35, y + 18, 2, 1, PAPER);
    }
  }

  function aunt(g, mood, x, y, o) {
    var bob = o.bob || 0;
    y += bob;
    g.rect(x + 7, y + 43, 34, 15, INK);
    g.rect(x + 11, y + 44, 26, 14, DARK);
    g.rect(x + 19, y + 43, 10, 3, PAPER);
    g.rect(x + 21, y + 36, 6, 8, PAPER);
    g.rect(x + 14, y + 12, 20, 23, PAPER);
    g.frame(x + 14, y + 12, 20, 23, INK);
    g.rect(x + 11, y + 20, 3, 7, PAPER); g.frame(x + 11, y + 20, 3, 7, INK);

    g.frame(18, 20, 110, 8, INK);
    for (var i = 0; i < 8; i++) g.rect(23 + i * 13, 22, 8, 4, INK);
    /* gate */
    g.rect(46, 62, 3, 26, INK);
    g.rect(62, 62, 3, 26, INK);
    g.rect(78, 62, 3, 26, INK);
    g.rect(46, 64, 35, 2, INK);
    /* the backpack in the tree */
    g.rect(116, 30, 3, 34, INK);
    g.circle(117, 28, 9, DARK, true);
    g.rect(122, 34, 13, 14, PAPER);
    g.frame(122, 34, 13, 14, INK);
    g.rect(124, 36, 9, 2, MID);
    g.line(122, 34, 117, 30, INK);
    g.line(135, 34, 117, 28, INK);
    /* rain and ground */
    g.rect(0, 88, 160, 56, INK);
    g.rect(0, 88, 160, 2, MID);
    for (i = 0; i < 8; i++) g.rect(8 + i * 20, 94 + (i % 3) * 7, 12, 1, DARK);
    rain(g, t, 22, MID, 4);
    vignette(g);
  }

  function card_podium(g, t) {
    g.clear(PAPER);
    g.dither(0, 0, 160, 24, MID, 1);
    g.circle(130, 14, 10, MID, true);
    g.circle(130, 14, 10, INK, false);
    g.rect(0, 32, 160, 44, DARK);
    g.rect(0, 32, 160, 2, INK);
    g.rect(20, 22, 112, 9, PAPER);
    g.frame(20, 22, 112, 9, INK);
    for (var i = 0; i < 9; i++) g.rect(24 + i * 12, 24, 7, 5, INK);
    /* podium */
    g.rect(48, 52, 64, 4, INK);
    g.rect(50, 56, 60, 30, DARK);
    g.frame(50, 56, 60, 30, INK);
    /* a very small boy at a very large microphone */
    figure(g, 80, 42, 18, { tone: INK, skin: true, hair: true });
    g.rect(80, 30, 1, 16, INK);
    g.circle(80, 29, 2, INK, true);
    /* the crowd, as a dark sea */
    g.rect(0, 84, 160, 60, INK);
    for (i = 0; i < 11; i++) {
      g.circle(6 + i * 15, 88, 4, DARK, true);
      g.rect(0 + i * 15, 92, 13, 10, DARK);
    }
    /* one raised fist */
    g.rect(126, 76, 3, 10, INK);
    g.circle(127, 74, 3, INK, true);
    dust(g, t, 14, 0, 20, 160, 50);
    vignette(g);
  }

  function card_basin(g, t) {
    g.clear(INK);
    g.rect(0, 0, 160, 88, DARK);
    /* a shaft of light */
    for (var i = 0; i < 40; i += 2) {
      var half = 14 + i * 0.8;
      g.dither(80 - half, 0 + i, half * 2, 2, PAPER, 1);
    }
    /* desk */
    g.rect(0, 66, 160, 4, INK);
    g.rect(0, 70, 160, 18, INK);
    /* the giant basin */
    g.circle(80, 54, 28, PAPER, true);
    g.circle(80, 54, 28, INK, false);
    g.circle(80, 54, 22, MID, true);
    g.circle(80, 54, 18, PAPER, true);
    g.circle(80, 54, 11, MID, true);
    g.circle(80, 54, 8, PAPER, true);
    /* a small boy behind it */
    g.circle(80, 30, 6, INK, true);
    g.rect(74, 36, 12, 14, INK);
    g.rect(78, 32, 4, 3, PAPER);
    /* a second basin, the shadow */
    g.circle(118, 58, 18, DARK, true);
    g.circle(118, 58, 18, INK, false);
    rain(g, t, 12, MID, 3);
    vignette(g);
  }

  function card_courtyard(g, t) {
    g.clear(PAPER);
    g.dither(0, 0, 160, 30, MID, 1);
    bricksLit(g, 0, 36, 160, 52);
    g.rect(0, 34, 160, 2, INK);
    /* trellis */
    g.rect(0, 0, 160, 3, INK);
    for (var i = 0; i < 6; i++) g.rect(8 + i * 28, 0, 3, 10, INK);
    for (i = 0; i < 5; i++) {
      g.line(0, 8 + i * 2, 160, 12 + i * 3, INK);
      g.circle(20 + i * 31, 14 + (i % 2) * 6, 3, DARK, true);
      g.circle(20 + i * 31, 14 + (i % 2) * 6, 3, INK, false);
    }
    /* dummy and two shadows */
    g.rect(84, 40, 4, 48, INK);
    g.rect(76, 48, 20, 3, INK);
    g.rect(80, 56, 12, 2, DARK);
    g.rect(80, 88, 12, 2, INK);
    /* the two figures, as ink silhouettes */
    g.circle(52, 56, 6, INK, true);
    g.rect(46, 62, 12, 16, INK);
    g.line(46, 66, 38, 58, INK);
    g.line(58, 66, 66, 58, INK);
    g.circle(66, 64, 4, INK, true);
    g.rect(62, 68, 8, 12, INK);
    g.line(62, 70, 56, 64, INK);
    g.line(70, 70, 76, 64, INK);
    /* ground */
    g.rect(0, 88, 160, 56, MID);
    g.rect(0, 88, 160, 2, INK);
    for (i = 0; i < 8; i++) g.rect(6 + i * 20, 96 + (i % 3) * 8, 12, 1, DARK);
    /* persimmons */
    for (i = 0; i < 5; i++) {
      g.circle(124 + (i * 7) % 22, 26 + (i * 5) % 18, 2, PAPER, true);
      g.circle(124 + (i * 7) % 22, 26 + (i * 5) % 18, 2, INK, false);
    }
    dust(g, t, 12, 0, 10, 160, 50);
    vignette(g);
  }

  function card_wave(g, t) {
    g.clear(INK);
    bricks(g, 0, 0, 160, 120, DARK, INK);
    /* streetlight */
    g.rect(124, 0, 2, 50, INK);
    g.rect(112, 2, 16, 2, INK);
    g.rect(116, 4, 10, 4, PAPER);
    cone(g, 120, 8, 30, 58, PAPER);
    /* the wave, rising from the ground */
    for (var y = 0; y < 92; y += 2) {
      var wave = Math.round(Math.sin(y * 0.11 + t * 1.5) * 8);
      var top = 92 - y;
      g.dither(wave - 20, top, 80, 2, MID, 1);
      if (y % 6 === 0) g.dither(wave - 10, top, 50, 1, PAPER, 1);
    }
    /* the boy in front of it */
    figure(g, 70, 54, 38, { tone: INK, skin: true, hair: true, vest: true, pose: "fight" });
    /* ground */
    g.rect(0, 92, 160, 52, INK);
    g.rect(0, 92, 160, 2, MID);
    for (var i = 0; i < 8; i++) g.rect(6 + i * 20, 100 + (i % 3) * 8, 10, 1, MID);
    vignette(g);
  }

  function card_alley(g, t) {
    g.clear(INK);
    g.rect(0, 0, 160, 96, DARK);
    bricksLit(g, 0, 0, 54, 96);
    bricksLit(g, 106, 0, 54, 96);
    /* the streetlight */
    g.rect(80, 0, 2, 54, INK);
    g.rect(68, 2, 16, 2, INK);
    g.rect(72, 4, 10, 4, PAPER);
    cone(g, 77, 8, 34, 84, PAPER);
    /* ground */
    g.rect(0, 88, 160, 56, INK);
    g.rect(0, 88, 160, 2, MID);
    /* the boy, fists up */
    figure(g, 66, 48, 42, { tone: INK, skin: true, hair: true, vest: true, pose: "fight" });
    /* the father, foreground, back view */
    g.rect(0, 60, 26, 36, INK);
    g.circle(13, 57, 11, INK, true);
    g.rect(0, 60, 26, 2, MID);
    /* the basin on the ground */
    g.circle(108, 92, 7, PAPER, true);
    g.circle(108, 92, 7, INK, false);
    g.circle(108, 92, 4, MID, true);
    /* long shadow */
    g.rect(74, 88, 20, 1, INK);
    g.rect(80, 78, 10, 9, INK);
    g.rect(84, 60, 4, 18, INK);
    g.circle(86, 57, 3, INK, true);
    rain(g, t, 14, MID, 3);
    vignette(g);
  }

  /* ---------------- ending posters ---------------- */

  function end_done(g, t) {
    g.clear(INK);
    g.dither(0, 0, 160, 30, DARK, 1);
    /* low angle: the boy looms, the father is a small shape on the ground */
    g.rect(0, 0, 160, 96, DARK);
    bricksLit(g, 0, 0, 44, 96);
    bricksLit(g, 118, 0, 42, 96);
    g.rect(94, 0, 2, 70, INK);
    g.rect(84, 2, 22, 2, INK);
    g.rect(88, 4, 14, 4, PAPER);
    cone(g, 95, 8, 44, 80, PAPER);
    /* the boy, huge in the foreground */
    figure(g, 76, 24, 64, { tone: INK, skin: true, hair: true, vest: true, pose: "fight" });
    /* the father, small on the ground, above the poster panel */
    g.rect(18, 62, 26, 8, INK);
    g.circle(24, 58, 5, INK, true);
    g.rect(38, 64, 14, 4, INK);
    g.rect(20, 68, 4, 6, INK);
    /* ground and rain */
    g.rect(0, 96, 160, 48, INK);
    g.rect(0, 96, 160, 2, MID);
    for (var i = 0; i < 10; i++) g.rect((i * 19 + 5) % 160, 102 + (i % 4) * 7, 8, 1, MID);
    rain(g, t, 20, MID, 4);
    vignette(g);
  }

  function end_side(g, t) {
    g.clear(PAPER);
    g.dither(0, 0, 160, 26, MID, 1);
    g.dither(0, 0, 160, 12, DARK, 1);
    g.circle(130, 18, 10, PAPER, true);
    g.circle(130, 18, 10, INK, false);
    /* alley at dawn */
    bricksLit(g, 0, 30, 50, 66);
    bricksLit(g, 110, 30, 50, 66);
    g.rect(0, 28, 160, 2, INK);
    g.rect(0, 92, 160, 52, MID);
    g.rect(0, 92, 160, 2, INK);
    for (var i = 0; i < 8; i++) g.rect(6 + i * 20, 98 + (i % 3) * 8, 10, 1, DARK);
    /* two figures, backs, side by side */
    figure(g, 64, 48, 40, { tone: INK, skin: true, hair: true, vest: true });
    figure(g, 90, 54, 34, { tone: INK, skin: true, hair: true });
    /* their shadows merge */
    g.rect(58, 88, 44, 1, INK);
    g.rect(62, 82, 36, 6, INK);
    /* a bicycle and the basin */
    bicycle(g, 118, 104, 1);
    g.circle(24, 100, 6, PAPER, true);
    g.circle(24, 100, 6, INK, false);
    g.circle(24, 100, 3, MID, true);
    dust(g, t, 10, 0, 20, 160, 50);
    vignette(g);
  }

  function end_basin(g, t) {
    g.clear(PAPER);
    g.dither(0, 0, 160, 24, MID, 1);
    g.rect(0, 32, 160, 44, DARK);
    g.rect(0, 32, 160, 2, INK);
    g.rect(20, 22, 112, 9, PAPER);
    g.frame(20, 22, 112, 9, INK);
    for (var i = 0; i < 9; i++) g.rect(24 + i * 12, 24, 7, 5, INK);
    g.rect(44, 56, 72, 4, INK);
    g.rect(46, 60, 68, 28, DARK);
    g.frame(46, 60, 68, 28, INK);
    /* the father with the basin, the son beside him */
    figure(g, 72, 40, 32, { tone: INK, skin: true, hair: true, basin: true });
    figure(g, 98, 48, 24, { tone: INK, skin: true, hair: true });
    g.rect(84, 34, 1, 22, INK);
    g.circle(84, 33, 2, INK, true);
    /* the crowd */
    g.rect(0, 96, 160, 48, MID);
    g.rect(0, 96, 160, 2, INK);
    crowd(g, 92, 9, t, INK);
    crowd(g, 106, 9, t + 0.4, DARK);
    /* confetti */
    for (i = 0; i < 30; i++) {
      var cx = (i * 37 + Math.floor(t * 8)) % 160;
      var cy = (i * 23 + Math.floor(t * 12)) % 88;
      g.rect(cx, cy, 2, 2, i % 3 === 0 ? INK : i % 3 === 1 ? MID : PAPER);
    }
    vignette(g);
  }

  function end_grow(g, t) {
    g.clear(INK);
    g.rect(0, 0, 160, 96, DARK);
    /* fridge light */
    g.rect(4, 20, 42, 70, INK);
    g.rect(7, 23, 36, 64, PAPER);
    g.frame(7, 23, 36, 64, INK);
    for (var i = 0; i < 4; i++) g.rect(9, 34 + i * 14, 32, 1, INK);
    for (i = 0; i < 4; i++) g.rect(10 + i * 8, 26 + (i % 2) * 16, 4, 8, MID);
    for (var yy = 0; yy < 40; yy += 2) {
      var half = 20 + yy;
      g.dither(44 - half / 2, 90 + yy, half, 2, PAPER, 1);
    }
    /* a warm halo behind the two of them */
    g.dither(40, 18, 64, 54, PAPER, 1);
    /* father, left, leaning down */
    g.rect(48, 38, 26, 36, INK);
    g.rect(48, 38, 26, 2, MID);
    g.rect(56, 40, 10, 10, DARK);
    g.circle(60, 30, 9, PAPER, true);
    g.circle(60, 30, 9, INK, false);
    g.rect(52, 20, 16, 5, INK);
    g.rect(64, 28, 1, 1, INK);
    g.rect(58, 35, 6, 1, INK);
    /* son, right, face against the father's chest */
    g.rect(72, 48, 20, 26, INK);
    g.rect(76, 50, 12, 8, MID);
    g.circle(80, 42, 8, PAPER, true);
    g.circle(80, 42, 8, INK, false);
    g.rect(74, 35, 14, 4, INK);
    g.rect(78, 40, 1, 1, INK);
    g.rect(76, 48, 6, 1, INK);
    /* the father's arm around the son's back */
    g.rect(70, 46, 4, 10, MID);
    g.rect(74, 50, 14, 3, MID);
    g.rect(86, 46, 3, 8, MID);
    g.rect(86, 50, 3, 3, PAPER);
    /* the son's arm around the father's waist */
    g.rect(74, 54, 3, 10, MID);
    g.rect(60, 58, 16, 3, MID);
    g.rect(58, 54, 3, 6, MID);
    g.rect(58, 58, 3, 3, PAPER);
    /* table */
    g.rect(52, 76, 102, 5, MID);
    g.rect(52, 81, 102, 3, INK);
    g.rect(56, 84, 3, 18, INK);
    g.rect(150, 84, 3, 18, INK);
    smoke(g, 120, 62, t, 4);
    /* floor */
    g.rect(0, 96, 160, 48, INK);
    g.rect(0, 96, 160, 2, MID);
    for (i = 0; i < 8; i++) g.rect(6 + i * 20, 102 + (i % 3) * 7, 9, 1, DARK);
    vignette(g);
  }

  function end_leave(g, t) {
    g.clear(PAPER);
    g.dither(0, 0, 160, 24, MID, 1);
    g.dither(0, 0, 160, 10, DARK, 1);
    /* the doorstep, dawn */
    g.rect(0, 34, 160, 62, DARK);
    g.rect(0, 34, 160, 2, INK);
    g.rect(12, 36, 34, 38, INK);
    g.rect(14, 38, 30, 36, DARK);
    g.rect(16, 44, 26, 28, MID);
    /* ground and step */
    g.rect(0, 72, 160, 72, DARK);
    g.rect(0, 72, 160, 2, INK);
    /* the basin on the step */
    g.circle(70, 60, 12, PAPER, true);
    g.circle(70, 60, 12, INK, false);
    g.circle(70, 60, 8, MID, true);
    g.circle(70, 60, 6, PAPER, true);
    /* the note */
    g.rect(88, 62, 20, 10, PAPER);
    g.frame(88, 62, 20, 10, INK);
    g.rect(91, 65, 14, 1, INK);
    g.rect(91, 68, 9, 1, INK);
    /* a train ticket */
    g.rect(112, 63, 14, 8, MID);
    g.frame(112, 63, 14, 8, INK);
    g.rect(114, 65, 10, 1, INK);
    /* a cat on the step and a distant train */
    cat(g, 140, 66, t);
    g.rect(0, 28, 160, 2, INK);
    g.rect(118, 18, 28, 8, INK);
    g.rect(122, 14, 20, 4, INK);
    for (var i = 0; i < 4; i++) g.rect(122 + i * 6, 20, 3, 4, PAPER);
    dust(g, t, 8, 0, 30, 160, 40);
    vignette(g);
  }

  function bg(g, name, t, o) {
    var f = BACKDROPS[name];
    if (f) f(g, t, o || {});
    else { g.clear(PAPER); g.dither(0, 0, 160, 144, MID, 1); }
  }

  var BACKDROPS = {
    title_alley: title_alley,
    school_gate: school_gate,
    office: office,
    home_night: home_night,
    kitchen_night: kitchen_night,
    bedroom: bedroom,
    schoolyard: schoolyard,
    classroom: classroom,
    baoding: baoding,
    baoding_night: baoding_night,
    wall_night: wall_night,
    alley_final: alley_final,
    kitchen_table: kitchen_table,
    basin_closeup: basin_closeup,
    home_dawn: home_dawn,
    podium_day: podium_day,
    window_rain: window_rain
  };

  var CARDS = {
    card_gate: card_gate,
    card_podium: card_podium,
    card_basin: card_basin,
    card_courtyard: card_courtyard,
    card_wave: card_wave,
    card_alley: card_alley
  };

  var ENDS = {
    end_done: end_done,
    end_side: end_side,
    end_basin: end_basin,
    end_grow: end_grow,
    end_leave: end_leave
  };

  /* ---------------- stamps: small paper cards in the corner ---------------- */

  function stamp(g, name, x, y, label) {
    g.rect(x, y, 30, 34, PAPER);
    g.frame(x, y, 30, 34, INK);
    g.rect(x + 2, y + 2, 26, 1, MID);
    var cx = x + 15, cy = y + 10;
    if (name === "cucumber") {
      g.rect(cx - 7, cy - 2, 14, 4, MID);
      g.rect(cx - 6, cy - 1, 12, 1, DARK);
      g.rect(cx - 7, cy - 2, 2, 4, INK);
      g.rect(cx + 5, cy - 2, 2, 4, INK);
      g.pixel(cx - 2, cy, PAPER); g.pixel(cx + 3, cy, PAPER);
    } else if (name === "basin") {
      g.circle(cx, cy, 8, PAPER, true);
      g.circle(cx, cy, 8, INK, false);
      g.circle(cx, cy, 5, MID, true);
      g.circle(cx, cy, 4, PAPER, true);
      g.rect(cx - 6, cy - 8, 12, 1, PAPER);
    } else if (name === "book") {
      g.rect(cx - 7, cy - 6, 14, 4, PAPER); g.frame(cx - 7, cy - 6, 14, 4, INK);
      g.rect(cx - 6, cy - 2, 12, 4, MID); g.frame(cx - 6, cy - 2, 12, 4, INK);
      g.rect(cx - 5, cy + 2, 10, 4, PAPER); g.frame(cx - 5, cy + 2, 10, 4, INK);
    } else if (name === "fist") {
      g.rect(cx - 6, cy - 4, 9, 8, PAPER);
      g.frame(cx - 6, cy - 4, 9, 8, INK);
      g.rect(cx + 3, cy - 1, 3, 5, PAPER);
      g.frame(cx + 3, cy - 1, 3, 5, INK);
      g.rect(cx - 5, cy + 4, 8, 2, MID);
    } else if (name === "wave") {
      for (var i = 0; i < 4; i++) {
        g.line(cx - 8 + i * 4, cy + 2, cx - 4 + i * 4, cy - 4, MID);
        g.line(cx - 4 + i * 4, cy - 4, cx + i * 4, cy + 2, MID);
      }
    } else if (name === "lamp") {
      g.rect(cx, cy - 8, 1, 14, INK);
      g.rect(cx - 5, cy - 8, 11, 2, INK);
      g.rect(cx - 3, cy - 6, 7, 3, PAPER);
      g.frame(cx - 3, cy - 6, 7, 3, INK);
      g.line(cx - 3, cy - 3, cx - 5, cy + 6, MID);
      g.line(cx + 3, cy - 3, cx + 5, cy + 6, MID);
    }
    if (label) g.text(T(label), cx, y + 21, { align: "center", color: INK });
  }

  return {
    portrait: portrait, bg: bg, card: function (g, name, t) { var f = CARDS[name]; if (f) f(g, t); else bg(g, "home_night", t); },
    ending: function (g, name, t) { var f = ENDS[name]; if (f) f(g, t); else bg(g, "alley_final", t); },
    stamp: stamp, rain: rain, dust: dust, cone: cone, glow: glow, smoke: smoke, figure: figure, bike: bicycle,
    names: {
      bg: Object.keys(BACKDROPS), card: Object.keys(CARDS), end: Object.keys(ENDS),
      stamp: ["cucumber", "basin", "book", "fist", "wave", "lamp"],
      cast: ["dad", "son", "teacher", "aunt", "girl"]
    }
  };
})();
</script>
<script data-src="src/story.js">
/* The story: a free adaptation of 大咕咕鸡's 「亲子贴：我的儿子王大锤」.
   Every line is {zh, en}; the engine picks one. The script is a flat list of steps:
   bg, show/hide, pose, say, choice, label, goto, set, if/unless, sfx, music,
   ambience, fx, stamp, wait, chapter, end. */

var STORY = (function () {
  "use strict";

  var CAST = {
    dad: { name: { zh: "我", en: "Me" }, art: "dad", mood: "tired" },
    son: { name: { zh: "王大锤", en: "Dachui" }, art: "son", mood: "deadpan" },
    teacher: { name: { zh: "马主任", en: "Mr. Ma" }, art: "teacher", mood: "pompous" },
    aunt: { name: { zh: "姑奶奶", en: "Great-Aunt" }, art: "aunt", mood: "sharp" },
    girl: { name: { zh: "小果", en: "Xiaoguo" }, art: "girl", mood: "annoyed" }
  };

  function n(zh, en) { return { say: null, text: { zh: zh, en: en } }; }
  function d(zh, en, mood) { return { say: "dad", text: { zh: zh, en: en }, mood: mood || "tired" }; }
  function s(zh, en, mood) { return { say: "son", text: { zh: zh, en: en }, mood: mood || "deadpan" }; }
  function m(zh, en, mood) { return { say: "teacher", text: { zh: zh, en: en }, mood: mood || "pompous" }; }
  function a(zh, en, mood) { return { say: "aunt", text: { zh: zh, en: en }, mood: mood || "sharp" }; }
  function g(zh, en, mood) { return { say: "girl", text: { zh: zh, en: en }, mood: mood || "annoyed" } }
  function o(zh, en) { return { text: { zh: zh, en: en } }; }

  var SCRIPT = [
    /* ---------------- 一 家长会 ---------------- */
    { chapter: "ch1", no: { zh: "一", en: "1" }, title: { zh: "家长会", en: "Parents" }, sub: { zh: "被请家长", en: "A summons" }, art: "card_gate" },
    { music: "title" },
    { bg: "school_gate" },
    n("不学好啊，头疼死了。上礼拜五，我又被请了家长。", "He's no good. It's a headache. Last Friday I was summoned to school again."),
    n("仗着自己头大，他在班里很嚣张。他威胁同桌，让人家顶盆，人家不干，他把人家的书包从三楼扔了出去，还说：小心点。", "He throws his big head around and acts tough in class. He threatened his deskmate, told her to wear the basin; she refused, so he threw her backpack out of a third-floor window and said: be careful."),
    n("书包挂在一棵槐树上，像一面旗。全校都看见了。", "The backpack hung in a locust tree like a flag. The whole school saw it."),
    { bg: "classroom" },
    { show: "right", who: "girl", mood: "annoyed" },
    g("王大锤，你有病吧？", "Dachui, are you sick?"),
    { show: "left", who: "son", mood: "defiant" },
    s("我没病。这是精神建设。", "I'm not sick. This is spiritual construction."),
    g("你再这样，我告诉我哥。", "Do that again and I'll tell my brother."),
    s("小心点。", "Be careful."),
    n("然后他把她的书包扔出了窗外。", "Then he threw her backpack out the window."),
    { hide: "left" },
    { hide: "right" },
    { bg: "office" },
    { show: "left", who: "dad", mood: "tired" },
    { show: "right", who: "teacher" },
    n("马主任训了我一个多小时。从家庭教育讲到民族未来，从民族未来讲到他自己的嗓子。", "Mr. Ma lectured me for over an hour: family education, the future of the nation, and then his own throat."),
    m("你儿子，脑子里全是些乱七八糟的东西。", "Your son's head is full of nonsense."),
    d("是是是。", "Yes. Yes."),
    m("他威胁同学，说“小心点”。这是黑社会口气！", "He threatened a classmate. \"Be careful,\" he said. That is gangster talk!"),
    d("是是是。", "Yes. Yes."),
    m("他还跟同学宣传什么“空想强身，发呆强国”。你说，这是什么话？", "He also tells classmates, \"Daydream to strengthen the body, stare into space to strengthen the nation.\" What kind of talk is that?"),
    m("还空想？你才多大就知道空想？这不神经病吗？以后能有什么出息。", "Daydream? How old are you? You know about daydreaming already? Is this some kind of sickness? What will become of you?", "angry"),
    d("……孩子小，不懂事。", "...He's young. He doesn't know better."),
    m("小？他都十一岁零三个月了！", "Young? He is eleven years and three months old!"),
    n("我不知道十一岁零三个月算不算小。我只知道，我三十七岁，坐在这把椅子上，像个犯错的学生。", "I don't know if eleven and three months counts as young. I only know that I am thirty-seven, sitting on this chair like a student in trouble."),
    { pose: "right", mood: "angry" },
    m("回去好好教育。下次再犯，记过。", "Go home and educate him. If it happens again, it goes on his record."),
    d("好，好。", "All right. All right."),
    { hide: "right" },
    { hide: "left" },
    n("我走出办公室，天已经黑了。楼道里有一股粉笔灰和拖把水的味道。", "When I came out of the office it was already dark. The corridor smelled of chalk dust and mop water."),
    { bg: "home_night" },
    { show: "left", who: "son", mood: "hurt" },
    n("我到家的时候，我儿子已经回来了。还挺坚强，一瘸一拐自己爬回来了，脸上有一块青。", "My son was already home. Tough kid: he had crawled back himself, limping, with a bruise on his face."),
    n("他没解释。我也没问。我们父子俩在这件事上有一种默契：谁先开口，谁就输了。", "He didn't explain. I didn't ask. We have an understanding about these things: whoever speaks first loses."),
    s("爸。", "Dad."),
    d("嗯。", "Mm."),
    s("我饿了。", "I'm hungry."),
    d("锅里有面。", "There's noodles in the pot."),
    n("他吃了两口，放下筷子，回屋了。门关得很轻。", "He ate two bites, put down his chopsticks, and went to his room. The door closed very softly."),
    n("我坐在客厅里，听见他在屋里走来走去，像一头关在笼子里的小兽。", "I sat in the living room and listened to him pace, like a small animal in a cage."),
    { fx: "shake" },
    n("后来我才知道，他在胡同里被同桌的哥哥堵了。初中排球队的，身高臂长，跳起来一米七。", "Later I learned that the deskmate's older brother had cornered him in the alley. A middle-school volleyball player, long arms, who could jump to one metre seventy."),
    n("我儿子一米三，跳起来一米三一。他不是对手。", "My son is one metre thirty. Jumping, one metre thirty-one. He was no match."),
    n("但他没哭。至少没让我看见。", "But he didn't cry. At least not where I could see."),
    { pose: "left", mood: "deadpan" },
    { choice: [
      { text: { zh: "骂他一顿", en: "Scold him" }, goto: "c1_harsh", set: "harsh" },
      { text: { zh: "问他疼不疼", en: "Ask if it hurts" }, goto: "c1_warm", set: "warm" },
      { text: { zh: "什么也不做", en: "Say nothing" }, goto: "c1_silent", set: "silent" }
    ] },

    { label: "c1_harsh" },
    { show: "left", who: "son", mood: "defiant" },
    { show: "right", who: "dad", mood: "angry" },
    d("你是不是有病？好好的书不念，去惹事！", "What is wrong with you? You should be studying, not picking fights!"),
    s("我没惹事。", "I didn't pick a fight."),
    d("你把人家书包扔楼下，还叫没惹事？", "You threw her backpack out the window. That's not picking a fight?"),
    s("她先不配合。", "She wouldn't cooperate first."),
    d("配合什么？", "Cooperate with what?"),
    s("精神建设。", "Spiritual construction."),
    d("……你给我睡觉。", "...Go to sleep."),
    n("他躺下了，背对着我。我站在门口，觉得自己像个傻子。", "He lay down with his back to me. I stood in the doorway feeling like a fool."),
    { hide: "right" },
    { goto: "c1_midnight" },

    { label: "c1_warm" },
    { show: "left", who: "son", mood: "hurt" },
    { show: "right", who: "dad", mood: "wry" },
    d("疼不疼？", "Does it hurt?"),
    s("不疼。", "No."),
    d("嘴硬。", "Tough guy."),
    s("真不疼。他跳起来一米七，打人没劲。", "Really. He jumped to one seventy, but he hits like a wet noodle."),
    n("我笑了一下。他也笑了一下，嘴角刚动，就疼得吸了口气。", "I laughed. He almost laughed too, then winced."),
    d("明天我带你去看看。", "I'll take you to the clinic tomorrow."),
    s("不用。我自己调理。", "No need. I'll regulate myself."),
    d("你怎么调理？", "How?"),
    s("吃黄瓜。", "Cucumbers."),
    n("我以为他在开玩笑。后来我发现，他是认真的。", "I thought he was joking. Later I learned he was serious."),
    { hide: "right" },
    { goto: "c1_midnight" },

    { label: "c1_silent" },
    { pose: "left", mood: "deadpan" },
    n("我把手放在门把上，站了很久。门里没有声音。", "I put my hand on the doorknob and stood there for a long time. There was no sound from inside."),
    n("我把手拿下来，回了客厅。", "I took my hand away and went back to the living room."),
    n("那天晚上，我第一次觉得，我可能不了解这个孩子。", "That night, for the first time, I thought I might not know this child at all."),
    { goto: "c1_midnight" },

    { label: "c1_midnight" },
    { hide: "left" },
    { bg: "kitchen_night" },
    { fx: "flicker" },
    n("半夜，我起来上厕所，看见厨房的灯亮着。", "In the middle of the night I got up to pee and saw the kitchen light on."),
    n("冰箱门开着。他站在冰箱前面，像一个在祭坛前的主祭。", "The fridge door was open. He stood in front of it like a priest at an altar."),
    { show: "left", who: "son", mood: "solemn" },
    n("两根黄瓜，一个西红柿，一杯酸奶，两个煮鸡蛋。", "Two cucumbers, one tomato, a cup of yogurt, two boiled eggs."),
    { stamp: "cucumber", label: { zh: "黄瓜", en: "Cuke" } },
    n("他吃得很慢，很认真，每一口都像在完成一个仪式。", "He ate slowly and seriously, each bite like part of a ceremony."),
    n("吃完，他走到院子当中，打了一套自创的拳，调理经脉。那是他自己编的，没有名字，动作古怪，但很有章法。", "Then he went out to the yard and did a set of punches he had invented himself, to regulate his meridians. It had no name, the movements were strange, but there was a system in them."),
    n("月光落在他的后背上，瘦，直，像一根钉子。", "Moonlight fell on his back: thin, straight, like a nail."),
    n("整个过程，他没有出声。表情肃穆。展示出一种未来国家栋梁的气质。", "He made no sound the whole time. His face was solemn. He had the air of a future pillar of the nation."),
    n("催人泪下。", "It made you want to cry."),
    { pose: "left", mood: "deadpan" },
    { choice: [
      { text: { zh: "出声问他", en: "Say something" }, goto: "c1_ask", set: "ask" },
      { text: { zh: "退回房间", en: "Go back to bed" }, goto: "c1_quiet", set: "quiet" },
      { text: { zh: "倒一杯水", en: "Leave water" }, goto: "c1_water", set: "water" }
    ] },

    { label: "c1_ask" },
    { show: "right", who: "dad", mood: "tired" },
    d("大锤。", "Dachui."),
    s("爸。", "Dad."),
    d("你不睡觉，在这儿干什么？", "Why are you up? What are you doing?"),
    s("调理经脉。", "Regulating my meridians."),
    d("什么经脉？", "What meridians?"),
    s("精神经脉。", "Spiritual meridians."),
    n("他说这话的时候，一点也没笑。我也没笑。我们俩站在月光里，像两个共谋者。", "He didn't smile when he said it. Neither did I. We stood in the moonlight like two conspirators."),
    { hide: "right" },
    { goto: "c1_end" },

    { label: "c1_quiet" },
    n("我退回了房间。我听见他打完最后一下，轻轻吐了一口气。", "I went back to my room. I heard him finish the last punch and let out a soft breath."),
    n("那一刻，我忽然不想知道他疼不疼了。我只想知道，他什么时候学会了一个人疼。", "At that moment I didn't want to know if it hurt. I wanted to know when he had learned to hurt alone."),
    { goto: "c1_end" },

    { label: "c1_water" },
    n("我倒了一杯温水，放在门槛上。", "I poured a glass of warm water and set it on the doorstep."),
    { pose: "left", mood: "solemn" },
    s("放那儿吧。", "Leave it there."),
    n("第二天早上，杯子空了。", "In the morning the glass was empty."),
    { goto: "c1_end" },

    { label: "c1_end" },
    { hide: "left" },
    n("我回屋躺下。天快亮了。我听见他在隔壁翻了个身，床板响了一声。", "I lay down. It was almost dawn. I heard him turn over in the next room; the bed frame creaked."),
    n("我想，明天得去趟学校，把书包取回来。", "I thought: tomorrow I should go to school and get that backpack back."),

    /* ---------------- 二 全校大会 ---------------- */
    { chapter: "ch2", no: { zh: "二", en: "2" }, title: { zh: "全校大会", en: "Assembly" }, sub: { zh: "少年强则中国强", en: "One Monday" }, art: "card_podium" },
    { music: "school" },
    { bg: "schoolyard" },
    n("不容易啊！我儿子。身在茅草屋，心怀凌云志，放眼全球。", "It isn't easy, my son. A thatched hut, a sky-high ambition, and the whole world in his sights."),
    n("个子不高——一米三，跳起来一米三一；年纪轻——十一岁零三个月；但个性坚强，成熟，心理素质过硬。", "Not tall — one metre thirty, one metre thirty-one jumping. Young — eleven years and three months. But tough, mature, and mentally unmovable."),
    n("他坚信：精神力量统治一切。肉体是次要的。空想强身，发呆强国。他坚信，中华民族会在他们这一代实现伟大复兴。", "He believes spiritual power rules everything. The body is secondary. Daydream to strengthen the body, stare into space to strengthen the nation. He believes the Chinese nation will achieve its great renewal in his generation."),
    n("三年级那次全校大会，他第一次提出自己的观点：少年强则中国强，祖国的未来始终掌握在年轻人手里。", "At the third-grade assembly he first put forward his view: a strong youth makes a strong China, and the future of the country is always in young hands."),
    n("他主张同学们通过合理的手段，比如空想、顶盆，调节自身状况，以达到一种平衡，震惊了全校。", "He proposed that students use reasonable means — daydreaming, wearing a basin — to regulate themselves and reach a balance. The school was shocked."),
    n("当时的年级主任说：还空想？你才多大就知道空想？这不神经病吗？以后能有什么出息。", "The year head said: Daydream? How old are you? Is this some kind of sickness? What will become of you?"),
    n("书包的事还没完，学校又开全校大会。站在台下，我想起他三年级那次发言。", "The backpack business wasn't over, and the school held another assembly. Standing below the podium, I thought of his third-grade speech."),
    n("每个星期一，建设路小学都要开全校大会。升旗，唱国歌，然后听校长讲话。", "Every Monday, Jianshe Road Primary held an assembly. Flag-raising, the anthem, then the principal's speech."),
    n("那个星期一，校长讲完，马主任上台。他讲卫生，讲纪律，讲早恋的危害。", "That Monday, after the principal, Mr. Ma took the podium. He talked about hygiene, discipline, and the dangers of puppy love."),
    n("讲完，他问：还有哪位同学要发言？", "When he finished, he asked: does any student wish to speak?"),
    n("我儿子举手了。", "My son raised his hand."),
    { show: "left", who: "teacher" },
    { show: "right", who: "son", mood: "defiant" },
    n("他从最后一排走到台上，个子太矮，话筒要往下掰一大截。", "He walked up from the back row. He was so short that he had to pull the microphone down a long way."),
    s("我想说两句。", "I want to say a few things."),
    n("台下笑成一片。", "The yard laughed."),
    s("我认为，精神力量统治一切。", "I believe spiritual power rules everything."),
    n("笑声小了一点。", "The laughter quieted a little."),
    s("肉体是次要的。打拳是次要的。", "The body is secondary. Punching is secondary."),
    n("他本来想说什么，我不知道。他改了口。", "I don't know what he had meant to say. He changed his words."),
    s("我们这一代人，最大的问题，是精神缺钙。", "The biggest problem for our generation is spiritual calcium deficiency."),
    n("台下安静了。", "The yard went quiet."),
    s("我建议，同学们每天空想十分钟。空想强身，发呆强国。", "I suggest every student daydream for ten minutes a day. Daydream to strengthen the body, stare into space to strengthen the nation."),
    n("这一下，连校长都抬起了头。", "Even the principal looked up."),
    { pose: "left", mood: "shock" },
    m("你说什么？空想强国？", "What did you say? Daydream to strengthen the nation?"),
    s("对。空想是科学宣泄压力的一种方式。自古以来，盛行不衰，为多少年轻人解决了苦闷。", "Yes. Daydreaming is a scientific way to release pressure. It has flourished since ancient times and has solved the sorrow of countless young people."),
    m("你才多大？你知道什么叫苦闷？", "How old are you? What do you know about sorrow?"),
    s("我知道。我同桌不让我顶盆，我就很苦闷。", "I know. My deskmate won't let me wear a basin, and I am very sorrowful."),
    n("台下爆笑。", "The yard exploded."),
    { pose: "left", mood: "angry" },
    m("顶盆？顶什么盆？", "A basin? What basin?"),
    s("搪瓷盆。顶在头上，一站就是一节课。这叫精神建设。", "An enamel basin. On your head, for a whole class. That is spiritual construction."),
    m("胡闹！你这是神经病！", "Nonsense! You're out of your mind!"),
    n("我儿子不卑不亢，立刻就反问。", "My son was neither cowed nor arrogant. He shot back at once."),
    s("马老师，我没有神经病。", "Mr. Ma, I am not out of my mind."),
    n("他停了一下。台下几千双眼睛看着他。他一点也不慌。", "He paused. Thousands of eyes watched him. He was not nervous at all."),
    s("马老师，别装大尾巴狼了。恕我直言，你今年三十七岁，至今未婚，没有女朋友。你混得一泡污，没人请你桑拿。", "Don't play the wise old wolf, Mr. Ma. With respect: you are thirty-seven, unmarried, no girlfriend. Your life is a mess, and nobody invites you to the sauna."),
    n("马主任的脸，从红变成了白。", "Mr. Ma's face went from red to white."),
    s("如果你连空想都没有，我怀疑你身体有毛病。", "If you don't even daydream, I suspect there is something wrong with your body."),
    n("台下先是死寂，然后炸了。", "First dead silence. Then the yard erupted."),
    n("那天之后，我儿子成了校园风云人物。高年级的同学管他叫“锤哥”，也有人叫他“王空想”。", "After that day my son was a campus celebrity. Older students called him Brother Hammer, or Wang Daydream."),
    n("随着时间流逝，他的头越来越大，体格越来越健壮，叫的人就少了。", "As time passed his head grew bigger and his body stronger, and fewer people called him names."),
    { pose: "right", mood: "smug" },
    { choice: [
      { text: { zh: "站起来鼓掌", en: "Stand and clap" }, goto: "c2_stood", set: "stood" },
      { text: { zh: "装作不认识", en: "Look away" }, goto: "c2_ashamed", set: "ashamed" },
      { text: { zh: "把他拽下来", en: "Drag him off" }, goto: "c2_dragged", set: "dragged" }
    ] },

    { label: "c2_stood" },
    { hide: "left" },
    n("我站了起来，鼓了掌。全场只有我一个人鼓掌。", "I stood up and clapped. I was the only one clapping."),
    n("掌声在操场上空飘了一会儿，像一只找不到落点的鸟。", "The applause drifted over the yard like a bird that couldn't find a place to land."),
    n("我儿子在台上看见了我。他没有笑。他只是把腰挺得更直了一点。", "My son saw me on the podium. He didn't smile. He just straightened his back a little more."),
    { goto: "c2_after" },

    { label: "c2_ashamed" },
    { hide: "left" },
    n("我低下头，盯着自己的鞋。鞋上有一块泥。", "I looked down at my shoes. There was mud on one of them."),
    n("我想，这块泥比我干净。", "I thought: that mud is cleaner than I am."),
    n("散会的时候，我听见旁边两个家长说：这谁家的孩子，真没教养。", "As the assembly broke up, I heard two parents say: whose child is that? No manners at all."),
    n("我没回头。", "I didn't turn around."),
    { goto: "c2_after" },

    { label: "c2_dragged" },
    { hide: "left" },
    { fx: "shake" },
    n("我冲上台，抓住他的胳膊。他挣了一下，没挣开。", "I ran onto the podium and grabbed his arm. He struggled once, then stopped."),
    d("下来！丢人现眼！", "Get down! You're making a spectacle of yourself!"),
    s("我不丢人。我说的是真话。", "I'm not a spectacle. I told the truth."),
    n("我把他拽下台。他的鞋掉了一只。他光着一只脚，走完了整个操场。", "I dragged him down. One of his shoes came off. He walked the whole yard with one bare foot."),
    n("那天晚上，他没有吃饭。", "That night he didn't eat."),
    { goto: "c2_after" },

    { label: "c2_after" },
    { hide: "right" },
    { bg: "bedroom" },
    n("从那以后，他话更少了。每天放学，他把自己关在屋里。", "After that he spoke even less. Every day after school he shut himself in his room."),
    n("由于身高一直没有起色，我儿子想了很多办法：每天吃三个生鸡蛋，练习引体向上，和保定的姑奶奶学习拳法。", "Because his height never improved, my son tried many things: three raw eggs a day, pull-ups, and boxing lessons from his great-aunt in Baoding."),
    n("他的话越来越少，大量地阅读书籍。", "He spoke less and less, and read a great deal."),
    n("他读《隋唐演义》，读《沙漠之狐隆美尔》，读《铁血首相》，读《燕子李三》，读《青海回族民间故事集》。", "He read Tales of Sui and Tang, Rommel the Desert Fox, The Iron Chancellor, Swallow Li San, and a collection of Hui folktales from Qinghai."),
    n("每天放学后，他在铁马论坛、强国角、大河网跟网友辩论。经常在屋子里自言自语，转圈，时而沉思，时而骂娘，显示出一种甲亢的早期症状。", "Every day after school he argued with strangers on the Iron Horse forum, the Strong Nation Corner, the Great River boards. He often talked to himself and paced, now thoughtful, now cursing — early symptoms of hyperthyroidism."),
    n("我一度怀疑他甲亢。带去医院查了，各项指标正常。", "For a while I suspected hyperthyroidism. I took him to the hospital. Every test came back normal."),
    n("医生说：这孩子，精神头真足。", "The doctor said: this child has a remarkable amount of spirit."),
    n("我说：能不精神吗。", "I said: you can say that again."),
    n("医生说：什么？", "The doctor said: what?"),
    n("我说：没什么。", "I said: nothing."),
    { stamp: "book", label: { zh: "书", en: "Books" } },
    n("他的个子还是没长。一米三。跳起来一米三一。", "He still didn't grow. One thirty. Jumping, one thirty-one."),
    n("他还在墙上钉了一个钉子，挂一只米袋，当沙包。", "He also nailed a hook into the wall, hung a rice sack from it, and used it as a punching bag."),
    n("米袋上写着一个字：马。", "On the sack he had written one word: Ma."),
    { fx: "flicker" },

    /* ---------------- 三 顶盆 ---------------- */
    { chapter: "ch3", no: { zh: "三", en: "3" }, title: { zh: "顶盆", en: "The Basin" }, sub: { zh: "精神力量", en: "A basin" }, art: "card_basin" },
    { music: "title" },
    { bg: "classroom" },
    n("那段时间，王大锤频繁地在学校做出一些出人意料的举动。", "Around that time Wang Dachui kept doing unexpected things at school."),
    n("有一次，他把一个搪瓷脸盆顶在头顶去上学，坚持了一个上午。", "Once he wore an enamel basin to school and kept it on all morning."),
    n("顶盆的事，是从班里开始的。", "The basin business started in his class."),
    n("有一天，他站起来，对全班同学说：我提议，每人顶盆一节课。", "One day he stood up and said to the class: I propose that everyone wear a basin for one lesson."),
    n("教室里安静了三秒。然后有人说：你有病吧？", "The room was quiet for three seconds. Then someone said: are you sick?"),
    { show: "left", who: "son", mood: "solemn" },
    s("我没病。顶盆可以集中精神，锻炼颈椎，培养责任感。", "I'm not sick. A basin concentrates the mind, exercises the neck, and cultivates responsibility."),
    n("没人理他。", "Nobody paid attention."),
    n("第二天，他带来了一只搪瓷盆。白底，蓝边，盆底有一朵褪色的牡丹。", "The next day he brought an enamel basin. White with a blue rim, a faded peony at the bottom."),
    { bg: "basin_closeup" },
    { stamp: "basin", label: { zh: "盆", en: "Basin" } },
    n("他把盆顶在头上，走进教室，上了一上午的课。", "He put it on his head, walked into class, and wore it all morning."),
    n("语文老师让他把盆摘下来。他说：老师，我在进行精神建设。", "The Chinese teacher told him to take it off. He said: Teacher, I am engaged in spiritual construction."),
    n("语文老师说：你建设你的，别挡着我看黑板。", "The teacher said: construct all you like, but don't block the blackboard."),
    n("他就把盆往上挪了挪，露出两只眼睛。", "So he pushed it up a little and showed his eyes."),
    { bg: "classroom" },
    n("下课以后，隔壁班的同学趴在窗户上看。他顶着盆，去操场走了一圈。", "After class, students from the next room pressed against the windows. He walked a lap of the playground with the basin on his head."),
    n("有人笑，有人拍照，有人骂他神经病。他都听不见。盆把他的耳朵罩住了。", "Some laughed, some took photos, some called him crazy. He couldn't hear them. The basin covered his ears."),
    n("马主任又把我请去了学校。", "Mr. Ma summoned me again."),
    { choice: [
      { text: { zh: "把盆摘下来", en: "Take it off" }, goto: "c3_remove", set: "basin_remove" },
      { text: { zh: "让他顶着，我在门口等", en: "Let him wear it" }, goto: "c3_allow", set: "basin_allow" },
      { text: { zh: "买一个更大的盆给他", en: "Buy a bigger one" }, goto: "c3_bigger", set: "basin_bigger" }
    ] },

    { label: "c3_remove" },
    n("我把盆从他头上摘下来。盆沿在他额头上留下一圈红印。", "I took the basin off his head. It left a red ring on his forehead."),
    d("别顶了。", "Stop wearing it."),
    s("为什么？", "Why?"),
    d("丢人。", "It's embarrassing."),
    s("丢谁的人？", "Whose embarrassment?"),
    n("我没答上来。他接过盆，抱在怀里，像抱着一面盾。", "I couldn't answer. He took the basin and held it like a shield."),
    { goto: "c3_door" },

    { label: "c3_allow" },
    n("我跟马主任说：孩子喜欢，就让他顶两天吧。", "I told Mr. Ma: he likes it. Let him wear it for a couple of days."),
    n("马主任看了我半天，说：你们家，都有病。", "Mr. Ma stared at me for a long time, then said: your whole family is sick."),
    n("我在校门口等他放学。他顶着盆出来，夕阳照在盆沿上，亮得刺眼。", "I waited at the gate after school. He came out with the basin on his head; the setting sun flashed off its rim."),
    n("他走到我面前，说：爸，你今天没骂我。", "He walked up and said: Dad, you didn't scold me today."),
    d("我今天不想骂。", "I don't feel like scolding today."),
    s("为什么？", "Why?"),
    d("因为你顶着盆，我看不见你的脸。", "Because with that basin on, I can't see your face."),
    { goto: "c3_door" },

    { label: "c3_bigger" },
    n("我去了趟日杂店，买了一只更大的盆。", "I went to the housewares shop and bought a bigger basin."),
    n("售货员问我：要这么大的盆干什么？", "The assistant asked: what do you need such a big basin for?"),
    d("给孩子。", "For my kid."),
    n("售货员说：你家孩子，头不小啊。", "The assistant said: your kid must have a big head."),
    d("嗯，精神头足。", "Mm. Plenty of spirit."),
    n("我把大盆递给他。他愣了一下，接过去，顶在头上。盆太大了，一直往下滑。", "I handed him the big basin. He paused, took it, and put it on. It was so big it kept sliding down."),
    { show: "left", who: "son", mood: "smug" },
    s("爸，这个盆，有力量。", "Dad, this basin has power."),
    d("什么力量？", "What power?"),
    s("父爱的力量。", "The power of fatherly love."),
    n("我差点一脚踹过去。", "I almost kicked him."),
    { goto: "c3_door" },

    { label: "c3_door" },
    { hide: "left" },
    { bg: "home_night" },
    n("那段时间，他迷上了“爸，你来”。", "Around that time he became obsessed with \"Dad, come out here.\""),
    { show: "left", who: "son", mood: "deadpan", basin: true },
    { show: "right", who: "dad", mood: "tired" },
    s("爸，你来！", "Dad, come out!"),
    n("我出去，问：干什么？", "I went out. What?"),
    s("没事儿。", "Nothing."),
    n("我回去。过了一会儿，他又喊：爸，你来！", "I went back in. A while later: Dad, come out!"),
    n("我出去，问：干什么？", "I went out. What?"),
    s("没事儿。", "Nothing."),
    n("我回去。过了一会儿，他又喊：爸，你来！", "I went back in. A while later: Dad, come out!"),
    n("我出去，问：干什么？", "I went out. What?"),
    s("没事儿。", "Nothing."),
    n("我回去。过了一会儿，他又喊：爸，你来！", "I went back in. A while later: Dad, come out!"),
    n("我出去，说：你有病啊？", "I went out and said: what is wrong with you?"),
    s("我没病。", "Nothing is wrong with me."),
    d("没病你嗷嗷喊什么？有完没完？", "Then why are you yelling? Are you done?", "angry"),
    s("mind-hammer，爸。我想你更深刻地感受这种力量。", "Mind-hammer, Dad. I want you to feel this power more deeply."),
    d("你他妈有病！", "You're out of your damn mind!", "angry"),
    s("没有。我没病。", "No. I'm not."),
    d("你绝对有病。脑子有病。", "You are definitely sick. In the head.", "angry"),
    s("没有。我没病。", "No. I'm not."),
    n("整个对话过程中，他一直顶着一只搪瓷盆。", "Through the whole conversation he wore the enamel basin."),
    { fx: "flicker" },
    n("我看着他，忽然觉得，他不是在恶作剧。他是真的想让我感受点什么。", "Looking at him, I suddenly felt he wasn't playing a prank. He really wanted me to feel something."),
    n("可我不知道那是什么。", "I just didn't know what."),
    { hide: "right" },
    { pose: "left", mood: "deadpan" },
    { choice: [
      { text: { zh: "转身回屋", en: "Ignore him" }, goto: "c3_refuse", set: "basin_refuse" },
      { text: { zh: "接过盆，顶在头上", en: "Wear it yourself" }, goto: "c3_self", set: "basin_self" },
      { text: { zh: "什么力量？", en: "Ask: what power?" }, goto: "c3_ask", set: "basin_ask" }
    ] },

    { label: "c3_refuse" },
    n("我转身回屋，把门关上。他在外面站了一会儿，没有再喊。", "I turned and shut the door. He stood outside for a while and didn't call again."),
    n("我从窗户里看见，他把盆摘下来，抱在怀里，蹲在台阶上。", "Through the window I saw him take the basin off, hug it, and squat on the step."),
    n("月光把他的影子拉得很长。那影子顶着一只盆。", "Moonlight stretched his shadow long. The shadow wore a basin."),
    { goto: "c3_end" },

    { label: "c3_self" },
    n("我把盆接过来，扣在自己头上。盆很凉，有一股铁锈味。", "I took the basin and put it on my head. It was cold and smelled of rust."),
    { show: "left", who: "son", mood: "smile", basin: true },
    { show: "right", who: "dad", mood: "wry", basin: true },
    n("我儿子看着我，眼睛亮了。", "My son looked at me. His eyes lit up."),
    s("爸，你感觉到了吗？", "Dad, do you feel it?"),
    n("我什么也没感觉到。我只听见自己的呼吸，在盆里来回撞。", "I felt nothing. I only heard my own breath bouncing around inside the basin."),
    d("感觉到了。", "Yes."),
    s("什么感觉？", "What does it feel like?"),
    d("像一口锅。", "Like a wok."),
    s("不对。是力量。", "No. It's power."),
    n("我没反驳。我顶着盆，在院子里走了两圈。邻居家的狗叫了一晚上。", "I didn't argue. I walked two laps of the yard with the basin on my head. The neighbours' dog barked all night."),
    { hide: "right" },
    { goto: "c3_end" },

    { label: "c3_ask" },
    { show: "right", who: "dad", mood: "tired" },
    s("爸，其实我根本不想让他们顶盆。是这样的，我根本没兴趣。", "Dad, I don't really want them to wear the basin. The truth is, I'm not interested."),
    s("我就是想展示出一种力量。mind-hammer。一种强大的精神力量。", "I just want to show a kind of power. Mind-hammer. A powerful spiritual force."),
    s("我希望能唤起我们这一代青年人的责任感。", "I hope to wake up a sense of responsibility in our generation."),
    d("什么力量？", "What power?"),
    s("精神力量。", "Spiritual power."),
    d("精神力量能干什么？", "What can spiritual power do?"),
    s("能让你在挨揍以后，自己爬起来。", "It can make you get up by yourself after a beating."),
    n("我愣住了。", "I froze."),
    s("能让你在别人都说你疯了的时候，还知道自己没疯。", "It can keep you knowing you're not crazy when everyone says you are."),
    n("他看着我，一字一句地说：能让你，不认输。", "He looked at me and said, word by word: it can keep you from surrendering."),
    n("那天晚上，我第一次觉得，那只盆不是个笑话。", "That night, for the first time, I felt the basin was not a joke."),
    { hide: "right" },
    { goto: "c3_end" },

    { label: "c3_end" },
    { hide: "left" },
    n("第二天，他把盆擦得很干净，放在床头。", "The next day he wiped the basin clean and put it by his bed."),
    n("盆底那朵牡丹，比昨天清楚了一点。", "The peony at the bottom looked a little clearer than the day before."),

    /* ---------------- 四 姑奶奶 ---------------- */
    { chapter: "ch4", no: { zh: "四", en: "4" }, title: { zh: "姑奶奶", en: "Great-Aunt" }, sub: { zh: "保定，一个夏天", en: "One summer" }, art: "card_courtyard" },
    { music: "title" },
    { bg: "baoding" },
    n("暑假，我带他回了保定。", "That summer I took him back to Baoding."),
    n("保定有我一个姑奶奶。按辈分，他得叫太姑奶奶。老太太七十多了，个子不到一米五，年轻时在纺织厂上班，退休以后在公园教人打拳。", "I have a great-aunt in Baoding. By the family tree he had to call her Great-Great-Aunt. She was over seventy, under one metre fifty, had worked in a textile mill, and after retiring taught boxing in the park."),
    n("她练的是形意拳，也会几手保定快跤。公园里那帮老头，没人是她的对手。", "She practised Xingyi boxing and knew a few holds of Baoding fast wrestling. None of the old men in the park could take her."),
    { show: "left", who: "aunt" },
    { show: "right", who: "son", mood: "solemn" },
    a("这孩子，骨头硬。", "This child has hard bones."),
    d("硬什么，犟。", "Hard? Stubborn."),
    a("犟也是硬。骨头硬，心也硬，是块料。", "Stubborn is also hard. Hard bones, hard heart. He'll do."),
    n("她让我儿子站桩。两脚分开，膝盖弯曲，双手抱球，一站就是半小时。", "She made him stand in a post stance: feet apart, knees bent, arms around an invisible ball. Half an hour."),
    n("我儿子站了十分钟，腿开始抖。老太太拿一根柳条，在他腿弯上敲了一下。", "After ten minutes his legs began to shake. She tapped the back of his knee with a willow switch."),
    a("别抖。抖了，力气就散了。", "Don't shake. If you shake, the strength scatters."),
    s("太姑奶奶，我腿酸。", "Great-Great-Aunt, my legs ache."),
    a("酸就对了。力气是借来的，得还。", "Good. Strength is borrowed. It has to be repaid."),
    { hide: "left" },
    { hide: "right" },
    n("那个夏天，他每天早上五点起来，站桩，打拳，搬水。院子里的水缸，他一个人搬来搬去。", "That summer he got up at five every morning: stance, boxing, carrying water. He moved the courtyard's water vat by himself, back and forth."),
    n("他晒黑了，也长高了一点。一米三二。", "He got dark, and a little taller. One metre thirty-two."),
    n("他高兴坏了，在墙上画了一道线，写：一米三二。", "He was delighted. He drew a line on the wall and wrote: 1.32 m."),
    { show: "left", who: "aunt" },
    a("你画这个干什么？", "What are you drawing that for?"),
    s("记录成长。", "To record my growth."),
    a("成长不在墙上。在腿上。", "Growth isn't on the wall. It's in the legs."),
    { hide: "left" },
    n("她教他一套拳。拳没有名字，只有几个动作：进步，退步，转身，发力。", "She taught him a set. It had no name, only a few movements: step in, step back, turn, release."),
    n("她说：记住，力从地起，经腰，过肩，到拳。别用蛮力。", "She said: remember, power starts in the ground, goes through the waist, over the shoulder, into the fist. Don't use brute force."),
    n("我儿子练得很认真。有一次，他一拳打在院里的沙袋上，沙袋飞了出去，挂在葡萄架上。", "He trained seriously. Once he hit the sandbag in the yard and it flew off and hung in the grape trellis."),
    n("老太太笑了。那是我第一次看见她笑。", "The old woman laughed. It was the first time I had seen her laugh."),
    a("有点意思。", "Not bad."),
    { choice: [
      { text: { zh: "下场扎马步", en: "Train too" }, goto: "c4_trained", set: "trained" },
      { text: { zh: "坐在树下看", en: "Watch" }, goto: "c4_watched", set: "watched_again" },
      { text: { zh: "说单位有事，先回去", en: "Leave early" }, goto: "c4_left", set: "left_early" }
    ] },

    { label: "c4_trained" },
    n("我脱下外套，下场扎马步。不到三分钟，我的腿就开始抖。", "I took off my jacket and got into a horse stance. In under three minutes my legs were shaking."),
    { show: "right", who: "son", mood: "solemn" },
    s("爸，别抖。抖了，力气就散了。", "Dad, don't shake. If you shake, the strength scatters."),
    n("我咬着牙，又站了七分钟。站起来的时候，膝盖像被人拆了。", "I gritted my teeth and held for seven more minutes. When I stood up, my knees felt dismantled."),
    { show: "left", who: "aunt" },
    a("还行。比你儿子差一点。", "Not bad. A little worse than your son."),
    { hide: "left" },
    { hide: "right" },
    n("那天晚上，我躺在床上，腿疼得睡不着。我儿子端了一盆热水进来，放在我脚边。", "That night I lay in bed, my legs aching too much to sleep. My son carried in a basin of hot water and set it by my feet."),
    { show: "right", who: "son", mood: "deadpan" },
    s("泡脚。活血。", "Soak your feet. Move the blood."),
    n("他把我的脚按进水里。水很烫。我没说话。他也没说话。", "He pushed my feet into the water. It was very hot. I said nothing. He said nothing."),
    { goto: "c4_end" },

    { label: "c4_watched" },
    n("我坐在树下，抽烟，看他们练。老太太教得很慢，一个动作能纠半天。", "I sat under the tree, smoking, watching. The old woman taught slowly; one movement could take half a day to correct."),
    n("我儿子学得也很慢，但他不烦。他一遍一遍地做，错了就重来。", "My son learned slowly too, but he never got impatient. He did it again and again, and started over when he got it wrong."),
    n("我忽然想起他小时候学走路。摔倒了，爬起来，再摔倒，再爬起来。那时候我觉得他笨。", "I suddenly remembered him learning to walk. He fell, got up, fell again, got up again. Back then I thought he was clumsy."),
    n("现在我才知道，那不是笨。那是犟。", "Now I know it wasn't clumsiness. It was stubbornness."),
    { goto: "c4_end" },

    { label: "c4_left" },
    n("我说单位有事，提前带他回去。他收拾东西的时候，老太太把他叫到一边，说了几句话。", "I said I had work and took him back early. While he packed, the old woman called him aside and said a few words."),
    n("我问他：太姑奶奶说什么了？", "I asked: what did Great-Great-Aunt say?"),
    { show: "right", who: "son", mood: "solemn" },
    s("她说，力气是借来的，得还。", "She said strength is borrowed, and has to be repaid."),
    d("还有呢？", "And?"),
    s("她说，你爸不容易。", "She said: your dad has it hard."),
    n("我没说话。火车开动的时候，我看见老太太站在站台上，越来越小，像一颗钉子。", "I said nothing. As the train pulled out I saw the old woman on the platform, smaller and smaller, like a nail."),
    { goto: "c4_end" },

    { label: "c4_end" },
    { hide: "right" },
    { hide: "left" },
    { bg: "baoding_night" },
    n("临走前一晚，他在院子里打了一套拳。月光很好，葡萄架的影子落在地上，像一张网。", "The night before we left, he did his set in the courtyard. The moonlight was good; the shadow of the grape trellis lay on the ground like a net."),
    { show: "left", who: "aunt" },
    n("老太太坐在门口，抽旱烟。她忽然说：这孩子，心里有事。", "The old woman sat in the doorway smoking. She said: this child has something on his mind."),
    d("他能有什么事？十一岁。", "What could he have on his mind? He's eleven."),
    a("十一岁的事，就不是事？", "An eleven-year-old's troubles aren't troubles?"),
    n("我答不上来。", "I had no answer."),
    a("你别老拿他当小孩。他比你干净。", "Stop treating him like a child. He's cleaner than you."),
    n("那天晚上，我儿子打完拳，站在院子当中，很久没有动。", "That night, after his set, my son stood in the middle of the courtyard and didn't move for a long time."),
    n("他的影子投在墙上，很大，比他本人大多了。", "His shadow fell on the wall. It was huge, much bigger than he was."),
    { stamp: "fist", label: { zh: "拳", en: "Fist" } },

    /* ---------------- 五 浪潮 ---------------- */
    { chapter: "ch5", no: { zh: "五", en: "5" }, title: { zh: "浪潮", en: "The Wave" }, sub: { zh: "时代步伐不可阻挡", en: "The tide" }, art: "card_wave" },
    { music: "alley" },
    { bg: "wall_night" },
    n("从保定回来，他长高了一厘米，话还是那么少。", "We came back from Baoding. He was one centimetre taller and spoke just as little."),
    n("有一天晚上，我喝大了。回来的路上，我扶着墙放水。", "One night I got very drunk. On the way home I leaned against a wall to pee."),

 * This file plays the script, draws the box and the menus, saves the run,
