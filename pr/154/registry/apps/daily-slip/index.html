<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>每日一签</title>
<!-- Lo-PDA app (lopda/1): draw one slip a day and save it to the notes with PAD.notes.append.
     The title is kept the same so one note keeps collecting each day's fortune in the app's own section.
     MIT License. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a3ad7e; color: #1f2a14; font-family: monospace; }
  body { display: flex; flex-direction: column; }
  header { flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 8px 12px 7px; border-bottom: 2px solid #1f2a14; }
  header b { font-size: 17px; letter-spacing: 3px; }
  #today { flex: none; font-size: 13px; line-height: 1; color: #4a5a32; letter-spacing: 1px; }
  main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px 10px 6px; box-sizing: border-box; }
  #stage { flex: 0 0 auto; width: 100%; display: flex; align-items: center; justify-content: center; }

  /* The cup: bamboo sticks in a dark cup. The idle sway and the rattle are separate
     transforms on two nested boxes, so drawing one never disturbs the other. */
  #cup { position: relative; flex: none; width: 180px; height: 172px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #cup:active { transform: translateY(1px); }
  .cup-idle { position: absolute; left: 0; right: 0; top: 0; height: 152px; animation: idle 5s ease-in-out infinite; will-change: transform; }
  .cup-shadow { position: absolute; left: 44px; bottom: 4px; width: 92px; height: 9px; background: #4a5a32; border-radius: 50%; }
  .cup-body { position: absolute; left: 38px; bottom: 12px; width: 104px; height: 82px; box-sizing: border-box; border: 3px solid #1f2a14; border-radius: 5px 5px 28px 28px / 5px 5px 34px 34px; background: #7d8a58; box-shadow: inset 0 -13px 0 #4a5a32; }
  .cup-rim { position: absolute; left: 28px; bottom: 94px; width: 124px; height: 17px; box-sizing: border-box; border: 3px solid #1f2a14; border-radius: 9px; background: #a3ad7e; }
  .cup-rim::after { content: ""; position: absolute; left: 5px; right: 5px; top: 4px; height: 2px; background: #4a5a32; }
  .sticks { position: absolute; left: 50%; bottom: 24px; width: 100px; height: 112px; margin-left: -50px; }
  .stick { --swing: 3.5deg; --sway: 1.6deg; position: absolute; bottom: 0; width: 9px; box-sizing: border-box; border: 2px solid #1f2a14; border-radius: 3px 3px 2px 2px; background: #a3ad7e; transform-origin: 50% 100%; transform: rotate(var(--r)); animation: sway 5s ease-in-out var(--d) infinite; }
  .stick::after { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: #4a5a32; }
  /* The outer sticks lean against the rim, so they sway and rattle less; even at their
     widest they stay inside the rim's inner edge (31-149 from the cup's left edge). */
  .s1 { left: 10px; height: 110px; --r: -6deg; --d: -0.4s; --swing: 1.4deg; --sway: 0.8deg; }
  .s2 { left: 24px; height: 96px; --r: 4deg; --d: -1.9s; --swing: 2.6deg; --sway: 1.2deg; }
  .s3 { left: 38px; height: 124px; --r: -2deg; --d: -3.1s; }
  .s4 { left: 49px; height: 106px; --r: 1deg; --d: -0.9s; }
  .s5 { left: 61px; height: 118px; --r: 5deg; --d: -2.5s; }
  .s6 { left: 75px; height: 102px; --r: -4deg; --d: -4.2s; --swing: 2.6deg; --sway: 1.2deg; }
  .s7 { left: 87px; height: 108px; --r: 3.5deg; --d: -1.2s; --swing: 1.4deg; --sway: 0.8deg; }
  #hero { position: absolute; left: 50%; bottom: 24px; width: 10px; height: 128px; margin-left: -5px; box-sizing: border-box; border: 2px solid #1f2a14; border-radius: 3px 3px 2px 2px; background: #a3ad7e; transform-origin: 50% 100%; opacity: 0; }
  #hero::after { content: ""; position: absolute; left: 0; right: 0; top: 11px; height: 2px; background: #4a5a32; }
  .cup-hint { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 13px; color: #4a5a32; letter-spacing: 1px; }
  body.has-slip #cup { display: none; }

  #cup.shake .cup-idle { animation: cupShake 0.82s ease-in-out; }
  #cup.shake .stick { animation: rattle 0.13s linear infinite; }
  #cup.shake .s2, #cup.shake .s5 { animation-delay: -0.06s; }
  #cup.shake .s3, #cup.shake .s6 { animation-delay: -0.09s; }
  #cup.lift .cup-idle { animation: cupSink 0.62s ease-in forwards; }
  #cup.lift #hero { opacity: 1; animation: heroLift 0.62s cubic-bezier(0.16, 0.7, 0.25, 1) forwards; }

  @keyframes idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes sway { 0%, 100% { transform: rotate(var(--r)); } 50% { transform: rotate(calc(var(--r) + var(--sway))); } }
  @keyframes cupShake {
    0%, 100% { transform: translateX(0) rotate(0); }
    8% { transform: translateX(-5px) rotate(-1.3deg); }
    18% { transform: translateX(6px) rotate(1.3deg); }
    28% { transform: translateX(-6px) rotate(-1.1deg); }
    38% { transform: translateX(5px) rotate(1.1deg); }
    48% { transform: translateX(-5px) rotate(-0.9deg); }
    58% { transform: translateX(4px) rotate(0.9deg); }
    68% { transform: translateX(-4px) rotate(-0.7deg); }
    78% { transform: translateX(3px) rotate(0.7deg); }
    88% { transform: translateX(-2px) rotate(-0.4deg); }
    94% { transform: translateX(2px) rotate(0.4deg); }
  }
  @keyframes rattle {
    0%, 100% { transform: rotate(var(--r)); }
    30% { transform: rotate(calc(var(--r) - var(--swing))); }
    65% { transform: rotate(calc(var(--r) + var(--swing))); }
  }
  @keyframes cupSink { to { transform: translateY(9px) scale(0.94); opacity: 0; } }
  @keyframes heroLift {
    0% { transform: translateY(0) rotate(0); opacity: 1; }
    55% { opacity: 1; }
    100% { transform: translateY(-86px) rotate(9deg); opacity: 0; }
  }

  /* The paper slip: a double rule, a seal for the grade, three lines of verse. It opens
     from the middle like a stick being unrolled, and the lines follow one another. */
  #slip { display: none; position: relative; width: 100%; max-width: 300px; box-sizing: border-box; padding: 11px 13px 12px; background: #a3ad7e; border: 3px solid #1f2a14; box-shadow: 4px 4px 0 #4a5a32; }
  #slip::before { content: ""; position: absolute; left: 4px; right: 4px; top: 4px; bottom: 4px; border: 1px solid #4a5a32; pointer-events: none; }
  #slip.show { display: block; animation: unroll 0.64s cubic-bezier(0.2, 0.75, 0.2, 1) both; }
  .slip-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #num { font-size: 15px; letter-spacing: 2px; }
  #grade { flex: none; padding: 2px 7px; background: #1f2a14; color: #a3ad7e; font-size: 13px; font-weight: bold; letter-spacing: 2px; transform: rotate(-3deg); }
  #verse { margin-top: 9px; text-align: center; font-size: 15px; line-height: 1.5; }
  #verse .line { display: block; }
  #slip.show #verse .line { animation: lineIn 0.34s ease-out both; }
  #slip.show #verse .line:nth-child(2) { animation-delay: 0.26s; }
  #slip.show #verse .line:nth-child(3) { animation-delay: 0.4s; }
  .rule { height: 0; margin: 9px 0 7px; border-top: 2px dotted #4a5a32; }
  #meaning { margin: 0; text-align: center; font-size: 14px; line-height: 1.4; }
  #slip.show #meaning { animation: lineIn 0.36s ease-out 0.54s both; }
  @keyframes unroll {
    0% { clip-path: inset(0 0 94% 0); transform: translateY(-10px); opacity: 0.4; }
    30% { opacity: 1; }
    100% { clip-path: inset(0 0 0 0); transform: translateY(0); opacity: 1; }
  }
  @keyframes lineIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  #actions { flex: none; width: 100%; max-width: 300px; display: flex; gap: 8px; }
  #actions button { flex: 1; min-height: 44px; border: 3px solid #1f2a14; background: #1f2a14; color: #a3ad7e; font: inherit; font-size: 15px; font-weight: bold; letter-spacing: 1px; }
  #actions button.secondary { background: #a3ad7e; color: #1f2a14; }
  #actions button:active:not(:disabled) { transform: translateY(1px); }
  #actions button:disabled { background: #7d8a58; border-color: #4a5a32; color: #4a5a32; }
  #actions button:focus-visible { outline: 2px solid #1f2a14; outline-offset: 2px; }
  body.has-slip #writeBtn { animation: actionIn 0.32s ease-out 0.42s both; }
  @keyframes actionIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  #footer { flex: none; min-height: 1.4em; padding: 0 12px 7px; text-align: center; color: #4a5a32; font-size: 13px; line-height: 1.4; }

  @media (max-height: 380px) {
    main { gap: 6px; padding: 6px 10px 4px; }
    #slip { padding-top: 9px; padding-bottom: 10px; }
    #verse { margin-top: 7px; line-height: 1.4; }
    .rule { margin: 7px 0 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cup-idle, .stick, #cup.lift .cup-idle, #cup.lift #hero, #slip.show, #slip.show #verse .line, #slip.show #meaning, body.has-slip #writeBtn { animation: none; }
    #cup.shake .cup-idle { transform: translateX(0); }
    #cup.lift .cup-idle { opacity: 0; }
    #slip.show { clip-path: none; opacity: 1; transform: none; }
    #slip.show #verse .line, #slip.show #meaning, body.has-slip #writeBtn { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<header><b id="title">每日一签</b><span id="today"></span></header>
<main>
  <div id="stage">
    <div id="cup" role="button" tabindex="0" aria-label="签筒">
      <div class="cup-idle">
        <div class="cup-shadow"></div>
        <div class="sticks">
          <i class="stick s1"></i><i class="stick s2"></i><i class="stick s3"></i><i class="stick s4"></i><i class="stick s5"></i><i class="stick s6"></i><i class="stick s7"></i>
        </div>
        <div id="hero"></div>
        <div class="cup-body"></div>
        <div class="cup-rim"></div>
      </div>
      <div class="cup-hint" id="cupHint">静心，抽一支</div>
    </div>
    <section id="slip" aria-live="polite">
      <div class="slip-head"><span id="num">第十二签</span><span id="grade">上上</span></div>
      <div id="verse"></div>
      <div class="rule"></div>
      <p id="meaning"></p>
    </section>
  </div>
  <div id="actions">
    <button id="drawBtn" type="button">抽签</button>
    <button id="writeBtn" class="secondary" type="button" style="display:none">写进记事本</button>
  </div>
</main>
<div id="footer"></div>
<script>
(function () {
  var LANG = (typeof PAD !== "undefined" && PAD.lang === "en") ? "en" : "zh";
  var DRAW_KEY = "daily-slip";
  var DATA = [
    { num: 1, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["朝露落在木门边", "门内有人正熬一锅热茶", "先把心安住，日子就长了"], en: ["Dew settles by the gate", "Someone is warming tea inside", "Settle your mind first, and the day grows gentle"] }, meaning: { zh: "一日里最稳的，总是先安过心。", en: "The surest start is a calm heart before the small errands." } },
    { num: 2, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["小雨拂过旧墙", "青苔都在笑着亮一亮", "路边的风景也会替你答应"], en: ["Fine rain brushes an old wall", "Moss shines with a sly smile", "Even the roadside looks ready to agree"] }, meaning: { zh: "别急着挑谁，机缘会先把门敲响。", en: "Don’t rush the choice; the right opening will knock first." } },
    { num: 3, grade: { zh: "上", en: "Good" }, verse: { zh: ["纸伞撑开在巷口", "风不急，步子也不急", "随便走走，晚餐就会更香"], en: ["A paper umbrella opens by the lane", "The breeze is gentle, your steps are too", "A slow walk makes supper taste sweeter"] }, meaning: { zh: "脚下多走一步，心里也会松一口气。", en: "A little more walking lets the mind loosen its knot." } },
    { num: 4, grade: { zh: "上", en: "Good" }, verse: { zh: ["天边有雁回头", "顺着它的路，写一封清淡的信", "心事会落在最熟悉的地方"], en: ["A flock turns at the horizon", "Write a plain letter along that route", "The feeling lands where it is most familiar"] }, meaning: { zh: "合适的话可以从最简单的句子开始。", en: "A fitting sentence can start with the plainest words." } },
    { num: 5, grade: { zh: "中", en: "Fair" }, verse: { zh: ["街口的灯亮了一点", "有些事不是必须立刻想明白", "先去买一串香葱，一切会顺过来"], en: ["The lamp at the corner glows a little", "Some things need not be solved right away", "First buy a bunch of scallions and the day settles"] }, meaning: { zh: "缓一缓，不是拖延，是让路径显出来。", en: "Pausing is not delay; it lets the path appear." } },
    { num: 6, grade: { zh: "上", en: "Good" }, verse: { zh: ["窗外一只乌鸦站了站", "你也别急着给结论", "明早的朝阳，先给你个好心情"], en: ["A crow settles outside the window", "Do not rush a conclusion", "Tomorrow’s sunrise will greet you kindly first"] }, meaning: { zh: "今天不必全盘定论，明天是另一个答案。", en: "Today need not decide everything; tomorrow holds another answer." } },
    { num: 7, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["白墙上一片天色", "一阵轻风从左边吹过", "把烦恼都吹成了树叶的声响"], en: ["The white wall holds the sky", "A light wind slips from the left", "It turns worry into the sound of leaves"] }, meaning: { zh: "让烦心事先变小一点，风会替你带走。", en: "Shrink worries down a little and the wind will carry them off." } },
    { num: 8, grade: { zh: "中", en: "Fair" }, verse: { zh: ["饭店门口有人晒衣服", "口袋里还剩一枚硬币", "先去喝口水，明白的事会慢慢浮上来"], en: ["Clothes dry outside a noodle shop", "A coin remains in your pocket", "First drink some water; understanding rises slowly"] }, meaning: { zh: "先照顾最现实的一点，想法会更稳。", en: "Take care of the practical need first; thoughts will settle." } },
    { num: 9, grade: { zh: "上", en: "Good" }, verse: { zh: ["田埂上的路明明没什么新鲜", "却像有人给它打了个招呼", "走过去时，心也活络开了"], en: ["The lane by the field is plain", "Yet it feels as if someone called it by name", "When you walk it, your heart wakes up too"] }, meaning: { zh: "不必追求惊喜，熟路也能酿出温柔。", en: "You do not need a grand surprise; even a familiar path can be kind." } },
    { num: 10, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["旧书页夹着一撮芬芳", "有一处看起来像你要的答案", "别急着合上，先把字读透"], en: ["A familiar book holds a hint of scent", "There is a place that looks like your answer", "Do not close it yet; read the page through"] }, meaning: { zh: "答案常在你已看到的地方，只差一步认真。", en: "The answer is often where you already are; you only need one honest look." } },
    { num: 11, grade: { zh: "中", en: "Fair" }, verse: { zh: ["水缸里的水静静翻动", "一次小小的换位", "就能把视线从一头甩到另一头"], en: ["The water in the jar stirs softly", "A slight adjustment changes the view", "Your eyes then fall on a different side"] }, meaning: { zh: "换个方向看，也许你已经接近了答案。", en: "A different angle may be all you need." } },
    { num: 12, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["青石板被人踩得很平", "你今天的事也差不多", "只要顺着脚步走，不怕它太长"], en: ["The slate path is worn smooth", "So are the steps before you today", "Carry on in order and it will not feel so long"] }, meaning: { zh: "继续向前，比追赶一时的焦躁更有力。", en: "Keeping your steps steady is stronger than chasing without rest." } },
    { num: 13, grade: { zh: "上", en: "Good" }, verse: { zh: ["山里的云一层一层放轻", "一口气慢一点，你就会听到鸟鸣", "哪怕是小事也通了"], en: ["Clouds rise in layers over the hill", "Take one breath slower and the birds come clear", "Even the smallest task opens up"] }, meaning: { zh: "慢下来，事情会先从声音里说明白。", en: "Slow down and the task will explain itself in time." } },
    { num: 14, grade: { zh: "中", en: "Fair" }, verse: { zh: ["隔壁有人在修水龙头", "你也不必急着吵", "等它按时滴水，屋里就都会亮"], en: ["A neighbor repairs a faucet nearby", "You need not rush to argue either", "When it drips on time, the room grows bright"] }, meaning: { zh: "把小麻烦先处理掉，日子会自然通畅。", en: "Fix the small snag and the rest of the day feels easier." } },
    { num: 15, grade: { zh: "上", en: "Good" }, verse: { zh: ["晚风吹过小院门口", "窗纸有一点点微亮", "你要做的事，原来只差一口气"], en: ["Evening wind passes the gate", "The paper window glows a little", "The task before you is only one breath away"] }, meaning: { zh: "别把今天的事想得太重，动作先来。", en: "Do not make the task heavier than it is; start with the motion." } },
    { num: 16, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["雨停时，瓦片上有一片亮光", "就像有人给你留了个记号", "你会在那一瞬找到出口"], en: ["When the rain stops, a bright patch remains on the tile", "It feels like a sign left for you", "In that moment, the exit appears"] }, meaning: { zh: "你不是走丢了，你只是看见出口了。", en: "You are not lost; you have simply seen the exit." } },
    { num: 17, grade: { zh: "中", en: "Fair" }, verse: { zh: ["橘子皮飘下来，落在案头", "看着像一道分界", "你要么往前，要么先把自己照照"], en: ["An orange peel falls onto the table", "It looks like a line divided in two", "You either step forward or take a proper look at yourself"] }, meaning: { zh: "先看清自己的节奏，再决定迈哪一步。", en: "Check your own rhythm before you decide the next step." } },
    { num: 18, grade: { zh: "上", en: "Good" }, verse: { zh: ["一只小船在河边一歇", "岸边的人也放慢了脚步", "原来好事就是一不追一不赶"], en: ["A small boat rests by the river", "The people on shore slow their steps", "Good fortune is simply not hurrying"] }, meaning: { zh: "顺其自然，反而更像你想要的生活。", en: "Letting things happen naturally fits the life you want." } },
    { num: 19, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["旧窗玻璃里有一点暮色", "你拿起书，把字慢慢放平", "有些东西从来不是撞出来的"], en: ["There is a dusk glow in the old window", "You pick up a book and set the words down gently", "Some things do not arrive by collision"] }, meaning: { zh: "一步步来，比一次猛冲更可靠。", en: "Taking it gently is more reliable than one hard rush." } },
    { num: 20, grade: { zh: "中", en: "Fair" }, verse: { zh: ["路上有人停下来看树", "你也学着停一停", "几分钟之后，旧念头就不那么尖了"], en: ["Someone pauses to look at a tree", "You pause too", "A few minutes later, old thoughts are not so sharp"] }, meaning: { zh: "让自己停一下，情绪会先回到身体里。", en: "Pause for a minute and your feeling will return to the body." } },
    { num: 21, grade: { zh: "上", en: "Good" }, verse: { zh: ["红色的花落在石阶上", "花期不长，但有人记得拍一张照片", "把今天也保存成温柔的样子"], en: ["A red blossom falls onto the stone steps", "Its bloom is brief, but someone remembers to take a photo", "And keeps today in a gentle form"] }, meaning: { zh: "今天不必太大，能保存的温暖就够了。", en: "Today need not be grand; gentle warmth is enough to keep." } },
    { num: 22, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["一声远处的叫卖", "像是把街道喊醒了", "你也会顺着这声音，重新落地"], en: ["A distant vendor calls out", "It wakes the street and wakes you too", "In that sound, you settle back to the ground"] }, meaning: { zh: "把外界的噪音当作提醒，回到真实的脚步。", en: "Treat the noise as a reminder to return to your real footing." } },
    { num: 23, grade: { zh: "中", en: "Fair" }, verse: { zh: ["一片白云压在屋檐下", "你把热水壶的蒸汽看得太认真", "其实只是在提醒你慢一点"], en: ["A cloud hangs low by the eaves", "You watch the kettle’s steam with too much care", "It is only reminding you to go gently"] }, meaning: { zh: "别把一道小事看得太重，今天还长着呢。", en: "Do not take one small thing too seriously; today is still unfolding." } },
    { num: 24, grade: { zh: "上", en: "Good" }, verse: { zh: ["篮子里放了几颗葡萄", "一颗一颗都像是提醒你", "做事也可以有一点轻松的节奏"], en: ["A basket holds a few grapes", "Each one looks like a small reminder", "Work can keep a light rhythm too"] }, meaning: { zh: "适度放松，反而让结果更稳。", en: "Leaning into ease often makes the outcome steadier." } },
    { num: 25, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["你在门口收了一片落叶", "它还留着一点点余温", "算是今天给你的好消息"], en: ["You gather one fallen leaf at the gate", "It still holds a trace of warmth", "That is today’s little bit of good news"] }, meaning: { zh: "一个小小的好消息，足够支撑你过一整天。", en: "One small good sign is enough to carry you through the day." } },
    { num: 26, grade: { zh: "中", en: "Fair" }, verse: { zh: ["枯树上的鸟把铃铛挂住", "叮当声不大，却顺着风进了院子", "提醒你，别把心事吵大"], en: ["A bird hangs a bell from a bare branch", "The chime is small, but it carries in the wind", "It reminds you not to make a fuss of it"] }, meaning: { zh: "小事先放一放，心会更清楚。", en: "Set the small things aside and your mind will become clearer." } },
    { num: 27, grade: { zh: "上", en: "Good" }, verse: { zh: ["你想起一个很早的约定", "那天的地面还没晒热", "今天就按它的样子走一遍"], en: ["You remember an old promise", "The ground was not yet warm then", "Today, walk it in that same spirit"] }, meaning: { zh: "老约定里藏着你想保留的那份安稳。", en: "The old promise holds the steadiness you still want to keep." } },
    { num: 28, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["收音机里播着远处的歌", "声音不大，却把屋子一点点填满", "在这柔和的地方，想法都能落下"], en: ["A radio glows with a distant song", "The sound is soft, but it fills the room", "In that gentleness, thoughts finally settle"] }, meaning: { zh: "让环境安静一点，心里就会有地方落脚。", en: "Make the room a little quieter and your mind will find a place to rest." } },
    { num: 29, grade: { zh: "中", en: "Fair" }, verse: { zh: ["一页日历翻过一页", "你忽然想起要把某件事放下来", "那是今天最好的安排"], en: ["One page of the calendar turns", "You remember you can leave something for later", "That is the best arrangement for today"] }, meaning: { zh: "不是放弃，而是让优先级先理顺。", en: "This is not giving up; it is sorting the priorities first." } },
    { num: 30, grade: { zh: "上", en: "Good" }, verse: { zh: ["院里有人种了几竿青竹", "它们在风里轻轻摇", "一直盯着你，就像在提醒：别太紧"], en: ["Someone planted bamboo in the courtyard", "They sway lightly in the wind", "They seem to tell you: do not hold so tightly"] }, meaning: { zh: "放松一点，事情总会换一种更顺的方式。", en: "Relax a little; the task will likely find a smoother way." } },
    { num: 31, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["一只小狗牵着旧绳子跑过", "它看起来没想太多", "你也跟着轻一点，今天就过了"], en: ["A small dog runs by with an old leash", "It seems to think of nothing at all", "Follow that lightness and the day will pass smoothly"] }, meaning: { zh: "别给今天提前背上太重的担子。", en: "Do not carry too much worry before the day is even underway." } },
    { num: 32, grade: { zh: "上", en: "Good" }, verse: { zh: ["门口晒着一块旧布", "它还保留着昨天的太阳", "你拿起来，就像拿到了一个好理由"], en: ["An old cloth dries by the gate", "It still keeps yesterday’s warmth", "You lift it and find your reason for the day"] }, meaning: { zh: "把小小的顺手当作出发，日子会跟着顺。", en: "Use the small, easy task as your start and the day will follow suit." } }
  ];

  var WEEK_ZH = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
  var WEEK_EN = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var MON_EN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var TXT = {
    zh: { title: "每日一签", draw: "抽签", write: "START 写入", written: "已写入", denied: "没有写入", old: "这台掌机太老，不能写记事本。", noteTitle: "每日一签", cup: "签筒", hint: "静心，抽一支", hintDraw: "A 抽签 · 也可以点签筒", hintSlip: "今日一签 · 明天再来", hintWritten: "已写入 · 明天再来" },
    en: { title: "Fortune", draw: "Draw", write: "START Notes", written: "Saved", denied: "Not saved", old: "This handheld is too old to write notes.", noteTitle: "Daily fortune", cup: "Fortune cup", hint: "Settle, then draw", hintDraw: "A draw · or tap the cup", hintSlip: "One slip a day", hintWritten: "Saved · come back tomorrow" }
  }[LANG];

  /* Once a day the stick comes out; the reduced-motion setting shortens the same steps
     instead of skipping them, so the state changes in the same order. */
  var REDUCED = typeof window.matchMedia === "function" && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var state = { dateKey: todayKey(), slip: null, written: false, animating: false, rendered: null };
  var drawBtn = document.getElementById("drawBtn");
  var writeBtn = document.getElementById("writeBtn");
  var slip = document.getElementById("slip");
  var foot = document.getElementById("footer");
  var cup = document.getElementById("cup");
  var cupHint = document.getElementById("cupHint");
  var todayEl = document.getElementById("today");
  var numEl = document.getElementById("num");
  var gradeEl = document.getElementById("grade");
  var verseEl = document.getElementById("verse");
  var meaningEl = document.getElementById("meaning");

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function pad(v) { return v < 10 ? "0" + v : String(v); }
  function slotFor(dateKey) {
    var sum = 0, i;
    for (i = 0; i < dateKey.length; i++) sum += dateKey.charCodeAt(i) * (i + 1);
    return sum % DATA.length;
  }
  function prettyDate(dateKey) {
    var p = dateKey.split("-"), m = parseInt(p[1], 10), day = parseInt(p[2], 10);
    var week = new Date(parseInt(p[0], 10), m - 1, day).getDay();
    return LANG === "en" ? MON_EN[m - 1] + " " + day + " · " + WEEK_EN[week] : m + "月" + day + "日 · " + WEEK_ZH[week];
  }
  function setFooter(text) { foot.textContent = text; }
  function sfx(name) {
    if (typeof PAD !== "undefined" && PAD.sfx) PAD.sfx(name);
  }
  function titleFor(dateKey) {
    return dateKey + "  第" + DATA[state.slip].num + "签  " + DATA[state.slip].grade[LANG] + "\n" + DATA[state.slip].verse[LANG].join("\n") + "\n" + DATA[state.slip].meaning[LANG];
  }
  function showSlip() {
    var item = DATA[state.slip];
    document.title = TXT.title;
    if (state.rendered !== state.slip) {
      numEl.textContent = "第 " + item.num + " 签";
      gradeEl.textContent = item.grade[LANG];
      verseEl.innerHTML = "";
      item.verse[LANG].forEach(function (line) {
        var el = document.createElement("span");
        el.className = "line";
        el.textContent = line;
        verseEl.appendChild(el);
      });
      meaningEl.textContent = item.meaning[LANG];
      state.rendered = state.slip;
    }
    slip.classList.add("show");
    document.body.classList.add("has-slip");
    drawBtn.style.display = "none";
    todayEl.textContent = prettyDate(state.dateKey);
    if (typeof PAD !== "undefined" && PAD.notes) {
      writeBtn.textContent = state.written ? TXT.written : TXT.write;
      writeBtn.disabled = state.written;
      writeBtn.style.display = "";
      setFooter(state.written ? TXT.hintWritten : TXT.hintSlip);
    } else {
      writeBtn.style.display = "none";
      setFooter(TXT.old);
    }
  }
  function render() {
    if (state.slip == null) {
      document.body.classList.remove("has-slip");
      slip.classList.remove("show");
      writeBtn.style.display = "none";
      drawBtn.style.display = "";
      drawBtn.textContent = TXT.draw;
      setFooter(TXT.hintDraw);
      todayEl.textContent = prettyDate(state.dateKey);
      return;
    }
    document.body.classList.add("has-slip");
    showSlip();
  }
  function saveState() {
    if (typeof PAD === "undefined" || !PAD.save) return;
    PAD.save(DRAW_KEY, { dateKey: state.dateKey, slip: state.slip, written: state.written });
  }
  function loadState() {
    if (typeof PAD === "undefined" || !PAD.load) return Promise.resolve(null);
    return PAD.load(DRAW_KEY).then(function (d) {
      if (!d || !d.dateKey || d.dateKey !== state.dateKey) {
        state.slip = null;
        state.written = false;
        return;
      }
      state.slip = d.slip;
      state.written = !!d.written;
    });
  }
  function doDraw() {
    if (state.animating || state.slip !== null) return;
    state.animating = true;
    drawBtn.disabled = true;
    cup.classList.remove("lift");
    cup.classList.add("shake");
    sfx("tick");
    if (!REDUCED) {
      setTimeout(function () { sfx("tick"); }, 210);
      setTimeout(function () { sfx("tick"); }, 420);
      setTimeout(function () { sfx("tick"); }, 620);
    }
    /* shake, a short stillness, the stick lifting, then the paper. The stillness is
       what makes the draw feel considered instead of rushed. */
    var shake = REDUCED ? 30 : 820;
    var settle = REDUCED ? 10 : 160;
    var lift = REDUCED ? 30 : 620;
    setTimeout(function () { cup.classList.remove("shake"); }, shake);
    setTimeout(function () {
      cup.classList.add("lift");
      sfx("tick");
    }, shake + settle);
    setTimeout(function () {
      state.slip = slotFor(state.dateKey);
      state.written = false;
      state.rendered = null;
      saveState();
      showSlip();
      cup.classList.remove("lift");
      state.animating = false;
      drawBtn.disabled = false;
      sfx("ok");
    }, shake + settle + lift);
  }
  function appendNote() {
    if (state.slip == null || typeof PAD === "undefined" || !PAD.notes) {
      if (typeof PAD !== "undefined" && !PAD.notes) setFooter(TXT.old);
      return;
    }
    var title = LANG === "en" ? "Daily fortune" : "每日一签";
    var text = titleFor(state.dateKey);
    /* PAD.notes.append is used only on the player's explicit choice: the app does not append automatically
       and the note title stays the same so every day adds to the app's single note. "denied" means the runtime
       blocked the append (no permission, limit hit, or the player pressed B in the own dialog). */
    PAD.notes.append(title, text).then(function (result) {
      if (result === "saved") {
        state.written = true;
        saveState();
        render();
        sfx("ok");
      } else {
        state.written = false;
        saveState();
        render();
        setFooter(TXT.denied);
        sfx("err");
      }
    });
  }
  function pressA() { doDraw(); }
  function handleKey(e) {
    var k = e.key;
    if (k === "x" || k === "X") { e.preventDefault(); pressA(); }
    else if (k === "Enter") { e.preventDefault(); appendNote(); }
    else if (k === "ArrowRight" || k === "ArrowLeft") { e.preventDefault(); if (state.slip === null) doDraw(); }
  }
  if (typeof PAD !== "undefined" && PAD.on) {
    PAD.on("press", function (button) {
      if (button === "a") pressA();
      else if (button === "start") appendNote();
    });
  } else document.addEventListener("keydown", handleKey, false);
  drawBtn.addEventListener("click", function () { doDraw(); });
  writeBtn.addEventListener("click", function () { appendNote(); });
  cup.addEventListener("click", function () { doDraw(); });
  cup.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); doDraw(); }
  });
  document.getElementById("title").textContent = TXT.title;
  document.documentElement.lang = LANG === "en" ? "en" : "zh-CN";
  cupHint.textContent = TXT.hint;
  cup.setAttribute("aria-label", TXT.cup);
  todayEl.textContent = prettyDate(state.dateKey);
  loadState().then(render);
})();
</script>
</body>
</html>
