<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lo-PDA Events</title>
<meta name="description" content="Lo-PDA events: challenges for making small apps for a fictional 1986 handheld, and what people made.">
<link rel="icon" href="../runtime/icons/icon-192.png">
<style>
@font-face{font-family:"VT323";font-display:swap;src:url(../runtime/fonts/vt323-002.woff2) format("woff2")}
/* The landing page's look: graphite (the case) and paper (the LCD) bands. Same tokens as ../index.html. */
:root{
  --case:#171815; --case-2:#22241f; --case-line:#33362e;
  --lcd-ink:#1f2a14; --lcd-dark:#4a5a32; --lcd-mid:#7d8a58; --lcd-paper:#a3ad7e;
  --paper:#e9ebdf; --paper-2:#dfe2d2; --on-case:#eef0e6; --on-case-dim:#9a9f8c;
  --home:#c4432f;
  --f-display:-apple-system,"SF Pro Display",system-ui,"Segoe UI",Roboto,"PingFang SC",sans-serif;
  --f-body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,"PingFang SC",sans-serif;
  --f-lcd:"VT323",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--case);color:var(--on-case);font:17px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{padding-block:clamp(48px,8vw,96px)}
.band.paper{background:var(--paper);color:var(--lcd-ink)}
.lcd{font-family:var(--f-lcd);letter-spacing:.08em;text-transform:uppercase}
h1,h2{font-family:var(--f-display);font-weight:700;letter-spacing:-.03em;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:clamp(40px,7vw,80px)}
h2{font-size:clamp(30px,4.6vw,52px);margin-bottom:28px}
h3{font:600 20px/1.25 var(--f-display);letter-spacing:-.01em;margin:0 0 6px}
p{margin:0}
.lede{font-size:clamp(18px,2.1vw,22px);line-height:1.45;max-width:40ch;color:var(--on-case-dim);margin-top:20px;text-wrap:pretty}
.paper .lede{color:var(--lcd-dark)}
.eyebrow{font-size:20px;color:var(--lcd-mid);margin-bottom:14px}
.paper .eyebrow{color:var(--lcd-dark)}

nav{position:sticky;top:0;z-index:5;background:var(--case);border-bottom:1px solid var(--case-line)}
nav .wrap{display:flex;align-items:center;gap:18px;height:52px;font-size:14px}
nav .mark{font-family:var(--f-lcd);font-size:24px;letter-spacing:.06em;text-decoration:none;margin-right:auto}
nav a.l{text-decoration:none;color:var(--on-case-dim)}
nav a.l:hover,nav .lang:hover{color:var(--on-case)}
nav .mark,nav a.l,nav .btn{white-space:nowrap}
@media (max-width:380px){nav .wrap{gap:12px} nav a.gh{display:none}}
nav .lang{background:none;border:0;color:var(--on-case-dim);font:14px var(--f-body);cursor:pointer;padding:8px 4px}
.btn{display:inline-flex;align-items:center;min-height:44px;border-radius:999px;padding:12px 22px;font:600 16px/1 var(--f-body);text-decoration:none;border:0;cursor:pointer}
.btn.home{background:var(--home);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}

.chip{display:inline-block;font:20px/1 var(--f-lcd);letter-spacing:.08em;text-transform:uppercase;padding:5px 10px 3px;border-radius:4px;background:var(--lcd-paper);color:var(--lcd-ink)}
.chip.done{background:var(--case-line);color:var(--on-case-dim)}

/* the list of events */
.list{display:grid;gap:16px;margin-top:36px}
.ev{display:block;text-decoration:none;background:var(--case-2);border:1px solid var(--case-line);border-radius:14px;padding:22px}
.ev:hover{border-color:var(--on-case-dim)}
.ev h3{font-size:24px;margin-top:12px}
.ev p{color:var(--on-case-dim);margin-top:6px;max-width:60ch}

/* one event */
.jump{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}

/* two ways in: the phone (an LCD-coloured panel) and the computer (a case-coloured one) */
.ways{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.way{border-radius:18px;padding:clamp(20px,3vw,32px);display:flex;flex-direction:column;gap:18px;min-width:0;scroll-margin-top:64px}
.way.phone{background:var(--lcd-paper);color:var(--lcd-ink)}
.way.computer{background:var(--case);color:var(--on-case)}
.way .where{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:22px/1 var(--f-lcd);letter-spacing:.08em;text-transform:uppercase}
.way.phone .where{color:var(--lcd-dark)} .way.computer .where{color:var(--lcd-mid)}
.way h2{margin:0;font-size:clamp(34px,4.6vw,48px)}
.way .wl{font-size:17px;line-height:1.45;max-width:42ch}
.way.phone .wl{color:var(--lcd-dark)} .way.computer .wl{color:var(--on-case-dim)}
.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;padding:14px 0;border-block:1px solid}
.way.phone .facts{border-color:var(--lcd-mid)} .way.computer .facts{border-color:var(--case-line)}
.facts dt{font:18px/1.3 var(--f-lcd);letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.facts dd{margin:0;font-weight:600}
.wsteps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.wsteps li{display:grid;grid-template-columns:30px 1fr;column-gap:10px;counter-increment:s}
.wsteps li::before{content:counter(s);grid-row:1 / span 2;font:30px/.9 var(--f-lcd)}
.way.phone .wsteps li::before{color:var(--lcd-dark)} .way.computer .wsteps li::before{color:var(--lcd-mid)}
.wsteps h3{font-size:18px;margin:0 0 2px}
.wsteps p{font-size:15px;overflow-wrap:anywhere}
.way.phone .wsteps p{color:var(--lcd-dark)} .way.computer .wsteps p{color:var(--on-case-dim)}
.way .end{font-size:15px;font-style:italic}
.way.phone .end{color:var(--lcd-dark)} .way.computer .end{color:var(--on-case-dim)}

/* the little screens that type their lines: an LCD in a case bezel, and a terminal */
.screen{border-radius:12px;padding:12px}
.way.phone .screen{background:var(--case);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.screen .glass{height:100%;min-height:170px;border-radius:6px;padding:10px 12px;font:21px/1.2 var(--f-lcd);letter-spacing:.03em;overflow:hidden}
.way.phone .glass{background:var(--lcd-paper);color:var(--lcd-ink);box-shadow:inset 0 0 0 2px var(--lcd-dark)}
.way.computer .screen{background:#0c0d0b;border:1px solid var(--case-line)}
.way.computer .glass{padding:4px 6px;font:13px/1.65 ui-monospace,Menlo,monospace;letter-spacing:0;color:var(--on-case-dim)}
.way.computer .glass .cmd{color:var(--on-case)}
.way.computer .glass .ok{color:#9fbf6a}
.glass div{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.2em}
.glass .cur::after{content:"";display:inline-block;width:.55em;height:1em;margin-left:2px;vertical-align:-.12em;background:currentColor;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.glass .cur::after{animation:none}}

/* challenge cards */
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.card{background:var(--case-2);border:1px solid var(--case-line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0;scroll-margin-top:64px}
.card .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card .meta{font:20px/1 var(--f-lcd);letter-spacing:.06em;color:var(--lcd-mid);white-space:nowrap}
.card .what{color:var(--on-case)}
.card dl{margin:0;display:grid;gap:8px;font-size:15px}
.card dt{font:18px/1 var(--f-lcd);letter-spacing:.08em;text-transform:uppercase;color:var(--lcd-mid)}
.card dd{margin:2px 0 0;color:var(--on-case-dim)}
.card .try{background:var(--lcd-paper);color:var(--lcd-ink);border-radius:10px;padding:14px;display:grid;gap:10px}
.card .try .lbl{font:18px/1 var(--f-lcd);letter-spacing:.08em;text-transform:uppercase;color:var(--lcd-dark)}
.card .try .idea{font-size:16px;font-weight:600;line-height:1.4}
.card .try ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:15px;color:var(--lcd-dark)}
.card .try li::before{content:"> ";font-family:var(--f-lcd);font-size:18px}
.card .try .btn{justify-self:start;padding:10px 18px;min-height:44px}
.card details{margin-top:auto;border-top:1px solid var(--case-line);padding-top:4px}
.card summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
.card details dl{margin:4px 0 10px}
.card pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.5 ui-monospace,Menlo,monospace;background:#0c0d0b;color:var(--on-case);border:1px solid var(--case-line);border-radius:8px;padding:12px;margin:8px 0}
.card .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card .row a{font-size:15px;color:var(--on-case-dim);min-height:44px;line-height:44px}
.made{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.made figure{margin:0;background:var(--paper-2);border-radius:12px;padding:12px}
.made img{display:block;width:100%;height:auto;image-rendering:pixelated;border-radius:6px;background:var(--lcd-paper)}
.made figcaption{margin-top:10px;font-size:15px;color:var(--lcd-dark)}
.made figcaption b{color:var(--lcd-ink)}
.back{display:inline-block;margin:0 16px 24px 0;color:var(--on-case-dim);text-decoration:none;min-height:44px;line-height:44px}
footer{padding-block:32px;color:var(--on-case-dim);font-size:14px}
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="mark" href="../">LO-PDA</a>
  <a class="l" href="./" data-t="nav.events">Events</a>
  <a class="l gh" href="https://github.com/nowheremanx/lopda">GitHub</a>
  <button class="lang" type="button" id="lang">中文</button>
  <a class="btn home" href="../runtime/" data-t="nav.open">Open</a>
</div></nav>
<main id="main"></main>
<footer><div class="wrap" data-t="foot">MIT · A fictional handheld, made for fun.</div></footer>

<script src="events.js"></script>
<script>
(function () {
  // Page text. Event text comes from events.js as {en, zh}.
  var T = {
    en: {
      "nav.events": "Events", "nav.open": "Open", "foot": "MIT · A fictional handheld, made for fun.",
      "list.e": "Events", "list.h": "Make something small.",
      "list.p": "Challenges for making apps for Lo-PDA, with an AI or without. When one ends, what people made stays here.",
      "open": "Open", "archived": "Archived", "back": "All events",
      "ways.e": "Two ways in", "ways.h": "A taste, or the real thing.",
      "cards.e": "Challenge cards", "cards.h": "Pick one.",
      "cards.p": "Each card has one line for your phone and a full brief for a coding agent. It is a starting point, not a spec: keep the twist, change the rest.",
      "try": "On the phone", "then": "Then revise:", "agent": "For a coding agent",
      "stars": "Difficulty", "hours": "h",
      "looks": "What you'll show", "twist": "The 1986 twist", "skip": "Leave out",
      "prompt": "Starter prompt", "copy": "Copy", "copied": "Copied", "issue": "Issue", "copyline": "Copy the line",
      "made.e": "What people made", "made.h": "The apps.", "by": "by",
      "join": "Made one? Open a pull request and link this event."
    },
    zh: {
      "nav.events": "活动", "nav.open": "打开", "foot": "MIT · 一台虚构的掌机，做着玩的。",
      "list.e": "活动", "list.h": "做点小东西。",
      "list.p": "给 Lo-PDA 做 app 的挑战，用不用 AI 都行。活动结束后，大家做的东西会留在这里。",
      "open": "进行中", "archived": "已归档", "back": "全部活动",
      "ways.e": "两条路", "ways.h": "尝个鲜，或者做成真的。",
      "cards.e": "挑战卡", "cards.h": "挑一张。",
      "cards.p": "每张卡有一句给手机用的话，和一份给编程助手的完整说明。它只是起点，不是规格书：留住那点 1986 的味道，其他随你改。",
      "try": "在手机上", "then": "再改一改：", "agent": "给编程助手",
      "stars": "难度", "hours": "小时",
      "looks": "做完能晒什么", "twist": "1986 味道", "skip": "别做",
      "prompt": "起手 prompt", "copy": "复制", "copied": "已复制", "issue": "Issue", "copyline": "复制这句",
      "made.e": "大家做了什么", "made.h": "作品。", "by": "作者",
      "join": "做好了？开一个 pull request，写上这个活动。"
    }
  };
  var REPO = "https://github.com/nowheremanx/lopda";
  var events = window.LOPDA_EVENTS || [];
  var main = document.getElementById("main");

  // Same choice as the landing page (same origin, same key).
  var lang = null;
  try { lang = localStorage.getItem("lopda-landing-lang"); } catch (e) {}
  if (lang !== "zh" && lang !== "en") lang = /^zh/i.test(navigator.language || "") ? "zh" : "en";

  function t(k) { return T[lang][k]; }
  function L(v) { return v ? (v[lang] || v.en) : ""; }
  // Build elements with textContent only: event text is data, never markup.
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  // add() appends and returns the parent; put() appends one child and returns the child.
  function put(parent, child) { parent.appendChild(child); return child; }
  function add(parent) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]); return parent; }
  function band(paper) { var s = el("section", "band" + (paper ? " paper" : "")); var w = el("div", "wrap"); s.appendChild(w); main.appendChild(s); return w; }
  function chip(ev) { return el("span", "chip" + (ev.status === "archived" ? " done" : ""), t(ev.status === "archived" ? "archived" : "open")); }
  function stars(n) { var s = ""; for (var i = 0; i < 3; i++) s += i < n ? "*" : "·"; return s; }

  function renderList() {
    var w = band(false);
    add(w, el("div", "eyebrow lcd", t("list.e")), el("h1", null, t("list.h")), el("p", "lede", t("list.p")));
    var list = put(w, el("div", "list"));
    events.forEach(function (ev) {
      var a = el("a", "ev"); a.href = "#" + ev.id;
      add(a, chip(ev), el("h3", null, L(ev.title)), el("p", null, L(ev.when)), el("p", null, L(ev.lede)));
      list.appendChild(a);
    });
    document.title = lang === "zh" ? "Lo-PDA 活动" : "Lo-PDA Events";
  }

  // A copy button: the clipboard when the page may use it, else the text is selected for a long-press copy.
  function copyButton(label, text, node) {
    var b = el("button", "btn ghost", label); b.type = "button";
    b.addEventListener("click", function () {
      var done = function () { b.textContent = t("copied"); setTimeout(function () { b.textContent = label; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { selectText(node); });
      else selectText(node);
    });
    return b;
  }

  // A card: what it is and its 1986 twist, then the phone's one line (with two follow-ups for Revise),
  // then, folded, the full brief for a coding agent.
  function renderCard(ev, c) {
    var card = el("article", "card"); card.id = c.id;
    var top = add(el("div", "top"), el("h3", null, L(c.name)),
      el("span", "meta", stars(c.stars) + "  " + c.hours + " " + t("hours")));
    top.lastChild.title = t("stars");
    var dl = el("dl");
    [["looks", c.looks], ["twist", c.twist]].forEach(function (r) { add(dl, el("dt", null, t(r[0])), el("dd", null, L(r[1]))); });
    var tryBox = null;
    if (c.idea) {
      tryBox = el("div", "try");
      var idea = el("p", "idea", L(c.idea));
      add(tryBox, el("div", "lbl", t("try")), idea);
      if (c.revise && c.revise.length) {
        var ul = el("ul");
        c.revise.forEach(function (r) { ul.appendChild(el("li", null, L(r))); });
        add(tryBox, el("div", "lbl", t("then")), ul);
      }
      tryBox.appendChild(copyButton(t("copyline"), L(c.idea), idea));
    }
    var det = el("details"); add(det, el("summary", null, t("agent")));
    if (c.skip) { var sk = put(det, el("dl")); add(sk, el("dt", null, t("skip")), el("dd", null, L(c.skip))); }
    var pre = put(det, el("pre", null, c.prompt));
    var row = put(det, el("div", "row"));
    row.appendChild(copyButton(t("copy"), c.prompt, pre));
    if (c.issue) { var a = put(row, el("a", null, t("issue") + " #" + c.issue)); a.href = REPO + "/issues/" + c.issue; }
    return add(card, top, el("p", "what", L(c.what)), dl, tryBox, det);
  }
  function selectText(node) { var r = document.createRange(); r.selectNodeContents(node); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }

  // One way in: where and how long, the headline, three facts, its little screen, the steps.
  function renderWay(wy) {
    var box = el("section", "way " + wy.id); box.id = "way-" + wy.id;
    var where = add(el("div", "where"), el("span", null, L(wy.where)), el("span", null, L(wy.time)));
    var facts = el("dl", "facts");
    (wy.facts || []).forEach(function (f) { add(facts, el("dt", null, L(f.k)), el("dd", null, L(f.v))); });
    var screen = null;
    if (wy.demo && wy.demo.length) {
      screen = el("div", "screen"); screen.setAttribute("aria-hidden", "true");
      typeLines(put(screen, el("div", "glass")), wy.demo.map(L));
    }
    var ol = el("ol", "wsteps");
    (wy.steps || []).forEach(function (st) { add(ol, add(el("li"), el("h3", null, L(st.h)), el("p", null, L(st.p)))); });
    return add(box, where, el("h2", null, L(wy.title)), el("p", "wl", L(wy.lede)), facts, screen, ol, wy.end && el("p", "end", L(wy.end)));
  }

  // The little screens type their lines one after another, then start over. Each render starts new timers,
  // so the old ones are cleared first (a language switch or a new page). With reduced motion: all lines, still.
  var timers = [];
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function stopTyping() { timers.forEach(clearTimeout); timers = []; }
  function lineClass(s) { return /^\$ /.test(s) ? "cmd" : /^PASS\b/.test(s) ? "ok" : ""; }
  function typeLines(glass, lines) {
    var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (still) { lines.forEach(function (s) { glass.appendChild(el("div", lineClass(s), s)); }); return; }
    function run() {
      glass.textContent = "";
      (function next(i) {
        if (i >= lines.length) { later(run, 3200); return; }
        var row = put(glass, el("div", lineClass(lines[i]) + " cur")), text = lines[i], n = 0;
        var typed = /^[>$]/.test(text);   // what the person types comes a letter at a time; answers appear at once
        (function step() {
          n = typed ? n + 1 : text.length;
          row.textContent = text.slice(0, n);
          if (n < text.length) later(step, 45);
          else later(function () { row.className = lineClass(text); next(i + 1); }, typed ? 500 : 900);
        })();
      })(0);
    }
    later(run, 400);
  }

  function renderEvent(ev) {
    var w = band(false);
    var back = put(w, el("a", "back", "< " + t("back"))); back.href = "#";
    add(w, chip(ev), el("h1", null, L(ev.title)), el("p", "lede", L(ev.when) + " · " + L(ev.lede)));
    if (ev.ways && ev.ways.length && ev.status !== "archived") {
      var jump = put(w, el("div", "jump"));
      ev.ways.forEach(function (wy, i) {
        var j = put(jump, el("a", "btn " + (i ? "ghost" : "home"), L(wy.where) + " · " + L(wy.time)));
        j.href = "#" + ev.id + "/" + wy.id;
      });
    }

    // The summary comes first once an event is over: that is what a visitor came back for.
    if (ev.summary) {
      var s = band(true);
      add(s, el("div", "eyebrow lcd", t("made.e")), el("h2", null, t("made.h")));
      if (ev.summary.text) put(s, el("p", "lede", L(ev.summary.text))).style.marginBottom = "28px";
      var made = put(s, el("div", "made"));
      (ev.summary.apps || []).forEach(function (a) {
        var fig = el("figure"), img = el("img");
        img.src = "shots/" + ev.id + "/" + a.app + ".png"; img.alt = L(a.name); img.loading = "lazy";
        var cap = el("figcaption"); add(cap, el("b", null, L(a.name)), document.createTextNode(" · " + t("by") + " "));
        var who = put(cap, el("a", null, "@" + a.by)); who.href = "https://github.com/" + encodeURIComponent(a.by);
        made.appendChild(add(fig, img, cap));
      });
    }

    if (ev.ways && ev.ways.length) {
      var h = band(true);
      add(h, el("div", "eyebrow lcd", t("ways.e")), el("h2", null, t("ways.h")));
      var ways = put(h, el("div", "ways"));
      ev.ways.forEach(function (wy) { ways.appendChild(renderWay(wy)); });
    }

    if (ev.cards && ev.cards.length) {
      var c = band(false);
      add(c, el("div", "eyebrow lcd", t("cards.e")), el("h2", null, t("cards.h")));
      put(c, el("p", "lede", t("cards.p"))).style.margin = "-12px 0 28px";
      var grid = put(c, el("div", "cards"));
      ev.cards.forEach(function (card) { grid.appendChild(renderCard(ev, card)); });
      if (ev.status !== "archived") add(c, el("p", "lede", t("join")));
    }
    document.title = L(ev.title) + " · Lo-PDA";
  }

  // #<event> opens an event; #<event>/<way> or #<event>/<card> also scrolls to that part of it.
  function render() {
    stopTyping();
    main.textContent = "";
    var parts = decodeURIComponent(location.hash.slice(1)).split("/"), ev = null;
    for (var i = 0; i < events.length; i++) if (events[i].id === parts[0]) ev = events[i];
    if (ev) renderEvent(ev); else renderList();
    var at = parts[1] && (document.getElementById("way-" + parts[1]) || document.getElementById(parts[1]));
    if (at) at.scrollIntoView();
    document.documentElement.lang = lang;
    document.getElementById("lang").textContent = lang === "zh" ? "EN" : "中文";
    var ts = document.querySelectorAll("[data-t]");
    for (var j = 0; j < ts.length; j++) ts[j].textContent = t(ts[j].getAttribute("data-t"));
  }

  document.getElementById("lang").addEventListener("click", function () {
    lang = lang === "zh" ? "en" : "zh";
    try { localStorage.setItem("lopda-landing-lang", lang); } catch (e) {}
    render();
  });
  addEventListener("hashchange", function () {
    var sub = location.hash.indexOf("/") > 0;
    render();
    if (!sub) scrollTo(0, 0);
  });
  render();
})();
</script>
</body>
</html>
