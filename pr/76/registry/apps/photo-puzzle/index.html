<title>拍照拼图</title>
<!-- Lo-PDA example app (lopda/1): a sliding puzzle cut from a photo the player takes with PAD.camera.snap
     (SPEC.md 6.6) or imports with PAD.importFile (6.2). Shows the photo before using it and allows a retake
     (sdk/UI.md section 10), and plays just as well with a built-in picture when there is no camera. The unfinished
     puzzle is kept with PAD.save, so closing the handheld does not lose it. Chin buttons, touch, PAD.sfx and a short
     PAD.music jingle. MIT License. -->

<script data-src="src/solver.js">
/* The solver behind 看它解 / SELECT / the tutorial: rows first, then columns, then the last 2×2 -- the way a person
   solves it, not the shortest way. Every stage is a small breadth-first search over the cells that still matter:
   the pieces this stage is placing and the gap. Pieces already home are walls, and every other piece is
   interchangeable, which keeps the search at a few thousand states (a few milliseconds on a phone) and makes the
   plan easy to explain in one line. No DOM, no PAD: tests/solver.test.mjs plays a thousand boards with it.

   Board layout: tiles[position] = piece, pieces 0 … n*n-2 are the picture, n*n-1 is the gap. */
var Solver = (function () {
  "use strict";

  /* Each stage places one or two pieces; after it they are locked and never move again. */
  function stages(n) {
    if (n === 3) return [
      [{ p: 0, at: 0 }],                                            /* row 1: 1 */
      [{ p: 1, at: 1 }, { p: 2, at: 2 }],                           /* row 1: 2 and 3 together */
      [{ p: 3, at: 3 }, { p: 6, at: 6 }],                           /* column 1: 4 and 7 together */
      [{ p: 4, at: 4 }, { p: 5, at: 5 }, { p: 7, at: 7 }],          /* the last 2×2 */
    ];
    return [
      [{ p: 0, at: 0 }], [{ p: 1, at: 1 }], [{ p: 2, at: 2 }, { p: 3, at: 3 }],
      [{ p: 4, at: 4 }], [{ p: 5, at: 5 }], [{ p: 6, at: 6 }, { p: 7, at: 7 }],
      [{ p: 8, at: 8 }, { p: 12, at: 12 }],                         /* the last two rows, column by column */
      [{ p: 9, at: 9 }, { p: 13, at: 13 }],
      [{ p: 10, at: 10 }, { p: 11, at: 11 }, { p: 14, at: 14 }],
    ];
  }

  function neighbours(n, g) {
    var r = (g / n) | 0, c = g % n, out = [];
    if (r > 0) out.push(g - n);
    if (r < n - 1) out.push(g + n);
    if (c > 0) out.push(g - 1);
    if (c < n - 1) out.push(g + 1);
    return out;
  }

  /* One stage: BFS over (positions of the pieces being placed, gap). Returns the cells to slide, in order, or null.
     `locked` holds the pieces finished in earlier stages: they are walls, which is what makes the search small.
     Merely being at home does not lock a piece -- a wall can pinch the free cells into a path where the goal is
     out of reach, so only finished stages may block (found by the thousand-board test). */
  function find(n, tiles, targets, locked) {
    var N = n * n, gapPiece = N - 1, gap = tiles.indexOf(gapPiece);
    var start = [], want = [], i, k;
    for (i = 0; i < targets.length; i++) { start.push(tiles.indexOf(targets[i].p)); want.push(targets[i].at); }

    if (start.join() === want.join()) return [];

    var wall = {};
    for (i = 0; i < (locked || []).length; i++) wall[tiles.indexOf(locked[i])] = true;

    function done(pos) {
      for (k = 0; k < want.length; k++) if (pos[k] !== want[k]) return false;
      return true;
    }

    var key0 = start.join(",") + "|" + gap;
    var prev = new Map(); prev.set(key0, null);
    var queue = [{ pos: start, gap: gap, key: key0 }];
    for (var qi = 0; qi < queue.length; qi++) {
      var cur = queue[qi], g = cur.gap, nb = neighbours(n, g);
      for (var j = 0; j < nb.length; j++) {
        var q = nb[j];
        if (wall[q]) continue;
        var pos = cur.pos.slice(), hit = -1;
        for (k = 0; k < pos.length; k++) if (pos[k] === q) { hit = k; break; }
        if (hit >= 0) pos[hit] = g;
        var key = pos.join(",") + "|" + q;
        if (prev.has(key)) continue;
        prev.set(key, [cur.key, q]);
        if (done(pos)) {
          var out = [];
          for (var s = key; prev.get(s); s = prev.get(s)[0]) out.push(prev.get(s)[1]);
          out.reverse();
          return out;
        }
        queue.push({ pos: pos, gap: q, key: key });
      }
    }
    return null;
  }

  /* the piece at q slides into the gap */
  function step(tiles, n, q) {
    var gap = tiles.indexOf(n * n - 1);
    tiles[gap] = tiles[q];
    tiles[q] = n * n - 1;
  }

  /* the whole board, as [{p, stage}] where p is the cell to slide; null if a stage cannot be planned */
  function solve(n, tiles) {
    var work = tiles.slice(), out = [], plan = stages(n), locked = [];
    for (var s = 0; s < plan.length; s++) {
      var moves = find(n, work, plan[s], locked);
      if (!moves) return null;
      for (var i = 0; i < moves.length; i++) { out.push({ p: moves[i], stage: s }); step(work, n, moves[i]); }
      for (var j = 0; j < plan[s].length; j++) locked.push(plan[s][j].p);
    }
    return out;
  }

  /* one custom goal, for a tutorial lesson: [{p: piece, at: position}], with `keep` pieces left where they are */
  function goalPlan(n, tiles, targets, keep) {
    var moves = find(n, tiles, targets, keep);
    if (!moves) return null;
    return moves.map(function (p) { return { p: p, stage: 0 }; });
  }

  return { stages: stages, solve: solve, goalPlan: goalPlan };
})();
</script>
<script>
(function () {
  var HAS_PAD = typeof PAD !== "undefined";
  var TONES = [[31, 42, 20], [74, 90, 50], [125, 138, 88], [163, 173, 126]];   /* PAD.TONES as RGB: 0 ink ... 3 paper */
  var W = 128, H = 112;   /* PAD.camera.snap({size: "small"}): the camera's standard film, 8:7 */

  /* two languages: PAD.lang from the runtime; older runtimes have none, so Chinese is the default */
  var LANG = HAS_PAD && PAD.lang === "en" ? "en" : "zh";
  var TXT = {
    zh: { title: "拍照拼图", snap: "拍一张", builtin: "用内置图片", imp: "导入图片", use: "用这张", retake: "重拍",
      other: "换一张", again: "重来", size: "换难度", resume: "继续", fresh: "新的一局", next: "下一局",
      newphoto: "拍新照片", moves: "{n} 步", best: "最佳 {n}", taking: "拍照中…", importing: "读图片…",
      watch: "看它解", helped: "助",
      intro: "拍一张照片，切成方块打乱，再拼回来。", nocam: "这台掌机不能拍照，用内置图片玩。",
      nophoto: "没拿到照片，用内置图片玩。", nofile: "没选图片。", badimg: "这张图读不出来。",
      saved: "上次那盘还在这里。", look: "就用这张吗？", won: "拼好了！{n} 步。", record: "新纪录！",
      unlocked: "下一局是 4×4。", locked: "先拼好一次 3×3",
      kTitle: "↑↓ 选　A 确定", kPreview: "A 用这张　B 重拍", kPreviewFile: "A 用这张　B 换一张",
      kPlay: "方向键 推　A 看原图　START 菜单　SELECT 提示", kMenu: "↑↓ 选　A 确定　B 返回", kWon: "↑↓ 选　A 确定",
      kSolved: "A 继续", solved: "拼好了！", cont: "继续",
      howto: "怎么玩", quitLesson: "退出教程", nextLesson: "下一课", backTitle: "回到标题",
      lessonDone: "做到了！", lessonN: "第 {n} 课", kLesson: "方向键 推　SELECT 提示　START 退出",
      lesson1: "方向键把空格旁边的块推进空格。把这盘拼好。", lesson2: "把 1 号块送到左上角。",
      lesson3: "一行的最后两块：先把 3 放在 2 的下面，再一起转进去。",
      lesson4: "拼好一行就别再碰它。最后两行一列一列拼。看一遍就行。",
      demoEnd: "看完了：拼好一行，再拼下一行。", trick: "4×4 有窍门：试试「怎么玩」。",
      stage3: ["第 1 行：送 1 号块", "第 1 行：最后两块一起", "第 1 列：3、6 一起", "最后 2×2：转到位"],
      stage4: ["第 1 行：送 1 号块", "第 1 行：送 2 号块", "第 1 行：最后两块一起", "第 2 行：送 5 号块",
        "第 2 行：送 6 号块", "第 2 行：最后两块一起", "最后两行：9、13 一起", "最后两行：10、14 一起",
        "最后 2×2：转到位"] },
    en: { title: "SNAPTILE", snap: "Take a photo", builtin: "Built-in picture", imp: "Import a picture", use: "Use this",
      retake: "Retake", other: "Choose another", again: "Restart", size: "Size", resume: "Resume", fresh: "New puzzle",
      next: "Next", newphoto: "New photo", moves: "{n} moves", best: "best {n}", taking: "Camera…",
      importing: "Reading…", watch: "Watch it solve", helped: "aid", intro: "Take a photo, it is cut up and shuffled: slide it back.",
      nocam: "No camera here: playing with the built-in picture.", nophoto: "No photo: playing with the built-in picture.",
      nofile: "No picture chosen.", badimg: "That picture could not be read.",
      saved: "Your last puzzle is here.", look: "Use this one?", won: "Solved in {n} moves!", record: "New record!",
      unlocked: "Next one is 4×4.", locked: "Solve a 3×3 first",
      kTitle: "↑↓ pick  A ok", kPreview: "A use  B retake", kPreviewFile: "A use  B choose another",
      kPlay: "D-pad slide  A peek  START menu  SELECT hint", kMenu: "↑↓ pick  A ok  B back", kWon: "↑↓ pick  A ok",
      kSolved: "A continue", solved: "Solved!", cont: "Continue",
      howto: "How to play", quitLesson: "Leave lesson", nextLesson: "Next lesson", backTitle: "Back to title",
      lessonDone: "Done!", lessonN: "Lesson {n}", kLesson: "D-pad slide  SELECT hint  START leave",
      lesson1: "The arrows push the piece next to the gap into it. Solve this one.",
      lesson2: "Bring tile 1 to the top-left corner.",
      lesson3: "The last two in a row: put 3 under 2, then turn them in together.",
      lesson4: "Once a row is done, leave it alone. The last two rows go column by column. Just watch.",
      demoEnd: "That is the idea: one row, then the next.", trick: "4×4 has a trick: try How to play.",
      stage3: ["Row 1: bring tile 1", "Row 1: last two together", "Column 1: 3 and 6 together", "Last 2×2: turn it home"],
      stage4: ["Row 1: bring tile 1", "Row 1: bring tile 2", "Row 1: last two together", "Row 2: bring tile 5",
        "Row 2: bring tile 6", "Row 2: last two together", "Last rows: 9 and 13 together", "Last rows: 10 and 14 together",
        "Last 2×2: turn it home"] }
  }[LANG];
  function tx(key, n) { return TXT[key].replace("{n}", n); }
  function stageText(n, i) { var a = n === 3 ? TXT.stage3 : TXT.stage4; return a[i] || ""; }
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en"; document.title = TXT.title;
  document.getElementById("ttl").textContent = TXT.title;

  /* ---------- the built-in picture: original art, drawn here, dithered like the camera so it looks taken ---------- */
  var BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  function builtin() {
    var px = new Uint8Array(W * H);
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var v;
      var ridge1 = 62 - Math.abs(x - 44) * 0.75, ridge2 = 70 - Math.abs(x - 98) * 0.6;   /* two hills */
      var sun = (x - 96) * (x - 96) + (y - 24) * (y - 24);
      if (y >= 84) {                                       /* the lake: ripples, and the hills upside down */
        var ry = 168 - y;
        v = 0.55 + 0.25 * Math.sin(x * 0.35 + y * 1.7);
        if (ry > ridge1 || ry > ridge2) v -= 0.3;
        if (y % 6 === 0) v = 0.95;
      } else if (y > ridge1 || y > ridge2) {               /* the hills, snow on the high one, a little house on the shore */
        v = 0.3 - (y - Math.min(ridge1, ridge2)) * 0.004;
        if (y > ridge1 && y < ridge1 + 6 && ridge1 < 44) v = 0.9;
        if (x >= 18 && x < 34 && y >= 72 && y < 84) v = (x === 25 || x === 26) && y >= 77 ? 0 : 0.85;
        if (y >= 64 && y < 72 && Math.abs(x - 26) <= 10 - (y - 64)) v = 0.05;
      } else if (sun < 144) {                              /* the sun */
        v = 1;
      } else {                                             /* the sky: darker at the top, a ring of light round the sun */
        v = 0.35 + y * 0.006 + (sun < 260 ? 0.25 : 0);
        if ((x === 20 && y === 30) || (x === 21 && y === 31) || (x === 22 && y === 30) || (x === 60 && y === 18) || (x === 61 && y === 19) || (x === 62 && y === 18)) v = 0;   /* two birds */
      }
      var t = (BAYER[(y % 4) * 4 + (x % 4)] + 0.5) / 16 - 0.5;
      px[y * W + x] = Math.max(0, Math.min(3, Math.round(v * 3 + t)));
    }
    return { w: W, h: H, px: px };
  }
  var BUILTIN = builtin();

  /* ---------- the four lessons: fixed boards, so every player meets the same two moves, pair and row ----------
     Lesson 4 is a 4×4 and a demo only: it plays up to the end of the second row and stops. */
  var LESSONS = [
    { n: 3, tiles: [0, 1, 2, 3, 8, 5, 6, 4, 7], goal: null, keep: [] },
    { n: 3, tiles: [2, 1, 4, 3, 8, 0, 7, 5, 6], goal: [{ p: 0, at: 0 }], keep: [] },
    { n: 3, tiles: [0, 4, 7, 1, 8, 6, 3, 2, 5], goal: [{ p: 1, at: 1 }, { p: 2, at: 2 }], keep: [0] },
    { n: 4, tiles: [14, 2, 5, 7, 4, 15, 10, 11, 1, 9, 0, 12, 13, 6, 3, 8], goal: null, keep: [], demo: 5 }
  ];

  /* ---------- state ---------- */
  var S = { screen: "title", sel: 0, items: [], pic: BUILTIN, shot: null, note: "", titleNote: "", busy: false,
    n: 3, tiles: [], gap: 0, moves: 0, peek: false, big: false, best: {}, record: false,
    src: "builtin", helped: false, saved: null, previewFrom: "camera", demo: null, hint: null, hintOn: false, hintTimer: 0,
    mode: "normal", lesson: 0, lessonDone: false, doneText: "", cameFrom: null, lessonTimer: 0 };
  function sfx(name) { if (HAS_PAD) PAD.sfx(name); }
  function savePuzzle() { if (HAS_PAD) PAD.save("puzzle", { best: S.best, big: S.big }); }

  /* ---------- the unfinished puzzle: PAD.save("game") ----------
     tiles are positions -> pieces, the gap is tile n*n-1 (so no separate gap field can disagree), and the picture
     is four pixels a byte in base64 (about 4.8 KB). Finished puzzles remove the key; a new puzzle overwrites it when
     it actually starts, so backing out of the picture chooser leaves the old one alone. */
  function packPic(px) {
    var out = new Uint8Array((px.length + 3) >> 2), s = "";
    for (var i = 0; i < px.length; i++) out[i >> 2] |= px[i] << ((i % 4) * 2);
    for (var j = 0; j < out.length; j += 4096) s += String.fromCharCode.apply(null, out.subarray(j, j + 4096));
    return btoa(s);
  }
  function unpackPic(str) {
    var s = atob(str), px = new Uint8Array(s.length * 4);
    for (var i = 0; i < s.length; i++) {
      var b = s.charCodeAt(i);
      px[i * 4] = b & 3; px[i * 4 + 1] = (b >> 2) & 3; px[i * 4 + 2] = (b >> 4) & 3; px[i * 4 + 3] = (b >> 6) & 3;
    }
    return px;
  }
  function saveGame() {
    if (!HAS_PAD || !S.tiles.length || S.mode === "tutorial") return;
    var g = { v: 1, n: S.n, tiles: S.tiles.slice(), moves: S.moves, src: S.src, helped: S.helped };
    if (S.src !== "builtin") g.pic = packPic(S.pic.px);
    PAD.save("game", g);
  }
  function dropGame() { if (HAS_PAD) PAD.remove("game"); }
  /* anything wrong with a stored game means "no game", quietly: a tampered or half-written record must not stick */
  function checkGame(g) {
    if (!g || typeof g !== "object" || g.v !== 1) return null;
    var n = g.n, N = n * n, i, j;
    if (n !== 3 && n !== 4) return null;
    if (!Array.isArray(g.tiles) || g.tiles.length !== N) return null;
    var seen = {}, inv = 0;
    for (i = 0; i < N; i++) {
      var v = g.tiles[i];
      if (typeof v !== "number" || v !== (v | 0) || v < 0 || v >= N || seen[v]) return null;
      seen[v] = true;
      if (v !== N - 1) for (j = 0; j < i; j++) if (g.tiles[j] !== N - 1 && g.tiles[j] > v) inv++;
    }
    var gap = g.tiles.indexOf(N - 1);
    if (n % 2 === 1) { if (inv % 2) return null; }
    else if ((inv + (n - ((gap / n) | 0))) % 2 !== 1) return null;   /* blank row from the bottom, 1-based */
    if (typeof g.moves !== "number" || g.moves !== (g.moves | 0) || g.moves < 0) return null;
    if (["camera", "file", "builtin"].indexOf(g.src) < 0) return null;
    var px = null;
    if (g.src !== "builtin") {
      if (typeof g.pic !== "string") return null;
      try { px = unpackPic(g.pic); } catch (e) { return null; }
      if (px.length !== W * H) return null;
    }
    return { n: n, tiles: g.tiles, moves: g.moves, src: g.src, px: px, helped: g.helped === true };
  }
  function restore(g) {
    S.saved = g; S.n = g.n; S.tiles = g.tiles; S.gap = g.tiles.indexOf(g.n * g.n - 1);
    S.moves = g.moves; S.src = g.src; S.helped = g.helped;
    if (g.px) S.pic = { w: W, h: H, px: g.px };
  }
  if (HAS_PAD) {
    Promise.all([
      PAD.load("puzzle").catch(function () { return null; }),
      PAD.load("game").catch(function () { return null; })
    ]).then(function (r) {
      var d = r[0];
      if (d && typeof d === "object") { S.best = d.best && typeof d.best === "object" ? d.best : {}; S.big = d.big === true; }
      var g = checkGame(r[1]);
      if (g) restore(g); else if (r[1]) dropGame();
      draw();
    });
  }

  /* ---------- the camera: PAD.camera.snap ----------
     snap() opens the runtime's own viewfinder over this app. The player presses the shutter (or cancels); the promise
     then gives {w, h, px}: px is a Uint8Array of w*h tone indices, row by row, 0 = ink ... 3 = paper, the same order as
     PAD.TONES. It gives null when the player cancels or says no, there is no camera, or a snap is already open; null is
     normal, so the app always has a way on without a photo. PAD.camera is undefined on runtimes before 0.28.0, and the
     manifest must list "permissions": ["camera"]. */
  function takePhoto() {
    if (!HAS_PAD || !PAD.camera) { useBuiltin(TXT.nocam); return; }
    if (S.busy) return;
    S.busy = true; msg(TXT.taking, false);
    PAD.camera.snap({ size: "small" }).then(function (photo) {
      S.busy = false;
      if (!photo) { useBuiltin(TXT.nophoto); return; }
      /* show it first, as it is: the player may have blinked (sdk/UI.md section 10) */
      S.shot = photo; S.previewFrom = "camera"; sfx("ok"); go("preview");
    });
  }
  function useBuiltin(line) { S.pic = BUILTIN; S.src = "builtin"; S.note = line; sfx("err"); newGame(); }

  /* ---------- imported pictures: PAD.importFile ----------
     The runtime asks the player first, then its file picker (photos, camera, Files) hands back a data: URL, already
     scaled under 2 MB. Crop to the film's 8:7, stretch the contrast between the 1st and 99th percentile of brightness
     (one white speck must not flatten the picture), then Bayer-dither to the four tones: the same recipe as the
     camera, so an imported picture looks taken by this machine too. Nothing of the original is kept. */
  function importPhoto() {
    if (!HAS_PAD || typeof PAD.importFile !== "function" || S.busy) return;
    S.busy = true; msg(TXT.importing, false);
    PAD.importFile({ accept: ["image/*"] }).then(function (f) {
      S.busy = false;
      if (!f || typeof f.data !== "string") { S.titleNote = TXT.nofile; go("title"); return; }
      var im = new Image();
      im.onload = function () {
        var px = photoFrom(im);
        if (!px) { S.titleNote = TXT.badimg; go("title"); return; }
        S.shot = { w: W, h: H, px: px }; S.previewFrom = "file"; sfx("ok"); go("preview");
      };
      im.onerror = function () { S.titleNote = TXT.badimg; go("title"); };
      im.src = f.data;
    }).catch(function () { S.busy = false; S.titleNote = TXT.badimg; go("title"); });
  }

    var iw = im.naturalWidth || im.width, ih = im.naturalHeight || im.height;

    var x = c.getContext("2d"), aim = W / H, sw, sh, sx, sy;

    else { sw = iw; sh = iw / aim; sx = 0; sy = (ih - sh) / 2; }

  /* ---------- the puzzle: tiles[position] = which piece is there; piece n*n-1 is the gap ---------- */
  function newGame() {
    var n = S.n, N = n * n;
    S.tiles = []; for (var i = 0; i < N; i++) S.tiles.push(i);
    S.gap = N - 1; S.moves = 0; S.peek = false; S.record = false; S.helped = false; S.showTrick = false;
    S.saved = null; S.titleNote = "";
    /* shuffle with legal moves only, never straight back: every puzzle can be solved */
    var back = -1, steps = n === 3 ? 80 : 200;
    for (var k = 0; k < steps || solved(); k++) {
      var opts = neighbours(S.gap).filter(function (p) { return p !== back; });
      var p = opts[Math.floor(Math.random() * opts.length)];

    go("play");
  }
  function neighbours(g) {
    var n = S.n, r = Math.floor(g / n), c = g % n, out = [];
    if (r > 0) out.push(g - n); if (r < n - 1) out.push(g + n);
    if (c > 0) out.push(g - 1); if (c < n - 1) out.push(g + 1);

  function solved() { for (var i = 0; i < S.tiles.length; i++) if (S.tiles[i] !== i) return false; return true; }
  /* the piece at p slides into the gap, if it is next to it */
  function slide(p) {
    clearHint();

    swap(p); S.moves++; sfx("move");
    if (S.mode === "tutorial") {
      if (!S.lessonDone && goalMet()) { S.lessonDone = true; S.doneText = TXT.lessonDone; sfx("ok"); }
      draw();

  }
  /* a direction pushes the piece on that side of the gap towards it: up moves the piece below the gap up */
  function push(dir) {

    var p = dir === "up" ? (r < n - 1 ? S.gap + n : -1) : dir === "down" ? (r > 0 ? S.gap - n : -1)
      : dir === "left" ? (c < n - 1 ? S.gap + 1 : -1) : (c > 0 ? S.gap - 1 : -1);
    if (p < 0) { sfx("err"); return; }

  }
  function win() {
    var key = String(S.n), best = S.best[key];

    S.record = !S.helped && (!best || S.moves < best);
    S.showTrick = S.n === 4 && !best;   /* the first recorded 4×4 win points at the lessons */
    if (S.record) S.best[key] = S.moves;
    var first = S.n === 3 && !S.big;
    if (first) S.big = true;
    savePuzzle(); dropGame();
    sfx("win");
    /* a short tune of our own for the win; PAD.music is undefined before runtime 0.11.0 */
    if (HAS_PAD && PAD.music) PAD.music.play({ bpm: 150, p1: "@1 v12 o5 l16 c e g >c8 r <g >c4", tri: "v11 o3 l8 c g >c4" }, { loop: false });
    S.unlockedNow = first;   /* the next puzzle is 4x4; the moves line still shows this one until then */
    S.anim = { t0: 0, landed: false, done: false };
    go("solved");
    requestAnimationFrame(tick);
  }

  /* ---------- the solved picture: the last piece drops in, the cuts melt away, a glint runs over it ----------
     Times in ms from the start; then the whole photo stays until the player goes on (A or the button) */
  var DROP = 450, MELT = 1050, GLINT = 1600;
  function tick(t) {
    var a = S.anim; if (S.screen !== "solved" || !a || a.done) return;
    if (!a.t0) a.t0 = t;
    a.ms = t - a.t0;
    if (!a.landed && a.ms >= DROP) { a.landed = true; sfx("ok"); }
    if (a.ms >= GLINT) { endAnim(); return; }
    paint();
    requestAnimationFrame(tick);
  }
  /* A or a tap during the animation jumps to its end */
  function endAnim() { S.anim.done = true; S.anim.ms = GLINT; draw(); }

  /* ---------- drawing: the picture, cut into cells, written with putImageData ----------
     A piece is a raised plastic tile: 1 px of paper on its top and left, 1 px of ink on its bottom and right (the old
     cut line, now the shadow side). The empty slot is a hole: 3-4 px of ink shadow on the top and left, 1 px of lit
     paper on the bottom and right, and a flat dark floor. Shape, not colour, so it reads even on a dark photo. */
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d"), img = ctx.createImageData(W, H);
  function edges(n, size) { var e = []; for (var i = 0; i <= n; i++) e.push(Math.round(i * size / n)); return e; }
  var RECTS = {};
  function rects(n) {
    if (RECTS[n]) return RECTS[n];
    var xs = edges(n, W), ys = edges(n, H), x = [], y = [], w = [], h = [];
    for (var p = 0; p < n * n; p++) {
      var c = p % n, r = (p / n) | 0;
      x.push(xs[c]); y.push(ys[r]); w.push(xs[c + 1] - xs[c]); h.push(ys[r + 1] - ys[r]);
    }
    RECTS[n] = { xs: xs, ys: ys, x: x, y: y, w: w, h: h };
    return RECTS[n];
  }
  function put(out, X, Y, v, stop) {
    if (X < 0 || X >= W || Y < 0 || Y >= H || (stop && Y >= stop)) return;

  }
  /* piece t drawn into cell p; dy slides it down (the last piece dropping into its slot) */
  function tile(out, src, R, p, t, dy) {
    var x0 = R.x[p], y0 = R.y[p], w = R.w[p], h = R.h[p], sx = R.x[t], sy = R.y[t];
    var bottom = dy ? y0 + h : 0, x, y, oy = dy || 0;
    for (y = 1; y < h - 1; y++) for (x = 1; x < w - 1; x++) put(out, x0 + x, y0 + y + oy, src[(sy + y) * W + sx + x], bottom);
    for (x = 1; x < w - 1; x++) { put(out, x0 + x, y0 + oy, 3, bottom); put(out, x0 + x, y0 + h - 1 + oy, 0, bottom); }
    for (y = 1; y < h - 1; y++) { put(out, x0, y0 + y + oy, 3, bottom); put(out, x0 + w - 1, y0 + y + oy, 0, bottom); }
    put(out, x0, y0 + oy, 3, bottom); put(out, x0 + w - 1, y0 + oy, 0, bottom);
    put(out, x0, y0 + h - 1 + oy, 0, bottom); put(out, x0 + w - 1, y0 + h - 1 + oy, 0, bottom);
  }
  /* the empty slot is a hole: an ink floor, with 1 px of lit paper on its bottom and right walls. The floor is ink
     rather than the dark tone on purpose: on a bright picture a dark-green floor reads as a raised plate, while an
     ink hole with a lit lip reads as a hole on bright and dark pictures alike (see the screenshots in the PR). */
  function slot(out, R, p) {
    var x0 = R.x[p], y0 = R.y[p], w = R.w[p], h = R.h[p];
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {

  function board(out, src, n, tiles) {

    }
  }
  /* the hint's frame: the next piece's cell, inverted for a moment */
  function ring(out, R, p) {

    for (x = 0; x < w; x++) { out[y0 * W + x0 + x] = 3 - out[y0 * W + x0 + x]; out[(y0 + h - 1) * W + x0 + x] = 3 - out[(y0 + h - 1) * W + x0 + x]; }
    for (y = 0; y < h; y++) { out[(y0 + y) * W + x0] = 3 - out[(y0 + y) * W + x0]; out[(y0 + y) * W + x0 + w - 1] = 3 - out[(y0 + y) * W + x0 + w - 1]; }

    for (y = 0; y < H; y++) { m[y * W] = 1; m[y * W + W - 1] = 1; }
    for (k = 1; k < n; k++) {
      x = R.xs[k];
      for (y = 0; y < H; y++) { m[y * W + x] = 1; m[y * W + x - 1] = 1; }
      y = R.ys[k];

  }
  function frame() {

    }

    var n = S.n, out = new Uint8Array(W * H);

    ctx.putImageData(img, 0, 0);

  /* the canvas as large as the stage allows, 8:7 */
  function layout() {

    var k = Math.max(1, Math.min(w / W, h / H));

  }
  window.addEventListener("resize", layout);

  /* ---------- watching it solve, and one hint ----------
     Both use the Solver's row-by-row plan for the board as it is now. The demo plays it at three moves a second with
     the stage as a subtitle; any key or tap stops it and leaves the player right there, to go on by hand. A game that
     watched or asked for a hint keeps its moves, its music and its unlock, but gets no best score (the header shows
     助). One rule, no extra setting. */
  function startDemo(limit) {
    if (S.demo) return;
    var plan = Solver.solve(S.n, S.tiles);
    if (!plan || !plan.length) { sfx("err"); return; }
    if (S.mode !== "tutorial") { S.helped = true; saveGame(); }
    clearHint();
    S.demo = { steps: plan, i: 0, timer: 0, limit: limit === undefined ? 999 : limit };
    demoStep();
  }
  function demoStep() {
    var d = S.demo; if (!d) return;
    if (d.i >= d.steps.length || d.steps[d.i].stage > d.limit) { endDemo(); return; }
    var st = d.steps[d.i++];

  }
  /* the plan ran out, or the lesson's demo reached the stage it stops at */
  function endDemo() {

    S.note = "";

    draw();
  }
  function stopDemo() {
    if (!S.demo) return;
    clearTimeout(S.demo.timer); S.demo = null;
    S.note = "";
    /* the 4×4 lesson is only a demo: stopping it counts as having seen it */
    if (S.mode === "tutorial" && S.screen === "lesson" && !S.lessonDone && LESSONS[S.lesson].demo !== undefined) {
      S.lessonDone = true; S.doneText = TXT.demoEnd; sfx("ok");

    draw();
  }
  /* SELECT: flash the piece the next step would push, but do not push it */
  function hint() {

    var plan;

      plan = L.goal ? Solver.goalPlan(S.n, S.tiles, L.goal, L.keep) : Solver.solve(S.n, S.tiles);
    } else plan = Solver.solve(S.n, S.tiles);
    if (!plan || !plan.length) { sfx("err"); return; }
    if (S.mode !== "tutorial") { S.helped = true; saveGame(); }
    S.hint = { p: plan[0].p }; S.hintOn = true; draw();   /* draw, not paint: the header gains 助 */
    var k = 0;

      if (k >= 4) clearHint();   /* two flashes */
    }, 150);

  }

  /* ---------- the four lessons (怎么玩) ----------
     Fixed boards, so everyone meets the same two moves, the same pair and the same row. The goal is checked after
     every slide; a lesson never calls win(), so no best, no 4×4 unlock and no music come out of it, and a lesson is
     never written to the saved game. Leaving a lesson that was entered from a game goes back to that game. */
  function lessonText() { return TXT["lesson" + (S.lesson + 1)]; }
  function startLesson(i, fromGame) {
    clearTimeout(S.lessonTimer); S.lessonTimer = 0;
    if (i === 0) S.cameFrom = fromGame ? { n: S.n, tiles: S.tiles.slice(), moves: S.moves, src: S.src, pic: S.pic, helped: S.helped } : null;
    var L = LESSONS[i];
    S.mode = "tutorial"; S.lesson = i; S.lessonDone = false; S.doneText = "";
    S.n = L.n; S.tiles = L.tiles.slice(); S.gap = S.tiles.indexOf(S.n * S.n - 1);
    S.moves = 0; S.helped = false; S.note = ""; S.peek = false;
    S.pic = BUILTIN; S.src = "builtin"; S.demo = null; S.saved = null;
    go("lesson");
    if (L.demo !== undefined) S.lessonTimer = setTimeout(function () {
      if (S.mode === "tutorial" && S.lesson === i && S.screen === "lesson" && !S.lessonDone && S.moves === 0) startDemo(L.demo);
    }, 600);
  }
  function nextLesson() {
    if (S.lesson < LESSONS.length - 1) startLesson(S.lesson + 1, false);
    else endTutorial();
  }
  function endTutorial() {
    clearTimeout(S.lessonTimer); S.lessonTimer = 0;
    if (S.demo) { clearTimeout(S.demo.timer); S.demo = null; }
    clearHint();
    var back = S.cameFrom; S.cameFrom = null;
    S.mode = "normal"; S.lessonDone = false; S.doneText = ""; S.note = ""; S.helped = false;
    if (back) {
      S.n = back.n; S.tiles = back.tiles; S.gap = back.tiles.indexOf(back.n * back.n - 1);
      S.moves = back.moves; S.src = back.src; S.pic = back.pic; S.helped = back.helped; S.saved = null;
      go("play");
    } else {
      S.n = 3; S.tiles = []; S.moves = 0; S.pic = BUILTIN; S.src = "builtin"; S.saved = null;
      go("title");
    }
  }
  function goalMet() {
    var L = LESSONS[S.lesson], i;
    for (i = 0; i < L.keep.length; i++) if (S.tiles[L.keep[i]] !== L.keep[i]) return false;
    if (!L.goal) return solved();
    for (i = 0; i < L.goal.length; i++) if (S.tiles[L.goal[i].at] !== L.goal[i].p) return false;
    return true;
  }

  /* ---------- screens ---------- */
  function msg(text, note) { var m = document.getElementById("msg"); m.textContent = text; m.className = note ? "note" : ""; }
  function go(screen) { clearHint(); S.screen = screen; S.sel = 0; draw(); }
  function menuItems() {
    var camera = HAS_PAD && !!PAD.camera, files = HAS_PAD && typeof PAD.importFile === "function";
    if (S.screen === "title") {
      if (S.saved) return [["cont", TXT.cont], ["fresh", TXT.fresh]];
      var out = [];
      if (camera) out.push(["snap", TXT.snap]);
      out.push(["builtin", TXT.builtin]);
      if (files) out.push(["import", TXT.imp]);
      out.push(["howto", TXT.howto]);
      return out;
    }
    if (S.screen === "preview") return [["use", TXT.use], ["other", S.previewFrom === "file" ? TXT.other : TXT.retake]];
    if (S.screen === "menu") {
      if (S.mode === "tutorial") return [["resume", TXT.resume], ["quit", TXT.quitLesson]];
      return [["resume", TXT.resume]].concat(camera ? [["retake", TXT.retake]] : [])
        .concat([["size", TXT.size, !S.big], ["again", TXT.again], ["watch", TXT.watch], ["howto", TXT.howto]]);
    }
    if (S.screen === "lesson" && S.lessonDone) return [["nextlesson", S.lesson < LESSONS.length - 1 ? TXT.nextLesson : TXT.backTitle]];
    if (S.screen === "solved") return S.anim && S.anim.done ? [["goon", TXT.cont]] : [];
    if (S.screen === "won") return [["next", TXT.next]].concat(camera ? [["newphoto", TXT.newphoto]] : []);
    return [];
  }
  function infoText() {
    var sc = S.screen, best = S.best[String(S.n)];
    var aid = S.helped ? "  " + TXT.helped : "";
    if (S.mode === "tutorial") return tx("lessonN", S.lesson + 1) + "  " + tx("moves", S.moves);
    if (sc === "title") return S.saved ? S.n + "×" + S.n + "  " + tx("moves", S.moves) + aid : "";
    if (sc !== "play" && sc !== "menu" && sc !== "solved" && sc !== "won") return "";
    return S.n + "×" + S.n + "  " + tx("moves", S.moves) + (best ? "  " + tx("best", best) : "") + aid;
  }
  function draw() {
    var sc = S.screen, camera = HAS_PAD && !!PAD.camera;
    document.getElementById("info").textContent = infoText();
    if (sc === "title") {
      if (S.saved) msg(TXT.saved, false);
      else if (S.titleNote) msg(S.titleNote, false);
      else msg(camera ? TXT.intro : TXT.nocam, !camera);
    }
    else if (sc === "preview") msg(TXT.look, false);
    else if (sc === "play") msg(S.note, !!S.note);
    else if (sc === "menu") msg("", false);
    else if (sc === "lesson") msg(S.lessonDone ? S.doneText : (S.note || lessonText()), S.lessonDone);
    else if (sc === "solved") msg(S.anim && S.anim.done ? TXT.solved : "", false);
    else if (sc === "won") msg(tx("won", S.moves) + (S.record ? " " + TXT.record : "") + (S.unlockedNow ? " " + TXT.unlocked : "") + (S.showTrick ? " " + TXT.trick : ""), false);
    document.getElementById("ft").textContent = TXT[{
      title: "kTitle", preview: S.previewFrom === "file" ? "kPreviewFile" : "kPreview",
      play: "kPlay", menu: "kMenu", lesson: "kLesson", solved: "kSolved", won: "kWon"
    }[sc]];
    S.items = menuItems();
    var box = document.getElementById("menu"); box.textContent = "";
    S.items.forEach(function (it, i) {
      var b = document.createElement("button"); b.type = "button"; b.textContent = it[1];
      b.className = (i === S.sel ? "on" : "") + (it[2] ? " off" : "");
      b.onclick = function () { S.sel = i; choose(); };
      box.appendChild(b);
    });
    paint(); layout();
  }
  function choose() {
    var it = S.items[S.sel]; if (!it || S.busy) return;
    if (it[2]) { sfx("err"); msg(TXT.locked, true); return; }
    var id = it[0];
    var fromGame = S.screen === "menu" && S.mode === "normal";
    if (id === "title" || id === "play") S.titleNote = "";
    if (S.unlockedNow && (id === "next" || id === "newphoto")) { S.n = 4; S.unlockedNow = false; }
    if (id === "snap" || id === "retake" || id === "newphoto") { sfx("tap"); takePhoto(); }
    else if (id === "import") { sfx("tap"); importPhoto(); }
    else if (id === "builtin") { S.pic = BUILTIN; S.src = "builtin"; S.note = HAS_PAD && PAD.camera ? "" : TXT.nocam; sfx("ok"); newGame(); }
    else if (id === "use") { S.pic = S.shot; S.src = S.previewFrom === "file" ? "file" : "camera"; S.note = ""; newGame(); }
    else if (id === "other") { if (S.previewFrom === "file") importPhoto(); else takePhoto(); }
    else if (id === "cont") { sfx("tap"); S.saved = null; S.titleNote = ""; go("play"); }
    else if (id === "fresh") { sfx("tap"); S.saved = null; S.tiles = []; S.moves = 0; S.helped = false; S.pic = BUILTIN; S.src = "builtin"; S.titleNote = ""; go("title"); }
    else if (id === "resume") { sfx("tap"); go("play"); }
    else if (id === "again") { sfx("tap"); newGame(); }
    else if (id === "size") { S.n = S.n === 3 ? 4 : 3; sfx("tick"); newGame(); }
    else if (id === "next") { S.note = ""; newGame(); }
    else if (id === "watch") { sfx("tap"); go("play"); startDemo(); }
    else if (id === "howto") { sfx("tap"); startLesson(0, fromGame); }
    else if (id === "quit") { sfx("tap"); endTutorial(); }
    else if (id === "nextlesson") { sfx("tap"); nextLesson(); }
    else if (id === "goon") { sfx("tap"); go("won"); }
  }

  /* ---------- keys and touch ---------- */
  if (HAS_PAD) {
    PAD.on("press", function (b) {
      if (S.busy) return;
      if (S.demo) { stopDemo(); return; }   /* the key that stops the demo does not also move a piece */
      var sc = S.screen;
      if ((sc === "play" || sc === "lesson") && !(sc === "lesson" && S.lessonDone)) {
        if (b === "up" || b === "down" || b === "left" || b === "right") push(b);
        else if (b === "a") { S.peek = true; paint(); }
        else if (b === "select") hint();
        else if (b === "start") { sfx("tap"); go("menu"); }
        return;
      }
      if (sc === "solved") {
        if (b === "a") { if (S.anim.done) choose(); else endAnim(); }
        return;
      }
      if (sc === "preview") {
        if (b === "a") { S.sel = 0; choose(); } else if (b === "b") { S.sel = 1; choose(); }
        return;
      }
      if (b === "up" || b === "down" || b === "left" || b === "right") {   /* the buttons sit two to a row: any arrow walks them */
        var n = S.items.length; if (!n) return;
        S.sel = (S.sel + (b === "down" || b === "right" ? 1 : n - 1)) % n; sfx("move"); draw();
      } else if (b === "a") choose();
      else if (b === "b" && sc === "menu") { sfx("tap"); go(S.mode === "tutorial" ? "lesson" : "play"); }
    });
    /* the peek lasts while A is held */
    PAD.on("release", function (b) { if (b === "a" && S.peek) { S.peek = false; paint(); } });
  }
  /* touch: tap a piece next to the gap, or swipe a piece towards the gap. A swipe that points anywhere else is refused
     with the error sound, like a key with nothing to push */
  function cellAt(e) {
    var r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
    var xs = edges(S.n, W), ys = edges(S.n, H), c = 0, row = 0;
    while (c < S.n - 1 && x >= xs[c + 1]) c++;
    while (row < S.n - 1 && y >= ys[row + 1]) row++;
    return row * S.n + c;
  }
  var touch = null, swallow = false, SWIPE = 12;   /* CSS px: less than this is a tap */
  cv.addEventListener("pointerdown", function (e) {
    if (S.demo) { stopDemo(); return; }
    if (S.screen !== "play" && S.screen !== "lesson") return;
    if (S.screen === "lesson" && S.lessonDone) return;
    touch = { id: e.pointerId, x: e.clientX, y: e.clientY, cell: cellAt(e) };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cv.addEventListener("pointercancel", function () { touch = null; });
  cv.addEventListener("pointerup", function (e) {
    var t = touch; touch = null;
    if (!t || t.id !== e.pointerId || (S.screen !== "play" && S.screen !== "lesson") || S.lessonDone) return;
    swallow = true;   /* the click that follows belongs to this touch, even when it solved the puzzle */
    var dx = e.clientX - t.x, dy = e.clientY - t.y;
    if (Math.abs(dx) < SWIPE && Math.abs(dy) < SWIPE) { slide(t.cell); return; }
    var n = S.n, r = Math.floor(t.cell / n), c = t.cell % n, to;
    if (Math.abs(dx) > Math.abs(dy)) to = dx > 0 ? (c < n - 1 ? t.cell + 1 : -1) : (c > 0 ? t.cell - 1 : -1);
    else to = dy > 0 ? (r < n - 1 ? t.cell + n : -1) : (r > 0 ? t.cell - n : -1);
    if (to !== S.gap) { sfx("err"); return; }
    slide(t.cell);
  });
  /* after the puzzle: a tap skips the animation, then goes on */
  cv.addEventListener("click", function () {
    if (swallow) { swallow = false; return; }
    if (S.screen === "solved") { if (S.anim.done) { S.sel = 0; choose(); } else endAnim(); }
  });

  /* for tests/e2e.test.mjs: where the pieces are, so a test can solve the puzzle with real key presses */
  window.PUZZLE = { state: function () { return { screen: S.screen, n: S.n, tiles: S.tiles.slice(), gap: S.gap, moves: S.moves, fromCamera: S.pic !== BUILTIN, src: S.src, helped: S.helped, saved: !!S.saved, demo: !!S.demo, hint: !!S.hint, mode: S.mode, lesson: S.lesson, lessonDone: S.lessonDone, animDone: !!(S.anim && S.anim.done) }; } };

  draw();
})();
</script>
</body>
</html>
