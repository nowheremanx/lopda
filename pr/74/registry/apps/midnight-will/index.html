function afterLines() {
  if (CUR.type === "ending") { showEndingCard(); return; }
  if (CUR.choice) {
    MODE = "choice"; CHOICE = 0;
    renderChoices(CUR.choice);
    setFooter(T("choose") + "　START " + T("menu"));
  } else if (CUR.next) { go(CUR.next); }
}
function showEndingCard() {
  setDlg("", CUR.card);
  MODE = "choice"; CHOICE = 0;
  if (CUR.notes) renderChoices([{ text: "写入记事本", act: "notes" }, { text: "不写", act: "skipnotes" }]);
  else renderChoices([{ text: T("title"), act: "title" }]);
  setFooter(T("choose"));
  sfx("coin");
}
function startEnding() {
  S.flags.endings[CUR.ending] = true;
  S.lastEnding = CUR.ending;
  save();
  if (CUR.tts) { try { if (PADOK) PAD.say("晚安。", { lang: "zh" }); } catch (e) {} }
  if (CUR.art) drawScene(CUR.art, CUR.artOpt);
  setFooter(T("cont") + "　START " + T("menu"));
  MODE = "lines"; LINE = 0;
  showLines(CUR.lines || [], afterLines);
}
function doNotes() {
  $("choices").innerHTML = "";
  setDlg("", "正在写入……");
  try {
    if (PADOK && PAD.notes) {
      var r = PAD.notes.append("凌晨零点的遗嘱", "林澜已经走了。\n至少这一次。");
      var done = function () { endingTitleChoice(); };
      if (r && r.then) r.then(done, done); else done();
      return;
    }
  } catch (e) {}
  endingTitleChoice();
}
function endingTitleChoice() {
  setDlg("", CUR.card);
  MODE = "choice"; CHOICE = 0;
  renderChoices([{ text: T("title"), act: "title" }]);
  setFooter(T("choose"));
}
function newGame() {
  var e = S.flags.endings;
  endSpecial();
  if (e["delete"] && e["keep"] && e["unknown"] && !e["true"]) go("trueIntro");
  else go("s01");
}
function showTitle() {
  endSpecial();
  MODE = "title"; MENU = false;
  S.node = "title";
  var e = S.flags.endings, n = 0;
  for (var k in e) if (e[k]) n++;
  drawScene("title");
  $("portrait").classList.add("hidden");
  setClock("23:47");
  setDlg("", "凌晨零点的遗嘱\nThe Will at Midnight\n\n" + (n > 0 ? "结局 " + n + " / 5" : ""));
  var opts = [{ text: T("newGame"), act: "newgame" }];
  if (S.started && S.resumeNode && S.resumeNode !== "title") opts.push({ text: T("contGame"), act: "continue" });
  if (n > 0) opts.push({ text: T("endings"), act: "gallery" });
  MODE = "choice"; CHOICE = 0;
  renderChoices(opts);
  setFooter(T("choose"));
}
function showGallery() {
  var defs = [
    { k: "delete", label: T("endA") }, { k: "keep", label: T("endB") },
    { k: "unknown", label: T("endC") }, { k: "confront", label: T("endD") },
    { k: "true", label: T("endT") }
  ];
  MODE = "choice"; CHOICE = 0;
  setDlg("", T("endings"));
  var opts = [];
  for (var i = 0; i < defs.length; i++) {
    opts.push({ text: S.flags.endings[defs[i].k] ? defs[i].label : T("locked"), act: "gallery-item", ending: defs[i].k });
  }
  opts.push({ text: T("title"), act: "title" });
  renderChoices(opts);
  setFooter(T("choose"));
}
function showGalleryItem(k) {
  var cards = {
    delete: "ENDING A · DELETE\n\n谢谢。\n这次是真的。",
    keep: "ENDING B · KEEP\n\n明天见。",
    unknown: "ENDING C · I DON'T KNOW\n\n这次不用你替我做决定了。",
    confront: "ENDING D · NOT YOUR QUESTION\n\n因为我不知道……\n我到底有没有把真正的你删掉。",
    "true": "TRUE ENDING\n\nTHANK YOU\nFOR REMEMBERING"
  };
  setDlg("", S.flags.endings[k] ? cards[k] : T("locked"));
  MODE = "choice"; CHOICE = 0;
  renderChoices([{ text: T("title"), act: "title" }]);
  setFooter(T("choose"));
}
function showBeat(lines, nextFn) {
  var i = 0;
  MODE = "lines";
  drawScene("black");
  $("portrait").classList.add("hidden");
  function step() {
    if (i >= lines.length) { nextFn(); return; }
    setDlg("", lines[i]);
    setFooter(T("cont"));
    SPECIAL = { key: function (b) { if (b === "a") { i++; endSpecial(); step(); } } };
  }
  step();
}
function boot() {
  load(function (v) {
    if (v) { for (var k in v) S[k] = v[k]; }
    var e = S.flags.endings || {};
    var any = e["delete"] || e["keep"] || e["unknown"] || e["confront"] || e["true"];
    if (S.lastEnding === "keep") {
      showBeat(["23:47\nNEW MESSAGE\nFROM: LAN", "你今天为什么这么晚？"], showTitle);
    } else if (any) {
      showBeat(["LAST SESSION\n23:47 → 00:00", "MEMORY FRAGMENT\nRECOVERED", "你真的觉得我是她吗？"], showTitle);
    } else { showTitle(); }
  });
}
boot();
</script>
</body>
</html>
