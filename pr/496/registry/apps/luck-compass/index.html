<script data-src="src/luck.js">
/* LuckyWay: the almanac's arithmetic, with no DOM and no PAD calls, so Node can test it.
   The day changes at 0:00 local time, as printed almanacs do; the old 23:00 子初 rule is
   deliberately not used. MIT License. Copyright (c) 2026 Haowei Wu. */
var LUCK = (function () {
  "use strict";

  var STEMS = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
  var BRANCHES = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];

  /* Gregorian date -> Julian day number, all in integers (Fliegel-Van Flandern).
     2000-01-01 is 2451545. */
  function jdn(y, m, d) {
    var a = Math.floor((14 - m) / 12);
    var yy = y + 4800 - a;
    var mm = m + 12 * a - 3;
    return d + Math.floor((153 * mm + 2) / 5) + 365 * yy +
      Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
  }

  /* the 60-day cycle: 0 is 甲子, so 2000-01-01 (JDN 2451545) is index 54, 戊午 */
  function dayIndex(y, m, d) {
    var n = (jdn(y, m, d) + 49) % 60;
    return n < 0 ? n + 60 : n;
  }

  function pillar(y, m, d) {
    var i = dayIndex(y, m, d), s = i % 10, b = i % 12;
    return { index: i, stem: s, branch: b, name: STEMS[s] + BRANCHES[b] };
  }

  /* The five positions an old almanac lists together, in degrees:
     0 北, 45 东北, 90 东, 135 东南, 180 南, 225 西南, 270 西, 315 西北.
     Rows are stems 甲..癸; columns are 喜神, 财神, 福神, 阳贵神, 阴贵神.
     喜/财/福 match 6tail's LunarUtil.POSITION_XI/CAI/FU (default) and lunisolar;
     阳贵/阴贵 match LunarUtil.POSITION_YANG_GUI / POSITION_YIN_GUI. The other
     福神 school in circulation (not used here) puts 福神 at 甲乙东南, 丙丁正东,
     戊正北, 己正南, 庚辛西南, 壬西北, 癸正西. */
  var GODS = [
    [45, 45, 0, 225, 45],
    [315, 45, 225, 225, 0],
    [225, 225, 315, 270, 315],
    [180, 225, 135, 315, 270],
    [135, 0, 45, 45, 225],
    [45, 0, 0, 0, 225],
    [315, 90, 225, 180, 45],
    [225, 90, 315, 45, 180],
    [180, 180, 135, 90, 135],
    [135, 180, 45, 135, 90]
  ];

  function gods(stem) {
    var row = GODS[((stem % 10) + 10) % 10];
    return { xi: row[0], cai: row[1], fu: row[2], yang: row[3], yin: row[4] };
  }

  /* the 45-degree sector a heading falls in; each sector reaches 22.5 degrees each way,
     so 337.5..360 and 0..22.5 are all north. null in, null out (no compass). */
  function sector(heading) {
    if (typeof heading !== "number" || !isFinite(heading)) return null;
    var h = ((heading % 360) + 360) % 360;
    return (Math.round(h / 45) % 8) * 45;
  }

  return {
    jdn: jdn,
    dayIndex: dayIndex,
    pillar: pillar,
    gods: gods,
    sector: sector,
    STEMS: STEMS.slice(),
    BRANCHES: BRANCHES.slice()
  };
})();
</script>

  function getDayList(monthGanZhi, dayGanZhi, ji) {
    var l = [];
    var dayIndex = jiaZiIndex(dayGanZhi);
    var month = hex(jiaZiIndex(monthGanZhi));
    var day = hex(dayIndex);
    var right = DAY_YI_JI;
    var index = right.indexOf(day + "=");
    while (index > -1) {
      right = right.substring(index + 3);
      var left = right;
      if (left.indexOf("=") > -1) left = left.substring(0, left.indexOf("=") - 2);
      var months = left.substring(0, left.indexOf(":")), matched = false, i, j;
      for (i = 0, j = months.length; i < j; i += 2) if (months.substring(i, i + 2) === month) { matched = true; break; }
      if (matched) {
        var values = ji ? left.substring(left.indexOf(",") + 1) : left.substring(left.indexOf(":") + 1);
        if (!ji) values = values.substring(0, values.indexOf(","));
        for (i = 0, j = values.length; i < j; i += 2) l.push(YI_JI[parseInt(values.substring(i, i + 2), 16)]);
        break;
      }
      index = right.indexOf(day + "=");
    }
    if (l.length < 1) l.push("无");
    return l;
  }
  function jiaZiIndex(text) {
    var i;
    for (i = 0; i < 60; i++) if (name(i) === text) return i;
    return -1;
  }
  function getDayYi(monthGanZhi, dayGanZhi) { return getDayList(monthGanZhi, dayGanZhi, false); }
  function getDayJi(monthGanZhi, dayGanZhi) { return getDayList(monthGanZhi, dayGanZhi, true); }
  function day(y, m, d) {
    var p = pillars(y, m, d), dayBranch = p.day % 12, monthBranch = p.month % 12;
    var dragonStart = [8, 10, 0, 2, 4, 6, 8, 10, 0, 2, 4, 6][monthBranch];
    var god = GODS[mod(dayBranch - dragonStart, 12)];
    var opposite = mod(dayBranch + 6, 12), chongPillar = name(mod(p.day - 6, 60));
    var shaIndex = dayBranch % 4;
    var monthName = name(p.month), dayName = name(p.day);
    var peng = [PENGZU_GAN[p.day % 10], PENGZU_ZHI[dayBranch]];
    return { lunar: lunar(y, m, d), term: term(y, m, d), nextTerm: nextTerm(y, m, d), pillars: p,
      zodiac: zodiac(p.year % 12), jianchu: JIANCHU[mod(dayBranch - monthBranch, 12)], god: god,
      huangdao: HUANGDAO.indexOf(GODS.indexOf(god)) >= 0,
      chong: { pillar: chongPillar, zodiac: zodiac(opposite) },
      sha: SHA[shaIndex], pengzu: peng, yi: getDayYi(monthName, dayName), ji: getDayJi(monthName, dayName) };
  }
  return { lunar: lunar, term: term, termDay: termDay, nextTerm: nextTerm, TERM_NAMES: TERM_NAMES,
    pillars: pillars, name: name, zodiac: zodiac, day: day };

    ["小畜",0,4,"亨。密云不雨，自我西郊。","风行天上，小畜；君子以懿文德。","Wind crosses heaven; gather strength through gentle restraint."],

    ["泰",0,7,"小往大来，吉亨。","天地交，泰；后以财成天地之道，辅相天地之宜，以左右民。","Heaven and earth meet: peace; share what you have."],

    ["升",4,7,"元亨。用见大人，勿恤，南征吉。","地中生木，升；君子以顺德，积小以高大。","A tree grows within earth; rise through small steady steps."],
    ["困",5,1,"亨，贞，大人吉，无咎。有言不信。","泽无水，困；君子以致命遂志。","The lake is dry; preserve purpose when resources are scarce."],
    ["井",4,5,"改邑不改井，无丧无得，往来井井。汔至亦未繘井，羸其瓶，凶。","木上有水，井；君子以劳民劝相。","Water in a well is shared; tend the source for everyone."],

    ["鼎",4,2,"元吉，亨。","木上有火，鼎；君子以正位凝命。","Fire cooks in a vessel; give good things a sound place."],
    ["震",3,3,"亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。","洊雷，震；君子以恐惧修省。","Thunder follows thunder; meet surprise with alert composure."],
    ["艮",6,6,"艮其背，不获其身；行其庭，不见其人，无咎。","兼山，艮；君子以思不出其位。","Mountains stand together; know where to pause."],
    ["渐",6,4,"女归吉，利贞。","山上有木，渐；君子以居贤德善俗。","A tree grows on a mountain; let progress be gradual."],
    ["归妹",1,3,"征凶，无攸利。","泽上有雷，归妹；君子以永终知敝。","Thunder over the lake; consider the long course before joining."],
    ["丰",2,3,"亨，王假之。勿忧，宜日中。","雷电皆至，丰；君子以折狱致刑。","Thunder and lightning are full; use bright moments wisely."],
    ["旅",6,2,"小亨，旅贞吉。","山上有火，旅；君子以明慎用刑，而不留狱。","Fire on a mountain travels; be modest and careful away from home."],
    ["巽",4,4,"小亨，利有攸往，利见大人。","随风，巽；君子以申命行事。","Wind follows wind; gentle persistence carries a clear message."],
    ["兑",1,1,"亨，利贞。","丽泽，兑；君子以朋友讲习。","Lakes join; share learning and delight with friends."],

var BAZI = (function () {

  var NAYIN = [

  ];
  var STEMS = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
  var BRANCHES = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
  var STEM_ELEMENTS = ["木", "木", "火", "火", "土", "土", "金", "金", "水", "水"];
  var BRANCH_ELEMENTS = ["水", "土", "木", "木", "土", "火", "火", "土", "金", "金", "土", "水"];
  var ELEMENTS = ["木", "火", "土", "金", "水"];

  function valid(y, m, d) {
    if (typeof y !== "number" || typeof m !== "number" || typeof d !== "number" ||
        Math.floor(y) !== y || Math.floor(m) !== m || Math.floor(d) !== d ||
        y < 1900 || y > 2100 || m < 1 || m > 12 || d < 1) return false;
    var date = new Date(Date.UTC(y, m - 1, d));
    return date.getUTCFullYear() === y && date.getUTCMonth() === m - 1 && date.getUTCDate() === d;
  }
  function nayin(index) { return NAYIN[Math.floor(index / 2)]; }
  function chart(y, m, d, hour) {
    if (!valid(y, m, d)) return null;
    if (hour !== null && (typeof hour !== "number" || Math.floor(hour) !== hour || hour < 0 || hour > 23)) return null;
    var pillars = ALMANAC.pillars(y, m, d), dayDate = new Date(Date.UTC(y, m - 1, d));
    if (hour !== null && hour >= 23) dayDate.setUTCDate(dayDate.getUTCDate() + 1);
    var day = LUCK.pillar(dayDate.getUTCFullYear(), dayDate.getUTCMonth() + 1, dayDate.getUTCDate()).index;
    var result = { year: pillars.year, month: pillars.month, day: day, hour: null,
      nayin: { year: nayin(pillars.year), month: nayin(pillars.month), day: nayin(day), hour: null },
      counts: { 木: 0, 火: 0, 土: 0, 金: 0, 水: 0 },
      dayMaster: STEMS[day % 10] + STEM_ELEMENTS[day % 10], zodiac: ALMANAC.zodiac(pillars.year % 12) };
    if (hour !== null) {
      var branch = Math.floor((hour + 1) / 2) % 12;
      var firstStem = [0, 2, 4, 6, 8][day % 5];
      result.hour = cycleIndex((firstStem + branch) % 10, branch);
      result.nayin.hour = nayin(result.hour);
    }
    var indices = [result.year, result.month, result.day];
    if (result.hour !== null) indices.push(result.hour);
    for (var i = 0; i < indices.length; i++) {
      var index = indices[i];
      result.counts[STEM_ELEMENTS[index % 10]]++;
      result.counts[BRANCH_ELEMENTS[index % 12]]++;
    }
    return result;
  }
  function cycleIndex(stem, branch) {
    for (var i = 0; i < 60; i++) if (i % 10 === stem && i % 12 === branch) return i;
    return -1;
  }
  return { chart: chart, valid: valid, nayin: nayin };
})();

function update(dt) {

  if (game.pressed("a")) {
    if (panel) closePanel(); else openPanel();
    acted = true;

    if (panel) closePanel();
    else if (offset !== 0) { offset = 0; sfx("tap"); }
    acted = true;
  } else if (game.pressed("start")) {
    if (panel) closePanel();
    if (offset !== 0) { offset = 0; sfx("ok"); }
    acted = true;
  }
  if (!acted) {
    if (game.pressed("up")) { offset--; sfx("move"); }        /* yesterday */
    if (game.pressed("down")) { offset++; sfx("move"); }      /* tomorrow */
    if (!panel && !compass) {
      if (game.pressed("left")) {
        keyHeading = (keyHeading + 315) % 360; aimDial(-keyHeading); sfx("tick");
        if (lastFaced === undefined) lastFaced = LUCK.sector(keyHeading);

      if (game.pressed("right")) {
        keyHeading = (keyHeading + 45) % 360; aimDial(-keyHeading); sfx("tick");
        if (lastFaced === undefined) lastFaced = LUCK.sector(keyHeading);

  var faced = LUCK.sector(compass ? heading : keyHeading);
  if (lastFaced === undefined) {

    if (i === guaCursor) {
      var box = trigramBounds(i);
      g.rect(box.x, box.y, box.w, box.h, g.INK);
      color = g.PAPER;
    }
    drawTrigram(g, t, p.x, p.y, color);
    g.text(t.name, lx, ly - 6, { align: "center", color: color });
  }
  if (guaPanel) {
    var selected = YI.TRIGRAMS[GUA_ORDER[guaCursor]];
    g.window(22, 63, 172, 101);
    g.text(selected.name, CX, 70, { align: "center", color: g.INK });
    g.text(T({ zh: "卦象 ", en: "Image " }) +
      (game.lang === "en" ? selected.imageEn : selected.image), CX, 89,
      { align: "center", color: g.INK });
    g.text(T({ zh: "家人 ", en: "Family " }) +
      (game.lang === "en" ? selected.familyEn : selected.family), CX, 108,
      { align: "center", color: g.INK });
    g.text(T({ zh: "方位 ", en: "Direction " }) + trigramDirection(selected.direction),
      CX, 127, { align: "center", color: g.INK });
    g.text(T({ zh: "B 关闭", en: "B close" }), CX, 145, { align: "center", color: g.DARK });
  }
  g.text(fitPageText(g, T({ zh: "←→选 · A看 · B/SELECT返回", en: "←→ pick · A view · B/SELECT back" }), W),
    CX, 211, { align: "center", color: g.INK });
  g.text(fitPageText(g, HINT, W), CX, 226, { align: "center", color: g.DARK });
}

function baziHourIndex(hour) {
  for (var i = 0; i < BAZI_HOURS.length; i++) if (BAZI_HOURS[i].hour === hour) return i;
  return BAZI_HOURS.length - 1;
}
function baziHourText(hour) {
  var option = BAZI_HOURS[baziHourIndex(hour)];
  if (option.hour === null) return T({ zh: "不知道", en: "Unknown" });
  var range = option.hour === 0 ? "0-1" : option.hour === 23 ? "23-24" : option.hour + "-" + (option.hour + 2);
  return game.lang === "en" ? option.en + " " + range : option.label + " " + range;
}
function baziMasterEnglish(master) {
  var elements = ["木", "火", "土", "金", "水"], english = ["Wood", "Fire", "Earth", "Metal", "Water"];
  return master.charAt(0) + " " + english[elements.indexOf(master.charAt(1))];
}
function baziHourBranch(hour) {
  return hour === null ? null : LUCK.BRANCHES[Math.floor((hour + 1) / 2) % 12];
}
function validBaziSave(value) {
  return !!(value && value.v === 1 && BAZI.valid(value.y, value.m, value.d) &&
    (value.hour === null || (typeof value.hour === "number" && Math.floor(value.hour) === value.hour &&
      value.hour >= 0 && value.hour <= 23)));
}
function readBazi() {
  if (typeof PAD === "undefined" || typeof PAD.load !== "function") { baziState.loaded = true; return; }
  var result;
  try { result = PAD.load("bazi"); }
  catch (e) { baziState.failed = true; baziState.loaded = true; return; }
  Promise.resolve(result).then(function (value) {
    baziState.loaded = true;
    if (validBaziSave(value)) {
      baziState.saved = { v: 1, y: value.y, m: value.m, d: value.d, hour: value.hour };
      baziState.chart = BAZI.chart(value.y, value.m, value.d, value.hour);
    }
  }, function () {
    baziState.failed = true;
    baziState.loaded = true;
  });
}
function beginBaziEdit() {
  var value = baziState.saved;
  baziState.y = value ? value.y : 1990;
  baziState.m = value ? value.m : 1;
  baziState.d = value ? value.d : 1;
  baziState.hour = value ? value.hour : null;
  baziState.field = 0;
  baziState.picker = true;
}
function saveBazi() {
  var value = { v: 1, y: baziState.y, m: baziState.m, d: baziState.d, hour: baziState.hour };
  baziState.saved = value;
  baziState.chart = BAZI.chart(value.y, value.m, value.d, value.hour);
  baziState.picker = false;
  if (!baziState.failed && typeof PAD !== "undefined" && typeof PAD.save === "function") {
    try { PAD.save("bazi", value); } catch (e) {}
  }
  sfx("ok");
}
function clampBaziDay() {
  var max = new Date(Date.UTC(baziState.y, baziState.m, 0)).getUTCDate();
  baziState.d = Math.min(baziState.d, max);
}
function changeBaziValue(amount) {
  if (baziState.field === 0) {
    baziState.y = Math.max(1900, Math.min(2100, baziState.y + amount));
    clampBaziDay();
  } else if (baziState.field === 1) {
    baziState.m = Math.max(1, Math.min(12, baziState.m + amount));
    clampBaziDay();
  } else if (baziState.field === 2) {
    var max = new Date(Date.UTC(baziState.y, baziState.m, 0)).getUTCDate();
    baziState.d = Math.max(1, Math.min(max, baziState.d + amount));
  } else {
    var index = (baziHourIndex(baziState.hour) + amount + BAZI_HOURS.length) % BAZI_HOURS.length;
    baziState.hour = BAZI_HOURS[index].hour;
  }
  sfx("move");
}
var baziHeld = { dir: 0, t: 0, next: 0 };
function baziHold(dir, dt) {
  if (!dir) { baziHeld.dir = 0; return; }
  if (dir !== baziHeld.dir || game.pressed(dir < 0 ? "left" : "right")) {                  /* a fresh press: one step now */
    baziHeld.dir = dir; baziHeld.t = 0; baziHeld.next = 0.35;
    changeBaziValue(dir);
    return;
  }
  baziHeld.t += dt || 0;
  if (baziHeld.t < baziHeld.next) return;
  var fast = baziHeld.t > 1.2;
  baziHeld.next = baziHeld.t + (fast ? 0.05 : 0.09);
  changeBaziValue(dir * (fast && baziState.field === 0 ? 10 : 1));
}
function updateBazi(dt) {
  if (!baziState.loaded) return;
  if (!baziState.saved && !baziState.picker) beginBaziEdit();
  if (baziState.picker) {
    if (game.pressed("b")) {
      baziState.picker = false;
      if (!baziState.saved) backToCounter();
      else sfx("tap");
      return;
    }
    /* Up/Down pick the field, Left/Right change its value; holding a key (or a finger on an arrow) repeats,
       and after a second the year moves ten at a time, so 1990 to 2020 is a short hold, not thirty presses. */
    if (game.pressed("up")) { baziState.field = (baziState.field + 3) % 4; sfx("move"); }
    if (game.pressed("down")) { baziState.field = (baziState.field + 1) % 4; sfx("move"); }
    var p = game.pointer, dir = 0;
    /* pressed() never misses a tap shorter than a frame; btn() carries the hold */
    if (game.pressed("left") || game.btn("left")) dir = -1;
    else if (game.pressed("right") || game.btn("right")) dir = 1;
    if (p.pressed) {
      var row = Math.floor((p.y - 44) / 38);
      if (row >= 0 && row < 4 && p.y < 44 + 4 * 38) baziState.field = row;
      if (p.y >= 208 && p.y < 239 && p.x > 150) { saveBazi(); return; }
    }
    if (p.down && !dir) {
      var heldRow = Math.floor((p.y - 44) / 38);
      if (heldRow === baziState.field && heldRow >= 0 && heldRow < 4) {
        if (p.x >= 12 && p.x < 54) dir = -1;
        else if (p.x >= 162 && p.x < 204) dir = 1;
      }
    }
    baziHold(dir, dt);
    if (game.pressed("a")) saveBazi();
    return;
  }
  if (game.pressed("b")) { backToCounter(); return; }
  if (game.pressed("start")) { beginBaziEdit(); sfx("tap"); }
}
function drawBaziPicker(g) {
  g.clear(g.PAPER);
  g.rect(0, 0, W, 19, g.INK);
  g.text(T({ zh: "八字 · 填写", en: "Chart · Birth" }), CX, 2, { align: "center", color: g.PAPER });
  var names = game.lang === "en" ? ["Year", "Month", "Day", "Hour"] : ["年", "月", "日", "时辰"];
  var values = game.lang === "en" ?
    [String(baziState.y), String(baziState.m), String(baziState.d), baziHourText(baziState.hour)] :
    [baziState.y + "年", baziState.m + "月", baziState.d + "日", baziHourText(baziState.hour)];
  for (var i = 0; i < 4; i++) {
    var y = 44 + i * 38;
    if (i === baziState.field) g.rect(8, y, 200, 34, g.INK);
    var color = i === baziState.field ? g.PAPER : g.INK;
    g.text(names[i], CX, y + 1, { align: "center", color: color });
    g.text(values[i], CX, y + 18, { align: "center", color: color });
    g.frame(12, y + 1, 40, 32, i === baziState.field ? g.PAPER : g.INK);
    g.frame(164, y + 1, 40, 32, i === baziState.field ? g.PAPER : g.INK);
    g.line(36, y + 9, 28, y + 17, color);
    g.line(28, y + 17, 36, y + 25, color);
    g.line(180, y + 9, 188, y + 17, color);
    g.line(188, y + 17, 180, y + 25, color);
  }
  if (baziState.failed) {
    var message = T({ zh: "存档读不出，这次不会保存",
      en: "Could not read; it won't save this time" });
    var messageLines = g.wrap(message, 208);
    for (var line = 0; line < messageLines.length && line < 2; line++)
      g.text(messageLines[line], CX, 184 + line * 13, { align: "center", color: g.DARK });
  }
  g.text(fitPageText(g, T({ zh: "↑↓选 ←→改(按住快) A确认",
    en: "↑↓ field ←→ edit A save" }), W), CX, 214, { align: "center", color: g.INK });
  g.text(fitPageText(g, HINT, W), CX, 229, { align: "center", color: g.DARK });
}
function drawBaziChart(g) {
  var chart = baziState.chart;
  g.clear(g.PAPER);
  g.rect(0, 0, W, 19, g.INK);
  g.text(T({ zh: "八字", en: "Chart" }), CX, 2, { align: "center", color: g.PAPER });
  var dateLine = game.lang === "en" ?
    baziState.saved.y + "-" + pad2(baziState.saved.m) + "-" + pad2(baziState.saved.d) + " hour " +
      (baziState.saved.hour === null ? "unknown" : baziHourBranch(baziState.saved.hour)) :
    baziState.saved.y + "年" + baziState.saved.m + "月" + baziState.saved.d + "日 " +
      (baziState.saved.hour === null ? "时辰未知" : baziHourBranch(baziState.saved.hour) + "时");
  if (baziState.failed) dateLine += T({ zh: " · 不保存", en: " · no save" });
  g.text(fitPageText(g, dateLine, 212), CX, 22, { align: "center", color: g.INK });
  var columns = [
    { key: "hour", label: T({ zh: "时", en: "Hour" }), x: 29 },
    { key: "day", label: T({ zh: "日", en: "Day" }), x: 81 },
    { key: "month", label: T({ zh: "月", en: "Month" }), x: 135 },
    { key: "year", label: T({ zh: "年", en: "Year" }), x: 187 }
  ];
  for (var i = 0; i < columns.length; i++) {
    var col = columns[i], index = chart[col.key];
    g.text(col.label, col.x, 40, { align: "center", color: g.INK });
    g.frame(col.x - 19, 54, 38, 22, g.INK);
    g.frame(col.x - 19, 78, 38, 22, g.INK);
    g.text(index === null ? T({ zh: "未知", en: "?" }) : LUCK.STEMS[index % 10],
      col.x, 58, { align: "center", color: g.INK });
    g.text(index === null ? T({ zh: "未知", en: "?" }) : LUCK.BRANCHES[index % 12],
      col.x, 82, { align: "center", color: g.INK });
  }
  g.text(T({ zh: "纳音", en: "Na Yin" }), CX, 102, { align: "center", color: g.INK });
  for (i = 0; i < columns.length; i++) {
    var naYinColumn = columns[i], naYinIndex = chart[naYinColumn.key];
    g.text(naYinIndex === null ? T({ zh: "未知", en: "?" }) : chart.nayin[naYinColumn.key],
      naYinColumn.x, 116, { align: "center", color: g.INK });
  }
  var elements = ["木", "火", "土", "金", "水"];
  var labels = game.lang === "en" ? ["Wd", "Fi", "Ea", "Me", "Wa"] : elements;
  var centers = [18, 63, 108, 153, 198];
  g.text(T({ zh: "五行", en: "Elements" }), CX, 130, { align: "center", color: g.INK });
  for (i = 0; i < elements.length; i++) {
    var count = chart.counts[elements[i]], barHeight = Math.min(24, count * 3);
    g.text(labels[i], centers[i], 142, { align: "center", color: g.INK });
    g.frame(centers[i] - 5, 157, 10, 26, g.INK);
    if (barHeight) g.rect(centers[i] - 3, 181 - barHeight, 6, barHeight, g.DARK);
    g.text(String(count), centers[i], 183, { align: "center", color: g.INK });
  }
  var zodiac = game.lang === "en" ? ZODIAC_EN[chart.year % 12] : chart.zodiac;
  var summary = T({ zh: "属" + chart.zodiac + " · 日主 " + chart.dayMaster,
    en: zodiac + " · Day master " + baziMasterEnglish(chart.dayMaster) });
  g.text(summary, CX, 196, { align: "center", color: g.INK });
  g.text(fitPageText(g, T({ zh: "START 修改 · B 返回", en: "START edit · B back" }), W),
    CX, 211, { align: "center", color: g.INK });
  g.text(fitPageText(g, HINT, W), CX, 226, { align: "center", color: g.DARK });
}
function drawBazi(g) {
  if (!baziState.loaded) {
    g.clear(g.PAPER);
    g.rect(0, 0, W, 19, g.INK);
    g.text(T({ zh: "八字", en: "Chart" }), CX, 2, { align: "center", color: g.PAPER });
    g.text(T({ zh: "存档读取中…", en: "Reading save…" }), CX, 112, { align: "center", color: g.DARK });
    return;
  }
  if (baziState.picker || !baziState.chart) drawBaziPicker(g);
  else drawBaziChart(g);
}

game.scene("counter", {
  enter: function () { section = "counter"; syncMotion(); },
  update: updateCounter,
  draw: drawCounter
});
game.scene("fortune", {
  enter: function () { section = "fortune"; slipScroll = 0; syncMotion(); },
  update: updateFortune,
  draw: drawFortune
});
game.scene("almanac", {
  enter: function () { section = "almanac"; almanacScroll = 0; almanacGodsFocused = false; syncMotion(); },
  update: updateAlmanac,
  draw: drawAlmanac
});
game.scene("compass", {
  enter: function () { section = "compass"; syncMotion(); },
  update: function (dt) {
    if (game.pressed("b") && !panel) { backToCounter(); return; }
    update(dt);
  },
  draw: function (g) {
    var dt = shownDate(), p = pillarOf(dt);
    g.clear(g.PAPER);
    drawHeader(g, headerText(dt, p));
    drawPlate(g);
    drawDial(g, p.stem);
    drawVial(g);
    drawThreads(g);
    drawFaceMark(g);
    drawNotice(g);
    drawFaced(g, p.stem);
    g.text(keyLine(), CX, 212, { align: "center", color: g.DARK });
    g.text(HINT, CX, 226, { align: "center", color: g.DARK });
    if (panel) drawPanel(g, p.stem);
  }
});
game.scene("hexagram", {
  enter: function () { section = "hexagram"; guaScroll = 0; syncGuaDate(); syncMotion(); },
  update: updateHexagram,
  draw: function (g) { if (guaChart) drawGuaChart(g); else drawHexagram(g); }
});
game.scene("bazi", {
  enter: function () {
    section = "bazi";
    if (baziState.loaded && !baziState.saved) beginBaziEdit();
    syncMotion();
  },
  update: updateBazi,
  draw: drawBazi
});

readSlip();
readGua();
readBazi();
game.start("counter");
</script>
