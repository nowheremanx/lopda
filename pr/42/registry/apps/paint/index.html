<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>点阵画板</title>
<!-- Copyright (c) 2026 Haowei Wu. MIT License.
     Lo-PDA community app (lopda/1). The official example of the "files" permission: PAD.importFile / PAD.exportFile. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#a3ad7e;font-family:monospace;color:#1f2a14;touch-action:none;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%;box-sizing:border-box;padding:8px 10px;gap:8px}
#bar{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:bold}
#state{font-size:14px;font-weight:normal}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
/* the script sets the pixel size (a square as large as the stage allows); the fallback keeps it visible */
#cv{width:240px;height:240px;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid #1f2a14;box-shadow:4px 4px 0 #1f2a14;background:#a3ad7e;touch-action:none;display:block}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
button{font-family:monospace;font-size:14px;font-weight:bold;min-height:44px;color:#a3ad7e;background:#1f2a14;border:2px solid #1f2a14;padding:8px 12px;cursor:pointer;box-shadow:3px 3px 0 #4a5a32}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #4a5a32}
button.ghost{background:transparent;color:#1f2a14;box-shadow:none}
button.sw{width:44px;height:44px;padding:0;box-shadow:none}
button.sw[aria-checked="true"]{outline:3px solid #1f2a14;outline-offset:2px}
#sw0{background:#1f2a14}#sw1{background:#4a5a32}#sw2{background:#7d8a58}#sw3{background:#a3ad7e}
#msg{min-height:16px;font-size:14px;text-align:center}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
<div id="bar"><span id="title">点阵画板</span><span id="state">96×96 · 4 色</span></div>
<div id="stage"><canvas id="cv" width="96" height="96"></canvas></div>
<div id="msg"></div>
<div class="tools" id="t1">
<button class="sw" id="sw0" data-c="0" role="radio" aria-checked="true"></button>
<button class="sw" id="sw1" data-c="1" role="radio" aria-checked="false"></button>
<button class="sw" id="sw2" data-c="2" role="radio" aria-checked="false"></button>
<button class="sw" id="sw3" data-c="3" role="radio" aria-checked="false"></button>
<button class="ghost" id="size"></button>
<button class="ghost" id="undo"></button>
</div>
<div class="tools" id="t2">
<button class="ghost" id="imp"></button>
<button id="exp"></button>
<button class="ghost" id="clr"></button>
<span id="ask" class="hide"><button id="yes"></button> <button class="ghost" id="no"></button></span>
</div>
</div>
<script>
(function(){
"use strict";
/* two languages from PAD.lang; older runtimes have none, so Chinese is the default */
var LANG=(typeof PAD!=="undefined"&&PAD.lang==="en")?"en":"zh";
var TXT={
  zh:{title:"点阵画板",fine:"笔 · 细",bold:"笔 · 粗",undo:"撤销",imp:"导入图片",exp:"导出 PNG",clr:"清空",yes:"确认清空",no:"取消",
      noundo:"没有可以撤销的了。",imported:"已转成 96×96 四色点阵。",badimg:"这张图读不出来，换一张试试。",
      exported:"导出好了。",fail:"文件操作失败。",saving:"保存中…",saved:"96×96 · 已保存",ink:"墨",dark:"深",mid:"浅",paper:"底色（橡皮）"},
  en:{title:"Paint",fine:"Pen · fine",bold:"Pen · bold",undo:"Undo",imp:"Import",exp:"Export PNG",clr:"Clear",yes:"Clear it",no:"Cancel",
      noundo:"Nothing to undo.",imported:"Turned into 96×96, four tones.",badimg:"Can't read that image. Try another.",
      exported:"Exported.",fail:"File action failed.",saving:"Saving…",saved:"96×96 · saved",ink:"Ink",dark:"Dark",mid:"Light",paper:"Paper (eraser)"}
}[LANG];
function $(id){return document.getElementById(id);}

var W=96;
/* the four tones as RGB, index 0 = ink .. 3 = paper */
var TONES=[[31,42,20],[74,90,50],[125,138,88],[163,173,126]];
/* 4x4 Bayer matrix for ordered dithering (same as the old built-in) */
var BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
var px=new Uint8Array(W*W).fill(3), color=0, size=1, undo=[], drawing=false, last=null, saveTimer=null, touched=false;
var cv=$("cv"), ctx=cv.getContext("2d"), img=ctx.createImageData(W,W);

document.title=TXT.title; document.documentElement.lang=LANG;
$("title").textContent=TXT.title; $("undo").textContent=TXT.undo; $("imp").textContent=TXT.imp;
$("exp").textContent=TXT.exp; $("clr").textContent=TXT.clr; $("yes").textContent=TXT.yes; $("no").textContent=TXT.no;
["ink","dark","mid","paper"].forEach(function(k,i){ $("sw"+i).setAttribute("aria-label",TXT[k]); });
function sizeLabel(){ $("size").textContent=size===1?TXT.fine:TXT.bold; }
sizeLabel();
$("state").textContent="96×96 · 4 "+(LANG==="en"?"tones":"色");

var msgTimer=null;
function say(t){ $("msg").textContent=t; clearTimeout(msgTimer); msgTimer=setTimeout(function(){ $("msg").textContent=""; },2500); }

/* the largest square the stage allows, in whole CSS pixels */
function fit(){
  var s=$("stage"), side=Math.max(96,Math.floor(Math.min(s.clientWidth,s.clientHeight)-14));
  cv.style.width=cv.style.height=side+"px";
}
window.addEventListener("resize",fit); fit();

function render(){
  var d=img.data;
  for(var i=0;i<px.length;i++){ var t=TONES[px[i]]; d[i*4]=t[0]; d[i*4+1]=t[1]; d[i*4+2]=t[2]; d[i*4+3]=255; }
  ctx.putImageData(img,0,0);
}
function pushUndo(){ undo.push(px.slice()); if(undo.length>20) undo.shift(); }
function dot(x,y){
  var r=size===1?0:1;
  for(var j=-r;j<=r;j++) for(var i=-r;i<=r;i++){ var xx=x+i, yy=y+j; if(xx>=0&&yy>=0&&xx<W&&yy<W) px[yy*W+xx]=color; }
}
/* Bresenham, so a fast stroke leaves no gaps between pointer events */
function line(x0,y0,x1,y1){
  var dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1, err=dx+dy;
  for(;;){ dot(x0,y0); if(x0===x1&&y0===y1) break; var e2=2*err; if(e2>=dy){ err+=dy; x0+=sx; } if(e2<=dx){ err+=dx; y0+=sy; } }
}
function pos(ev){
  var r=cv.getBoundingClientRect();
  return [Math.floor((ev.clientX-r.left)/r.width*W), Math.floor((ev.clientY-r.top)/r.height*W)];
}
cv.addEventListener("pointerdown",function(ev){
  ev.preventDefault(); touched=true;
  try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
  pushUndo(); drawing=true; last=pos(ev); dot(last[0],last[1]); render();
});
cv.addEventListener("pointermove",function(ev){
  if(!drawing) return;
  var p=pos(ev); line(last[0],last[1],p[0],p[1]); last=p; render();
});
function end(){ if(!drawing) return; drawing=false; saveSoon(); }
cv.addEventListener("pointerup",end); cv.addEventListener("pointercancel",end);

Array.prototype.forEach.call(document.querySelectorAll(".sw"),function(b){
  b.onclick=function(){
    color=+b.getAttribute("data-c");
    Array.prototype.forEach.call(document.querySelectorAll(".sw"),function(o){ o.setAttribute("aria-checked",o===b?"true":"false"); });
  };
});
$("size").onclick=function(){ size=size===1?3:1; sizeLabel(); };
$("undo").onclick=function(){
  var prev=undo.pop();
  if(!prev){ say(TXT.noundo); return; }
  px=prev; render(); saveSoon();
};
/* clear needs two taps and no confirm(), which sandboxed apps cannot call */
function asking(on){ $("clr").classList.toggle("hide",on); $("imp").classList.toggle("hide",on); $("exp").classList.toggle("hide",on); $("ask").classList.toggle("hide",!on); }
$("clr").onclick=function(){ asking(true); };
$("no").onclick=function(){ asking(false); };
$("yes").onclick=function(){ asking(false); pushUndo(); px=new Uint8Array(W*W).fill(3); touched=true; render(); saveSoon(); };

/* ---------- persistence: the 9216 pixels as a digit string, one PAD key ---------- */
function saveSoon(){
  $("state").textContent=TXT.saving;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    PAD.save("px",Array.prototype.join.call(px,""));
    $("state").textContent=TXT.saved;
  },1000);
}
PAD.load("px").then(function(s){
  /* a stroke made before the load answered wins over the old picture */
  if(touched || typeof s!=="string" || s.length!==W*W || /[^0-3]/.test(s)) return;
  for(var i=0;i<s.length;i++) px[i]=s.charCodeAt(i)-48;
  render();
});

/* ---------- files permission ----------
   PAD.importFile / PAD.exportFile need "permissions": ["files"] in manifest.json; without it they reject.
   Every call makes the runtime ask the player on its own dialog first, so the app never touches the
   file system and cannot read or write anything silently. One file is at most 2 MB. Older runtimes
   have no such functions, so feature-detect and hide the buttons instead of failing. */
var HAS_FILES=typeof PAD.exportFile==="function" && typeof PAD.importFile==="function";
if(!HAS_FILES){ $("imp").classList.add("hide"); $("exp").classList.add("hide"); }

/* PAD.importFile({accept:["image/*"]}) -> Promise<{name, type, data} | null>
   null means the player cancelled; an image arrives as a data: URL. Then: crop to a square,
   stretch contrast, Bayer-dither to the four tones. */
function importImage(){
  PAD.importFile({accept:["image/*"]}).then(function(f){
    if(!f || typeof f.data!=="string") return;
    var im=new Image();
    im.onload=function(){ fromImage(im); };
    im.onerror=function(){ say(TXT.badimg); };
    im.src=f.data;
  }).catch(function(){ say(TXT.fail); });
}
function fromImage(im){
  var iw=im.naturalWidth, ih=im.naturalHeight, side=Math.min(iw,ih);
  if(!side){ say(TXT.badimg); return; }
  var c=document.createElement("canvas"); c.width=c.height=W;
  var x=c.getContext("2d"); x.imageSmoothingEnabled=true;
  x.drawImage(im,(iw-side)/2,(ih-side)/2,side,side,0,0,W,W);
  var d=x.getImageData(0,0,W,W).data, lum=new Float32Array(W*W), lo=1, hi=0;
  for(var i=0;i<lum.length;i++){ var v=(0.2126*d[i*4]+0.7152*d[i*4+1]+0.0722*d[i*4+2])/255; lum[i]=v; if(v<lo) lo=v; if(v>hi) hi=v; }
  var span=Math.max(0.05,hi-lo);
  pushUndo(); touched=true;
  for(var y=0;y<W;y++) for(var xx=0;xx<W;xx++){
    var k=y*W+xx, v2=(lum[k]-lo)/span, t=(BAYER[(y%4)*4+(xx%4)]+0.5)/16-0.5;
    px[k]=Math.max(0,Math.min(3,Math.round(v2*3+t)));
  }
  render(); saveSoon(); say(TXT.imported);
}
$("imp").onclick=importImage;

/* PAD.exportFile({name, type, data}) -> Promise<"saved" | "cancelled">
   data is a data: URL (binary files such as this PNG) or plain text. Say nothing on "cancelled". */
function exportPng(){
  var S=8, big=document.createElement("canvas"); big.width=big.height=W*S;
  var bx=big.getContext("2d"), bi=bx.createImageData(W*S,W*S), bd=bi.data;
  /* write the big pixels directly: drawImage of a canvas onto a canvas swaps red and blue in Safari */
  for(var y=0;y<W*S;y++) for(var x=0;x<W*S;x++){
    var t=TONES[px[((y/S)|0)*W+((x/S)|0)]], o=(y*W*S+x)*4;
    bd[o]=t[0]; bd[o+1]=t[1]; bd[o+2]=t[2]; bd[o+3]=255;
  }
  bx.putImageData(bi,0,0);
  var n=new Date(), p=function(v){ return String(v).padStart(2,"0"); };
  var name="lopda-"+n.getFullYear()+p(n.getMonth()+1)+p(n.getDate())+"-"+p(n.getHours())+p(n.getMinutes())+".png";
  PAD.exportFile({name:name,type:"image/png",data:big.toDataURL("image/png")}).then(function(r){
    if(r==="saved") say(TXT.exported);
  }).catch(function(){ say(TXT.fail); });
}
$("exp").onclick=exportPng;

render();
})();
</script>
</body>
</html>
