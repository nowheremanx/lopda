<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>五十音图</title>
<!-- Lo-PDA app (lopda/1): original kana flash cards, a daily review, a small quiz, and optional Japanese speech. MIT License. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a3ad7e; color: #1f2a14; font-family: monospace; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex: none; align-items: center; justify-content: space-between; gap: 5px; padding: 5px 7px; border-bottom: 2px solid #1f2a14; font-size: 14px; }
  header b { font-size: 15px; letter-spacing: 1px; }
  /* the right slot shows a position in the table while browsing and the question number in a quiz */
  #count, #qnum { flex: none; text-align: right; white-space: nowrap; }
  #count { width: 6ch; }
  /* a review shows "第 71/71 题" / "Q 71/71", the widest this slot must hold at 331 px */
  #qnum { display: none; width: 11ch; }
  body.quiz #count { display: none; }
  body.quiz #qnum { display: block; }
  body.home #count, body.tally #count, body.tally #qnum { display: none; }
  button { min-height: 44px; border: 2px solid #1f2a14; background: #1f2a14; color: #a3ad7e; font: inherit; font-size: 14px; font-weight: bold; }
  button.secondary { background: #a3ad7e; color: #1f2a14; }
  main { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 6px 10px; box-sizing: border-box; }
  #meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; max-width: 300px; color: #4a5a32; font-size: 13px; }
  #mode { flex: none; }
  #guide { min-width: 0; text-align: right; overflow-wrap: anywhere; }
  #card { flex: none; width: 100%; max-width: 300px; height: 146px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 3px solid #1f2a14; box-sizing: border-box; }
  #kana { font-size: 76px; line-height: 1.1; }
  #romaji { margin-top: 4px; font-size: 18px; }
  #rate { display: none; margin-top: 6px; font-size: 12px; color: #4a5a32; }
  #prompt { display: none; flex: none; text-align: center; font-size: 15px; line-height: 1.2; }
  #options { display: none; flex: none; width: 100%; max-width: 300px; grid-template-columns: 1fr 1fr; gap: 6px; }
  #options button { background: #a3ad7e; color: #1f2a14; }
  #options button.selected { background: #1f2a14; color: #a3ad7e; }
  #controls { flex: none; width: 100%; max-width: 300px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #controls button { min-width: 0; padding: 2px; }
  #status { flex: none; min-height: 1.3em; width: 100%; max-width: 300px; text-align: center; color: #4a5a32; font-size: 13px; line-height: 1.3; }
  #refwrap { display: none; position: relative; flex: 1; min-height: 0; width: 100%; max-width: 300px; margin: 0 auto; }
  #reference { display: none; width: 100%; height: 100%; box-sizing: border-box; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  #reference { grid-template-rows: repeat(16, 56px); }
  #reference button { min-width: 0; min-height: 56px; padding: 2px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; position: relative; }
  #reference button span:first-child { font-size: 25px; line-height: 1; }
  #reference button span:last-child { font-size: 12px; line-height: 1; }
  #reference button { background: #a3ad7e; color: #1f2a14; }
  /* the review's box on each cell: paper, a corner tick, mid, ink; the better known, the darker */
  #reference button.m12::after { content: ""; position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; background: #4a5a32; }
  #reference button.selected::after { background: #a3ad7e; }
  #reference button.m34 { background: #7d8a58; color: #1f2a14; }
  #reference button.m5 { background: #1f2a14; color: #a3ad7e; }
  #reference button.selected { background: #1f2a14; color: #a3ad7e; border-width: 4px; }
  /* mastered cells are ink too, so the cursor always adds a paper ring inside its border:
     the selected cell never looks like just another mastered one */
  #reference button.selected { box-shadow: inset 0 0 0 3px #a3ad7e; }
  /* the list's cut edge: four rows of ink dither on the paper, denser towards the edge */
  .cue { display: none; position: absolute; left: 0; right: 0; height: 4px; z-index: 2; pointer-events: none; background-repeat: no-repeat; background-size: 100% 1px; }
  .cue.show { display: block; }
  #cue-top { top: 0; background-image:
    repeating-linear-gradient(90deg, #1f2a14 0 3px, #a3ad7e 3px 4px),
    repeating-linear-gradient(90deg, #1f2a14 0 1px, #a3ad7e 1px 2px),
    repeating-linear-gradient(90deg, #a3ad7e 0 1px, #1f2a14 1px 2px),
    repeating-linear-gradient(90deg, #1f2a14 0 1px, #a3ad7e 1px 4px);
    background-position: 0 0, 0 1px, 0 2px, 0 3px; }
  #cue-bottom { bottom: 0; background-image:
    repeating-linear-gradient(90deg, #1f2a14 0 3px, #a3ad7e 3px 4px),
    repeating-linear-gradient(90deg, #1f2a14 0 1px, #a3ad7e 1px 2px),
    repeating-linear-gradient(90deg, #a3ad7e 0 1px, #1f2a14 1px 2px),
    repeating-linear-gradient(90deg, #1f2a14 0 1px, #a3ad7e 1px 4px);
    background-position: 0 3px, 0 2px, 0 1px, 0 0; }
  body.quiz main { justify-content: flex-start; gap: 5px; padding-top: 5px; padding-bottom: 5px; }
  body.quiz #meta, body.card #meta { flex: none; }
  body.quiz #card { height: 72px; }
  body.quiz #kana { font-size: 48px; }
  body.quiz #romaji { display: none; }
  body.quiz #prompt { display: block; }
  body.quiz #options { display: grid; }
  body.quiz #controls { display: none; }
  body.card #rate { display: block; }
  /* the guide row stays put; only the kana grid below it scrolls */
  body.list main { align-items: stretch; justify-content: flex-start; }
  body.list #meta { flex: none; margin: 0 auto; }
  body.list #refwrap { display: block; }
  body.list #reference { display: grid; align-content: start; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  body.list #card, body.list #prompt, body.list #options, body.list #controls, body.list #status { display: none; }
  body.card #reference, body.card #refwrap, body.quiz #reference, body.quiz #refwrap { display: none; }
  /* the home screen: the cover and three rows, the way a handheld opens */
  #home { display: none; flex-direction: column; align-items: stretch; gap: 6px; width: 100%; max-width: 300px; }
  body.home #home { display: flex; }
  body.home main, body.tally main { justify-content: flex-start; }
  body.home #card, body.home #prompt, body.home #options, body.home #refwrap, body.home #controls,
  body.tally #card, body.tally #prompt, body.tally #options, body.tally #refwrap, body.tally #controls { display: none; }
  /* the cover picture at one CSS pixel per picture pixel, the name on its flat dark corner */
  #cover { position: relative; flex: none; align-self: center; width: 160px; height: 160px; }
  #cover canvas { display: block; width: 160px; height: 160px; image-rendering: pixelated; }
  #appname { position: absolute; left: 10px; top: 10px; color: #a3ad7e; font-size: 16px; font-weight: bold; letter-spacing: 2px; }
  #rows { display: flex; flex-direction: column; gap: 6px; }
  /* a short screen (331 x 359) has no room for the picture above the rows: they stand beside it */
  @media (max-height: 459px) {
    #home { flex-direction: row; flex-wrap: wrap; align-items: flex-start; max-width: 311px; }
    #cover { align-self: flex-start; }
    #rows { flex: 1; min-width: 0; }
    #rows .row { padding: 0 6px; font-size: 14px; }
    #streak { width: 100%; }
  }
  #rows .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 8px; background: #a3ad7e; color: #1f2a14; font-size: 15px; text-align: left; }
  #rows .row.selected { background: #1f2a14; color: #a3ad7e; }
  /* the stamp on a finished day is drawn, not typed: a bordered box, tipped a little */
  #stamp { display: none; flex: none; border: 2px solid currentColor; padding: 0 3px; font-size: 11px; letter-spacing: 1px; transform: rotate(-6deg); }
  #streak { color: #4a5a32; font-size: 13px; text-align: center; }
  /* the tally after a review */
  #tally { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 9px; width: 100%; max-width: 300px; text-align: center; }
  body.tally #tally { display: flex; flex: 1; }
  #tally .tally-title { font-size: 18px; }
  #tally .tally-line { font-size: 15px; }
  @media (max-height: 390px) {
    main { gap: 5px; padding-top: 4px; padding-bottom: 4px; }
    #card { height: 124px; }
    #kana { font-size: 66px; }
  }
</style>

<header>

  <span id="count">1/71</span>
  <span id="qnum"></span>

<main>

  <section id="home">
    <div id="cover"><canvas id="cover-art" width="160" height="160" aria-hidden="true"></canvas><div id="appname">五十音图</div></div>
    <div id="rows">
      <button id="row-review" class="row" type="button"><span id="review-label">今天复习 8 个</span><span id="stamp">完了</span></button>

      <button id="row-quiz" class="row" type="button"><span id="quiz-label">小测</span></button>
    </div>
    <div id="streak">连续 0 天</div>
  </section>
  <section id="tally" aria-live="polite"></section>
  <section id="card" aria-live="polite">
    <div id="kana">あ</div>
    <div id="romaji">a</div>
    <div id="rate"></div>
  </section>
  <div id="prompt"></div>
  <div id="options"></div>
  <div id="refwrap">
    <div id="reference" role="list" aria-label="Kana reference"></div>
    <div id="cue-top" class="cue" aria-hidden="true"></div>
    <div id="cue-bottom" class="cue" aria-hidden="true"></div>
  </div>
  <div id="controls">
    <button id="prev" class="secondary" type="button">Prev</button>
    <button id="hear" type="button">A 听</button>
    <button id="next" class="secondary" type="button">Next</button>
  </div>
  <div id="status" aria-live="polite"></div>
</main>

<script data-src="src/srs.js">
/* 五十音图 / Kana: the daily review's rules, with no DOM, no PAD and no clock of its own.
   The caller passes today as "YYYY-MM-DD", so the app and the tests run this same copy.
   A kana sits in a Leitner box: 0 is new, and boxes 1-5 come back after 1, 2, 4, 8 or 16 days.
   ES5 on purpose: the app is inlined into an iframe with no module loader. */
var KanaSRS = (function () {
  var DAY_RE = /^\d{4}-\d{2}-\d{2}$/;
  var CAP = 8;
  var WAIT = [1, 2, 4, 8, 16];

  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  function isObj(o) { return !!o && typeof o === "object" && !Array.isArray(o); }
  function isDay(s) { return typeof s === "string" && DAY_RE.test(s); }
  function isInt(n) { return typeof n === "number" && isFinite(n) && Math.floor(n) === n; }
  function isCount(n) { return isInt(n) && n >= 0; }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function sizeOf(n) { return isInt(n) && n > 0 ? n : 0; }

  /* the phone's own calendar day, never the UTC one: at 07:00 in Tokyo the review is due today */
  function dayKey(dateObj) {
    if (!dateObj || typeof dateObj.getFullYear !== "function") return "";
    var y = dateObj.getFullYear(), m = dateObj.getMonth() + 1, d = dateObj.getDate();
    if (!isFinite(y) || !isFinite(m) || !isFinite(d)) return "";
    return y + "-" + pad2(m) + "-" + pad2(d);
  }

  /* local Y/M/D arithmetic: adding 86,400,000 ms lands on the wrong day when the clocks change */
  function addDays(day, n) {
    if (!isDay(day)) return "";
    var y = Number(day.slice(0, 4)), m = Number(day.slice(5, 7)), d = Number(day.slice(8, 10));
    return dayKey(new Date(y, m - 1, d + (isInt(n) ? n : 0)));
  }

  /* stats are per kana as [tries, right]; anything else is junk from a damaged save */
  function readStats(src, into) {
    if (!src || typeof src !== "object" || Array.isArray(src)) return into;
    for (var k in src) {
      if (!has(src, k) || !/^[0-9]+$/.test(k)) continue;
      var v = src[k];
      if (Array.isArray(v) && v.length === 2 && isCount(v[0]) && isCount(v[1]) && v[1] <= v[0]) into[k] = [v[0], v[1]];
    }
    return into;
  }

  /* before boxes existed the score was all there was: a kana answered well enough gets a head start
     and is due today, so the first review is not empty and the first cards are not all from zero */
  function seed(scores, today) {
    var out = {};
    for (var k in scores) {
      if (!has(scores, k)) continue;
      var s = scores[k], right = s[1], wrong = s[0] - s[1], lead = right - wrong;
      if (lead >= 3) out[k] = [2, today];
      else if (lead >= 1) out[k] = [1, today];
    }
    return out;
  }

  function readBoxes(src, size, today) {
    var out = {};
    if (!src || typeof src !== "object" || Array.isArray(src)) return out;
    for (var k in src) {
      if (!has(src, k) || !/^[0-9]+$/.test(k)) continue;
      var index = parseInt(k, 10), v = src[k];
      if (index >= size) continue;
      if (!Array.isArray(v) || !v.length || typeof v[0] !== "number" || !isFinite(v[0])) continue;
      var box = Math.floor(v[0]);
      out[String(index)] = [box < 0 ? 0 : box > 5 ? 5 : box, isDay(v[1]) ? v[1] : today];
    }
    return out;
  }

  function readDays(src) {
    if (!src || typeof src !== "object" || Array.isArray(src)) return { last: "", streak: 0 };
    var last = isDay(src.last) ? src.last : "";
    /* a streak without a day it stands on cannot be continued, so it resets */
    return { last: last, streak: last && isCount(src.streak) ? src.streak : 0 };
  }

  function readNewDay(src, today) {
    if (!src || typeof src !== "object" || Array.isArray(src)) return { day: today, hira: 0, kata: 0 };
    return { day: isDay(src.day) ? src.day : today,
      hira: isCount(src.hira) ? src.hira : 0,
      kata: isCount(src.kata) ? src.kata : 0 };
  }

  /* every save this app ever wrote, and every damaged one, becomes the current shape.
     v3 and newer are read as v3 (the fields this build knows); v2 and the shared-stats save
     keep their stats exactly and seed the boxes from them. */
  function migrate(saved, today, sizes) {
    var t = isDay(today) ? today : "";
    var size = { hira: sizeOf(sizes && sizes.hira), kata: sizeOf(sizes && sizes.kata) };
    var out = {
      v: 3, script: "hira", index: 0,
      stats: { hira: {}, kata: {} },
      srs: { hira: {}, kata: {} },
      days: { last: "", streak: 0 },
      newDay: { day: t, hira: 0, kata: 0 }
    };
    if (!saved || typeof saved !== "object" || Array.isArray(saved)) return out;

    out.script = saved.script === "kata" ? "kata" : "hira";
    if (isInt(saved.index) && saved.index >= 0 && saved.index < size[out.script]) out.index = saved.index;

    var v = saved.v, current = typeof v === "number" && v >= 3;
    /* a damaged version number must not decide this: the stats' own shape says whether they are
       per script (hira / kata) or the oldest save's one shared object */
    var stats = saved.stats, perScript = isObj(stats) &&
      (isObj(stats.hira) || isObj(stats.kata));
    if (perScript) {
      readStats(stats.hira, out.stats.hira);
      readStats(stats.kata, out.stats.kata);
    } else {
      /* the oldest save kept one shared stats object; it belongs to hiragana now */
      readStats(stats, out.stats.hira);
    }

    if (current) {
      out.srs.hira = readBoxes(saved.srs && saved.srs.hira, size.hira, t);
      out.srs.kata = readBoxes(saved.srs && saved.srs.kata, size.kata, t);
      out.days = readDays(saved.days);
      out.newDay = readNewDay(saved.newDay, t);
    } else {
      out.srs.hira = seed(out.stats.hira, t);
      out.srs.kata = seed(out.stats.kata, t);
    }
    return out;
  }

  /* what the day's review asks: every started kana whose day has come, oldest first, then the
     never-answered ones in table order, at most cap new ones a day counting the ones answered today */
  function dueList(srsScript, today, tableSize, newUsedToday, cap) {
    var src = srsScript && typeof srsScript === "object" ? srsScript : {};
    var size = sizeOf(tableSize), t = isDay(today) ? today : "";
    var limit = isCount(cap) ? cap : CAP;
    var due = [], fresh = [], started = [], i, e;
    for (i = 0; i < size; i++) {
      e = src[String(i)];
      if (Array.isArray(e) && isCount(e[0]) && e[0] > 0) {
        if (t && isDay(e[1]) && e[1] <= t) started.push([i, e[1]]);
      } else fresh.push(i);
    }
    started.sort(function (a, b) { return a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : a[0] - b[0]; });
    for (i = 0; i < started.length; i++) due.push(started[i][0]);
    var room = limit - (isCount(newUsedToday) ? newUsedToday : 0);
    return { due: due, fresh: room > 0 ? fresh.slice(0, room) : [] };
  }

  /* a right answer moves one box on and waits its box's days; a miss goes back to the first box */
  function applyAnswer(entry, right, today) {
    var t = isDay(today) ? today : "";
    if (!right) return [1, addDays(t, 1)];
    var box = Array.isArray(entry) && isCount(entry[0]) ? entry[0] : 0;
    box = box < 1 ? 1 : box + 1;
    if (box > 5) box = 5;
    return [box, addDays(t, WAIT[box - 1])];
  }

  /* how many new kana this script has answered today; a new day starts at zero */
  function countToday(newDay, today, script) {
    if (!newDay || typeof newDay !== "object" || newDay.day !== today) return 0;
    var n = newDay[script === "kata" ? "kata" : "hira"];
    return isCount(n) ? n : 0;
  }

  /* a new kana counts as introduced when it is answered, so a review left half done still leaves
     the rest of the day's new kana for later; a count from an older day starts over */
  function introduce(newDay, today, script) {
    var t = isDay(today) ? today : "";
    var hira = isCount(newDay && newDay.hira) ? newDay.hira : 0;
    var kata = isCount(newDay && newDay.kata) ? newDay.kata : 0;
    if (!newDay || newDay.day !== t) { hira = 0; kata = 0; }
    if (script === "kata") kata += 1; else hira += 1;
    return { day: t, hira: hira, kata: kata };
  }

  /* finishing a review today continues yesterday's streak, leaves today's alone, or starts at 1 */
  function streakAfter(days, today) {
    var t = isDay(today) ? today : "";
    var last = days && isDay(days.last) ? days.last : "";
    var streak = days && isCount(days.streak) ? days.streak : 0;
    if (!t) return { last: last, streak: streak };
    if (last === t) return { last: t, streak: streak };
    if (last && last === addDays(t, -1)) return { last: t, streak: streak + 1 };
    return { last: t, streak: 1 };
  }

  /* the streak still alive today: a run that was not kept up yesterday is over, even before the
     next review is finished (the stored number is not rewritten, only what the home claims) */
  function liveStreak(days, today) {
    var t = isDay(today) ? today : "";
    if (!t || !days || !isDay(days.last) || !isCount(days.streak)) return 0;
    if (days.last === t || days.last === addDays(t, -1)) return days.streak;
    return 0;
  }

  return { dayKey: dayKey, addDays: addDays, migrate: migrate, dueList: dueList,
    applyAnswer: applyAnswer, countToday: countToday, introduce: introduce,
    streakAfter: streakAfter, liveStreak: liveStreak };
})();

    if (e[0] >= 5) return "m5";
    if (e[0] >= 3) return "m34";
    if (e[0] >= 1) return "m12";
    return "";
  }
  function reviewList() {
    return KanaSRS.dueList(boxes(), todayKey(), table().length, KanaSRS.countToday(data.newDay, todayKey(), data.script));
  }
  function reviewCount() {
    var l = reviewList();
    return l.due.length + l.fresh.length;
  }
  /* the day can pass while the app sits open: the home's count, stamp and streak must follow it */
  function dayTick() {
    var now = todayKey();
    if (now === lastDay) return;
    lastDay = now;
    if (data.screen === "home") render();
  }
  /* the minute check only runs while the home can show a day (and after the save has settled) */
  function keepDayTimer() {
    lastDay = todayKey();
    if (settled && data.screen === "home") {
      if (!dayTimer) dayTimer = setInterval(dayTick, 60000);
    } else if (dayTimer) {
      clearInterval(dayTimer); dayTimer = null;
    }
  }
  /* keep the selected kana inside the scrolling grid, and say whether the grid goes on beyond each edge */
  function revealSelected(block) {
    var selected = referenceEl.querySelector(".selected");
    if (selected) selected.scrollIntoView({ block: block || "nearest" });
    updateCues();
  }
  function updateCues() {
    var more = referenceEl.scrollHeight - referenceEl.clientHeight;
    var top = referenceEl.scrollTop;
    cueTop.classList.toggle("show", data.screen === "list" && top > 1);
    cueBottom.classList.toggle("show", data.screen === "list" && top < more - 1);
  }
  function renderHome() {
    var n = reviewCount();
    appnameEl.textContent = TXT.title;
    reviewLabel.textContent = n > 0 ? TXT.reviewCount.replace("{n}", String(n)) : TXT.allDone;
    stampEl.style.display = n > 0 ? "none" : "inline-block";
    tableLabel.textContent = TXT.homeTable;
    quizLabel.textContent = TXT.homeQuiz;
    /* a run not kept up yesterday is over: the home says 0 until a review finishes today */
    streakEl.textContent = TXT.streak.replace("{n}", String(KanaSRS.liveStreak(data.days, todayKey())));
    homeRows.forEach(function (row, i) {
      row.classList.toggle("selected", i === data.homeRow);
      row.setAttribute("aria-selected", i === data.homeRow ? "true" : "false");
    });
  }
  function renderTally() {
    var lines = [
      [TXT.tallyTitle, "tally-title"],
      [TXT.tallyScore.replace("{right}", String(data.res.right)).replace("{wrong}", String(data.res.wrong)), "tally-line"],
      [TXT.tallyUp.replace("{n}", String(data.res.up)), "tally-line"],
      [TXT.tallyTomorrow.replace("{n}", String(data.tomorrow)), "tally-line"]
    ];
    tallyEl.textContent = "";
    lines.forEach(function (line) {
      var div = document.createElement("div");
      div.className = line[1];
      div.textContent = line[0];
      tallyEl.appendChild(div);
    });
  }
  function render() {
    var list = table(), currentIndex = data.screen === "quiz" ? data.target : data.index;
    document.body.classList.toggle("quiz", data.screen === "quiz");
    document.body.classList.toggle("card", data.screen === "card");
    document.body.classList.toggle("list", data.screen === "list");
    document.body.classList.toggle("home", data.screen === "home");
    document.body.classList.toggle("tally", data.screen === "tally");
    scriptBtn.textContent = data.script === "hira" ? TXT.hira : TXT.kata;
    titleEl.textContent = TXT.title;
    countEl.textContent = (data.screen === "quiz" ? data.target + 1 : data.index + 1) + "/" + list.length;
    qnumEl.textContent = data.screen === "quiz" && data.review
      ? TXT.qnumOf.replace("{n}", String(data.qpos + 1)).replace("{total}", String(data.queue.length))
      : TXT.qnum.replace("{n}", String(data.question || 1));
    /* a review is a review, not the free quiz: the label next to the guide says which */
    modeEl.textContent = data.screen === "quiz" && data.review ? TXT.tally : TXT[data.screen];
    guideEl.textContent = data.screen === "home" ? TXT.homeGuide
      : data.screen === "tally" ? TXT.tallyGuide
      : data.screen === "list" ? TXT.listGuide
      : data.screen === "card" ? TXT.cardGuide : TXT.quizGuide;
    kanaEl.textContent = list[currentIndex];
    romaEl.textContent = ROMA[currentIndex];
    rateEl.textContent = rateText(currentIndex);
    viewBtn.textContent = data.screen === "list" ? TXT.startQuiz : data.screen === "card" ? TXT.backList : TXT.backHome;
    viewBtn.style.display = data.screen === "home" || data.screen === "tally" ? "none" : "inline-block";
    document.getElementById("prev").textContent = TXT.prev;
    document.getElementById("next").textContent = TXT.next;
    document.getElementById("hear").textContent = TXT.hear;
    promptEl.textContent = TXT.question;
    optionsEl.textContent = "";
    referenceEl.textContent = "";
    if (data.screen === "home") renderHome();
    if (data.screen === "tally") renderTally();
    if (data.screen === "list") {
      GRID_ROWS.forEach(function (row, r) {
        row.forEach(function (index, c) {
          var b = document.createElement("button"), kana = document.createElement("span"), roma = document.createElement("span");
          b.type = "button"; b.setAttribute("role", "listitem"); b.setAttribute("aria-label", list[index] + " " + ROMA[index]);
          b.style.gridRow = String(r + 1); b.style.gridColumn = String(GRID_COLS[r][c] + 1);
          b.className = (boxClass(index) + (index === data.index ? " selected" : "")).trim();
          b.setAttribute("aria-selected", index === data.index ? "true" : "false");
          kana.textContent = list[index]; roma.textContent = ROMA[index];
          b.appendChild(kana); b.appendChild(roma);
          b.addEventListener("click", function () { if (!settled) return; data.index = index; openCard(); });
          referenceEl.appendChild(b);
        });
      });
      revealSelected();
    }
    if (data.screen === "quiz") {
      data.choices.forEach(function (index, i) {
        var b = document.createElement("button");
        b.type = "button"; b.textContent = ROMA[index];
        b.setAttribute("data-index", String(index));
        b.className = data.reveal === index || (data.reveal < 0 && i === data.choice) ? "selected" : "";
        b.addEventListener("click", function () { if (!settled) return; data.choice = i; answer(); });
        optionsEl.appendChild(b);
      });
    }
    updateCues();
    keepDayTimer();
  }
  function switchScript() {
    data.script = data.script === "hira" ? "kata" : "hira";
    /* the free quiz kept its table cursor where the question was, as it always did; a review's
       queue holds the other script's indices, and a tally's numbers belong to the script it was
       done in, so both leave for home */
    if (data.screen === "quiz") {
      if (data.review) {
        data.review = false; data.queue = []; data.qpos = 0; data.screen = "home";
      } else {
        data.index = data.target; data.screen = "list";
      }
    } else if (data.screen === "tally") {
      data.review = false; data.queue = []; data.qpos = 0; data.screen = "home";
    }
    data.locked = false; data.awaitConfirm = false; data.reveal = -1;
    statusEl.textContent = "";
    data.seen = {}; data.recent = [];
    save(); render();
    revealSelected();
  }
  function backToList() {
    data.screen = "list";
    data.locked = false;
    statusEl.textContent = "";
    save();
    render();
    revealSelected();
  }
  function goHome() {
    /* a free quiz leaves the table cursor on the kana it was asking about, as it always did */
    if (data.screen === "quiz" && !data.review) data.index = data.target;
    data.screen = "home";
    data.review = false; data.queue = []; data.qpos = 0;
    data.locked = false; data.awaitConfirm = false; data.reveal = -1;
    statusEl.textContent = "";
    save();
    render();
  }
  function openTable() {
    data.screen = "list";
    statusEl.textContent = "";
    save();
    render();
  }
  function openCard() {
    data.screen = "card"; statusEl.textContent = ""; save(); render();
  }
  function openHomeRow() {
    if (data.homeRow === 0) startReview();
    else if (data.homeRow === 1) openTable();
    else startQuiz();
  }
  function moveHome(dir) {
    data.homeRow = (data.homeRow + (dir === "up" ? -1 : 1) + 3) % 3;
    render();
  }
  function chooseReference(dir) {
    var row = 0, col = 0, r, c;
    for (r = 0; r < GRID_ROWS.length; r++) {
      c = GRID_ROWS[r].indexOf(data.index);
      if (c >= 0) { row = r; col = GRID_COLS[r][c]; break; }
    }
    if (dir === "left" || dir === "right") {
      var pos = GRID_ROWS[row].indexOf(data.index), step = dir === "left" ? -1 : 1;
      data.index = GRID_ROWS[row][(pos + step + GRID_ROWS[row].length) % GRID_ROWS[row].length];
    } else {
      var nextRow = (row + (dir === "up" ? -1 : 1) + GRID_ROWS.length) % GRID_ROWS.length;
      var best = 0, distance = 99;
      GRID_COLS[nextRow].forEach(function (candidateCol, i) {
        var d = Math.abs(candidateCol - col);
        if (d < distance) { distance = d; best = i; }
      });
      data.index = GRID_ROWS[nextRow][best];
    }
    save();
    render();
    revealSelected();
  }
  function move(dir) {
    if (data.screen === "quiz") {
      if (!data.locked) {
        if (dir === "up" || dir === "down") data.choice = (data.choice + (dir === "up" ? -2 : 2) + data.choices.length) % data.choices.length;
        else {
          var rowStart = Math.floor(data.choice / 2) * 2;
          data.choice = rowStart + (data.choice % 2 + (dir === "left" ? 1 : 1)) % 2;
        }
        render();
      }
      return;
    }
    if (data.screen !== "card") return;
    var count = table().length;
    data.index = (data.index + (dir === "left" || dir === "up" ? -1 : 1) + count) % count;
    statusEl.textContent = ""; save(); render();
  }
  function newQuestion() {
    data.question = (data.question || 0) + 1;
    /* three distractors whose romaji differ from the answer and from each other, so a kana is never
       tested against an identical-looking choice (じ and ぢ both read ji, ず and づ both read zu) */
    var seen = {}, pool = [], i, n, count = table().length;
    for (i = 0; i < count; i++) {
      if (i === data.target || ROMA[i] === ROMA[data.target] || seen[ROMA[i]]) continue;
      seen[ROMA[i]] = true; pool.push(i);
    }
    var choices = [data.target];
    while (choices.length < 4 && pool.length) {
      n = Math.floor(Math.random() * pool.length);
      choices.push(pool.splice(n, 1)[0]);
    }
    for (i = choices.length - 1; i > 0; i--) {
      n = Math.floor(Math.random() * (i + 1));
      var tmp = choices[i]; choices[i] = choices[n]; choices[n] = tmp;
    }
    data.choices = choices; data.choice = 0; data.locked = false; data.awaitConfirm = false; data.reveal = -1;
  }
  function rememberTarget(index) {
    data.recent.push(index);
    while (data.recent.length > 3) data.recent.shift();
    data.seen[index] = (data.seen[index] || 0) + 1;
  }
  /* pick the next kana: never-seen and low-accuracy kana weigh more, and the last few tested are
     skipped so the same kana is not asked over and over. A kana appears at most twice per quiz
     round, so a weak kana is repeated but never becomes tiresome. */
  function pickTarget() {
    var count = table().length, pool = [], total = 0, i, s, w, r;
    for (i = 0; i < count; i++) if ((data.seen[i] || 0) < 2 && data.recent.indexOf(i) < 0) pool.push(i);
    /* if only the last few kana are left, ask one of them rather than ending the round early */
    if (!pool.length) for (i = 0; i < count; i++) if ((data.seen[i] || 0) < 2) pool.push(i);
    if (!pool.length) return -1;
    for (i = 0; i < pool.length; i++) {
      s = stats()[pool[i]];
      w = (!s || !s[0]) ? 1 : Math.max(0.15, 1 - s[1] / s[0]);
      pool[i] = [pool[i], w]; total += w;
    }
    r = Math.random() * total;
    for (i = 0; i < pool.length; i++) { r -= pool[i][1]; if (r < 0) return pool[i][0]; }
    return pool[pool.length - 1][0];
  }
  /* the day's review: every due kana once, oldest first, then the new ones the day still allows */
  function startReview() {
    var list = reviewList(), queue = list.due.concat(list.fresh);
    if (!queue.length) return;
    data.review = true; data.queue = queue; data.qpos = 0;
    data.res = { right: 0, wrong: 0, up: 0 };
    data.screen = "quiz"; data.target = queue[0];
    data.recent = []; data.seen = {}; data.question = 0;
    newQuestion(); statusEl.textContent = "";
    save(); render();
  }
  function reviewAnswer(ok) {
    var key = String(data.target), entry = boxes()[key] || null;
    var was = Array.isArray(entry) ? entry[0] : 0;
    /* a kana is introduced when it is answered, not when it is offered: a review left half done
       leaves the rest of the day's new kana for the next session */
    if (!(was >= 1)) data.newDay = KanaSRS.introduce(data.newDay, todayKey(), data.script);
    var next = KanaSRS.applyAnswer(entry, ok, todayKey());
    boxes()[key] = next;
    if (ok) { data.res.right++; if (next[0] > was) data.res.up++; }
    else data.res.wrong++;
  }
  function nextReview() {
    data.qpos++;
    if (data.qpos >= data.queue.length) { finishReview(); return; }
    data.target = data.queue[data.qpos];
    newQuestion(); statusEl.textContent = "";
    render();
  }
  function finishReview() {
    data.days = KanaSRS.streakAfter(data.days, todayKey());
    var list = KanaSRS.dueList(boxes(), KanaSRS.addDays(todayKey(), 1), table().length, 0);
    data.tomorrow = list.due.length + list.fresh.length;
    data.locked = false; data.awaitConfirm = false; data.reveal = -1;
    data.screen = "tally";
    statusEl.textContent = "";
    save();
    if (typeof PAD !== "undefined" && PAD.sfx) PAD.sfx("win");
    render();
  }
  function startQuiz() {
    if (data.screen !== "list" && data.screen !== "home") return;
    data.review = false; data.queue = []; data.qpos = 0;
    data.screen = "quiz"; data.target = data.index;
    data.recent = []; data.seen = {}; data.question = 0; rememberTarget(data.target);
    newQuestion(); statusEl.textContent = "";
    render();
  }
  function advance() {
    if (data.review) { nextReview(); return; }
    var next = pickTarget();
    if (next < 0) { data.locked = true; data.awaitConfirm = false; statusEl.textContent = TXT.done; return; }
    data.target = next;
    rememberTarget(data.target);
    newQuestion(); statusEl.textContent = ""; render();
  }
  function answer() {
    if (data.screen !== "quiz") return;
    if (data.locked) {
      /* after a miss, wait for the user to acknowledge the answer before moving on */
      if (data.awaitConfirm) { data.awaitConfirm = false; advance(); }
      return;
    }
    data.locked = true;
    var ok = data.choices[data.choice] === data.target;
    var stat = stats()[data.target] || (stats()[data.target] = [0, 0]);
    stat[0]++; if (ok) stat[1]++;
    /* the free quiz leaves the review alone: only a session's answers move a box and the streak */
    if (data.review) reviewAnswer(ok);
    if (ok) {
      statusEl.textContent = TXT.mastered;
      if (typeof PAD !== "undefined" && PAD.sfx) PAD.sfx("ok");
      save();
      setTimeout(function () {
        if (data.screen !== "quiz" || !data.locked || data.awaitConfirm) return;
        advance();
      }, 850);
    } else {
      data.awaitConfirm = true;
      data.reveal = data.target;
      if (typeof PAD !== "undefined" && PAD.sfx) PAD.sfx("miss");
      save();
      render();
      statusEl.textContent = TXT.missed + ROMA[data.target] + TXT.cont;
    }
  }
  function hear() {
    if (data.screen !== "card") return;
    if (typeof PAD === "undefined" || !PAD.say) { statusEl.textContent = TXT.legacy; return; }
    if (!PAD.say.languages || PAD.say.languages.indexOf("ja") < 0) { statusEl.textContent = TXT.legacy; return; }
    PAD.say(current(), { lang: "ja" }).then(function (result) {
      if (result === "unavailable") statusEl.textContent = TXT.noVoice;
      else statusEl.textContent = "";
    });
  }
  function handle(button) {
    /* before PAD.load has settled the state is blank: a press must not start a review or a quiz */
    if (!settled) return;
    if (data.screen === "home") {
      if (button === "up" || button === "down") moveHome(button);
      else if (button === "a") openHomeRow();
      else if (button === "select") switchScript();
      return;
    }
    if (data.screen === "tally") {
      if (button === "a" || button === "b") goHome();
      return;
    }
    if (data.screen === "list") {
      if (button === "left" || button === "right" || button === "up" || button === "down") chooseReference(button);
      else if (button === "a") openCard();
      else if (button === "start") startQuiz();
      else if (button === "select") switchScript();
      else if (button === "b") goHome();
      return;
    }
    if (button === "b") {
      /* the card keeps its place in the table; the quiz has no table to go back to any more */
      if (data.screen === "card") backToList(); else goHome();
      return;
    }
    if (button === "left") move("left");
    else if (button === "right") move("right");
    else if (button === "up" && data.screen === "quiz") move("up");
    else if (button === "down" && data.screen === "quiz") move("down");
    else if (button === "a") { if (data.screen === "quiz") answer(); else hear(); }
    else if (button === "select") switchScript();
  }
  /* taps and the keys do the same things, and both wait for the save to have settled */
  function tap(el, fn) {
    el.addEventListener("click", function (e) { if (settled) fn(e); });
  }
  tap(document.getElementById("prev"), function () { move("left"); });
  tap(document.getElementById("next"), function () { move("right"); });
  tap(document.getElementById("hear"), function () { if (data.screen === "quiz") answer(); else hear(); });
  referenceEl.addEventListener("scroll", updateCues);
  tap(scriptBtn, switchScript);
  tap(viewBtn, function () {
    if (data.screen === "list") startQuiz();
    else if (data.screen === "quiz") goHome();
    else backToList();
  });
  homeRows.forEach(function (row, i) {
    tap(row, function () { data.homeRow = i; openHomeRow(); });
  });
  var keyHandler = function (e) {
    if (e.key.indexOf("Arrow") === 0) { e.preventDefault(); handle(e.key.slice(5).toLowerCase()); }
    else if (e.key === "x" || e.key === "X") { e.preventDefault(); handle("a"); }
    else if (e.key === "z" || e.key === "Z") { e.preventDefault(); handle("b"); }
    else if (e.key === "Enter") {
      e.preventDefault();
      handle(data.screen === "list" || data.screen === "card" ? "start" : "a");
    }
    else if (e.key === "Shift") { e.preventDefault(); handle("select"); }
  };
  if (typeof PAD !== "undefined" && PAD.on) PAD.on("press", handle);
  else document.addEventListener("keydown", keyHandler, false);
  document.documentElement.lang = LANG === "en" ? "en" : "zh-CN";
  stampEl.textContent = TXT.stamp;
  /* coming back to the app after a while at midnight has to show the new day at once */
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible" || !settled || data.screen !== "home") return;
    lastDay = todayKey();
    render();
  });
  KANA_COVER.draw(coverEl);
  render();
  if (typeof PAD !== "undefined" && PAD.load) {
    PAD.load(KEY).then(function (saved) {
      /* a save from a newer build is read as far as this one understands it, and never written over */
      if (saved && typeof saved.v === "number" && saved.v > 3) saveBlocked = true;
      var state = KanaSRS.migrate(saved, todayKey(), { hira: HIRA.length, kata: KATA.length });
      data.script = state.script; data.index = state.index;
      data.stats = state.stats; data.srs = state.srs;
      data.days = state.days; data.newDay = state.newDay;
      loaded = true; settled = true;
      render();
    }, function () {
      /* never save over a save that could not be read; loaded stays false */
      settled = true;
      render();
      statusEl.textContent = TXT.unreadable;
    });
  } else { loaded = true; settled = true; render(); }
})();
</script>
</body>
</html>
