GM.drawMole = function (buf, it, anim) {
  var d = it.dir, S = GM.SCALE;
  var x = Math.round(it.x * S), y = Math.round(it.y * S);
  var step = Math.sin(anim * 14 + it.x) > 0 ? 2 : 0;
  GM.bellipse(buf, x, y, 16, 10, GM.INK);
  GM.bellipse(buf, x, y, 14, 8, GM.MID);
  GM.bellipse(buf, x, y + 5, 10, 4, GM.DARK);
  GM.bellipse(buf, x + d * 10, y - 4, 8, 8, GM.INK);
  GM.bellipse(buf, x + d * 10, y - 4, 6, 6, GM.MID);
  GM.bellipse(buf, x + d * 4, y - 12, 4, 4, GM.INK);
  GM.bellipse(buf, x + d * 4, y - 12, 2, 2, GM.DARK);
  GM.brect(buf, x + d * 16, y - 4, 4, 4, GM.PAPER);
  GM.bput(buf, x + d * 18, y - 2, GM.INK);
  GM.brect(buf, x + d * 12, y - 6, 2, 2, GM.INK);
  GM.blineWide(buf, x - 6, y + 8, x - 8, y + 12 + step, GM.INK, 2);
  GM.blineWide(buf, x + 6, y + 8, x + 8, y + 12 + (2 - step), GM.INK, 2);
  GM.blineWide(buf, x - d * 14, y, x - d * 20, y - 4, GM.INK, 2);
  /* only the rare mole carries a diamond; a plain mole carries nothing */
  if (it.carry === "diamond") {
    var mini = GM.SPR.miniGem;
    var mx = x + d * 12 - (d < 0 ? mini.w : 0);
    var my = y - 20;
    GM.spriteDraw(buf, mini, mx, my);
    if (Math.sin(anim * 5 + it.x) > 0.55) {
      GM.brect(buf, mx + mini.w + 2, my, 3, 1, GM.PAPER);
      GM.brect(buf, mx + mini.w + 3, my - 1, 1, 3, GM.PAPER);
    }
  } else {
    /* a little dirt on its back, so the two moles read differently at a glance */
    GM.bellipse(buf, x - d * 2, y - 12, 5, 3, GM.DARK);
    GM.brect(buf, x - d * 2 - 2, y - 13, 2, 2, GM.MID);
  }
};

GM.drawRope = function (buf, hook, anchor) {
  anchor = anchor || GM.ANCHOR;
  var tip = GM.tip(hook, anchor);
  var a = hook.angle, dx = Math.sin(a), dy = Math.cos(a);
  GM.line(buf, anchor.x, anchor.y, tip.x - dx, tip.y - dy, GM.INK);
  for (var d = 7; d < hook.len - 3; d += 9) {
    GM.put(buf, anchor.x + dx * d, anchor.y + dy * d, GM.PAPER);
  }
};

GM.drawHook = function (buf, hook, anchor) {
  var tip = GM.tip(hook, anchor);
  var a = hook.angle, dx = Math.sin(a), dy = Math.cos(a);
  var px = Math.cos(a), py = -Math.sin(a);
  GM.line(buf, tip.x - dx * 3, tip.y - dy * 3, tip.x, tip.y, GM.INK);
  var closed = !!hook.item;
  for (var side = -1; side <= 1; side += 2) {
    var x1 = tip.x + dx * 1.5 + px * side * 1.8;
    var y1 = tip.y + dy * 1.5 + py * side * 1.8;
    var x2 = tip.x + dx * 4 + px * side * (closed ? 1.1 : 3.7);
    var y2 = tip.y + dy * 4 + py * side * (closed ? 1.1 : 3.7);
    GM.line(buf, tip.x, tip.y, x1, y1, GM.INK);
    GM.line(buf, x1, y1, x2, y2, GM.INK);
    GM.put(buf, x2, y2, GM.PAPER);
  }
  GM.rect(buf, tip.x - 1, tip.y - 1, 2, 2, GM.INK);
};

GM.sweatDrop = function (buf, bx, by) {
  GM.brect(buf, bx, by, 3, 4, GM.INK);
  GM.brect(buf, bx + 1, by, 1, 2, GM.PAPER);
  GM.bput(buf, bx + 1, by + 2, GM.MID);
};

GM.drawMiner = function (buf, state) {
  var hook = state.hook;
  var back = hook.state === "back";
  var out = hook.state === "out";
  var hauling = back && !!hook.item;
  var throwT = state.throwT || 0;
  var rate = hauling ? (hook.item.weight > 2.4 ? 5.2 : 7.4) : 6.6;
  var tug = back ? Math.sin(state.anim * rate) : 0;
  var heave = back && Math.abs(tug) > 0.55 ? -1 : 0;
  var heavy = hauling && hook.item.weight >= 4;
  var bob = hook.state === "swing" && Math.sin(state.anim * 4) > 0.35 ? -1 : 0;
  var lean = out ? 2 : back ? -1 : 0;
  if (throwT > 0) lean -= 1;
  var bx = 80 + lean;
  var by = bob + heave;
  var ground = 22;

  /* braced boots and legs; the body leans into the pull */
  GM.rect(buf, bx - 8, ground - 1, 5, 2, GM.INK);
  GM.rect(buf, bx + 3, ground - 1, 5, 2, GM.INK);
  GM.rect(buf, bx - 6, ground - 4, 3, 3, GM.DARK);
  GM.rect(buf, bx + 3, ground - 4, 3, 3, GM.DARK);

  /* body, shirt and overalls */
  GM.rect(buf, bx - 7, 12 + by, 14, 7, GM.INK);
  GM.rect(buf, bx - 6, 13 + by, 12, 5, GM.MID);
  GM.rect(buf, bx - 5, 14 + by, 10, 4, GM.DARK);
  GM.rect(buf, bx - 4, 13 + by, 1, 5, GM.PAPER);
  GM.rect(buf, bx + 3, 13 + by, 1, 5, GM.PAPER);

  /* head, eyes and a big moustache */
  GM.rect(buf, bx - 5, 6 + by, 10, 7, GM.INK);
  GM.rect(buf, bx - 4, 7 + by, 8, 5, GM.PAPER);
  GM.put(buf, bx - 2, 9 + by, GM.INK);
  GM.put(buf, bx + 2, 9 + by, GM.INK);
  GM.rect(buf, bx - 3, 11 + by, 6, 1, GM.DARK);
  GM.put(buf, bx - 4, 11 + by, GM.DARK);
  GM.put(buf, bx + 4, 11 + by, GM.DARK);

  /* a low safety cap: crown and broad brim. He faces us, so no side peak: drawn one row under the brim it read
     as a stray dot beside the cap on a phone (owner, 2026-11-25). */
  GM.ellipse(buf, bx, 4 + by, 8, 3, GM.INK);
  GM.ellipse(buf, bx, 4 + by, 7, 2, GM.PAPER);
  GM.rect(buf, bx - 9, 6 + by, 18, 2, GM.INK);
  GM.rect(buf, bx - 8, 6 + by, 16, 1, GM.PAPER);
  GM.rect(buf, bx - 1, 2 + by, 3, 2, GM.MID);
  GM.put(buf, bx, 2 + by, GM.PAPER);

  /* the winch under his hands */
  GM.rect(buf, 78, 16, 2, 2, GM.PAPER);
  GM.rect(buf, 81, 16, 2, 2, GM.PAPER);
  GM.rect(buf, 79, 17, 2, 2, GM.DARK);
  GM.put(buf, 80, 18, GM.PAPER);

  /* hands: out means both push forward, back means they pull hand over hand,
     and a thrown bomb sends the right arm over the shoulder then down again */
  var lhx = 79, lhy = 18 + by, rhx = 81, rhy = 18 + by;
  var lex = bx - 10, ley = 15 + by, rex = bx + 10, rey = 15 + by;
  var kick = 0;
  if (out) {
    lhx = 78; lhy = 16 + by; rhx = 82; rhy = 16 + by;
    lex = bx - 9; ley = 14 + by; rex = bx + 9; rey = 14 + by;
  } else if (back) {
    var upL = Math.max(0, tug), upR = Math.max(0, -tug);
    lhy = 18 + by - Math.round(upL * 3);
    rhy = 18 + by - Math.round(upR * 3);
    ley = 15 + by - Math.round(upL * 2);
    rey = 15 + by - Math.round(upR * 2);
  } else {
    lhx = 79 + Math.round(Math.sin(state.anim * 3) * 0.5);
    rhx = 81 + Math.round(Math.sin(state.anim * 3 + 1) * 0.5);
  }
  if (throwT > 0) {
    kick = 1 - throwT / GM.THROW_TIME;
    rex = bx + 11;
    rey = 11 + by;
    if (state.bomb && kick < 0.2) {
      var bp = GM.bombPos(state.bomb);
      var kk = Math.min(1, kick / 0.2);
      rhx = Math.round((bx + 6) + (bp.x - (bx + 6)) * kk);
      rhy = Math.round((9 + by) + (bp.y - (9 + by)) * kk);
    } else {
      rhx = bx + 12;
      rhy = 8 + by;
    }
  }
  function arm(sx, sy, ex, ey, hx, hy) {
    GM.line(buf, sx, sy, ex, ey, GM.INK);
    GM.line(buf, ex, ey, hx, hy, GM.INK);
    GM.rect(buf, hx - 1, hy - 1, 2, 2, GM.INK);
    GM.rect(buf, hx, hy, 1, 1, GM.PAPER);
  }
  arm(bx - 6, 13 + by, lex, ley, lhx, lhy);
  arm(bx + 6, 13 + by, rex, rey, rhx, rhy);

  /* a little dust at the boots while he hauls */
  if (back && hauling && Math.sin(state.anim * 11) > 0.25) {
    GM.put(buf, bx - 9, ground, GM.MID);
    GM.put(buf, bx + 9, ground + 0.5, GM.MID);
  }
  if (throwT > 0 && kick > 0.12 && kick < 0.55) {
    GM.line(buf, rhx + 3, rhy + 2, rhx + 6, rhy, GM.MID);
    GM.line(buf, rhx + 3, rhy + 4, rhx + 7, rhy + 3, GM.PAPER);
  }

  /* only the really heavy pieces make him sweat; a gold nugget does not */
  if (heavy) {
    var t = state.anim, side, sx, sy, p;
    for (var i = 0; i < 3; i++) {
      side = i === 0 ? -1 : 1;
      p = (t * 0.78 + i * 0.31) % 1;
      sx = bx + (i === 2 ? -4 : side * 9) + Math.sin(t * 5 + i) * 0.5;
      sy = (i === 2 ? 8 : 5) + by + p * p * 10;
      GM.sweatDrop(buf, Math.round(sx * GM.SCALE), Math.round(sy * GM.SCALE));
    }
  }
};

GM.drawArm = function (buf, sx, sy, ex, ey, hx, hy) {

GM.tauntBubble = function (buf, cx, cy, text, tailX, tailY) {
  var k = GM.SCALE, w = GM.textWidth(text, k) + 10, h = 5 * k + 8;
  var x = Math.round(cx - w / 2), y = Math.round(cy - h);
  GM.brect(buf, x, y, w, h, GM.INK);
  GM.brect(buf, x + 2, y + 2, w - 4, h - 4, GM.DARK);
  GM.textMain(buf, text, x + 5, y + 4, GM.PAPER, k);
  GM.bline(buf, x + 7, y + h - 1, tailX, tailY, GM.INK);
  GM.bline(buf, x + 8, y + h - 1, tailX + 1, tailY, GM.PAPER);
  GM.bline(buf, x + 5, y + h - 1, tailX - 1, tailY, GM.INK);
};

/* Old Wang: flat cap, stubby beard, and a chest badge. He mines at x=124. */
GM.drawWang = function (buf, state) {
  var r = state.rival;
  if (!r) return;

/* ---------- the sky: the scoreboard ---------- */
GM.skyKey = function (state, T) {
  var sec = Math.ceil(state.time);
  return [GM.L.sky, state.level, state.bank, state.target, sec, state.screen === "play" && sec <= 10, state.dynamite, T.level].join("|");
};

/* the slim scoreboard: one line, level and cash on the left with a short gauge, dynamite and seconds on the right */
GM.paintSkySlim = function (bd, state, T) {
  var W = bd.w, H = bd.h, y = Math.max(0, Math.round((H - 13) / 2)), x;
  var met = state.bank >= state.target;
  GM.bandRect(bd, 0, 0, W, H, GM.PAPER);
  x = GM.hudText(bd, GM.fmt(T.level, { n: state.level }), 6, y, GM.DARK, 1) + 6;
  x = GM.hudText(bd, "$" + GM.money(state.bank), x, y, GM.INK, 1);
  if (met) {
    GM.bandRect(bd, x + 3, y - 1, GM.hudWidth(T.hudMet) + 6, 14, GM.INK);
    x = GM.hudText(bd, T.hudMet, x + 6, y, GM.PAPER, 1) + 3;
  } else {
    x = GM.hudText(bd, "/" + GM.money(state.target), x, y, GM.DARK, 1);
  }
  var gw = 34, gx = x + 6, fill = met ? 1 : GM.levelShare(state, state.bank - (state.levelBank || 0));
  GM.bandRect(bd, gx, y + 4, gw, 6, GM.INK);
  GM.bandRect(bd, gx + 1, y + 5, gw - 2, 4, GM.MID);
  GM.bandRect(bd, gx + 1, y + 5, Math.round((gw - 2) * fill), 4, GM.INK);
  var sec = Math.max(0, Math.ceil(state.time)), st = sec + T.hudSec, sw = GM.hudWidth(st);
  var low = state.screen === "play" && sec <= 10;
  if (low) GM.bandRect(bd, W - 6 - sw - 3, y - 1, sw + 6, 14, GM.INK);
  GM.hudText(bd, st, W - 6 - sw, y, low ? GM.PAPER : GM.INK, 1);
  var dn = "×" + Math.max(0, state.dynamite || 0), dw = GM.hudWidth(dn), dx = W - 6 - sw - 12 - dw;
  GM.hudText(bd, dn, dx, y, state.dynamite > 0 ? GM.INK : GM.MID, 1);
  GM.bandSprite(bd, GM.SPR.dynIcon, dx - 15, y - 2, state.dynamite > 0 ? null : GM.MID);
};

GM.paintSky = function (bd, state, T) {
  var W = bd.w, H = bd.h, i;
  if (GM.L.slim) { GM.paintSkySlim(bd, state, T); return; }
  GM.bandRect(bd, 0, 0, W, H, GM.PAPER);
  /* a few clouds where the sky is tall enough, between the two halves of the scoreboard, never under its words */
  if (H >= 72) {
    var clouds = [[156, H - 30, 30], [206, H - 46, 22], [126, H - 58, 18]];
    for (i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      if (c[1] < 6) continue;
      GM.bandRect(bd, c[0], c[1], c[2], 3, GM.MID);
      GM.bandRect(bd, c[0] + 4, c[1] - 3, c[2] - 10, 3, GM.MID);
      GM.bandRect(bd, c[0] + 9, c[1] - 5, Math.max(4, c[2] - 20), 2, GM.MID);
    }
  }
  var top = Math.max(2, Math.round((H - 54) / 2));
  var met = state.bank >= state.target;

  /* left: the level, the cash big, the target after it, and how far the cash has come */
  GM.hudText(bd, GM.fmt(T.level, { n: state.level }), 8, top, GM.DARK, 1);
  var cash = "$" + GM.money(state.bank);
  var x = GM.hudText(bd, cash, 8, top + 13, GM.INK, 2) + 4;
  if (met) {
    var mw = GM.hudWidth(T.hudMet) + 6;
    GM.bandRect(bd, x, top + 24, mw, 14, GM.INK);
    GM.hudText(bd, T.hudMet, x + 3, top + 25, GM.PAPER, 1);
  } else {
    GM.hudText(bd, "/" + GM.money(state.target), x, top + 26, GM.DARK, 1);
  }
  var gw = 132, gy = top + 43, fill = met ? 1 : GM.levelShare(state, state.bank - (state.levelBank || 0));
  GM.bandRect(bd, 8, gy, gw, 8, GM.INK);
  GM.bandRect(bd, 10, gy + 2, gw - 4, 4, GM.PAPER);
  for (i = 0; i < gw - 4; i += 2) GM.bandRect(bd, 10 + i, gy + 2 + (i >> 1) % 2 * 2, 1, 2, GM.MID);
  GM.bandRect(bd, 10, gy + 2, Math.round((gw - 4) * fill), 4, GM.INK);

  /* right: the seconds left; the last ten turn over like the old bar did */
  var sec = Math.max(0, Math.ceil(state.time)), s = String(sec);
  var low = state.screen === "play" && sec <= 10;
  GM.hudText(bd, T.hudTime, W - 8 - GM.hudWidth(T.hudTime), top, GM.DARK, 1);
  var sw = GM.hudWidth(s, 2), uw = GM.hudWidth(T.hudSec), sx = W - 8 - uw - sw;
  if (low) GM.bandRect(bd, sx - 4, top + 13, sw + uw + 8, 28, GM.INK);
  GM.hudText(bd, s, sx, top + 13, low ? GM.PAPER : GM.INK, 2);
  GM.hudText(bd, T.hudSec, sx + sw, top + 26, low ? GM.PAPER : GM.DARK, 1);

  /* the dynamite under the clock: always there, so B is never a mystery; faint when there is none */
  var dn = "×" + Math.max(0, state.dynamite || 0), dw = GM.hudWidth(dn);
  var dx = W - 8 - dw - 18;
  GM.bandSprite(bd, GM.SPR.dynIcon, dx, top + 39, state.dynamite > 0 ? null : GM.MID);
  GM.hudText(bd, dn, W - 8 - dw, top + 41, state.dynamite > 0 ? GM.INK : GM.MID, 1);
};

/* ---------- the bedrock: the carts ---------- */
/* how far this level has come: the cash is counted over the whole run, so the gauge and the carts count from what
   the level started with (a level 11 that starts at $41,500 of $43,900 would otherwise open nearly full) */
GM.levelShare = function (state, amount) {
  var start = state.levelBank || 0, need = Math.max(1, (state.target || 0) - start);
  return Math.max(0, Math.min(1, amount / need));
};
GM.cartPile = function (share) { return Math.floor(6 * share); };

GM.rockKey = function (state) {
  var r = state.rival;
  return [GM.L.rock, state.bank >= state.target, GM.cartPile(GM.levelShare(state, state.bank - (state.levelBank || 0))),
    r ? GM.cartPile(GM.levelShare(state, r.haul)) : -1].join("|");
};

/* a nugget in a cart: bright on the dark rock, so no ink outline (the mine's own small gold has one and vanishes here) */
GM.bandNugget = function (bd, x, y) {
  GM.bandRect(bd, x + 2, y, 6, 1, GM.MID);
  GM.bandRect(bd, x + 1, y + 1, 8, 1, GM.MID);
  GM.bandRect(bd, x + 2, y + 1, 2, 1, GM.PAPER);
  GM.bandRect(bd, x, y + 2, 10, 2, GM.MID);
  GM.bandRect(bd, x + 6, y + 2, 4, 2, GM.DARK);
  GM.bandRect(bd, x + 1, y + 4, 8, 1, GM.DARK);
};

GM.drawCart = function (bd, x, y, pile, full, label) {
  var i;
  /* the load first, so the cart's rim covers its bottom */
  var spots = [[4, 0], [18, -1], [32, 0], [11, -6], [25, -6], [18, -11]];
  for (i = 0; i < pile; i++) GM.bandNugget(bd, x + 10 + spots[i][0], y - 5 + spots[i][1]);
  if (full) GM.bandSprite(bd, GM.SPR.miniGem, x + 44, y - 12);
  GM.bandRect(bd, x, y, 64, 20, GM.MID);
  GM.bandRect(bd, x + 2, y + 2, 60, 16, GM.DARK);
  GM.bandRect(bd, x + 2, y + 9, 60, 1, GM.MID);
  GM.bandRect(bd, x + 6, y + 4, 2, 2, GM.MID);
  GM.bandRect(bd, x + 56, y + 4, 2, 2, GM.MID);
  if (label) GM.hudText(bd, label, x + 26, y + 4, GM.PAPER, 1);
  for (i = 0; i < 2; i++) {
    var wx = x + 8 + i * 38;
    GM.bandRect(bd, wx, y + 18, 10, 8, GM.MID);
    GM.bandRect(bd, wx + 3, y + 21, 4, 2, GM.INK);
  }
};

GM.paintRock = function (bd, state) {
  var W = bd.w, H = bd.h, i;
  GM.bandRect(bd, 0, 0, W, H, GM.INK);
  GM.bandRect(bd, 0, 0, W, 2, GM.DARK);
  /* the stones of the bedrock: a fixed pattern, so the band never flickers between levels */
  var stoneH = Math.max(10, H - 46);
  for (i = 0; i < 18; i++) {
    var sx = (i * 61 + (i % 3) * 17) % (W - 18), sy = 8 + (i * 41) % stoneH, sw = 10 + (i * 7) % 16;
    GM.bandRect(bd, sx + 1, sy, sw - 2, 1, GM.DARK);
    GM.bandRect(bd, sx, sy + 1, sw, 4, GM.DARK);
    GM.bandRect(bd, sx + 1, sy + 5, sw - 2, 1, GM.DARK);
    GM.bandRect(bd, sx + 2, sy + 1, 3, 1, GM.MID);
  }
  /* the rails, near the bottom, on a clear strip of rock */
  var ry = H - 14;
  GM.bandRect(bd, 0, ry - 34, W, 48, GM.INK);
  GM.bandRect(bd, 0, ry, W, 2, GM.MID);
  GM.bandRect(bd, 0, ry + 7, W, 2, GM.MID);
  for (i = 2; i < W; i += 12) GM.bandRect(bd, i, ry + 2, 6, 5, GM.DARK);
  var mine = GM.cartPile(GM.levelShare(state, state.bank - (state.levelBank || 0)));
  GM.drawCart(bd, 20, ry - 26, mine, state.bank >= state.target, "");
  if (state.rival) {
    var his = GM.cartPile(GM.levelShare(state, state.rival.haul));
    GM.drawCart(bd, W - 84, ry - 26, his, false, "王");
  }
};

/* paint the two bands when what they show has changed; the mine itself is put every frame by GM.present */
/* the columns beside the mine on a wide canvas: each row carries on what the mine's edge column shows (sky, hills,
   the ground line, the seam), and the dirt below gets the same sparse specks; nothing else */
GM.paintSides = function (ctx, state) {
  var L = GM.L, bg = state.bg, wl = L.x0, wr = L.W - GM.BW - L.x0, side, w, x0, img, u32, x, y, t, edge, h;
  if (!bg) return;
  var dirtTop = (GM.GROUND + 7) * GM.SCALE;
  for (side = 0; side < 2; side++) {
    w = side ? wr : wl;
    if (w <= 0) continue;
    x0 = side ? L.x0 + GM.BW : 0;
    edge = side ? GM.BW - 1 : 0;
    img = ctx.createImageData(w, GM.BH);
    u32 = new Uint32Array(img.data.buffer);
    for (y = 0; y < GM.BH; y++) {
      for (x = 0; x < w; x++) {
        if (y < dirtTop) t = bg[y * GM.BW + edge];
        else {
          h = (Math.imul((x0 + x) >> 1, 73856093) ^ Math.imul(y >> 1, 19349663)) >>> 0;
          t = h % 53 === 0 ? GM.MID : GM.DARK;
        }
        u32[y * w + x] = GM.RGB32[t === GM.CLEAR ? GM.PAPER : t];
      }
    }
    ctx.putImageData(img, x0, L.sky);
  }
};

GM.paintBands = function (ctx, state, T) {
  var L = GM.L, img, bd, u32, i, key;
  if (L.W > GM.BW) {
    key = L.W + "|" + L.H + "|" + state.bgKey;
    if (key !== GM._sideKey) { GM._sideKey = key; GM.paintSides(ctx, state); }
  }
  if (L.sky > 0) {
    key = GM.skyKey(state, T);
    if (key !== GM._skyKey) {
      GM._skyKey = key;
      bd = GM.band(L.sky);
      GM.paintSky(bd, state, T);
      img = GM._skyImg || (GM._skyImg = ctx.createImageData(L.W, L.sky));
      u32 = new Uint32Array(img.data.buffer);
      for (i = 0; i < bd.b.length; i++) u32[i] = GM.RGB32[bd.b[i]];
      ctx.putImageData(img, 0, 0);
    }
  }
  if (L.rock > 0) {
    key = GM.rockKey(state);
    if (key !== GM._rockKey) {
      GM._rockKey = key;
      bd = GM.band(L.rock);
      GM.paintRock(bd, state);
      img = GM._rockImg || (GM._rockImg = ctx.createImageData(L.W, L.rock));
      u32 = new Uint32Array(img.data.buffer);
      for (i = 0; i < bd.b.length; i++) u32[i] = GM.RGB32[bd.b[i]];
      ctx.putImageData(img, 0, L.sky + GM.BH);
    }
  }
};
</script>

<script data-src="src/30-ui.js">
/* 矿工老张: DOM screens, the chin buttons, touch, sound and the page loop. */
var GM = (typeof GM !== "undefined" && GM) || {};

GM.ui = (function () {
  var LANG = (typeof PAD !== "undefined" && PAD.lang === "en") ? "en" : "zh";
  var T = GM.text(LANG);
  var state, ctx, cv, ov, introEl;
  var last = 0, lastScreen = "", lastIntro = "";
  var lastJingleId = 0;

  function $(id) { return document.getElementById(id); }
  function money(n) { return "$" + GM.money(n); }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function init(st) {
    state = st;
    cv = $("c");
    ctx = cv.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ov = $("ov");
    introEl = $("intro");
    /* the scoreboard is painted in the sky above the mine (src/22-hud.js), in this language */
    GM.hudT = T;
    document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
    document.title = T.title;
    cv.addEventListener("pointerdown", onCanvas);
    ov.addEventListener("click", onOverlay);
    addEventListener("resize", fit);
    document.addEventListener("visibilitychange", onVis);
    if (typeof PAD !== "undefined" && PAD.on) PAD.on("press", onPad);
    fit();
  }

  function setBest(info) {
    var incoming = (info && info.best) || { level: 0, bank: 0 };
    if (!GM.better(state.best, incoming)) state.best = incoming;
    state.bestBlocked = !(info && info.ok);
    state.saveMsg = info && info.corrupt ? T.saveFail : info && info.newer ? T.saveNewer : "";
  }

  function setRun(info) {
    state.run = (info && info.run) || null;
    state.runBlocked = !(info && info.ok);
    state.runMsg = info && info.corrupt ? T.runFail : info && info.newer ? T.runNewer : "";
    state.runDirty = false;
    if (state.run) state.menuCursor = 0;
    else if (state.menuCursor === 0) state.menuCursor = 1;
  }

  function saveRun() {
    if (!state.runDirty || state.runBlocked) return;
    if (typeof PAD === "undefined") return;
    try {
      if (state.run) {
        if (PAD.save) PAD.save("run", GM.runPayload(state));
        if (PAD.setSchema) PAD.setSchema(1);
      } else if (PAD.remove) {
        PAD.remove("run");
      }
      state.runDirty = false;
    } catch (e) {
      state.runBlocked = true;
      state.runMsg = T.runWrite;
    }
  }

  function row(sel, act, name, sub, off) {
    return '<button type="button" class="mrow' + (sel ? " sel" : "") + (off ? " off" : "") + '" data-act="' + act + '">' +
      "<b>" + esc(name) + "</b>" + (sub ? "<small>" + esc(sub) + "</small>" : "") + "</button>";
  }

  function codexValue(type) {
    var it = GM.ITEMS[type];
    if (type === "bag") return T.codexRandom;
    if (type === "tnt" || type === "mine" || type === "sealed") return T.codexBoom;
    if (type === "mole") return T.codexMole;
    return money(it.value);
  }

  function codexWeight(type) {
    var w = GM.ITEMS[type].weight;
    return w <= 1 ? T.codexLight : w <= 2.4 ? T.codexMid : T.codexHeavy;
  }

  function shell(cls, body, footer) {
    return '<div class="sbody ' + cls + '">' + body + '</div><div class="ofoot">' + esc(footer) + "</div>";
  }

  /* what the title menu shows: continue (only with a run in progress, its level and cash on the bar while it is
     chosen), new run, the codex; the record or a save warning on the bar otherwise. The menu's index is not
     state.menuCursor (0 continue, 1 new, 2 codex): without a run the menu starts at new. */
  function titleOffset() { return state.run ? 0 : 1; }
  function titleSpec() {
    /* a run that ended on level 1 still has its cash on record (recordBest keeps level 0 with a bank) */
    var best = state.best.level > 0
      ? GM.fmt(T.best, { l: state.best.level, b: GM.money(state.best.bank) })
      : state.best.bank > 0 ? GM.fmt(T.bestNoClear, { b: GM.money(state.best.bank) })
      : T.noBest;
    /* with a run on record, a new game throws it away (the confirm screen says so): 重新开始; without one, 新游戏 */
    var items = [{ label: state.run ? T.menuNew : T.menuFresh }, { label: T.menuCodex }];
    if (state.run) items.unshift({ label: T.menuContinue, status: GM.fmt(T.menuContinueAt, { n: state.run.level, b: GM.money(state.run.bank) }) });
    return {
      items: items,
      index: Math.max(0, state.menuCursor - titleOffset()),
      note: state.saveMsg || state.runMsg || best,
      hint: T.titleHint
    };
  }

  function render(screen) {
    var i, item, have, can, sel, price, rows, best, warn, extra, rec, next, target, short;
    if (screen === "title") {
      /* the shared title screen (sdk/lo-title.js): post("title") mounts it on this canvas; the menu turns by
         itself, so a cursor move does not redraw the screen */
      return '<canvas id="tt" class="lotitle"></canvas><h1 class="vh">' + esc(T.title) + "</h1>";
    }
    if (screen === "paused") {
      return shell("center",
        "<h1>" + esc(T.pause) + "</h1>" +
        "<p>" + esc(GM.fmt(T.level, { n: state.level })) + " · " + esc(GM.fmt(T.shopCash, { b: GM.money(state.bank) })) + "</p>" +
        '<div class="menu">' +
          row(state.pauseCursor === 0, "resume", T.resume, "", false) +
          row(state.pauseCursor === 1, "pauseTitle", T.pauseMenu, "", false) +
        "</div>",
        T.pauseFoot);
    }
    if (screen === "confirm") {
      var runLevel = state.run ? state.run.level : 1;
      return shell("center",
        "<h1>" + esc(T.confirmTitle) + "</h1>" +
        "<p>" + esc(GM.fmt(T.confirmText, { n: runLevel })) + "</p>" +
        '<div class="menu">' +
          row(state.confirmCursor === 0, "menu", T.confirmCancel, "", false) +
          row(state.confirmCursor === 1, "restartRun", T.confirmRestart, "", false) +
        "</div>",
        T.confirmFoot);
    }
    if (screen === "codex") {
      var cells = "";
      for (i = 0; i < GM.ITEM_ORDER.length; i++) {
        var ct = GM.ITEM_ORDER[i];
        /* the mole's line is long: it takes the whole last row, its picture beside the words */
        var wide = ct === "mole";
        cells += '<div class="ccell' + (wide ? " wide" : "") + '">' +
          '<canvas width="32" height="32" data-item="' + ct + '" aria-hidden="true"></canvas>' +
          "<div><b>" + esc(T.codexNames[i]) + "</b>" +
          "<span>" + esc(codexValue(ct)) + "</span>" +
          "<em>" + esc(codexWeight(ct)) + "</em></div></div>";
      }
      /* no on-screen back button: B goes back, and the key line under the page already says so */
      return shell("codex",
        "<h1>" + esc(T.codexTitle) + "</h1>" +
        '<p class="small">' + esc(T.codexHint) + "</p>" +
        '<div class="cgrid">' + cells + "</div>",
        T.codexFoot);
    }
    if (screen === "clear") {
      extra = Math.max(0, state.bank - state.target);
      rec = state.newBest ? '<p class="best">' + esc(T.record) + "</p>" : "";
      return shell("center",
        "<h1>" + esc(T.clear) + "</h1>" +
        '<p class="big cashline">' + esc(GM.fmt(T.clearLine, { b: GM.money(state.bank), t: GM.money(state.target) })) + "</p>" +
        '<p class="small">' + esc(GM.fmt(T.extra, { d: GM.money(extra) })) + "</p>" + rec +
        '<button type="button" class="primary" data-act="shop">' + esc(T.shopBtn) + "</button>",
        T.footClear);
    }
    if (screen === "shop") {
      next = state.level + 1;
      target = GM.targetFor(next);
      rows = "";
      var offers = state.shopOffers && state.shopOffers.length ? state.shopOffers : GM.shopOffers(state, next);
      for (i = 0; i < offers.length; i++) {
        item = offers[i];
        have = state[item.key] || 0;
        var bought = (state.shopBought && state.shopBought[item.key]) || 0;
        var capped = item.max != null && bought >= item.max;
        can = item.available && !capped && state.bank >= item.price;
        sel = state.shopCursor === i;
        if (!item.available) price = T.soldOut;
        else if (capped) price = T.shopBought;
        else if (state.bank < item.price) price = GM.fmt(T.shortPrice, { d: GM.money(item.price - state.bank) });
        else price = money(item.price) + (item.priceUp ? " " + T.priceUp : "");
        var ownedText = item.max == null || item.key === "dynamite"
          ? GM.fmt(T.ownedMany, { n: have })
          : GM.fmt(T.owned, { n: have, m: item.max });
        rows += '<button type="button" class="row' + (sel ? " sel" : "") + (can ? "" : " off") + '" data-act="buy" data-i="' + i + '">' +
          '<canvas class="sic" width="16" height="16" data-icon="' + ["dynIcon", "shopStrength", "shopClover", "shopBook"][i] + '" aria-hidden="true"></canvas>' +
          '<span class="nm">' + esc(T.shopNames[i]) + " <i>" + esc(ownedText) + "</i>" +
          "<small>" + esc(T.shopDescs[i]) + "</small></span>" +
          '<span class="pr">' + esc(price) + "</span></button>";
      }
      return shell("shop",
        '<div class="shophead"><b>' + esc(GM.fmt(T.shopTitle, { n: next })) + "</b><span>" +
        esc(GM.fmt(T.shopCash, { b: GM.money(state.bank) })) + "</span></div>" +
        '<p class="small nextline">' + esc(GM.fmt(T.nextTarget, { t: GM.money(target) })) + "</p>" +
        rows +
        '<button type="button" class="next' + (state.shopCursor === 4 ? " sel" : "") + '" data-act="next">' + esc(T.next) + "</button>",
        T.footShop);
    }
    if (screen === "over") {
      short = Math.max(0, state.target - state.bank);
      return shell("center",
        "<h1>" + esc(T.over) + "</h1>" +
        '<p class="big">' + esc(GM.fmt(T.overShort, { d: GM.money(short) })) + "</p>" +
        '<p class="small">' + esc(GM.fmt(T.clearLine, { b: GM.money(state.bank), t: GM.money(state.target) })) + "</p>" +
        '<p class="small">' + esc(T.overRun) + "</p>" +
        '<div class="menu">' +
          row(state.endCursor !== 1, "retry", T.retry, "", false) +
          row(state.endCursor === 1, "title", T.toTitle, "", false) +
        "</div>",
        T.footOver);
    }
    if (screen === "victory") {
      rec = state.newBest ? '<p class="best">' + esc(T.record) + "</p>" : "";
      return shell("center",
        "<h1>" + esc(T.victory) + "</h1>" +
        "<p>" + esc(T.victoryLine) + "</p>" +
        '<p class="big">' + esc(GM.fmt(T.shopCash, { b: GM.money(state.bank) })) + "</p>" + rec +
        '<div class="menu">' +
          row(state.endCursor !== 1, "endless", T.keep, "", false) +
          row(state.endCursor === 1, "title", T.toTitle, "", false) +
        "</div>",
        T.footVictory);
    }
    return "";
  }

  function post(screen) {
    var i, c, spr;
    if (screen === "title") {
      mountTitle();
      return;
    }
    if (screen === "shop") {
      var icons = ov.querySelectorAll("canvas[data-icon]");
      for (i = 0; i < icons.length; i++) {
        c = icons[i];
        spr = GM.SPR[c.getAttribute("data-icon")];
        if (!spr) continue;
        GM.paintSprite(c, spr, GM.MID, false);
      }
    }
    if (screen === "codex") {
      var items = ov.querySelectorAll("canvas[data-item]");
      for (i = 0; i < items.length; i++) {
        c = items[i];
        var type = c.getAttribute("data-item");
        spr = GM.SPR[type === "mole" ? "moleIcon" : type];
        if (!spr) continue;
        GM.paintSprite(c, spr, GM.DARK, true);
      }
    }
  }

  /* The title screen: the picture, the name painted over its sky and the menu, all drawn by sdk/lo-title.js */
  var titleMenu = null, titleArt = null;
  function mountTitle() {
    var c = $("tt");
    if (!c || typeof LoTitle === "undefined") return;
    if (!titleArt) titleArt = { w: GM.titleArt.W, h: GM.titleArt.H, px: GM.titleArt.draw(LANG, true) };
    var spec = titleSpec(), name = GM.titleArt.words(LANG);
    spec.art = titleArt;
    /* the name on the sky left of the winch; the fog may cover the picture from the claw on the nugget down */
    spec.title = { text: name.text, sub: name.sub, x: 17, y: 6, w: 86 };
    spec.calm = 141;
    spec.onMove = function (i) { state.menuCursor = i + titleOffset(); sfx("move"); };
    spec.onPick = function (i) { state.menuCursor = i + titleOffset(); chooseMenu(); };
    titleMenu = LoTitle.mount(c, spec);
  }

  function enter(screen) {
    if (!state) return;
    var prev = lastScreen;
    lastScreen = screen;
    var full = screen !== "play" && screen !== "intro";
    ov.hidden = !full;
    if (full) {
      /* a cursor move redraws the same screen: keep where its list was scrolled, then bring the cursor's row
         into view (UI.md 5: the cursor is always on the screen; the English shop is taller than 359 px) */
      var body = ov.querySelector(".sbody"), top = prev === screen && body ? body.scrollTop || 0 : 0;
      ov.innerHTML = render(screen);
      ov.scrollTop = 0;
      body = ov.querySelector(".sbody");
      if (body) {
        body.scrollTop = top;
        var cur = body.querySelector(".sel");
        if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
      }
      post(screen);
    } else {
      ov.innerHTML = "";
    }
    updateIntro();
    musicFor(screen);
    saveRun();
  }

  function updateIntro() {
    if (state.screen !== "intro") {
      if (!introEl.hidden) introEl.hidden = true;
      lastIntro = "";
      return;
    }
    var tip = state.level === 1 ? T.tip1 : state.level === 2 ? T.tip2
      : state.level === 3 ? T.tip4 : state.level === 4 ? T.tipMine
      : state.level === 5 ? T.tip7 : state.level === 6 ? T.tip6
      : state.level === 7 ? T.tipChain : state.level === 9 ? T.tipBig
      : state.level === 11 ? T.tipWang : T.tipDefault;
    var buff = [];
    if (state.strength) buff.push(T.buffNames[0]);
    if (state.clover) buff.push(T.buffNames[1]);
    if (state.book) buff.push(T.buffNames[2]);
    /* the keys are taught here, while the level opens: during play the whole screen is the mine */
    var html = "<b>" + esc(GM.fmt(T.intro, { n: state.level, t: GM.money(state.target) })) + "</b><span>" + esc(tip) + "</span>" +
      (buff.length ? "<span>" + esc(GM.fmt(T.buffIntro, { b: buff.join(" · ") })) + "</span>" : "") +
      '<span class="keys">' + esc(GM.footPlayText(LANG, state.dynamite > 0 ? state.dynamite : 0)) + "</span>";
    if (html === lastIntro) return;
    lastIntro = html;
    introEl.innerHTML = html;
    introEl.hidden = false;
  }

  function sfx(sound) {
    if (typeof PAD === "undefined" || !PAD.sfx) return;
    try { PAD.sfx(sound); }
    catch (e) { try { if (typeof sound !== "string") PAD.sfx("hit"); } catch (e2) {} }
  }

  function pump() {
    var n = 0;
    while (state.events.length && n++ < 60) {
      var ev = state.events.shift();
      if (ev === "fire") sfx("tap");
      else if (ev === "throw") sfx(GM.SFX.throw);
      else if (ev === "grab") { sfx(GM.SFX.grab); sfx(GM.SFX.grabBody); }
      else if (ev === "coin") sfx(GM.SFX.coin);
      else if (ev === "gem") sfx(GM.SFX.chime);
      else if (ev === "junk") sfx("miss");
      else if (ev === "boom") sfx(GM.SFX.boom);
      else if (ev === "bigboom") sfx(GM.SFX.bigboom);
      else if (ev === "chain") sfx(GM.SFX.chain);
      else if (ev === "mine") sfx(GM.SFX.mine);
      else if (ev === "clank") sfx(GM.SFX.clank);
      else if (ev === "rivalFire") sfx(GM.SFX.rivalFire);
      else if (ev === "rivalGrab") sfx(GM.SFX.grabBody);
      else if (ev === "rivalTaunt") sfx(GM.SFX.taunt);
      else if (ev === "rivalBoom") sfx(GM.SFX.boom);
      else if (ev === "rivalMine") sfx(GM.SFX.mine);
      else if (ev === "rivalClank") sfx(GM.SFX.clank);
      else if (ev === "tick") sfx("tick");
      else if (ev === "clear") sfx("win");
      else if (ev === "fail") sfx("lose");
      else if (ev === "buy") sfx("ok");
      else if (ev === "err") sfx("err");
      else if (ev === "move") sfx("move");
      if (ev === "clear" || ev === "fail") saveBest();
    }
  }

  function saveBest() {
    if (!state.bestDirty || state.bestBlocked) return;
    if (typeof PAD === "undefined" || !PAD.save) return;
    try {
      var r = PAD.save("best", GM.bestPayload(state));
      if (r && typeof r.catch === "function") {
        r.catch(function () { state.bestBlocked = true; state.saveMsg = T.saveWrite; });
      }
      try { if (PAD.setSchema) PAD.setSchema(1); } catch (e) {}
      state.bestDirty = false;
    } catch (e) {
      state.bestBlocked = true;
      state.saveMsg = T.saveWrite;
    }
  }

  function musicFor(screen) {
    if (typeof PAD === "undefined" || !PAD.music) return;
    if (screen === "intro") {
      if (state.jingleId !== lastJingleId) {
        lastJingleId = state.jingleId;
        try { PAD.music.play(GM.JINGLE, { loop: false }); } catch (e) {}
      }
    } else if (screen !== "play") {
      try { PAD.music.stop(); } catch (e) {}
    }
  }

  function startRun() {
    GM.startRun(state);
    enter(state.screen);
  }

  function openShop() {
    GM.openShop(state);
    enter("shop");
  }

  function shopNext() {
    GM.shopNext(state);
    pump();
    enter(state.screen);
  }

  function continueGame() {
    if (!state.run) { sfx("err"); return; }
    GM.continueRun(state);
    pump();
    enter(state.screen);
  }

  function newGame() {
    if (state.run) {
      state.screen = "confirm";
      state.confirmCursor = 0;
      enter("confirm");
    } else {
      GM.startRun(state);
      pump();
      enter(state.screen);
    }
  }

  function openCodex() {
    state.screen = "codex";
    enter("codex");
  }

  function chooseMenu() {
    if (state.loading) return;
    if (state.menuCursor === 0) continueGame();
    else if (state.menuCursor === 1) newGame();
    else openCodex();
  }

  function onCanvas(e) {
    if (state.screen === "play") {
      GM.fire(state);
      pump();
    } else if (state.screen === "intro") {
      state.introT = 0;
    }
    e.preventDefault();
  }

  function onOverlay(e) {
    var el = e.target;
    while (el && el !== ov && !(el.getAttribute && el.getAttribute("data-act"))) el = el.parentNode;
    if (!el || el === ov) return;
    var act = el.getAttribute("data-act");
    var i = +(el.getAttribute("data-i") || 0);
    var prev = state.screen;
    if ((act === "continue" || act === "new" || act === "codex") && state.loading) { e.preventDefault(); return; }
    if (act === "continue") continueGame();
    else if (act === "new") newGame();
    else if (act === "codex") openCodex();
    else if (act === "restartRun") { GM.startRun(state); pump(); enter(state.screen); }
    else if (act === "retry") startRun();
    else if (act === "resume") { GM.resume(state); enter(state.screen); }
    else if (act === "menu" || act === "pauseTitle" || act === "title") {
      GM.toTitle(state);
      if (prev === "codex") state.menuCursor = 2;
      enter("title");
    }
    else if (act === "shop" || act === "endless") openShop();
    else if (act === "buy") { GM.buy(state, i); pump(); enter("shop"); }
    else if (act === "next") shopNext();
    e.preventDefault();
  }

  function onPad(btn) {
    var s = state.screen;
    if (s === "title") {
      if (titleMenu) titleMenu.press(btn);
      return;
    }
    if (s === "confirm") {
      if (btn === "up" || btn === "down") {
        state.confirmCursor = 1 - state.confirmCursor;
        sfx("move");
        enter("confirm");
        return;
      }
      if (btn === "a" || btn === "start") {
        if (state.confirmCursor === 0) {
          GM.toTitle(state);
          enter("title");
        } else {
          GM.startRun(state);
          pump();
          enter(state.screen);
        }
      } else if (btn === "b") {
        GM.toTitle(state);
        enter("title");
      }
      return;
    }
    if (s === "codex") {
      if (btn === "a" || btn === "b" || btn === "start") {
        GM.toTitle(state);
        state.menuCursor = 2;
        enter("title");
      }
      return;
    }
    if (s === "intro") {
      if (btn === "a") { state.introT = 0; return; }
      if (btn === "start" && GM.pause(state)) enter("paused");
      return;
    }
    if (s === "play") {
      if (btn === "a") { GM.fire(state); pump(); }
      else if (btn === "b") {
        /* with no stick in the pack B still answers, so the key never feels dead */
        if (!GM.useDynamite(state)) sfx("err");
        pump();
      } else if (btn === "start" && GM.pause(state)) enter("paused");
      return;
    }
    if (s === "paused") {
      if (btn === "up" || btn === "down") {
        state.pauseCursor = 1 - state.pauseCursor;
        sfx("move");
        enter("paused");
        return;
      }
      /* START always resumes, as the footer says; only A acts on the cursor (#344) */
      if (btn === "start" || (btn === "a" && state.pauseCursor === 0)) { GM.resume(state); enter(state.screen); }
      else if (btn === "a") { GM.toTitle(state); enter("title"); }
      else if (btn === "b") {
        GM.resume(state);
        enter(state.screen);
      }
      return;
    }
    if (s === "clear") {
      if (btn === "a" || btn === "start") openShop();
      return;
    }
    if (s === "shop") {
      if (btn === "up") { GM.moveShop(state, -1); pump(); enter("shop"); }
      else if (btn === "down") { GM.moveShop(state, 1); pump(); enter("shop"); }
      /* only A buys, as the footer says; START goes on to the next level like B, so a stray press spends nothing */
      else if (btn === "a") {
        if (state.shopCursor === 4) shopNext();
        else { GM.buy(state, state.shopCursor); pump(); enter("shop"); }
      } else if (btn === "b" || btn === "start") shopNext();
      return;
    }
    /* the end screens are a two-row menu like the pause menu: up and down move, A takes the chosen row,
       START takes the first (play on), B goes to the title */
    if (s === "over" || s === "victory") {
      if (btn === "up" || btn === "down") {
        state.endCursor = state.endCursor === 1 ? 0 : 1;
        sfx("move");
        enter(s);
      } else if (btn === "b" || (btn === "a" && state.endCursor === 1)) {
        state.endCursor = 0;
        GM.toTitle(state); enter("title");
      } else if (btn === "a" || btn === "start") {
        state.endCursor = 0;
        if (s === "over") startRun(); else openShop();
      }
    }
  }

  function onVis() {
    if (document.hidden && (state.screen === "play" || state.screen === "intro") && GM.pause(state)) enter("paused");
  }

  /* the canvas fills the stage: 320 columns across the width, as many rows as the height allows; the mine keeps
     its 320 x 288 and the rows left over become sky and bedrock (GM.frameLayout) */
  var fitW = 0, fitH = 0, stageEl = null;
  function fit() {
    if (!cv) return;
    var stage = stageEl || (stageEl = $("stage")), r = stage.getBoundingClientRect(), w = r.width, h = r.height;
    fitW = stage.clientWidth; fitH = stage.clientHeight;
    if (w < 40 || h < 40) return;
    var L = GM.frameLayout(w, h);
    if (cv.width !== L.W) cv.width = L.W;
    if (cv.height !== L.H) cv.height = L.H;
    GM.setLayout(L);
    /* exact sizes, not rounded: a rounded width left a line of paper down each side on an iPhone */
    cv.style.width = (L.W * L.k) + "px";
    cv.style.height = (L.H * L.k) + "px";
    if (state && (state.screen === "play" || state.screen === "intro")) GM.draw(ctx, state);
  }

  function loop(now) {
    var dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    last = now;
    /* the handheld can size this page after it starts (on an iPhone the chin pad and the safe areas settle late)
       and a resize event does not always follow; a stage that changed size is fitted again here, or the mine
       stays as small as the first, unsettled size and leaves paper at both sides */
    if (stageEl && (stageEl.clientWidth !== fitW || stageEl.clientHeight !== fitH)) fit();
    if (state.screen === "play" || state.screen === "intro") {
      GM.update(state, dt);
      pump();
      if (state.screen !== lastScreen) enter(state.screen);
      if (state.screen === "play" || state.screen === "intro") {
        updateIntro();
        GM.draw(ctx, state);
      }
    } else if (state.screen !== lastScreen) {
      enter(state.screen);
    }
    requestAnimationFrame(loop);
  }

  return {
    init: init,
    setBest: setBest,
    setRun: setRun,
    enter: enter,
    loop: loop,
    fit: fit,
    pump: pump,
    lang: LANG,
    text: T
  };
})();
</script>
<script data-src="src/40-boot.js">
/* 矿工老张: boot, load the best run and the run in progress, then hand the page to the UI loop. */
(function () {
  var state = GM.newState();
  GM.ui.init(state);
  /* the title waits for the saves: a press before they are read would start a run over the one on disk */
  state.loading = true;
  GM.ui.setBest({ ok: true, best: { level: 0, bank: 0 } });
  GM.ui.setRun({ ok: true, run: null });
  GM.ui.enter("title");
  requestAnimationFrame(GM.ui.loop);

  function loadKey(key) {
    return new Promise(function (resolve) {
      if (typeof PAD === "undefined" || !PAD.load) { resolve(null); return; }
      try {
        var p = PAD.load(key);
        if (p && typeof p.then === "function") p.then(resolve, function () { resolve(undefined); });
        else resolve(p);
      } catch (e) {
        resolve(undefined);
      }
    });
  }

  Promise.all([loadKey("best"), loadKey("run")]).then(function (res) {
    var bestInfo = res[0] === undefined
      ? { ok: false, corrupt: true, best: { level: 0, bank: 0 } }
      : GM.readBest(res[0]);
    var runInfo = res[1] === undefined
      ? { ok: false, corrupt: true, run: null }
      : GM.readRun(res[1]);
    state.loading = false;
    GM.ui.setBest(bestInfo);
    if (state.screen === "title" && !state.run) {
      GM.ui.setRun(runInfo);
      GM.ui.enter("title");
    }
  });
})();
</script>
</body>
