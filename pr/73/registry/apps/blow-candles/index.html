}
function micOff() {
  wanted = false; live = false; heard.level = 0; heard.pitch = null;
  if (HAS_MIC) PAD.mic.stop();
}
if (HAS_MIC) PAD.on("sound", function (s) {
  if (!wanted) return;
  heard.level = s.level; heard.pitch = s.pitch;
  /* the room's own noise: follow it down at once, up slowly, so a fan or traffic does not count as a breath */
  floor = s.level < floor ? s.level : Math.min(floor + 0.004, 0.6);
});
function threshold() { return Math.max(0.5, floor + 0.2); }

var best = 0;
game.load("best").then(function (v) { if (typeof v === "number") best = v; });
game.load("mode").then(function (v) { if (v === "keys" || (v === "mic" && HAS_MIC)) mode = v; });

/* ---- sounds of our own ---- */
var PUFF = { wave: "noise", from: 1400, to: 300, ms: 200, attack: 4, decay: 190, vol: 0.55 };
var LIGHT = { wave: "square", duty: 1, from: 330, to: 990, ms: 260, attack: 5, decay: 240, vol: 0.45 };
var REF = { wave: "triangle", from: 440, to: 440, ms: 900, attack: 30, decay: 300, vol: 0.6 };   /* the note to sing: A */
var fireAt = -1;
function fire(lit) { if (lit === fireAt) return; fireAt = lit; game.ambience(lit > 0 ? "fire" : null, Math.min(0.7, 0.15 + lit * 0.06)); }

/* ---- art ---- */
var FLAME = [
  LoGame.sprite(["...1...", "...1...", "..121..", "..131..", ".12321.", ".13331.", "1233321", "1333331", "1333331", ".13331.", "..111.."]),
  LoGame.sprite(["....1..", "...11..", "..121..", "..1331.", ".12321.", ".13331.", "1233321", "1333331", "1333331", ".13331.", "..111.."])
];
var SMALL = LoGame.sprite(["..1..", ".121.", ".131.", "13331", ".131.", "..1.."]);

/* ---- the round ---- */
var R, score = 0;
function newRound(i) {
  var bonus = i >= ROUNDS.length, spec = ROUNDS[Math.min(i, ROUNDS.length - 1)], n = bonus ? 1 : spec.n;
  var c = [], gap = 160 / (n + 1);
  for (var k = 0; k < n; k++) {
    var thick = !bonus && spec.thick && (k === 0 || k === n - 1);
    c.push({ x: Math.round(gap * (k + 1)), h: 22 + Math.floor(Math.random() * 18), w: thick ? 12 : 8, hard: thick ? 1.8 : 0.8 + Math.random() * 0.5,
             life: bonus ? 0 : 1, lit: !bonus, smoke: 0 });
  }
  return { i: i, bonus: bonus, c: c, left: bonus ? BONUS_SEC : spec.sec, phase: "ready", t: 0, wind: 0, held: 0, lung: 1,
           semi: -6, hold: 0, refUntil: 0, got: 0, timeBonus: 0, ticked: 0 };
}
function litCount() { return R.c.filter(function (c) { return c.lit; }).length; }

function begin() { R.phase = "play"; R.t = 0; if (R.bonus) playRef(); }
function playRef() { game.sfx(REF); R.refUntil = game.time + 1.2; }

function end() {
  micOff();                                             /* listening is over: give the silent switch back */
  R.phase = "done"; R.t = 0;
  if (R.bonus) { R.got = R.c[0].lit ? 50 : 0; }
  else {
    R.got = (R.c.length - litCount()) * 10;
    R.timeBonus = litCount() === 0 ? Math.ceil(R.left) * 5 : 0;
  }
  score += R.got + R.timeBonus;
  game.sfx(R.got + R.timeBonus > 0 ? "win" : "lose");
  fire(R.bonus && R.c[0].lit ? 1 : 0);
  if (R.bonus && score > best) { best = score; game.save("best", best); }
}

/* blowing: how hard, 0-1, from the microphone or from A held down */
function blowing(dt) {
  var target = 0;
  if (live) {
    var th = threshold();
    if (heard.level > th) target = Math.min(1, (heard.level - th) / (0.95 - th) * 0.8 + 0.2);
  }
  if (game.btn("a") && R.lung > 0) {                     /* the longer A is held, the harder: until the breath runs out */
    R.held += dt; R.lung = Math.max(0, R.lung - dt / 3);
    target = Math.max(target, Math.min(1, 0.3 + R.held * 0.45));
  } else if (!game.btn("a")) { R.held = 0; R.lung = Math.min(1, R.lung + dt / 2); }
  R.wind += (target - R.wind) * Math.min(1, dt * (target > R.wind ? 12 : 6));
  if (R.wind < 0.01) R.wind = 0;
}

function blowOut(dt) {
  var w = R.wind, half = (R.c.length - 1) / 2 || 1, out = 0;
  R.c.forEach(function (c, k) {
    if (c.smoke > 0) c.smoke -= dt;
    if (!c.lit) return;
    var far = Math.abs(k - half) / half;                /* the breath is aimed at the middle: a loud one reaches the ends */
    var reach = w * (1.15 - far * 0.55);
    if (reach > 0.25) c.life -= (reach - 0.15) * dt * 1.6 / c.hard;
    else c.life = Math.min(1, c.life + dt * 0.5);       /* a flame that is let be stands up again */
    if (c.life <= 0) { c.lit = false; c.smoke = 1.2; out++; }
  });
  if (out) { game.sfx(PUFF); fire(litCount()); }
}

function sing(dt) {
  var c = R.c[0];
  if (c.lit) return;
  var semi = null;
  if (live && heard.pitch) {                           /* readings come only when they change: hold the last one */
    var s = 12 * Math.log(heard.pitch / 440) / Math.LN2;
    semi = ((s % 12) + 18) % 12 - 6;                     /* any octave counts: sing it, hum it or whistle it */
  }
  if (game.btn("a")) R.semi = Math.min(6, R.semi + dt * 7);          /* keys: A raises the note, letting go lowers it */
  else if (semi === null) R.semi = Math.max(-6, R.semi - dt * 5);
  if (semi !== null) R.semi += (semi - R.semi) * Math.min(1, dt * 10);
  var on = Math.abs(R.semi) < 1 && game.time > R.refUntil && (semi !== null || game.btn("a"));
  R.hold = on ? R.hold + dt : Math.max(0, R.hold - dt * 0.5);
  if (R.hold >= HOLD_NOTE) { c.lit = true; c.life = 1; c.smoke = 0; game.sfx(LIGHT); fire(1); end(); }
}

async function pause() {
  micOff();                                             /* paused: nothing to listen for */
  game.sfx("tap");
  var acts = [["go", { zh: "继续", en: "Resume" }], ["again", { zh: "重来", en: "Start over" }]];
  if (HAS_MIC) acts.push(["mode", mode === "mic" ? { zh: "按键玩法", en: "Play with keys" } : { zh: "话筒玩法", en: "Play with mic" }]);
  acts.push(["quit", { zh: "回标题", en: "Title" }]);
  var i = await game.choose(acts.map(function (a) { return T(a[1]); }), { title: T({ zh: "暂停", en: "Paused" }) });
  var act = i < 0 ? "go" : acts[i][0];
  if (act === "quit") { game.go("title"); return; }
  if (act === "again") { game.go("round", { i: 0, fresh: true }); return; }
  if (act === "mode") {
    mode = mode === "mic" ? "keys" : "mic"; game.save("mode", mode);
    say(mode === "mic" ? T({ zh: "对着话筒吹", en: "Blow into the mic" }) : T({ zh: "按住 A 吹", en: "Hold A to blow" }), 2);
  }
  micOn();
}

/* ---- drawing ---- */
function drawCandles(g) {
  var half = (R.c.length - 1) / 2 || 1;
  R.c.forEach(function (c, k) {
    var top = TABLE - c.h, x = c.x - (c.w >> 1);
    g.rect(x, top, c.w, c.h, g.PAPER); g.frame(x, top, c.w, c.h, g.INK);
    g.rect(x + 1, top + 1, 2, c.h - 2, g.MID);
    if (c.lit || c.smoke > 0 || R.bonus) g.line(c.x, top - 3, c.x, top - 1, g.INK);       /* the wick */
    if (c.lit) {
      var side = k < half ? -1 : k > half ? 1 : (Math.floor(game.time * 3) % 2 ? 1 : -1);
      var lean = Math.round(R.wind * 3 * side * (0.4 + 0.6 * c.life));
      var f = c.life > 0.45 ? FLAME[Math.floor(game.time * 6 + k) % 2] : SMALL;
      g.sprite(f, c.x - (f.w >> 1) + lean, top - 3 - f.h, { flip: side < 0 && lean !== 0 });
    } else if (c.smoke > 0 && !R.bonus) {
      var u = 1.2 - c.smoke;
      for (var j = 0; j < 4; j++) {
        var yy = top - 5 - j * 4 - u * 14, xx = c.x + Math.round(Math.sin(game.time * 4 + j) * 1.5);
        if (yy > HUD) g.pixel(xx, yy, j % 2 ? g.MID : g.DARK);
      }
    }
  });
}

function bar(g, x, y, w, v, mark) {
  g.frame(x, y, w, 8, g.INK);
  g.rect(x + 1, y + 1, Math.round((w - 2) * Math.max(0, Math.min(1, v))), 6, g.DARK);
  if (mark != null) g.rect(x + 1 + Math.round((w - 2) * mark), y - 1, 1, 10, g.INK);
}

function drawPitch(g) {
  /* the note meter: the target in the middle, the note heard as a marker, an octave across */
  var x = 14, w = 132, y = 122;
  g.frame(x, y, w, 10, g.INK);
  g.rect(x + w / 2 - 11, y + 1, 22, 8, g.MID);
  var m = x + w / 2 + Math.round(R.semi / 6 * (w / 2 - 3));
  g.rect(m - 1, y - 2, 3, 14, g.INK);
  bar(g, x, y + 16, w, R.hold / HOLD_NOTE);
}

function foot(g, text) {
  var n = game.time < noteUntil;                        /* a line about the microphone takes the footer for a moment */
  g.rect(0, FOOT, 160, 176 - FOOT, n ? g.INK : g.PAPER); g.rect(0, FOOT, 160, 1, g.INK);
  g.text(n ? note : text, 80, FOOT + 2, { align: "center", color: n ? g.PAPER : g.INK });
}

/* ---- the title: a cake that blows its own candles out and lights them again, then the keys with their pictures ---- */
var ICON = {
  mic: LoGame.sprite(["..000..", ".01110.", ".01110.", ".01110.", "0.000.0", "0.....0", ".00000.", "...0...", ".00000."]),
  a: LoGame.sprite(["..00000..", ".0111110.", "011131110", "011313110", "011333110", "011313110", ".0111110.", "..00000.."]),
  pill: LoGame.sprite([".000000000.", "01111111110", "01111111110", "01111111110", ".000000000."]),
  note: LoGame.sprite(["...0000", "...0..0", "...0..0", "...0..0", ".000.00", "0000000", ".00..0."])
};
var CAKE_X = [48, 64, 80, 96, 112], CYCLE = 7;

function drawCake(g) {
  var t = game.time % CYCLE;
  g.dither(0, 18, 160, 36, g.MID, 1);                   /* the dim wall */
  g.rect(0, 74, 160, 1, g.INK);                         /* the table's edge */
  g.dither(0, 75, 160, 3, g.MID, 2);
  g.rect(26, 71, 108, 3, g.INK); g.rect(28, 71, 104, 1, g.PAPER);   /* the plate */
  g.rect(36, 54, 88, 17, g.DARK); g.frame(36, 54, 88, 17, g.INK);
  g.rect(37, 63, 86, 2, g.MID);                         /* the filling */
  g.rect(36, 51, 88, 5, g.PAPER); g.frame(36, 51, 88, 5, g.INK);    /* the icing, with drips */
  for (var dx = 40; dx < 122; dx += 9) g.rect(dx, 56, 3, 2 + (dx * 7 % 3), g.PAPER);
  var blowing = t > 2.4 && t < 4.6;
  if (blowing) for (var w = 0; w < 3; w++) {             /* a breath from the right */
    var wx = 160 - ((t - 2.4) * 90 + w * 23) % 70;
    g.rect(Math.round(wx), 28 + w * 5, 8 - w * 2, 1, g.INK);
  }
  CAKE_X.forEach(function (x, k) {
    var top = 38, out = 3.0 + (4 - k) * 0.3, back = 5.6 + k * 0.25;
    g.rect(x - 3, top, 6, 13, g.PAPER); g.frame(x - 3, top, 6, 13, g.INK);
    g.rect(x - 2, top + 1, 1, 11, g.MID);
    g.line(x, top - 3, x, top - 1, g.INK);
    var lit = t < out || t >= back;
    if (lit) {
      var f = t >= back && t < back + 0.15 ? SMALL : FLAME[Math.floor(game.time * 6 + k) % 2];
      var lean = blowing ? -2 : 0;
      g.sprite(f, x - (f.w >> 1) + lean, top - 3 - f.h, { flip: lean !== 0 });
    } else if (t < out + 1.4) {                         /* smoke from a wick just out */
      var u = t - out;
      for (var j = 0; j < 4; j++) {
        var yy = top - 5 - j * 4 - u * 10, xx = x + Math.round(Math.sin(game.time * 4 + j) * 1.5);
        if (yy > 19) g.pixel(xx, Math.round(yy), j % 2 ? g.MID : g.DARK);
      }
    }
  });
}

function keyRow(g, icon, name, what, y) {
  var s = ICON[icon];
  g.sprite(s, 13 - (s.w >> 1), y + 7 - (s.h >> 1));
  if (name) g.text(name, 24, y, { color: g.DARK });
  g.text(what, name ? 70 : 24, y);
}

/* ---- scenes ---- */
game.scene("title", {
  enter: function () { micOff(); fire(0); },
  update: function () {
    if (game.pressed("select") && HAS_MIC) { mode = mode === "mic" ? "keys" : "mic"; game.save("mode", mode); game.sfx("tick"); }
    if (game.pressed("a") || game.pressed("start") || game.pointer.pressed) { game.sfx("ok"); game.go("round", { i: 0, fresh: true }); }
  },
  draw: function (g) {
    g.clear(g.PAPER);
    drawCake(g);
    g.rect(0, 0, 160, 18, g.INK);
    var title = T({ zh: "吹蜡烛", en: "CANDLES" }), tw = g.measure(title);
    g.text(title, 80, 2, { align: "center", color: g.PAPER });
    g.sprite(SMALL, 80 - (tw >> 1) - 12, 6); g.sprite(SMALL, 80 + (tw >> 1) + 7, 6);
    var cap = HAS_MIC ? T({ zh: "对着话筒吹灭蜡烛", en: "Blow them out" }) : T({ zh: "按住 A 吹灭蜡烛", en: "Hold A to blow" }), cw = g.measure(cap) + 11;
    if (HAS_MIC) g.sprite(ICON.mic, 80 - (cw >> 1), 82);
    g.text(cap, HAS_MIC ? 80 - (cw >> 1) + 11 : 80, 80, HAS_MIC ? {} : { align: "center" });
    g.rect(8, 95, 144, 1, g.MID);
    var y = 98;
    keyRow(g, "a", "A", T({ zh: "按住吹", en: "hold, blow" }), y); y += 14;
    keyRow(g, "pill", "START", T({ zh: "暂停", en: "pause" }), y); y += 14;
    if (HAS_MIC) keyRow(g, "pill", "SELECT", mode === "mic" ? T({ zh: "玩法：话筒", en: "play: MIC" }) : T({ zh: "玩法：按键", en: "play: KEYS" }), y);
    else g.text(T({ zh: "这台掌机没有话筒", en: "No mic here" }), 24, y, { color: g.DARK });
    y += 14;
    keyRow(g, "note", "", T({ zh: "最后一轮：唱个音点回来", en: "Last: sing one back" }), y);
    g.rect(0, 158, 160, 18, g.INK);
    g.text(T({ zh: "最高 {n}", en: "Best {n}" }, { n: best }), 6, 160, { color: g.PAPER });
    if (Math.floor(game.time * 2) % 2 === 0) g.text(T({ zh: "按 A 开始", en: "Press A" }), 154, 160, { align: "right", color: g.PAPER });
  }
});

game.scene("round", {
  enter: function (a) {
    if (a && a.fresh) score = 0;
    R = newRound(a ? a.i : 0);
    micOn();                                             /* asks now, so the answer is in before the clock starts */
    fire(R.bonus ? 0 : litCount());
  },
  exit: function () { micOff(); },
  update: function (dt) {
    R.t += dt;
    if (R.phase !== "done" && game.pressed("start")) { pause(); return; }
    if (R.phase === "ready") { if (R.t > 1.6 && !asking) begin(); R.c.forEach(function (c) { if (c.smoke > 0) c.smoke -= dt; }); return; }
    if (R.phase === "done") {
      if (R.t > 0.6 && (game.pressed("a") || game.pointer.pressed)) {
        game.sfx("ok");
        if (R.bonus) game.go("title"); else game.go("round", { i: R.i + 1 });
      }
      return;
    }
    R.left -= dt;
    if (R.left < 3.5 && Math.ceil(R.left) !== R.ticked) { R.ticked = Math.ceil(R.left); if (R.ticked > 0) game.sfx("tick"); }
    if (R.bonus) {
      if (game.pressed("b") && game.time > R.refUntil) playRef();
      sing(dt);
    } else {
      blowing(dt);
      blowOut(dt);
      if (!litCount()) { end(); return; }
    }
    if (R.left <= 0 && R.phase === "play") { R.left = 0; end(); }
  },
  draw: function (g) {
    g.clear(g.PAPER);
    g.rect(0, 0, 160, HUD, g.INK);
    g.text(R.bonus ? T({ zh: "加时", en: "Bonus" }) : T({ zh: "第{n}轮", en: "Round {n}" }, { n: R.i + 1 }), 3, 1, { color: g.PAPER });
    g.text(T({ zh: "分{n}", en: "{n} pts" }, { n: score }), 80, 1, { color: g.PAPER, align: "center" });
    g.text(String(Math.ceil(R.left)), 157, 1, { color: g.PAPER, align: "right" });
    g.dither(0, HUD, 160, 40, g.MID, 1);                 /* a dim wall behind the table */
    g.rect(0, TABLE, 160, 2, g.INK); g.rect(0, TABLE + 2, 160, 4, g.DARK);
    drawCandles(g);
    var y = 124;
    if (R.phase === "ready") {
      var t = R.bonus ? T({ zh: "最后一轮：唱准这个音", en: "Last: sing this note" })
                      : T({ zh: "{n} 支蜡烛，准备", en: "{n} candles, ready" }, { n: R.c.length });
      g.text(asking ? T({ zh: "等话筒…", en: "Waiting for the mic..." }) : t, 80, y, { align: "center" });
    } else if (R.phase === "play") {
      if (R.bonus) drawPitch(g);
      else if (live) {
        g.text(T({ zh: "正在听：对着话筒吹", en: "Listening: blow!" }), 80, y - 2, { align: "center" });
        bar(g, 14, y + 14, 132, heard.level, threshold());
      } else {
        g.text(T({ zh: "按住 A 吹", en: "Hold A to blow" }), 80, y - 2, { align: "center" });
        bar(g, 14, y + 14, 132, R.lung);
      }
    } else {
      var txt = R.bonus ? (R.c[0].lit ? T({ zh: "点着了！+50", en: "Alight! +50" }) : T({ zh: "没点着", en: "No light" }))
              : T({ zh: "吹灭 {a}/{b}  +{p}", en: "Out {a}/{b}  +{p}" }, { a: R.c.length - litCount(), b: R.c.length, p: R.got + R.timeBonus });
      g.window(10, 20, 140, 36);                        /* above the flames, so the candles show what happened */
      g.text(txt, 80, 24, { align: "center" });
      if (R.timeBonus) g.text(T({ zh: "含剩余时间 +{t}", en: "incl. time +{t}" }, { t: R.timeBonus }), 80, 39, { align: "center", color: g.DARK });
      if (R.bonus) g.text(T({ zh: "总分 {s}  最高 {b}", en: "Total {s}  Best {b}" }, { s: score, b: best }), 80, 39, { align: "center" });
    }
    var f = R.phase === "done" ? T({ zh: "A 继续", en: "A next" })
          : R.bonus && R.phase === "play" ? (live ? T({ zh: "唱或吹口哨  B 再听", en: "Sing or whistle  B hear" }) : T({ zh: "按住 A 升高  B 再听", en: "Hold A: higher  B hear" }))
          : live ? T({ zh: "对着话筒吹  START 暂停", en: "Blow  START pause" }) : T({ zh: "按住 A 吹  START 暂停", en: "Hold A  START pause" });
    foot(g, f);
  }
});

game.start("title");
</script>
</body>
</html>
