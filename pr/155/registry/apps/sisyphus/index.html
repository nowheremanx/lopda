<script data-src="src/quotes.js">
/* Sisyphus: the sixteen lines. French originals: Albert Camus, Le Mythe de Sisyphe (1942).
   Chinese and English translations for this work; not a published translation. */
var QS = (function () {
  var QUOTES = [
    { id: "1", zh: "真正严肃的哲学问题只有一个：自杀。",
      en: "There is only one truly serious philosophical problem: suicide." },
    { id: "2", zh: "人与自己的生活、演员与布景之间的离异，正是荒诞之感。",
      en: "The divorce between a man and his life, the actor and his setting: that is the absurd." },
    { id: "3", zh: "荒诞诞生于人的呼唤与世界不合理的沉默之间的对峙。",
      en: "The absurd is born between the human call and the world's unreasonable silence." },
    { id: "4", zh: "荒诞既系于人，也系于世界。",
      en: "The absurd depends as much on man as on the world." },
    { id: "5", zh: "诸神判罚西西弗斯把巨石推上山顶，石头又因自身重量滚落。",
      en: "The gods condemned Sisyphus to roll a rock uphill; it fell by its own weight." },
    { id: "6", zh: "西西弗斯是荒诞的英雄：既因他的激情，也因他的磨难。",
      en: "Sisyphus is the absurd hero: as much by his passions as by his torment." },
    { id: "7", zh: "归途与停顿中，西西弗斯令我着迷。贴近石头劳作的脸，已是石头。",
      en: "Sisyphus interests me in the return, the pause: a face so close to stone is stone." },
    { id: "8", zh: "每当他离开山顶，他便高于自己的命运。他比他的巨石更强。",
      en: "Each time he leaves the summit he is superior to his fate, stronger than his rock." },
    { id: "9", zh: "这神话之所以悲壮，是因为它的英雄有意识。",
      en: "If this myth is tragic, it is because its hero is conscious." },
    { id: "10", zh: "没有哪一种命运不能靠蔑视去战胜。",
      en: "There is no fate that cannot be surmounted by scorn." },
    { id: "11", zh: "幸福与荒诞是同一片土地上的两个儿子，不可分离。",
      en: "Happiness and the absurd are two sons of the same earth. They are inseparable." },
    { id: "12", zh: "西西弗斯全部无声的欢乐就在于此：命运属于他，巨石也属于他。",
      en: "All Sisyphus's silent joy is there: his fate belongs to him, his rock is his own." },
    { id: "13", zh: "没有不带阴影的太阳，人必须认识黑夜。",
      en: "There is no sun without shadow, and one must know the night." },
    { id: "14", zh: "荒诞的人说「是」，他的努力从此不会停歇。",
      en: "The absurd man says yes, and his effort will never cease." },
    { id: "15", zh: "向着高处挣扎本身，就足以填满一个人的心。",
      en: "The struggle itself toward the heights is enough to fill a man's heart." },
    { id: "16", zh: "我们必须想象西西弗斯是幸福的。",
      en: "One must imagine Sisyphus happy." }
  ];
  var byId = {};
  QUOTES.forEach(function (q) { byId[q.id] = q; });

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function allIds() {
    return QUOTES.map(function (q) { return q.id; });
  }

  /* The first summit is always the last line; after that a shuffled deck, no immediate repeat. */
  function next(state) {
    if (state.summits === 0) {
      state.lastQuote = "16";
      return byId["16"];
    }
    if (!state.deck || !state.deck.length) state.deck = shuffle(allIds());
    var id = state.deck.shift();
    if (id === state.lastQuote && state.deck.length) {
      var swap = state.deck[0];
      state.deck[0] = id;
      id = swap;
    }
    state.lastQuote = id;
    return byId[id];
  }

  function noteText(q, n) {
    var d = new Date();
    var date = d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
    return date + " · 第 " + n + " 次登顶\n\n"
      + "「" + q.zh + "」\n"
      + "\"" + q.en + "\"\n\n"
      + "—— 加缪《西西弗斯神话》";
  }

  function seenList(state) {
    var out = [];
    (state.seen || []).forEach(function (id) { if (byId[id]) out.push(byId[id]); });
    return out;
  }

  return { QUOTES: QUOTES, byId: byId, next: next, noteText: noteText, seenList: seenList };
})();

<script data-src="src/world.js">
/* Sisyphus: the mountain, the path and the camera. All numbers are internal pixels. */
var WORLD = (function () {
  var W = 160, H = 178;
  var SUMMIT_X = 900, BASE_Y = 330, SUMMIT_Y = 78;
  var FAR_END = 1080, WORLD_W = 1120;
  var WEATHERS = ["clear", "wind", "rain"];

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* The long ledge: a smooth climb, a little uneven, steep at the top. */
  function pathY(x) {
    var t = clamp(x / SUMMIT_X, 0, 1);
    var e = t * t * (3 - 2 * t);
    return BASE_Y - (BASE_Y - SUMMIT_Y) * e + Math.sin(t * Math.PI) * 3;
  }

  /* The other side: steep, short, and then the dark. */
  function farPathY(x) {
    var t = clamp((x - SUMMIT_X) / (FAR_END - SUMMIT_X), 0, 1);
    return SUMMIT_Y + 300 * t * t;
  }

  function pathX(p) { return 40 + clamp(p, 0, 1) * (SUMMIT_X - 40); }

  function makeCamera() { return { x: 0, y: BASE_Y - 110 }; }

  function follow(cam, tx, ty, dt, snap) {
    var gx = clamp(tx - 54, 0, WORLD_W - W);
    var gy = clamp(ty - 106, -46, 300);
    if (snap) { cam.x = gx; cam.y = gy; return; }
    var k = Math.min(1, dt * 5);
    cam.x += (gx - cam.x) * k;
    cam.y += (gy - cam.y) * k;
  }

  function pickWeather() {
    return WEATHERS[Math.floor(Math.random() * WEATHERS.length)];
  }

  return {
    W: W, H: H, SUMMIT_X: SUMMIT_X, BASE_Y: BASE_Y, SUMMIT_Y: SUMMIT_Y,
    FAR_END: FAR_END, WORLD_W: WORLD_W, WEATHERS: WEATHERS,
    clamp: clamp, pathY: pathY, farPathY: farPathY, pathX: pathX,
    makeCamera: makeCamera, follow: follow, pickWeather: pickWeather
  };
})();
</script>

    12, 44, 4, 36, 14, 46, 6, 38, 60, 28, 52, 20, 62, 30, 54, 22,
    3, 35, 11, 43, 1, 33, 9, 41, 51, 19, 59, 27, 49, 17, 57, 25,
    15, 47, 7, 39, 13, 45, 5, 37, 63, 31, 55, 23, 61, 29, 53, 21
  ];

  function bayer(x, y) { return (BAYER[(y & 7) * 8 + (x & 7)] + 0.5) / 64; }
  function tone(v, x, y) {
    var t = Math.floor(v + bayer(x, y));
    return t < 0 ? 0 : (t > 3 ? 3 : t);
  }
  function px(g, x, y, v) {
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    g.pixel(x, y, tone(v, x, y));
  }
  function disc(g, cx, cy, r, v) {
    for (var y = -r; y <= r; y++) for (var x = -r; x <= r; x++) {
      if (x * x + y * y <= r * r) px(g, cx + x, cy + y, v);
    }
  }
  function ring(g, cx, cy, r0, r1, v) {
    for (var y = -r1; y <= r1; y++) for (var x = -r1; x <= r1; x++) {
      var d = x * x + y * y;
      if (d >= r0 * r0 && d <= r1 * r1) px(g, cx + x, cy + y, v);
    }
  }
  function line2(g, x0, y0, x1, y1, v) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    var dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, e = dx + dy;
    for (;;) {
      px(g, x0, y0, v);
      if (x0 === x1 && y0 === y1) break;
      var e2 = 2 * e;
      if (e2 >= dy) { e += dy; x0 += sx; }
      if (e2 <= dx) { e += dx; y0 += sy; }
    }
  }

  /* ---------------- sky ---------------- */
  function sky(g, s) {
    var night = s.mode === "descent";
    var day = night ? 1 : s.p;
    var wet = s.weather === "rain";
    var topV = night ? 0.12 : 3.08 - 2.25 * day - (wet ? 0.28 : 0);
    var horV = night ? 0.92 : 1.85 + 1.15 * Math.sin(day * Math.PI) - (wet ? 0.30 : 0);
    var horizon = 116;
    for (var y = 0; y < H; y++) {
      var v = y < horizon ? topV + (horV - topV) * (y / horizon) : horV;
      for (var x = 0; x < W; x++) px(g, x, y, v);
    }

    var sx = night ? 119 : 124 - 24 * day;
    var sy = night ? 42 : 49 + 37 * day;
    var sr = night ? 8 : 9 - 2 * day;
    if (!wet || night) {
      ring(g, sx, sy, sr + 1, sr + 5, night ? 0.9 : 2.25);
      disc(g, sx, sy, sr, 3);
    }
    if (night) {
      /* a crescent: one dark disc over the paper one */
      for (var yy = -sr; yy <= sr; yy++) for (var xx = -sr; xx <= sr; xx++) {
        var dd = xx * xx + yy * yy;
        if (dd <= (sr - 1) * (sr - 1) && (xx + sr) * (xx + sr) + (yy + 2) * (yy + 2) <= sr * sr) px(g, sx + xx, sy + yy, 0.85);
      }
    }

    /* stars only when the sky is dark enough */
    if (night || day > 0.9) {
      for (var i = 0; i < 34; i++) {
        var stx = (i * 37 + 11) % 154 + 3;
        var sty = (i * 23 + 5) % 76 + 3;
        var dx0 = stx - sx, dy0 = sty - sy;
        if (dx0 * dx0 + dy0 * dy0 < (sr + 8) * (sr + 8)) continue;
        if (Math.sin(s.time * 1.7 + i * 2.3) > -0.72) px(g, stx, sty, i % 5 === 0 ? 3 : 2.4);
      }
    }

    /* slow cloud bands; rain and wind change the pace */
    var wind = s.weather === "wind" ? 2.2 : 1;
    for (var c = 0; c < 3; c++) {
      var cy = 58 + c * 15;
      var off = (s.time * (4 + c) * wind + c * 57) % 240 - 40;
      for (var x2 = 0; x2 < W; x2++) {
        var u = (x2 + off) / 240;
        var band = Math.sin(u * 6.283 * 2 + c) * 0.5 + 0.5;
        if (band > 0.72) {
          var vv = night ? 0.55 : 2.45;
          px(g, x2, cy + Math.sin(x2 * 0.05 + c) * 1.2, vv);
          px(g, x2, cy + 1 + Math.sin(x2 * 0.05 + c) * 1.2, vv - 0.5);
        }
      }
    }

    if (s.weather === "rain") {
      for (var r = 0; r < 68; r++) {
        var rx = (r * 41 + s.time * 31) % 174 - 7;
        var ry = (r * 59 + s.time * 83) % 178;
        line2(g, rx, ry, rx - 1, ry + 3, night ? 2.1 : 1.25);
      }
    }

    if (!night && s.weather !== "rain" && day < 0.82) {
      for (var b = 0; b < 3; b++) {
        var bx = (22 + b * 9 + s.time * 1.6) % (W + 20) - 10;
        var by = 39 + b * 4;
        px(g, bx, by, 1.2); px(g, bx + 1, by - 1, 1.2); px(g, bx + 2, by, 1.2);
      }
    }
  }

  /* ---------------- distant ridges ---------------- */
  function ridges(g, s) {
    var night = s.mode === "descent";
    for (var layer = 0; layer < 2; layer++) {
      var base = 92 + layer * 16 - (s.cam.y - 180) * 0.035;
      var par = s.cam.x * (0.10 + layer * 0.07);
      var v = night ? (layer ? 0.18 : 0.42) : (layer ? 0.95 : 1.65);
      for (var x = 0; x < W; x++) {
        var wx = x + par;
        var yy = base + Math.sin(wx * 0.026 + layer * 2.1) * (5 + layer * 2)
          + Math.sin(wx * 0.071 + layer) * (2.5 + layer);
        var top = Math.round(yy);
        for (var y = top; y < H; y++) px(g, x, y, v - (y - top) * 0.002);
      }
    }
  }

  /* ---------------- cloud sea ---------------- */
  function cloudSea(g, s) {
    var night = s.mode === "descent";
    for (var i = 0; i < 4; i++) {
      var cx = (i * 59 + s.time * 2.5) % 210 - 30;
      var cy = 124 + (i * 7) % 11;
      var w = 26 + (i % 2) * 12;
      for (var x = -w; x <= w; x++) {
        var edge = Math.sin((x / w) * 1.5708);
        var h = Math.max(1, Math.round(edge * 3));
        for (var y = -h; y <= 1; y++) px(g, cx + x, cy + y, night ? 0.75 : 2.35);
      }
    }
  }

  /* ---------------- the mountain and its ledge ---------------- */
  function terrain(g, s) {
    var cam = s.cam;
    var night = s.mode === "descent";
    var summitScreen = WORLD.SUMMIT_X - cam.x;

    for (var x = 0; x < W; x++) {
      var wx = cam.x + x;
      if (wx <= WORLD.SUMMIT_X) {
        var py = WORLD.pathY(wx) - cam.y;

        /* ledge: a pale top edge, a dark underside */
        px(g, x, py - 1, night ? 2.0 : 3.0);
        px(g, x, py, 2.0);
        px(g, x, py + 1, 2.0);
        px(g, x, py + 2, 1.1);
        px(g, x, py + 3, 0.15);

        /* cliff below the ledge */
        var top = Math.max(py + 4, 0);
        for (var y = top; y < H; y++) {
          var d = (y - top) / Math.max(1, H - top);
          var v = night ? 0.72 - d * 0.68 : 1.38 - d * 1.30;
          v += Math.sin(wx * 0.031 + y * 0.14) * 0.055;
          /* large diagonal facets, then the horizontal strata, then the deep cracks */
          var facet = (wx * 0.55 + (y - top) * 1.35) / 46;
          v += ((Math.floor(facet) % 3) - 1) * 0.11;
          if ((facet - Math.floor(facet)) * 46 < 1.4) v -= 0.30;
          if ((y + Math.floor(Math.sin(wx * 0.041) * 4)) % 22 === 0) v -= 0.42;
          if (crack(wx, y)) v = 0.02;
          px(g, x, y, v);
        }
      } else {
        /* the other side: one narrow lit rim, then the far slope in the crest's
           shadow, then the cloud sea lower down. The first pixels after the
           summit borrow the near cliff's value, so the two faces meet on the
           ridge instead of at a vertical seam. */
        var fy = WORLD.farPathY(wx) - cam.y;
        var mix = Math.min(1, (wx - WORLD.SUMMIT_X) / 16);
        var top0 = Math.max(fy + 4, 0);
        var nearD = 1 / Math.max(1, H - top0);
        var rim = Math.max(0, Math.min(H, fy + 2));
        var foot = Math.max(0, Math.min(H, fy + 26));
        for (var y2 = Math.max(0, fy - 1); y2 < H; y2++) {
          var v2;
          if (y2 < rim) {
            /* the last light on the crest: at most three pixels */
            v2 = y2 < fy + 1 ? (night ? 2.0 : 2.9) : (night ? 1.3 : 1.9);
          } else if (y2 < foot) {
            /* the far slope is in shadow, not a second lit wall */
            var fd = (y2 - rim) / Math.max(1, foot - rim);
            v2 = night ? 0.92 - fd * 0.14 : 1.46 - fd * 0.10;
          } else {
            /* the cloud sea sits lower and stays close to mid */
            var d3 = (y2 - foot) / Math.max(1, H - foot);
            v2 = night ? 0.82 - d3 * 0.22 : 2.02 - d3 * 0.34;
            v2 += Math.sin(wx * 0.05 + y2 * 0.19) * 0.14;
          }
          if (y2 >= rim && mix < 1) {
            var d0 = Math.max(0, y2 - top0) * nearD;
            var near = night ? 0.72 - d0 * 0.68 : 1.38 - d0 * 1.30;
            v2 = near + (v2 - near) * mix;
          }
          if (y2 >= rim && (y2 + Math.floor(Math.sin(wx * 0.05) * 3)) % 9 === 0) v2 -= 0.28;
          px(g, x, y2, v2);
        }
      }
    }

    /* the crest ends in a small lip; a cairn says someone was here before */
    var su = Math.round(summitScreen);
    if (su > -6 && su < W + 6) {
      for (var i2 = 0; i2 < 4; i2++) {
        px(g, su - 10 + i2, (WORLD.SUMMIT_Y - cam.y) - 2 - i2, 2.2);
        px(g, su - 11 + i2, (WORLD.SUMMIT_Y - cam.y) - 1 - i2, 0.2);
      }
    }

    /* grass tufts, sparse; the mountain is stone, not a meadow */
    for (var i = 0; i < 18; i++) {
      var tx = (i * 53 + 17) % (WORLD.SUMMIT_X - 20) + 10;
      if (tx < cam.x - 6 || tx > cam.x + W + 6) continue;
      var ty = WORLD.pathY(tx) - cam.y;
      if (ty < -4 || ty > H) continue;
      var sx = Math.round(tx - cam.x);
      px(g, sx, ty - 3, 0.3); px(g, sx - 1, ty - 5, 0.3); px(g, sx + 1, ty - 4, 0.3);
    }

    /* loose scree at the foot of the cliff */
    for (var k = 0; k < 46; k++) {
      var pxW = (k * 67 + 31) % WORLD.SUMMIT_X;
      if (pxW < cam.x - 2 || pxW > cam.x + W + 2) continue;
      var pyW = WORLD.pathY(pxW) + 10 + (k * 17) % 40;
      px(g, pxW - cam.x, pyW - cam.y, k % 3 === 0 ? 2.2 : 0.8);
    }
  }

  function crack(wx, y) {
    var cs = [86, 214, 347, 512, 688, 804];
    for (var i = 0; i < cs.length; i++) {
      var c = cs[i] + Math.sin(y * 0.07 + i) * 3;
      if (Math.abs(wx - c) < 1.1) return true;
    }
    return false;
  }

  /* ---------------- boulder ---------------- */
  function boulder(g, cx, cy, r, angle, night) {
    /* contact shadow on the ledge */
    line2(g, cx - r + 2, cy + r - 1, cx + r - 2, cy + r - 1, 0.1);
    var reach = r + 3;
    for (var y = -reach; y <= reach; y++) for (var x = -reach; x <= reach; x++) {
      var d = Math.sqrt(x * x + y * y);
      var theta = Math.atan2(y, x) - angle;
      /* a lumpy outline: an off-centre body, three harmonics and two chipped corners */
      var rr = r * (0.91 + 0.115 * Math.sin(theta * 3 + 0.8)
        + 0.070 * Math.sin(theta * 5 - 1.2)
        + 0.045 * Math.sin(theta * 7 + 2.1)
        + 0.050 * Math.sin(theta * 2 - 0.4));
      var chip = Math.atan2(Math.sin(theta - 2.25), Math.cos(theta - 2.25));
      if (Math.abs(chip) < 0.40) rr -= r * 0.20 * (1 - Math.abs(chip) / 0.40);
      var chip2 = Math.atan2(Math.sin(theta + 2.55), Math.cos(theta + 2.55));
      if (Math.abs(chip2) < 0.28) rr -= r * 0.12 * (1 - Math.abs(chip2) / 0.28);
      if (d > rr) continue;
      var sh = (x * 0.62 - y * 0.78) / r;
      var v = 1.08 + sh * 0.95;
      if (d > rr - 1.25) v = 0.06;
      if (d > rr - 1.3 && sh > 0.30) v = 2.9;
      if (sh > 0.48 && bayer(cx + x, cy + y) < 0.52) v = 3;
      px(g, cx + x, cy + y, night ? v - 0.35 : v);
    }

    var ca = Math.cos(angle), sa = Math.sin(angle);
    var cracks = [
      [[-0.62, -0.18], [-0.18, 0.10], [0.28, 0.02]],
      [[-0.16, -0.66], [0.10, -0.22], [0.22, 0.36]],
      [[0.08, 0.52], [-0.24, 0.30], [-0.54, 0.42]]
    ];
    for (var c = 0; c < cracks.length; c++) {
      var pts = cracks[c];
      for (var p = 1; p < pts.length; p++) {
        var ax = pts[p - 1][0] * r, ay = pts[p - 1][1] * r;
        var bx = pts[p][0] * r, by = pts[p][1] * r;
        for (var t = 0; t <= 1; t += 0.12) {
          var lx = ax + (bx - ax) * t, ly = ay + (by - ay) * t;
          px(g, cx + lx * ca - ly * sa, cy + lx * sa + ly * ca, 0.05);
        }
      }
    }
  }

  /* ---------------- Sisyphus ---------------- */
  function sisyphus(g, sx, sy, pose, phase, bx, by, br, night) {
    var pushing = pose === "push" || pose === "strain";
    var lean = pushing ? 2 : (pose === "slip" ? -1 : 0);
    var crouch = pose === "strain" ? 1 : 0;
    var look = pose === "look" ? 1 : 0;
    var hx = sx + lean;
    var hy = sy - 16 + crouch - look;
    var shoulderY = sy - 12 + crouch;
    var hipY = sy - 4;
    var ink = 0, rim = night ? 2.7 : 2.2, hi = 3;
    var step = Math.sin(phase);

    line2(g, sx - 3, sy - 1, sx + 3, sy - 1, 0.1);

    /* the far arm goes behind the torso, so the pushing pose has depth instead of a belly */
    if (pushing) {
      line2(g, hx - 1, shoulderY + 1, sx - 2, shoulderY + 4, ink);
      line2(g, sx - 2, shoulderY + 4, bx - br + 2, by + 1, ink);
    }

    /* legs: while pushing they shuffle, one foot forward and one back */
    if (pose === "slip") {
      line2(g, sx - 1, hipY, sx - 5, sy, ink); line2(g, sx + 1, hipY, sx + 5, sy, ink);
      line2(g, sx - 6, sy, sx - 4, sy, ink); line2(g, sx + 4, sy, sx + 6, sy, ink);
    } else if (pose === "walk") {
      var sw = Math.sin(phase) * 3;
      line2(g, sx - 1, hipY, sx - sw, sy - (sw > 0 ? 1 : 0), ink);
      line2(g, sx + 1, hipY, sx + sw, sy - (sw < 0 ? 1 : 0), ink);
      line2(g, sx - sw - 1, sy - (sw > 0 ? 1 : 0), sx - sw + 1, sy - (sw > 0 ? 1 : 0), ink);
      line2(g, sx + sw - 1, sy - (sw < 0 ? 1 : 0), sx + sw + 1, sy - (sw < 0 ? 1 : 0), ink);
    } else if (pushing) {
      var stride = step * 2.2;
      var lfx = sx - 2 - stride, rfx = sx + 2 + stride;
      var lfy = sy - (step > 0.30 ? 1 : 0);
      var rfy = sy - (step < -0.30 ? 1 : 0);
      line2(g, sx - 1, hipY, lfx, lfy, ink);
      line2(g, sx + 1, hipY, rfx, rfy, ink);
      line2(g, lfx - 1, lfy, lfx + 1, lfy, ink);
      line2(g, rfx - 1, rfy, rfx + 1, rfy, ink);
      px(g, (sx - 1 + lfx) / 2, (hipY + lfy) / 2, rim);
    } else {
      var stance = pose === "stand" ? 2 : 1;
      line2(g, sx - 1, hipY, sx - stance, sy, ink); line2(g, sx + 1, hipY, sx + stance, sy, ink);
      line2(g, sx - stance - 1, sy, sx - stance + 1, sy, ink);
      line2(g, sx + stance - 1, sy, sx + stance + 1, sy, ink);
    }

    /* torso: wide shoulders, a narrow waist; not a barrel */
    for (var i = 0; i < 8; i++) {
      var t = i / 7;
      var cx = sx + lean * (1 - t);
      var w = i < 2 ? 2 : 1;
      var yy = sy - 12 + crouch + i;
      g.rect(cx - w, yy, w * 2 + 1, 1, ink);
      px(g, cx - w - 1, yy, rim);
      if (i === 0) px(g, cx - w, yy, hi);
    }
    g.rect(sx - 1, hipY, 3, 1, ink);

    /* head and neck */
    g.circle(hx, hy, 2, ink, true);
    px(g, hx - 2, hy - 1, rim); px(g, hx - 1, hy - 2, hi);
    if (night) { px(g, hx + 2, hy - 1, rim); px(g, hx + 1, hy + 1, rim); }
    g.rect(hx - 1, hy + 2, 2, 2, ink);

    /* near arm, in front: one clear arm from shoulder to the stone */
    var shoulderY2 = shoulderY + 1;
    if (pushing) {
      var handX = bx - br + 1, handY = by - 2;
      var ex = hx + 3, ey = shoulderY + 3;
      /* two pixels thick, with a lit top edge, so it reads against the dark stone */
      line2(g, hx + 1, shoulderY2, ex, ey, ink);
      line2(g, hx + 1, shoulderY2 + 1, ex, ey + 1, ink);
      line2(g, ex, ey, handX, handY, ink);
      line2(g, ex, ey + 1, handX, handY + 1, ink);
      line2(g, hx + 1, shoulderY2 - 1, ex, ey - 1, rim);
      line2(g, ex, ey - 1, handX, handY - 1, rim);
      px(g, ex, ey - 1, hi); px(g, handX, handY, hi); px(g, handX, handY - 1, hi);
    } else if (pose === "slip") {
      line2(g, hx + 1, shoulderY2, sx + 5, sy - 17, ink);
      line2(g, hx - 1, shoulderY2, sx - 5, sy - 16, ink);
    } else if (pose === "walk") {
      var sw2 = Math.sin(phase) * 3;
      line2(g, hx + 1, shoulderY2, sx + 2 + sw2, sy - 5, ink);
      line2(g, hx - 1, shoulderY2, sx - 2 - sw2, sy - 5, ink);
    } else {
      line2(g, hx + 1, shoulderY2, sx + 3, sy - 4, ink);
      line2(g, hx - 1, shoulderY2, sx - 3, sy - 4, ink);
    }

    /* a little more rim on the back */
    px(g, sx - 2, sy - 9, rim); px(g, sx - 2, sy - 7, rim);
  }

  /* ---------------- dust ---------------- */
  function spawnDust(s, wx, wy, n, power) {
    for (var i = 0; i < n; i++) {
      s.dust.push({
        x: wx + (Math.random() * 2 - 1) * 4,
        y: wy - Math.random() * 3,
        vx: (Math.random() * 2 - 1) * power,
        vy: -Math.random() * power * 0.7,
        life: 0.45 + Math.random() * 0.7,
        max: 1.2
      });
    }
  }

  function updateDust(s, dt) {
    for (var i = s.dust.length - 1; i >= 0; i--) {
      var p = s.dust[i];
      p.life -= dt;
      if (p.life <= 0) { s.dust.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 18 * dt;
    }
  }

  function drawDust(g, s) {
    for (var i = 0; i < s.dust.length; i++) {
      var p = s.dust[i];
      var x = p.x - s.cam.x, y = p.y - s.cam.y;
      if (x > -2 && x < W + 2 && y > -2 && y < H + 2) {
        px(g, x, y, p.life > 0.45 ? 3 : 2.2);
      }
    }
  }

  /* ---------------- the quote card ---------------- */
  function reveal(g, amount) {
    if (amount >= 1) { g.clear(3); return; }
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      if (bayer(x, y) < amount) g.pixel(x, y, 3);
    }
  }

  function card(g, q, left, right, amount, status, hintText) {
    reveal(g, amount);
    if (amount < 0.72) return;
    g.frame(3, 3, 154, 172, 0);
    g.text(left, 12, 10, { color: 1 });
    if (right) g.text(right, 147, 10, { color: 1, align: "right" });
    g.line(12, 27, 147, 27, 1);

    var y = 34;
    var zh = g.wrap(q.zh, 132);
    for (var i = 0; i < zh.length; i++) { g.text(zh[i], 13, y, { color: 0 }); y += g.lineHeight; }
    y += 4;
    var en = g.wrap(q.en, 132);
    for (var j = 0; j < en.length; j++) { g.text(en[j], 13, y, { color: 1 }); y += g.lineHeight; }

    g.line(12, 138, 147, 138, 1);
    g.text("加缪《西西弗斯神话》", 13, 141, { color: 1 });
    var hint = hintText || "A 记下    B 让它过去";
    if (status === "saving") hint = "写入中…";
    else if (status === "saved") hint = "已写入幸福手册";
    else if (status === "denied") hint = "没有写入";
    g.text(hint, 13, 157, { color: 0 });
  }

  function wipe(g, amount, tone) {
    if (amount >= 1) { g.clear(tone); return; }
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      if (x / W > 1 - amount + (bayer(x, y) - 0.5) * 0.055) g.pixel(x, y, tone);
    }
  }

  function drawWorld(g, s) {
    sky(g, s);
    ridges(g, s);
    cloudSea(g, s);
    terrain(g, s);

    var bsx = s.boulderX - s.cam.x, bsy = s.boulderY - s.cam.y;
    var psx = s.playerX - s.cam.x, psy = s.playerY - s.cam.y;
    var night = s.mode === "descent";

    boulder(g, bsx, bsy, s.boulderR, s.boulderAngle, night);
    sisyphus(g, psx, psy, s.pose, s.walkPhase, bsx, bsy, s.boulderR, night);
    drawDust(g, s);
  }

  return {
    W: W, H: H, tone: tone, px: px, disc: disc, line2: line2,
    sky: sky, ridges: ridges, cloudSea: cloudSea, terrain: terrain,
    boulder: boulder, sisyphus: sisyphus, spawnDust: spawnDust, updateDust: updateDust, drawDust: drawDust,
    reveal: reveal, card: card, wipe: wipe, drawWorld: drawWorld
  };
})();
</script>
<script data-src="src/sfx.js">
/* Sisyphus: synthesized sounds. No samples: the runtime's chip follows the player's volume,
   the silent switch and the app's lifecycle. (A recorded sample can replace these later,
   once PAD.sample exists; see drafts/sisyphus/RESEARCH.md.) */
var SFX = (function () {
  function rnd(a, b) { return a + Math.random() * (b - a); }

  function heave(game, hard) {
    game.sfx({
      wave: "square", duty: 1, from: hard ? 118 : 148, to: hard ? 76 : 94,
      ms: hard ? 430 : 320, attack: 30, decay: hard ? 380 : 280,
      vol: hard ? 0.34 : 0.28,
      vibrato: { depth: hard ? 1.5 : 1.05, rate: rnd(4.8, 6.2) }
    });
    game.sfx({ wave: "noise", from: rnd(700, 900), to: 280, ms: 190, attack: 20, decay: 170, vol: 0.09 });
  }

  function breath(game) {
    game.sfx({ wave: "noise", from: rnd(620, 860), to: 260, ms: rnd(160, 230), attack: 18, decay: 180, vol: 0.065 });
  }

  function step(game) {
    game.sfx({ wave: "noise", from: rnd(1100, 1500), to: 520, ms: 55, attack: 2, decay: 50, vol: 0.055 });
  }

  function scrape(game) {
    game.sfx({ wave: "noise", from: 170, to: 58, ms: 420, attack: 10, decay: 400, vol: 0.12 });
  }

  function slip(game) {
    game.sfx({ wave: "noise", from: 1250, to: 320, ms: 120, attack: 2, decay: 110, vol: 0.10 });
  }

  function rumble(game) {
    game.sfx({ wave: "noise", from: 92, to: 24, ms: 1400, attack: 20, decay: 1360, vol: 0.34 });
    game.sfx({ wave: "square", duty: 2, from: 54, to: 30, ms: 1150, attack: 30, decay: 1100, vol: 0.14 });
  }

  function gong(game) {
    game.sfx({ wave: "noise", from: 270, to: 38, ms: 1400, attack: 8, decay: 1380, vol: 0.28 });
    game.sfx({ wave: "triangle", from: 94, to: 58, ms: 1000, attack: 5, decay: 980, vol: 0.20 });
  }

  function chime(game) {
    game.sfx({ wave: "triangle", from: 880, to: 660, ms: 520, attack: 4, decay: 500, vol: 0.10 });
  }

  function click(game) { game.sfx("tap"); }
  function move(game) { game.sfx("move"); }
  function denied(game) { game.sfx("err"); }

  return { heave: heave, breath: breath, step: step, scrape: scrape, slip: slip,
    rumble: rumble, gong: gong, chime: chime, click: click, move: move, denied: denied };
})();
</script>
<script data-src="src/music.js">

   the descent is the same motif heard backwards. MML is described in SPEC.md 6.3. */
var MUSIC = {
  /* 60 bpm, about 55 s: a low drone, a slow call, a stone heartbeat. */
  ascent1: { bpm: 60,
    p1: "@1 v8 o4 l2 d2 a2 f2 e2 d2 r2 | d2 f2 a2 g2 f2 e2 d2 r2 | f2 e2 d2 c2 d2 e2 f2 r2 | d4 r2 a2 g2 f2 e2",

    tri: "v10 o2 l2 d2 a2 g2 d2 | c2 g2 d2 a2 | b-2 f2 c2 g2 | d2 a2 d2 r2",
    noise: "l4 v2 x r v1 x r v2 x r v1 x r | v2 x r v1 x r v3 X4 r r | v2 x r v1 x r v2 x r v1 x r | v3 X4 r v2 x r v1 x r"
  },

  /* 66 bpm, about 29 s: the same mountain, closer, with a pulse. */
  ascent2: { bpm: 66,

    p2: "@0 v5 o3 l8 [d f a >d< a f d f]4 | [g b d >g< d b g b]4 | [c e g >c< g e c e]4 | [d f a >d< a f d f]4",
    tri: "v11 o2 l4 d2 a2 | b-2 f2 | c2 g2 | d2 a2 | d2 a2 | b-2 f2 | c2 g2 | d2 r2",
    noise: "l8 v4 x r v2 x x v3 X4 v2 x r | v4 x r v2 x x v3 X4 v2 x r | v4 x r v2 x x v3 X4 v2 x r | v4 X4 r r v2 x r v3 X4 | v4 x r v2 x x v3 X4 v2 x r | v4 x r v2 x x v3 X4 v2 x r | v4 x r v2 x x v3 X4 v2 x r | v5 X2 r2"
  },

  /* 52 bpm, about 32 s: the ascent motif in reverse, in Aeolian. The night walk. */
  descent: { bpm: 52,
    p1: "@2 v7 o4 l2 d2 e2 f2 a2 d2 r2 | c2 b-2 a2 g2 f2 e2 d2 r2",
    p2: "@0 v4 o3 l4 a2 f2 d2 a2 | g2 e2 c2 e2",

<script data-src="src/main.js">
/* Sisyphus: the game. Lo-PDA / lopda/1, lo-game.js 1.4.0.
   Sound is synthesized (PAD.sfx / PAD.music / PAD.ambience) so it follows the handheld's
   volume and silent switch. A recorded sample can replace the heave later, when PAD.sample
   exists: see drafts/sisyphus/RESEARCH.md and drafts/sisyphus/ART-PROMPT.md. */
var game = LoGame.create({ width: 160, height: 178, lang: "zh" });
var T = game.t;
document.documentElement.lang = game.lang === "zh" ? "zh-CN" : "en";

/* START is the handheld's menu key. The runtime sends it as a press; handling it here
   keeps it working from every scene that has a menu, and never from the title or a quote. */
if (PAD && PAD.on) {
  PAD.on("press", function (b) {
    if (b !== "start" || !S.loaded || S.menuOpen) return;
    if (S.mode === "climb" || S.mode === "descent") openMenu();
  });
}

var S = {
  loaded: false,
  mode: "title",
  p: 0,
  idle: 0,
  summits: 0,
  seen: [],
  deck: [],
  lastQuote: null,
  weather: "clear",
  cam: WORLD.makeCamera(),
  playerX: 0, playerY: WORLD.BASE_Y,
  boulderX: 18, boulderY: WORLD.BASE_Y - 10, boulderR: 11, boulderAngle: 0,
  pose: "stand", walkPhase: 0, dust: [], time: 0,
  quote: null, quoteN: 1, quoteStatus: null, quoteReveal: 0, quoteT: 0,
  quoteOpened: false, quoteSaving: false, doneT: 0,
  summitT: 0, gong: false,
  fallT: 0, fallX: WORLD.SUMMIT_X,
  rollT: 0, rollFrom: 0,
  lock: 0, phase: 1,
  heaveT: 0, breathT: 0, stepT: 0, slipT: 0, wasPush: false,
  descentT: 0, epi: 0, endT: 0, descendPhase: "far", farX: WORLD.SUMMIT_X, wipe: 0, baseT: 0,
  menuIndex: 0, menuOpen: false,
  galleryList: [], galleryIndex: 0, galleryStatus: null, gallerySaving: false, galleryDone: 0,
  loadingNote: null
};

/* ---------------- storage ---------------- */
function saveState() {
  game.save("sisyphus", {
    summits: S.summits,
    seen: S.seen,
    deck: S.deck,
    lastQuote: S.lastQuote
  });
}

game.load("sisyphus").then(function (v) {
  if (v && typeof v === "object") {
    S.summits = Math.max(0, v.summits | 0);
    S.seen = Array.isArray(v.seen) ? v.seen.filter(function (id) { return !!QS.byId[id]; }) : [];
    S.deck = Array.isArray(v.deck) ? v.deck.filter(function (id) { return !!QS.byId[id]; }) : [];
    S.lastQuote = QS.byId[v.lastQuote] ? v.lastQuote : null;
  }
  S.loaded = true;
}).catch(function () { S.loaded = true; });

/* ---------------- positions and camera ---------------- */
function updatePositions() {
  S.playerX = WORLD.pathX(S.p);
  S.playerY = WORLD.pathY(S.playerX);
  var bp = Math.min(1, S.p + 0.022);
  S.boulderX = WORLD.pathX(bp);
  S.boulderY = WORLD.pathY(S.boulderX) - S.boulderR + 1;
}

function updateDescentPositions() {
  S.playerX = WORLD.pathX(S.p);
  S.playerY = WORLD.pathY(S.playerX);
  S.boulderX = WORLD.pathX(0.02);
  S.boulderY = WORLD.pathY(S.boulderX) - S.boulderR + 1;
}

function resetRun(newLoop) {
  S.p = 0; S.idle = 0; S.rollT = 0; S.rollFrom = 0;
  S.quote = null; S.quoteStatus = null; S.quoteReveal = 0; S.quoteT = 0;
  S.quoteOpened = false; S.quoteSaving = false; S.doneT = 0;
  S.summitT = 0; S.gong = false; S.fallT = 0;
  S.descentT = 0; S.epi = 0; S.endT = 0; S.descendPhase = "far"; S.farX = WORLD.SUMMIT_X; S.wipe = 0; S.baseT = 0;
  S.heaveT = 0; S.breathT = 0; S.stepT = 0; S.slipT = 0;
  S.wasPush = false; S.lock = 0.28; S.phase = 1;
  S.dust = [];
  S.walkPhase = 0;
  S.boulderAngle = 0;
  if (newLoop || !S.weather) S.weather = WORLD.pickWeather();
  updatePositions();
  S.pose = "stand";
  S.cam = WORLD.makeCamera();
  WORLD.follow(S.cam, S.playerX, S.playerY, 1, true);
}

/* ---------------- ambience ---------------- */
function setAmbience(level) {
  var name = S.weather === "rain" ? "rain" : "wind";
  game.ambience(name, level == null ? 0.28 : level);
}

/* ---------------- notes ---------------- */
function appendNote(q, n, done) {
  if (!PAD.notes || !PAD.notes.append) { done("denied"); return; }
  try {
    var p = PAD.notes.append("幸福手册", QS.noteText(q, n));
    if (p && p.then) {
      p.then(function (r) { done(r === "saved" ? "saved" : "denied"); })
        .catch(function () { done("denied"); });
    } else done("denied");
  } catch (e) { done("denied"); }
}

/* ---------------- title ---------------- */
game.scene("title", {
  enter: function () {
    S.mode = "title";
    resetRun(false);
    S.pose = "look";
    setAmbience(0.18);
  },
  update: function () {
    S.time = game.time;
    if (game.pressed("start")) { game.say(aboutPages(), { name: T({ zh: "关于", en: "About" }) }); return; }
    if (!S.loaded) return;
    if (game.pressed("a") || game.pointer.pressed) {
      SFX.click(game);
      game.go("climb", { reset: true, newLoop: false });
    }
  },
  draw: function (g) {
    S.time = game.time;
    ART.drawWorld(g, S);
    g.text("西西弗斯", 80, 22, { align: "center", color: 0 });
    g.text("SISYPHUS", 80, 38, { align: "center", color: 1 });
    g.line(58, 54, 102, 54, 1);
    g.rect(8, 118, 144, 52, 3);
    g.frame(8, 118, 144, 52, 0);
    g.text(T({ zh: "按住 A / B 或屏幕", en: "HOLD A / B OR SCREEN" }), 80, 125, { align: "center", color: 0 });
    g.text(T({ zh: "把石头推上去", en: "PUSH THE STONE UP" }), 80, 139, { align: "center", color: 1 });
    g.text(S.loaded ? T({ zh: "A / 触摸 开始", en: "A / TAP TO BEGIN" }) : "…", 80, 157, { align: "center", color: 0 });
  }
});

/* ---------------- climb ---------------- */
game.scene("climb", {
  enter: function (args) {
    if (args && args.reset) resetRun(!!args.newLoop);
    S.mode = "climb";
    S.phase = 1;
    S.pose = "stand";
    S.quoteOpened = false;
    S.wasPush = false;
    game.music(MUSIC.ascent1);
    setAmbience(0.22);
  },
  update: function (dt) {
    S.time = game.time;
    if (S.lock > 0) S.lock -= dt;

    var pushing = (game.btn("a") || game.btn("b") || game.pointer.down) && S.lock <= 0;
    if (!S.wasPush && pushing) {
      S.heaveT = 0.06; S.stepT = 0.25; S.idle = 0;
    }
    S.wasPush = pushing;

    if (pushing) {
      S.idle = 0;
      var speed = 0.0175 * (1 - 0.30 * S.p);
      S.p += speed * dt;
      S.boulderAngle += speed * dt * 31;
      S.walkPhase += dt * 6.2;
      S.pose = Math.sin(S.time * 3.2) > 0.72 ? "strain" : "push";

      S.heaveT -= dt;
      if (S.heaveT <= 0) {
        SFX.heave(game, S.p < 0.08);
        ART.spawnDust(S, S.boulderX - S.boulderR + 2, S.boulderY + S.boulderR - 2, 3, 8);
        game.shake(1, 0.07);
        S.heaveT = 2.7 + Math.random() * 2.2;
      }
      S.breathT -= dt;
      if (S.breathT <= 0) { SFX.breath(game); S.breathT = 1.5 + Math.random() * 1.1; }
      S.stepT -= dt;
      if (S.stepT <= 0) {
        SFX.step(game);
        ART.spawnDust(S, S.playerX, S.playerY - 1, 1, 3);
        S.stepT = 0.62 + Math.random() * 0.18;
      }
    } else {
      S.idle += dt;
      if (S.idle > 0.95 && S.p > 0) {
        var slide = 0.0024 + Math.max(0, S.idle - 0.95) * 0.0022;
        S.p -= slide * dt;
        S.boulderAngle -= slide * dt * 31;
        S.pose = S.idle > 1.55 ? "slip" : "strain";
        if (S.idle > 1.9) {
          S.slipT -= dt;
          if (S.slipT <= 0) {
            SFX.slip(game);
            ART.spawnDust(S, S.boulderX - S.boulderR + 2, S.boulderY + S.boulderR - 2, 2, 5);
            S.slipT = 0.54;
          }
        }
      } else {
        S.pose = "stand";
      }
      if (S.p <= 0) { S.p = 0; S.pose = "stand"; }
      else if (S.idle > 8.5) { startRollback(); return; }
    }

    if (S.p >= 0.972) { startSummit(); return; }
    if (S.p < 0) S.p = 0;
    if (S.p > 0.98) S.p = 0.98;
    updatePositions();
    WORLD.follow(S.cam, S.playerX, S.playerY, dt);
    ART.updateDust(S, dt);

    if (S.phase === 1 && S.p > 0.55) {
      S.phase = 2;
      game.music(MUSIC.ascent2);
      setAmbience(0.40);
    }
  },
  draw: function (g) {
    S.time = game.time;
    ART.drawWorld(g, S);
  }
});

/* ---------------- rollback ---------------- */
function startRollback() {
  if (S.mode !== "climb") return;
  S.mode = "rollback";
  S.rollT = 0;
  S.rollFrom = S.p;
  S.pose = "slip";
  S.wasPush = false;
  SFX.rumble(game);
  game.musicStop();
  setAmbience(0.45);
  game.shake(2, 0.55);
  game.go("rollback", {}, { fade: false });
}

game.scene("rollback", {
  update: function (dt) {
    S.time = game.time;
    S.rollT += dt;
    S.p = Math.max(0, S.rollFrom - S.rollT * 0.55);
    updatePositions();
    WORLD.follow(S.cam, S.playerX, S.playerY, dt * 3);
    if (S.rollT < 0.8) ART.spawnDust(S, S.boulderX - S.boulderR + 2, S.boulderY + S.boulderR - 2, 1, 6);
    ART.updateDust(S, dt);
    S.pose = "slip";
    if (S.p <= 0 && S.rollT > 1.0) {
      S.mode = "climb";
      S.p = 0;
      S.idle = 0;
      S.phase = 1;
      S.lock = 0.9;
      S.pose = "stand";
      S.wasPush = false;
      updatePositions();
      game.music(MUSIC.ascent1);
      setAmbience(0.22);
      SFX.scrape(game);
      game.go("climb", { reset: false }, { fade: false });
    }
  },
  draw: function (g) {
    S.time = game.time;
    ART.drawWorld(g, S);
  }
});

/* ---------------- summit ---------------- */
function startSummit() {
  S.mode = "summit";
  S.p = 0.98;
  S.summitT = 0;
  S.gong = false;
  S.quoteOpened = false;
  S.pose = "look";
  S.wasPush = false;
  updatePositions();
  S.boulderX = WORLD.SUMMIT_X;
  S.boulderY = WORLD.pathY(S.boulderX) - S.boulderR + 1;
  game.musicStop();
  setAmbience(0.50);
  SFX.scrape(game);
  game.go("summit", {}, { fade: false });
}

game.scene("summit", {
  enter: function () { S.mode = "summit"; },
  update: function (dt) {
    S.time = game.time;
    S.summitT += dt;
    S.boulderAngle = Math.sin(S.summitT * 1.7) * 0.05;
    S.pose = S.summitT < 0.7 ? "look" : "stand";
    WORLD.follow(S.cam, S.boulderX - 6, S.boulderY, dt);
    if (!S.gong && S.summitT > 0.9) { S.gong = true; SFX.gong(game); }
    if (!S.quoteOpened && S.summitT > 1.65) {
      S.quoteOpened = true;
      openQuote();
    }
  },
  draw: function (g) {
    S.time = game.time;
    ART.drawWorld(g, S);
  }
});

function openQuote() {
  var n = S.summits + 1;
  var q = QS.next(S);
  S.summits = n;
  if (S.seen.indexOf(q.id) < 0) S.seen.push(q.id);
  S.quote = q;
  S.quoteN = n;
  saveState();
  game.push("quote", { q: q, n: n }).then(function () { startFall(); });
}

/* ---------------- quote card ---------------- */
game.scene("quote", {
  enter: function (args) {
    S.quote = args.q;
    S.quoteN = args.n;
    S.quoteT = 0;
    S.quoteReveal = 0;
    S.quoteStatus = null;
    S.quoteSaving = false;
    S.doneT = 0;
  },
  update: function (dt) {
    S.time = game.time;
    S.quoteT += dt;
    S.quoteReveal = Math.min(1, S.quoteReveal + dt / 0.5);
    if (S.quoteSaving) return;
    if (S.quoteStatus === "saved" || S.quoteStatus === "denied") {
      S.doneT += dt;
      if (S.doneT > 0.95 || game.pressed("a") || game.pressed("b")) game.pop(S.quoteStatus);
      return;
    }
    if (S.quoteT < 0.72) return;
    if (game.pressed("a")) {
      S.quoteSaving = true;
      S.quoteStatus = "saving";
      appendNote(S.quote, S.quoteN, function (r) {
        S.quoteStatus = r;
        S.quoteSaving = false;
        S.doneT = 0;
        if (r === "saved") SFX.chime(game); else SFX.denied(game);
      });
    } else if (game.pressed("b")) {
      game.pop("skip");
    }
  },
  draw: function (g) {
    S.time = game.time;
    ART.card(g, S.quote, "山顶", "第 " + S.quoteN + " 次", S.quoteReveal, S.quoteStatus, "A 记下    B 让它过去");
  }
});

/* ---------------- the fall and the walk down ---------------- */
function startFall() {
  S.mode = "fall";
  S.fallT = 0;
  S.fallX = WORLD.SUMMIT_X;
  S.pose = "look";
  S.quoteStatus = null;
  SFX.rumble(game);
  game.music(MUSIC.descent);
  setAmbience(0.40);
  game.go("fall", {}, { fade: false });
}

game.scene("fall", {
  update: function (dt) {
    S.time = game.time;
    S.fallT += dt;
    var t = Math.min(1, S.fallT / 1.9);
    var e = 1 - (1 - t) * (1 - t);
    var x = WORLD.SUMMIT_X + 104 * e;
    S.boulderX = x;
    S.boulderY = WORLD.farPathY(x) - S.boulderR + 1;
    S.boulderAngle += dt * 6;
    WORLD.follow(S.cam, WORLD.SUMMIT_X - 18, WORLD.SUMMIT_Y + 22, dt);
    if (S.fallT > 2.2) game.go("descent", {}, { time: 0.35, to: 0 });
  },
  draw: function (g) {
    S.time = game.time;
    ART.drawWorld(g, S);
  }
});

game.scene("descent", {
  enter: function () {
    S.mode = "descent";
    S.descendPhase = "far";
    S.farX = WORLD.SUMMIT_X;
    S.wipe = 0; S.baseT = 0;
    S.p = 1;
    S.descentT = 0; S.epi = 0; S.endT = 0;
    S.pose = "walk"; S.walkPhase = 0; S.wasPush = false;
    S.dust = [];
    S.playerX = S.farX;
    S.playerY = WORLD.farPathY(S.farX);
    S.boulderX = 1040;
    S.boulderY = WORLD.farPathY(S.boulderX) - S.boulderR + 1;
    S.cam = WORLD.makeCamera();
    WORLD.follow(S.cam, S.playerX, S.playerY + 56, 1, true);
    game.music(MUSIC.descent);
    setAmbience(0.35);
  },
  update: function (dt) {
    S.time = game.time;
    S.descentT += dt;

    if (S.descendPhase === "far") {
      /* he follows the stone over the ridge and down the far side */
      S.farX = Math.min(1000, S.farX + dt * 40);
      S.playerX = S.farX;
      S.playerY = WORLD.farPathY(S.farX);
      S.walkPhase += dt * 7;
      S.pose = "walk";
      S.boulderX = 1040;
      S.boulderY = WORLD.farPathY(S.boulderX) - S.boulderR + 1;
      WORLD.follow(S.cam, S.playerX, S.playerY + 56, dt);
      ART.updateDust(S, dt);
      if (S.descentT > 1.3) S.epi = Math.min(1, S.epi + dt / 1.1);
      if (S.farX >= 999.5) {
        S.descendPhase = "cover";
        S.wipe = 0;
        S.epi = 0;
      }
    } else if (S.descendPhase === "cover") {
      /* the camera goes around the mountain: a dither curtain from the far side to ours */
      S.wipe = Math.min(1, S.wipe + dt / 0.55);
      if (S.wipe >= 1) {
        snapToBase();
        S.descendPhase = "reveal";
        S.wipe = 1;
      }
    } else if (S.descendPhase === "reveal") {
      S.wipe = Math.max(0, S.wipe - dt / 0.55);
      if (S.wipe <= 0) { S.descendPhase = "base"; S.baseT = 0; }
    } else {
      S.baseT += dt;
      S.pose = S.baseT > 0.6 ? "look" : "stand";
      if (S.baseT > 2.2) game.go("climb", { reset: true, newLoop: true }, { time: 0.5, to: 3 });
    }
  },
  draw: function (g) {
    S.time = game.time;
    ART.drawWorld(g, S);
    if (S.wipe > 0) ART.wipe(g, S.wipe, 0);
    if (S.descendPhase === "base" && S.baseT > 0.45) {
      g.text("Le rocher l'attend.", 80, 146, { align: "center", color: 3, shadow: 0 });
      g.text("石头在山脚等他。", 80, 160, { align: "center", color: 3, shadow: 0 });
    }
  }
});

function snapToBase() {
  S.p = 0;
  S.playerX = WORLD.pathX(0);
  S.playerY = WORLD.pathY(S.playerX);
  S.boulderX = WORLD.pathX(0.02);
  S.boulderY = WORLD.pathY(S.boulderX) - S.boulderR + 1;
  S.cam = WORLD.makeCamera();
  WORLD.follow(S.cam, S.playerX, S.playerY, 1, true);
  S.pose = "stand";
  S.walkPhase = 0;
  S.epi = 0;
  S.dust = [];
}

/* ---------------- menu and gallery ---------------- */
function openMenu() {
  if (S.mode === "fall" || S.mode === "quote") return;
  SFX.click(game);
  game.push("menu");
}

function menuItems() {
  return [T({ zh: "继续", en: "Resume" }), T({ zh: "语录", en: "Lines" }), T({ zh: "关于", en: "About" })];
}

game.scene("menu", {
  enter: function () { S.menuIndex = 0; S.menuOpen = true; },
  exit: function () { S.menuOpen = false; },
  update: function () {
    S.time = game.time;
    var items = menuItems();
    if (game.pressed("up")) { S.menuIndex = (S.menuIndex + items.length - 1) % items.length; SFX.move(game); }
    if (game.pressed("down")) { S.menuIndex = (S.menuIndex + 1) % items.length; SFX.move(game); }
    if (game.pressed("b")) { SFX.click(game); game.pop(); return; }
    if (game.pressed("a")) {
      SFX.click(game);
      if (S.menuIndex === 0) game.pop();
      else if (S.menuIndex === 1) game.push("gallery");
      else game.say(aboutPages(), { name: T({ zh: "关于", en: "About" }) });
    }
  },
  draw: function (g) {
    S.time = game.time;
    var items = menuItems();
    g.window(10, 46, 140, 88);
    g.text(T({ zh: "暂停", en: "PAUSED" }), 80, 52, { align: "center", color: 1 });
    for (var i = 0; i < items.length; i++) {
      var y = 70 + i * 16;
      if (i === S.menuIndex) {
        g.rect(18, y - 1, 124, 14, 0);
        g.text(items[i], 80, y, { align: "center", color: 3 });
      } else g.text(items[i], 80, y, { align: "center", color: 0 });
    }
    g.text(T({ zh: "↑↓选 A确认 B返回", en: "UP/DN A OK B BACK" }), 80, 120, { align: "center", color: 1 });
  }
});

game.scene("gallery", {
  enter: function () {
    S.galleryList = QS.seenList(S);
    S.galleryIndex = 0;
    S.galleryStatus = null;
    S.gallerySaving = false;
    S.galleryDone = 0;
  },
  update: function (dt) {
    S.time = game.time;
    if (S.gallerySaving) return;
    if (S.galleryStatus === "saved" || S.galleryStatus === "denied") {
      S.galleryDone += dt;
      if (S.galleryDone > 0.8 || game.pressed("a") || game.pressed("b")) {
        S.galleryStatus = null; S.galleryDone = 0;
      }
      return;
    }
    if (!S.galleryList.length) {
      if (game.pressed("b") || game.pressed("start")) { SFX.click(game); game.pop(); }
      return;
    }
    if (game.pressed("up")) { S.galleryIndex = (S.galleryIndex + S.galleryList.length - 1) % S.galleryList.length; SFX.move(game); }
    if (game.pressed("down")) { S.galleryIndex = (S.galleryIndex + 1) % S.galleryList.length; SFX.move(game); }
    if (game.pressed("b")) { SFX.click(game); game.pop(); return; }
    if (game.pressed("a")) {
      SFX.click(game);
      S.gallerySaving = true;
      S.galleryStatus = "saving";
      appendNote(S.galleryList[S.galleryIndex], Math.max(1, S.summits), function (r) {
        S.galleryStatus = r;
        S.gallerySaving = false;
        S.galleryDone = 0;
        if (r === "saved") SFX.chime(game); else SFX.denied(game);
      });
    }
  },
  draw: function (g) {
    S.time = game.time;
    if (!S.galleryList.length) {
      g.clear(3);
      g.frame(3, 3, 154, 172, 0);
      g.text("幸福手册", 12, 10, { color: 1 });
      g.line(12, 27, 147, 27, 1);
      g.text(T({ zh: "还没有语录。", en: "No lines yet." }), 13, 44, { color: 0 });
      g.text(T({ zh: "去山顶。", en: "Go to the summit." }), 13, 60, { color: 1 });
      g.text(T({ zh: "B 返回", en: "B BACK" }), 13, 160, { color: 0 });
      return;
    }
    var q = S.galleryList[S.galleryIndex];
    ART.card(g, q, "幸福手册", (S.galleryIndex + 1) + " / " + S.galleryList.length, 1, S.galleryStatus, "A 写入    B 返回");
  }
});

/* ---------------- about ---------------- */
function aboutPages() {
  return [
    T({ zh: "西西弗斯 / Sisyphus", en: "Sisyphus / 西西弗斯" }),
    T({ zh: "推石上山。它滚下去。再推。", en: "Push the stone. It falls. Push again." }),
    T({ zh: "灵感来自加缪《西西弗斯神话》。中英译文为本作自译。",
      en: "After Albert Camus, Le Mythe de Sisyphe. Translations for this work." }),
    T({ zh: "按住 A / B 或屏幕推石。停太久，石头会滚回去。",
      en: "Hold A / B or the screen. Rest too long and the stone rolls back." }),
    T({ zh: "山顶的语录可以写入记事本「幸福手册」。",
      en: "At the summit, a line can be written into Notes, in 'A Manual of Happiness'." }),
    T({ zh: "没有终点。", en: "There is no end." })
  ];
}

/* The first scene. */
game.start("title");
</script>
