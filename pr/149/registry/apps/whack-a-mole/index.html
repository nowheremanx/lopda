<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>打地鼠</title>
<!-- Lo-PDA example app (lopda/1): pixel sprites on a canvas, touch input, sounds through PAD.sfx,
     zh/en text through PAD.lang. MIT License. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a3ad7e; color: #1f2a14; font-family: monospace; }
  #w { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px; box-sizing: border-box; }
  #hud { display: flex; justify-content: space-between; width: 100%; max-width: 360px; font-size: 15px; font-weight: bold; }
  #hud span { border: 2px solid #1f2a14; background: #7d8a58; padding: 2px 6px; white-space: nowrap; }
  #stage { position: relative; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; border: 3px solid #1f2a14; touch-action: none; }
  #ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: #a3ad7e; border: 3px solid #1f2a14; text-align: center; padding: 12px; box-sizing: border-box; }
  #ov h1 { margin: 0; font-size: 26px; letter-spacing: 3px; }
  #ov p { margin: 0; font-size: 14px; line-height: 1.55; }
  #ov canvas { border: 0; }
  #btns { display: flex; gap: 8px; width: 100%; max-width: 240px; }
  #btns button { flex: 1; min-height: 44px; padding: 8px 6px; font-size: 15px; }
  #bests { font-size: 13px; }
  button { font: inherit; font-weight: bold; min-height: 44px; padding: 8px 20px; background: #1f2a14; color: #a3ad7e; border: 0; box-shadow: 3px 3px 0 #4a5a32; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="w">
  <div id="hud"><span id="sc">分 0</span><span id="cb">连 0</span><span id="tm">60 秒</span><span id="bs">最高 0</span></div>
  <div id="stage">
    <canvas id="c" width="120" height="150"></canvas>
    <div id="ov">
      <canvas id="logo" width="32" height="32"></canvas>
      <h1 id="ot">打地鼠</h1>
      <p id="op"></p>
      <div id="btns"></div>
      <p id="bests"></p>
    </div>
  </div>
</div>
<script>
(function () {
  var INK = "#1f2a14", DARK = "#4a5a32", MID = "#7d8a58", PAPER = "#a3ad7e";
  var TONE = { "0": INK, "1": DARK, "2": MID, "3": PAPER };

  /* two languages: PAD.lang from the runtime; older runtimes have none, so Chinese is the default */
  var LANG = typeof PAD !== "undefined" && PAD.lang === "en" ? "en" : "zh";
  var TXT = {
    zh: { title: "打地鼠", score: "分 {n}", combo: "连 {n}", time: "{n} 秒", best: "最高 {n}", bestTime: "最长 {n}",
      menu: "60 秒冲分，或无尽生存。<br>无尽每砸中一只加 1 秒，时间归零或踩雷结束。<br>头盔两下，冒火花的雷别碰。",
      mode60: "60 秒", modeEndless: "无尽", bests: "60 秒 {s} · 无尽 {t}",
      again: "再来一局", modes: "选模式", record: "新纪录", over: "时间到", boom: "踩雷",
      got: "砸中 {n} 分。", endlessGot: "坚持 {t}，砸中 {s} 分。",
      result: "命中 {h}/{t} · 最高连击 {c}<br>踩雷 {m} · 评价 {r}",
      bestline: "<br>最高 {n} 分。", bestlineEndless: "<br>最长 {t} · 最高 {s}" },
    en: { title: "MOLE BOP", score: "PTS {n}", combo: "CMB {n}", time: "{n} S", best: "TOP {n}", bestTime: "BEST {n}",
      menu: "60s score attack, or endless survival.<br>Endless: each mole adds 1s; time out or hit a mine and it's over.<br>Helmets take two hits.",
      mode60: "60s", modeEndless: "ENDLESS", bests: "60s {s} · ENDLESS {t}",
      again: "AGAIN", modes: "MODES", record: "NEW RECORD", over: "TIME UP", boom: "BOOM",
      got: "{n} points.", endlessGot: "Lasted {t}, {s} points.",
      result: "{h}/{t} hits · best combo {c}<br>mines {m} · rank {r}",
      bestline: "<br>Best: {n}.", bestlineEndless: "<br>Best: {t} · {s} pts" }
  }[LANG];
  function tx(key, n) { return TXT[key].replace("{n}", n); }
  function tf(key, o) { return TXT[key].replace(/\{(\w+)\}/g, function (_, k) { return o[k]; }); }
  function $t(id, key, n) { document.getElementById(id).textContent = tx(key, n); }
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en"; document.title = TXT.title;

  /* 16x16 pixel sprites: 0 ink, 1 dark, 2 mid, 3 paper, . clear */
  var ART = {
    mole: ["................", "......0000......", "....00111100....", "...0111111110...", "..011111111110..", "..013011110310..", "..010011110010..", "..011111111110..", "..011122221110..", "..011220022110..", "..012222222210..", "..011223322110..", "..011111111110..", "..011111111110..", "..011111111110..", "..011111111110.."],
    dizzy: ["................", "......0000......", "....00111100....", "...0111111110...", "..010101101010..", "..011011110110..", "..010101101010..", "..011111111110..", "..011122221110..", "..011220022110..", "..012220022210..", "..012200002210..", "..011111111110..", "..011111111110..", "..011111111110..", "..011111111110.."],
    helmet: ["....00000000....", "...0222222220...", "..023322222220..", ".00000000000000."],
    mine: ["................", "............0...", "...........0.0..", "............0...", "...........01...", "..........01....", "....00000010....", "...0111111110...", "..011122111110..", ".01112221111110.", ".01112211111110.", ".01111111111110.", ".01111111111110.", "..011111111110..", "...0000000000...", "................"],
    crown: ["0.0.0.0.", "02222220", "02333220", ".000000."],
    minus: ["...", "000", "..."],
    paw: ["0.0.0", "01110", ".000."],
    strike: ["................", "................", "................", "................", "................", "................", "000000..........", "011110..........", "013310..........", "011110000000000.", "011110222222220.", "011110111111110.", "011110000000000.", "013310..........", "011110..........", "000000.........."],
    raised: ["......0000000000", "......0111111110", "......0131111310", "......0131111310", "......0111111110", "......0000000000", ".........0210...", ".........0210...", ".........0210...", ".........0210...", ".........0210...", ".........0210...", ".........0210...", ".........0210...", ".........0000...", "................"],
    spark: ["..0..", "..0..", "00.00", "..0..", "..0.."],
    plus: ["...", ".0.", "000", ".0.", "..."]
  };
  var DIGIT = ["111101101101111", "010110010010111", "111001111100111", "111001111001111", "101101111001001", "111100111001111", "111100111101111", "111001010010010", "111101111101111", "111101111001111"];

  function sprite(rows) {
    var c = document.createElement("canvas"), x = c.getContext("2d");
    c.width = rows[0].length; c.height = rows.length;
    rows.forEach(function (r, y) {
      for (var i = 0; i < r.length; i++) if (TONE[r[i]]) { x.fillStyle = TONE[r[i]]; x.fillRect(i, y, 1, 1); }
    });
    return c;
  }
  var SP = {}; Object.keys(ART).forEach(function (k) { SP[k] = sprite(ART[k]); });

  var cv = document.getElementById("c"), g = cv.getContext("2d");
  g.imageSmoothingEnabled = false;
  var W = 120, H = 150, TOP = 18, CW = 40, CH = 44;
  var holes = [], hammers = [], pops = [];
  var playing = false, score = 0, combo = 0, endAt = 0, nextSpawn = 0, nextMine = 0, lastSec = -1, startAt = 0;
  var hits = 0, taps = 0, minesHit = 0, maxCombo = 0, shakeUntil = 0;
  var MODE = "60", dying = false, endedAt = 0, best60 = 0, bestEndless = 0, bestEndlessTime = 0;
  var RUN_MS = 60000, ENDLESS_START_MS = 15000;
  /* custom sound effects arrived with PAD.music in runtime 0.11.0; older runtimes keep the named sounds */
  var CAN_SFX = typeof PAD !== "undefined" && !!PAD.music;

  /* fixed tufts of grass, same every game */
  var tufts = []; (function () { var s = 7; for (var i = 0; i < 26; i++) { s = (s * 73 + 41) % 997; tufts.push([s % 116 + 2, TOP + (s * 7) % (H - TOP - 4)]); } })();

  for (var i = 0; i < 9; i++) holes.push({ x: (i % 3) * CW, y: TOP + Math.floor(i / 3) * CH, s: "down", t: 0, stay: 0, helmet: false, gold: false, kind: "mole", lastTap: 0, scorch: false });

  function blit(img, x, y, k) { g.drawImage(img, Math.round(x), Math.round(y), img.width * (k || 2), img.height * (k || 2)); }
  function oval(cx, cy, rx, ry, color) {
    g.fillStyle = color;
    for (var dy = -ry; dy <= ry; dy++) {
      var w = Math.round(rx * Math.sqrt(1 - (dy * dy) / ((ry + 0.5) * (ry + 0.5))));
      g.fillRect(cx - w, cy + dy, w * 2, 1);
    }
  }
  function number(n, x, y) {
    String(n).split("").forEach(function (d, i) {
      var m = DIGIT[+d];
      for (var p = 0; p < 15; p++) if (m[p] === "1") { g.fillStyle = INK; g.fillRect(x + i * 4 + (p % 3), y + Math.floor(p / 3), 1, 1); }
    });
  }

  function showCombo() { $t("cb", "combo", combo); }
  function rank60(n) { return n >= 115 ? "S" : n >= 100 ? "A" : n >= 85 ? "B" : n >= 70 ? "C" : "D"; }
  function rankEndless(sec) { return sec >= 120 ? "S" : sec >= 90 ? "A" : sec >= 60 ? "B" : sec >= 30 ? "C" : "D"; }
  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function clockText(left) {
    var s = Math.max(0, Math.ceil(left));
    if (s > 60) return fmtTime(s);
    return s + (LANG === "zh" ? " 秒" : " S");
  }
  function setClock(left) { document.getElementById("tm").textContent = clockText(left); }
  function setBest() {
    if (MODE === "60") $t("bs", "best", best60);
    else $t("bs", "bestTime", bestEndlessTime ? fmtTime(bestEndlessTime) : "--");
  }
  function setButtons(items) {
    var box = document.getElementById("btns");
    box.innerHTML = "";
    items.forEach(function (it) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = it.label;
      b.addEventListener("click", it.fn);
      box.appendChild(b);
    });
  }
  function showBests() {
    document.getElementById("bests").innerHTML = tf("bests", {
      s: best60 || "--",
      t: bestEndlessTime ? fmtTime(bestEndlessTime) : "--"
    });
  }
  function showMenu() {
    playing = false; dying = false; MODE = "60";
    $t("ot", "title");
    document.getElementById("op").innerHTML = TXT.menu;
    document.getElementById("bests").classList.remove("hide");
    showBests(); setBest();
    setButtons([
      { label: TXT.mode60, fn: function () { start("60"); } },
      { label: TXT.modeEndless, fn: function () { start("endless"); } }
    ]);
    document.getElementById("ov").classList.remove("hide");
    $t("sc", "score", 0); showCombo(); setClock(60);
  }

  /* the triangle blip climbs with the combo; older runtimes get the named sounds */
  function hitSound(add) {
    if (CAN_SFX) PAD.sfx({ wave: "triangle", from: 170 + Math.min(combo, 15) * 18, to: 80, ms: 70, vol: 0.55 });
    else PAD.sfx(add > 1 ? "coin" : "hit");
    if (add > 1) PAD.sfx("coin");
  }
  function fuseSound() {
    if (CAN_SFX) PAD.sfx({ wave: "noise", from: 1600, to: 500, ms: 200, attack: 5, vol: 0.3 });
    else PAD.sfx("tick");
  }
  function boomSound() {
    if (CAN_SFX) PAD.sfx({ wave: "noise", from: 900, to: 60, ms: 260, attack: 2, decay: 258, vol: 0.85 });
    else PAD.sfx("err");
  }

  function rise(h, now) {
    /* 0 = hidden, 1 = fully up; a mine comes up a little slower so it can be read */
    var k = (now - h.t) / (h.kind === "mine" ? 200 : 120);
    if (h.s === "rise") return Math.min(1, k);
    if (h.s === "up") return 1;
    if (h.s === "sink") return Math.max(0, 1 - k);
    if (h.s === "hit") return 1;
    return 0;
  }

  function boom(cx, cy, age) {
    var k = Math.min(1, age / 260), r = 3 + 11 * k;
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4 + age / 150;
      g.fillStyle = i % 2 ? MID : INK;
      g.fillRect(Math.round(cx + Math.cos(a) * r) - 1, Math.round(cy + Math.sin(a) * r * 0.7) - 1, 2, 2);
    }
    oval(cx, cy, Math.round(6 + 7 * k), Math.round(4 + 5 * k), MID);
    oval(cx, cy, Math.round(4 + 5 * k), Math.round(3 + 3 * k), DARK);
    oval(cx, cy, Math.round(2 + 3 * k), Math.round(1 + 2 * k), INK);
    if (age < 120) { g.fillStyle = PAPER; g.fillRect(cx - 1, cy - 1, 2, 2); }
  }

  function draw(now) {
    g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
    g.save();
    if (now < shakeUntil) g.translate(Math.round(Math.sin(now / 18) * 2), Math.round(Math.cos(now / 15) * 2));
    g.fillStyle = PAPER; g.fillRect(-4, -4, W + 8, H + 8);
    g.fillStyle = MID; tufts.forEach(function (t) { g.fillRect(t[0], t[1], 1, 2); g.fillRect(t[0] + 2, t[1] - 1, 1, 3); });
    holes.forEach(function (h, i) {
      var cx = h.x + 20, cy = h.y + 34;
      if (h.scorch) {
        g.save(); g.beginPath(); g.rect(h.x, h.y, CW, CH); g.clip();
        oval(cx, cy, 18, 7, DARK);
        g.fillStyle = INK;
        g.fillRect(cx - 15, cy - 2, 4, 1); g.fillRect(cx + 10, cy + 2, 5, 1); g.fillRect(cx + 1, cy + 5, 3, 1);
        g.restore();
      }
      oval(cx, cy, 16, 6, MID);
      oval(cx, cy, 14, 4, INK);
      var r = rise(h, now);
      if (r > 0) {
        var top = cy - 28 * r + 2 - (h.s === "hit" && h.kind === "mole" ? -6 : 0);
        g.save(); g.beginPath(); g.rect(h.x, h.y - 20, CW, cy - h.y + 20); g.clip();
        if (h.kind === "mine") {
          if (h.s !== "hit") {
            blit(SP.mine, cx - 16, top - 2);
            /* the fuse tip blinks while the mine is up */
            g.fillStyle = Math.floor(now / 110) % 2 ? MID : INK;
            g.fillRect(cx + 7, top - 2, 2, 2);
          }
        } else {
          blit(h.s === "hit" ? SP.dizzy : SP.mole, cx - 16, top - 2);
          if (h.helmet && h.s !== "hit") blit(SP.helmet, cx - 16, top - 2);
          if (h.gold && h.s !== "hit") {
            blit(SP.crown, cx - 8, top - 8);
            if (Math.floor(now / 150) % 2) blit(SP.spark, cx + 8, top - 6, 1);
          }
        }
        g.restore();
        if (h.kind === "mole") {
          if (r === 1 && h.s !== "hit") { blit(SP.paw, cx - 13, cy - 4, 2); blit(SP.paw, cx + 3, cy - 4, 2); }
          if (h.s === "hit") {
            var a = (now - h.t) / 90;
            blit(SP.spark, cx - 3 + Math.round(Math.cos(a) * 12), top - 4 + Math.round(Math.sin(a) * 3), 1);
            blit(SP.spark, cx - 3 - Math.round(Math.cos(a) * 12), top - 4 - Math.round(Math.sin(a) * 3), 1);
          }
        }
      }
    });
    hammers = hammers.filter(function (m) { return now - m.t < 260; });
    hammers.forEach(function (m) {
      var h = holes[m.i], cx = h.x + 20, cy = h.y + 34;
      /* head lands on the mole's head, on the mine, or on the ground for a miss */
      var land = m.mine ? cy - 8 : m.helm ? cy - 22 : m.hit ? cy - 16 : cy + 2;
      if (now - m.t < 70) blit(SP.raised, cx - 14, land - 46);
      else blit(SP.strike, cx - 6, land - 32);
    });
    /* the blast goes over the hammer, so a mine hit reads at a glance */
    holes.forEach(function (h) {
      if (h.kind === "mine" && h.s === "hit") {
        var cx = h.x + 20, cy = h.y + 34;
        g.save(); g.beginPath(); g.rect(h.x, h.y - 20, CW, cy - h.y + 20); g.clip();
        boom(cx, cy - 10, now - h.t);
        g.restore();
      }
    });
    pops = pops.filter(function (p) { return now - p.t < 600; });
    pops.forEach(function (p) {
      var y = Math.round(p.y - (now - p.t) / 30);
      if (p.n < 0) { blit(SP.minus, p.x - 4, y, 1); number(-p.n, p.x, y); }
      else { blit(SP.plus, p.x - 4, y, 1); number(p.n, p.x, y); }
    });
    g.restore();
  }

  function spawn(now) {
    var p = Math.min(1, (now - startAt) / RUN_MS);
    var cap = p < 0.33 ? 3 : 4;
    var up = holes.filter(function (h) { return h.kind === "mole" && h.s !== "down"; }).length;
    if (up >= cap) return;
    var free = holes.filter(function (h) { return h.s === "down"; });
    if (!free.length) return;
    var h = free[Math.floor(Math.random() * free.length)];
    h.kind = "mole"; h.helmet = false; h.gold = false;
    h.s = "rise"; h.t = now;
    h.stay = 380 + 520 * (1 - p) + Math.random() * 140;
    var goldChance = now - startAt > 15000 ? 0.06 + 0.04 * p : 0;
    if (Math.random() < goldChance) { h.gold = true; h.stay *= 0.65; }
    else h.helmet = now - startAt > 8000 && Math.random() < 0.22;
  }

  function spawnMine(now) {
    if (holes.some(function (h) { return h.kind === "mine" && h.s !== "down"; })) return;
    var free = holes.filter(function (h) { return h.s === "down" && now - h.lastTap > 300; });
    if (!free.length) return;
    var h = free[Math.floor(Math.random() * free.length)];
    h.kind = "mine"; h.helmet = false; h.gold = false;
    h.s = "rise"; h.t = now; h.stay = 900;
    fuseSound();
  }

  function step(now) {
    holes.forEach(function (h) {
      var upMs = h.kind === "mine" ? 200 : 120;
      if (h.s === "rise" && now - h.t >= upMs) { h.s = "up"; h.t = now; }
      else if (h.s === "up" && now - h.t >= h.stay) {
        h.s = "sink"; h.t = now;
        if (h.kind === "mole") { combo = 0; showCombo(); }
      }
      else if (h.s === "sink" && now - h.t >= upMs) { h.s = "down"; }
      else if (h.s === "hit" && now - h.t >= 420) { h.s = "down"; }
    });
    if (dying) {
      if (now >= endAt) finish("mine");
      return;
    }
    var p = Math.min(1, (now - startAt) / RUN_MS);
    if (now >= nextSpawn) {
      spawn(now);
      nextSpawn = now + 300 + 620 * (1 - p) + Math.random() * 140;
    }
    if (now >= nextMine) {
      spawnMine(now);
      nextMine = now + 2600 + 1400 * (1 - p) + Math.random() * 600;
    }
    var sec = Math.ceil((endAt - now) / 1000);
    if (sec !== lastSec) {
      lastSec = sec; setClock(Math.max(0, sec));
      if (sec <= 5 && sec > 0) PAD.sfx("tick");
    }
    if (now >= endAt) finish("time");
  }

  function whack(i) {
    if (!playing || dying) return;
    var now = performance.now(), h = holes[i];
    taps++; h.lastTap = now;
    var m = { i: i, t: now, hit: false }; hammers.push(m);
    if ((h.s === "rise" || h.s === "up") && rise(h, now) > 0.4) {
      m.hit = true;
      if (h.kind === "mine") {
        m.mine = true;
        minesHit++; score = Math.max(0, score - 2); combo = 0;
        showCombo();
        h.s = "hit"; h.t = now; h.scorch = true;
        shakeUntil = now + 180;
        pops.push({ x: h.x + 18, y: h.y + 2, n: -2, t: now });
        boomSound();
        if (MODE === "endless") {
          dying = true; endedAt = now; endAt = now + 650; lastSec = -1; setClock(1);
        }
        $t("sc", "score", score);
        return;
      }
      hits++;
      if (MODE === "endless") endAt += h.gold ? 3000 : 1000;
      if (h.helmet) { h.helmet = false; h.stay += 300; PAD.sfx("hit"); m.hit = false; m.helm = true; return; }
      combo++; if (combo > maxCombo) maxCombo = combo;
      var add = h.gold ? 3 : (combo % 5 === 0 ? 2 : 1);
      score += add; h.s = "hit"; h.t = now;
      pops.push({ x: h.x + 18, y: h.y + 2, n: add, t: now });
      hitSound(add);
      showCombo();
      $t("sc", "score", score);
    } else { combo = 0; showCombo(); PAD.sfx("miss"); }
  }

  function start(mode) {
    MODE = mode === "endless" ? "endless" : "60";
    var now = performance.now();
    score = 0; combo = 0; hits = 0; taps = 0; minesHit = 0; maxCombo = 0; shakeUntil = 0; dying = false; endedAt = 0;
    startAt = now;
    endAt = now + (MODE === "60" ? RUN_MS : ENDLESS_START_MS);
    nextSpawn = now + 400; nextMine = now + 8000; lastSec = -1;
    holes.forEach(function (h) { h.s = "down"; h.helmet = false; h.gold = false; h.kind = "mole"; h.lastTap = 0; h.scorch = false; });
    hammers = []; pops = [];
    $t("sc", "score", 0); showCombo(); setClock((endAt - now) / 1000); setBest();
    document.getElementById("bests").classList.add("hide");
    document.getElementById("ov").classList.add("hide");
    playing = true; PAD.sfx("ok");
  }
  function finish(reason) {
    if (!playing) return;
    playing = false; dying = false;
    var endNow = endedAt || performance.now();
    var elapsed = Math.max(0, Math.round((endNow - startAt) / 1000));
    var record;
    if (MODE === "60") {
      record = score > best60;
      if (record) { best60 = score; PAD.save("best60", best60); }
      setBest();
      document.getElementById("op").innerHTML = tx("got", score) + "<br>" +
        tf("result", { h: hits, t: taps, c: maxCombo, m: minesHit, r: rank60(score) }) +
        (record || !best60 ? "" : tx("bestline", best60));
      $t("ot", record ? "record" : "over");
    } else {
      var recScore = score > bestEndless, recTime = elapsed > bestEndlessTime && score > 0;
      record = recScore || recTime;
      if (recScore) { bestEndless = score; PAD.save("bestEndless", bestEndless); }
      if (recTime) { bestEndlessTime = elapsed; PAD.save("bestEndlessTime", bestEndlessTime); }
      setBest();
      document.getElementById("op").innerHTML = tf("endlessGot", { t: fmtTime(elapsed), s: score }) + "<br>" +
        tf("result", { h: hits, t: taps, c: maxCombo, m: minesHit, r: rankEndless(elapsed) }) +
        (record || (!bestEndlessTime && !bestEndless) ? "" : tf("bestlineEndless", { t: fmtTime(bestEndlessTime), s: bestEndless }));
      $t("ot", record ? "record" : (reason === "mine" ? "boom" : "over"));
    }
    $t("sc", "score", score);
    $t("cb", "combo", 0); setClock(0);
    document.getElementById("bests").classList.add("hide");
    setButtons([
      { label: TXT.again, fn: function () { start(MODE); } },
      { label: TXT.modes, fn: showMenu }
    ]);
    document.getElementById("ov").classList.remove("hide");
    PAD.sfx(record ? "win" : "lose");
  }

  function loop(now) {
    if (playing) step(now);
    draw(now);
    requestAnimationFrame(loop);
  }

  function fit() {
    var st = document.getElementById("w"), hud = document.getElementById("hud");
    var aw = st.clientWidth - 22, ah = st.clientHeight - hud.offsetHeight - 30;
    var k = Math.min(aw / W, ah / H); if (k >= 2) k = Math.floor(k); k = Math.max(1, k);
    cv.style.width = Math.round(W * k) + "px"; cv.style.height = Math.round(H * k) + "px";
    var lg = document.getElementById("logo"); lg.style.width = lg.style.height = Math.round(24 * Math.max(2, Math.floor(k))) + "px";
  }

  cv.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height - TOP;
    if (y < 0) y = 0;
    var col = Math.min(2, Math.floor(x / CW)), row = Math.min(2, Math.floor(y / CH));
    whack(row * 3 + col);
  });
  $t("sc", "score", 0); $t("cb", "combo", 0); $t("bs", "best", 0); $t("ot", "title");
  var lg = document.getElementById("logo").getContext("2d"); lg.imageSmoothingEnabled = false;
  lg.drawImage(SP.mole, 0, 8); lg.drawImage(SP.mine, 16, 8);
  PAD.load("best60").then(function (v) { best60 = +v || 0; showBests(); setBest(); });
  PAD.load("bestEndless").then(function (v) { bestEndless = +v || 0; });
  PAD.load("bestEndlessTime").then(function (v) { bestEndlessTime = +v || 0; showBests(); setBest(); });
  showMenu();
  addEventListener("resize", fit); fit();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
