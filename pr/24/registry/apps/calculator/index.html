<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>计算器</title>
<!-- Lo-PDA app (lopda/1): eight-digit business calculator. Seven-segment LCD on a canvas, touch keys and chin buttons.
Copyright (c) 2026 Haowei Wu. MIT License. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#a3ad7e;font-family:monospace;color:#1f2a14;touch-action:none;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%;box-sizing:border-box;padding:10px 12px;gap:8px}
#lcd{border:3px solid #1f2a14;background:#a3ad7e;box-shadow:3px 3px 0 #4a5a32;padding:2px;display:flex;justify-content:center;flex:none}
canvas{display:block}
#hint{flex:none;text-align:center;font-size:12px;line-height:1.3;color:#4a5a32}
#keys{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr);gap:7px}
button{font-family:monospace;font-size:20px;font-weight:bold;min-height:0;padding:0;color:#a3ad7e;background:#4a5a32;border:2px solid #1f2a14;box-shadow:3px 3px 0 #1f2a14;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.n{background:#1f2a14;box-shadow:3px 3px 0 #4a5a32}
button.m{background:#7d8a58;color:#1f2a14;font-size:16px}
button.dn{transform:translate(2px,2px);box-shadow:1px 1px 0 #1f2a14;background:#7d8a58;color:#1f2a14}
button.cur{outline:3px solid #1f2a14;outline-offset:1px;background:#a3ad7e;color:#1f2a14}
</style>
</head>
<body>
<div id="app">
<div id="lcd"><canvas id="c"></canvas></div>
<div id="hint"></div>
<div id="keys"></div>
</div>
<!-- Arithmetic is kept free of the DOM so it can be tested on its own. -->
<script id="logic">
var Calc=(function(){
var MAXD=8;
/* Fit a number to eight digits. Doubles carry noise (0.1+0.2), so cut to 12 significant
   digits first, then round half up on the decimal string. Returns a string, or null if it does not fit. */
function norm(x){
  if(!isFinite(x))return null;
  if(x===0)return '0';
  var neg=x<0,e=Math.abs(x).toExponential(11),m=/^(\d)\.(\d+)e([+-]\d+)$/.exec(e);
  var ds=m[1]+m[2],pt=parseInt(m[3],10)+1,dec;
  if(pt<=0){ds=new Array(1-pt).join('0')+ds;pt=0;}
  dec=pt===0?MAXD-1:MAXD-pt;
  if(pt>MAXD)return null;
  var keep=pt+dec,kept=ds.slice(0,keep);
  while(kept.length<keep)kept+='0';
  if(ds.length>keep&&ds.charAt(keep)>='5'){
    var a=kept.split(''),i=a.length-1;
    while(i>=0){if(a[i]==='9'){a[i]='0';i--;}else{a[i]=String(+a[i]+1);break;}}
    kept=a.join('');
    if(i<0){kept='1'+kept;pt++;}
  }
  var ip=kept.slice(0,pt).replace(/^0+/,'')||'0',fp=kept.slice(pt).replace(/0+$/,'');
  if(ip.length>MAXD)return null;
  if(ip==='0'&&!fp)return '0';
  return (neg?'-':'')+ip+(fp?'.'+fp:'');
}
function create(){return {acc:0,op:null,entry:null,rep:false,after:false,lastOp:null,lastB:0,mem:0,err:false,cl:false};}
function apply(a,op,b){
  if(op==='+')return a+b;
  if(op==='-')return a-b;
  if(op==='*')return a*b;
  return b===0?null:a/b;
}
/* number in, number out; an overflow or a division by zero sets the error state instead */
function fin(s,r){
  var t=r===null?null:norm(r);
  if(t===null){s.err=true;return 0;}
  return parseFloat(t);
}
function value(s){return s.entry!==null?parseFloat(s.entry):s.acc;}
function digits(t){return t.replace(/[-.]/g,'').length;}
function shown(s){return s.entry!==null?s.entry:(norm(s.acc)||'0');}
function done(s){s.op=null;s.entry=null;s.rep=false;s.after=true;}
function press(s,k){
  if(s.err&&k!=='C')return;
  if(k!=='C')s.cl=false;
  var v,r;
  if(k.length===1&&k>='0'&&k<='9'){
    if(s.entry===null||s.rep){s.entry=k;s.rep=false;s.after=false;}
    else if(digits(s.entry)<MAXD)s.entry=(s.entry==='0')?k:(s.entry==='-0'?'-'+k:s.entry+k);
  }else if(k==='.'){
    if(s.entry===null||s.rep){s.entry='0.';s.rep=false;s.after=false;}
    else if(s.entry.indexOf('.')<0&&digits(s.entry)<MAXD)s.entry+='.';
  }else if(k==='n'){
    v=value(s);
    if(v===0)return;
    if(s.entry!==null)s.entry=s.entry.charAt(0)==='-'?s.entry.slice(1):'-'+s.entry;
    else{s.entry=norm(-s.acc);s.after=false;}
  }else if(k==='+'||k==='-'||k==='*'||k==='/'){
    if(s.op!==null&&s.entry===null){s.op=k;return;}
    v=value(s);
    if(s.op!==null){v=fin(s,apply(s.acc,s.op,v));if(s.err)return;}
    s.acc=v;s.op=k;s.entry=null;s.rep=false;s.after=false;
  }else if(k==='='){
    v=value(s);
    if(s.op!==null){
      var b=s.entry!==null?v:s.acc;
      s.lastOp=s.op;s.lastB=b;
      s.acc=fin(s,apply(s.acc,s.op,b));
    }else if(s.lastOp!==null)s.acc=fin(s,apply(v,s.lastOp,s.lastB)); /* repeat the last operation */
    else s.acc=v;
    done(s);
  }else if(k==='%'){
    v=value(s);
    if(s.op===null)r=v/100;
    else if(s.op==='+')r=s.acc+s.acc*v/100;
    else if(s.op==='-')r=s.acc-s.acc*v/100;
    else if(s.op==='*')r=s.acc*v/100;
    else r=v===0?null:s.acc*100/v;
    s.acc=fin(s,r);
    s.lastOp=null; /* a percent result is final: = after it must not repeat anything */
    done(s);
  }else if(k==='M+'||k==='M-'){
    v=value(s);
    r=fin(s,k==='M+'?s.mem+v:s.mem-v);
    if(s.err)return;
    s.mem=r;
    if(s.entry!==null)s.rep=true; /* the next digit starts a new number */
  }else if(k==='MR'){
    s.entry=norm(s.mem);s.rep=true;s.after=false;
  }else if(k==='MC'){
    s.mem=0;
  }else if(k==='C'){
    if(!s.err&&!s.cl&&s.entry!==null){s.entry='0';s.rep=false;s.cl=true;}
    else{var m=s.mem;var n=create();for(var p in n)s[p]=n[p];s.mem=m;}
  }else if(k==='<'){
    if(s.entry!==null&&!s.rep){
      s.entry=s.entry.slice(0,-1);
      if(s.entry===''||s.entry==='-')s.entry='0';
    }
  }
}
function view(s){
  if(s.err)return {text:'0',neg:false,err:true,mem:s.mem!==0};
  var t=shown(s);
  return {text:t.replace('-',''),neg:t.charAt(0)==='-',err:false,mem:s.mem!==0};
}
return {norm:norm,create:create,press:press,view:view};
})();
</script>
<script>
(function(){
var LANG=(typeof PAD!=='undefined'&&PAD.lang==='en')?'en':'zh';
var HINT={zh:'方向键选键  A按键  B清除  START等于',en:'Pad: move  A: press  B: C  START: ='}[LANG];
document.documentElement.lang=LANG==='zh'?'zh-CN':'en';
document.title=LANG==='zh'?'计算器':'Calc';
document.getElementById('hint').textContent=HINT;

var INK='#1f2a14',PAPER='#a3ad7e';
function rgb(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
var cINK=rgb(INK),cPAPER=rgb(PAPER);

/* ---- display: a seven-segment LCD like a business calculator's ----
   Slanted, bevelled segments; the decimal point has its own space between two digits so it never
   touches one; a minus bar left of the digits; M and E annunciators above. Unlit segments are not drawn:
   on a real reflective LCD they are invisible, and faint ghosts made the digits harder to read.
   Drawn at the screen's own pixel density with putImageData, hard edges, ink on paper. */
var SEG={'0':'abcdef','1':'bc','2':'abdeg','3':'abcdg','4':'bcfg','5':'acdfg','6':'acdefg','7':'abc','8':'abcdefg','9':'abcdfg'};
var ANN={M:['10001','11011','10101','10001','10001'],E:['11111','10000','11110','10000','11111']};
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),img=null,last=null,G=null;
function fitCanvas(){
  var css=document.getElementById('lcd').clientWidth-4,dpr=Math.max(1,Math.min(3,window.devicePixelRatio||1));
  var W=Math.floor(css*dpr);
  /* widths in digit widths: margins, minus slot 0.9, eight digits of 1 with 0.62 after each (the point lives there) */
  var dw=W/(0.45+0.9+8+8*0.62+0.1);
  G={dw:dw,dh:dw*1.7,t:Math.max(2,dw*0.19),sp:dw*0.62,slant:0.09,x0:dw*0.45,top:dw*0.72,W:W};
  G.H=Math.round(G.top+G.dh+dw*0.32);
  cv.width=W;cv.height=G.H;
  cv.style.width=(W/dpr)+'px';cv.style.height=(G.H/dpr)+'px';
  img=ctx.createImageData(cv.width,cv.height);
  draw();
}
/* fill a convex polygon (pixel centres inside every edge) */
function poly(pts,c){
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9,i,n=pts.length,x,y;
  for(i=0;i<n;i++){minX=Math.min(minX,pts[i][0]);maxX=Math.max(maxX,pts[i][0]);minY=Math.min(minY,pts[i][1]);maxY=Math.max(maxY,pts[i][1]);}
  minX=Math.max(0,Math.floor(minX));maxX=Math.min(img.width-1,Math.ceil(maxX));minY=Math.max(0,Math.floor(minY));maxY=Math.min(img.height-1,Math.ceil(maxY));
  for(y=minY;y<=maxY;y++)for(x=minX;x<=maxX;x++){
    var px=x+0.5,py=y+0.5,ok=true;
    for(i=0;i<n&&ok;i++){var a=pts[i],b=pts[(i+1)%n];if((b[0]-a[0])*(py-a[1])-(b[1]-a[1])*(px-a[0])<0)ok=false;}
    if(ok){var o=(y*img.width+x)*4;img.data[o]=c[0];img.data[o+1]=c[1];img.data[o+2]=c[2];img.data[o+3]=255;}
  }
}
/* lean a point to the right the higher it sits, like the italic digits of a real LCD */
function lean(p,base){return [p[0]+(base-p[1])*G.slant,p[1]];}
function hseg(x1,x2,yc,base,c){
  var h=G.t/2,q=[[x1,yc],[x1+h,yc-h],[x2-h,yc-h],[x2,yc],[x2-h,yc+h],[x1+h,yc+h]];
  poly(q.map(function(p){return lean(p,base);}),c);
}
function vseg(xc,y1,y2,base,c){
  var h=G.t/2,q=[[xc,y1],[xc+h,y1+h],[xc+h,y2-h],[xc,y2],[xc-h,y2-h],[xc-h,y1+h]];
  poly(q.map(function(p){return lean(p,base);}),c);
}
function digit(ch,x,c){
  var s=SEG[ch]||'',t=G.t,g=Math.max(1,t*0.18),y0=G.top,y2=G.top+G.dh,y1=(y0+y2)/2,base=y2;
  var L=x+t/2,R=x+G.dw-t/2,T=y0+t/2,B=y2-t/2;
  if(s.indexOf('a')>=0)hseg(L+g,R-g,T,base,c);
  if(s.indexOf('g')>=0)hseg(L+g,R-g,y1,base,c);
  if(s.indexOf('d')>=0)hseg(L+g,R-g,B,base,c);
  if(s.indexOf('f')>=0)vseg(L,T+g,y1-g,base,c);
  if(s.indexOf('b')>=0)vseg(R,T+g,y1-g,base,c);
  if(s.indexOf('e')>=0)vseg(L,y1+g,B-g,base,c);
  if(s.indexOf('c')>=0)vseg(R,y1+g,B-g,base,c);
}
function ann(name,x,c){
  var rows=ANN[name],k=Math.max(1,Math.round(G.dw*0.09)),y0=Math.round(G.dw*0.12);
  for(var r=0;r<rows.length;r++)for(var i=0;i<rows[r].length;i++)if(rows[r].charAt(i)==='1'){
    var px=Math.round(x)+i*k,py=y0+r*k;poly([[px,py],[px+k,py],[px+k,py+k],[px,py+k]],c);
  }
}
function draw(){
  if(!img||!last||!G)return;
  var d=img.data,i;
  for(i=0;i<d.length;i+=4){d[i]=cPAPER[0];d[i+1]=cPAPER[1];d[i+2]=cPAPER[2];d[i+3]=255;}
  var t=last.text,chars=[],pt=-1;
  for(i=0;i<t.length;i++){if(t.charAt(i)==='.')pt=chars.length-1;else chars.push(t.charAt(i));}
  /* like the real thing, a whole number still shows its point after the last digit */
  if(pt<0)pt=chars.length-1;
  var cell=G.dw+G.sp,first=G.x0+0.8*G.dw+(8-chars.length)*cell;
  for(i=0;i<chars.length;i++){
    var x=first+i*cell;
    digit(chars[i],x,cINK);
    if(i===pt){
      /* the point: a square in the gap after the digit, on the baseline */
      var s=G.t*1.1,px=x+G.dw+(G.sp-s)/2,py=G.top+G.dh-s;
      poly([[px,py],[px+s,py],[px+s,py+s],[px,py+s]].map(function(p){return lean(p,G.top+G.dh);}),cINK);
    }
  }
  if(last.neg){
    /* the minus bar sits right before the first digit, as on a pocket calculator */
    var mx=first-G.sp*0.5-G.dw*0.6;
    hseg(mx,mx+G.dw*0.6,G.top+G.dh/2,G.top+G.dh,cINK);
  }
  if(last.mem)ann('M',G.x0,cINK);
  if(last.err)ann('E',G.x0+G.dw*0.75,cINK);
  ctx.putImageData(img,0,0);
}

/* ---- keys ---- */
var LAYOUT=[
 [['MC','MC','m'],['MR','MR','m'],['M−','M-','m'],['M+','M+','m']],
 [['C','C',''],['±','n',''],['%','%',''],['÷','/','']],
 [['7','7','n'],['8','8','n'],['9','9','n'],['×','*','']],
 [['4','4','n'],['5','5','n'],['6','6','n'],['−','-','']],
 [['1','1','n'],['2','2','n'],['3','3','n'],['+','+','']],
 [['0','0','n',2],['.','.','n'],['=','=','']]
];
var keysEl=document.getElementById('keys'),K=[];
(function build(){
  for(var r=0;r<LAYOUT.length;r++){
    var c=0;
    for(var j=0;j<LAYOUT[r].length;j++){
      var d=LAYOUT[r][j],w=d[3]||1,b=document.createElement('button');
      b.textContent=d[0];b.className=d[2];b.setAttribute('data-i',K.length);b.type='button';
      if(w>1)b.style.gridColumn='span '+w;
      keysEl.appendChild(b);
      K.push({k:d[1],r:r,c:c,w:w,el:b});c+=w;
    }
  }
})();

var S=Calc.create(),curI=0,curCol=0,showCur=false,hold=null;
for(var q=0;q<K.length;q++)if(K[q].k==='5'){curI=q;curCol=K[q].c;}
function sfx(n){try{PAD.sfx(n);}catch(e){}}
function save(){try{PAD.save('calc',{m:S.mem,a:S.acc});}catch(e){}}
function refresh(){last=Calc.view(S);draw();}
function key(k){
  var was=S.err;
  Calc.press(S,k);
  sfx(S.err&&!was?'err':'tap');
  refresh();
  if(k==='='||k==='%'||k==='C'||k.charAt(0)==='M')save();
}
function flash(i){
  var el=K[i].el;el.classList.add('dn');
  setTimeout(function(){el.classList.remove('dn');},90);
}
function showCursor(){
  for(var i=0;i<K.length;i++)K[i].el.classList.toggle('cur',showCur&&i===curI);
}
function move(dir){
  if(!showCur){showCur=true;showCursor();return;}
  var cur=K[curI],ni=curI,i;
  if(dir==='left'||dir==='right'){
    var t=curI+(dir==='left'?-1:1);
    if(t>=0&&t<K.length&&K[t].r===cur.r){ni=t;curCol=K[t].c;}
  }else{
    var row=cur.r+(dir==='up'?-1:1);
    for(i=0;i<K.length;i++)if(K[i].r===row&&K[i].c<=curCol&&curCol<K[i].c+K[i].w)ni=i;
  }
  if(ni!==curI){curI=ni;sfx('move');}
  showCursor();
}
function padPress(b){
  if(b==='up'||b==='down'||b==='left'||b==='right')move(b);
  else if(b==='a'){
    if(!showCur){showCur=true;showCursor();return;}
    flash(curI);key(K[curI].k);
  }else if(b==='b')key('C');
  else if(b==='start')key('=');
}
if(typeof PAD!=='undefined'&&PAD.on)PAD.on('press',padPress);

/* pointer input: pressed look follows the finger, the key fires on touch down like a real key */
keysEl.addEventListener('pointerdown',function(e){
  var b=e.target.closest?e.target.closest('button'):null;
  if(!b)return;
  e.preventDefault();
  if(hold)hold.classList.remove('dn');
  hold=b;b.classList.add('dn');
  key(K[+b.getAttribute('data-i')].k);
});
function release(){if(hold){hold.classList.remove('dn');hold=null;}}
window.addEventListener('pointerup',release);
window.addEventListener('pointercancel',release);

/* physical keyboard: only keys the PAD shim does not already map (arrows, x, z, Enter, Shift) */
var KMAP={'.':'.','+':'+','-':'-','*':'*','/':'/','%':'%','=':'=','c':'C','C':'C','Escape':'C','Backspace':'<',',':'.'};
window.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key,m=null;
  if(k.length===1&&k>='0'&&k<='9')m=k;else if(KMAP.hasOwnProperty(k))m=KMAP[k];
  if(m===null)return;
  e.preventDefault();
  key(m);
});

window.addEventListener('resize',fitCanvas);
refresh();fitCanvas();
try{
  PAD.load('calc').then(function(v){
    if(v&&typeof v==='object'){
      if(isFinite(v.m))S.mem=v.m;
      if(isFinite(v.a)&&v.a!==0){S.acc=v.a;S.after=true;}
      refresh();
    }
  });
}catch(e){}
})();
</script>
</body>
</html>
