<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>かな卡</title>
<!-- Lo-PDA app (lopda/1): original kana flash cards, a small quiz, and optional Japanese speech. MIT License. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a3ad7e; color: #1f2a14; font-family: monospace; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-bottom: 2px solid #1f2a14; font-size: 14px; }
  header b { font-size: 16px; letter-spacing: 1px; }
  button { min-height: 44px; border: 2px solid #1f2a14; background: #1f2a14; color: #a3ad7e; font: inherit; font-size: 14px; font-weight: bold; }
  button.secondary { background: #a3ad7e; color: #1f2a14; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px 12px 10px; box-sizing: border-box; }
  #meta { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 290px; color: #4a5a32; font-size: 13px; }
  #card { width: 100%; max-width: 290px; height: 146px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 3px solid #1f2a14; box-sizing: border-box; }
  #kana { font-size: 76px; line-height: 1.1; }
  #romaji { margin-top: 4px; font-size: 18px; }
  #prompt { display: none; text-align: center; font-size: 15px; }
  #options { display: none; width: 100%; max-width: 290px; grid-template-columns: 1fr 1fr; gap: 8px; }
  #options button { background: #a3ad7e; color: #1f2a14; }
  #options button.selected { background: #1f2a14; color: #a3ad7e; }
  #controls { width: 100%; max-width: 290px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  #controls button { min-width: 0; padding: 2px; }
  #status { min-height: 1.3em; width: 100%; max-width: 290px; text-align: center; color: #4a5a32; font-size: 13px; line-height: 1.3; }
  body.quiz #card { height: 92px; }
  body.quiz #kana { font-size: 54px; }
  body.quiz #romaji { display: none; }
  body.quiz #prompt, body.quiz #options { display: grid; }
  @media (max-height: 390px) {
    main { gap: 5px; padding-top: 5px; padding-bottom: 6px; }
    #card { height: 124px; }
    #kana { font-size: 66px; }
    body.quiz #card { height: 78px; }
  }
</style>
</head>
<body>
<header>
  <b id="title">かな卡</b>
  <button id="script" class="secondary" type="button">平假名</button>
  <span id="count">1/46</span>
</header>
<main>
  <div id="meta"><span id="mode">学习</span><span id="guide">← → 看卡 · A 听 · B 测验</span></div>
  <section id="card" aria-live="polite">
    <div id="kana">あ</div>
    <div id="romaji">a</div>
  </section>
  <div id="prompt"></div>
  <div id="options"></div>
  <div id="controls">
    <button id="prev" class="secondary" type="button">Prev</button>
    <button id="hear" type="button">A 听</button>
    <button id="next" class="secondary" type="button">Next</button>
    <button id="quiz" class="secondary" type="button">小测</button>
  </div>
  <div id="status" aria-live="polite"></div>
</main>
<script>
(function () {
  var LANG = (typeof PAD !== "undefined" && PAD.lang === "en") ? "en" : "zh";
  var KEY = "kana-cards-state";
  var HIRA = ["あ","い","う","え","お","か","き","く","け","こ","さ","し","す","せ","そ","た","ち","つ","て","と","な","に","ぬ","ね","の","は","ひ","ふ","へ","ほ","ま","み","む","め","も","や","ゆ","よ","ら","り","る","れ","ろ","わ","を","ん"];
  var KATA = ["ア","イ","ウ","エ","オ","カ","キ","ク","ケ","コ","サ","シ","ス","セ","ソ","タ","チ","ツ","テ","ト","ナ","ニ","ヌ","ネ","ノ","ハ","ヒ","フ","ヘ","ホ","マ","ミ","ム","メ","モ","ヤ","ユ","ヨ","ラ","リ","ル","レ","ロ","ワ","ヲ","ン"];
  var ROMA = ["a","i","u","e","o","ka","ki","ku","ke","ko","sa","shi","su","se","so","ta","chi","tsu","te","to","na","ni","nu","ne","no","ha","hi","fu","he","ho","ma","mi","mu","me","mo","ya","yu","yo","ra","ri","ru","re","ro","wa","wo","n"];
  var TXT = {
    zh: { title: "かな卡", hira: "平假名", kata: "片假名", learn: "学习", quiz: "小测", quizBtn: "小测", back: "返回", prev: "前", next: "后", guide: "← → 看卡 · A 听 · B 测验", question: "选出这个假名的罗马字", hear: "A 听", mastered: "正确", missed: "再看看：", noVoice: "日语朗读暂不可用；仍可继续学习。", legacy: "此版本不支持日语朗读；仍可继续学习。" },
    en: { title: "Kana", hira: "Hiragana", kata: "Katakana", learn: "Study", quiz: "Quiz", quizBtn: "Quiz", back: "Back", prev: "Prev", next: "Next", guide: "← → card · A hear · B quiz", question: "Choose this kana's romaji", hear: "A Hear", mastered: "Correct", missed: "Review: ", noVoice: "Japanese speech is unavailable; you can keep studying.", legacy: "Japanese speech needs a newer handheld; keep studying." }
  }[LANG];
  var data = { script: "hira", index: 0, quiz: false, target: 0, choices: [], choice: 0, locked: false };
  var kanaEl = document.getElementById("kana"), romaEl = document.getElementById("romaji");
  var scriptBtn = document.getElementById("script"), statusEl = document.getElementById("status");
  var promptEl = document.getElementById("prompt"), optionsEl = document.getElementById("options");
  function table() { return data.script === "hira" ? HIRA : KATA; }
  function save() {
    if (typeof PAD !== "undefined" && PAD.save) PAD.save(KEY, { script: data.script, index: data.index });
  }
  function current() { return table()[data.index]; }
  function render() {
    var list = table(), currentIndex = data.quiz ? data.target : data.index;
    document.body.classList.toggle("quiz", data.quiz);
    scriptBtn.textContent = data.script === "hira" ? TXT.hira : TXT.kata;
    document.getElementById("title").textContent = TXT.title;
    document.getElementById("count").textContent = (data.quiz ? data.target + 1 : data.index + 1) + "/46";
    document.getElementById("mode").textContent = data.quiz ? TXT.quiz : TXT.learn;
    document.getElementById("guide").textContent = data.quiz ? TXT.question : TXT.guide;
    kanaEl.textContent = list[currentIndex];
    romaEl.textContent = ROMA[currentIndex];
    document.getElementById("quiz").textContent = data.quiz ? TXT.back : TXT.quizBtn;
    document.getElementById("prev").textContent = TXT.prev;
    document.getElementById("next").textContent = TXT.next;
    document.getElementById("hear").textContent = TXT.hear;
    promptEl.textContent = TXT.question;
    optionsEl.textContent = "";
    if (data.quiz) {
      data.choices.forEach(function (index, i) {
        var b = document.createElement("button");
        b.type = "button"; b.textContent = ROMA[index];
        b.setAttribute("data-index", String(index));
        b.className = i === data.choice ? "selected" : "";
        b.addEventListener("click", function () { data.choice = i; answer(); });
        optionsEl.appendChild(b);
      });
    }
  }
  function switchScript() {
    data.script = data.script === "hira" ? "kata" : "hira";
    data.quiz = false; data.locked = false; statusEl.textContent = "";
    save(); render();
  }
  function move(dir) {
    if (data.quiz) {
      if (!data.locked) { data.choice = (data.choice + dir + data.choices.length) % data.choices.length; render(); }
      return;
    }
    data.index = (data.index + dir + 46) % 46;
    statusEl.textContent = ""; save(); render();
  }
  function newQuestion() {
    var choices = [data.target], i, n;
    while (choices.length < 4) {
      n = Math.floor(Math.random() * 46);
      if (choices.indexOf(n) < 0) choices.push(n);
    }
    for (i = choices.length - 1; i > 0; i--) {
      n = Math.floor(Math.random() * (i + 1));
      var tmp = choices[i]; choices[i] = choices[n]; choices[n] = tmp;
    }
    data.choices = choices; data.choice = 0; data.locked = false;
  }
  function startQuiz() {
    if (data.quiz) { data.quiz = false; data.locked = false; statusEl.textContent = ""; render(); return; }
    data.quiz = true; data.target = Math.floor(Math.random() * 46);
    newQuestion(); statusEl.textContent = ""; render();
  }
  function answer() {
    if (!data.quiz || data.locked) return;
    data.locked = true;
    if (data.choices[data.choice] === data.target) {
      statusEl.textContent = TXT.mastered;
      if (typeof PAD !== "undefined" && PAD.sfx) PAD.sfx("ok");
    } else {
      statusEl.textContent = TXT.missed + ROMA[data.target];
      if (typeof PAD !== "undefined" && PAD.sfx) PAD.sfx("miss");
    }
    save();
    setTimeout(function () {
      if (!data.quiz) return;
      data.target = Math.floor(Math.random() * 46);
      newQuestion(); statusEl.textContent = ""; render();
    }, 850);
  }
  function hear() {
    if (data.quiz) return;
    if (typeof PAD === "undefined" || !PAD.say) { statusEl.textContent = TXT.legacy; return; }
    if (!PAD.say.languages || PAD.say.languages.indexOf("ja") < 0) { statusEl.textContent = TXT.legacy; return; }
    PAD.say(current(), { lang: "ja" }).then(function (result) {
      if (result === "unavailable") statusEl.textContent = TXT.noVoice;
      else statusEl.textContent = "";
    });
  }
  function handle(button) {
    if (button === "left") move(-1);
    else if (button === "right") move(1);
    else if (button === "a") { if (data.quiz) answer(); else hear(); }
    else if (button === "b" || button === "start") startQuiz();
    else if (button === "select") switchScript();
  }
  document.getElementById("prev").addEventListener("click", function () { move(-1); });
  document.getElementById("next").addEventListener("click", function () { move(1); });
  document.getElementById("hear").addEventListener("click", hear);
  document.getElementById("quiz").addEventListener("click", startQuiz);
  scriptBtn.addEventListener("click", switchScript);
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { e.preventDefault(); move(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); move(1); }
    else if (e.key === "x" || e.key === "X") { e.preventDefault(); if (data.quiz) answer(); else hear(); }
    else if (e.key === "z" || e.key === "Z" || e.key === "Enter") { e.preventDefault(); startQuiz(); }
    else if (e.key === "Shift") { e.preventDefault(); switchScript(); }
  }, false);
  if (typeof PAD !== "undefined" && PAD.on) PAD.on("press", handle);
  document.documentElement.lang = LANG === "en" ? "en" : "zh-CN";
  if (typeof PAD !== "undefined" && PAD.load) {
    PAD.load(KEY).then(function (saved) {
      if (saved && (saved.script === "hira" || saved.script === "kata")) data.script = saved.script;
      if (saved && typeof saved.index === "number" && saved.index >= 0 && saved.index < 46) data.index = saved.index;
      render();
    });
  } else render();
})();
</script>
</body>
</html>
