<script data-src="src/10-game.js">
/* 矿工老张: the game itself. Everything here is plain state plus functions, so the
   tests can run it without a browser. The art, DOM and PAD calls live in the next files. */
var GM = (typeof GM !== "undefined" && GM) || {};

GM.rng = function (seed) {
  var s = (seed >>> 0) || 1;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

GM.targetFor = function (n) {
  if (n <= GM.PLAY_LEVELS) return GM.TARGETS[n - 1] || GM.TARGETS[0];
  var t = GM.TARGETS[GM.PLAY_LEVELS - 1];
  for (var i = GM.PLAY_LEVELS + 1; i <= n; i++) {
    t += GM.ENDLESS_FIRST_STEP + (i - GM.PLAY_LEVELS - 1) * GM.ENDLESS_GROW;
  }
  return t;
};

GM.moleCarry = function (n) {
  return n >= 6 ? "diamond" : "goldM";
};

GM.moleValue = function (n) {
  return GM.ITEMS[GM.moleCarry(n)].value;
};

GM.recipeFor = function (n) {
  var r, i;
  if (n <= GM.PLAY_LEVELS) {
    r = {};
    for (i in GM.LEVELS[n - 1]) if (Object.prototype.hasOwnProperty.call(GM.LEVELS[n - 1], i)) r[i] = GM.LEVELS[n - 1][i];
    return r;
  }
  r = {};
  for (i in GM.LEVELS[GM.PLAY_LEVELS - 1]) {
    if (Object.prototype.hasOwnProperty.call(GM.LEVELS[GM.PLAY_LEVELS - 1], i)) r[i] = GM.LEVELS[GM.PLAY_LEVELS - 1][i];
  }
  var extra = n - GM.PLAY_LEVELS;
  r.goldM += Math.min(6, Math.ceil(extra / 2));
  r.goldL += Math.min(4, Math.floor(extra / 2));
  r.diamond += Math.min(5, Math.floor(extra / 2));
  r.bag += Math.min(3, Math.floor(extra / 3));
  r.tnt = Math.min(4, r.tnt + Math.floor(extra / 3));
  r.mole = Math.min(4, r.mole + Math.floor(extra / 2));
  /* never turn the mine into a solid wall: shed the cheapest things first */
  var drop = ["bone", "skull", "rockS", "goldS", "bag", "rockL", "goldM", "goldL", "diamond", "mole", "tnt"];
  var total = GM.recipeCount(r);
  while (total > 36) {
    for (i = 0; i < drop.length; i++) {
      if (r[drop[i]] > 0) { r[drop[i]]--; total--; break; }
    }
  }
  return r;
};

GM.recipeCount = function (recipe) {
  var n = 0;
  for (var k in recipe) if (Object.prototype.hasOwnProperty.call(recipe, k)) n += recipe[k] || 0;
  return n;
};

GM.rockValue = function (type, book) {
  return GM.ITEMS[type].value * (book ? 3 : 1);
};

GM.bagValue = function (rng, clover) {
  var mult = 1 + 0.5 * (clover || 0);
  var v = (GM.ITEMS.bag.min + rng() * (GM.ITEMS.bag.max - GM.ITEMS.bag.min)) * mult;
  return Math.max(10, Math.round(v / 10) * 10);
};

GM.recipeValue = function (n, clover, book) {
  var r = GM.recipeFor(n), min = 0, max = 0, k, c;
  r.diamond = (r.diamond || 0) + (clover || 0);
  for (k in r) {
    if (!Object.prototype.hasOwnProperty.call(r, k) || !r[k]) continue;
    c = r[k];
    if (k === "bag") {
      min += c * GM.ITEMS.bag.min * (1 + 0.5 * (clover || 0));
      max += c * GM.ITEMS.bag.max * (1 + 0.5 * (clover || 0));
    } else if (k === "mole") {
      min += c * GM.moleValue(n);
      max += c * GM.moleValue(n);
    } else if (k === "rockS" || k === "rockL") {
      min += c * GM.rockValue(k, book);
      max += c * GM.rockValue(k, book);
    } else {
      min += c * GM.ITEMS[k].value;
      max += c * GM.ITEMS[k].value;
    }
  }
  return { min: min, max: max };
};

GM.newState = function () {
  return {
    screen: "title",
    level: 1,
    bank: 0,
    target: GM.TARGETS[0],
    time: GM.LEVEL_TIME,
    items: [],
    hook: { state: "swing", len: GM.IDLE_ROPE, angle: 0, item: null },
    bomb: null,
    dynamite: 0,
    strength: 0,
    clover: 0,
    book: 0,
    shopCursor: 4,
    runSeed: 1,
    levelSeed: 1,
    rng: GM.rng(1),
    swingT: 0,
    introT: 0,
    resumeTo: "play",
    lastSec: GM.LEVEL_TIME,
    events: [],
    floats: [],
    particles: [],
    blasts: [],
    shake: 0,
    anim: 0,
    best: { level: 0, bank: 0 },
    bestBlocked: false,
    bestDirty: false,
    newBest: false,
    saveMsg: "",
    run: null,
    runBlocked: false,
    runDirty: false,
    runMsg: "",
    menuCursor: 0,
    pauseCursor: 0,
    confirmCursor: 0,
    wonOnce: false,
    jingleId: 0,
    bg: null,
    bgKey: ""
  };
};

GM.startRun = function (state, seed) {
  state.level = 1;
  state.bank = 0;
  state.dynamite = 0;
  state.strength = 0;
  state.clover = 0;
  state.book = 0;
  state.wonOnce = false;
  state.bestDirty = false;
  state.newBest = false;
  state.runSeed = (seed || Math.floor(Math.random() * 2147483000) + 1) >>> 0;
  GM.startLevel(state, 1);
};

GM.startLevel = function (state, n) {
  state.level = n;
  state.target = GM.targetFor(n);
  state.time = GM.LEVEL_TIME;
  state.jingleId = (state.jingleId || 0) + 1;
  state.lastSec = GM.LEVEL_TIME;
  state.levelSeed = (state.runSeed + n * 7919) >>> 0;
  state.rng = GM.rng(state.levelSeed);
  state.items = GM.generate(state, n);
  state.hook = { state: "swing", len: GM.IDLE_ROPE, angle: 0, item: null };
  state.bomb = null;
  GM.setRun(state, n);
  state.swingT = 0;
  state.introT = 1.25;
  state.shopCursor = 4;
  state.events = [];
  state.floats = [];
  state.particles = [];
  state.blasts = [];
  state.shake = 0;
  state.anim = 0;
  state.bestDirty = false;
  state.newBest = false;
  state.bg = null;
  state.bgKey = "";
  state.screen = "intro";
};

GM.makeItem = function (state, type, x, y, rng) {
  var spec = GM.ITEMS[type];
  var it = {
    type: type,
    kind: spec.kind,
    sprite: spec.sprite,
    x: x,
    y: y,
    r: spec.r,
    weight: spec.weight,
    value: spec.value,
    fuse: 0
  };
  if (type === "bag") it.value = GM.bagValue(rng, state.clover);
  if (type === "rockS" || type === "rockL") it.value = GM.rockValue(type, state.book);
  if (type === "mole") {
    it.carry = GM.moleCarry(state.level);
    it.value = GM.ITEMS[it.carry].value;
    it.dir = rng() < 0.5 ? -1 : 1;
    it.speed = 11 + Math.min(10, state.level * 0.9);
    it.minX = 18;
    it.maxX = 142;
  }
  return it;
};

GM.overlaps = function (x, y, r, items, gap) {
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (it.type === "mole") continue;
    var dx = it.x - x, dy = it.y - y, rr = it.r + r + (gap == null ? 2 : gap);
    if (dx * dx + dy * dy < rr * rr) return true;
  }
  return false;
};

GM.generate = function (state, n) {
  var recipe = GM.recipeFor(n);
  recipe.diamond = (recipe.diamond || 0) + (state.clover || 0);
  var rng = state.rng || GM.rng(state.levelSeed || 1);
  var items = [];
  var order = ["diamond", "goldL", "goldM", "bag", "goldS", "rockL", "rockS", "skull", "bone", "tnt"];
  var i, j, type, count, spec, pref, x, y, r, tries, placed, gap;

  for (i = 0; i < order.length; i++) {
    type = order[i];
    count = recipe[type] || 0;
    spec = GM.ITEMS[type];
    pref = spec.pref;
    r = spec.r;
    for (j = 0; j < count; j++) {
      placed = false;
      for (gap = 2; gap >= 0 && !placed; gap -= 2) {
        for (tries = 0; tries < 170 && !placed; tries++) {
          x = r + 4 + rng() * (GM.W - 2 * r - 8);
          var yMin = Math.max(GM.GROUND + 15, pref[0]);
          var yMax = Math.min(GM.H - r - 4, pref[1]);
          if (yMax < yMin) yMin = yMax;
          y = yMin + rng() * Math.max(1, yMax - yMin);
          if (!GM.overlaps(x, y, r, items, gap)) {
            items.push(GM.makeItem(state, type, x, y, rng));
            placed = true;
          }
        }
      }
    }
  }

  /* the mole runs along a lane of its own; it may pass in front of the static loot */
  var moles = recipe.mole || 0;
  for (i = 0; i < moles; i++) {
    items.push(GM.makeItem(state, "mole", 24 + rng() * 112, 84 + rng() * 28, rng));
  }
  return items;
};

GM.countItems = function (items, type) {
  var n = 0;
  for (var i = 0; i < items.length; i++) if (items[i].type === type) n++;
  return n;
};

GM.tip = function (hook) {
  return {
    x: GM.ANCHOR.x + Math.sin(hook.angle) * hook.len,
    y: GM.ANCHOR.y + Math.cos(hook.angle) * hook.len
  };
};

/* the caught item hangs from the near edge, not from its centre */
GM.heldPos = function (hook) {
  var tip = GM.tip(hook);
  if (!hook.item) return tip;
  var off = hook.item.r + 2;
  return {
    x: tip.x + Math.sin(hook.angle) * off,
    y: tip.y + Math.cos(hook.angle) * off
  };
};

GM.retractSpeed = function (item, strength) {
  return Math.min(300, GM.BASE_SPEED / Math.max(0.4, item.weight) * (1 + GM.STRENGTH_STEP * (strength || 0)));
};

GM.fire = function (state) {
  if (state.screen !== "play" || state.hook.state !== "swing") return false;
  state.hook.state = "out";
  state.hook.len = GM.IDLE_ROPE;
  state.events.push("fire");
  return true;
};

GM.useDynamite = function (state) {
  if (state.screen !== "play" || state.hook.state !== "back" || !state.hook.item ||
      state.dynamite <= 0 || state.bomb) return false;
  state.dynamite--;
  var p = GM.heldPos(state.hook);
  state.bomb = {
    t: 0,
    dur: 0.38,
    sx: GM.ANCHOR.x,
    sy: GM.ANCHOR.y - 5,
    tx: p.x,
    ty: p.y,
    item: state.hook.item
  };
  state.events.push("throw");
  return true;
};

GM.bombPos = function (b) {
  var p = Math.min(1, b.t / b.dur);
  return {
    x: b.sx + (b.tx - b.sx) * p,
    y: b.sy + (b.ty - b.sy) * p - Math.sin(p * Math.PI) * 7
  };
};

GM.resolveBomb = function (state) {
  var b = state.bomb;
  if (!b) return;
  state.bomb = null;
  var it = b.item;
  if (state.hook.item === it) {
    state.hook.item = null;
    state.hook.state = "back";
  }
  if (it.kind === "tnt") {
    GM.explode(state, b.tx, b.ty);
  } else {
    GM.addParticles(state, b.tx, b.ty, 12, ["mid", "dark", "paper"]);
    state.blasts.push({ x: b.tx, y: b.ty, t: 0, life: 0.5 });
    state.shake = 0.32;
    state.events.push("boom");
  }
};

GM.updateBomb = function (state, dt) {
  if (!state.bomb) return;
  state.bomb.t += dt;
  if (state.bomb.t >= state.bomb.dur) GM.resolveBomb(state);
};

GM.attach = function (state, index) {
  var it = state.items[index];
  state.items.splice(index, 1);
  state.hook.item = it;
  state.hook.state = "back";
  if (it.kind === "tnt") it.fuse = 1.0;
  var p = GM.tip(state.hook);
  GM.addParticles(state, p.x, p.y, 5, ["mid", "dark"]);
  state.events.push("grab");
  return it;
};

GM.collect = function (state) {
  var it = state.hook.item;
  if (!it) return;
  var p = GM.heldPos(state.hook);
  state.hook.item = null;
  state.hook.state = "swing";
  state.hook.len = GM.IDLE_ROPE;
  if (it.kind === "tnt") {
    GM.explode(state, p.x, p.y);
    return;
  }
  state.bank += it.value;
  var ev = it.kind === "gem" ? "gem" : (it.kind === "junk" || it.kind === "rock") ? "junk" : "coin";
  state.events.push(ev);
  if (it.value > 0) GM.addFloat(state, GM.ANCHOR.x, 6, "+" + it.value);
  if (it.kind === "gem") GM.addParticles(state, p.x, p.y, 10, ["paper"]);
};

GM.explode = function (state, x, y) {
  var keep = [], i, it;
  for (i = 0; i < state.items.length; i++) {
    it = state.items[i];
    var dx = it.x - x, dy = it.y - y;
    if (dx * dx + dy * dy <= 30 * 30) {
      GM.addParticles(state, it.x, it.y, 6, ["mid", "dark", "paper"]);
    } else {
      keep.push(it);
    }
  }
  state.items = keep;
  state.hook.item = null;
  state.hook.state = "back";
  state.blasts.push({ x: x, y: y, t: 0, life: 0.55 });
  state.shake = 0.4;
  state.events.push("boom");
};

GM.addFloat = function (state, x, y, text) {
  state.floats.push({ x: x, y: y, text: text, t: 0, life: 0.85 });
};

GM.addParticles = function (state, x, y, n, colors) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2;
    var s = 8 + Math.random() * 28;
    state.particles.push({
      x: x,
      y: y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 8,
      t: 0,
      life: 0.35 + Math.random() * 0.35,
      color: colors[i % colors.length]
    });
  }
};

GM.updateEffects = function (state, dt) {
  var out = [], i, e;
  for (i = 0; i < state.floats.length; i++) {
    e = state.floats[i];
    e.t += dt;
    if (e.t < e.life) out.push(e);
  }
  state.floats = out;
  out = [];
  for (i = 0; i < state.particles.length; i++) {
    e = state.particles[i];
    e.t += dt;
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    e.vy += 90 * dt;
    if (e.t < e.life) out.push(e);
  }
  state.particles = out;
  out = [];
  for (i = 0; i < state.blasts.length; i++) {
    e = state.blasts[i];
    e.t += dt;
    if (e.t < e.life) out.push(e);
  }
  state.blasts = out;
};

GM.finishLevel = function (state) {
  if (state.bank >= state.target) {
    GM.recordBest(state, state.level, state.bank);
    GM.setRun(state, state.level + 1);
    state.events.push("clear");
    if (state.level === GM.PLAY_LEVELS && !state.wonOnce) {
      state.wonOnce = true;
      state.screen = "victory";
    } else {
      state.screen = "clear";
    }
  } else {
    GM.recordBest(state, Math.max(0, state.level - 1), state.bank);
    GM.clearRun(state);
    state.events.push("fail");
    state.screen = "over";
  }
};

GM.setRun = function (state, level) {
  state.run = {
    level: level,
    bank: state.bank,
    dynamite: state.dynamite,
    strength: state.strength,
    clover: state.clover,
    book: state.book,
    runSeed: state.runSeed
  };
  state.runDirty = true;
};

GM.clearRun = function (state) {
  state.run = null;
  state.runDirty = true;
};

GM.runPayload = function (state) {
  var r = state.run;
  if (!r) return null;
  return {
    v: 1,
    level: r.level,
    bank: r.bank,
    dynamite: r.dynamite,
    strength: r.strength,
    clover: r.clover,
    book: r.book,
    runSeed: r.runSeed
  };
};

GM.readRun = function (raw) {
  if (raw == null) return { ok: true, run: null };
  if (typeof raw !== "object" || raw.length != null) return { ok: false, corrupt: true, run: null };
  var v = raw.v;
  if (typeof v !== "number" || Math.floor(v) !== v) return { ok: false, corrupt: true, run: null };
  if (v > 1) return { ok: false, newer: true, run: null };
  if (v !== 1) return { ok: false, corrupt: true, run: null };
  var nums = ["level", "bank", "dynamite", "strength", "clover", "book", "runSeed"];
  for (var i = 0; i < nums.length; i++) {
    var n = raw[nums[i]];
    if (typeof n !== "number" || Math.floor(n) !== n || n < 0) return { ok: false, corrupt: true, run: null };
  }
  if (raw.level < 1 || raw.level > 9999) return { ok: false, corrupt: true, run: null };
  if (raw.dynamite > 5 || raw.strength > 3 || raw.clover > 2 || raw.book > 1) return { ok: false, corrupt: true, run: null };
  if (raw.runSeed < 1 || raw.runSeed > 4294967295) return { ok: false, corrupt: true, run: null };
  return {
    ok: true,
    run: {
      level: raw.level, bank: raw.bank, dynamite: raw.dynamite, strength: raw.strength,
      clover: raw.clover, book: raw.book, runSeed: raw.runSeed
    }
  };
};

GM.continueRun = function (state) {
  var r = state.run;
  if (!r) return false;
  state.runSeed = r.runSeed >>> 0;
  state.bank = r.bank;
  state.dynamite = r.dynamite;
  state.strength = r.strength;
  state.clover = r.clover;
  state.book = r.book;
  state.wonOnce = r.level > GM.PLAY_LEVELS;
  GM.startLevel(state, r.level);
  return true;
};

GM.better = function (a, b) {
  if (!a) return false;
  if (!b) return true;
  if (a.level !== b.level) return a.level > b.level;
  return a.bank > b.bank;
};

GM.recordBest = function (state, level, bank) {
  var next = { level: level, bank: bank };
  if (!GM.better(next, state.best)) return false;
  state.best = next;
  state.bestDirty = true;
  state.newBest = true;
  return true;
};

GM.bestPayload = function (state) {
  return { v: 1, level: state.best.level, bank: state.best.bank };
};

GM.readBest = function (raw) {
  var empty = { level: 0, bank: 0 };
  if (raw == null) return { ok: true, best: empty };
  if (typeof raw !== "object" || raw.length != null) return { ok: false, corrupt: true, best: empty };
  var v = raw.v;
  if (typeof v !== "number" || Math.floor(v) !== v) return { ok: false, corrupt: true, best: empty };
  if (v > 1) return { ok: false, newer: true, best: empty };
  if (v !== 1) return { ok: false, corrupt: true, best: empty };
  var level = raw.level, bank = raw.bank;
  if (typeof level !== "number" || Math.floor(level) !== level || level < 0 || level > 9999) {
    return { ok: false, corrupt: true, best: empty };
  }
  if (typeof bank !== "number" || Math.floor(bank) !== bank || bank < 0 || bank > 999999999) {
    return { ok: false, corrupt: true, best: empty };
  }
  return { ok: true, best: { level: level, bank: bank } };
};

GM.openShop = function (state) {
  state.shopCursor = 4;
  state.screen = "shop";
  state.events = [];
};

GM.shopNext = function (state) {
  GM.startLevel(state, state.level + 1);
};

GM.moveShop = function (state, dir) {
  state.shopCursor = (state.shopCursor + dir + 5) % 5;
  state.events.push("move");
};

GM.buy = function (state, idx) {
  var item = GM.SHOP[idx];
  if (!item) { state.events.push("err"); return false; }
  var have = state[item.key] || 0;
  if (have >= item.max || state.bank < item.price) {
    state.events.push("err");
    return false;
  }
  state.bank -= item.price;
  state[item.key] = have + 1;
  GM.setRun(state, state.level + 1);
  state.events.push("buy");
  return true;
};

GM.pause = function (state) {
  if (state.screen !== "play" && state.screen !== "intro") return false;
  state.resumeTo = state.screen;
  state.pauseCursor = 0;
  state.screen = "paused";
  return true;
};

GM.resume = function (state) {
  if (state.screen !== "paused") return false;
  state.screen = state.resumeTo || "play";
  return true;
};

GM.toTitle = function (state) {
  state.screen = "title";
  state.menuCursor = state.run ? 0 : 1;
  state.events = [];
};

GM.moveMoles = function (state, dt) {
  for (var i = 0; i < state.items.length; i++) {
    var it = state.items[i];
    if (it.type !== "mole") continue;
    it.x += it.dir * it.speed * dt;
    if (it.x < it.minX) { it.x = it.minX; it.dir = 1; }
    if (it.x > it.maxX) { it.x = it.maxX; it.dir = -1; }
  }
};

GM.stepHook = function (state, dt) {
  var hook = state.hook;
  if (hook.state === "out") {
    hook.len += GM.OUT_SPEED * dt;
    var p = GM.tip(hook);
    for (var i = 0; i < state.items.length; i++) {
      var it = state.items[i];
      var dx = it.x - p.x, dy = it.y - p.y;
      if (dx * dx + dy * dy <= (it.r + 4) * (it.r + 4)) {
        GM.attach(state, i);
        return;
      }
    }
    if (hook.len >= GM.MAX_ROPE || p.x < 3 || p.x > GM.W - 3 || p.y > GM.H - 2) {
      hook.state = "back";
    }
    return;
  }
  if (hook.state !== "back") return;

  if (hook.item && hook.item.kind === "tnt") {
    hook.item.fuse -= dt;
    if (hook.item.fuse <= 0) {
      var q = GM.heldPos(hook);
      GM.explode(state, q.x, q.y);
      return;
    }
  }
  var speed = hook.item ? GM.retractSpeed(hook.item, state.strength) : GM.EMPTY_SPEED;
  hook.len -= speed * dt;
  if (hook.item && hook.len <= 2) {
    GM.collect(state);
    return;
  }
  if (!hook.item && hook.len <= GM.IDLE_ROPE) {
    hook.len = GM.IDLE_ROPE;
    hook.state = "swing";
  }
};

GM.update = function (state, dt) {
  dt = Math.min(0.1, Math.max(0, dt));
  if (dt <= 0) return;

  if (state.screen === "intro") {
    state.anim += dt;
    state.introT -= dt;
    if (state.hook.state === "swing") {
      state.swingT += dt;
      state.hook.angle = Math.sin(state.swingT * Math.PI * 2 / GM.PERIOD) * GM.SWING;
    }
    if (state.introT <= 0) {
      state.screen = "play";
      state.time = GM.LEVEL_TIME;
      state.lastSec = GM.LEVEL_TIME;
    }
    return;
  }
  if (state.screen !== "play") return;

  state.anim += dt;
  state.time -= dt;
  if (state.time <= 0) {
    state.time = 0;
    GM.finishLevel(state);
    return;
  }
  var sec = Math.ceil(state.time);
  if (sec !== state.lastSec) {
    state.lastSec = sec;
    if (sec <= 10) state.events.push("tick");
  }

  if (state.hook.state === "swing") {
    state.swingT += dt;
    state.hook.angle = Math.sin(state.swingT * Math.PI * 2 / GM.PERIOD) * GM.SWING;
  }
  GM.moveMoles(state, dt);
  if (state.bomb) {
    GM.updateBomb(state, dt);
  } else {
    var left = dt;
    while (left > 0 && state.screen === "play") {
      var h = Math.min(0.016, left);
      GM.stepHook(state, h);
      left -= h;
    }
  }
  /* nothing left to catch: do not make the player sit out the rest of the clock */
  if (state.screen === "play" && state.items.length === 0 && !state.hook.item) {
    GM.finishLevel(state);
    return;
  }
  GM.updateEffects(state, dt);
  state.shake = Math.max(0, state.shake - dt);
};

<script data-src="src/20-art.js">
/* 矿工老张: the four-tone picture. The game world is 160x144, but the picture is
   painted into a 320x288 indexed buffer: items and effects get twice the detail,
   and every visible pixel is still one of the four palette colours. */
var GM = (typeof GM !== "undefined" && GM) || {};

GM.INK = 0;
GM.DARK = 1;
GM.MID = 2;
GM.PAPER = 3;
GM.CLEAR = 255;
GM.RGB = [[31, 42, 20], [74, 90, 50], [125, 138, 88], [163, 173, 126]];
GM.RGB32 = GM.RGB.map(function (c) { return ((255 << 24) | (c[2] << 16) | (c[1] << 8) | c[0]) >>> 0; });

/* ---- the 320x288 framebuffer ---- */

GM.bput = function (buf, x, y, c) {
  x = x | 0; y = y | 0;
  if (x >= 0 && x < GM.BW && y >= 0 && y < GM.BH) buf[y * GM.BW + x] = c;
};

GM.brect = function (buf, x, y, w, h, c) {
  x = x | 0; y = y | 0; w = w | 0; h = h | 0;
  var x0 = Math.max(0, x), x1 = Math.min(GM.BW, x + w);
  var y0 = Math.max(0, y), y1 = Math.min(GM.BH, y + h);
  for (var yy = y0; yy < y1; yy++) {
    var row = yy * GM.BW;
    for (var xx = x0; xx < x1; xx++) buf[row + xx] = c;
  }
};

GM.bline = function (buf, x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0);
  x1 = Math.round(x1); y1 = Math.round(y1);
  var dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
  var dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  var err = dx + dy;
  for (;;) {
    GM.bput(buf, x0, y0, c);
    if (x0 === x1 && y0 === y1) break;
    var e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
};

GM.blineWide = function (buf, x0, y0, x1, y1, c, thick) {
  x0 = Math.round(x0); y0 = Math.round(y0);
  x1 = Math.round(x1); y1 = Math.round(y1);
  thick = thick || 1;
  var off = thick >> 1;
  var dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
  var dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  var err = dx + dy;
  for (;;) {
    GM.brect(buf, x0 - off, y0 - off, thick, thick, c);
    if (x0 === x1 && y0 === y1) break;
    var e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
};

GM.bellipse = function (buf, cx, cy, rx, ry, c) {
  cx = Math.round(cx); cy = Math.round(cy);
  for (var dy = -ry; dy <= ry; dy++) {
    var w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / ((ry + 0.5) * (ry + 0.5)))));
    GM.brect(buf, cx - w, cy + dy, w * 2 + 1, 1, c);
  }
};

/* world-space helpers: the game still thinks in 160x144 */
GM.put = function (buf, x, y, c) {
  GM.brect(buf, Math.round(x) * GM.SCALE, Math.round(y) * GM.SCALE, GM.SCALE, GM.SCALE, c);
};
GM.rect = function (buf, x, y, w, h, c) {
  GM.brect(buf, Math.round(x) * GM.SCALE, Math.round(y) * GM.SCALE, Math.round(w) * GM.SCALE, Math.round(h) * GM.SCALE, c);
};
GM.line = function (buf, x0, y0, x1, y1, c) {
  GM.blineWide(buf, x0 * GM.SCALE, y0 * GM.SCALE, x1 * GM.SCALE, y1 * GM.SCALE, c, GM.SCALE);
};
GM.ellipse = function (buf, cx, cy, rx, ry, c) {
  GM.bellipse(buf, cx * GM.SCALE, cy * GM.SCALE, rx * GM.SCALE, ry * GM.SCALE, c);
};

/* ---- sprites: these live in their own little buffers at 2x ---- */

GM.sprite = function (w, h) {
  var b = new Uint8Array(w * h);
  b.fill(GM.CLEAR);
  return { w: w, h: h, b: b };
};

GM.sput = function (s, x, y, c) {
  x = x | 0; y = y | 0;
  if (x >= 0 && x < s.w && y >= 0 && y < s.h) s.b[y * s.w + x] = c;
};

GM.srect = function (s, x, y, w, h, c) {
  for (var yy = y; yy < y + h; yy++) for (var xx = x; xx < x + w; xx++) GM.sput(s, xx, yy, c);
};

GM.sline = function (s, x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  var dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
  var dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  var err = dx + dy;
  for (;;) {
    GM.sput(s, x0, y0, c);
    if (x0 === x1 && y0 === y1) break;
    var e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
};

GM.sellipse = function (s, cx, cy, rx, ry, c) {
  cx = Math.round(cx); cy = Math.round(cy);
  for (var dy = -ry; dy <= ry; dy++) {
    var w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / ((ry + 0.5) * (ry + 0.5)))));
    GM.srect(s, cx - w, cy + dy, w * 2 + 1, 1, c);
  }
};

/* a one-pixel ink edge around everything already drawn in a sprite */
GM.soutline = function (s, ink) {
  var copy = s.b.slice();
  for (var y = 0; y < s.h; y++) {
    for (var x = 0; x < s.w; x++) {
      if (copy[y * s.w + x] === GM.CLEAR) continue;
      if (x === 0 || y === 0 || x === s.w - 1 || y === s.h - 1 ||
          copy[y * s.w + x - 1] === GM.CLEAR || copy[y * s.w + x + 1] === GM.CLEAR ||
          copy[(y - 1) * s.w + x] === GM.CLEAR || copy[(y + 1) * s.w + x] === GM.CLEAR) {
        s.b[y * s.w + x] = ink;
      }
    }
  }
};

GM.pointIn = function (poly, x, y) {
  var inside = false;
  for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    var xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
};

GM.blob = function (w, h, seed, base, shadow, highlight, speck) {
  var s = GM.sprite(w, h);
  var rng = GM.rng(seed);
  var cx = w / 2, cy = h / 2, rx = w / 2 - 1.5, ry = h / 2 - 1.5;
  var n = 12 + Math.floor(rng() * 4), poly = [], i;
  for (i = 0; i < n; i++) {
    var a = i / n * Math.PI * 2;
    var k = 0.82 + rng() * 0.16;
    poly.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
  }
  for (var y = 0; y < h; y++) {
    for (var x = 0; x < w; x++) {
      if (!GM.pointIn(poly, x + 0.5, y + 0.5)) continue;
      s.b[y * w + x] = base;
      if (x * 0.5 + y * 0.9 > (w * 0.5 + h * 0.9) * 0.68) s.b[y * w + x] = shadow;
    }
  }
  GM.soutline(s, GM.INK);
  if (highlight) {
    for (i = 0; i < 4; i++) {
      var hx = Math.round(cx - rx * 0.45 + rng() * rx * 0.35);
      var hy = Math.round(cy - ry * 0.45 + rng() * ry * 0.2);
      if (s.b[hy * w + hx] !== GM.CLEAR) s.b[hy * w + hx] = GM.PAPER;
    }
  }
  if (speck) {
    /* a rock gets a crack, not a row of dots */
    GM.sline(s, Math.round(cx - rx * 0.35), Math.round(cy - ry * 0.1), Math.round(cx + rx * 0.2), Math.round(cy + ry * 0.45), GM.INK);
    GM.sline(s, Math.round(cx - rx * 0.35), Math.round(cy - ry * 0.1), Math.round(cx - rx * 0.65), Math.round(cy - ry * 0.35), GM.INK);
  }
  return s;
};

GM.diamondSprite = function () {
  var s = GM.sprite(28, 28);
  var poly = [[14, 2], [26, 12], [14, 26], [2, 12]];
  for (var y = 0; y < 28; y++) for (var x = 0; x < 28; x++) if (GM.pointIn(poly, x + 0.5, y + 0.5)) GM.sput(s, x, y, GM.PAPER);

GM.makeBackground = function (state) {
  var b = new Uint8Array(GM.BW * GM.BH);
  var x, y, i, rng, len;
  GM.rect(b, 0, 0, GM.W, GM.H, GM.DARK);
  GM.rect(b, 0, 0, GM.W, GM.GROUND, GM.PAPER);

  /* low hills at the edges, so the sky is not an empty band */
  for (x = 0; x < GM.W; x++) {
    var lh = x < 56 ? 3 + Math.round(2 * Math.sin(x / 7)) : 0;
    var rh = x > 104 ? 3 + Math.round(2 * Math.sin((160 - x) / 6)) : 0;
    var hh = Math.max(lh, rh);
    if (hh > 0) GM.rect(b, x, GM.GROUND - hh, 1, hh, GM.MID);
  }
  GM.rect(b, 0, GM.GROUND - 1, GM.W, 2, GM.INK);

  /* a small lantern on the left, the only light down here */
  GM.rect(b, 8, 12, 2, 10, GM.DARK);
  GM.rect(b, 5, 4, 8, 1, GM.INK);
  GM.rect(b, 4, 5, 10, 8, GM.INK);
  GM.rect(b, 5, 6, 8, 6, GM.PAPER);
  GM.rect(b, 7, 7, 4, 4, GM.MID);
  GM.rect(b, 8, 8, 2, 2, GM.PAPER);
  GM.rect(b, 5, 12, 8, 1, GM.INK);
  GM.rect(b, 6, 3, 6, 1, GM.DARK);

  /* a clean, slightly lighter seam just under the grass, then quiet soil */
  GM.rect(b, 0, GM.GROUND + 1, GM.W, 5, GM.MID);
  GM.rect(b, 0, GM.GROUND + 6, GM.W, 1, GM.DARK);
  rng = GM.rng((state.levelSeed || 1) ^ 0x9e3779b9);
  var top = (GM.GROUND + 2) * GM.SCALE;
  var bottom = GM.BH - 3;
  for (i = 0; i < 34; i++) {
    x = 4 + Math.floor(rng() * (GM.BW - 8));
    y = (GM.GROUND + 2) * GM.SCALE + Math.floor(rng() * 8);
    GM.bput(b, x, y, GM.DARK);
  }
  for (i = 0; i < 150; i++) {
    x = 4 + Math.floor(rng() * (GM.BW - 8));
    y = top + Math.floor(Math.pow(rng(), 1.6) * (bottom - top));
    GM.bput(b, x, y, rng() < 0.78 ? GM.MID : GM.DARK);
    if (rng() < 0.18) GM.brect(b, x, y, 2, 2, rng() < 0.5 ? GM.MID : GM.DARK);
  }
  for (i = 0; i < 18; i++) {
    x = 4 + Math.floor(rng() * (GM.BW - 44));
    y = top + 8 + Math.floor(rng() * (bottom - top - 14));
    len = 8 + Math.floor(rng() * 26);
    GM.bline(b, x, y, x + len, y + (rng() < 0.5 ? 0 : 2), rng() < 0.6 ? GM.DARK : GM.MID);
  }
  for (i = 0; i < 8; i++) {
    x = 6 + Math.floor(rng() * (GM.BW - 12));
    y = top + 10 + Math.floor(rng() * (bottom - top - 18));
    GM.brect(b, x, y, 3, 2, GM.MID);
    GM.bput(b, x, y, GM.DARK);
  }
  return b;
};

GM.drawItemAt = function (buf, it, bx, by, anim) {
  var spr = GM.SPR[it.sprite];
  if (!spr) return;
  var x = Math.round(bx - spr.w / 2);
  var y = Math.round(by - spr.h / 2);
  GM.spriteDraw(buf, spr, x, y);
  if (it.kind === "gem" && Math.sin(anim * 4 + it.x) > 0.86) {
    GM.brect(buf, x + spr.w - 5, y + 4, 2, 2, GM.PAPER);
    GM.bput(buf, x + spr.w - 6, y + 6, GM.MID);
  }
  if (it.kind === "tnt" && it.fuse > 0 && Math.sin(anim * 30) > 0) {
    GM.brect(buf, x + 23, y + 1, 3, 3, GM.PAPER);
    GM.bput(buf, x + 22, y + 3, GM.MID);
  }
};

GM.drawMole = function (buf, it, anim) {
  var d = it.dir, S = GM.SCALE;
  var x = Math.round(it.x * S), y = Math.round(it.y * S);
  var step = Math.sin(anim * 14 + it.x) > 0 ? 2 : 0;
  GM.bellipse(buf, x, y, 16, 10, GM.INK);
  GM.bellipse(buf, x, y, 14, 8, GM.MID);
  GM.bellipse(buf, x, y + 5, 10, 4, GM.DARK);
  GM.bellipse(buf, x + d * 10, y - 4, 8, 8, GM.INK);
  GM.bellipse(buf, x + d * 10, y - 4, 6, 6, GM.MID);
  GM.bellipse(buf, x + d * 4, y - 12, 4, 4, GM.INK);
  GM.bellipse(buf, x + d * 4, y - 12, 2, 2, GM.DARK);
  GM.brect(buf, x + d * 16, y - 4, 4, 4, GM.PAPER);
  GM.bput(buf, x + d * 18, y - 2, GM.INK);
  GM.brect(buf, x + d * 12, y - 6, 2, 2, GM.INK);
  GM.blineWide(buf, x - 6, y + 8, x - 8, y + 12 + step, GM.INK, 2);
  GM.blineWide(buf, x + 6, y + 8, x + 8, y + 12 + (2 - step), GM.INK, 2);
  GM.blineWide(buf, x - d * 14, y, x - d * 20, y - 4, GM.INK, 2);
  var mini = it.carry === "diamond" ? GM.SPR.miniGem : GM.SPR.miniGold;
  var mx = x + d * 12 - (d < 0 ? mini.w : 0);
  var my = y - 20;
  GM.spriteDraw(buf, mini, mx, my);
};

GM.drawRope = function (buf, hook) {
  var tip = GM.tip(hook);
  var a = hook.angle, dx = Math.sin(a), dy = Math.cos(a);
  GM.line(buf, GM.ANCHOR.x, GM.ANCHOR.y, tip.x - dx, tip.y - dy, GM.INK);
  for (var d = 7; d < hook.len - 3; d += 9) {
    GM.put(buf, GM.ANCHOR.x + dx * d, GM.ANCHOR.y + dy * d, GM.PAPER);
  }
};

GM.drawHook = function (buf, hook) {
  var tip = GM.tip(hook);
  var a = hook.angle, dx = Math.sin(a), dy = Math.cos(a);
  var px = Math.cos(a), py = -Math.sin(a);
  GM.line(buf, tip.x - dx * 3, tip.y - dy * 3, tip.x, tip.y, GM.INK);
  var closed = !!hook.item;
  for (var side = -1; side <= 1; side += 2) {
    var x1 = tip.x + dx * 1.5 + px * side * 1.8;
    var y1 = tip.y + dy * 1.5 + py * side * 1.8;
    var x2 = tip.x + dx * 4 + px * side * (closed ? 1.1 : 3.7);
    var y2 = tip.y + dy * 4 + py * side * (closed ? 1.1 : 3.7);
    GM.line(buf, tip.x, tip.y, x1, y1, GM.INK);
    GM.line(buf, x1, y1, x2, y2, GM.INK);
    GM.put(buf, x2, y2, GM.PAPER);
  }
  GM.rect(buf, tip.x - 1, tip.y - 1, 2, 2, GM.INK);
};

GM.sweatDrop = function (buf, bx, by) {
  GM.brect(buf, bx, by, 3, 4, GM.INK);
  GM.brect(buf, bx + 1, by, 1, 2, GM.PAPER);
  GM.bput(buf, bx + 1, by + 2, GM.MID);
};

GM.drawMiner = function (buf, state) {
  var hook = state.hook;
  var bob = hook.state === "swing" && Math.sin(state.anim * 4) > 0.35 ? -1 : 0;
  var lean = hook.state === "out" ? 1 : hook.state === "back" ? -1 : 0;
  var bx = 80 + lean;
  var by = bob;
  var ground = 22;

  /* boots and legs stay on the ground; the body bobs above them */
  GM.rect(buf, bx - 8, ground - 1, 5, 2, GM.INK);
  GM.rect(buf, bx + 3, ground - 1, 5, 2, GM.INK);
  GM.rect(buf, bx - 6, ground - 4, 3, 3, GM.DARK);
  GM.rect(buf, bx + 3, ground - 4, 3, 3, GM.DARK);

  /* body, shirt and overalls */
  GM.rect(buf, bx - 7, 12 + by, 14, 7, GM.INK);
  GM.rect(buf, bx - 6, 13 + by, 12, 5, GM.MID);
  GM.rect(buf, bx - 5, 14 + by, 10, 4, GM.DARK);
  GM.rect(buf, bx - 4, 13 + by, 1, 5, GM.PAPER);
  GM.rect(buf, bx + 3, 13 + by, 1, 5, GM.PAPER);

  /* head, eyes and a big moustache */
  GM.rect(buf, bx - 5, 6 + by, 10, 7, GM.INK);
  GM.rect(buf, bx - 4, 7 + by, 8, 5, GM.PAPER);
  GM.put(buf, bx - 2, 9 + by, GM.INK);
  GM.put(buf, bx + 2, 9 + by, GM.INK);
  GM.rect(buf, bx - 3, 11 + by, 6, 1, GM.DARK);
  GM.put(buf, bx - 4, 11 + by, GM.DARK);
  GM.put(buf, bx + 4, 11 + by, GM.DARK);

  /* a low safety cap: crown, broad brim and a front peak */
  GM.ellipse(buf, bx, 4 + by, 8, 3, GM.INK);
  GM.ellipse(buf, bx, 4 + by, 7, 2, GM.PAPER);
  GM.rect(buf, bx - 9, 6 + by, 18, 2, GM.INK);
  GM.rect(buf, bx - 8, 6 + by, 16, 1, GM.PAPER);
  GM.rect(buf, bx + 9, 7 + by, 3, 1, GM.INK);
  GM.rect(buf, bx + 9, 7 + by, 2, 1, GM.PAPER);
  GM.rect(buf, bx - 1, 2 + by, 3, 2, GM.MID);
  GM.put(buf, bx, 2 + by, GM.PAPER);

  /* two hands on the rope, with a small coil at the winch */
  GM.line(buf, bx - 7, 13 + by, 79, 17, GM.INK);
  GM.line(buf, bx + 7, 13 + by, 81, 17, GM.INK);
  GM.rect(buf, 78, 16, 2, 2, GM.PAPER);
  GM.rect(buf, 81, 16, 2, 2, GM.PAPER);
  GM.rect(buf, 79, 17, 2, 2, GM.DARK);
  GM.put(buf, 80, 18, GM.PAPER);

  /* sweat: drops run downward, faster as they fall */
  if (hook.item) {
    var t = state.anim, side, sx, sy, p;
    for (var i = 0; i < 4; i++) {
      side = i < 2 ? -1 : 1;
      p = (t * 0.8 + i * 0.23) % 1;
      sx = bx + side * (9 + (i % 2) * 2) + Math.sin(t * 5 + i) * 0.7;
      sy = 5 + by + p * p * 12;
      GM.sweatDrop(buf, Math.round(sx * GM.SCALE), Math.round(sy * GM.SCALE));
    }
    for (i = 0; i < 2; i++) {
      p = (t * 0.9 + i * 0.4) % 1;
      sx = bx - 3 + i * 7;
      sy = 9 + by + p * p * 8;
      GM.sweatDrop(buf, Math.round(sx * GM.SCALE), Math.round(sy * GM.SCALE));
    }
    for (i = 0; i < 2; i++) {
      p = (t * 0.7 + i * 0.35) % 1;
      side = i ? 1 : -1;
      sx = bx + side * 8;
      sy = 13 + by + p * p * 5;
      GM.sweatDrop(buf, Math.round(sx * GM.SCALE), Math.round(sy * GM.SCALE));
    }
  }

  if (state.bomb && state.bomb.t < 0.18) {
    var bp = GM.bombPos(state.bomb);
    GM.line(buf, bx + 7, 13 + by, bp.x, bp.y, GM.INK);
  }
};

GM.drawDynamite = function (buf, state) {
  if (state.dynamite <= 0) return;
  var bx = 94 * GM.SCALE, by = 3 * GM.SCALE;
  GM.spriteDraw(buf, GM.SPR.dynIcon, bx, by);
  GM.textMain(buf, "×" + state.dynamite, bx + 18, by + 4, GM.INK, GM.SCALE);
};

GM.draw = function (ctx, state) {
  if (!GM.SPR) GM.initArt();
  var key = state.levelSeed;
  if (!state.bg || state.bgKey !== key) {
    state.bg = GM.makeBackground(state);
    state.bgKey = key;
  }
  var buf = GM._buf || (GM._buf = new Uint8Array(GM.BW * GM.BH));
  buf.set(state.bg);
  var i, it, tip, p;
  for (i = 0; i < state.items.length; i++) {
    it = state.items[i];
    if (it.type !== "mole") GM.drawItemAt(buf, it, it.x * GM.SCALE, it.y * GM.SCALE, state.anim);
  }
  for (i = 0; i < state.items.length; i++) {
    it = state.items[i];
    if (it.type === "mole") GM.drawMole(buf, it, state.anim);
  }
  GM.drawRope(buf, state.hook);
  if (state.hook.item) {
    var held = GM.heldPos(state.hook);
    tip = GM.tip(state.hook);
    it = state.hook.item;
    if (it.type === "mole") {
      var ox = it.x, oy = it.y;
      it.x = held.x; it.y = held.y;
      GM.drawMole(buf, it, state.anim);
      it.x = ox; it.y = oy;
    } else {
      GM.drawItemAt(buf, it, held.x * GM.SCALE, held.y * GM.SCALE, state.anim);
    }
    GM.brect(buf, Math.round(tip.x * GM.SCALE) - 2, Math.round(tip.y * GM.SCALE) - 5, 4, 2, GM.PAPER);
  }
  GM.drawHook(buf, state.hook);
  GM.drawMiner(buf, state);
  GM.drawDynamite(buf, state);
  if (state.bomb) {
    var bp = GM.bombPos(state.bomb);
    GM.spriteDraw(buf, GM.SPR.bomb, Math.round(bp.x * GM.SCALE) - 8, Math.round(bp.y * GM.SCALE) - 8);
    GM.bput(buf, Math.round(bp.x * GM.SCALE) + 4, Math.round(bp.y * GM.SCALE) - 8, GM.PAPER);
  }

  for (i = 0; i < state.blasts.length; i++) {
    var bl = state.blasts[i], k = bl.t / bl.life;
    var rr = (4 + k * 27) * GM.SCALE;
    var bx = bl.x * GM.SCALE, by = bl.y * GM.SCALE;
    for (var a = 0; a < Math.PI * 2; a += 0.18) {
      GM.brect(buf, bx + Math.cos(a) * rr, by + Math.sin(a) * rr, 2, 2,
        (i + Math.floor(a * 5)) % 2 ? GM.PAPER : GM.MID);
    }
    GM.brect(buf, bx - 2, by - 2, 4, 4, GM.PAPER);
  }
  for (i = 0; i < state.particles.length; i++) {
    p = state.particles[i];
    GM.brect(buf, p.x * GM.SCALE, p.y * GM.SCALE, 2, 2,
      p.color === "paper" ? GM.PAPER : p.color === "dark" ? GM.DARK : GM.MID);
  }
  for (i = 0; i < state.floats.length; i++) {
    var f = state.floats[i];
    var tw = GM.textWidth(f.text, GM.SCALE);
    var tx = f.x * GM.SCALE - tw / 2;
    var ty = f.y * GM.SCALE - (f.t / f.life) * 9 * GM.SCALE;
    GM.textMain(buf, f.text, Math.round(tx), Math.round(ty), GM.INK, GM.SCALE);
  }

  var sx = 0, sy = 0;
  if (state.shake > 0) {
    sx = Math.round((Math.random() * 2 - 1) * 6);
    sy = Math.round((Math.random() * 2 - 1) * 4);
  }
  GM.present(ctx, buf, sx, sy);
};

GM.present = function (ctx, buf, sx, sy) {
  if (!GM._img) {
    GM._img = ctx.createImageData(GM.BW, GM.BH);
    GM._u32 = new Uint32Array(GM._img.data.buffer);
  }
  var u32 = GM._u32;
  for (var y = 0; y < GM.BH; y++) {
    for (var x = 0; x < GM.BW; x++) {
      var xx = x - (sx || 0), yy = y - (sy || 0), t;
      if (xx < 0 || xx >= GM.BW || yy < 0 || yy >= GM.BH) t = GM.PAPER;
      else {
        t = buf[yy * GM.BW + xx];
        if (t === GM.CLEAR) t = GM.PAPER;
      }
      u32[y * GM.BW + x] = GM.RGB32[t];
    }
  }
  ctx.putImageData(GM._img, 0, 0);
};

GM.spriteCanvas = function (spr) {
  var c = document.createElement("canvas");
  c.width = spr.w; c.height = spr.h;
  var ctx = c.getContext("2d");
  var img = ctx.createImageData(spr.w, spr.h);
  for (var i = 0; i < spr.b.length; i++) {
    var t = spr.b[i], o = i * 4;
    if (t === GM.CLEAR) { img.data[o + 3] = 0; continue; }
    var rgb = GM.RGB[t] || GM.RGB[GM.PAPER];
    img.data[o] = rgb[0]; img.data[o + 1] = rgb[1]; img.data[o + 2] = rgb[2]; img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c;
};

GM.iconCanvas = function () {
  if (GM._iconCv) return GM._iconCv;
  var b = new Uint8Array(16 * 16);
  b.fill(GM.PAPER);
  for (var y = 0; y < 16; y++) {
    for (var x = 0; x < 16; x++) {
      var ch = GM.ICON[y].charAt(x);
      if (ch !== ".") b[y * 16 + x] = +ch;
    }
  }
  var c = document.createElement("canvas");
  c.width = 16; c.height = 16;
  var ctx = c.getContext("2d");
  var img = ctx.createImageData(16, 16);
  for (var i = 0; i < 256; i++) {
    var t = b[i], rgb = GM.RGB[t] || GM.RGB[GM.PAPER], o = i * 4;
    img.data[o] = rgb[0]; img.data[o + 1] = rgb[1]; img.data[o + 2] = rgb[2]; img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  GM._iconCv = c;
  return c;
};

GM.initArt();
</script>
<script data-src="src/30-ui.js">
/* 矿工老张: DOM screens, the chin buttons, touch, sound and the page loop. */
var GM = (typeof GM !== "undefined" && GM) || {};

GM.ui = (function () {
  var LANG = (typeof PAD !== "undefined" && PAD.lang === "en") ? "en" : "zh";
  var T = GM.text(LANG);
  var state, ctx, cv, ov, introEl, foot, lv, cash, tm, bar;
  var last = 0, lastScreen = "", lastHud = "", lastFoot = "", lastIntro = "";
  var lastJingleId = 0;

  function $(id) { return document.getElementById(id); }
  function money(n) { return "$" + GM.money(n); }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function init(st) {
    state = st;
    cv = $("c");
    ctx = cv.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ov = $("ov");
    introEl = $("intro");
    foot = $("foot");
    lv = $("lv");
    cash = $("cash");
    tm = $("tm");
    bar = $("barfill");
    document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
    document.title = T.title;
    cv.addEventListener("pointerdown", onCanvas);
    ov.addEventListener("click", onOverlay);
    addEventListener("resize", fit);
    document.addEventListener("visibilitychange", onVis);
    if (typeof PAD !== "undefined" && PAD.on) PAD.on("press", onPad);
    fit();
    updateHud(true);
    updateFoot(true);
  }

  function setBest(info) {
    var incoming = (info && info.best) || { level: 0, bank: 0 };
    if (!GM.better(state.best, incoming)) state.best = incoming;
    state.bestBlocked = !(info && info.ok);
    state.saveMsg = info && info.corrupt ? T.saveFail : info && info.newer ? T.saveNewer : "";
  }

  function setRun(info) {
    state.run = (info && info.run) || null;
    state.runBlocked = !(info && info.ok);
    state.runMsg = info && info.corrupt ? T.runFail : info && info.newer ? T.runNewer : "";
    state.runDirty = false;
    if (state.run) state.menuCursor = 0;
    else if (state.menuCursor === 0) state.menuCursor = 1;
  }

  function saveRun() {
    if (!state.runDirty || state.runBlocked) return;
    if (typeof PAD === "undefined") return;
    try {
      if (state.run) {
        if (PAD.save) PAD.save("run", GM.runPayload(state));
        if (PAD.setSchema) PAD.setSchema(1);
      } else if (PAD.remove) {
        PAD.remove("run");
      }
      state.runDirty = false;
    } catch (e) {
      state.runBlocked = true;
      state.runMsg = T.runWrite;
    }
  }

  function row(sel, act, name, sub, off) {
    return '<button type="button" class="mrow' + (sel ? " sel" : "") + (off ? " off" : "") + '" data-act="' + act + '">' +
      "<b>" + esc(name) + "</b>" + (sub ? "<small>" + esc(sub) + "</small>" : "") + "</button>";
  }

  function codexValue(type) {
    var it = GM.ITEMS[type];
    if (type === "bag") return money(it.min) + "-" + money(it.max);
    if (type === "tnt") return T.codexBoom;
    if (type === "mole") return money(GM.ITEMS.goldM.value) + " / " + money(GM.ITEMS.diamond.value);
    return money(it.value);
  }

  function codexWeight(type) {
    var w = GM.ITEMS[type].weight;
    return w <= 1 ? T.codexLight : w <= 2.4 ? T.codexMid : T.codexHeavy;
  }

  function shell(cls, body, footer) {
    return '<div class="sbody ' + cls + '">' + body + '</div><div class="ofoot">' + esc(footer) + "</div>";
  }

  function render(screen) {
    var i, item, have, can, sel, price, rows, best, warn, extra, rec, next, target, short;
    if (screen === "title") {
      best = state.best.level > 0
        ? GM.fmt(T.best, { l: state.best.level, b: GM.money(state.best.bank) })
        : T.noBest;
      warn = (state.saveMsg ? '<p class="warn">' + esc(state.saveMsg) + "</p>" : "") +
             (state.runMsg ? '<p class="warn">' + esc(state.runMsg) + "</p>" : "");
      var runSub = state.run
        ? GM.fmt(T.menuContinueAt, { n: state.run.level, b: GM.money(state.run.bank) })
        : T.menuNoRun;
      return shell("title center",
        '<canvas id="logo" width="16" height="16" aria-hidden="true"></canvas>' +
        "<h1>" + esc(T.title) + "</h1>" +
        '<p class="sub">' + esc(T.sub) + "</p>" +
        '<div class="menu">' +
          row(state.menuCursor === 0, "continue", T.menuContinue, runSub, !state.run) +
          row(state.menuCursor === 1, "new", T.menuNew, T.menuNewSub, false) +
          row(state.menuCursor === 2, "codex", T.menuCodex, T.menuCodexSub, false) +
        "</div>" +
        '<p class="best">' + esc(best) + "</p>" + warn,
        T.menuFoot);
    }
    if (screen === "paused") {
      return shell("center",
        "<h1>" + esc(T.pause) + "</h1>" +
        "<p>" + esc(GM.fmt(T.level, { n: state.level })) + " · " + esc(GM.fmt(T.shopCash, { b: GM.money(state.bank) })) + "</p>" +
        '<div class="menu">' +
          row(state.pauseCursor === 0, "resume", T.resume, "", false) +
          row(state.pauseCursor === 1, "pauseTitle", T.pauseMenu, "", false) +
        "</div>",
        T.pauseFoot);
    }
    if (screen === "confirm") {
      var runLevel = state.run ? state.run.level : 1;
      return shell("center",
        "<h1>" + esc(T.confirmTitle) + "</h1>" +
        "<p>" + esc(GM.fmt(T.confirmText, { n: runLevel })) + "</p>" +
        '<div class="menu">' +
          row(state.confirmCursor === 0, "menu", T.confirmCancel, "", false) +
          row(state.confirmCursor === 1, "restartRun", T.confirmRestart, "", false) +
        "</div>",
        T.confirmFoot);
    }
    if (screen === "codex") {
      var cells = "";
      for (i = 0; i < GM.ITEM_ORDER.length; i++) {
        var ct = GM.ITEM_ORDER[i];
        cells += '<div class="ccell"><canvas width="32" height="32" data-item="' + ct + '" aria-hidden="true"></canvas>' +
          "<b>" + esc(T.codexNames[i]) + "</b><span>" + esc(codexValue(ct)) + "</span>" +
          "<em>" + esc(codexWeight(ct)) + "</em></div>";
      }
      return shell("codex",
        "<h1>" + esc(T.codexTitle) + "</h1>" +
        '<p class="small">' + esc(T.codexHint) + "</p>" +
        '<div class="cgrid">' + cells + "</div>" +
        '<button type="button" class="primary codexback" data-act="menu">' + esc(T.codexBack) + "</button>",
        T.codexFoot);
    }
    if (screen === "clear") {
      extra = Math.max(0, state.bank - state.target);
      rec = state.newBest ? '<p class="best">' + esc(T.record) + "</p>" : "";
      return shell("center",
        "<h1>" + esc(T.clear) + "</h1>" +
        '<p class="big cashline">' + esc(GM.fmt(T.clearLine, { b: GM.money(state.bank), t: GM.money(state.target) })) + "</p>" +
        '<p class="small">' + esc(GM.fmt(T.extra, { d: GM.money(extra) })) + "</p>" + rec +
        '<button type="button" class="primary" data-act="shop">' + esc(T.shopBtn) + "</button>",
        T.footClear);
    }
    if (screen === "shop") {
      next = state.level + 1;
      target = GM.targetFor(next);
      rows = "";
      for (i = 0; i < GM.SHOP.length; i++) {
        item = GM.SHOP[i];
        have = state[item.key] || 0;
        can = have < item.max && state.bank >= item.price;
        sel = state.shopCursor === i;
        if (have >= item.max) price = T.max;
        else if (state.bank < item.price) price = GM.fmt(T.shortPrice, { d: GM.money(item.price - state.bank) });
        else price = money(item.price);
        rows += '<button type="button" class="row' + (sel ? " sel" : "") + (can ? "" : " off") + '" data-act="buy" data-i="' + i + '">' +
          '<canvas class="sic" width="16" height="16" data-icon="' + ["dynIcon", "shopStrength", "shopClover", "shopBook"][i] + '" aria-hidden="true"></canvas>' +
          '<span class="nm">' + esc(T.shopNames[i]) + " <i>" + esc(GM.fmt(T.owned, { n: have, m: item.max })) + "</i>" +
          "<small>" + esc(T.shopDescs[i]) + "</small></span>" +
          '<span class="pr">' + esc(price) + "</span></button>";
      }
      return shell("shop",
        '<div class="shophead"><b>' + esc(GM.fmt(T.shopTitle, { n: next })) + "</b><span>" +
        esc(GM.fmt(T.shopCash, { b: GM.money(state.bank) })) + "</span></div>" +
        '<p class="small nextline">' + esc(GM.fmt(T.nextTarget, { t: GM.money(target) })) + "</p>" +
        rows +
        '<button type="button" class="next' + (state.shopCursor === 4 ? " sel" : "") + '" data-act="next">' + esc(T.next) + "</button>",
        T.footShop);
    }
    if (screen === "over") {
      short = Math.max(0, state.target - state.bank);
      return shell("center",
        "<h1>" + esc(T.over) + "</h1>" +
        '<p class="big">' + esc(GM.fmt(T.overShort, { d: GM.money(short) })) + "</p>" +
        '<p class="small">' + esc(GM.fmt(T.clearLine, { b: GM.money(state.bank), t: GM.money(state.target) })) + "</p>" +
        '<button type="button" class="primary" data-act="retry">' + esc(T.retry) + "</button>" +
        '<button type="button" class="ghost" data-act="title">' + esc(T.toTitle) + "</button>",
        T.footOver);
    }
    if (screen === "victory") {
      rec = state.newBest ? '<p class="best">' + esc(T.record) + "</p>" : "";
      return shell("center",
        "<h1>" + esc(T.victory) + "</h1>" +
        "<p>" + esc(T.victoryLine) + "</p>" +
        '<p class="big">' + esc(GM.fmt(T.shopCash, { b: GM.money(state.bank) })) + "</p>" + rec +
        '<button type="button" class="primary" data-act="endless">' + esc(T.keep) + "</button>" +
        '<button type="button" class="ghost" data-act="title">' + esc(T.toTitle) + "</button>",
        T.footVictory);
    }
    return "";
  }

  function post(screen) {
    var i, c, ctx2, spr;
    if (screen === "title") {
      var logo = $("logo");
      if (!logo) return;
      logo.style.width = "64px";
      logo.style.height = "64px";
      var lctx = logo.getContext("2d");
      lctx.imageSmoothingEnabled = false;
      lctx.drawImage(GM.iconCanvas(), 0, 0);
      return;
    }
    if (screen === "shop") {
      var icons = ov.querySelectorAll("canvas[data-icon]");
      for (i = 0; i < icons.length; i++) {
        c = icons[i];
        spr = GM.SPR[c.getAttribute("data-icon")];
        if (!spr) continue;
        ctx2 = c.getContext("2d");
        ctx2.imageSmoothingEnabled = false;
        ctx2.fillStyle = "#7d8a58";
        ctx2.fillRect(0, 0, c.width, c.height);
        ctx2.drawImage(GM.spriteCanvas(spr), 0, 0);
      }
    }
    if (screen === "codex") {
      var items = ov.querySelectorAll("canvas[data-item]");
      for (i = 0; i < items.length; i++) {
        c = items[i];
        var type = c.getAttribute("data-item");
        spr = GM.SPR[type === "mole" ? "moleIcon" : type];
        if (!spr) continue;
        ctx2 = c.getContext("2d");
        ctx2.imageSmoothingEnabled = false;
        ctx2.fillStyle = "#4a5a32";
        ctx2.fillRect(0, 0, c.width, c.height);
        var src = GM.spriteCanvas(spr);
        var k = Math.min(32 / spr.w, 32 / spr.h);
        var iw = spr.w * k, ih = spr.h * k;
        ctx2.drawImage(src, (32 - iw) / 2, (32 - ih) / 2, iw, ih);
      }
    }
  }

  function enter(screen) {
    if (!state) return;
    lastScreen = screen;
    var full = screen !== "play" && screen !== "intro";
    ov.hidden = !full;
    if (full) {
      ov.innerHTML = render(screen);
      ov.scrollTop = 0;
      post(screen);
    } else {
      ov.innerHTML = "";
    }
    updateFoot(true);
    updateHud(true);
    updateIntro();
    musicFor(screen);
    saveRun();
  }

  function updateHud(force) {
    var sec = Math.ceil(state.time);
    var key = state.screen + "|" + state.level + "|" + state.bank + "|" + state.target + "|" + sec + "|" + (state.bank >= state.target);
    if (!force && key === lastHud) return;
    lastHud = key;
    lv.textContent = GM.fmt(T.level, { n: state.level });
    cash.textContent = money(state.bank) + " / " + GM.money(state.target);
    cash.className = state.bank >= state.target ? "met" : "";
    tm.textContent = GM.fmt(T.time, { n: sec });
    tm.className = sec <= 10 && state.screen === "play" ? "low" : "";
    bar.style.width = Math.max(0, Math.min(100, Math.round(state.bank / (state.target || 1) * 100))) + "%";
  }

  function updateFoot(force) {
    var text;
    if (state.screen === "play" || state.screen === "intro") text = state.dynamite > 0 ? T.footPlayDyn : T.footPlay;
    else if (state.screen === "paused") text = T.pauseFoot;
    else if (state.screen === "confirm") text = T.confirmFoot;
    else if (state.screen === "codex") text = T.codexFoot;
    else if (state.screen === "clear") text = T.footClear;
    else if (state.screen === "shop") text = T.footShop;
    else if (state.screen === "over") text = T.footOver;
    else if (state.screen === "victory") text = T.footVictory;
    else text = T.menuFoot;
    if (!force && text === lastFoot) return;
    lastFoot = text;
    foot.textContent = text;
  }

  function updateIntro() {
    if (state.screen !== "intro") {
      if (!introEl.hidden) introEl.hidden = true;
      lastIntro = "";
      return;
    }
    var tip = state.level === 1 ? T.tip1 : state.level === 4 ? T.tip4 : state.level === 7 ? T.tip7 : T.tipDefault;
    var html = "<b>" + esc(GM.fmt(T.intro, { n: state.level, t: GM.money(state.target) })) + "</b><span>" + esc(tip) + "</span>";
    if (html === lastIntro) return;
    lastIntro = html;
    introEl.innerHTML = html;
    introEl.hidden = false;
  }

  function sfx(sound) {
    if (typeof PAD === "undefined" || !PAD.sfx) return;
    try { PAD.sfx(sound); }
    catch (e) { try { if (typeof sound !== "string") PAD.sfx("hit"); } catch (e2) {} }
  }

  function pump() {
    var n = 0;
    while (state.events.length && n++ < 60) {
      var ev = state.events.shift();
      if (ev === "fire") sfx("tap");
      else if (ev === "throw") sfx(GM.SFX.throw);
      else if (ev === "grab") sfx("hit");
      else if (ev === "coin") sfx("coin");
      else if (ev === "gem") sfx(GM.SFX.chime);
      else if (ev === "junk") sfx("miss");
      else if (ev === "boom") sfx(GM.SFX.boom);
      else if (ev === "tick") sfx("tick");
      else if (ev === "clear") sfx("win");
      else if (ev === "fail") sfx("lose");
      else if (ev === "buy") sfx("ok");
      else if (ev === "err") sfx("err");
      else if (ev === "move") sfx("move");
      if (ev === "clear" || ev === "fail") saveBest();
    }
  }

  function saveBest() {
    if (!state.bestDirty || state.bestBlocked) return;
    if (typeof PAD === "undefined" || !PAD.save) return;
    try {
      var r = PAD.save("best", GM.bestPayload(state));
      if (r && typeof r.catch === "function") {
        r.catch(function () { state.bestBlocked = true; state.saveMsg = T.saveWrite; });
      }
      try { if (PAD.setSchema) PAD.setSchema(1); } catch (e) {}
      state.bestDirty = false;
    } catch (e) {
      state.bestBlocked = true;
      state.saveMsg = T.saveWrite;
    }
  }

  function musicFor(screen) {
    if (typeof PAD === "undefined" || !PAD.music) return;
    if (screen === "intro") {
      if (state.jingleId !== lastJingleId) {
        lastJingleId = state.jingleId;
        try { PAD.music.play(GM.JINGLE, { loop: false }); } catch (e) {}
      }
    } else if (screen !== "play") {
      try { PAD.music.stop(); } catch (e) {}
    }
  }

  function startRun() {
    GM.startRun(state);
    enter(state.screen);
  }

  function openShop() {
    GM.openShop(state);
    enter("shop");
  }

  function shopNext() {
    GM.shopNext(state);
    pump();
    enter(state.screen);
  }

  function continueGame() {
    if (!state.run) { sfx("err"); return; }
    GM.continueRun(state);
    pump();
    enter(state.screen);
  }

  function newGame() {
    if (state.run) {
      state.screen = "confirm";
      state.confirmCursor = 0;
      enter("confirm");
    } else {
      GM.startRun(state);
      pump();
      enter(state.screen);
    }
  }

  function openCodex() {
    state.screen = "codex";
    enter("codex");
  }

  function chooseMenu() {
    if (state.menuCursor === 0) continueGame();
    else if (state.menuCursor === 1) newGame();
    else openCodex();
  }

  function onCanvas(e) {
    if (state.screen === "play") {
      GM.fire(state);
      pump();
    } else if (state.screen === "intro") {
      state.introT = 0;
    }
    e.preventDefault();
  }

  function onOverlay(e) {
    var el = e.target;
    while (el && el !== ov && !(el.getAttribute && el.getAttribute("data-act"))) el = el.parentNode;
    if (!el || el === ov) return;
    var act = el.getAttribute("data-act");
    var i = +(el.getAttribute("data-i") || 0);
    var prev = state.screen;
    if (act === "continue") continueGame();
    else if (act === "new") newGame();
    else if (act === "codex") openCodex();
    else if (act === "restartRun") { GM.startRun(state); pump(); enter(state.screen); }
    else if (act === "retry") startRun();
    else if (act === "resume") { GM.resume(state); enter(state.screen); }
    else if (act === "menu" || act === "pauseTitle" || act === "title") {
      GM.toTitle(state);
      if (prev === "codex") state.menuCursor = 2;
      enter("title");
    }
    else if (act === "shop" || act === "endless") openShop();
    else if (act === "buy") { GM.buy(state, i); pump(); enter("shop"); }
    else if (act === "next") shopNext();
    e.preventDefault();
  }

  function onPad(btn) {
    var s = state.screen;
    if (s === "title") {
      if (btn === "up" || btn === "down") {
        state.menuCursor = (state.menuCursor + (btn === "down" ? 1 : 2) + 3) % 3;
        sfx("move");
        enter("title");
        return;
      }
      if (btn === "a" || btn === "start") chooseMenu();
      return;
    }
    if (s === "confirm") {
      if (btn === "up" || btn === "down") {
        state.confirmCursor = 1 - state.confirmCursor;
        sfx("move");
        enter("confirm");
        return;
      }
      if (btn === "a" || btn === "start") {
        if (state.confirmCursor === 0) {
          GM.toTitle(state);
          enter("title");
        } else {
          GM.startRun(state);
          pump();
          enter(state.screen);
        }
      } else if (btn === "b") {
        GM.toTitle(state);
        enter("title");
      }
      return;
    }
    if (s === "codex") {
      if (btn === "a" || btn === "b" || btn === "start") {
        GM.toTitle(state);
        state.menuCursor = 2;
        enter("title");
      }
      return;
    }
    if (s === "intro") {
      if (btn === "a") { state.introT = 0; return; }
      if (btn === "start" && GM.pause(state)) enter("paused");
      return;
    }
    if (s === "play") {
      if (btn === "a") { GM.fire(state); pump(); }
      else if (btn === "b" && state.dynamite > 0) {
        if (!GM.useDynamite(state)) sfx("err");
        pump();
      } else if (btn === "start" && GM.pause(state)) enter("paused");
      return;
    }
    if (s === "paused") {
      if (btn === "up" || btn === "down") {
        state.pauseCursor = 1 - state.pauseCursor;
        sfx("move");
        enter("paused");
        return;
      }
      if (btn === "a" || btn === "start") {
        if (state.pauseCursor === 0) { GM.resume(state); enter(state.screen); }
        else { GM.toTitle(state); enter("title"); }
      } else if (btn === "b") {
        GM.resume(state);
        enter(state.screen);
      }
      return;
    }
    if (s === "clear") {
      if (btn === "a" || btn === "start") openShop();
      return;
    }
    if (s === "shop") {
      if (btn === "up") { GM.moveShop(state, -1); pump(); enter("shop"); }
      else if (btn === "down") { GM.moveShop(state, 1); pump(); enter("shop"); }
      else if (btn === "a" || btn === "start") {
        if (state.shopCursor === 4) shopNext();
        else { GM.buy(state, state.shopCursor); pump(); enter("shop"); }
      } else if (btn === "b") shopNext();
      return;
    }
    if (s === "over") {
      if (btn === "a" || btn === "start") startRun();
      else if (btn === "b") { GM.toTitle(state); enter("title"); }
      return;
    }
    if (s === "victory") {
      if (btn === "a" || btn === "start") openShop();
      else if (btn === "b") { GM.toTitle(state); enter("title"); }
    }
  }

  function onVis() {
    if (document.hidden && (state.screen === "play" || state.screen === "intro") && GM.pause(state)) enter("paused");
  }

  function fit() {
    if (!cv) return;
    var stage = $("stage");
    var aw = stage.clientWidth - 12, ah = stage.clientHeight - 12;
    if (aw < 40 || ah < 40) return;
    var k = Math.min(aw / GM.BW, ah / GM.BH);
    var dpr = window.devicePixelRatio || 1;
    var kk = Math.floor(k * dpr) / dpr;
    if (kk < k * 0.9) kk = k;
    kk = Math.max(0.75, kk);
    cv.style.width = Math.round(GM.BW * kk) + "px";
    cv.style.height = Math.round(GM.BH * kk) + "px";
  }

  function loop(now) {
    var dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    last = now;
    if (state.screen === "play" || state.screen === "intro") {
      GM.update(state, dt);
      pump();
      if (state.screen !== lastScreen) enter(state.screen);
      if (state.screen === "play" || state.screen === "intro") {
        updateHud();
        updateFoot();
        updateIntro();
        GM.draw(ctx, state);
      }
    } else if (state.screen !== lastScreen) {
      enter(state.screen);
    }
    requestAnimationFrame(loop);
  }

  return {
    init: init,
    setBest: setBest,
    setRun: setRun,
    enter: enter,
    loop: loop,
    fit: fit,
    pump: pump,
    lang: LANG,
    text: T
  };
})();
</script>
<script data-src="src/40-boot.js">
/* 矿工老张: boot, load the best run and the run in progress, then hand the page to the UI loop. */
(function () {
  var state = GM.newState();
  GM.ui.init(state);
  GM.ui.setBest({ ok: true, best: { level: 0, bank: 0 } });
  GM.ui.setRun({ ok: true, run: null });
  GM.ui.enter("title");
  requestAnimationFrame(GM.ui.loop);

  function loadKey(key) {
    return new Promise(function (resolve) {
      if (typeof PAD === "undefined" || !PAD.load) { resolve(null); return; }
      try {
        var p = PAD.load(key);
        if (p && typeof p.then === "function") p.then(resolve, function () { resolve(undefined); });
        else resolve(p);
      } catch (e) {
        resolve(undefined);
      }
    });
  }

  Promise.all([loadKey("best"), loadKey("run")]).then(function (res) {
    var bestInfo = res[0] === undefined
      ? { ok: false, corrupt: true, best: { level: 0, bank: 0 } }
      : GM.readBest(res[0]);
    var runInfo = res[1] === undefined
      ? { ok: false, corrupt: true, run: null }
      : GM.readRun(res[1]);
    GM.ui.setBest(bestInfo);
    if (state.screen === "title" && !state.run) {
      GM.ui.setRun(runInfo);
      GM.ui.enter("title");
    }
  });
})();
</script>
