<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>声音样本</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a3ad7e; color: #1f2a14; font-family: monospace; }
  body { display: flex; flex-direction: column; }
  header { padding: 8px 12px 6px; border-bottom: 2px solid #1f2a14; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  header b { font-size: 17px; }
  #now { color: #4a5a32; font-size: 14px; text-align: right; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #list { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 0 8px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  h2 { font-size: 14px; font-weight: normal; color: #4a5a32; margin: 10px 12px 2px; letter-spacing: 1px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 12px; min-height: 48px; font-size: 15px; cursor: pointer; touch-action: manipulation; }
  .row small { color: #4a5a32; font-size: 14px; white-space: nowrap; }
  .row.on small { color: #1f2a14; }
  .row.off { color: #4a5a32; }
  .row.sel { background: #1f2a14; color: #a3ad7e; }
  .row.sel small { color: #a3ad7e; }
  .mark { display: inline-block; width: 1.2em; }
  #code { border-top: 2px solid #1f2a14; padding: 8px 12px; min-height: 58px; font-size: 14px; line-height: 1.45; color: #1f2a14; background: #7d8a58; white-space: pre-wrap; word-break: break-all; }
  #keys { padding: 4px 12px 8px; font-size: 14px; color: #1f2a14; background: #7d8a58; }
</style>
</head>
<body>
<header><b id="title"></b><span id="now"></span></header>
<div id="list"></div>
<div id="code"></div>
<div id="keys"></div>
<script>
/* Sounds: a catalogue of every sound the handheld's chip makes, for players to hear and for app authors to copy.
   The two songs are original (Haowei Wu, MIT, like the rest of the app). */
var ZH = PAD.lang !== "en";
var T = ZH ? {
  title: "声音样本", music: "乐曲", amb: "环境声", named: "具名音效", custom: "自定义音效",
  keys: "↑↓ 选  A 播放  B 全停  SELECT 换组",
  keysAmb: "↑↓ 选  A 播放  ←→ 强度  B 全停",
  idle: "安静", newer: "需要新版系统", playing: "播放中", once: "单次"
} : {
  title: "Sounds", music: "Music", amb: "Ambience", named: "Named sounds", custom: "Custom sounds",
  keys: "↑↓ pick  A play  B stop  SELECT group",
  keysAmb: "↑↓ pick  A play  ←→ level  B stop",
  idle: "quiet", newer: "needs a newer system", playing: "playing", once: "once"
};

var SONGS = {
  /* 晚风 / Dusk: A minor pentatonic, 76 bpm, 8 bars */
  dusk: { bpm: 76,
    p1: "@1 v11 o4 l8 e4 a b >c4< b a | g4. e8 d4 e4 | a4 >c d e4 d c< | b2 a4 r4 | c4 e g a4 g e | d4 e8 g8 a2 | >c4< b a g4 e4 | a1",
    p2: "@0 v6 o3 l8 a >e a e< a >e a e< | e b >e< b e b >e< b | f >c f c< f >c f c< | e b >e< b e b >e< b | c g >c< g c g >c< g | g >d g d< g >d g d< | f >c f c< f >c f c< | a >e a e< a >e a e<",
    tri: "v12 o2 l2 a a | e e | f f | e e | c c | g g | f f | a a",
    noise: "l8 [v3 x r v2 x r v4 X r v2 x r]8" },
  /* 赶路 / On the road: D major, 132 bpm, 4 bars twice */
  road: { bpm: 132,
    p1: "@2 v12 o5 l8 [d d c+ d e4 d c+ | <b4 a b >c+4 d e | f+ e d c+ d4 <a4 | b >c+ d e d2]2",
    p2: "@1 v7 l8 [o4 [d f+ a f+]2 | o3 [g b >d< b]2 | o4 [d f+ a f+]2 | o3 g b >d< b a >c+ e c+<]2",
    tri: "v13 o2 l4 [d d d d | g g a a | d d d d | g a d d]2",
    noise: "l8 [v7 X v3 x v5 x v3 x v7 X v3 x v5 x x]8" }
};

var CUSTOM = [
  ["跳跃", "Jump", { wave: "square", duty: 1, from: 300, to: 900, ms: 120 }],
  ["拾取", "Pick up", { wave: "square", duty: 2, from: 1200, to: 1800, ms: 80 }],
  ["受伤", "Hurt", { wave: "noise", from: 900, to: 120, ms: 180, attack: 5, decay: 175, vol: 0.8 }],
  ["爆炸", "Boom", { wave: "noise", from: 400, to: 40, ms: 700, attack: 2, decay: 690, vol: 0.9 }],
  ["铃", "Bell", { wave: "triangle", from: 880, ms: 900, attack: 5, decay: 850, vibrato: { depth: 0.4, rate: 6 } }],
  ["警报", "Siren", { wave: "square", from: 600, to: 900, ms: 1200, vibrato: { depth: 1.5, rate: 3 } }],
  ["低吼", "Growl", { wave: "square", duty: 3, from: 90, to: 70, ms: 500, vibrato: { depth: 0.8, rate: 14 } }],
  ["说话", "Talk", "talk"]
];
var TALK = { wave: "square", duty: 0, ms: 40, vol: 0.5 };

var AMB = [["rain", "雨", "Rain"], ["waves", "海浪", "Waves"], ["waterfall", "瀑布", "Waterfall"],
           ["wind", "风", "Wind"], ["fire", "篝火", "Fire"], ["stream", "溪流", "Stream"]];
var NAMED = ["tap", "tick", "move", "ok", "err", "hit", "miss", "coin", "win", "lose"];

var hasMusic = !!PAD.music, hasAmb = !!PAD.ambience;
var rows = [], sel = 0, song = null, amb = null, level = {};
AMB.forEach(function (a) { level[a[0]] = 3; });   /* five steps, 0.2 to 1.0 */

function add(sec, item) { item.sec = sec; rows.push(item); }
add(0, { kind: "song", id: "dusk", label: ZH ? "晚风" : "Dusk", hint: "76 bpm" });
add(0, { kind: "song", id: "road", label: ZH ? "赶路" : "On the road", hint: "132 bpm" });
AMB.forEach(function (a) { add(1, { kind: "amb", id: a[0], label: ZH ? a[1] : a[2] }); });
NAMED.forEach(function (n) { add(2, { kind: "named", id: n, label: n }); });
CUSTOM.forEach(function (c) { add(3, { kind: "custom", label: ZH ? c[0] : c[1], p: c[2] }); });

function usable(r) {
  if (r.kind === "song" || r.kind === "custom") return hasMusic;
  if (r.kind === "amb") return hasAmb;
  return true;
}
function lv(id) { return level[id] / 5; }
function bars(id) { var n = level[id], s = ""; for (var i = 1; i <= 5; i++) s += i <= n ? "▮" : "▯"; return s; }
function js(o) { return JSON.stringify(o).replace(/"(\w+)":/g, "$1: ").replace(/,/g, ", "); }
var SFX = "PAD." + "sfx(";   /* written out for the reader; split so the checker does not take it for a call */
function code(r) {
  if (!usable(r)) return T.newer;
  if (r.kind === "song") {
    var s = SONGS[r.id];
    return "PAD.music.play({ bpm: " + s.bpm + ",\n  p1: \"" + s.p1.slice(0, 40) + "...\", ... })";
  }
  if (r.kind === "amb") return "PAD.ambience(\"" + r.id + "\", " + lv(r.id).toFixed(1) + ")";
  if (r.kind === "named") return SFX + "\"" + r.id + "\")";
  if (r.p === "talk") return "/* one blip a letter, a pitch per character */\n" + SFX + js(Object.assign({ from: 520 }, TALK)) + ")";
  return SFX + js(r.p) + ")";
}

var list = document.getElementById("list");
function draw() {
  var h = "", secs = [T.music, T.amb, T.named, T.custom], last = -1;
  rows.forEach(function (r, i) {
    if (r.sec !== last) { h += "<h2>" + secs[r.sec] + "</h2>"; last = r.sec; }
    var on = (r.kind === "song" && song === r.id) || (r.kind === "amb" && amb === r.id);
    var right = !usable(r) ? T.newer : r.kind === "amb" ? bars(r.id) : r.kind === "song" ? r.hint : "";
    h += '<div class="row' + (i === sel ? " sel" : "") + (on ? " on" : "") + (usable(r) ? "" : " off") + '" data-i="' + i + '">' +
      '<span><span class="mark">' + (on ? "&gt;" : "") + "</span>" + r.label + "</span><small>" + right + "</small></div>";
  });
  list.innerHTML = h;
  document.getElementById("code").textContent = code(rows[sel]);
  document.getElementById("keys").textContent = rows[sel].kind === "amb" && usable(rows[sel]) ? T.keysAmb : T.keys;
  var now = [];
  if (song) now.push(rows.filter(function (r) { return r.id === song; })[0].label);
  if (amb) now.push(rows.filter(function (r) { return r.id === amb; })[0].label + " " + lv(amb).toFixed(1));
  document.getElementById("now").textContent = now.length ? T.playing + ": " + now.join(" / ") : T.idle;
  var el = list.querySelector(".sel");
  if (el && el.scrollIntoView) {
    el.scrollIntoView({ block: "nearest" });
    if (el.getBoundingClientRect().bottom > list.getBoundingClientRect().bottom) list.scrollTop += 1;
  }
}

function talk() {
  /* a short line of "speech": blips a letter apart, the pitch wandering around one voice */
  var pitches = [520, 560, 500, 600, 540, 480, 560, 520, 590, 500];
  pitches.forEach(function (f, i) { setTimeout(function () { PAD.sfx(Object.assign({ from: f }, TALK)); }, i * 75); });
}
function play(r) {
  if (!usable(r)) { PAD.sfx("err"); return; }
  if (r.kind === "song") {
    if (song === r.id) { PAD.music.stop(); song = null; } else { PAD.music.play(SONGS[r.id]); song = r.id; }
  } else if (r.kind === "amb") {
    if (amb === r.id) { PAD.ambience(null); amb = null; } else { PAD.ambience(r.id, lv(r.id)); amb = r.id; }
  } else if (r.kind === "named") PAD.sfx(r.id);
  else if (r.p === "talk") talk();
  else PAD.sfx(r.p);
  draw();
}
function stopAll() {
  if (song && hasMusic) PAD.music.stop();
  if (amb && hasAmb) PAD.ambience(null);
  song = null; amb = null; draw();
}
function move(d) { sel = (sel + d + rows.length) % rows.length; draw(); }
/* Left/Right set an ambience's level, and do nothing elsewhere */
function side(d) {
  var r = rows[sel];
  if (r.kind !== "amb" || !usable(r)) return;
  var n = Math.max(1, Math.min(5, level[r.id] + d));
  if (n !== level[r.id]) { level[r.id] = n; if (amb === r.id) PAD.ambience(r.id, lv(r.id)); PAD.sfx("move"); }
  draw();
}
/* SELECT: the first row of the next group, round to the first */
function nextGroup() {
  var s = (rows[sel].sec + 1) % 4;
  for (var i = 0; i < rows.length; i++) if (rows[i].sec === s) { sel = i; break; }
  draw();
}

PAD.on("press", function (b) {
  if (b === "up") move(-1);
  else if (b === "down") move(1);
  else if (b === "left") side(-1);
  else if (b === "right") side(1);
  else if (b === "a") play(rows[sel]);
  else if (b === "b") stopAll();
  else if (b === "select") nextGroup();
});
list.addEventListener("click", function (e) {
  var el = e.target.closest ? e.target.closest(".row") : null; if (!el) return;
  sel = +el.getAttribute("data-i"); play(rows[sel]);
});

document.title = T.title;
document.getElementById("title").textContent = T.title;
draw();
</script>
</body>
</html>
