<script data-src="src/story/01-arrival.js">
/* Prologue: after the last bus, the station, and the first choice. */

SCRIPT.push(
  { chapter: { zh: "序章", en: "Prologue" }, sub: { zh: "末班车之后", en: "After the Last Train" } },
  { bg: "station" },
  { say: null, text: { zh: "雨从下午开始下，山路的柏油被洗得发亮。你背着录音包，包里有一台旧录音机、两节备用电池，和一盒没有封面的磁带。", en: "The rain started in the afternoon and washed the mountain road bright. You carry a recorder bag: an old machine, two spare batteries, and a cassette with no cover." } },
  { say: null, text: { zh: "末班车刚走。尾灯拐过弯，只剩两盏红点，很快被雨吞掉。", en: "The last bus has just gone. Its taillights turn the bend, two red dots, swallowed by the rain." } },
  { say: null, text: { zh: "你本来可以赶上。但在镇口，你让司机停了一分钟，录一段屋檐水落进铁皮桶的声音。司机骂了一句，关上门。", en: "You could have caught it. But at the edge of town you asked the driver to wait a minute while you recorded water falling from an eave into a tin bucket. He swore and closed the door." } },
  { say: null, text: { zh: "你不后悔。你总是为了一分钟的声音，错过一整班车。", en: "You don't regret it. You have always missed whole buses for a minute of sound." } },
  { say: null, text: { zh: "父亲以前也这样。他会把录音机放在窗台上，录整夜的雨，第二天剪成三分钟。", en: "Your father was the same. He would leave a recorder on the windowsill all night, then cut the rain down to three minutes." } },
  { say: null, text: { zh: "他说，留下来的声音，比人诚实。", en: "He said recorded sounds are more honest than people." } },
  { say: null, text: { zh: "你来这座山，是为了找一盒磁带上的地名。父亲的字条写着：「雨站，最后一班 23:40。」", en: "You came to this mountain looking for a place written on a cassette. Your father's note said: Rain Station, last train 23:40." } },
  { say: null, text: { zh: "他从来没说过为什么留着它。你也没问过。", en: "He never said why he kept it. You never asked." } },
  { say: null, text: { zh: "前面只剩一处亮着。一座小站，站牌在雨里晃。", en: "Only one light is left ahead: a small station, its sign swaying in the rain." } },
  { say: null, text: { zh: "站牌上写着「雨站」。玻璃下面的时刻表已经发黄：末班车 23:40。日期是十年前的。", en: "The sign says RAIN STN. The timetable under the glass has yellowed: last train 23:40. The date is ten years old." } },
  { say: null, text: { zh: "候车室的窗透出一点黄光。门上贴着一张泛黄的告示：「本站自即日起停止办理客运业务。」日期是十年前。", en: "A little yellow light comes through the waiting-room window. A yellowed notice is pasted on the door: passenger service suspended until further notice. The date is ten years old." } },
  { say: null, text: { zh: "告示下面有人用铅笔写了一行小字：「最后一班车，0:47。」字迹很新。", en: "Under the notice, someone has written in pencil: last train, 0:47. The writing is fresh." } },
  { say: null, text: { zh: "你推门，门没有锁。", en: "You push the door. It isn't locked." } },
  { say: null, text: { zh: "湿木头、旧纸、铁锈。长椅上坐着一个女孩，脚边放着一只旧帆布包。她手里捏着一张票。", en: "Wet wood, old paper, rust. A girl sits on the bench, an old canvas bag at her feet. She is holding a ticket." } },
  { show: "left", who: "mei" },
  { say: "mei", text: { zh: "你也错过车了？", en: "Did you miss the train too?" } },
  { say: null, text: { zh: "你摇头。雨水从袖口滴到地板上，积成一小片。", en: "You shake your head. Rainwater drips from your cuff and gathers on the floor." } },
  { say: null, text: { zh: "「没有。我是来录雨的。」", en: "\"No. I came to record the rain.\"" } },
  { say: "mei", text: { zh: "这里没有车了。十年前就没有了。", en: "There are no trains here. Not for ten years." } },
  { say: null, text: { zh: "「那你在等什么？」", en: "\"Then what are you waiting for?\"" } },
  { say: "mei", text: { zh: "等一趟只收旧车票的车。", en: "A train that only takes old tickets." } },
  { say: null, text: { zh: "「旧车票？」", en: "\"Old tickets?\"" } },
  { say: "mei", text: { zh: "买过，没用过的。", en: "Bought, never used." } },
  { say: null, text: { zh: "她把票举起来。纸边已经软了，日期是十年前。座位 2A、2B。两个座位。", en: "She holds it up. The paper has gone soft; the date is ten years old. Seats 2A, 2B. Two seats." } },
  { say: null, text: { zh: "你忽然想起磁带上的两个字。", en: "You suddenly remember the two words on the cassette." } },
  { say: null, text: { zh: "「你认识袁吗？」", en: "\"Do you know Yuan?\"" } },
  { say: null, text: { zh: "女孩抬起头。她的眼睛很亮，像在雨里泡了很久。", en: "The girl looks up. Her eyes are bright, as if they have been soaking in rain." } },
  { say: "mei", text: { zh: "你认识我哥？", en: "You knew my brother?" } },
  { say: null, text: { zh: "售票口的灯亮了一下。一个老人从里面出来，像一直坐在那里。", en: "The ticket window lights up. An old man comes out, as if he had been sitting there all along." } },
  { show: "right", who: "old" },
  { say: "old", text: { zh: "门开着，就进来吧。外面冷。", en: "The door is open. Come in. It's cold outside." } },
  { say: null, text: { zh: "他看了你一眼，又看了女孩手里的票。", en: "He glances at you, then at the ticket in the girl's hand." } },
  { say: "old", text: { zh: "今晚有车。", en: "There is a train tonight." } },
  { choice: [
    { text: { zh: "进去躲雨", en: "Go inside" }, goto: "enter" },
    { text: { zh: "撑伞离开", en: "Stay out in the rain" }, goto: "leave" }
  ] },

  { label: "leave" },
  { say: null, text: { zh: "你退回雨里。", en: "You step back into the rain." } },
  { say: null, text: { zh: "门在身后合上，灯光被切成一条细线，然后消失。", en: "The door closes behind you. The light is cut to a thin line, then gone." } },
  { say: null, text: { zh: "雨比刚才更大。你站在站牌下，水顺着铁皮流进领口。", en: "The rain is heavier now. You stand under the sign; water runs down the tin and into your collar." } },
  { say: null, text: { zh: "走到路口时，你听见一声很远的汽笛。低沉，很长，像从山里面传出来。", en: "At the junction you hear a horn far away. Low and long, as if it comes from inside the mountain." } },
  { say: null, text: { zh: "你回头。站牌还亮着，候车室却已经黑了。", en: "You turn back. The sign is still lit; the waiting room is dark." } },
  { say: null, text: { zh: "你在路边的屋檐下坐到天亮。雨停的时候，屋檐还在滴水。", en: "You sit under an eave until dawn. When the rain stops, the eave is still dripping." } },
  { say: null, text: { zh: "天亮后，那里只有一片拆到一半的站台。铁轨被撬起来，堆在草里。没有站牌，没有长椅，没有女孩。", en: "By daylight there is only a half-demolished platform. The rails are pried up and piled in the grass. No sign, no bench, no girl." } },
  { say: null, text: { zh: "你问镇上的人。他们说那座站十年前就关了，最后一班车开走以后，再没人回来过。", en: "You ask in town. They say the station closed ten years ago. After the last train left, no one came back." } },
  { say: null, text: { zh: "一年后，你在旧货店听见一首歌。歌里有雨，有很轻的吉他。你站在货架之间，忽然想起那晚忘了问她的名字。", en: "A year later, you hear a song in a secondhand shop. There is rain in it, and a soft guitar. Standing between the shelves, you remember you never asked her name." } },
  { say: null, text: { zh: "你买下那盒磁带。封面是空白的。", en: "You buy the cassette. Its cover is blank." } },
  { say: null, text: { zh: "你再也没有找到雨站。", en: "You never find Rain Station again." } },
  { end: true, title: { zh: "结局：雨里", en: "Ending: In the Rain" }, sub: { zh: "你走进了雨里。", en: "You walked into the rain." } },

  { label: "enter" },
  { bg: "waiting" },
  { say: null, text: { zh: "你跟老人走进去。门在身后合上，雨声退到墙外，变成一层很厚的背景。", en: "You follow him inside. The door closes; the rain retreats behind the walls and becomes a thick background." } },
  { say: null, text: { zh: "候车室不大。六排长椅，一面时刻表，一个售票口。墙上的钟停在 0:41。", en: "The waiting room is small. Six rows of benches, a timetable, a ticket window. The clock on the wall has stopped at 0:41." } },
  { say: null, text: { zh: "女孩往长椅里挪了挪，给你留出一点位置。她的帆布包上有一块洗不掉的墨迹。", en: "The girl shifts along the bench and makes room for you. There is an ink stain on her canvas bag that will not wash out." } },
  { say: null, text: { zh: "售票口的灯照着她的票。2A，2B。两个座位。日期是十年前。", en: "The ticket-window light falls on her ticket. 2A, 2B. Two seats. The date is ten years old." } },
  { say: null, text: { zh: "老人把票簿翻到空白的一页。纸页很脆，像一碰就会碎。", en: "The old man turns the ledger to a blank page. The paper is brittle, as if it might crumble at a touch." } },
  { say: "old", text: { zh: "先说好。今晚的车，不是给所有人的。", en: "Let's be clear. Tonight's train is not for everyone." } }
);

<script data-src="src/story/02-ticket.js">
/* Chapter 1: the old ticket, the rules, and the cassette. */

SCRIPT.push(
  { chapter: { zh: "第一章", en: "Chapter One" }, sub: { zh: "旧票", en: "The Old Ticket" } },
  { say: null, text: { zh: "老人把一只搪瓷杯放在你面前。水是热的，杯口缺了一小块。", en: "The old man sets a tin cup in front of you. The water is hot; a small piece is missing from the rim." } },
  { say: "old", text: { zh: "明天拆站。最后一班车，今晚 0:47。", en: "The station closes tomorrow. The last train is tonight, 0:47." } },
  { say: null, text: { zh: "「时刻表上不是 23:40 吗？」", en: "\"Doesn't the timetable say 23:40?\"" } },
  { say: "old", text: { zh: "那是给人看的。给检查的人，给最后一次路过的车。", en: "That one is for people. For inspectors. For the last train that passes." } },
  { say: null, text: { zh: "他从抽屉里拿出票簿，翻开。纸页上记着日期、座位、票价，还有一两个字的备注：探亲、看病、私奔。", en: "He takes a ticket ledger from the drawer and opens it. Dates, seats, fares, and one- or two-word notes: visiting family, seeing a doctor, running away." } },
  { say: null, text: { zh: "这本票簿用了四十年。最后一页是空的。", en: "The ledger has been in use for forty years. Its last page is blank." } },
  { say: "old", text: { zh: "这站以前一天有四班车。早上六点，中午，傍晚，最后一班 23:40。", en: "This station used to have four trains a day. Six in the morning, noon, evening, and the last at 23:40." } },
  { say: "old", text: { zh: "最后一班最热闹。回来的，走的，都在这个屋子里等。", en: "The last one was the busiest. People coming back and people leaving all waited in this room." } },
  { say: null, text: { zh: "「以前有个人，拿着一张二十年前的票来。他说他要去见一个朋友。」站长说，「第二天早上他回来了，说朋友已经搬家了。他笑得很开心。」", en: "\"A man once came with a ticket twenty years old. He wanted to see a friend,\" the stationmaster says. \"He came back the next morning. The friend had moved. He was smiling.\"" } },
  { say: null, text: { zh: "「为什么开心？」", en: "\"Why was he happy?\"" } },
  { say: null, text: { zh: "「因为他说了该说的话。」", en: "\"Because he said what he needed to say.\"" } },
  { say: "old", text: { zh: "今晚这趟，只收旧票。买过、没用过的票。", en: "Tonight's train takes only old tickets. Bought, never used." } },
  { say: null, text: { zh: "「为什么？」", en: "\"Why?\"" } },
  { say: "old", text: { zh: "因为没走成的路，总得有个地方停。", en: "Because a road not taken needs somewhere to stop." } },
  { say: null, text: { zh: "你把磁带放在桌上。老人看了一眼，手指停住。", en: "You put the cassette on the table. The old man looks at it. His hand stops." } },
  { say: "old", text: { zh: "袁的。", en: "Yuan's." } },
  { say: null, text: { zh: "「你认识他？」", en: "\"You knew him?\"" } },
  { say: "old", text: { zh: "他在这儿写过歌。也在这儿上过车。", en: "He wrote songs here. He also got on a train here." } },
  { say: null, text: { zh: "「他走的那天，雨也这么大？」", en: "\"Was it raining this hard the night he left?\"" } },
  { say: "old", text: { zh: "更大。站台的灯灭了两盏。", en: "Harder. Two platform lights went out." } },
  { say: null, text: { zh: "小梅把票放在磁带旁边。十年前的日期，座位 2A、2B。票角没有剪。", en: "Mei puts the ticket beside the cassette. A date ten years old; seats 2A, 2B. The corner is uncut." } },
  { say: null, text: { zh: "站长用指腹摸了一下票角。没有剪。", en: "The stationmaster rubs the corner with his thumb. Uncut." } },
  { say: "old", text: { zh: "双人票。两个人一起上车，一起回来。少一个，车不开。", en: "A pair ticket. Two people board together, two come back. If one is missing, the train won't leave." } },
  { say: null, text: { zh: "「车去哪儿？」", en: "\"Where does the train go?\"" } },
  { say: "old", text: { zh: "去这张票该出发的那一夜。", en: "To the night this ticket was meant to leave." } },
  { say: null, text: { zh: "「能改变什么吗？」", en: "\"Can it change anything?\"" } },
  { say: "old", text: { zh: "不能。只能说一句话。", en: "No. You can say one sentence." } },
  { say: null, text: { zh: "「对谁说？」", en: "\"To whom?\"" } },
  { say: "old", text: { zh: "对那个你没能好好告别的人。", en: "To the one you never got to say goodbye to." } },
  { say: null, text: { zh: "「有人回来过吗？」", en: "\"Has anyone come back?\"" } },
  { say: "old", text: { zh: "有。也有人没回来。", en: "Yes. Some didn't." } },
  { say: null, text: { zh: "站长翻了一页票簿，指着一行被划掉的记录。", en: "The stationmaster turns a page and points to a crossed-out line." } },
  { say: "old", text: { zh: "有的人把票留在这儿，自己走了。", en: "Some left their tickets here and walked away." } },
  { choice: [
    { text: { zh: "问：两张票？", en: "Ask: two tickets?" }, goto: "ask_ticket", set: "asked" },
    { text: { zh: "什么也不问，只听雨", en: "Say nothing. Listen to the rain" }, goto: "quiet_ticket", set: "quiet" }
  ] },

  { label: "ask_ticket" },
  { say: null, text: { zh: "「另一张票，是谁的？」", en: "\"The other ticket. Whose is it?\"" } },
  { say: "mei", text: { zh: "我哥。", en: "My brother's." } },
  { say: null, text: { zh: "她没有再说下去。站长把票簿合上，又打开。", en: "She says no more. The stationmaster closes the ledger, then opens it again." } },
  { say: "old", text: { zh: "袁买了双人票。他想带她走。她没上车。", en: "Yuan bought a pair ticket. He meant to take her with him. She didn't get on." } },
  { say: null, text: { zh: "小梅看着桌面。她的手指在杯口上停了一圈。", en: "Mei looks at the table. Her finger traces the rim of the cup once." } },
  { goto: "ticket_rules" },

  { label: "quiet_ticket" },
  { say: null, text: { zh: "你没有问。雨敲着窗，像有人在门外来回走。", en: "You don't ask. Rain taps the window, like someone pacing outside." } },
  { say: null, text: { zh: "站长把票簿合上。他没有催你，也没有看表。", en: "The stationmaster closes the ledger. He doesn't hurry you, or look at his watch." } },
  { say: "mei", text: { zh: "另一张是我哥的。", en: "The other one is my brother's." } },
  { say: null, text: { zh: "她说完，把票往你这边推了一点，像让你看清楚。", en: "She pushes the ticket a little toward you, as if to let you see it clearly." } },

  { label: "ticket_rules" },
  { say: "mei", text: { zh: "他叫袁。写歌的。十年前，他买了这两张票。", en: "His name is Yuan. He wrote songs. Ten years ago he bought these two tickets." } },
  { say: null, text: { zh: "站长把票推回她面前。票簿最后一页的页脚，有一排很小的铅笔字。每年一个日期。最近一个是今天。", en: "The stationmaster pushes the ticket back. At the foot of the ledger's last page is a row of tiny pencil marks. One date for each year. The last one is today." } },
  { say: "old", text: { zh: "0:47。雨要是停了，就没有车了。", en: "0:47. If the rain stops, there is no train." } },
  { say: null, text: { zh: "你听见候车室的钟走了一格。抬头看，钟面上的时间还是 0:41。", en: "You hear the waiting-room clock move one notch. You look up. It still says 0:41." } },
  { say: null, text: { zh: "但你知道，它在走。", en: "But you know it is moving." } }
);
</script>
<script data-src="src/story/03-waiting.js">
/* Chapter 2: the waiting room, Mei's brother, and the cassette. */

SCRIPT.push(
  { chapter: { zh: "第二章", en: "Chapter Two" }, sub: { zh: "候车室", en: "The Waiting Room" } },
  { bg: "waiting" },
  { say: null, text: { zh: "站长去里屋添水。壶盖碰着炉子，响了一声。", en: "The stationmaster goes to the back room to fill the kettle. The lid knocks against the stove." } },
  { say: null, text: { zh: "候车室里只剩你们两个人。雨在窗外，像一层厚厚的帘子。", en: "Only the two of you are left in the waiting room. Outside, the rain is a thick curtain." } },
  { say: "mei", text: { zh: "你录雨做什么？", en: "What do you record the rain for?" } },
  { say: null, text: { zh: "「给一部电影。也给自己。」", en: "\"For a film. And for myself.\"" } },
  { say: "mei", text: { zh: "雨有什么好录的？", en: "What's worth recording about rain?" } },
  { say: null, text: { zh: "「每场雨都不一样。落在铁皮上、落在树叶上、落在站台上，声音都不同。人说话也是。」", en: "\"Every rain is different. On tin, on leaves, on a platform, it sounds different. So do people.\"" } },
  { say: null, text: { zh: "她看着窗外。玻璃上都是水，站台的灯被拉成一条一条。", en: "She looks out. Water covers the glass; the platform light is pulled into strips." } },
  { say: "mei", text: { zh: "我哥也这么说。", en: "My brother used to say that." } },
  { say: null, text: { zh: "她说这句话的时候，没有看你。", en: "She says it without looking at you." } },
  { say: null, text: { zh: "十年前，她十六岁。袁二十二岁。", en: "Ten years ago she was sixteen. Yuan was twenty-two." } },
  { say: null, text: { zh: "他在这座站台上弹吉他。没有观众，只有她和雨。", en: "He played guitar on this platform. No audience, only her and the rain." } },
  { say: null, text: { zh: "他白天在镇上的修理铺干活，晚上写歌。吉他弦断了一根，就用另一根代替。", en: "He worked at a repair shop in town by day and wrote songs at night. When a string broke, he used another." } },
  { say: null, text: { zh: "他写的第一首歌叫《山路》，第二首叫《雨站》。他说等写到第十首，就带小梅去城里录音。", en: "His first song was called Mountain Road. The second was Rain Station. He said when he had ten, he would take Mei to the city to record them." } },
  { say: null, text: { zh: "写到第七首的时候，他走了。", en: "He left at the seventh." } },
  { say: null, text: { zh: "他买了去城里的双人票。说城里有人愿意听他的歌。", en: "He bought a pair of tickets to the city. He said someone there would listen to his songs." } },
  { say: "mei", text: { zh: "我妈身体不好。我走不开。", en: "My mother was ill. I couldn't leave." } },
  { say: null, text: { zh: "「他说他每个月寄钱。我说他只想他自己。」", en: "\"He said he'd send money every month. I told him he only thought about himself.\"" } },
  { say: null, text: { zh: "「他站在雨里，站了很久。我把票扔在地上。」", en: "\"He stood in the rain for a long time. I threw the ticket on the ground.\"" } },
  { say: null, text: { zh: "「他捡起来，说，那我走了。」", en: "\"He picked it up and said, then I'll go.\"" } },
  { say: null, text: { zh: "「我说，你走了就别回来。」", en: "\"I said, if you go, don't come back.\"" } },
  { say: "mei", text: { zh: "他就真的没回来。", en: "And he really didn't come back." } },
  { say: null, text: { zh: "她停了一会儿。窗外的雨打在玻璃上，像有人在轻轻敲门。", en: "She pauses. Rain taps the glass, like someone knocking softly." } },
  { say: null, text: { zh: "一个月后，磁带寄到。封面是他的字：雨站。里面只有第一段。", en: "A month later the cassette arrived. The cover was in his hand: RAIN STATION. Only the first verse was inside." } },
  { say: null, text: { zh: "附着一张纸：第二段留给你。", en: "A note was folded inside: the second verse is for you." } },
  { say: "mei", text: { zh: "我没听完过。", en: "I never listened to the end." } },
  { say: null, text: { zh: "「为什么？」", en: "\"Why?\"" } },
  { say: "mei", text: { zh: "我怕听完，他就真的走了。", en: "I was afraid that once I heard it, he'd really be gone." } },
  { say: null, text: { zh: "一年后，城里来了消息。他死了。", en: "A year later word came from the city. He was dead." } },
  { say: null, text: { zh: "那一年小梅十七岁。她把录取通知书压在枕头下面，没有去报到。", en: "Mei was seventeen that year. She put her admission letter under her pillow and never went." } },
  { say: null, text: { zh: "她在镇上的书店找了工作，一干就是九年。", en: "She found work at a bookshop in town and stayed nine years." } },
  { say: null, text: { zh: "书店关门早。她每天走回家，经过山脚的路口，从来不往上看。", en: "The bookshop closed early. Every day she walked home past the junction at the foot of the mountain and never looked up." } },
  { say: null, text: { zh: "她说，抬头就会看见站台的灯。", en: "She said that if she looked up, she would see the platform light." } },
  { say: null, text: { zh: "「怎么死的？」", en: "\"How?\"" } },
  { say: "mei", text: { zh: "火灾。他住的地方。房东说，他回去拿吉他。", en: "A fire where he lived. The landlord said he went back for his guitar." } },
  { say: null, text: { zh: "「他最后留下的，是那把吉他？」", en: "\"The last thing he went back for was the guitar?\"" } },
  { say: "mei", text: { zh: "不是。是我妈的一张照片。房东说，他冲进去的时候，手里已经抱着吉他了，又回头去拿照片。", en: "No. A photograph of our mother. The landlord said he ran in with the guitar already in his arms, then turned back for the photo." } },
  { say: null, text: { zh: "她低下头。杯里的水已经凉了。", en: "She lowers her head. The water in her cup has gone cold." } },
  { say: null, text: { zh: "你告诉她磁带的事。", en: "You tell her about the cassette." } },
  { say: null, text: { zh: "「我父亲是电台的主持人。深夜节目。去年冬天走了。」", en: "\"My father was a late-night radio host. He died last winter.\"" } },
  { say: null, text: { zh: "「整理他东西的时候，我找到这盒磁带。封面只有两个字：雨站。」", en: "\"Going through his things, I found this cassette. The cover had two words: RAIN STATION.\"" } },
  { say: null, text: { zh: "「他没跟我说过。但节目单上有一期，叫《雨站》。」", en: "\"He never mentioned it. But one programme in his log was called Rain Station.\"" } },
  { say: null, text: { zh: "「节目单上还有一行字：一个叫袁的听众，从山里寄来。」", en: "\"There was a note beside it: from a listener named Yuan, in the mountains.\"" } },
  { say: null, text: { zh: "「我小时候以为，那首歌是他写给一个女人的。」", en: "\"When I was little, I thought the song was written for a woman.\"" } },
  { say: null, text: { zh: "「长大以后才知道，有些歌是写给一个地方的。」", en: "\"Later I learned some songs are written for a place.\"" } },
  { say: null, text: { zh: "「我顺着地址找过来。」", en: "\"I followed the address here.\"" } },
  { say: null, text: { zh: "小梅看着磁带，没有伸手。", en: "Mei looks at the cassette. She doesn't reach for it." } },
  { say: "mei", text: { zh: "你父亲……喜欢这首歌吗？", en: "Did your father... like the song?" } },
  { say: null, text: { zh: "「我不知道。他只在节目里播过一次。后来再没提过。」", en: "\"I don't know. He played it once on air. He never mentioned it again.\"" } },
  { say: null, text: { zh: "「但他把它留到了最后。」", en: "\"But he kept it until the end.\"" } },
  { say: null, text: { zh: "「父亲去世前一个月，还在整理节目单。他把袁的那一期单独放在一边。」", en: "\"A month before he died, he was still sorting his programme logs. He kept Yuan's episode apart from the rest.\"" } },
  { say: null, text: { zh: "「护士说他半夜会醒来，听一会儿收音机再睡。」", en: "\"The nurse said he would wake at night, listen to the radio for a while, then sleep again.\"" } },
  { say: null, text: { zh: "站长从里屋出来，往炉子里添了一块煤。他没有看你们。", en: "The stationmaster comes out and puts a piece of coal in the stove. He doesn't look at you." } },
  { choice: [
    { text: { zh: "放磁带", en: "Play the tape" }, goto: "play_tape", set: "tape" },
    { text: { zh: "把磁带收起来", en: "Put the tape away" }, goto: "keep_tape" }
  ] },

  { label: "play_tape" },
  { say: null, text: { zh: "你把磁带放进录音机，按下播放。", en: "You put the cassette into the recorder and press play." } },
  { say: null, text: { zh: "先是雨。录音机的底噪像一层很细的沙。", en: "First rain. The recorder's hiss is like fine sand." } },
  { say: null, text: { zh: "然后是吉他。一个年轻人咳嗽了一声，开始唱。", en: "Then guitar. A young man coughs once and begins to sing." } },
  { say: null, text: { zh: "他的声音很轻，像怕吵醒谁。第一段只有四句。", en: "His voice is soft, as if afraid to wake someone. The first verse is only four lines." } },
  { say: null, text: { zh: "唱到第二段，声音停了。磁带还在转，只有空白。", en: "At the second verse the voice stops. The tape keeps turning. Only blank." } },
  { say: null, text: { zh: "小梅跟着哼了两句。她的声音和磁带里的雨叠在一起。", en: "Mei hums two lines. Her voice folds into the rain on the tape." } },
  { say: null, text: { zh: "她停下。", en: "She stops." } },
  { say: "mei", text: { zh: "我那天说的最后一句话，是「你走了就别回来」。", en: "The last thing I said that night was, don't come back." } },
  { say: "mei", text: { zh: "他走以后，我每天都想，如果那天我上了车，会怎么样。", en: "After he left, I thought every day about what would have happened if I'd got on." } },
  { say: "mei", text: { zh: "后来我发现，我想的不是如果。我想的是他。", en: "Then I realized it wasn't the if I was thinking about. It was him." } },
  { say: null, text: { zh: "站长在里屋，没有出来。", en: "The stationmaster stays in the back room." } },
  { say: null, text: { zh: "录音机自动停了。", en: "The recorder stops by itself." } },
  { goto: "tape_end" },

  { label: "keep_tape" },
  { say: null, text: { zh: "你把录音机放回包里。", en: "You put the recorder back in your bag." } },
  { say: null, text: { zh: "小梅看见了磁带上的字，没有问。", en: "Mei sees the writing on the cassette. She doesn't ask." } },
  { say: "mei", text: { zh: "没关系。你能来，已经很好了。", en: "It's all right. It's already good that you came." } },
  { say: null, text: { zh: "「你不听吗？」", en: "\"You won't listen?\"" } },
  { say: "mei", text: { zh: "不是现在。", en: "Not now." } },
  { sfx: "tick" },
  { say: null, text: { zh: "钟响了一声。", en: "The clock strikes once." } },

  { label: "tape_end" },
  { say: null, text: { zh: "站长从里屋出来，手里提着灯。", en: "The stationmaster comes out with a lamp in his hand." } },
  { say: "old", text: { zh: "我去看信号。你们要不要来？", en: "I'm going to check the signal. Coming?" } },
  { say: null, text: { zh: "小梅站起来。她把票放进上衣口袋，动作很慢。", en: "Mei stands. She puts the ticket in her coat pocket, slowly." } },
  { say: null, text: { zh: "你拿起录音包。磁带在里面，轻轻碰了一下。", en: "You pick up your recorder bag. The cassette knocks softly inside." } }
);
</script>
<script data-src="src/story/04-memory.js">
/* Chapter 3: the platform, ten years ago, and the pair ticket. */

SCRIPT.push(
  { chapter: { zh: "第三章", en: "Chapter Three" }, sub: { zh: "十年前的站台", en: "The Platform Ten Years Ago" } },
  { bg: "platform" },
  { say: null, text: { zh: "站长提灯走在前面。灯罩上有一道裂纹，光从缝里漏出来。", en: "The stationmaster leads with the lamp. There is a crack in the glass; light leaks through it." } },
  { say: null, text: { zh: "站台没有顶。雨直接落在铁轨上，溅起细小的白点。", en: "The platform has no roof. Rain falls straight onto the rails and breaks into small white points." } },
  { say: null, text: { zh: "信号灯在雨里亮着，红色。", en: "The signal glows red in the rain." } },
  { say: "old", text: { zh: "还有二十分钟。", en: "Twenty minutes." } },
  { say: null, text: { zh: "「你每年都来开门？」", en: "\"Do you open the station every year?\"" } },
  { say: "old", text: { zh: "她每年都来。我每年都来关灯。", en: "She comes every year. I come every year to turn off the lights." } },
  { say: null, text: { zh: "「车站不是早就关了？」", en: "\"Wasn't the station closed long ago?\"" } },
  { say: "old", text: { zh: "关的是站，不是路。", en: "The station closed. The road didn't." } },
  { say: null, text: { zh: "你抬头。站台的灯忽然亮了一些，像有人在很远的地方拧大了开关。", en: "You look up. The platform lights brighten, as if someone far away has turned them up." } },
  { say: null, text: { zh: "雨声变了。你看见十年前的灯。", en: "The rain changes. You see the lights of ten years ago." } },
  { bg: "memory" },
  { show: "left", who: "mei" },
  { show: "right", who: "yuan" },
  { say: null, text: { zh: "十年前的灯比现在多。站台尽头有一盏，售票口有一盏，袁的脚边还有一盏。", en: "There were more lights ten years ago. One at the end of the platform, one at the ticket window, one by Yuan's feet." } },
  { say: null, text: { zh: "他坐在长椅上调弦。小梅站在他面前，校服袖子太长，遮住半个手。", en: "He sits on the bench tuning his guitar. Mei stands in front of him, her school sleeves too long, covering half her hands." } },
  { say: "yuan", text: { zh: "一起去。车快来了。", en: "Come with me. The train's coming." } },
  { say: "mei", text: { zh: "妈怎么办？", en: "What about Mother?" } },
  { say: "yuan", text: { zh: "我每个月寄钱。", en: "I'll send money every month." } },
  { say: "mei", text: { zh: "你只想着你自己。", en: "You only think about yourself." } },
  { say: "yuan", text: { zh: "梅，我不是不回来。", en: "Mei, it's not that I won't come back." } },
  { say: "mei", text: { zh: "你走了就别回来。", en: "If you go, don't come back." } },
  { say: null, text: { zh: "袁没有再说话。他把票放在长椅上，站起来，背上吉他。", en: "Yuan says nothing more. He lays the ticket on the bench, stands, and puts the guitar on his back." } },
  { say: null, text: { zh: "小梅看着那张票。她没有拿。", en: "Mei looks at the ticket. She doesn't take it." } },
  { say: null, text: { zh: "车进站了。风把雨吹进站台，灯晃了一下。", en: "The train pulls in. Wind drives the rain onto the platform. The lights sway." } },
  { say: null, text: { zh: "袁走到车门口，回头。", en: "Yuan reaches the door and looks back." } },
  { say: "yuan", text: { zh: "梅。", en: "Mei." } },
  { say: null, text: { zh: "小梅转过身。", en: "Mei turns away." } },
  { say: null, text: { zh: "他站了一会儿。然后上车。", en: "He stands there for a moment. Then he boards." } },
  { say: null, text: { zh: "车开走的时候，小梅抓起长椅上的票，追到站台尽头。她滑倒在雨里，票还在手里。", en: "As the train leaves, Mei snatches the ticket from the bench and runs to the end of the platform. She slips in the rain. The ticket is still in her hand." } },
  { say: null, text: { zh: "她爬起来，又跑。鞋掉了一只。", en: "She gets up and runs again. One shoe comes off." } },
  { say: null, text: { zh: "站长在十年前的那个天亮找到她。她坐在铁轨边，手里攥着票，嘴唇发白。", en: "The stationmaster found her at dawn, ten years ago. She sat by the rails, the ticket clenched in her hand, her lips white." } },
  { say: null, text: { zh: "他把她背回镇上。一路上她只说了一句：「我没让他回来。」", en: "He carried her back to town. All the way she said only one thing: \"I didn't let him come back.\"" } },
  { say: null, text: { zh: "小梅在家躺了三天。第四天，她起来给母亲做饭，像什么也没发生。", en: "Mei lay at home for three days. On the fourth she got up and cooked for her mother, as if nothing had happened." } },
  { say: null, text: { zh: "从那以后，她再没当着人哭过。", en: "After that, she never cried in front of anyone again." } },
  { hide: "yuan" },
  { bg: "platform" },
  { say: null, text: { zh: "现在的小梅站在你旁边，看着同一段铁轨。", en: "The Mei beside you now looks at the same rails." } },
  { say: "mei", text: { zh: "我把那句道歉在心里排了十年。还是不知道怎么开口。", en: "I've rehearsed that apology for ten years. I still don't know how to begin." } },
  { say: null, text: { zh: "「你恨他吗？」", en: "\"Do you hate him?\"" } },
  { say: "mei", text: { zh: "不。我恨我自己。", en: "No. I hate myself." } },
  { say: null, text: { zh: "「我后来去过城里。找到他住的地方。楼拆了，变成一家便利店。」", en: "\"I went to the city later. I found where he lived. The building was gone; there was a convenience store.\"" } },
  { say: null, text: { zh: "「我在便利店门口站了一个下午。什么也没找到。」", en: "\"I stood outside that store for an afternoon. I found nothing.\"" } },
  { say: null, text: { zh: "「我在那家店里买了一瓶水。收银员问我是不是等人。我说是。」", en: "\"I bought a bottle of water inside. The cashier asked if I was waiting for someone. I said yes.\"" } },
  { say: null, text: { zh: "「他说，等人的人一般都站不久。你站了一个下午。」", en: "\"He said people waiting usually don't stand long. You stood all afternoon.\"" } },
  { say: null, text: { zh: "站长把灯举低一点。灯光照着她手里的票。", en: "The stationmaster lowers the lamp. The light falls on the ticket in her hand." } },
  { say: "old", text: { zh: "车可以带你回到那一分钟。", en: "The train can take you back to that minute." } },
  { say: "old", text: { zh: "但双人票要两个人。", en: "But a pair ticket needs two people." } },
  { say: null, text: { zh: "他看着你。", en: "He looks at you." } },
  { choice: [
    { text: { zh: "告诉他父亲的事", en: "Tell her about your father" }, goto: "tell_father", set: "truth" },
    { text: { zh: "只说：我陪你", en: "Just say: I'll come with you" }, goto: "only_kind", set: "kind" }
  ] },

  { label: "tell_father" },
  { say: null, text: { zh: "「我父亲……播出过袁的歌。」", en: "\"My father... played Yuan's song on the radio.\"" } },
  { say: null, text: { zh: "小梅转过头。雨从她的睫毛上滴下来。", en: "Mei turns. Rain drips from her lashes." } },
  { say: null, text: { zh: "「那首歌没有停在十年前。」你说，「它到过别的地方。有人在夜里听过。」", en: "\"The song didn't stop ten years ago,\" you say. \"It went somewhere else. Someone heard it at night.\"" } },
  { say: "mei", text: { zh: "什么时候？", en: "When?" } },
  { say: null, text: { zh: "「我八岁那年。父亲把节目录在磁带里，放在书架最上面。我偷偷听过很多次。」", en: "\"I was eight. He recorded the programme on tape and kept it on the top shelf. I listened to it many times when he wasn't there.\"" } },
  { say: null, text: { zh: "「后来他病了。电台改版。那盘磁带一直没扔。」", en: "\"Then he got sick. The station changed its schedule. He never threw the tape away.\"" } },
  { say: "mei", text: { zh: "……他知道了会很高兴。", en: "...He would have been glad to know that." } },
  { say: null, text: { zh: "她把票捏得很紧，像怕它被风吹走。", en: "She grips the ticket as if afraid the wind will take it." } },
  { goto: "invite" },

  { label: "only_kind" },
  { say: null, text: { zh: "「我不知道该说什么。」你说，「但我可以陪你上车。」", en: "\"I don't know what to say,\" you tell her. \"But I can come with you.\"" } },
  { say: null, text: { zh: "小梅看了你很久，然后点头。", en: "Mei looks at you for a long time, then nods." } },
  { say: "mei", text: { zh: "谢谢你。", en: "Thank you." } },
  { say: null, text: { zh: "「不用谢我。我也有没说完的话。」", en: "\"Don't thank me. I have things I never said too.\"" } },
  { say: null, text: { zh: "她愣了一下，没有问是什么。", en: "She pauses, but doesn't ask what." } },

  { label: "invite" },
  { say: null, text: { zh: "站长把灯举高。信号灯由红转绿。", en: "The stationmaster raises the lamp. The signal turns from red to green." } },
  { say: null, text: { zh: "远处传来一声很轻的响，像铁轨在雨里伸了个懒腰。", en: "A soft sound comes from far away, like rails stretching in the rain." } },
  { say: "mei", text: { zh: "你愿意和我一起上车吗？", en: "Will you get on the train with me?" } },
  { say: null, text: { zh: "你没有立刻回答。雨落在你们之间。", en: "You don't answer at once. Rain falls between you." } },
  { say: null, text: { zh: "你想起父亲录音里的一句话：「有些声音，要等很多年才听得见。」", en: "You remember a line from your father's recording: \"Some sounds take years to hear.\"" } },
  { say: null, text: { zh: "你点头。", en: "You nod." } },
  { say: null, text: { zh: "小梅把票握在手里，像握住一根很细的线。", en: "Mei holds the ticket as if holding a very thin thread." } }
);
</script>
<script data-src="src/story/05-night-train.js">
/* Chapter 4: the night train, the conductor, and the three ways to answer. */

SCRIPT.push(
  { chapter: { zh: "第四章", en: "Chapter Four" }, sub: { zh: "夜车", en: "The Night Train" } },
  { bg: "platform" },
  { say: null, text: { zh: "0:47。", en: "0:47." } },
  { sfx: "tick" },
  { say: null, text: { zh: "雨忽然变大。站台的灯在雨里抖，光晕一圈一圈散开。", en: "The rain suddenly thickens. The platform lights shake in it, their halos spreading in rings." } },
  { say: null, text: { zh: "候车室的灯闪了一下。站长站起来，把票簿合上，动作像做了四十年。", en: "The waiting-room light flickers. The stationmaster stands and closes the ledger, a motion forty years deep." } },
  { say: "old", text: { zh: "走吧。车不等人。", en: "Come. The train doesn't wait." } },
  { say: null, text: { zh: "你们回到站台。雨是斜的，打在脸上像细沙。", en: "You return to the platform. The rain comes sideways, like fine sand against your face." } },
  { say: null, text: { zh: "铁轨尽头先出现一盏灯，然后是一节车厢，然后是整列车。", en: "At the end of the rails a light appears, then a carriage, then the whole train." } },
  { say: null, text: { zh: "它没有编号。车窗里有人影，但看不清脸。", en: "It has no number. Shapes move behind the windows, but you cannot see faces." } },
  { say: null, text: { zh: "车窗里坐着一个穿校服的女孩，一个抱着婴儿的男人，一个把脸贴在玻璃上的老人。他们都在看雨，像在看一场很久以前的电影。", en: "A girl in a school uniform, a man holding a baby, an old man with his face against the glass. They all watch the rain as if watching a film from long ago." } },
  { say: null, text: { zh: "车轮停下时，没有声音，只有雨。", en: "When the wheels stop, there is no sound but rain." } },
  { sfx: "move" },
  { say: null, text: { zh: "车门开了。列车员先下车，站在门边。", en: "The door opens. The conductor steps down first and stands beside it." } },
  { show: "right", who: "conductor" },
  { say: null, text: { zh: "他穿旧制服，帽檐压得很低。手里拿着一把检票剪。", en: "He wears an old uniform, his cap pulled low. He holds a ticket punch." } },
  { say: "conductor", text: { zh: "雨站，0:47。", en: "Rain Station, 0:47." } },
  { say: null, text: { zh: "他说得像在报一个早就过去的时间。", en: "He says it like a time long past." } },
  { say: null, text: { zh: "站长把票递给他。", en: "The stationmaster hands him the ticket." } },
  { say: "conductor", text: { zh: "2A，2B。十年前的票。还有效。", en: "2A, 2B. Ten years old. Still valid." } },
  { say: "conductor", text: { zh: "这趟车十年开一次。有人等了一辈子，只等到一次。", en: "This train runs once every ten years. Some people wait a lifetime for one ride." } },
  { say: null, text: { zh: "他看了你一眼。", en: "He glances at you." } },
  { say: "conductor", text: { zh: "这位是？", en: "And this one?" } },
  { say: "old", text: { zh: "同行。", en: "Travelling with her." } },
  { say: null, text: { zh: "列车员没有问更多。他把票还回来，票角在灯下白得像一小片纸月亮。", en: "The conductor asks no more. He hands the ticket back. Its corner is white under the lamp, like a small paper moon." } },
  { say: "conductor", text: { zh: "上车吧。只停到雨停。", en: "Board. We wait only until the rain stops." } },
  { say: null, text: { zh: "小梅没有动。她看着车门，像看着一扇很窄的、只能一个人过的门。", en: "Mei doesn't move. She looks at the door as if it were very narrow, wide enough for only one." } },
  { say: "mei", text: { zh: "我怕。", en: "I'm afraid." } },
  { say: null, text: { zh: "「我也怕。」你说，「但我更怕什么都没说就回去。」", en: "\"I'm afraid too,\" you say. \"But I'm more afraid of going back without saying anything.\"" } },
  { say: null, text: { zh: "「怕什么？」", en: "\"Of what?\"" } },
  { say: "mei", text: { zh: "怕上去以后，发现他怪我。", en: "That when I get on, I'll find he blames me." } },
  { say: null, text: { zh: "站长把灯放在长椅上。灯光从下往上照着他，皱纹像铁轨一样深。", en: "The stationmaster sets the lamp on the bench. The light comes from below, his wrinkles deep as rails." } },
  { say: "old", text: { zh: "他要是怪你，就不会把第二段留给你。", en: "If he blamed you, he wouldn't have left you the second verse." } },
  { say: null, text: { zh: "小梅看着你。她的眼睛里有一层水，分不清是雨还是别的。", en: "Mei looks at you. There is a layer of water in her eyes; you can't tell if it is rain." } },
  { say: "old", text: { zh: "三条路。一起上车。让她一个人上车。请她留下。", en: "Three ways. Board together. Let her board alone. Ask her to stay." } },
  { say: "old", text: { zh: "三条路都不算错。", en: "None of the three is wrong." } },
  { say: null, text: { zh: "雨落在车顶上，声音很密。车身是暖的，像一头在雨里等久了的动物。", en: "Rain falls densely on the roof. The carriage is warm, like an animal that has waited a long time in the rain." } },
  { say: "mei", text: { zh: "我不勉强你。", en: "I won't make you come." } },
  { choice: [
    { text: { zh: "一起上车", en: "Board together" }, goto: "board_train", set: "boarded" },
    { text: { zh: "让她一个人走", en: "Let her go alone" }, goto: "alone_wait", set: "alone" },
    { text: { zh: "请她留下", en: "Ask her to stay" }, goto: "stay_beg", set: "stayedNight" }
  ] }
);
</script>
<script data-src="src/story/06-train.js">
/* Chapter 5: the carriage, the stop ten years ago, and the second bell. */

SCRIPT.push(
  { label: "board_train" },
  { chapter: { zh: "第五章", en: "Chapter Five" }, sub: { zh: "车厢", en: "The Carriage" } },
  { bg: "train" },
  { say: null, text: { zh: "你走上车。小梅跟在你后面。", en: "You step on. Mei follows." } },
  { say: null, text: { zh: "车门在你们身后合上。雨声忽然远了，像隔着一层很厚的玻璃。", en: "The door closes behind you. The rain suddenly sounds far away, as if behind thick glass." } },
  { say: null, text: { zh: "车厢里坐满了人，每个人都拿着一张旧票。", en: "The carriage is full. Everyone holds an old ticket." } },
  { say: null, text: { zh: "一个抱着请柬的女人，一个攥着信的小男孩，一个把怀表放在膝盖上的老人。", en: "A woman holding an invitation. A boy clutching a letter. An old man with a pocket watch on his knee." } },
  { say: null, text: { zh: "你注意到每个人手里都有一张票，票角都没有剪。他们的目的地写在脸上，却没有人说出来。", en: "Everyone holds a ticket. None of the corners are punched. Their destinations are written on their faces, but no one says them." } },
  { say: null, text: { zh: "没有人说话。车窗上都是雨。", en: "No one speaks. Rain covers the windows." } },
  { say: null, text: { zh: "你找到 2A、2B。靠窗，面对面。桌板上有一道很深的刻痕，像有人用钥匙写过字。", en: "You find 2A, 2B: window seats, facing each other. There is a deep scratch in the table, as if someone wrote with a key." } },
  { say: null, text: { zh: "小梅坐在靠窗的位置。她把票放在桌上，用手指压平。", en: "Mei takes the window seat. She lays the ticket on the table and smooths it with her fingers." } },
  { show: "right", who: "conductor" },
  { say: "conductor", text: { zh: "一站。那一夜。一句话。第二遍铃响，必须回来。", en: "One stop. That night. One sentence. At the second bell, you must return." } },
  { say: null, text: { zh: "「如果留下来呢？」", en: "\"And if we stay?\"" } },
  { say: "conductor", text: { zh: "留下来的人，会变成这里的雨。", en: "Those who stay become the rain here." } },
  { say: null, text: { zh: "「他们呢？」你朝车厢里看了一眼。", en: "\"And them?\" You glance down the carriage." } },
  { say: "conductor", text: { zh: "都只停一站。", en: "Everyone stops for one station." } },
  { say: null, text: { zh: "车开了。没有晃动，只有窗外的雨往后退。", en: "The train moves. No jolt, only the rain sliding backward." } },
  { say: null, text: { zh: "那些雨丝往后退的时候，你看见一些不属于现在的光：一盏旧灯、一扇木门、一个夏天的傍晚。", en: "As the rain slides back, you see lights that don't belong to now: an old lamp, a wooden door, a summer evening." } },
  { say: null, text: { zh: "每扇窗都像一块很小的银幕，放着别人的那一夜。", en: "Each window is a tiny screen showing someone else's night." } },
  { say: null, text: { zh: "有一扇窗里，一个女人在车站门口等人；有一扇窗里，一个男人把信投进邮筒，又伸手想拿回来。", en: "In one window a woman waits at a station door. In another a man drops a letter into a postbox, then reaches in to take it back." } },
  { say: null, text: { zh: "小梅看着窗外，手放在票上。", en: "Mei looks out, her hand on the ticket." } },
  { say: "mei", text: { zh: "你父亲是什么样的人？", en: "What was your father like?" } },
  { say: null, text: { zh: "「很晚回家。身上有烟和雨的味道。他总说，夜里的人比较诚实。」", en: "\"He came home late. He smelled of smoke and rain. He used to say people are more honest at night.\"" } },
  { say: "mei", text: { zh: "你跟他像吗？", en: "Are you like him?" } },
  { say: null, text: { zh: "「不知道。他走以后，我才开始录声音。」", en: "\"I don't know. I started recording sounds after he died.\"" } },
  { say: "mei", text: { zh: "为什么？", en: "Why?" } },
  { say: null, text: { zh: "「因为声音不会回头。录下来，它就一直在那里。」", en: "\"Because sound doesn't turn around. Once it's recorded, it stays.\"" } },
  { say: null, text: { zh: "小梅沉默了一会儿。车轮在雨里走，像一根很长的针，慢慢缝着什么。", en: "Mei is quiet for a while. The wheels move through the rain like a long needle, slowly sewing something." } },
  { say: "mei", text: { zh: "我有时候想，如果那天我上了车，我妈会不会更快好起来。", en: "Sometimes I think if I'd got on that night, my mother might have got better sooner." } },
  { say: null, text: { zh: "「不会。」你说。", en: "\"No,\" you say." } },
  { say: "mei", text: { zh: "你怎么知道？", en: "How do you know?" } },
  { say: null, text: { zh: "「因为你现在还在想。想了十年。」", en: "\"Because you're still thinking about it. Ten years later.\"" } },
  { say: null, text: { zh: "她看着你，像被说中了。", en: "She looks at you as if you've hit something true." } },
  { say: null, text: { zh: "车轮慢下来。窗外的雨停在半空，像被谁按了暂停。", en: "The wheels slow. The rain outside stops in mid-air, as if someone pressed pause." } },
  { say: null, text: { zh: "车停了。窗外是十年前的站台。", en: "The train stops. Outside is the platform of ten years ago." } },
  { say: null, text: { zh: "袁背着吉他，站在灯下。", en: "Yuan stands under the lamp with his guitar on his back." } },
  { hide: "right" },
  { bg: "memory" },
  { show: "left", who: "mei" },
  { show: "right", who: "yuan" },
  { say: null, text: { zh: "小梅下车。你跟在后面。", en: "Mei steps down. You follow." } },
  { say: null, text: { zh: "站台比记忆里窄。灯比记忆里亮。", en: "The platform is narrower than memory. The lights are brighter." } },
  { say: null, text: { zh: "小梅在几步外停下。你站在她身后，像一个不该打扰的人。", en: "Mei stops a few steps away. You stand behind her, like someone who shouldn't interrupt." } },
  { say: "yuan", text: { zh: "你还是来了。", en: "You came after all." } },
  { say: "mei", text: { zh: "我来晚了。", en: "I'm late." } },
  { say: "yuan", text: { zh: "不晚。车还没开。", en: "Not late. The train hasn't left." } },
  { say: null, text: { zh: "他们坐在长椅上。袁把吉他放在脚边，像十年前一样。", en: "They sit on the bench. Yuan sets the guitar by his feet, as he did ten years ago." } },
  { say: "yuan", text: { zh: "我到城里以后，才知道雨到处都下。", en: "After I got to the city, I learned it rains everywhere." } },
  { say: "yuan", text: { zh: "我写过很多歌。最想写完的还是这一首。", en: "I wrote a lot of songs. This is the one I most wanted to finish." } },
  { say: "mei", text: { zh: "为什么第二段是空的？", en: "Why was the second verse empty?" } },
  { say: "yuan", text: { zh: "因为第二段要两个人唱。", en: "Because the second verse needs two people." } },
  { say: "mei", text: { zh: "我那天说的话……", en: "What I said that night..." } },
  { say: "yuan", text: { zh: "我知道。你每次说谎，都会看着地面。", en: "I know. When you lie, you always look at the ground." } },
  { say: "mei", text: { zh: "对不起。我没有怪你。我只是害怕你走了以后，家里只剩我。", en: "I'm sorry. I never blamed you. I was only afraid that after you left, I'd be alone at home." } },
  { say: "yuan", text: { zh: "我知道。", en: "I know." } },
  { say: "yuan", text: { zh: "我走以后，妈怎么样？", en: "After I left, how was Mother?" } },
  { say: "mei", text: { zh: "她一直在等你。", en: "She waited for you the whole time." } },
  { say: "yuan", text: { zh: "你呢？", en: "And you?" } },
  { say: "mei", text: { zh: "我也是。", en: "Me too." } },
  { say: "yuan", text: { zh: "妈走的时候，你在旁边吗？", en: "Were you with Mother when she died?" } },
  { say: "mei", text: { zh: "在。", en: "Yes." } },
  { say: "yuan", text: { zh: "她说什么了吗？", en: "Did she say anything?" } },
  { say: "mei", text: { zh: "她说，别怪你哥。", en: "She said, don't blame your brother." } },
  { say: null, text: { zh: "袁低下头。他的手指在吉他弦上按了一下，没有出声。", en: "Yuan lowers his head. His finger presses a string without making a sound." } },
  { say: "yuan", text: { zh: "我本来想，等第一首歌卖出去，就回来。后来想，等第二首。再后来，就不知道该怎么回来了。", en: "I thought I'd come back when I sold the first song. Then when I sold the second. Then I didn't know how to come back." } },
  { say: "mei", text: { zh: "你可以写信。", en: "You could have written." } },
  { say: "yuan", text: { zh: "我写了。写了很多。没有寄。", en: "I did. A lot. I never sent them." } },
  { say: null, text: { zh: "他从吉他盒里拿出一叠折得很小的纸。纸边已经起毛。", en: "He takes a stack of small folded papers from the guitar case. Their edges have furred." } },
  { say: "yuan", text: { zh: "都在这里。", en: "They're all here." } },
  { say: "yuan", text: { zh: "最上面那封，是写给你的。我改了七遍。", en: "The top one is for you. I rewrote it seven times." } },
  { say: "mei", text: { zh: "为什么不寄？", en: "Why didn't you send them?" } },
  { say: "yuan", text: { zh: "怕你还在生气。", en: "I was afraid you were still angry." } },
  { say: null, text: { zh: "小梅接过那叠纸，没有打开。", en: "Mei takes the papers. She doesn't open them." } },
  { say: null, text: { zh: "袁从口袋里摸出一枚硬币，放在她手心。「车票钱。」他说，「我一直没还你。」", en: "Yuan digs a coin from his pocket and puts it in her palm. \"For the ticket,\" he says. \"I never paid you back.\"" } },
  { say: null, text: { zh: "小梅把硬币握紧。", en: "Mei closes her hand around it." } },
  { say: null, text: { zh: "远处第一遍铃响。", en: "Far away, the first bell rings." } },
  { say: null, text: { zh: "袁把第二段歌词递给她。纸很薄，灯从背面透过来。", en: "Yuan gives her the second verse. The paper is thin; the lamp shines through it." } },
  { say: null, text: { zh: "她看了很久，轻轻唱了两句。站台的灯亮了一点。", en: "She reads it for a long time, then sings two lines softly. The platform lights brighten a little." } },
  { say: "yuan", text: { zh: "你唱得比我想的好。", en: "You sing it better than I imagined." } },
  { say: "mei", text: { zh: "你以前总说我跑调。", en: "You always said I was off-key." } },
  { say: "yuan", text: { zh: "那是以前。", en: "That was before." } },
  { sfx: "tick" },
  { say: null, text: { zh: "第二遍铃响了。", en: "The second bell rings." } },
  { say: null, text: { zh: "袁站起来。", en: "Yuan stands." } },
  { say: "yuan", text: { zh: "车要开了。", en: "The train is leaving." } },
  { say: "mei", text: { zh: "哥。", en: "Yuan." } },
  { say: "yuan", text: { zh: "嗯。", en: "Yes?" } },
  { say: "mei", text: { zh: "我长大了。", en: "I grew up." } },
  { say: "yuan", text: { zh: "我知道。", en: "I know." } },
  { say: null, text: { zh: "他退后一步，站在灯下。", en: "He steps back under the lamp." } },
  { choice: [
    { text: { zh: "留在这一站", en: "Stay at this station" }, goto: "stay_memory" },
    { text: { zh: "回到车上", en: "Return to the train" }, goto: "try_return" }
  ] },

  { label: "stay_memory" },
  { say: null, text: { zh: "你握住小梅的手。她没有回头。", en: "You take Mei's hand. She doesn't look back." } },
  { say: null, text: { zh: "第二遍铃停了。车门关上。车开走，车灯像一条很长的线，慢慢被雨吞掉。", en: "The second bell stops. The doors close. The train leaves, its lights a long line slowly swallowed by rain." } },
  { say: null, text: { zh: "站台上的钟停在 0:47。", en: "The platform clock stops at 0:47." } },
  { say: null, text: { zh: "袁把吉他背好，走到站台尽头。他没有回头。", en: "Yuan shoulders his guitar and walks to the end of the platform. He doesn't look back." } },
  { say: null, text: { zh: "小梅看着他的背影，直到灯灭。", en: "Mei watches his back until the light goes out." } },
  { say: null, text: { zh: "雨一直下。你们坐在长椅上，谁也没有说话。", en: "The rain goes on. You sit on the bench. Neither of you speaks." } },
  { say: null, text: { zh: "后来，站台变成了候车室，候车室变成了一间小屋。你们在里面住了很久。", en: "Later, the platform becomes a waiting room, and the waiting room becomes a small house. You live there for a long time." } },
  { say: null, text: { zh: "小梅有时候会哼第二段。哼到一半，就停下。", en: "Sometimes Mei hums the second verse. Halfway through, she stops." } },
  { say: null, text: { zh: "你有时候会想，外面现在是哪一年。", en: "Sometimes you wonder what year it is outside." } },
  { say: null, text: { zh: "但雨声盖住了答案。", en: "But the rain covers the answer." } },
  { say: null, text: { zh: "后来有人说，雨夜里能看见两个人坐在长椅上，等一趟不会来的车。", en: "Later, people said that on rainy nights you can see two people on the bench, waiting for a train that never comes." } },
  { end: true, title: { zh: "结局：夜车", en: "Ending: Night Train" }, sub: { zh: "你们留在了那一夜。", en: "You stayed in that night." } },

  { label: "try_return" },
  { if: "tape", goto: "check_truth" },
  { goto: "return_alone" },

  { label: "check_truth" },
  { if: "truth", goto: "true_return" },
  { goto: "return_alone" },

  { label: "return_alone" },
  { say: null, text: { zh: "你松开她的手。", en: "You let go of her hand." } },
  { say: null, text: { zh: "「我得回去。」你说。", en: "\"I have to go back,\" you say." } },
  { say: null, text: { zh: "她没有拦你。袁也没有。", en: "She doesn't stop you. Neither does Yuan." } },
  { say: null, text: { zh: "你上了车。车门关上时，她站在十年前的灯下，像一张没有寄出的照片。", en: "You board. As the door closes, she stands under the light of ten years ago, like a photograph never sent." } },
  { say: null, text: { zh: "车开回现在。窗外的灯一盏一盏往后退，最后只剩雨。", en: "The train returns to now. The lights outside slide back one by one, until only rain is left." } },
  { say: null, text: { zh: "天亮时你一个人站在站台，手里多了一张没有剪角的票。", en: "At dawn you stand alone on the platform, holding an uncut ticket." } },
  { say: null, text: { zh: "站长不在。候车室的钟还在走。", en: "The stationmaster is gone. The waiting-room clock is still moving." } },
  { end: true, title: { zh: "结局：月台", en: "Ending: The Platform" }, sub: { zh: "你一个人回到了现在。", en: "You returned alone." } },

  { label: "true_return" },
  { say: null, text: { zh: "你按下录音机。磁带里的第二段和她的声音接上。", en: "You press play. The second verse on the tape joins her voice." } },
  { say: null, text: { zh: "袁听见了。他笑了：「原来它真的到了。」", en: "Yuan hears it. He smiles. \"So it really got here.\"" } },
  { say: "yuan", text: { zh: "我寄出去的时候，怕它到不了。", en: "When I sent it, I was afraid it wouldn't arrive." } },
  { say: null, text: { zh: "「它到了。」你说，「只是晚了一点。」", en: "\"It arrived,\" you say. \"Just a little late.\"" } },
  { say: null, text: { zh: "袁看着小梅。", en: "Yuan looks at Mei." } },
  { say: "yuan", text: { zh: "走吧。雨要停了。", en: "Go. The rain is stopping." } },
  { say: null, text: { zh: "他往后退了一步，像把位置让出来。", en: "He steps back, as if making room." } },
  { say: null, text: { zh: "小梅握住你的手。你们在第二遍铃里回到车上。", en: "Mei takes your hand. You return to the train inside the second bell." } },
  { say: null, text: { zh: "车门关上。站台往后退。袁还站在灯下，直到变成一个小点。", en: "The doors close. The platform slides away. Yuan stays under the lamp until he becomes a small point." } },
  { goto: "true_dawn" }
);
</script>
<script data-src="src/story/07-alone.js">
/* Chapter 6a: Mei boards alone; you and the stationmaster wait for dawn. */

SCRIPT.push(
  { label: "alone_wait" },
  { chapter: { zh: "第六章", en: "Chapter Six" }, sub: { zh: "月台", en: "The Platform" } },
  { bg: "platform" },
  { say: null, text: { zh: "小梅上了车。她在门口停了一下，回头看你。", en: "Mei boards. She pauses in the doorway and looks back." } },
  { say: null, text: { zh: "你朝她点头。", en: "You nod." } },
  { say: "mei", text: { zh: "等我。", en: "Wait for me." } },
  { say: null, text: { zh: "车门关上。车开走。", en: "The door closes. The train leaves." } },
  { hide: "left" },
  { show: "right", who: "old" },
  { say: null, text: { zh: "站台上只剩你和站长。", en: "Only you and the stationmaster are left on the platform." } },
  { say: null, text: { zh: "「她会回来吗？」", en: "\"Will she come back?\"" } },
  { say: "old", text: { zh: "会。只要她想回来。", en: "Yes. If she wants to." } },
  { bg: "waiting" },
  { say: null, text: { zh: "你们回到候车室。他给你倒了一杯水，自己坐在售票口后面。", en: "You return to the waiting room. He pours you water and sits behind the ticket window." } },
  { say: null, text: { zh: "「你也有票吗？」", en: "\"Do you have a ticket too?\"" } },
  { say: null, text: { zh: "他从票簿底下抽出一张票。很旧，日期已经看不清。", en: "He takes a ticket from under the ledger. It is old; the date is unreadable." } },

  { say: "old", text: { zh: "那天没下雨。", en: "It didn't rain that day." } },
  { say: null, text: { zh: "他笑了一下，像在说别人的事。", en: "He smiles a little, as if talking about someone else." } },
  { say: null, text: { zh: "「后来呢？」", en: "\"And then?\"" } },
  { say: "old", text: { zh: "后来我留在这儿卖票。卖着卖着，就老了。", en: "I stayed and sold tickets. Sold them until I got old." } },
  { say: null, text: { zh: "「你后悔吗？」", en: "\"Do you regret it?\"" } },
  { say: "old", text: { zh: "后悔什么？", en: "Regret what?" } },
  { say: null, text: { zh: "「没走。」", en: "\"Not going.\"" } },
  { say: "old", text: { zh: "我要是走了，今晚谁给你开门？", en: "If I'd gone, who would open the door for you tonight?" } },
  { say: null, text: { zh: "他把票夹回票簿。动作很轻，像把一件旧衣服叠好。", en: "He slips the ticket back into the ledger, gently, like folding an old coat." } },
  { bg: "dawn" },
  { sfx: "tick" },
  { say: null, text: { zh: "天快亮的时候，雨小了。", en: "Near dawn, the rain softens." } },
  { say: null, text: { zh: "铁轨尽头亮起一盏灯。车回来了。", en: "A light appears at the end of the rails. The train is back." } },
  { show: "left", who: "mei" },
  { say: null, text: { zh: "小梅下车。她的眼睛是红的，但人是轻的。", en: "Mei steps down. Her eyes are red, but she looks lighter." } },
  { say: "mei", text: { zh: "我说了。", en: "I said it." } },
  { say: null, text: { zh: "「他听见了吗？」", en: "\"Did he hear you?\"" } },
  { say: "mei", text: { zh: "听见了。他还说，我唱歌还是跑调。", en: "He did. He also said I still sing off-key." } },
  { say: null, text: { zh: "她笑了一下。晨光落在她脸上，把雨痕照得很淡。", en: "She smiles. Morning light falls on her face and fades the rain marks." } },
  { sfx: "coin" },
  { say: null, text: { zh: "她把票根放在你手里。另一半已经剪掉了。", en: "She puts the ticket stub in your hand. The other half has been punched." } },
  { say: null, text: { zh: "票根背面有一行很小的字：「2A 小梅，2B 袁。」是十年前的笔迹。", en: "On the back, in tiny writing: 2A Mei, 2B Yuan. The hand is ten years old." } },
  { say: "mei", text: { zh: "这个给你。我用不上了。", en: "This is for you. I don't need it anymore." } },
  { say: null, text: { zh: "「谢谢你等我。」", en: "\"Thank you for waiting.\"" } },
  { say: null, text: { zh: "「你接下来去哪儿？」", en: "\"Where will you go now?\"" } },
  { say: "mei", text: { zh: "回城里。上班。明天还要开门。", en: "Back to the city. To work. I have to open the shop tomorrow." } },
  { say: null, text: { zh: "她走向路口的第一班公交。没有回头。", en: "She walks to the first bus at the junction. She doesn't look back." } },
  { hide: "left" },
  { say: null, text: { zh: "站长开始关窗。他把最后一盏灯留到最后。", en: "The stationmaster starts closing the shutters. He leaves the last lamp until last." } },
  { say: null, text: { zh: "「车站拆了以后，你去哪儿？」", en: "\"Where will you go after the station is gone?\"" } },
  { say: "old", text: { zh: "我留在这里。总得有人关灯。", en: "I'll stay. Someone has to turn off the lights." } },
  { say: "old", text: { zh: "灯关了以后，车站就不在了。但雨声会留下来。", en: "Once the lights are off, the station is gone. But the rain stays." } },
  { say: null, text: { zh: "你把最后一段雨声录完。", en: "You record the last of the rain." } },
  { say: null, text: { zh: "磁带里，第二段还是空的。但你已经会哼了。", en: "On the tape, the second verse is still empty. But you can hum it now." } },
  { say: null, text: { zh: "你忽然想起父亲的话：有些声音要等很多年才听得见。", en: "You remember your father's words: some sounds take years to hear." } },
  { say: null, text: { zh: "你走出站台。天亮了，雨停了。", en: "You walk out. Day has broken. The rain has stopped." } },
  { end: true, title: { zh: "结局：月台", en: "Ending: The Platform" }, sub: { zh: "她回来了，然后走了。", en: "She came back, and then she left." } }
);
</script>
<script data-src="src/story/08-stay.js">

SCRIPT.push(
  { label: "stay_beg" },

  { say: null, text: { zh: "雨开始变小。站长说：「雨停了，车就走。」", en: "The rain begins to thin. The stationmaster says, \"When the rain stops, the train goes.\"" } },

  { say: null, text: { zh: "小梅把票举到一半，又放下。", en: "Mei lifts the ticket halfway, then lowers it." } },
  { say: "mei", text: { zh: "我怕。", en: "I'm afraid." } },
  { say: null, text: { zh: "「我知道。」", en: "\"I know.\"" } },
  { say: "mei", text: { zh: "你怕吗？", en: "Are you afraid?" } },
  { say: null, text: { zh: "「怕。」", en: "\"Yes.\"" } },
  { say: "mei", text: { zh: "那你为什么留下？", en: "Then why are you staying?" } },

  { say: null, text: { zh: "她看着你，像第一次听懂你的话。", en: "She looks at you as if hearing you for the first time." } },
  { say: null, text: { zh: "雨又小了一点。站台的灯不再抖。", en: "The rain thins again. The platform lights stop shaking." } },

  { say: "mei", text: { zh: "哥，对不起。", en: "Yuan, I'm sorry." } },
  { say: "mei", text: { zh: "我明天再来。", en: "I'll come again tomorrow." } },
  { say: null, text: { zh: "车门关上。车开走。", en: "The doors close. The train leaves." } },
  { hide: "right" },
  { say: null, text: { zh: "站长把站台的灯一盏一盏关掉。最后一盏，他留到了天亮。", en: "The stationmaster turns off the platform lights one by one. The last one he leaves until dawn." } },

<script data-src="src/game.js">
var game = LoGame.create({ width: 160, height: 144, lang: "zh" });
var T = game.t;
document.documentElement.lang = game.lang === "zh" ? "zh-CN" : "en";

/* ---- the engine: plays SCRIPT. You should not need to change anything below. ---- */
var ART = {}, LABELS = {};
function big(rows) { return rows.map(function (r) { return r.replace(/./g, "$&$&"); }).reduce(function (a, r) { a.push(r, r); return a; }, []); }
Object.keys(CAST).forEach(function (k) { ART[k] = LoGame.sprite(big(CAST[k].art)); });
SCRIPT.forEach(function (s, i) { if (s.label) LABELS[s.label] = i; });

var BOX_Y = 88, LINES = 3, SPEED = 30;
var S;          /* saved: { v, pc, flags, bg, left, right } */
var log = [];   /* backlog: [{ who, text }] */
var cur = null; /* what waits for the player: { kind: "say"|"choice"|"chapter"|"end", ... } */
var view = "play", logTop = 0;

function fresh() { return { v: STORY_VERSION, pc: 0, flags: {}, bg: null, left: null, right: null }; }
function who(id) { return id && CAST[id] ? T(CAST[id].name) : ""; }

/* the backdrop decides the weather; "dawn" and "empty" are quiet */
var heard = "";
function listen(key) {
  var a = AMBIENCE[key] || null, now = a ? a.join(" ") : "";
  if (now === heard) return;
  heard = now;
  game.ambience(a ? a[0] : null, a ? a[1] : 0);
}

function jump(label) { if (!(label in LABELS)) throw new Error("no label " + label); S.pc = LABELS[label]; }

/* run steps until one needs the player */
function run() {
  for (var guard = 0; guard < 10000; guard++) {
    var s = SCRIPT[S.pc];
    if (!s) { cur = { kind: "end", title: "", sub: "" }; return; }
    if (s.chapter) {
      S.pc++;
      game.save("vn", S);
      cur = { kind: "chapter", title: T(s.chapter), sub: s.sub ? T(s.sub) : "" };
      return;
    }
    if (s.bg !== undefined) { S.bg = s.bg; S.pc++; listen(s.bg); }
    else if (s.show) { S[s.show] = s.who; S.pc++; }
    else if (s.hide) { S[s.hide] = null; S.pc++; }
    else if (s.label) S.pc++;
    else if (s.set) { S.flags[s.set] = true; S.pc++; }
    else if (s.sfx) { game.sfx(s.sfx); S.pc++; }
    else if (s.if !== undefined) { if (S.flags[s.if]) jump(s.goto); else S.pc++; }
    else if (s.goto) jump(s.goto);
    else if (s.say !== undefined) {
      game.save("vn", S);
      cur = { kind: "say", who: s.say, text: T(s.text), pages: null, page: 0, n: 0 };
      log.push({ who: s.say, text: cur.text }); if (log.length > 300) log.shift();
      return;
    } else if (s.choice) { game.save("vn", S); cur = { kind: "choice", items: s.choice, idx: 0 }; return; }
    else if (s.end) {
      game.remove("vn");
      game.sfx("win");
      cur = { kind: "end", title: s.title ? T(s.title) : "", sub: s.sub ? T(s.sub) : "" };
      return;
    }
    else S.pc++;
  }
}

function advance() {
  if (cur.kind === "chapter") { game.sfx("tap"); run(); return; }
  if (cur.kind === "say") {
    var page = cur.pages ? cur.pages[cur.page].join("") : cur.text;
    if (cur.n < page.length) { cur.n = page.length; return; }
    if (cur.pages && cur.page < cur.pages.length - 1) { cur.page++; cur.n = 0; game.sfx("tick"); return; }
    S.pc++; game.sfx("tap"); run();
  } else if (cur.kind === "choice") {
    var c = cur.items[cur.idx];
    log.push({ who: null, text: "> " + T(c.text) });
    if (c.set) S.flags[c.set] = true;
    game.sfx("ok");
    if (c.goto) jump(c.goto); else S.pc++;
    run();
  } else if (cur.kind === "end") game.go("title");
}

function choiceRow(k) {
  var lineHeight = game.g.lineHeight, h = cur.items.length * lineHeight + 8;
  var y = Math.floor((BOX_Y - h) / 2) + 20;
  return { x: 8, y: y + 4 + k * lineHeight, w: 144, h: lineHeight };
}

function titleRow(k) {
  var lineHeight = game.g.lineHeight;
  return { x: 40, y: 76 + k * lineHeight, w: 80, h: lineHeight };
}

function contains(row, x, y) {
  return x >= row.x && x < row.x + row.w && y >= row.y && y < row.y + row.h;
}

game.scene("play", {
  enter: function (saved) {
    S = saved && saved.v === STORY_VERSION ? saved : fresh();
    log = []; view = "play";
    if (S.bg) listen(S.bg);
    run();
  },
  update: function (dt) {
    if (view === "log") {
      if (game.repeat("up")) logTop = Math.max(0, logTop - 1);
      if (game.repeat("down")) logTop = Math.min(Math.max(0, log.length - 1), logTop + 1);
      if (game.pressed("b") || game.pressed("a")) { view = "play"; game.sfx("tap"); }
      return;
    }
    if (cur.kind === "say") cur.n += dt * SPEED;
    if (cur.kind === "choice") {
      if (game.repeat("up")) { cur.idx = (cur.idx + cur.items.length - 1) % cur.items.length; game.sfx("move"); }
      if (game.repeat("down")) { cur.idx = (cur.idx + 1) % cur.items.length; game.sfx("move"); }
    }
    if (game.pressed("b") && cur.kind !== "end" && cur.kind !== "chapter") {
      view = "log"; logTop = Math.max(0, log.length - 4); game.sfx("tap"); return;
    }
    if (game.pointer.pressed && cur.kind === "choice") {
      for (var k = 0; k < cur.items.length; k++) {
        if (contains(choiceRow(k), game.pointer.x, game.pointer.y)) {
          cur.idx = k;
          advance();
          return;
        }
      }
    }
    if (game.pressed("a") || game.pressed("start") ||
        (game.pointer.pressed && cur.kind !== "choice")) advance();
  },
  draw: function (g) {
    g.clear(g.PAPER);
    if (S.bg && BACKDROPS[S.bg]) BACKDROPS[S.bg](g);
    if (S.left && ART[S.left]) g.sprite(ART[S.left], 14, BOX_Y - 32);
    if (S.right && ART[S.right]) g.sprite(ART[S.right], 122, BOX_Y - 32, { flip: true });
    if (view === "log") return drawLog(g);
    if (cur.kind === "chapter") return drawChapter(g);
    if (cur.kind === "say") {
      if (!cur.pages) {
        var lines = g.wrap(cur.text, 150), pages = [];
        for (var i = 0; i < lines.length; i += LINES) pages.push(lines.slice(i, i + LINES));
        cur.pages = pages.length ? pages : [[""]];
      }
      g.window(0, BOX_Y, 160, 144 - BOX_Y);
      var name = who(cur.who);
      if (name) { var w = g.measure(name) + 8; g.window(4, BOX_Y - 14, w, 15, { thin: true }); g.text(name, 8, BOX_Y - 13); }
      var left = Math.floor(cur.n), pg = cur.pages[cur.page];
      for (var j = 0; j < pg.length && left > 0; j++) {
        g.text(pg[j].slice(0, left), 5, BOX_Y + 4 + j * g.lineHeight);
        left -= pg[j].length;
      }
      if (cur.n >= pg.join("").length && Math.floor(game.time * 3) % 2) g.arrow(150, 136, "down", g.INK);
    } else if (cur.kind === "choice") {
      var h = cur.items.length * g.lineHeight + 8, y = Math.floor((BOX_Y - h) / 2) + 20;
      g.window(8, y, 144, h);
      cur.items.forEach(function (c, k) {
        var row = choiceRow(k), selected = k === cur.idx;
        if (selected) g.rect(row.x + 2, row.y, row.w - 4, row.h, g.INK);
        g.text(T(c.text), 12, row.y, { color: selected ? g.PAPER : g.INK });
      });
    } else {
      g.window(0, BOX_Y, 160, 144 - BOX_Y);
      g.text(cur.title || "END", 80, BOX_Y + 8, { align: "center" });
      if (cur.sub) g.text(cur.sub, 80, BOX_Y + 24, { align: "center", color: g.INK });
      g.text(T({ zh: "按 A 回到标题", en: "A: back to title" }), 80, BOX_Y + 42, { align: "center", color: g.INK });
    }
  }
});

function drawChapter(g) {
  g.clear(g.PAPER);
  g.dither(0, 0, 160, 144, g.MID, 1);
  g.rect(20, 58, 120, 1, g.INK);
  var h = g.text(cur.title, 80, 38, { align: "center", width: 144 });
  g.text(cur.sub, 80, 66, { align: "center", width: 144, color: g.INK });
  g.text(T({ zh: "按 A 继续", en: "A: continue" }), 80, 118, { align: "center", color: g.INK });
  return h;
}

function drawLog(g) {
  g.rect(0, 0, 160, 144, g.PAPER);
  g.rect(0, 0, 160, 16, g.INK);
  g.text(T({ zh: "回看  ↑↓ 翻  B 返回", en: "Log  Up/Dn  B: back" }), 4, 1, { color: g.PAPER });
  var y = 20;
  for (var i = logTop; i < log.length && y < 140; i++) {
    var e = log[i], name = who(e.who);
    var line = name ? name + ": " + e.text : e.text;
    var lines = g.wrap(line, 152);
    for (var k = 0; k < lines.length && y < 140; k++) { g.text(lines[k], 4, y, { color: g.INK }); y += g.lineHeight; }
    y += 2;
  }
}

var saved = null, menuIdx = 0;
game.scene("title", {
  enter: function () {
    saved = null; menuIdx = 0;
    game.load("vn").then(function (v) { saved = v && v.v === STORY_VERSION ? v : null; });
    listen("title");
  },
  update: function () {
    var n = saved ? 2 : 1;
    if (game.repeat("up") || game.repeat("down")) { menuIdx = (menuIdx + 1) % n; game.sfx("move"); }
    if (game.pointer.pressed) {
      var tapped = -1;
      for (var k = 0; k < n; k++) {
        if (contains(titleRow(k), game.pointer.x, game.pointer.y)) { tapped = k; break; }
      }
      if (tapped < 0) return;
      menuIdx = tapped;
    } else if (!game.pressed("a") && !game.pressed("start")) {
      return;
    }
    game.sfx("ok");
    game.go("play", saved && menuIdx === 0 ? saved : null);
  },
  draw: function (g) {
    g.clear(g.PAPER);
    g.dither(0, 0, 160, 144, g.MID, 1);
    g.text(T(TITLE), 80, 26, { align: "center" });
    g.text(T({ zh: "一张十年前的旧车票", en: "A ten-year-old ticket" }), 80, 44, { align: "center", color: g.INK });
    var items = saved ? [T({ zh: "继续", en: "Continue" }), T({ zh: "从头开始", en: "New story" })] : [T({ zh: "开始", en: "Start" })];
    g.window(40, 70, 80, items.length * g.lineHeight + 8);
    items.forEach(function (s, k) {
      var row = titleRow(k), selected = k === menuIdx;
      if (selected) g.rect(row.x + 2, row.y, row.w - 4, row.h, g.INK);
      g.text(s, 54, row.y, { color: selected ? g.PAPER : g.INK });
    });
    g.rect(0, 112, 160, 32, g.PAPER);
    g.line(0, 112, 160, 112, g.INK);
    var hasSave = !!saved;
    g.text(T(hasSave ? { zh: "↑↓ 选  A 确定", en: "Up/Dn  A: OK" } : { zh: "A 开始", en: "A: start" }), 80, 115, { align: "center", color: g.INK });
    g.text(T({ zh: "剧情中 A 前进 B 回看", en: "Story: A next  B log" }), 80, 128, { align: "center", color: g.INK });
  }
});
game.start("title");
</script>
