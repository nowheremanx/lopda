function drawFloor(g, x, y) {
  if (y % 16 === 0) g.rect(x, y, TILE, 1, g.MID);
  if ((x + ((y >> 4) & 1 ? 16 : 0)) % 32 === 0) g.rect(x, y % 16 ? y : y + 1, 1, y % 16 ? TILE : TILE - 1, g.MID);   /* the plank ends, offset per row */
}
function drawTile(g, tx, ty) {
  var c = M[ty][tx], x = tx * TILE, y = ty * TILE;
  if (c === "#") {
    g.rect(x, y, TILE, TILE, g.DARK);
    if (!isWall(tx, ty + 1)) g.rect(x, y + TILE - 1, TILE, 1, g.INK);
    return;
  }
  if (c === "O") { drawHole(g, tx, ty); return; }
  drawFloor(g, x, y);
  if (isWall(tx, ty - 1)) g.rect(x, y, TILE, 1, g.MID);   /* the drop shadow of the wall above */
  if (isWall(tx - 1, ty)) g.rect(x, y, 1, TILE, g.MID);   /* and of the wall to the left */
  if (c === "D") {
    if (gatesOpen) { g.rect(x, y, TILE, 1, g.MID); g.rect(x, y + TILE - 1, TILE, 1, g.MID); }   /* the empty slot */
    else {
      g.rect(x, y, TILE, TILE, g.DARK);
      g.rect(x + 1, y, 1, TILE, g.INK); g.rect(x + 4, y, 1, TILE, g.INK); g.rect(x + 6, y, 1, TILE, g.INK);
      g.rect(x, y, TILE, 1, g.INK); g.rect(x, y + TILE - 1, TILE, 1, g.INK);
    }
  }
}
/* a hole: an ink disc with a dark rim, or an ink trench when holes touch */
function drawHole(g, tx, ty) {
  var q = pit(tx, ty), l = q.l, t = q.t;
  if (q.round) { g.circle(l + 4, t + 4, 3, g.DARK, true); g.circle(l + 4, t + 4, 2, g.INK, true); return; }
  var gl = at(tx - 1, ty) === "O", gr = at(tx + 1, ty) === "O", gu = at(tx, ty - 1) === "O", gd = at(tx, ty + 1) === "O";
  g.rect(l, t, TILE, TILE, g.DARK);
  var l2 = l + (gl ? 0 : 1), r2 = l + TILE - (gr ? 0 : 1), t2 = t + (gu ? 0 : 1), b2 = t + TILE - (gd ? 0 : 1);
  g.rect(l2, t2, r2 - l2, b2 - t2, g.INK);
}

function drawThings(g) {
  checks.forEach(function (c) {
    g.circle(c.x, c.y, 3, g.DARK, false);
    if (c.lit) g.circle(c.x, c.y, 2, g.MID, true);
  });
  if (button) {
    var bx = button.x - 3, by = button.y - 3;
    if (gatesOpen) { g.rect(bx, by, 6, 6, g.DARK); g.rect(bx + 1, by + 1, 4, 4, g.MID); }
    else { g.rect(bx, by, 6, 6, g.INK); g.rect(bx + 1, by + 1, 4, 4, g.DARK); g.pixel(bx + 1, by + 1, g.PAPER); }
  }
  /* the goal: a cup with a flag on a pin that waves */
  g.circle(G0.x, G0.y, 3, g.DARK, true); g.circle(G0.x, G0.y, 2, g.MID, true);
  g.sprite(FLAGS[Math.floor(game.time * 3) % 2], G0.x, G0.y - 9);
  gems.forEach(function (gm, i) {
    if (!gm.got) g.sprite(GEM, gm.x - 2, gm.y - 3 + (Math.floor(game.time * 2 + i) % 2));
  });
}

/* the beetle: an oval shell with a centre line, a head and six leg ticks, two walking frames; drawn in its own
   frame (across u, along v toward where it walks) so one drawing serves all four directions */
function drawBeetle(g, b) {
  var cx = Math.round(b.x), cy = Math.round(b.y), fx = b.fx, fy = b.fy, f = b.awake && b.moving ? Math.floor(game.time * 8) % 2 : 0;
  function px(u, v, t) { g.pixel(cx + u * -fy + v * fx, cy + u * fx + v * fy, t); }
  function shell(u, v) { return (u * u) / 6.25 + ((v + 0.5) * (v + 0.5)) / 9 <= 1; }
  for (var v = -3; v <= 2; v++) for (var u = -2; u <= 2; u++) {
    if (!shell(u, v)) continue;
    var edge = !shell(u - 1, v) || !shell(u + 1, v) || !shell(u, v - 1) || !shell(u, v + 1);
    px(u, v, edge || u === 0 ? g.INK : g.DARK);          /* ink rim and centre line, dark wing cases */
  }
  px(-1, 1, g.PAPER);                                    /* the shell's sheen */
  px(-1, 3, g.INK); px(0, 3, g.INK); px(1, 3, g.INK);    /* the head */
  if (b.awake) {
    px(-1, 4, g.INK); px(1, 4, g.INK);                   /* feelers up */
    for (var k = -1; k <= 1; k++) { px(-3, k * 2 + f, g.INK); px(3, k * 2 + 1 - f, g.INK); }
  } else {
    for (var j = -1; j <= 1; j++) { px(-3, j * 2, g.INK); px(3, j * 2, g.INK); }
    if (Math.floor(game.time * 1.5) % 2) {               /* asleep: a small z above it */
      g.rect(cx + 4, cy - 9, 3, 1, g.INK); g.pixel(cx + 5, cy - 8, g.INK); g.rect(cx + 4, cy - 7, 3, 1, g.INK);
    }
  }
}

function drawBall(g) {
  if (state === "fall" || (state === "clear" && stateT < SINK + 0.2)) {
    var into = state === "fall" ? { x: ball.hx, y: ball.hy } : G0, from = state === "fall" ? ball : { x: ball.sx, y: ball.sy };
    var k = Math.min(1, stateT / (state === "fall" ? 0.4 : SINK)), x = LoGame.lerp(from.x, into.x, k), y = LoGame.lerp(from.y, into.y, k);
    if (k < 0.35) g.sprite(BALL, x - 3, y - 3);
    else if (k < 0.8) g.sprite(BALL4, x - 2, y - 2, { map: [g.INK, g.DARK, g.DARK, g.MID] });
    else if (k < 1) g.sprite(BALL2, x - 1, y - 1, { color: g.INK });
    return;
  }
  if (state === "clear") return;
  if (state === "bite" && Math.floor(stateT * 12) % 2) return;   /* bitten: the ball blinks before it goes back */
  g.rect(ball.x - 1, ball.y + 4, 5, 1, g.MID);           /* a flat shadow, down and right */
  g.rect(ball.x + 4, ball.y - 1, 1, 4, g.MID);
  g.sprite(BALL, ball.x - 3, ball.y - 3);
}

function drawSparks(g) {
  sparks = sparks.filter(function (s) { return s.t < 0.27; });
  sparks.forEach(function (s) {
    var f = Math.floor(s.t / 0.09), x = s.x, y = s.y;
    if (f === 0) { g.rect(x - 1, y, 3, 1, g.INK); g.rect(x, y - 1, 1, 3, g.INK); }
    else if (f === 1) { g.rect(x - 3, y, 7, 1, g.INK); g.rect(x, y - 3, 1, 7, g.INK); g.pixel(x, y, g.PAPER); }
    else { g.pixel(x - 3, y - 3, g.INK); g.pixel(x + 3, y - 3, g.INK); g.pixel(x - 3, y + 3, g.INK); g.pixel(x + 3, y + 3, g.INK); }
  });
}

/* the cellar: dark but for a circle round the ball, a flat edge with a 2 px dark ring, no dither */
function drawDark(g, sx, sy) {
  for (var y = HUD; y < FOOT; y++) {
    var dy = y + 0.5 - sy, o2 = LIGHT * LIGHT - dy * dy;
    if (o2 <= 0) { g.rect(0, y, VIEW_W, 1, g.INK); continue; }
    var o = Math.sqrt(o2), L = Math.round(sx - o), Rr = Math.round(sx + o);
    if (L > 0) g.rect(0, y, L, 1, g.INK);
    if (Rr < VIEW_W) g.rect(Rr, y, VIEW_W - Rr, 1, g.INK);
    var i2 = (LIGHT - 2) * (LIGHT - 2) - dy * dy;
    if (i2 <= 0) { g.rect(L, y, Rr - L, 1, g.DARK); continue; }
    var i = Math.sqrt(i2), l2 = Math.round(sx - i), r2 = Math.round(sx + i);
    g.rect(L, y, l2 - L, 1, g.DARK); g.rect(r2, y, Rr - r2, 1, g.DARK);
  }
  /* what can be spotted from the dark: gems and the goal glint, an awake beetle's eyes */
  function seen(x, y) { var dx = x - sx, dy = y - sy; return dx * dx + dy * dy < (LIGHT - 2) * (LIGHT - 2); }
  function glint(wx, wy, phase, tone, two) {
    var x = Math.round(wx - cam.x), y = Math.round(wy - cam.y) + HUD;
    if (x < 0 || x >= VIEW_W || y < HUD || y >= FOOT || seen(x, y)) return;
    if ((game.time + phase) % 1.2 > 0.3) return;
    g.pixel(x, y, tone); if (two) g.pixel(x + 2, y, tone);
  }
  gems.forEach(function (gm, i) { if (!gm.got) glint(gm.x, gm.y - 1, i * 0.37, g.PAPER); });
  glint(G0.x + 2, G0.y - 8, 0.6, g.PAPER);
  beetles.forEach(function (b, i) { if (b.awake) glint(b.x - 1, b.y, i * 0.5, g.DARK, true); });
}

function drawWorld(g) {
  var ox = Math.round(cam.x), oy = Math.round(cam.y);
  g.clip(0, HUD, VIEW_W, VIEW_H);
  g.origin(-ox, HUD - oy);
  var tx0 = Math.floor(ox / TILE), ty0 = Math.floor(oy / TILE);
  for (var ty = ty0; ty <= Math.min(MH - 1, ty0 + ROWS); ty++)
    for (var tx = tx0; tx <= Math.min(MW - 1, tx0 + COLS); tx++) drawTile(g, tx, ty);
  drawThings(g);
  beetles.forEach(function (b) { drawBeetle(g, b); });
  drawBall(g);
  drawSparks(g);
  g.origin(0, 0);
  if (areaOf(level) === 1) {
    var lx = state === "fall" ? ball.hx : state === "clear" ? G0.x : ball.x, ly = state === "fall" ? ball.hy : state === "clear" ? G0.y : ball.y;
    drawDark(g, lx - ox, ly - oy + HUD);
  }
  g.clip();
}

function drawHud(g) {
  g.rect(0, 0, 160, HUD, g.INK);
  g.text(T({ zh: "第{n}关 {name}", en: "{n} {name}" }, { n: level + 1, name: T(LEVELS[level].name) }), 3, 1, { color: g.PAPER });
  for (var i = 0; i < 3; i++) g.sprite(i < gemCount() ? PIP_FULL : PIP_EMPTY, 116 + i * 7, 5);
  /* how the sensor stands: a bubble level while tilt is live, else the word for keys */
  if (live) {
    g.frame(140, 2, 17, 12, g.PAPER);
    g.rect(147 + Math.round(tilt.x * 6), 7 - Math.round(tilt.y * 3.5), 3, 2, g.PAPER);
  } else {
    var w = asking ? "…" : mode === "tilt" ? T({ zh: "倾斜", en: "TILT" }) : T({ zh: "按键", en: "KEYS" });
    g.text(w, 157, 1, { color: g.PAPER, align: "right" });
  }
}

function drawFoot(g, text, force) {
  var n = !force && game.time < noteUntil;               /* a line about the sensor takes the footer for a moment */
  g.rect(0, FOOT, 160, 176 - FOOT, n ? g.INK : g.PAPER);
  g.rect(0, FOOT, 160, 1, g.INK);
  g.text(n ? note : text, 80, FOOT + 2, { align: "center", color: n ? g.PAPER : g.INK });
}

/* big text: lopix12 drawn once into a corner, read back and painted at twice the size (cached per string) */
var bigCache = {};
function bigText(g, str, cx, y, tone) {
  var bits = bigCache[str];
  if (!bits) {
    var w = Math.min(80, g.measure(str));
    g.rect(0, 0, w, 14, g.PAPER); g.text(str, 0, 0, { color: g.INK });
    bits = { w: w, px: [] };
    for (var j = 0; j < 14; j++) for (var i = 0; i < w; i++) if (g.get(i, j) === g.INK) bits.px.push(i, j);
    bigCache[str] = bits;
    g.rect(0, 0, w, 14, g.INK);
  }
  var x0 = Math.round(cx - bits.w);
  for (var k = 0; k < bits.px.length; k += 2) g.rect(x0 + bits.px[k] * 2, y + bits.px[k + 1] * 2, 2, 2, tone);
}

/* an area's card: the name large on ink, one line of hint, fading in over 0.4 s */
function drawIntro(g) {
  var a = AREAS[areaOf(level)], k = Math.min(1, stateT / 0.4), tone = k < 0.34 ? g.DARK : k < 0.67 ? g.MID : g.PAPER;
  g.rect(0, HUD, VIEW_W, VIEW_H, g.INK);
  g.text(T({ zh: "第{a}区", en: "AREA {a}" }, { a: areaOf(level) + 1 }), 80, HUD + 30, { align: "center", color: tone });
  bigText(g, T(a.name), 80, HUD + 48, tone);
  g.rect(40, HUD + 82, 80, 1, tone === g.PAPER ? g.MID : g.DARK);
  if (k >= 1) g.text(T(a.hint), 80, HUD + 92, { align: "center", color: g.PAPER, width: 150 });
}

/* the level's tally: name, time, the three gem slots filling one by one */
function drawTally(g, last) {
  var t = stateT - SINK;
  if (t < 0) return;
  g.window(18, 40, 124, 88);
  g.text(T(LEVELS[level].name), 80, 48, { align: "center" });
  g.text(T({ zh: "用时 {t}", en: "Time {t}" }, { t: clock(runT) }), 80, 66, { align: "center", color: g.DARK });
  var got = gemCount(), shown = Math.min(3, Math.floor(t / 0.3));
  for (var i = 0; i < 3; i++) g.sprite(i < shown && i < got ? SLOT_FULL : SLOT_EMPTY, 66 + i * 11, 88);
  if (t > 1.1) {
    var best = prog.times[level];
    g.text(last ? T({ zh: "全部通关！", en: "All cleared!" }) : T({ zh: "最快 {t}", en: "Best {t}" }, { t: clock(best || runT) }), 80, 106, { align: "center", color: g.DARK });
  }
}

/* ---- the title: a small tray rolling its own ball, then the keys with their pictures ---- */
var KEYS = {
  pad: LoGame.sprite(["...000...", "...010...", "000010000", "011111110", "000010000", "...010...", "...000..."]),
  a: LoGame.sprite(["..00000..", ".0111110.", "011131110", "011313110", "011333110", "011313110", ".0111110.", "..00000.."]),
  pill: LoGame.sprite([".000000000.", "01111111110", "01111111110", "01111111110", ".000000000."])
};
var FLAG = LoGame.sprite(["0...", "000.", "0000", "000.", "0...", "0...", "0..."]);
var TRAY = ["................", ".###......#.....", "...#..O...#..G..", "...#......#.....", "...######.......", "......O........."];
var TX = 16, TY = 26;                                   /* the tray's floor, 16x6 tiles */
var ROUTE = [[0, 5], [0, 0], [11, 0], [11, 2], [13, 2]];
var ROUTE_LEN = 0;
for (var ri = 1; ri < ROUTE.length; ri++) ROUTE_LEN += (Math.abs(ROUTE[ri][0] - ROUTE[ri - 1][0]) + Math.abs(ROUTE[ri][1] - ROUTE[ri - 1][1])) * TILE;
function routeAt(d) {                                   /* the point d px along the route, in screen pixels */
  for (var i = 1; i < ROUTE.length; i++) {
    var a = ROUTE[i - 1], b = ROUTE[i], l = (Math.abs(b[0] - a[0]) + Math.abs(b[1] - a[1])) * TILE;
    if (d <= l || i === ROUTE.length - 1) {
      var k = l ? Math.min(1, d / l) : 0;
      return { x: TX + (a[0] + (b[0] - a[0]) * k) * TILE + 4, y: TY + (a[1] + (b[1] - a[1]) * k) * TILE + 4 };
    }
    d -= l;
  }
}

function drawTray(g) {
  g.dither(TX - 1, TY + 50, 132, 4, g.MID, 2);          /* its shadow on the table */
  g.rect(TX - 4, TY - 4, 136, 56, g.INK);
  g.rect(TX - 3, TY - 3, 134, 54, g.DARK);
  g.rect(TX - 3, TY - 3, 134, 1, g.MID);
  g.rect(TX, TY, 128, 48, g.PAPER);
  for (var ty = 0; ty < 6; ty++) for (var tx = 0; tx < 16; tx++) {
    var ch = TRAY[ty][tx], x = TX + tx * TILE, y = TY + ty * TILE, up = ty > 0 ? TRAY[ty - 1][tx] : ".",
        dn = ty < 5 ? TRAY[ty + 1][tx] : ".", right = tx < 15 ? TRAY[ty][tx + 1] : ".";
    if (ch === "#") {
      g.rect(x, y, TILE, TILE, g.DARK);
      if (up !== "#") g.rect(x, y, TILE, 1, g.MID);
      if (right !== "#") g.rect(x + TILE - 1, y + 1, 1, TILE - 1, g.INK);
      if (dn !== "#") g.rect(x, y + TILE - 1, TILE, 1, g.INK);
      if (dn === ".") g.dither(x + 1, y + TILE, TILE - 1, 2, g.MID, 2);
      if (right === ".") g.dither(x + TILE, y + 1, 2, TILE - 1, g.MID, 2);
    } else if (ch === "O") {
      g.circle(x + 4, y + 4, 3, g.DARK, true);
      g.circle(x + 4, y + 4, 2, g.INK, true);
      g.rect(x + 3, y + 6, 3, 1, g.MID);
      g.rect(x + 6, y + 3, 1, 3, g.MID);
    } else if (ch === "G") {
      g.dither(x - 2, y - 2, TILE + 4, TILE + 4, g.MID, 2);
      g.circle(x + 4, y + 4, 4, g.DARK, false);
      g.sprite(FLAG, x + 3, y - 4);
    }
  }
  /* the ball: rolls the route, rests at the flag, starts again */
  var speed = 48, run = ROUTE_LEN / speed, t = game.time % (run + 1.4), d = Math.min(ROUTE_LEN, t * speed);
  for (var s = Math.max(0, d - 28); s < d - 5; s += 4) { var p = routeAt(s); g.pixel(p.x, p.y, g.MID); }
  var b = routeAt(d);
  g.dither(b.x - 2, b.y + 2, 7, 2, g.MID, 2);
  g.rect(b.x + 1, b.y + 3, 2, 1, g.DARK);
  g.sprite(BALL, b.x - 3, b.y - 3);
}

function keyRow(g, icon, name, what, y) {
  var s = KEYS[icon];
  g.sprite(s, 13 - (s.w >> 1), y + 7 - (s.h >> 1));
  g.text(name, 24, y, { color: g.DARK });
  g.text(what, 70, y);
}

/* ---- scenes ---- */
var sel = 0;
game.scene("title", {
  enter: function () { sensorOff(); },
  update: function () {
    var d = game.dir();
    if (d.x) { var n = LoGame.clamp(sel + d.x, 0, prog.unlocked); picked = true; if (n !== sel) { sel = n; game.sfx("move"); } else game.sfx("err"); }
    if (d.y > 0 || (game.pointer.pressed && game.pointer.y > 156 && game.pointer.x < 96)) { game.sfx("tap"); game.go("levels"); return; }
    if (game.pressed("select") && HAS_MOTION) { mode = mode === "tilt" ? "keys" : "tilt"; game.save("mode", mode); game.sfx("tick"); }
    if (game.pressed("a") || game.pressed("start") || (game.pointer.pressed && game.pointer.y > 156)) { game.sfx("ok"); game.go("play", sel); }
  },
  draw: function (g) {
    g.clear(g.PAPER);
    g.rect(0, 0, 160, 18, g.INK);
    var title = T({ zh: "滚珠迷宫", en: "BALL MAZE" }), tw = g.measure(title);
    g.text(title, 80, 2, { align: "center", color: g.PAPER });
    g.sprite(BALL, 80 - (tw >> 1) - 11, 6); g.sprite(BALL, 80 + (tw >> 1) + 5, 6);
    drawTray(g);
    g.text(T({ zh: "滚到旗子那里，别掉进洞", en: "Roll to the flag" }), 80, 82, { align: "center" });
    g.rect(8, 97, 144, 1, g.MID);
    var y = 100;
    keyRow(g, "pad", T({ zh: "方向键", en: "D-pad" }), T({ zh: "推球", en: "push" }), y); y += 14;
    keyRow(g, "a", "A", T({ zh: "这一关重来", en: "restart" }), y); y += 14;
    keyRow(g, "pill", "START", HAS_MOTION ? T({ zh: "暂停、校准", en: "pause, level" }) : T({ zh: "暂停", en: "pause" }), y); y += 14;
    if (HAS_MOTION) keyRow(g, "pill", "SELECT", mode === "tilt" ? T({ zh: "玩法：倾斜", en: "play: TILT" }) : T({ zh: "玩法：按键", en: "play: KEYS" }), y);
    else g.text(T({ zh: "这台掌机不能倾斜，用方向键", en: "No tilt here: use the D-pad" }), 80, y, { align: "center", color: g.DARK });
    /* the level picker and the start, in one dark band; DOWN (or a tap on the number) opens the list */
    g.rect(0, 158, 160, 18, g.INK);
    g.arrow(3, 165, "down", g.PAPER);
    g.text((sel > 0 ? "< " : "  ") + T({ zh: "第 {n} / {total} 关", en: "{n} / {total}" }, { n: sel + 1, total: N }) + (sel < prog.unlocked ? " >" : "  "), 10, 160, { color: g.PAPER });
    if (Math.floor(game.time * 2) % 2 === 0) g.text(T({ zh: "A 开始", en: "A start" }), 154, 160, { align: "right", color: g.PAPER });
  }
});

/* the level list: twelve rows under their three areas, a padlock on the ones not yet open, each with its gems */
var ROW_H = 14, listTop = 0;
function listRows() {
  var rows = [];
  for (var i = 0; i < N; i++) { if (i % 4 === 0) rows.push({ area: areaOf(i) }); rows.push({ level: i }); }
  return rows;
}
game.scene("levels", {
  enter: function () { sensorOff(); sel = Math.min(sel, prog.unlocked); },
  update: function () {
    var d = game.dir();
    if (d.y) { var n = LoGame.clamp(sel + d.y, 0, prog.unlocked); if (n !== sel) { sel = n; picked = true; game.sfx("move"); } else game.sfx("err"); }
    if (game.pressed("b")) { game.sfx("tap"); game.go("title"); return; }
    var p = game.pointer;
    if (p.pressed && p.y >= HUD && p.y < FOOT) {
      var r = listRows()[Math.floor((p.y - HUD + listTop) / ROW_H)];
      if (r && r.level != null && r.level <= prog.unlocked) {
        if (r.level === sel) { game.sfx("ok"); game.go("play", sel); return; }
        sel = r.level; picked = true; game.sfx("move");
      }
      return;
    }
    if (game.pressed("a") || game.pressed("start")) { game.sfx("ok"); game.go("play", sel); }
  },
  draw: function (g) {
    g.clear(g.PAPER);
    var rows = listRows(), at2 = 0;
    rows.forEach(function (r, i) { if (r.level === sel) at2 = i; });
    var top = LoGame.clamp(at2 * ROW_H - 60, 0, rows.length * ROW_H - VIEW_H);
    listTop = top;
    g.clip(0, HUD, 160, VIEW_H);
    rows.forEach(function (r, i) {
      var y = HUD + i * ROW_H - top;
      if (y < HUD - ROW_H || y > FOOT) return;
      if (r.area != null) {
        g.rect(0, y, 160, ROW_H, g.DARK);
        g.text(T(AREAS[r.area].name), 6, y + 1, { color: g.PAPER });
        return;
      }
      var n = r.level, open = n <= prog.unlocked, on = n === sel, fg = on ? g.PAPER : open ? g.INK : g.DARK;
      if (on) g.rect(0, y, 160, ROW_H, g.INK);
      g.text(String(n + 1), 18, y + 1, { color: fg, align: "right" });
      g.text(T(LEVELS[n].name), 24, y + 1, { color: fg });
      if (!open) { g.sprite(LOCK, 140, y + 3); return; }
      for (var k = 0; k < 3; k++) g.sprite(k < prog.gems[n] ? PIP_FULL : PIP_EMPTY, 126 + k * 7, y + 5, on ? null : { map: [g.INK, g.INK, g.MID, g.INK] });
    });
    g.clip();
    g.rect(0, 0, 160, HUD, g.INK);
    var total = prog.gems.reduce(function (a, b) { return a + b; }, 0);
    g.text(T({ zh: "选关", en: "Levels" }), 3, 1, { color: g.PAPER });
    g.text(T({ zh: "宝石 {n}/{all}", en: "Gems {n}/{all}" }, { n: total, all: N * 3 }), 157, 1, { color: g.PAPER, align: "right" });
    drawFoot(g, T({ zh: "上下选择  A 开始  B 返回", en: "UP/DN pick  A play  B back" }), true);
  }
});

game.scene("play", {
  enter: function (n) {
    n = typeof n === "number" ? n : 0;
    loadLevel(n, n % 4 === 0);                           /* the first level of an area opens on the area's card */
    sensorOn();
    if (mode === "tilt" && HAS_MOTION) say(T({ zh: "倾斜机身，或用方向键", en: "Tilt, or use the D-pad" }), 2.5);
  },
  exit: function () { sensorOff(); },
  update: function (dt) {
    stateT += dt;
    sparks.forEach(function (s) { s.t += dt; });
    if (state === "intro") {
      var any = game.pointer.pressed || ["a", "b", "start", "select", "up", "down", "left", "right"].some(function (b) { return game.pressed(b); });
      if (stateT > 1.5 || (any && stateT > 0.2)) { state = "roll"; stateT = 0; }
      return;
    }
    if (state !== "clear" && game.pressed("start")) { pause(); return; }
    if (state === "clear") {
      var shown = Math.min(gemCount(), Math.floor((stateT - SINK) / 0.3));
      if (shown > tallied) { tallied = shown; game.sfx("tick"); }
      if (stateT > 0.4 && game.ok()) {
        game.sfx("ok");
        if (level + 1 < N) { loadLevel(level + 1, (level + 1) % 4 === 0); sensorOn(); }
        else game.go("end");
      }
      return;
    }
    if (game.pressed("a")) { game.sfx("tap"); loadLevel(level, false); return; }
    if (game.pressed("select") && live) { PAD.motion.zero(); game.sfx("tick"); say(T({ zh: "现在的姿势就是水平", en: "Level = how you hold it" }), 1.5); }
    runT += dt;
    follow(dt);
    if (state === "fall") { if (stateT > 0.6) placeBall(); return; }
    if (state === "bite") { if (stateT > 0.5) placeBall(); return; }
    roll(Math.min(dt, 1 / 30));
    if (state === "roll") crawl(Math.min(dt, 1 / 30));
  },
  draw: function (g) {
    g.clear(g.PAPER);
    drawWorld(g);
    if (state === "intro") drawIntro(g);
    var last = level + 1 >= N;
    if (state === "clear") drawTally(g, last);
    drawHud(g);
    var foot;
    if (paused) foot = T({ zh: "上下选择  A 确定  B 返回", en: "UP/DN pick  A ok  B back" });
    else if (state === "intro") foot = T({ zh: "按任意键", en: "Any key" });
    else if (state === "fall") foot = T({ zh: "掉进洞里了", en: "Fell in" });
    else if (state === "bite") foot = T({ zh: "被甲虫咬了", en: "Bitten" });
    else if (state === "clear") foot = last ? T({ zh: "A 看总分", en: "A totals" }) : T({ zh: "A 下一关", en: "A next" });
    else if (live) foot = T({ zh: "SELECT 校准  START 暂停", en: "SELECT zero  START pause" });
    else foot = T({ zh: "A 重来  START 暂停", en: "A restart  START pause" });
    drawFoot(g, foot, paused || state === "fall" || state === "bite" || state === "clear");
  }
});

/* after the twelfth level: the gems of the whole run */
game.scene("end", {
  enter: function () { sensorOff(); },
  update: function () { if (game.ok() || game.pressed("b")) { game.sfx("ok"); game.go("title"); } },
  draw: function (g) {
    g.clear(g.INK);
    var total = prog.gems.reduce(function (a, b) { return a + b; }, 0);
    g.text(T({ zh: "全部通关！", en: "All cleared!" }), 80, 30, { align: "center", color: g.PAPER });
    g.sprite(SLOT_FULL, 77, 50, { map: [g.PAPER, g.MID, g.DARK, g.INK] });
    bigText(g, total + "/" + N * 3, 80, 64, g.PAPER);
    g.text(T({ zh: "宝石", en: "gems" }), 80, 96, { align: "center", color: g.PAPER });
    if (total >= N * 3) g.text(T({ zh: "一颗不落", en: "Every one" }), 80, 116, { align: "center", color: g.PAPER });
    g.rect(0, FOOT, 160, 176 - FOOT, g.PAPER);
    g.text(T({ zh: "A 返回标题", en: "A title" }), 80, FOOT + 2, { align: "center" });
  }
});

game.start("title");
</script>
