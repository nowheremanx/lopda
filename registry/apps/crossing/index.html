<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>拼字格</title>
<!-- Lo-PDA example app (lopda/1): 拼字格 / Crossing. MIT License, see LICENSE.
     A letter wheel and a small crossword. The words come from PAD.dict (SPEC.md 6.7), the built-in ECDICT:
     words() picks the seed word and the real words that fit its letters, lookup() gives the line in the
     player's language. The results card can add a word to the player's word book, which needs the
     "wordbook" permission (SPEC.md 6.7); on the card A adds one word, B takes it out, SELECT toggles, and a
     tap on the row's right end toggles. The player can turn ECDICT off in 词典管理 and this app still works.
     Everything is plain DOM, no canvas, no framework. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a3ad7e; color: #1f2a14; font-family: monospace; }
  body { display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; }
  header { flex: none; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; box-sizing: border-box; font-size: 16px; }
  #round { font-weight: bold; }
  /* a random round has no number: an inverted little badge stands where the round number would be */
  #round.badge { background: #1f2a14; color: #a3ad7e; padding: 2px; }
  .btns { display: flex; gap: 6px; }
  #help { font: inherit; font-size: 18px; font-weight: bold; width: 44px; height: 44px; padding: 0; background: #a3ad7e; color: #1f2a14;
    border: 2px solid #1f2a14; touch-action: manipulation; }
  #hint { font: inherit; font-size: 15px; min-width: 84px; height: 44px; padding: 0 8px; box-sizing: border-box; background: #1f2a14; color: #a3ad7e; border: 0; box-shadow: 2px 2px 0 #4a5a32; touch-action: manipulation; }
  #hint:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #4a5a32; }
  #hint.off { background: #a3ad7e; color: #4a5a32; border: 1px dashed #4a5a32; box-shadow: none; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px; box-sizing: border-box; }
  #stage { width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; }
  #wheel { position: relative; flex: none; width: 154px; height: 154px; touch-action: none; }
  /* the wheel is a dial: a disc under the letters, and a line through the letters picked so far */
  #disc { position: absolute; inset: 0; border-radius: 50%; background: #7d8a58; }
  #lines { position: absolute; left: 0; top: 0; pointer-events: none; }
  #finger { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; box-sizing: border-box;
    border-radius: 50%; background: #1f2a14; border: 3px solid #a3ad7e; pointer-events: none; transition: transform 0.3s ease-out; z-index: 2; }
  #finger[hidden] { display: none; }
  .key { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; box-sizing: border-box;
    border-radius: 50%; font: inherit; font-size: 20px; font-weight: bold; line-height: 1; padding: 0; border: 2px solid #1f2a14;
    background: #a3ad7e; color: #1f2a14; touch-action: none; }
  .key.on { background: #4a5a32; color: #a3ad7e; border-width: 3px; }
  .key.cur { background: #1f2a14; color: #a3ad7e; border-color: #1f2a14; }
  #typed { flex: none; width: 100%; height: 26px; line-height: 26px; text-align: center; font-size: 22px; font-weight: bold;
    letter-spacing: 3px; white-space: nowrap; }
  #board { display: grid; gap: 1px; }
  .cell { box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-weight: bold; line-height: 1;
    background: #a3ad7e; color: #1f2a14; border: 1px solid #7d8a58; touch-action: manipulation; }
  .cell.on { background: #7d8a58; border-color: #1f2a14; }
  .gap { visibility: hidden; }
  #note { flex: none; width: 100%; height: 36px; display: flex; align-items: center; justify-content: center;
    padding: 0 4px; box-sizing: border-box; overflow: hidden; }
  #note-text { display: -webkit-box; width: 100%; overflow: hidden; white-space: normal; overflow-wrap: anywhere;
    -webkit-box-orient: vertical; -webkit-line-clamp: 2; text-overflow: ellipsis; text-align: center;
    font-size: 14px; line-height: 18px; }
  footer { flex: none; height: 20px; line-height: 20px; font-size: 13px; text-align: center; white-space: nowrap; overflow: hidden; }
  #cover { position: fixed; inset: 0; z-index: 5; background: #a3ad7e; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 18px; box-sizing: border-box; text-align: center; overflow-y: auto; }
  #cover[hidden] { display: none; }
  #cover p { margin: 0; font-size: 16px; line-height: 1.55; max-width: 300px; white-space: pre-line; }
  #cover.help p { text-align: left; font-size: 14px; line-height: 1.45; }
  #cover button { font: inherit; font-size: 17px; font-weight: bold; min-height: 44px; padding: 8px 22px; background: #1f2a14;
    color: #a3ad7e; border: 0; box-shadow: 3px 3px 0 #4a5a32; touch-action: manipulation; }
  #cover button[hidden] { display: none; }
  #cover-list { list-style: none; margin: 0; padding: 0; width: 100%; max-width: 280px; text-align: left; font-size: 15px; }
  #cover-list[hidden] { display: none; }
  #cover-list li { box-sizing: border-box; height: 24px; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-bottom: 1px solid #7d8a58; letter-spacing: 2px; text-transform: uppercase; touch-action: manipulation; }
  #cover-foot { font-size: 13px; line-height: 1.4; color: #4a5a32; text-align: center; white-space: pre-line; }
  #cover-foot[hidden] { display: none; }
  /* The title and the round picker use the results card's own cover column, so every screen speaks the same
     language: paper, ink, one inverted cursor. The title rows are taller than the results rows because a
     finger picks them. */
  /* The title is a centred column: the little crossword, then (in Chinese) the name, the menu and the keys.
     The art uses the board's own .cell look, so it reads as a puzzle the player has already met. */
  #cover.title { gap: 8px; padding: 10px 12px; justify-content: center; }
  #title-art { display: none; }
  #cover.title #title-art { display: grid; grid-template-columns: repeat(8, 20px); grid-auto-rows: 20px; gap: 1px; }
  #cover.title #title-art .cell { font-size: 13px; }
  #cover.title #title-art .cell.pending { color: #4a5a32; }
  #cover.title #cover-text { font-size: 22px; font-weight: bold; letter-spacing: 4px; line-height: 1.2; margin: 0; }
  #cover.title #cover-list { display: flex; flex-direction: column; gap: 8px; max-width: 240px; font-size: 15px; }
  #cover.title #cover-list li { box-sizing: border-box; height: 44px; line-height: 1; padding: 0 8px 0 14px; border-bottom: 0;
    letter-spacing: 0; text-transform: none; display: flex; align-items: center; text-align: left; }
  #cover.title #cover-list li .ico { flex: none; width: 16px; height: 16px; display: flex; }
  #cover.title #cover-list li .rname { margin-left: 12px; text-align: left; }
  #cover.title #cover-list li .label { margin-left: 12px; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; }
  #cover.title #cover-list li .prog { margin-left: auto; font-size: 13px; color: #4a5a32; }
  #cover.title #cover-list li.sel { background: #1f2a14; color: #a3ad7e; }
  #cover.title #cover-list li.sel .prog { color: #a3ad7e; }
  #cover.title #cover-list li.locked { padding-left: 12px; color: #4a5a32; border: 2px dashed #4a5a32; }
  /* the locked row's name sits in .label, which already has the icon's 12px gap: its own margin would double it */
  #cover.title #cover-list li.locked .label .rname { margin-left: 0; }
  #cover.title #cover-list li.locked .lock { font-size: 12px; }
  #cover.title #cover-list li.locked.sel { color: #a3ad7e; border-color: #a3ad7e; }
  #cover.pick { gap: 6px; padding: 8px; }
  #cover.pick #cover-text { font-size: 13px; line-height: 1.2; }
  #cover.pick #cover-list { display: grid; grid-template-columns: repeat(5, 44px); gap: 8px; width: auto; max-width: none; }
  #cover.pick #cover-list li { width: 44px; height: 44px; line-height: 40px; padding: 0; text-align: center; font-size: 17px;
    font-weight: bold; letter-spacing: 0; text-transform: none; border: 2px solid transparent; }
  #cover.pick #cover-list li.cleared { background: #7d8a58; color: #1f2a14; }
  #cover.pick #cover-list li.next { background: #a3ad7e; color: #1f2a14; border: 2px dashed #1f2a14; }
  #cover.pick #cover-list li.locked { background: #a3ad7e; color: #4a5a32; }
  #cover.pick #cover-list li.sel { background: #1f2a14; color: #a3ad7e; border-color: #1f2a14; }
  #cover.pick #cover-list li.sel.next { border-color: #a3ad7e; }
  /* a refused locked round says why in the footer for a moment; ink keeps it above the page hint's tone */
  #cover-foot.ink { color: #1f2a14; }
  /* the way out of a round: a small panel on top of the round, not a whole screen */
  #cover.confirm { inset: auto; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 268px; max-width: calc(100% - 24px);
    padding: 16px; gap: 10px; border: 2px solid #1f2a14; box-shadow: 6px 6px 0 #4a5a32; overflow: visible; }
  /* two choices side by side, each a full finger target; the buttons carry the keys, so there is no footer */
  #cover-actions { display: flex; gap: 8px; justify-content: center; }
  #cover-actions[hidden] { display: none; }
  #cover.confirm #cover-actions button { box-sizing: border-box; min-width: 96px; min-height: 44px; padding: 0 12px; }
  #cover.confirm #cover-btn2 { background: #a3ad7e; color: #1f2a14; border: 2px solid #1f2a14; box-shadow: none; }
  /* The results card is its own calm column: the list, the chosen word's whole line below it, then NEXT ROUND.
     The detail box keeps its three lines whichever item is chosen, so nothing jumps as the cursor moves. */
  #cover.done { gap: 8px; padding: 8px 12px; }
  #cover.done #cover-text { font-size: 16px; line-height: 1.3; }
  #cover.done #cover-list li { padding: 0 24px 0 6px; position: relative; }
  #cover.done #cover-list li.sel { background: #1f2a14; color: #a3ad7e; border-bottom-color: #1f2a14; }
  /* the word book mark at the right end of a row: a 10x14 ribbon with a V notch, drawn in CSS.
     In the book it is solid ink; not in the book (or unknown) it is a hollow dashed outline in the
     dark tone. On the selected, inverted row both become paper so they stay visible. */
  .mark { position: absolute; right: 6px; top: 4.5px; width: 10px; height: 14px; box-sizing: border-box;
    border: 1px dashed #4a5a32; border-bottom: 0; pointer-events: none; }
  /* the pseudo-elements sit in the 8x13 padding box (1px side and top borders), so the notch runs
     border-box (0,14) -> (5,10.64) -> (10,14), the same V as the filled ribbon's clip-path */
  .mark::before, .mark::after { content: ""; position: absolute; width: 6px; height: 1px; border-top: 1px dashed #4a5a32; }
  .mark::before { left: 4px; top: 9.6px; transform-origin: 0 0; transform: rotate(34deg); }
  .mark::after { left: -1px; top: 13px; transform-origin: 0 0; transform: rotate(-34deg); }
  .mark.book { border: 0; background: #1f2a14;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%); }
  .mark.book::before, .mark.book::after { display: none; }
  #cover.done #cover-list li.sel .mark { border-color: #a3ad7e; }
  #cover.done #cover-list li.sel .mark::before, #cover.done #cover-list li.sel .mark::after { border-top-color: #a3ad7e; }
  #cover.done #cover-list li.sel .mark.book { background: #a3ad7e; }
  #cover-detail { display: none; width: 100%; max-width: 280px; box-sizing: border-box; height: 66px; padding: 6px;
    overflow: hidden; text-align: left; font-size: 14px; line-height: 18px; overflow-wrap: anywhere; text-overflow: ellipsis;
    color: #1f2a14; box-shadow: inset 0 1px 0 #4a5a32; }
  #cover-detail.dark { color: #4a5a32; }
  #cover.done #cover-detail { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
  #cover.done #cover-btn.outline { background: #a3ad7e; color: #1f2a14; border: 2px solid #1f2a14; box-shadow: none; padding: 8px 20px; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .shake { animation: shake 0.22s linear; }
  /* A letter landing in its cell: it grows past its size and settles, in ink for a moment. The colours change in
     steps (step-end), never as a fade, so every pixel stays one of the four tones; only the size eases. */
  @keyframes pop { 0% { transform: scale(0.3); } 55% { transform: scale(1.3); } 100% { transform: scale(1); } }
  @keyframes ink { 0% { background: #1f2a14; color: #a3ad7e; border-color: #1f2a14; } }
  .cell.pop { animation: pop 0.3s ease-out, ink 0.3s step-end; position: relative; z-index: 1; }
  #hint.pop { animation: pop 0.35s ease-out; }
  /* the round is clear: the whole grid blinks twice */
  @keyframes flash { 0%, 50% { background: #1f2a14; color: #a3ad7e; border-color: #1f2a14; }
    25%, 75% { background: #7d8a58; color: #1f2a14; border-color: #1f2a14; } }
  #board.flash .cell { animation: flash 1s step-end; }
</style>
</head>
<body>
<header>
  <span id="round">第 1 关</span>
  <span class="btns"><button id="help" type="button" aria-label="玩法">?</button><button id="hint" type="button">提示 0</button></span>
</header>
<main>
  <div id="typed"><span id="entry"></span></div>
  <div id="stage">
    <div id="wheel" aria-label="字母盘"><div id="disc"></div><svg id="lines" width="154" height="154"></svg><div id="finger" hidden></div></div>
    <div id="board" aria-label="格子"></div>
  </div>
  <div id="note"><span id="note-text"></span></div>
</main>
<footer id="goal"></footer>
<div id="cover">
  <div id="title-art" aria-hidden="true"></div>
  <p id="cover-text"></p>
  <ul id="cover-list" hidden></ul>
  <div id="cover-detail"></div>
  <div id="cover-actions"><button id="cover-btn" type="button"></button><button id="cover-btn2" type="button" hidden></button></div>
  <div id="cover-foot" hidden></div>
</div>
<script>
(function () {
  "use strict";

  /* two languages: PAD.lang is "zh" or "en"; a runtime before 0.4.0 has none, so Chinese is the default */
  var LANG = typeof PAD !== "undefined" && PAD.lang === "en" ? "en" : "zh";
  var TXT = {
    zh: {
      round: "第 {n} 关", hint: "提示 {n}", loading: "翻字典…",
      error: "这台掌机的词典打不开", retry: "再试一次",
      appName: "拼字格", cont: "继续 · 第 {n} 关", rounds: "选关", random: "随机关", randomLock: "通关 100 关后开放",
      howto: "玩法", pickHead: "第 {a}-{b} 关", pickFoot: "◄ ► 翻页", titleKeys: "↑↓ 选 · A 打开",
      lockedRound: "先过第 {n} 关",
      replay: " · 重玩", badge: "随机", doneRandom: "随机关完成",
      practice: "练习", practiceTitle: "会玩了！", practiceBack: "回主界面",
      practiceKeys: "方向键选字母，A 加上，B 删掉一个，START 提交，SELECT 打乱。\n结算卡上 A 收进生词本，B 移出。\n关卡里没输入字母时按 B 回主界面。",
      leave: "回到主界面？", leaveYes: "回去", leaveNo: "留下",
      goal: "划过字母拼单词，填满右边的格子",
      demo: "看：按住字母，划过 {w}",
      demoEnd: "拼对了，词就填进格子，下面显示中文，还会读出来。\n\n轮到你了：找出格子里剩下的词。",
      start: "开始",
      help: "玩法\n\n按住字母盘上的一个字母，不松手划过别的字母，拼出一个英文单词，松手提交。\n拼对格子里的词，它就填进格子，下面显示中文并读出来；填上的词点一下可以再看一遍。填满格子就过关。\n不在格子里的真词是奖励词，每个换 1 个提示。点「提示」看一个空词的中文。\n按键：方向键选字母，A 加上，B 删掉一个，START 提交，SELECT 打乱字母。\n结算卡：A 收进生词本，B 移出。",
      ok: "知道了",
      done: "第 {n} 关完成", doneBtn: "下一关", bonus: "奖励词 {w}：提示 +1", bonusPractice: "奖励词 {w}：练习不加提示",
      sum: "奖励词 {b} 个 · 提示 {n}",
      bookAdded: "已加入生词本", bookRemoved: "已移出生词本", bookDenied: "没有允许使用生词本", bookFull: "生词本满了",
      bookTip: "A 收进生词本 · B 移出",
      noHints: "先找奖励词换提示", hintHead: "提示：", noEntry: "词典里没有这个词",
      noWord: "不是这里的词", again: "这个词已经填上了", againBonus: "这个奖励词已经算过了"
    },
    en: {
      round: "ROUND {n}", hint: "HINT {n}", loading: "Looking up…",
      error: "This handheld's dictionary won't open.", retry: "TRY AGAIN",
      appName: "CROSSING", cont: "CONTINUE · ROUND {n}", rounds: "ROUNDS", random: "RANDOM", randomLock: "Opens after round 100",
      howto: "HOW TO PLAY", pickHead: "ROUNDS {a}-{b}", pickFoot: "◄ ► page", titleKeys: "↑↓ pick · A open",
      lockedRound: "Clear round {n} first",
      replay: " · REPLAY", badge: "RANDOM", doneRandom: "RANDOM CLEAR",
      practice: "PRACTICE", practiceTitle: "You've got it!", practiceBack: "BACK TO TITLE",
      practiceKeys: "Arrows pick a letter, A adds, B deletes, START sends, SELECT shuffles.\nOn the results card A adds to the word book, B removes.\nB with nothing typed goes back to the title.",
      leave: "Back to the title?", leaveYes: "LEAVE", leaveNo: "STAY",
      goal: "Swipe letters into words to fill the grid",
      demo: "Watch: hold and slide {w}",
      demoEnd: "A right word fills in, its meaning shows below, and you hear it.\n\nYour turn: find the other words in the grid.",
      start: "START",
      help: "HOW TO PLAY\n\nHold a letter, slide across others to spell; let go to send it.\nA right word fills in, its meaning below. Tap it to hear it again. Fill the grid to clear.\nAny other real word is a bonus: 1 hint; HINT shows an open word.\nKeys: arrows pick, A add, B delete, START send, SELECT shuffle.\nResults: A adds, B removes.",
      ok: "OK",
      done: "ROUND {n} CLEAR", doneBtn: "NEXT ROUND", bonus: "Bonus word {w}: hint +1", bonusPractice: "Bonus word {w}: no hint in practice",
      sum: "Bonus words {b} · hints {n}",
      bookAdded: "Added to word book", bookRemoved: "Removed from word book", bookDenied: "Word book not allowed", bookFull: "The word book is full",
      bookTip: "A: add to word book · B: remove",
      noHints: "Earn a hint with a bonus word", hintHead: "HINT: ", noEntry: "No entry in the dictionary",
      noWord: "Not a word here", again: "Already in the grid", againBonus: "Bonus word already counted"
    }
  }[LANG];
  function tx(key, n) { return TXT[key].replace("{n}", n); }
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";

  var INK = "#1f2a14", MID = "#7d8a58";
  var GRID = 7;                 /* the puzzle's grid is at most 7x7, so the letters stay readable on 331x359 */
  /* the wheel's geometry: layoutSizes() sets all three from the room the screen gives it. These first values are
     only what a key gets before the first layout (the board and the screen are not measured yet). */
  var WHEEL_R = 52, WHEEL_H = 154, KEY = 38;
  /* The practice round is built without PAD.dict.words: a fixed seed's letters and a fixed short list. The seed
     1986 places exactly four words (star, rats, arts, tar), so the demo has a three-letter word to spell and the
     rest is a short hunt. The same rnd seed gives everyone the same grid and the same wheel order. */
  var PRACTICE = ["star", "rats", "arts", "tar", "rat", "art", "sat"];
  var PRACTICE_SEED = 1986;

  /* The title menu's pixel icons: 8x8 strings, "#" a filled pixel, drawn at 2 px each as inline SVG rects. */
  var ICONS = {
    continue: [".#......", ".##.....", ".###....", ".####...", ".####...", ".###....", ".##.....", ".#......"],
    rounds: ["###.###.", "#.#.#.#.", "###.###.", "........", "###.###.", "#.#.#.#.", "###.###.", "........"],
    random: ["#######.", "#.....#.", "#.#...#.", "#..#..#.", "#...#.#.", "#.....#.", "#######.", "........"],
    howto: ["..###...", ".#...#..", ".....#..", "....#...", "...#....", "...#....", "........", "...#...."]
  };
  function iconSvg(name) {
    var px = ICONS[name], out = '<svg viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges" aria-hidden="true" focusable="false">', y, x;
    for (y = 0; y < 8; y++) for (x = 0; x < 8; x++) {
      if (px && px[y].charAt(x) === "#") out += '<rect x="' + (x * 2) + '" y="' + (y * 2) + '" width="2" height="2" fill="currentColor"/>';
    }
    return out + "</svg>";
  }

  /* mulberry32: a tiny seeded random. The round number seeds it, so round 37 is the same puzzle on every phone. */
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function isWord(w) { return typeof w === "string" && /^[a-z]{3,7}$/.test(w); }

  var roundEl = document.getElementById("round"), hintEl = document.getElementById("hint"), helpEl = document.getElementById("help");
  var wheelEl = document.getElementById("wheel"), boardEl = document.getElementById("board");
  var typedEl = document.getElementById("typed"), noteEl = document.getElementById("note");
  var noteTextEl = document.getElementById("note-text"), goalEl = document.getElementById("goal");
  var linesEl = document.getElementById("lines"), fingerEl = document.getElementById("finger");
  var coverEl = document.getElementById("cover"), coverText = document.getElementById("cover-text"), coverBtn = document.getElementById("cover-btn");
  var coverBtn2 = document.getElementById("cover-btn2"), coverActions = document.getElementById("cover-actions");
  var titleArt = document.getElementById("title-art");
  var entryEl = document.getElementById("entry"), coverList = document.getElementById("cover-list"), detailEl = document.getElementById("cover-detail");

  /* The note has one order: the newest action wins. A sync write or the start of an async lookup bumps noteSeq;

  function noteStart(kind, word) {

  /* The line under the grid follows the player's language. PAD.lang is fixed when the app starts, so this is the

  function meaning(entry) {
    if (!entry) return "";
    var zh = entry.zh && entry.zh.length ? entry.zh[0] : "";
    var en = entry.en && entry.en.length ? entry.en[0] : "";
    return LANG === "en" ? (en || zh) : (zh || en);

  /* A hint must not give its own answer away: "river" cannot appear as "a river of..." in the line. The word's
     simple forms (a final s, es, ed or ing taken off) count too. Take the first English line that has none of
     them; if every line has one, mask them in the first line, so the player still gets a usable definition. */
  function formsOf(word) {
    var w = String(word || "").toLowerCase(), out = [], tails = ["ing", "ed", "es", "s"], i, stem;
    if (!w) return out;

  /* ---------- the dictionary calls: PAD.dict.words and PAD.dict.lookup ---------- */

  function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }

  /* A round build spends up to nine PAD.dict calls, lookups and the word book spend more, and the limit is ten a
     second for the whole app. Every call records when it settled, so startRound can wait that window out before
     its own first call. The calls themselves and their seeds are untouched. */
  function dictSettled(p) {
    dictAt = Date.now();         /* stamped when made and again when answered, so a slow answer still gets its full second */
    if (!p || !p.then) return p;
    return p.then(function (v) { dictAt = Date.now(); return v; },

  }
  function dictWords(q) { return dictSettled(PAD.dict.words(q)); }
  function dictLookup(w) { return dictSettled(PAD.dict.lookup(w)); }

  /* PAD.dict.words({len, level, max}) -> {words, more} | null. level 1 is the most common 2000 words, so the
     seed is a word everyone knows. The grid takes only level 2 (the most common 5000), so every word to find is
     one a learner may know; any real word from the whole list (level 5) counts as a bonus word.
     A seed whose letters do not cross into a grid of 4 or more words is not a dictionary failure: walk on to
     the next seed. Each seed costs two calls, so four seeds and the seed query make nine calls in a second (the
     limit is ten); before a fifth seed, wait out the window. Only a null or a rejected call is a dictionary error. */
  function pickSeed(L) {
    return dictWords({ len: L, level: 1, max: 500 }).then(function (page) {
      if (!page || !page.words || !page.words.length) return null;
      var seeds = page.words, start = Math.floor(rnd() * seeds.length), at = 0, burst = 0;
      function attempt() {
        if (burst >= 4) { burst = 0; return wait(1100).then(tryOne); }
        return tryOne();
        function tryOne() {
          burst++;
          var seed = seeds[(start + at) % seeds.length];
          at++;
          return Promise.all([
            dictWords({ letters: seed, len: [3, L], level: 2, max: 500 }),   /* the grid's words */
            dictWords({ letters: seed, len: [3, L], level: 5, max: 500 })    /* every real word: bonus words */
          ]).then(function (rs) {
            if (!rs[0] || !rs[0].words || !rs[1] || !rs[1].words) return null;   /* unreadable: the error screen, not another seed */
            var common = rs[0].words.slice(), words = rs[1].words.slice();

            if (words.indexOf(seed) < 0) words.unshift(seed);

            return { seed: seed, words: words, built: built };

  }

  /* ---------- the puzzle: place words greedily, longest first, each crossing a placed word ---------- */

  function fitsAt(map, word, r, c, dir) {
    var dr = dir === "v" ? 1 : 0, dc = dir === "h" ? 1 : 0;
    var i, rr, cc, ch, cross = 0;
    /* the cell just before and just after the word must stay empty: no two words end to end */
    var br = r - dr, bc = c - dc;
    if (br >= 0 && br < GRID && bc >= 0 && bc < GRID && map[keyOf(br, bc)]) return -1;
    var ar = r + dr * word.length, ac = c + dc * word.length;
    if (ar >= 0 && ar < GRID && ac >= 0 && ac < GRID && map[keyOf(ar, ac)]) return -1;
    for (i = 0; i < word.length; i++) {
      rr = r + dr * i; cc = c + dc * i;
      if (rr < 0 || rr >= GRID || cc < 0 || cc >= GRID) return -1;
      ch = map[keyOf(rr, cc)];

        if (r1 >= 0 && r1 < GRID && c1 >= 0 && c1 < GRID && map[keyOf(r1, c1)]) return -1;
        if (r2 >= 0 && r2 < GRID && c2 >= 0 && c2 < GRID && map[keyOf(r2, c2)]) return -1;

  /* ---------- starting a round ---------- */

  function lenFor(round) { return round <= 10 ? 5 : round <= 40 ? 6 : 7; }

    phase = "error";

  /* The plain card: the loading line, the tutorial's last page, the rules, an error. The results card has its

    coverEl.hidden = false;

      detailEl.classList.add("dark");

  /* ---------- the word book, on the results card ---------- */

  /* One PAD.dict.inBook call when the card opens, and one more after the first word is saved (the grant now
     exists, so the other rows can say what they are). No grant yet, no permission or over the limit: null,
     and every row stays hollow, which means "not in the book". */
  function readBookMarks(refresh) {
    if (!results || !results.length) return;
    if (!PAD.dict || !PAD.dict.inBook) { if (!refresh) { bookMarks = results.map(function () { return false; }); renderMarks(); } return; }
    var token = gen, seq = bookSeq, words = results.map(function (row) { return row.word; });

  function flashDetail(text) {

      } else if (v === "denied") { PAD.sfx("err"); if (pick === i + 1) flashDetail(TXT.bookDenied); }
      else if (v === "full") { PAD.sfx("err"); if (pick === i + 1) flashDetail(TXT.bookFull); }

    }, function () {
      if (seq !== bookSeq) return;     /* the card is gone: touch nothing, not even bookBusy */

  /* ---------- the title, the round picker, the way out ---------- */

  /* The title is a short menu, not a round: the results card's own column, its rows inverted like its cursor.
     Once round 100 is cleared there is no round 101 to continue, so RANDOM takes the first place. */
  function showTitle() {
    clearPickMsg();
    phase = "title";
    coverEl.classList.remove("done", "help", "pick", "confirm");
    coverEl.classList.add("title");

    coverText.textContent = LANG === "zh" ? TXT.appName : "";
    coverText.hidden = LANG !== "zh";

    titleRows = [];

    titleRows.push({ kind: "pick" });
    if (!firstRandom) titleRows.push({ kind: "random", locked: state.cleared < 100 });
    titleRows.push({ kind: "help" });

      var li = document.createElement("li"), name = "", prog = "", icon = row.kind;

      else if (row.kind === "random") name = TXT.random;

      if (icon === "pick") icon = "rounds";
      if (icon === "help") icon = "howto";
      /* Once round 100 is behind, the random count is the only number still moving, so it takes the place the
         rounds' progress had. A count of none stays hidden, as a bare "×0" would only look like a bug. */
      if (row.kind === "pick" && !firstRandom && state.cleared > 0) prog = state.cleared + "/100";
      if (row.kind === "random" && firstRandom && state.random > 0) prog = "×" + state.random;
      if (row.locked) {
        /* locked looks locked even before the cursor lands on it: dark words, a dashed box, and the reason in it */
        li.className = "locked";
        li.innerHTML = '<span class="ico">' + iconSvg("random") + '</span><span class="label"><span class="rname">' +
          TXT.random + '</span><span class="lock">' + TXT.randomLock + "</span></span>";
      } else {
        li.innerHTML = '<span class="ico">' + iconSvg(icon) + '</span><span class="rname">' + name + "</span>" +
          (prog ? '<span class="prog">' + prog + "</span>" : "");
      }
      coverList.appendChild(li);
    });
    coverList.hidden = false;
    coverBtn.hidden = true;
    coverBtn2.hidden = true;
    coverActions.hidden = true;
    footEl.textContent = TXT.titleKeys;
    footEl.hidden = false;
    coverEl.hidden = false;
    renderTitle();
  }
  /* W over the I of CROSSING and N under it: a tiny board that already says the game's name. */
  function buildTitleArt() {
    titleArt.innerHTML = "";
    function artCell(ch, on, r, c) {
      var el = document.createElement("div");
      el.className = "cell" + (on ? " on" : " pending");
      el.textContent = ch;
      el.style.gridRow = String(r);
      el.style.gridColumn = String(c);
      titleArt.appendChild(el);
    }
    artCell("W", false, 1, 6);
    "CROSSING".split("").forEach(function (ch, i) { artCell(ch, true, 2, i + 1); });
    artCell("N", false, 3, 6);
  }
  function renderTitle() {
    var rows = coverList.querySelectorAll("li"), i;
    for (i = 0; i < rows.length; i++) rows[i].classList.toggle("sel", i === titlePick);
  }
  /* one menu row: the first row START would open, and what A or a tap does */
  function openTitleRow(i) {
    var row = titleRows[i];
    if (!row) return;
    titlePick = i;
    renderTitle();
    if (row.kind === "continue") { PAD.sfx("ok"); openRound(mainRound); }
    else if (row.kind === "pick") { PAD.sfx("tap"); showPick(); }
    else if (row.kind === "random") {
      if (row.locked) { PAD.sfx("err"); return; }
      PAD.sfx("ok"); startRandom();
    } else { PAD.sfx("ok"); startPractice(); }
  }
  /* HOW TO PLAY teaches by doing: the fixed short round below, then a card of the keys. It is a visit, not a
     round of the main line, so it leaves the save alone and can run as often as the player likes. */
  function startPractice() {
    startRound(1, state.hints, [], { practice: true });
  }

  /* A click on a locked round plays err and says why in the footer for 1.5 s; a newer press or page turn brings
     the paging hint back at once, and leaving the picker drops the timer with the screen. */
  function clearPickMsg() {
    if (pickMsgTimer) { clearTimeout(pickMsgTimer); pickMsgTimer = null; }
    if (phase === "pick") { footEl.classList.remove("ink"); footEl.textContent = TXT.pickFoot; }
  }
  function showLockedMsg() {
    if (pickMsgTimer) clearTimeout(pickMsgTimer);
    footEl.textContent = TXT.lockedRound.replace("{n}", state.cleared + 1);
    footEl.classList.add("ink");
    pickMsgTimer = setTimeout(function () {
      pickMsgTimer = null;
      if (phase !== "pick") return;
      footEl.classList.remove("ink");
      footEl.textContent = TXT.pickFoot;
    }, 1500);
  }

  /* The picker: four pages of twenty-five, the cleared rounds solid on mid, the next one dashed on paper, the
     later ones dark and closed. The borders and fills are the only difference between the three, so a glance
     down the page says how far the player has come. */
  function showPick() {
    phase = "pick";
    coverEl.classList.remove("title", "done", "help", "confirm");
    coverEl.classList.add("pick");
    coverText.hidden = false;
    /* the cursor starts on the round to continue; after round 100 that is the last one, which is already cleared */
    var focus = Math.max(1, Math.min(100, state.cleared + 1));
    pickPage = Math.floor((focus - 1) / 25);
    pickAt = (focus - 1) % 25;
    fillPicker();
    coverBtn.hidden = true;
    coverBtn2.hidden = true;
    coverActions.hidden = true;
    footEl.classList.remove("ink");
    footEl.textContent = TXT.pickFoot;
    footEl.hidden = false;
    coverEl.hidden = false;
  }
  function fillPicker() {
    var first = pickPage * 25, i, n, li;
    coverList.innerHTML = "";
    for (i = 0; i < 25; i++) {
      n = first + i + 1;
      li = document.createElement("li");
      li.setAttribute("data-n", String(n));
      li.textContent = String(n);
      li.className = n <= state.cleared ? "cleared" : n === state.cleared + 1 ? "next" : "locked";
      coverList.appendChild(li);
    }
    coverText.textContent = TXT.pickHead.replace("{a}", first + 1).replace("{b}", first + 25);
    coverList.hidden = false;
    renderPicker();
  }
  function renderPicker() {
    var rows = coverList.querySelectorAll("li"), i;
    for (i = 0; i < rows.length; i++) rows[i].classList.toggle("sel", i === pickAt);
  }
  /* Arrows move in the 5x5; Left on the first column and Right on the last turn the page and keep the row, so
     the four pages are one long shelf the player walks along. */
  function movePickCursor(b) {
    clearPickMsg();
    var row = Math.floor(pickAt / 5), col = pickAt % 5;
    if (b === "up") row = Math.max(0, row - 1);
    else if (b === "down") row = Math.min(4, row + 1);
    else if (b === "left") {
      if (col === 0) { pickPage = (pickPage + 3) % 4; pickAt = row * 5 + 4; fillPicker(); PAD.sfx("tick"); return; }
      col--;
    } else if (b === "right") {
      if (col === 4) { pickPage = (pickPage + 1) % 4; pickAt = row * 5; fillPicker(); PAD.sfx("tick"); return; }
      col++;
    }
    pickAt = row * 5 + col;
    renderPicker();
    PAD.sfx("tick");
  }
  function openPicked() {
    var n = pickPage * 25 + pickAt + 1;
    if (n > state.cleared + 1) { PAD.sfx("err"); showLockedMsg(); return; }   /* a locked round says why */
    clearPickMsg();
    PAD.sfx("ok");
    openRound(n);
  }

  /* One way in for the title, the picker and NEXT ROUND: a cleared round is a replay, the next one is the main
     line, and anything later is locked (the picker guards it; this is the second lock). */
  function openRound(n) {
    if (n > 100) { startRandom(); return; }
    if (n <= state.cleared) startRound(n, state.hints, [], { replay: true });
    else if (n === state.cleared + 1) startRound(n, state.hints, n === mainRound ? mainDone.slice() : []);
    else showPick();
  }
  function startRandom() {
    /* a number outside 1-100, so a random round can never be mistaken for a fixed one */
    startRound(101, state.hints, [], { random: true, seed: Date.now() });
  }

  /* B in an empty entry asks once: the words found are saved after every one, but a thumb can find B by accident */
  function showLeave() {
    phase = "leave";
    coverEl.classList.remove("title", "pick", "done", "help");
    coverEl.classList.add("confirm");
    coverText.hidden = false;
    coverText.textContent = TXT.leave;
    coverList.innerHTML = "";
    coverList.hidden = true;
    /* the two buttons carry their keys, so the panel needs no footer to explain them */
    coverBtn.textContent = "A " + TXT.leaveYes;
    coverBtn.hidden = false;
    coverBtn.classList.remove("outline");
    coverBtn2.textContent = "B " + TXT.leaveNo;
    coverBtn2.hidden = false;
    coverActions.hidden = false;
    footEl.hidden = true;
    footEl.classList.remove("ink");
    coverEl.hidden = false;
  }
  function leaveToTitle() {
    coverEl.classList.remove("confirm");
    hideCover();
    save();
    /* a practice round ends here too: nothing on the title may still read its mode */
    if (state.mode === "practice") { state.mode = "fixed"; updateHeader(); }
    titleGuardAt = Date.now() + 300;
    showTitle();
  }
  function cancelLeave() {
    coverEl.classList.remove("confirm");
    hideCover();
    phase = "play";
    renderKeys();
  }

  function startRound(round, hints, done, opts) {
    opts = opts || {};
    var random = opts.random === true;
    var practice = opts.practice === true;
    replay = opts.replay === true;
    state.mode = practice ? "practice" : random ? "random" : "fixed";
    /* only a round of the main line moves the saved round; a replay, a random round and practice are extra visits */
    if (!random && !replay && !practice) mainRound = round;
    var seed = practice ? PRACTICE_SEED : random ? (opts.seed || Date.now()) : round;
    pending = {
      round: round, hints: hints, done: done.slice(),
      opts: { random: random, replay: replay, practice: practice, seed: seed }
    };
    state.round = random ? 101 : practice ? 1 : round; state.hints = hints; state.done = done.slice(); state.entry = []; state.cursor = 0;
    if (!random && !replay && !practice) mainDone = state.done;   /* so a save before the grid builds still carries the new round */
    state.hinted = []; state.hintTurn = 0; state.mean = {}; hintBusy = false; results = null; tapPending = {};
    fxTimers.forEach(clearTimeout); fxTimers = []; boardEl.classList.remove("flash");
    state.seed = ""; state.wheel = []; state.placed = []; state.words = []; state.wordSet = {}; state.view = null; state.cells = {};
    updateHeader();
    setNote("");
    phase = "load";
    showCover(TXT.loading, "");
    var token = ++gen;
    var L = random ? 7 : lenFor(round);
    rnd = mulberry32(seed);
    /* practice needs no word list: its letters and words are fixed, so it still runs without a dictionary */
    if (!practice && (!PAD.dict || !PAD.dict.words)) { fail(); return; }
    /* Every PAD.dict call shares the 10-a-second limit, and a build is most of a second's budget: wait out the
       window since the last call settled, or a quick re-entry opens the round on the error card. The wait sits
       before pickSeed, so the seeded random and the grid a round produces do not change. Practice asks no
       dictionary for its build, so it needs none of that wait. */
    var left = !practice && dictAt ? 1100 - (Date.now() - dictAt) : 0;
    (left > 0 ? wait(left) : Promise.resolve()).then(function () {
      if (token !== gen) return null;
      if (practice) return { seed: "star", words: PRACTICE.slice(), built: buildGrid("star", PRACTICE) };
      return pickSeed(L);
    }).then(function (out) {
      if (token !== gen) return;
      if (!out) { fail(); return; }
      state.seed = out.seed;
      state.words = out.words;
      state.placed = out.built.placed;
      state.view = boundsOf(state.placed);
      state.cells = out.built.map;
      state.wordSet = {};
      out.words.forEach(function (w) { state.wordSet[w] = true; });
      state.wheel = out.seed.split("");
      shuffleWheel(false);
      state.entry = []; state.cursor = 0;
      state.done = done.filter(function (w) { return state.wordSet[w] || state.placed.some(function (p) { return p.word === w; }); });
      if (!random && !replay && !practice) mainDone = state.done;   /* the array save() writes; a replay's words stay in memory */
      renderBoard(); renderKeys(); updateHeader();
      /* the practice round always shows the finger demo, even for a player who has already been taught */
      if (practice || !taught) runDemo();
      else { phase = "play"; hideCover(); renderKeys(); checkComplete(true); }   /* a saved round whose words are all filled opens on its results */
    }, function () {
      if (token === gen) fail();
    });
  }

  /* ---------- drawing ---------- */

  function shuffleWheel(clear) {
    var a = state.wheel.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) { j = Math.floor(rnd() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
    state.wheel = a;
    if (clear) { state.entry = []; state.cursor = 0; }
    buildWheel();
    renderKeys();
  }

  function buildWheel() {
    var old = wheelEl.querySelectorAll(".key"), i, n = state.wheel.length, b;
    for (i = 0; i < old.length; i++) wheelEl.removeChild(old[i]);
    for (i = 0; i < n; i++) {
      b = document.createElement("button");
      b.type = "button"; b.className = "key"; b.setAttribute("data-i", String(i));
      wheelEl.appendChild(b);
    }
    /* the keys exist only now: size and place them before anything draws a line through them */
    layoutSizes();
  }

  /* Put the existing keys on the ring. The keys' DOM order is their index, so pos stays in letter order. */
  function placeKeys() {
    var keys = wheelEl.querySelectorAll(".key"), i, a, dx, dy;
    pos = [];
    for (i = 0; i < keys.length; i++) {
      a = -Math.PI / 2 + i * 2 * Math.PI / keys.length;
      dx = Math.round(WHEEL_R * Math.cos(a)); dy = Math.round(WHEEL_R * Math.sin(a));
      keys[i].style.transform = "translate(" + dx + "px," + dy + "px)";
      pos.push({ x: WHEEL_H / 2 + dx, y: WHEEL_H / 2 + dy });
    }
  }

  /* the line through the picked letters, and on to the finger while it drags (an SVG polyline in the dark tone) */
  function drawLines() {
    var pts = state.entry.map(function (i) { return pos[i]; }).filter(Boolean);
    if (dragging && dragging.x != null && pts.length) pts.push({ x: dragging.x, y: dragging.y });
    linesEl.innerHTML = pts.length < 2 ? "" :
      '<polyline fill="none" stroke="' + INK + '" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" points="' +
      pts.map(function (q) { return Math.round(q.x) + "," + Math.round(q.y); }).join(" ") + '"/>';
  }

  function renderKeys() {
    var keys = wheelEl.querySelectorAll(".key"), i;
    for (i = 0; i < keys.length; i++) {
      var idx = +keys[i].getAttribute("data-i");
      keys[i].textContent = (state.wheel[idx] || "").toUpperCase();
      keys[i].className = "key" + (state.entry.indexOf(idx) >= 0 ? " on" : "") + (keyMode && idx === state.cursor && phase === "play" ? " cur" : "");
      keys[i].setAttribute("aria-label", "letter " + (state.wheel[idx] || "") + (state.entry.indexOf(idx) >= 0 ? ", used" : ""));
    }
    entryEl.textContent = state.entry.map(function (i) { return state.wheel[i]; }).join("").toUpperCase();
    drawLines();
  }

  function renderBoard() {
    boardEl.innerHTML = "";
    tapCell = ""; tapTurn = 0;
    if (!state.view) return;
    layoutSizes();
    var cols = state.view.maxC - state.view.minC + 1;
    var filled = {};
    state.placed.forEach(function (p) {
      if (state.done.indexOf(p.word) < 0) return;
      var dr = p.dir === "v" ? 1 : 0, dc = p.dir === "h" ? 1 : 0;
      for (var i = 0; i < p.word.length; i++) filled[keyOf(p.r + dr * i, p.c + dc * i)] = p.word.charAt(i);
    });
    for (var r = state.view.minR; r <= state.view.maxR; r++) {
      for (var c = state.view.minC; c <= state.view.maxC; c++) {
        var k = keyOf(r, c), el = document.createElement("div");
        if (state.cells[k]) {
          el.className = "cell" + (filled[k] ? " on" : "");
          el.textContent = filled[k] ? filled[k].toUpperCase() : "";
          el.setAttribute("data-r", String(r)); el.setAttribute("data-c", String(c));
        } else el.className = "gap";
        boardEl.appendChild(el);
      }
    }
    boardEl.setAttribute("aria-label", cols + " by " + (state.view.maxR - state.view.minR + 1) + " grid");
  }
  /* The screen decides the wheel and the cells, never the round: boardMin counts the largest 7x7 grid and the
     wheel also stops at 56% of the stage, so the board keeps growing on a bigger screen. main's spare height
     and #stage's width still cap it; it never goes below 154 px or past 260. */
  function layoutSizes() {
    var stageEl = boardEl.parentNode, mainEl = stageEl.parentNode;
    var view = state.view;
    var cols = view ? view.maxC - view.minC + 1 : GRID, rows = view ? view.maxR - view.minR + 1 : GRID;
    var cs = window.getComputedStyle(mainEl);
    var gap = parseFloat(cs.rowGap || cs.gap) || 0;
    var pad = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    /* the header and footer are outside main: what is left after the typing line, the note and their gaps is the stage's */
    var ah = mainEl.clientHeight - typedEl.offsetHeight - noteEl.offsetHeight - pad - gap * Math.max(0, mainEl.children.length - 1);
    var aw = stageEl.clientWidth;
    var boardMin = GRID * 18 + (GRID - 1);   /* 18 px cells for the largest grid, whatever this round's grid is */
    var wheel = Math.floor(Math.max(154, Math.min(260, ah, aw * 0.56, aw - 6 - boardMin)));
    if (!isFinite(wheel) || wheel < 154) wheel = 154;
    WHEEL_H = wheel;
    KEY = Math.max(36, Math.min(44, Math.round(WHEEL_H * 0.21)));
    WHEEL_R = Math.floor(WHEEL_H / 2 - KEY / 2 - 3);
    wheelEl.style.width = wheelEl.style.height = WHEEL_H + "px";
    linesEl.setAttribute("width", String(WHEEL_H));
    linesEl.setAttribute("height", String(WHEEL_H));
    var keys = wheelEl.querySelectorAll(".key"), half = -KEY / 2, i;
    for (i = 0; i < keys.length; i++) {
      keys[i].style.width = keys[i].style.height = KEY + "px";
      keys[i].style.margin = half + "px 0 0 " + half + "px";
    }
    /* a resize re-places the same keys and redraws the line: the wheel's order and the player's entry stay */
    placeKeys();
    drawLines();
    if (!view) return;
    var availW = aw - WHEEL_H - 8;   /* the 1px gaps are taken out below */
    var cell = Math.floor(Math.min(30, (availW - cols + 1) / cols, (WHEEL_H - rows + 1) / rows));
    if (!isFinite(cell) || cell < 12) cell = 12;
    boardEl.style.gridTemplateColumns = "repeat(" + cols + ", " + cell + "px)";
    boardEl.style.gridAutoRows = cell + "px";
    boardEl.style.fontSize = Math.max(12, Math.min(17, cell - 5)) + "px";
  }
  window.addEventListener("resize", function () { layoutSizes(); renderBoard(); });

  /* ---------- play ---------- */

  function entryWord() {
    return state.entry.map(function (i) { return state.wheel[i]; }).join("");
  }

  function shake() {
    boardEl.classList.remove("shake"); wheelEl.classList.remove("shake");
    void boardEl.offsetWidth;
    boardEl.classList.add("shake"); wheelEl.classList.add("shake");
    setTimeout(function () { boardEl.classList.remove("shake"); wheelEl.classList.remove("shake"); }, 260);
  }

  function submit() {
    if (phase !== "play" && phase !== "demo") return;
    var word = entryWord();
    state.entry = []; state.cursor = 0; renderKeys();
    if (!word || word.length < 3) { PAD.sfx("err"); shake(); return; }
    if (state.done.indexOf(word) >= 0) {
      /* a bonus word is not shown in the grid, so say which kind it was: "already found" alone reads as a bug */
      var inGrid = state.placed.some(function (p) { return p.word === word; });
      setNote(inGrid ? TXT.again : TXT.againBonus); PAD.sfx("err"); shake(); return;
    }
    var at = -1, i;
    for (i = 0; i < state.placed.length; i++) if (state.placed[i].word === word) { at = i; break; }
    if (at >= 0) { fillWord(state.placed[at]); return; }
    if (state.wordSet[word]) { bonusWord(word); return; }
    setNote(TXT.noWord); PAD.sfx("err"); shake();
  }

  /* the cell element at grid row r, column c (the board draws the rows of the view left to right) */
  function cellAt(r, c) {
    var v = state.view;
    return boardEl.children[(r - v.minR) * (v.maxC - v.minC + 1) + (c - v.minC)] || null;
  }

  /* A filled word lands letter by letter: each cell pops in with one rising note. The notes are custom sounds
     (PAD.sfx with an object, SPEC.md 6.3): a short square-wave blip each, up a pentatonic scale, so a longer word
     climbs higher. 80 ms apart is at most 13 sounds a second, under the limit of 20. */
  var NOTES = [523, 587, 659, 784, 880, 1047, 1175];
  function land(p) {
    var dr = p.dir === "v" ? 1 : 0, dc = p.dir === "h" ? 1 : 0, i, cells = [];
    for (i = 0; i < p.word.length; i++) {
      var el = cellAt(p.r + dr * i, p.c + dc * i);
      if (!el) continue;
      el.className = "cell"; el.textContent = "";
      cells.push(el);
    }
    cells.forEach(function (el, k) {
      fxTimers.push(setTimeout(function () {
        el.className = "cell on pop"; el.textContent = p.word.charAt(k).toUpperCase();
        var last = k === cells.length - 1;
        PAD.sfx({ wave: "square", duty: 1, from: NOTES[k % NOTES.length], ms: last ? 220 : 90, decay: last ? 200 : 70, vol: 0.5 });
      }, k * 80));
    });
    return cells.length * 80 + 300;   /* how long the landing takes, for the clear that may follow */
  }

  function fillWord(p) {
    state.done.push(p.word);
    setNote("");
    renderBoard(); updateHeader();
    var ms = land(p);
    /* PAD.dict.lookup gives the line in the player's language; PAD.say reads the word with the phone's English
       voice. Both may answer null (dictionary unreadable, or more than 10 calls a second): then the line stays empty. */
    lookupLine(p.word);
    sayWord(p.word);
    save();
    checkComplete(false, ms);
  }

  function sayWord(word) {
    if (!PAD.say) return;
    try { var s = PAD.say(word, { lang: "en" }); if (s && s.then) s.then(null, function () {}); } catch (e) {}
  }

  function lookupLine(word) {
    var token = noteStart("fill", word);
    if (!PAD.dict || !PAD.dict.lookup) { setNote(""); return; }
    dictLookup(word).then(function (e) {
      if (token !== noteSeq || phase === "error" || phase === "load") return;
      var m = meaning(e);
      if (!m) { setNote(""); return; }
      state.mean[word] = m;
      if (phase === "play" || phase === "demo") setNote(m);
    }, function () { if (token === noteSeq) setNote(""); });
  }

  /* A filled word can be tapped to see its meaning again. A cell where two words cross shows the horizontal word
     first and the vertical one on the next tap. The lookup runs only when the round's cache has no line for the
     word, and a word already asked for is not asked again while its answer is on the way (10 calls a second). */
  function wordsAt(r, c) {
    var out = [];
    state.placed.forEach(function (p) {
      if (state.done.indexOf(p.word) < 0) return;
      var dr = p.dir === "v" ? 1 : 0, dc = p.dir === "h" ? 1 : 0;
      for (var i = 0; i < p.word.length; i++) {
        if (p.r + dr * i === r && p.c + dc * i === c) { out.push({ word: p.word, dir: p.dir }); return; }
      }
    });
    /* the board draws both words under one cell; "h" before "v" is the order the player reads them */
    return out.sort(function (a, b) { return a.dir === b.dir ? 0 : a.dir === "h" ? -1 : 1; });
  }
  function showMeaning(word) {
    /* the tap is a note action even when the line is cached: it must invalidate any older lookup still in flight */
    var token = noteStart("tap", word);
    sayWord(word);
    if (state.mean[word]) { setNote(state.mean[word], "tap", word); return; }
    if (!PAD.dict || !PAD.dict.lookup || tapPending[word]) return;
    tapPending[word] = true;
    dictLookup(word).then(function (e) {
      tapPending[word] = false;
      var m = meaning(e);
      /* the token is stale after a second tap on this word, but that tap still wants this one answer */
      var newest = token === noteSeq || (noteKind === "tap" && noteWord === word);
      if (!m) { if (newest && phase === "play") setNote("", "tap", word); return; }
      state.mean[word] = m;
      if (newest && phase === "play") setNote(m, "tap", word);
    }, function () {
      tapPending[word] = false;
      if ((token === noteSeq || (noteKind === "tap" && noteWord === word)) && phase === "play") setNote("", "tap", word);
    });
  }

  PAD.load("game").then(function (v) {
    if (v && typeof v === "object") {
      savedRound = typeof v.round === "number" && v.round % 1 === 0 && v.round >= 1 ? Math.min(101, v.round) : 1;
      savedHints = typeof v.hints === "number" && v.hints >= 0 ? Math.floor(v.hints) : 0;
      savedDone = Array.isArray(v.done) ? v.done.filter(isWord) : [];
      taught = v.taught === true;          /* saves from 1.0.0 have no flag: those players see the demo once too */
      /* a save from before 1.6.0 has no cleared: every round before its round was cleared, which is what cleared
         means. After the hundredth, round is 101 and the title offers a random round instead of a number. */
      state.cleared = typeof v.cleared === "number" && v.cleared >= 0 ? Math.min(100, Math.floor(v.cleared)) : Math.min(100, savedRound - 1);
      state.random = typeof v.random === "number" && v.random >= 0 ? Math.floor(v.random) : 0;
      bookTip = v.bookTip === true;    /* 1.5.0 saves have no flag: those players get the card's A/B hint once */
    }
    mainRound = Math.max(1, Math.min(savedRound, state.cleared < 100 ? state.cleared + 1 : 101));
    mainDone = savedDone.slice();
    state.round = mainRound; state.hints = savedHints; state.done = savedDone.slice();
    showTitle();                         /* the title on every open; the round is built when the player opens it */
  }, function () { showTitle(); });
})();
</script>
