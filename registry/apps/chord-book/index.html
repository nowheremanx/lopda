<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>和弦大全</title>
<!-- Lo-PDA app (lopda/1): a guitar chord dictionary for standard tuning. Every voicing comes from a hand-written table
of common shapes or from a generator in src/chords.js; nothing is taken from an outside chord database.
docs/design/chord-book.md. Tap-driven, so no chin pad (sdk/UI.md 1).
Copyright (c) 2026 Haowei Wu. MIT License. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#a3ad7e;color:#1f2a14;font-family:monospace;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column}
button{font-family:monospace;font-size:15px;color:#1f2a14;background:#a3ad7e;border:2px solid #1f2a14;box-shadow:3px 3px 0 #1f2a14;
  min-height:44px;padding:0 8px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #1f2a14}
button.on,button.sel{background:#1f2a14;color:#a3ad7e}
button:disabled{color:#4a5a32;border-style:dashed;box-shadow:none}
header{flex:none;display:flex;gap:8px;padding:8px 12px 0;align-items:stretch}
#chord{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:4px;text-align:left}
#cname{font-size:20px;font-weight:bold;overflow-wrap:anywhere}
#prog,#view{min-width:56px;padding:0 6px}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:10px 12px 6px}
/* the picture takes the height that is left; Draw.paint scales it by a whole number to fit */
#pwrap{flex:1;min-height:110px;display:flex;align-items:center;justify-content:center;touch-action:pan-y;cursor:pointer}
#pic{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#qname{font-size:15px;text-align:center;flex:none}
#line{font-size:15px;text-align:center;flex:none;font-weight:bold;overflow-wrap:anywhere}
#tones{display:flex;justify-content:center;gap:6px;flex:none}
/* one cell per string, low E first; a sounding string is a button that plays it alone */
.tone{display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;min-width:44px;padding:2px 0;line-height:1.15}
.tone.mute{min-height:44px;font-size:15px;color:#4a5a32}
.tone b{font-size:15px}
.tone span{font-size:13px;color:#4a5a32}
footer{flex:none;display:flex;gap:8px;padding:0 12px 12px}
footer button{flex:1;min-width:0}
#strum{flex:1.4;font-weight:bold}
/* screens over the main one: the picker and the finder */
.screen{position:fixed;inset:0;background:#a3ad7e;display:none;flex-direction:column}
.screen.open{display:flex}
.screen header{align-items:center;padding:8px 12px}
.screen header b{flex:1;font-size:17px;text-align:center;overflow-wrap:anywhere}
.screen .body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 12px}
.screen h3{font-size:13px;color:#4a5a32;margin:12px 0 6px;font-weight:normal}
#sbar{display:flex;gap:8px}
#q{flex:1;min-width:0;font-family:monospace;font-size:16px;color:#1f2a14;background:#a3ad7e;border:2px solid #1f2a14;
  padding:0 8px;min-height:44px;box-sizing:border-box;border-radius:0;outline:none}
#q::placeholder{color:#4a5a32}
#msg{font-size:15px;min-height:20px;margin-top:6px}
.grid4,.grid3,.grid2{display:grid;gap:8px}
.grid4{grid-template-columns:repeat(4,1fr)}
.grid3{grid-template-columns:repeat(3,1fr)}
.grid2{grid-template-columns:repeat(2,1fr)}
.grid4 button,.grid3 button,.grid2 button{min-width:0;padding:0 4px;box-shadow:none}
.qual{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 4px;line-height:1.15}
.qual b{font-size:15px}
.qual span{font-size:13px}
#tofind{width:100%;margin-top:16px}
#vol{margin-top:0}
/* the finder: x / o over each string, then five frets of six cells */
#fdown,#fup{min-width:48px;font-size:20px;font-weight:bold}
.six{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.six button{min-width:0;padding:0;box-shadow:none}
.six .cell{font-size:13px;color:#4a5a32}
.six .cell.sel{color:#a3ad7e;font-size:15px;font-weight:bold}
.six .xo{font-weight:bold}
#fres{flex:none;text-align:center;padding:0 12px;min-height:44px}
#fname{font-size:20px;font-weight:bold;overflow-wrap:anywhere}
#falt{font-size:15px;min-height:20px;overflow-wrap:anywhere}
#fact{flex:none;display:flex;gap:8px;padding:8px 12px 12px}
#fact button{flex:1;min-width:0}
#fsee{flex:2}
/* the progressions: one card each, the chord you came from underlined, the one sounding filled */
.card{border-top:2px solid #1f2a14;padding:10px 0 12px}
.card:first-child{border-top:0;padding-top:4px}
.card.focus{outline:2px dashed #4a5a32;outline-offset:2px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ghead b{font-size:17px;overflow-wrap:anywhere}
.ghead span{font-size:14px;color:#4a5a32;flex:none}
.grn{font-size:14px;color:#4a5a32;margin-top:2px;overflow-wrap:anywhere}
.chips{margin-top:8px}
.chips button{font-size:14px}
.chips button.me{font-weight:bold;text-decoration:underline;text-underline-offset:3px}
.grow{display:flex;align-items:center;gap:8px;margin-top:8px}
.grole{flex:1;font-size:14px;overflow-wrap:anywhere}
.gplay{min-width:72px;box-shadow:none}
.why{font-size:14px;line-height:1.45;margin:8px 0 0}
</style>
</head>
<body>
<header><button id="chord"><span id="cname"></span><span>▾</span></button><button id="prog"></button><button id="view"></button></header>
<main>
  <div id="pwrap"><canvas id="pic" width="104" height="104"></canvas></div>
  <div id="qname"></div>
  <div id="line"></div>
  <div id="tones"></div>
</main>
<footer><button id="prev"></button><button id="strum"></button><button id="next"></button></footer>

<div id="picker" class="screen">
  <header><button id="pback"></button><b id="ptitle"></b><button id="pok"></button></header>
  <div class="body" id="pmain">
    <div id="sbar"><input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="qgo"></button></div>
    <div id="msg"></div>
    <h3 id="rootH"></h3><div id="roots" class="grid4"></div>
    <div id="quals"></div>
    <h3 id="bassH"></h3><div id="basses" class="grid4"></div>
    <h3 id="recentH"></h3><div id="recent" class="grid4"></div>
    <button id="tofind"></button>
    <h3 id="sortH"></h3><div id="sorts" class="grid2"></div>
    <h3 id="volH"></h3><div id="vol" class="grid3"></div>
  </div>
</div>

<div id="progs" class="screen">
  <header><button id="gback"></button><b id="gtitle"></b></header>
  <div class="body" id="glist"></div>
</div>
<div id="finder" class="screen">
  <header><button id="fback"></button><button id="fdown">-</button><b id="fpos"></b><button id="fup">+</button></header>
  <div id="fres"><div id="fname"></div><div id="falt"></div></div>
  <div class="body">
    <div id="xo" class="six"></div>
    <div id="frets" class="six"></div>
  </div>
  <div id="fact"><button id="fplay"></button><button id="fsee"></button></div>
</div>

<script data-src="src/chords.js">
/* 和弦大全 / Chords: the chord maths, free of the DOM and of PAD so tests/chord-book.test.mjs runs it in Node.
   Standard tuning only. Every voicing is either from the hand-written table of common shapes below or computed by
   generate(); nothing comes from an outside chord database (docs/design/chord-book.md section 2).
   MIT License. Copyright (c) 2026 Haowei Wu. */
var Chords = (function () {
  "use strict";

  var OPEN = [40, 45, 50, 55, 59, 64];          /* E2 A2 D3 G3 B3 E4, low string first */
  var MAX_FRET = 15, SPAN = 3, LIMIT = 24;
  /* the note names shown, the same set the four-track uses */
  var NAMES = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
  var LETTER = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

  /* The 19 qualities of version 1, in the order the picker lists them (section 2.1). iv: semitones above the root;
     lab: how each interval is written; opt: intervals a voicing may leave out (the fifth). group: the picker's
     heading; common: how readily identify() picks it when two names fit the same notes. */
  var QUALS = [
    { id: "",      zh: "大三",   en: "major",       iv: [0, 4, 7],         lab: ["R", "3", "5"],                 opt: [],  group: 0, common: 1 },
    { id: "m",     zh: "小三",   en: "minor",       iv: [0, 3, 7],         lab: ["R", "b3", "5"],                opt: [],  group: 0, common: 1 },
    { id: "dim",   zh: "减三",   en: "diminished",  iv: [0, 3, 6],         lab: ["R", "b3", "b5"],               opt: [],  group: 0, common: 0.4 },
    { id: "aug",   zh: "增三",   en: "augmented",   iv: [0, 4, 8],         lab: ["R", "3", "#5"],                opt: [],  group: 0, common: 0.4 },
    { id: "5",     zh: "强力",   en: "power",       iv: [0, 7],            lab: ["R", "5"],                      opt: [],  group: 0, common: 0.5 },
    { id: "7",     zh: "属七",   en: "dominant 7",  iv: [0, 4, 7, 10],     lab: ["R", "3", "5", "b7"],           opt: [7], group: 1, common: 0.8 },
    { id: "maj7",  zh: "大七",   en: "major 7",     iv: [0, 4, 7, 11],     lab: ["R", "3", "5", "7"],            opt: [7], group: 1, common: 0.7 },
    { id: "m7",    zh: "小七",   en: "minor 7",     iv: [0, 3, 7, 10],     lab: ["R", "b3", "5", "b7"],          opt: [7], group: 1, common: 0.8 },
    { id: "m7b5",  zh: "半减七", en: "half-dim",    iv: [0, 3, 6, 10],     lab: ["R", "b3", "b5", "b7"],         opt: [],  group: 1, common: 0.5 },
    { id: "dim7",  zh: "减七",   en: "dim 7",       iv: [0, 3, 6, 9],      lab: ["R", "b3", "b5", "bb7"],        opt: [],  group: 1, common: 0.5 },
    { id: "mmaj7", zh: "小大七", en: "minor maj7",  iv: [0, 3, 7, 11],     lab: ["R", "b3", "5", "7"],           opt: [7], group: 1, common: 0.3 },
    { id: "sus2",  zh: "挂二",   en: "sus2",        iv: [0, 2, 7],         lab: ["R", "2", "5"],                 opt: [],  group: 2, common: 0.6 },
    { id: "sus4",  zh: "挂四",   en: "sus4",        iv: [0, 5, 7],         lab: ["R", "4", "5"],                 opt: [],  group: 2, common: 0.6 },
    { id: "7sus4", zh: "属七挂四", en: "7sus4",     iv: [0, 5, 7, 10],     lab: ["R", "4", "5", "b7"],           opt: [7], group: 2, common: 0.5 },
    { id: "add9",  zh: "加九",   en: "add9",        iv: [0, 2, 4, 7],      lab: ["R", "9", "3", "5"],            opt: [7], group: 3, common: 0.5 },
    { id: "6",     zh: "大六",   en: "major 6",     iv: [0, 4, 7, 9],      lab: ["R", "3", "5", "6"],            opt: [7], group: 3, common: 0.4 },
    { id: "m6",    zh: "小六",   en: "minor 6",     iv: [0, 3, 7, 9],      lab: ["R", "b3", "5", "6"],           opt: [7], group: 3, common: 0.4 },
    { id: "9",     zh: "属九",   en: "dominant 9",  iv: [0, 2, 4, 7, 10],  lab: ["R", "9", "3", "5", "b7"],      opt: [7], group: 4, common: 0.4 },
    { id: "m9",    zh: "小九",   en: "minor 9",     iv: [0, 2, 3, 7, 10],  lab: ["R", "9", "b3", "5", "b7"],     opt: [7], group: 4, common: 0.4 }
  ];
  var GROUPS = [{ zh: "三和弦", en: "Triads" }, { zh: "七和弦", en: "Sevenths" }, { zh: "挂留", en: "Suspended" },
    { zh: "加音、六", en: "Added, sixths" }, { zh: "九和弦", en: "Ninths" }];
  var QI = {};
  QUALS.forEach(function (q, i) { QI[q.id] = i; });

  /* Names people write for each quality (section 2.2). Looked up as written first, then lower-cased for the
     longer ones, so "Cmaj7" and "CMAJ7" both work but "CM" (major) and "Cm" (minor) stay apart. */
  var ALIAS = {
    "": "", "maj": "", "M": "", "major": "",
    "m": "m", "min": "m", "-": "m", "minor": "m",
    "dim": "dim", "°": "dim", "o": "dim",
    "aug": "aug", "+": "aug", "+5": "aug", "#5": "aug",
    "5": "5",
    "7": "7", "dom7": "7",
    "maj7": "maj7", "M7": "maj7", "Δ": "maj7", "Δ7": "maj7", "ma7": "maj7", "j7": "maj7",
    "m7": "m7", "min7": "m7", "-7": "m7",
    "m7b5": "m7b5", "ø": "m7b5", "ø7": "m7b5", "m7-5": "m7b5", "-7b5": "m7b5", "min7b5": "m7b5",
    "dim7": "dim7", "°7": "dim7", "o7": "dim7",
    "mmaj7": "mmaj7", "mM7": "mmaj7", "m(maj7)": "mmaj7", "mΔ": "mmaj7", "mΔ7": "mmaj7", "-Δ7": "mmaj7", "minmaj7": "mmaj7",
    "sus2": "sus2", "sus4": "sus4", "sus": "sus4", "7sus4": "7sus4", "7sus": "7sus4",
    "add9": "add9", "add2": "add9", "(add9)": "add9",
    "6": "6", "maj6": "6", "M6": "6", "m6": "m6", "min6": "m6", "-6": "m6",
    "9": "9", "m9": "m9", "min9": "m9", "-9": "m9"
  };
  var ALIAS_LOWER = {};
  Object.keys(ALIAS).forEach(function (k) { if (k.length >= 3) ALIAS_LOWER[k.toLowerCase()] = ALIAS[k]; });

  function mod12(n) { return ((n % 12) + 12) % 12; }
  function pcOf(s) {
    var m = /^([A-Ga-g])([#b]*)$/.exec(s);
    if (!m) return null;
    var pc = LETTER[m[1].toUpperCase()];
    for (var i = 0; i < m[2].length; i++) pc += m[2][i] === "#" ? 1 : -1;
    return mod12(pc);
  }
  /* "C#m7b5", "d/f#", "Bb maj7", "E♭m" -> {root, q, bass} with bass null for a plain chord; null if it is not a chord */
  function parse(text) {
    if (typeof text !== "string") return null;
    var s = text.replace(/\s+/g, "").replace(/♯/g, "#").replace(/♭/g, "b");
    var m = /^([A-Ga-g])(#|bb|b)?(.*?)(?:\/([A-Ga-g](?:#|b)?))?$/.exec(s);
    if (!m) return null;
    var root = pcOf(m[1] + (m[2] || ""));
    var q = Object.prototype.hasOwnProperty.call(ALIAS, m[3]) ? ALIAS[m[3]]
      : Object.prototype.hasOwnProperty.call(ALIAS_LOWER, m[3].toLowerCase()) && m[3].length >= 3 ? ALIAS_LOWER[m[3].toLowerCase()] : null;
    if (root === null || q === null) return null;
    var bass = m[4] ? pcOf(m[4]) : null;
    if (m[4] && bass === null) return null;
    if (bass === root) bass = null;
    return { root: root, q: q, bass: bass };
  }
  function name(c) { return NAMES[c.root] + c.q + (c.bass === null || c.bass === undefined ? "" : "/" + NAMES[c.bass]); }
  function qual(id) { return Object.prototype.hasOwnProperty.call(QI, id) ? QUALS[QI[id]] : null; }

  /* the chord's notes and how each is written, bass first when it is not a chord tone */
  function tones(c) {
    var Q = qual(c.q), out = [];
    if (c.bass !== null && c.bass !== undefined && Q.iv.map(function (i) { return mod12(c.root + i); }).indexOf(c.bass) < 0)
      out.push({ pc: c.bass, lab: "/", iv: null });
    /* listed as they stack up from the root: a 9 is a ninth (14 semitones), not a second, so it comes last */
    var up = [];
    for (var i = 0; i < Q.iv.length; i++) up.push({ pc: mod12(c.root + Q.iv[i]), lab: Q.lab[i], iv: Q.lab[i] === "9" ? Q.iv[i] + 12 : Q.iv[i] });
    up.sort(function (a, b) { return a.iv - b.iv; });
    return out.concat(up);
  }

  /* the degree of any pitch class above the chord's root: the chord's own tones as the chord writes them (4 in a sus4,
     6 in a 6 chord), every other note as an upper extension, the way a player looks for one to add (11, not 4) */
  var EXT = ["R", "b9", "9", "b3", "3", "11", "#11", "5", "b13", "13", "b7", "7"];
  function degree(c, pc) {
    var Q = qual(c.q);
    for (var i = 0; i < Q.iv.length; i++) if (mod12(c.root + Q.iv[i]) === pc) return { lab: Q.lab[i], tone: true };
    return { lab: EXT[mod12(pc - c.root)], tone: false };
  }

  /* what each string of a voicing sounds, low E first: null for a muted string, else its pitch and the degree it is in the
     chord (R, 3, 5, b7, 9...), "/" for a slash chord's extra bass. An open C is x, R, 3, 5, R, 3: five notes, not three. */
  function strings(frets, c) {
    var ts = tones(c), out = [];
    for (var s = 0; s < 6; s++) {
      if (frets[s] < 0) { out.push(null); continue; }
      var m = OPEN[s] + frets[s], pc = mod12(m), lab = "";
      for (var i = 0; i < ts.length; i++) if (ts[i].pc === pc) { lab = ts[i].lab; break; }
      out.push({ s: s, midi: m, pc: pc, lab: lab });
    }
    return out;
  }

  /* ---------------- the hand-written shapes (section 2.3) ---------------- */
  function fr(s) {
    var out = [], i = 0;
    while (i < s.length) {
      if (s[i] === "(") { var j = s.indexOf(")", i); out.push(parseInt(s.slice(i + 1, j), 10)); i = j + 1; }
      else { out.push(s[i] === "x" ? -1 : parseInt(s[i], 10)); i++; }
    }
    return out;
  }
  /* open chords: [chord, frets, fingers] in the order they are best known; T in fingers is the thumb */
  var OPENS = [
    ["C", "x32010", "032010"], ["A", "x02220", "001230"], ["G", "320003", "210003"], ["G", "320033", "210034"],
    ["E", "022100", "023100"], ["D", "xx0232", "000132"],
    ["Am", "x02210", "002310"], ["Em", "022000", "023000"], ["Dm", "xx0231", "000231"],
    ["C7", "x32310", "032410"], ["A7", "x02020", "002030"], ["G7", "320001", "320001"], ["E7", "020100", "020100"],
    ["D7", "xx0212", "000213"], ["B7", "x21202", "021304"],
    ["Am7", "x02010", "002010"], ["Em7", "022030", "023040"], ["Em7", "020000", "020000"], ["Dm7", "xx0211", "000211"],
    ["Cmaj7", "x32000", "032000"], ["Amaj7", "x02120", "002130"], ["Gmaj7", "320002", "320001"], ["Emaj7", "021100", "031200"],
    ["Dmaj7", "xx0222", "000111"], ["Fmaj7", "xx3210", "003210"],
    ["Asus2", "x02200", "001200"], ["Dsus2", "xx0230", "000130"], ["Esus4", "022200", "023400"], ["Asus4", "x02230", "001230"],
    ["Dsus4", "xx0233", "000134"], ["A7sus4", "x02030", "002030"], ["E7sus4", "020200", "020300"],
    ["Cadd9", "x32030", "021030"], ["D6", "xx0202", "000203"], ["A6", "x02222", "001111"], ["Am6", "x02212", "002314"],
    ["Em6", "022020", "023040"], ["C9", "x32333", "021333"], ["E9", "020102", "020103"],
    ["E5", "022xxx", "012000"], ["A5", "x022xx", "001200"], ["D5", "xx023x", "000120"],
    ["Edim7", "012020", "012030"], ["Ammaj7", "x02110", "003120"],
    /* slash chords */
    ["D/F#", "2x0232", "T00132"], ["G/B", "x20003", "010003"], ["C/G", "332010", "432010"], ["C/E", "032010", "032010"],
    ["Am/G", "3x2210", "402310"], ["F/C", "x33211", "034211"], ["D/A", "x00232", "000132"], ["Am/E", "002210", "002310"]
  ];
  /* movable shapes: [quality, string the root is on (0 = low E), offsets from the root's fret (null = muted),
     fingers, tier]. E and A shapes are the barre chords everyone learns (tier 80); D and C shapes less so (60). */
  var MOVABLE = [
    ["", 0, [0, 2, 2, 1, 0, 0], "134211", 80], ["m", 0, [0, 2, 2, 0, 0, 0], "134111", 80],
    ["7", 0, [0, 2, 0, 1, 0, 0], "131211", 80], ["m7", 0, [0, 2, 0, 0, 0, 0], "131111", 80],
    ["maj7", 0, [0, null, 1, 1, 0, null], "103420", 80], ["7sus4", 0, [0, 2, 0, 2, 0, 0], "131411", 80],
    ["m7b5", 0, [0, null, 0, 0, -1, null], "203410", 80], ["5", 0, [0, 2, 2, null, null, null], "134000", 80],
    ["dim7", 0, [0, null, -1, 0, -1, null], "201310", 80],
    ["", 1, [null, 0, 2, 2, 2, 0], "013331", 80], ["m", 1, [null, 0, 2, 2, 1, 0], "013421", 80],
    ["7", 1, [null, 0, 2, 0, 2, 0], "013141", 80], ["m7", 1, [null, 0, 2, 0, 1, 0], "013121", 80],

        b.disc(x, y, 1, pc === rootPc ? DARK : MID);
      }
      if (!v) continue;
      var vf = v.frets[s];
      if (vf < 0) { for (i = -2; i <= 2; i++) { b.set(NX - 7 + i, y + i, INK); b.set(NX - 7 + i, y - i, INK); } }
      else if (vf === 0) b.ring(NX - 7, y, 3, INK);
      else {
        var vx = NX + (vf - 1) * NF + 5;
        if ((Chords.OPEN[s] + vf) % 12 === rootPc) b.rect(vx - 3, y - 3, 7, 7, INK); else b.disc(vx, y, 3, INK);
      }
    }
    return b;
  }

  /* the buffer onto the canvas, and the canvas to the biggest whole scale that fits maxW x maxH css pixels */
  function paint(canvas, b, maxW, maxH) {
    if (canvas.width !== b.w) canvas.width = b.w;
    if (canvas.height !== b.h) canvas.height = b.h;
    var ctx = canvas.getContext("2d"), img = ctx.createImageData(b.w, b.h), d = img.data;
    for (var i = 0; i < b.px.length; i++) {

    }
    ctx.putImageData(img, 0, 0);
    var k = Math.max(1, Math.floor(Math.min(maxW / b.w, maxH / b.h)));
    canvas.style.width = b.w * k + "px";
    canvas.style.height = b.h * k + "px";
    return k;
  }

  return { Buf: Buf, box: box, map: map, mapAt: mapAt, neck: neck, paint: paint, baseFret: baseFret, BOX_W: BOX_W, BOX_H: BOX_H, NECK_W: NECK_W, NECK_H: NECK_H };
})();
</script>
<script data-src="src/guitar.js">
/* 和弦大全 / Chords: a plucked guitar for strumming a voicing. The same Karplus-Strong string as the four-track's
   guitar (runtime/studio-synth.js guitarFor): a short burst of soft noise fed round a delay line that loses a little
   each pass, rendered once per note and kept. The app's own AudioContext, made on the first tap; PAD.music has three
   tonal voices and a chord needs six. It does not follow the runtime's volume, so it stays quiet and has its own
   switch (off, small, middle).
   MIT License. Copyright (c) 2026 Haowei Wu. */
var Guitar = (function () {
  "use strict";
  var ctx = null, master = null, cache = {}, playing = [], level = 2;
  var LEVELS = [0, 0.3, 0.6];   /* six strings at 0.09 each stay under about 0.3 at the middle level */

  function rng(seed) {
    var x = seed >>> 0 || 1;
    return function () { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return (x >>> 0) / 4294967296; };
  }
  function freq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }

  function ensure() {
    if (ctx) return ctx;
    var AC = typeof window !== "undefined" && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return null;
    try { ctx = new AC(); } catch (e) { return null; }
    master = ctx.createGain();
    master.gain.value = LEVELS[level];
    master.connect(ctx.destination);
    return ctx;
  }

  /* one string's sound, 2.5 s, normalised; the delay line is a whole number of samples and the playback rate tunes it */
  function bufferFor(midi) {
    if (cache[midi]) return cache[midi];
    var sr = ctx.sampleRate, f = freq(midi), N = Math.max(2, Math.floor(sr / f));
    var len = Math.floor(sr * 2.5), out = new Float32Array(len), r = rng(0x7a3f19c5 ^ (midi * 2654435761));
    var a = 1 - Math.exp(-2 * Math.PI * 3000 / sr), lp = 0, i;
    for (i = 0; i < N && i < len; i++) {
      var n = r() * 2 - 1;
      lp += a * (n - lp);
      out[i] = 0.7 * lp + 0.3 * n;
    }
    for (i = N; i < len; i++) out[i] = 0.996 * 0.5 * (out[i - N] + (i - N - 1 >= 0 ? out[i - N - 1] : 0));
    var peak = 0;
    for (i = 0; i < len; i++) peak = Math.max(peak, Math.abs(out[i]));
    if (peak > 0) for (i = 0; i < len; i++) out[i] /= peak;
    var buf = ctx.createBuffer(1, len, sr);
    buf.getChannelData(0).set(out);
    cache[midi] = { buf: buf, rate: (N + 0.5) * f / sr };
    return cache[midi];
  }

  function hush(list) {
    var t = ctx.currentTime;
    list.forEach(function (p) {
      try { p.g.gain.cancelScheduledValues(t); p.g.gain.setTargetAtTime(0, t, 0.02); p.src.stop(t + 0.1); } catch (e) {}
    });
  }
  function stop() {
    if (!ctx) return;
    hush(playing);
    playing = [];
  }

  /* notes: midi numbers, low string first; gap: seconds between strings (0.012 for a strum, 0.18 for an arpeggio).
     ring: leave what is sounding alone (single tones tapped one after another ring together, so an interval is heard
     both ways); at most 8 notes ring, the oldest go first */
  function play(notes, gap, ring) {
    if (!level || !notes.length || !ensure()) return false;
    if (ctx.state === "suspended" && ctx.resume) ctx.resume();
    if (!ring) stop();
    else if (playing.length + notes.length > 8) hush(playing.splice(0, playing.length + notes.length - 8));
    var t0 = ctx.currentTime + 0.02;
    notes.forEach(function (m, k) {
      var b = bufferFor(m), src = ctx.createBufferSource(), g = ctx.createGain();
      src.buffer = b.buf;
      src.playbackRate.value = b.rate;
      g.gain.value = 0.09;
      src.connect(g);
      g.connect(master);
      src.start(t0 + k * gap);
      playing.push({ src: src, g: g });
    });
    return true;
  }

  function setLevel(n) {
    level = Math.max(0, Math.min(2, n | 0));
    if (master) master.gain.value = LEVELS[level];
    if (!level) stop();
  }
  /* a hidden page goes quiet and lets the phone's audio go */
  if (typeof document !== "undefined") document.addEventListener("visibilitychange", function () {
    if (!ctx) return;
    if (document.hidden) { stop(); if (ctx.suspend) ctx.suspend(); }
  });

  return { play: play, stop: stop, setLevel: setLevel, level: function () { return level; } };
})();
</script>

/* 和弦大全 / Chords: chord progressions (和弦连接). A hand-written table of common progressions, each in degrees of its key

        en: "The 9th brightens a minor chord and softens it. Up a fourth is one of the commonest root moves, but with two minor chords there is no V-to-I sense of ending, so it can repeat for ever, as neo-soul does."
      } }
  ];

  function bassOk(slot, c, strict) {
    if (!strict) return true;
    if (c.bass === null || c.bass === undefined) return slot[2] === undefined;
    return slot[2] !== undefined && mod12(slot[2] - slot[0]) === mod12(c.bass - c.root);
  }
  /* the slot a chord takes in a progression: its tonic slot if it has one there, else the first that fits */
  function find(p, c, strict) {

    for (var i = 0; i < p.ch.length; i++) {
      if (p.ch[i][1] !== c.q || !bassOk(p.ch[i], c, strict)) continue;
      if (p.ch[i][0] === 0) return i;

  /* spelling in the key: the tonic's name from the usual key signature, then each chord's letter counted up the scale from
     its Roman numeral (so #I°7 in G is G#°7, not Ab°7); the app's fixed names if that would need a double sharp or flat */

  var MIN_KEY = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "G#", "A", "Bb", "B"];

  }
  var ALT = { 1: ["C#", "Db"], 3: ["D#", "Eb"], 6: ["F#", "Gb"], 8: ["G#", "Ab"], 10: ["A#", "Bb"] };
  function keyName(key, mode) { return (mode === "min" ? MIN_KEY : MAJ_KEY)[key]; }
  /* the key's name: the usual one, unless the other spelling is the one that keeps the chord you looked up spelled as
     you looked it up (Ebm as vi is in Gb major, not F#) */

    var usual = keyName(key, p.key), want = Chords.NAMES[c.root], step = stepOf(p.rn[at]);

    var rn = p.rn[i];

  /* the progressions a chord appears in, each spelled in the key that puts the chord in its slot (find). A slash chord
     takes slots with the same bass; failing that, any slot of its quality, listed after the exact ones. Then
     progressions where the chord is the tonic come first, otherwise the table's order. */
  function forChord(c) {
    var out = [];
    LIST.forEach(function (p, n) {
      var at = find(p, c, true), exact = true;
      if (at < 0 && c.bass !== null && c.bass !== undefined) { at = find(p, c, false); exact = false; }
      if (at < 0) return;
      var key = mod12(c.root - p.ch[at][0]);
      var chords = p.ch.map(function (s) {
        return { root: mod12(key + s[0]), q: s[1], bass: s[2] === undefined ? null : mod12(key + s[2]) };
      });
      var tonic = tonicFor(p, key, at, c);
      out.push({
        p: p, key: key, keyName: tonic, at: at, n: n, exact: exact, chords: chords,
        names: chords.map(function (x, i) { return spell(p, tonic, i, x); })
      });
    });
    out.sort(function (a, b) {
      return (a.exact ? 0 : 1) - (b.exact ? 0 : 1) || (a.p.ch[a.at][0] === 0 ? 0 : 1) - (b.p.ch[b.at][0] === 0 ? 0 : 1) || a.n - b.n;
    });
    return out;
  }
  /* the voicing to play for a chord in a progression: among its 8 commonest, the one nearest the fret position the player
     is at, so the hand stays in one place (the commonest wins a tie) */
  function nearVoicing(list, pos) {
    var best = null, d = 99;
    list.slice(0, 8).forEach(function (v) { var e = Math.abs(v.pos - pos); if (e < d) { d = e; best = v; } });
    return best;
  }

  return { LIST: LIST, forChord: forChord, nearVoicing: nearVoicing, keyName: keyName };
})();
</script>

    }
    at(0);
  }
  /* a chord in a progression opens it on the main screen, on the voicing it was played with */
  function jumpTo(r, i) {
    var v = voicingFor(r, i), c = r.chords[i];
    stopSeq();
    progs.classList.remove("open"); gl = null;
    go(c, 0);
    var l = list(), id = v ? v.frets.join(",") : "";
    set.cur.i = Math.max(0, l.map(function (x) { return x.frets.join(","); }).indexOf(id));
    sfx("ok"); store(); show();
  }
  function focusProg(d) {
    if (!gl || !gl.length) return;
    if (gkeyed) gfocus = (gfocus + d + gl.length) % gl.length;
    gkeyed = true;
    sfx("tick"); buildProgs();
    var card = $("glist").children[gfocus];
    if (card && card.scrollIntoView) card.scrollIntoView({ block: "nearest" });
  }
  $("prog").addEventListener("click", openProgs);
  $("gback").addEventListener("click", function () { sfx("tap"); closeProgs(); });
  document.addEventListener("visibilitychange", function () { if (document.hidden) stopSeq(); });

  /* ---------------- the finder (section 3.4) ---------------- */
  var fs = null;     /* {frets, base} */
  var finder = $("finder");
  function openFinder() {
    var v = current().v, frets = v ? v.frets.slice() : [-1, 3, 2, 0, 1, 0];
    fs = { frets: frets, base: Math.min(12, Draw.baseFret(frets)) };
    finder.classList.add("open");
    buildFinder();
    sfx("tap");
  }
  function closeFinder() { finder.classList.remove("open"); fs = null; show(); }
  function buildFinder() {
    var xo = $("xo"); xo.innerHTML = "";
    fs.frets.forEach(function (f, s) {
      var b = choice(f < 0 ? "x" : f === 0 ? "o" : String(f), f <= 0, function () {
        fs.frets[s] = fs.frets[s] === 0 ? -1 : 0; sfx("tick"); buildFinder();
      }, "xo");
      xo.appendChild(b);
    });
    $("fpos").textContent = t("posLabel", { n: fs.base });
    var grid = $("frets"); grid.innerHTML = "";
    for (var r = 0; r < 5; r++) for (var s = 0; s < 6; s++) (function (s, f) {
      var b = choice(String(f), fs.frets[s] === f, function () {
        fs.frets[s] = fs.frets[s] === f ? 0 : f; sfx("tick"); buildFinder();
      }, "cell");
      grid.appendChild(b);
    })(s, fs.base + r);
    var ids = Chords.identify(fs.frets), out = $("fname"), alt = $("falt");
    if (ids.length) {
      out.textContent = Chords.name(ids[0]);
      alt.textContent = ids.length > 1 ? t("also") + ids.slice(1).map(Chords.name).join(", ") : "";
    } else {
      out.textContent = t("noChord");
      var seen = {}, names = [];
      Chords.midiOf(fs.frets).forEach(function (m) { var n = Chords.NAMES[m % 12]; if (!seen[n]) { seen[n] = 1; names.push(n); } });
      alt.textContent = names.join(" ");
    }
    $("fsee").disabled = !ids.length;
  }
  function moveBase(d) {
    var b = fs.base + d;
    if (b < 1 || b > 12) { sfx("err"); return; }
    fs.base = b; sfx("tick"); buildFinder();
  }
  function seeFound() {
    var ids = Chords.identify(fs.frets);
    if (!ids.length) { sfx("err"); return; }
    var c = { root: ids[0].root, q: ids[0].q, bass: ids[0].bass }, frets = fs.frets.slice();
    var l = Chords.voicings(c);
    l = set.sort === "pos" ? Chords.byPosition(l) : l;
    var i = l.map(function (v) { return v.frets.join(","); }).indexOf(frets.join(","));
    temp = null;
    if (i < 0) {
      var fc = Chords.fingerCount(frets);
      temp = { name: Chords.name(c), v: { frets: frets, fingers: Chords.assignFingers(frets), tier: 0, rank: 0, pos: Chords.position(frets), barre: fc.barre } };
      i = 0;
    }
    sfx("ok");
    finder.classList.remove("open"); fs = null;
    set.cur = { root: c.root, q: c.q, bass: c.bass, i: i };
    remember(); store(); show();
  }
  $("fback").addEventListener("click", function () { sfx("tap"); closeFinder(); });
  $("fdown").addEventListener("click", function () { moveBase(-1); });
  $("fup").addEventListener("click", function () { moveBase(1); });
  $("fplay").addEventListener("click", function () {
    var n = Chords.midiOf(fs.frets);
    if (!n.length || !Guitar.play(n, 0.012)) sfx("err");
  });
  $("fsee").addEventListener("click", seeFound);

  /* ---------------- keys (section 7) ---------------- */
  PAD.on("press", function (k) {
    if (gl) {
      if (k === "b") { sfx("tap"); closeProgs(); }
      else if (k === "up" || k === "left") focusProg(-1);
      else if (k === "down" || k === "right") focusProg(1);
      else if (k === "a") playProg(gfocus);
      return;
    }
    if (fs) {
      if (k === "b") { sfx("tap"); closeFinder(); }
      else if (k === "a" || k === "start") seeFound();
      else if (k === "left") moveBase(-1);
      else if (k === "right") moveBase(1);
      return;
    }
    if (pick) {
      if (document.activeElement === $("q")) return;
      if (k === "b") { sfx("tap"); closePicker(); }
      else if (k === "a" || k === "start") applyPick();
      else if (k === "left" || k === "right") { pick.root = (pick.root + (k === "left" ? 11 : 1)) % 12; if (pick.bass === pick.root) pick.bass = null; sfx("tick"); buildPicker(); }
      else if (k === "up" || k === "down") {
        var n = Chords.QUALS.length, qi = Chords.QUALS.indexOf(Chords.qual(pick.q));
        pick.q = Chords.QUALS[(qi + (k === "up" ? n - 1 : 1)) % n].id; sfx("tick"); buildPicker();
      }
      return;
    }
    if (k === "left") step(-1);
    else if (k === "right") step(1);
    else if (k === "up") stepQual(-1);
    else if (k === "down") stepQual(1);
    else if (k === "a") strum(false);
    else if (k === "start") openPicker();
    else if (k === "select") toggleMap();
  });

  var resizeTimer = 0;
  window.addEventListener("resize", function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(paint, 60); });

  /* fixed words */
  $("prev").textContent = t("prev"); $("next").textContent = t("next"); $("strum").textContent = t("strum");
  $("strum").title = t("held");
  $("pback").textContent = t("back"); $("pok").textContent = t("ok"); $("qgo").textContent = t("find");
  $("q").placeholder = t("search"); $("rootH").textContent = t("root"); $("bassH").textContent = t("bass");
  $("recentH").textContent = t("recent"); $("tofind").textContent = t("byFrets"); $("volH").textContent = t("sound");
  $("sortH").textContent = t("order");
  $("prog").textContent = t("progs"); $("gback").textContent = t("back");
  $("fback").textContent = t("back");
  $("fplay").textContent = t("listen"); $("fsee").textContent = t("see");
  document.documentElement.lang = EN ? "en" : "zh";

  function begin(s) {
    adopt(s);
    Guitar.setLevel(set.vol);
    show();
    /* the first paint can come before the layout settles */
    requestAnimationFrame(paint);
  }
  PAD.load("set").then(begin, function () { begin(null); });
})();
</script>
</body>
</html>
