<script data-src="src/solver.js">
/* The solver behind 看它解 / SELECT / the tutorial: rows first, then columns, then the last 2×2 -- the way a person
   solves it, not the shortest way. Every stage is a small breadth-first search over the cells that still matter:
   the pieces this stage is placing and the gap. Pieces already home are walls, and every other piece is
   interchangeable, which keeps the search at a few thousand states (a few milliseconds on a phone) and makes the
   plan easy to explain in one line. No DOM, no PAD: tests/solver.test.mjs plays a thousand boards with it.

   Board layout: tiles[position] = piece, pieces 0 … n*n-2 are the picture, n*n-1 is the gap. */
var Solver = (function () {
  "use strict";

  /* Each stage places one or two pieces; after it they are locked and never move again. */
  function stages(n) {
    if (n === 3) return [
      [{ p: 0, at: 0 }],                                            /* row 1: 1 */
      [{ p: 1, at: 1 }, { p: 2, at: 2 }],                           /* row 1: 2 and 3 together */
      [{ p: 3, at: 3 }, { p: 6, at: 6 }],                           /* column 1: 4 and 7 together */
      [{ p: 4, at: 4 }, { p: 5, at: 5 }, { p: 7, at: 7 }],          /* the last 2×2 */
    ];
    return [
      [{ p: 0, at: 0 }], [{ p: 1, at: 1 }], [{ p: 2, at: 2 }, { p: 3, at: 3 }],
      [{ p: 4, at: 4 }], [{ p: 5, at: 5 }], [{ p: 6, at: 6 }, { p: 7, at: 7 }],
      [{ p: 8, at: 8 }, { p: 12, at: 12 }],                         /* the last two rows, column by column */
      [{ p: 9, at: 9 }, { p: 13, at: 13 }],
      [{ p: 10, at: 10 }, { p: 11, at: 11 }, { p: 14, at: 14 }],
    ];
  }

  function neighbours(n, g) {
    var r = (g / n) | 0, c = g % n, out = [];
    if (r > 0) out.push(g - n);
    if (r < n - 1) out.push(g + n);
    if (c > 0) out.push(g - 1);
    if (c < n - 1) out.push(g + 1);
    return out;
  }

  /* One stage: BFS over (positions of the pieces being placed, gap). Returns the cells to slide, in order, or null.
     `locked` holds the pieces finished in earlier stages: they are walls, which is what makes the search small.
     Merely being at home does not lock a piece -- a wall can pinch the free cells into a path where the goal is
     out of reach, so only finished stages may block (found by the thousand-board test). */
  function find(n, tiles, targets, locked) {
    var N = n * n, gapPiece = N - 1, gap = tiles.indexOf(gapPiece);
    var start = [], want = [], i, k;
    for (i = 0; i < targets.length; i++) { start.push(tiles.indexOf(targets[i].p)); want.push(targets[i].at); }

    if (start.join() === want.join()) return [];

    var wall = {};
    for (i = 0; i < (locked || []).length; i++) wall[tiles.indexOf(locked[i])] = true;

    function done(pos) {
      for (k = 0; k < want.length; k++) if (pos[k] !== want[k]) return false;
      return true;
    }

    var key0 = start.join(",") + "|" + gap;
    var prev = new Map(); prev.set(key0, null);
    var queue = [{ pos: start, gap: gap, key: key0 }];
    for (var qi = 0; qi < queue.length; qi++) {
      var cur = queue[qi], g = cur.gap, nb = neighbours(n, g);
      for (var j = 0; j < nb.length; j++) {
        var q = nb[j];
        if (wall[q]) continue;
        var pos = cur.pos.slice(), hit = -1;
        for (k = 0; k < pos.length; k++) if (pos[k] === q) { hit = k; break; }
        if (hit >= 0) pos[hit] = g;
        var key = pos.join(",") + "|" + q;
        if (prev.has(key)) continue;
        prev.set(key, [cur.key, q]);
        if (done(pos)) {
          var out = [];
          for (var s = key; prev.get(s); s = prev.get(s)[0]) out.push(prev.get(s)[1]);
          out.reverse();
          return out;
        }
        queue.push({ pos: pos, gap: q, key: key });
      }
    }
    return null;
  }

  /* the piece at q slides into the gap */
  function step(tiles, n, q) {
    var gap = tiles.indexOf(n * n - 1);
    tiles[gap] = tiles[q];
    tiles[q] = n * n - 1;
  }

  /* the whole board, as [{p, stage}] where p is the cell to slide; null if a stage cannot be planned */
  function solve(n, tiles) {
    var work = tiles.slice(), out = [], plan = stages(n), locked = [];
    for (var s = 0; s < plan.length; s++) {
      var moves = find(n, work, plan[s], locked);
      if (!moves) return null;
      for (var i = 0; i < moves.length; i++) { out.push({ p: moves[i], stage: s }); step(work, n, moves[i]); }
      for (var j = 0; j < plan[s].length; j++) locked.push(plan[s][j].p);
    }
    return out;
  }

  /* one custom goal, for a tutorial lesson: [{p: piece, at: position}], with `keep` pieces left where they are */
  function goalPlan(n, tiles, targets, keep) {
    var moves = find(n, tiles, targets, keep);
    if (!moves) return null;
    return moves.map(function (p) { return { p: p, stage: 0 }; });
  }

  return { stages: stages, solve: solve, goalPlan: goalPlan };
})();
</script>

  /* ---------- drawing: the picture, cut into cells, written with putImageData ----------

     cut line, now the shadow side). The empty slot is a hole: ink floor, lit paper lip. Shape, not colour. */
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d"), img = ctx.createImageData(W, H);
  function edges(n, size) { var e = []; for (var i = 0; i <= n; i++) e.push(Math.round(i * size / n)); return e; }
  var RECTS = {};
  function rects(n) {
    if (RECTS[n]) return RECTS[n];
    var xs = edges(n, W), ys = edges(n, H), x = [], y = [], w = [], h = [];
    for (var p = 0; p < n * n; p++) {
      var c = p % n, r = (p / n) | 0;
      x.push(xs[c]); y.push(ys[r]); w.push(xs[c + 1] - xs[c]); h.push(ys[r + 1] - ys[r]);

  function tile(out, src, R, p, t, dy) {

    for (y = 1; y < h - 1; y++) for (x = 1; x < w - 1; x++) put(out, x0 + x, y0 + y + oy, src[(sy + y) * W + sx + x], bottom);
    for (x = 1; x < w - 1; x++) { put(out, x0 + x, y0 + oy, 3, bottom); put(out, x0 + x, y0 + h - 1 + oy, 0, bottom); }
    for (y = 1; y < h - 1; y++) { put(out, x0, y0 + y + oy, 3, bottom); put(out, x0 + w - 1, y0 + y + oy, 0, bottom); }
    put(out, x0, y0 + oy, 3, bottom); put(out, x0 + w - 1, y0 + oy, 0, bottom);

    for (y = 0; y < h; y++) { out[(y0 + y) * W + x0] = 3 - out[(y0 + y) * W + x0]; out[(y0 + y) * W + x0 + w - 1] = 3 - out[(y0 + y) * W + x0 + w - 1]; }
  }

    if (MASKS[n]) return MASKS[n];

    for (x = 0; x < W; x++) { m[x] = 1; m[(H - 1) * W + x] = 1; }
    for (y = 0; y < H; y++) { m[y * W] = 1; m[y * W + W - 1] = 1; }
    for (k = 1; k < n; k++) {
      x = R.xs[k];
      for (y = 0; y < H; y++) { m[y * W + x] = 1; m[y * W + x - 1] = 1; }
      y = R.ys[k];
      for (x = 0; x < W; x++) { m[y * W + x] = 1; m[(y - 1) * W + x] = 1; }

  }
  function cutFrame() {
    var A = S.intro; if (!A) return S.pic.px;
    var n = S.n, N = n * n, R = rects(n), g = N - 1, src = S.pic.px, out = new Uint8Array(W * H), i, x, y;
    var tiled = new Uint8Array(W * H);
    for (var p = 0; p < N; p++) tile(tiled, src, R, p, p, 0);   /* every cell is a tile: no slot yet */
    for (i = 0; i < out.length; i++) out[i] = src[i];
    var cut = clamp(A.ms / 300, 0, 1), mask = edgeMask(n);
    for (i = 0; i < out.length; i++) if (mask[i] && (BAYER[((i / W | 0) % 4) * 4 + (i % W) % 4] + 0.5) / 16 <= cut) out[i] = tiled[i];
    var drop = clamp((A.ms - 300) / 300, 0, 1);
    if (drop > 0) {
      slot(out, R, g);
      var gh = R.h[g], off = Math.round((1 - (1 - drop) * (1 - drop)) * gh);
      if (off < gh) tile(out, src, R, g, g, off);

    }
    var glint = ms > MELT ? (ms - MELT) / (GLINT - MELT) * (W + H + 24) - 12 : -99;

  function attractFrame() {

  }
  function frame() {
    var sc = S.screen;

    if (sc === "cut") return cutFrame();
    var pic = sc === "preview" ? S.shot : S.pic;
    if (!pic) pic = S.pic;
    if (sc === "solved") return solvedFrame(pic.px);
    if (sc === "won") return pic.px;
    if (sc === "title" && !S.hasSave) return pic.px;
    if (sc === "title" || sc === "play" || sc === "menu" || sc === "lesson" || sc === "lost") {
      if (S.peek && (sc === "play" || sc === "lesson")) return pic.px;
      var out = new Uint8Array(W * H);
      board(out, pic.px, S.n, S.tiles);

  function paint() {

  function layout() {

  }

  /* ---------- the main menu's attract mode: the built-in pictures solve themselves, then rest a moment ---------- */
  function startAttract() {

    attractRound(S.attractIndex);
  }
  function attractRound(i) {

    S.attractIndex = (k + 1) % BUILTINS.length;

  /* ---------- watching it solve, and one hint ---------- */

    if (S.mode !== "tutorial") { S.helped = true; saveGame(); }

    var st = d.steps[d.i++];

    if (S.demo) d.timer = setTimeout(demoStep, 333);
  }
  function endDemo() {
    if (!S.demo) return;

  /* ---------- the four lessons (怎么玩) ---------- */

  function startLesson(i) {

        pic: S.pic, picKey: S.picKey, src: S.src, hasSave: S.hasSave,
        game: S.hasSave ? { tiles: S.tiles.slice(), gap: S.gap, moves: S.moves, helped: S.helped, left: S.left, arcadeTotal: S.arcadeTotal } : null
      };
    }
    var L = LESSONS[i];
    S.mode = "tutorial"; S.lesson = i; S.lessonDone = false; S.doneText = "";
    S.n = L.n; S.tiles = L.tiles.slice(); S.gap = S.tiles.indexOf(S.n * S.n - 1);
    S.moves = 0; S.helped = false; S.note = ""; S.peek = false;

  }
  function nextLesson() { if (S.lesson < LESSONS.length - 1) startLesson(S.lesson + 1); else endTutorial(); }
  function endTutorial() {
    clearTimeout(S.lessonTimer); S.lessonTimer = 0;
    if (S.demo) { clearTimeout(S.demo.timer); S.demo = null; }
    clearHint();
    var back = S.beforeTutorial; S.beforeTutorial = null;
    S.mode = "normal"; S.lessonDone = false; S.doneText = ""; S.note = ""; S.helped = false;
    if (back) {
      S.n = back.n; S.nextN = back.nextN; S.arcade = back.arcade; S.gameArcade = back.gameArcade;
      S.galleryIndex = back.galleryIndex; S.pic = back.pic; S.picKey = back.picKey; S.src = back.src; S.hasSave = back.hasSave;
      if (back.game) {

    if (!L.goal) return solvedTiles(S.tiles);
    for (i = 0; i < L.goal.length; i++) if (S.tiles[L.goal[i].at] !== L.goal[i].p) return false;

  }

  /* ---------- screens ---------- */

  function draw() {

    else if (sc === "main") msg(S.mainNote || TXT.intro, false);

  function choose() {
    var it = S.items[S.sel]; if (!it || S.busy) return;
    if (it[2]) { sfx("err"); msg(TXT.locked, true); return; }
    var id = it[0];
    if (id === "snap") { sfx("tap"); takePhoto(); }
    else if (id === "gallery") { sfx("tap"); go("gallery"); }
    else if (id === "mode") { S.arcade = !S.arcade; savePuzzle(); sfx("tick"); draw(); }
    else if (id === "howto") { sfx("tap"); startLesson(0); }
    else if (id === "cont") { sfx("tap"); continueGame(); }
    else if (id === "mainmenu") { sfx("tap"); go("main"); }
    else if (id === "resume") { sfx("tap"); go(S.menuFrom); }
    else if (id === "size") { sfx("tick"); S.nextN = S.n === 3 ? 4 : 3; S.arcade = S.gameArcade; startGame(); }
    else if (id === "watch") { sfx("tap"); go("play"); startDemo(); }
    else if (id === "use") { sfx("ok"); S.pic = S.shot; S.picKey = ""; S.src = S.previewFrom; S.note = ""; startGame(); }
    else if (id === "retake") { sfx("tap"); takePhoto(); }
    else if (id === "prev") browse(-1);
    else if (id === "nextPic") browse(1);
    else if (id === "start") { sfx("ok"); startGallery(); }
    else if (id === "next") { sfx("tap"); S.nextN = S.unlockedNow ? 4 : S.n; S.arcade = S.gameArcade; startGame(); }
    else if (id === "again") { sfx("tap"); S.nextN = S.n; S.arcade = S.gameArcade; startGame(); }
    else if (id === "quit") { sfx("tap"); endTutorial(); }
    else if (id === "nextlesson") { sfx("tap"); nextLesson(); }
    else if (id === "goon") { sfx("tap"); go("won"); }
  }

  /* Two columns, moved as a grid: left/right within a row, up/down between rows. A short last row keeps its
     column where it can. This is the rule in sdk/UI.md section 5; the old 6-item menu walked one item at a time,
     so Down looked like Right and the lower rows sat below the fold. */
  function moveSel(b) {
    var n = S.items.length; if (!n) return;
    var cols = 2, rows = Math.ceil(n / cols), row = Math.floor(S.sel / cols), col = S.sel % cols;
    if (b === "left" || b === "right" || rows < 2) {
      var len = Math.min(cols, n - row * cols);
      if (len < 2) return;
      col = (col + (b === "right" || b === "down" ? 1 : len - 1)) % len;
    } else {
      row = (row + (b === "down" ? 1 : rows - 1)) % rows;
      var len2 = Math.min(cols, n - row * cols);
      if (col >= len2) col = len2 - 1;
    }
    S.sel = row * cols + col; sfx("move"); draw();
  }

  /* ---------- keys and touch ---------- */
  if (HAS_PAD) {
    PAD.on("press", function (b) {
      if (S.busy) return;
      if (S.screen === "cut") { if (b === "a" || b === "b" || b === "start" || b === "select") skipIntro(); return; }
      if (S.demo) { stopDemo(); return; }
      var sc = S.screen, dir = b === "up" || b === "down" || b === "left" || b === "right";
      if (sc === "play" || sc === "lesson") {
        if (sc === "lesson" && S.lessonDone) {
          if (b === "a") choose();
          else if (b === "start") { S.menuFrom = "lesson"; sfx("tap"); go("menu"); }
          return;
        }
        if (dir) push(b);
        else if (b === "a") { S.peek = true; paint(); }
        else if (b === "select") hint();
        else if (b === "start") { S.menuFrom = sc; sfx("tap"); go("menu"); }
        return;
      }
      if (sc === "solved") { if (b === "a") { if (S.anim.done) choose(); else endAnim(); } return; }
      if (sc === "preview") {
        if (b === "a") { S.sel = 0; choose(); } else if (b === "b") { S.sel = 1; choose(); }
        return;
      }
      if (sc === "gallery") {
        if (b === "left") browse(-1);
        else if (b === "right") browse(1);
        else if (b === "up" || b === "down") toggleSize();
        else if (b === "a") { S.sel = 1; choose(); }
        else if (b === "b") { sfx("tap"); go("main"); }
        return;
      }
      if (sc === "main") {
        if (dir) moveSel(b);
        else if (b === "a") choose();
        else if (b === "b" && S.hasSave) { sfx("tap"); go("title"); }
        return;
      }
      if (sc === "title") {
        if (dir) moveSel(b);
        else if (b === "a") choose();
        else if (b === "b") { sfx("tap"); go("main"); }
        return;
      }
      if (sc === "menu") {
        if (dir) moveSel(b);
        else if (b === "a") choose();
        else if (b === "b") { sfx("tap"); go(S.menuFrom); }
        return;
      }
      if (sc === "won" || sc === "lost") {
        if (dir) moveSel(b);
        else if (b === "a") choose();
      }
    });
    PAD.on("release", function (b) { if (b === "a" && S.peek) { S.peek = false; paint(); } });
  }

  /* touch: tap a piece next to the gap, or swipe it towards the gap; the cut and the solved animation skip on a tap */
  function cellAt(e) {
    var r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
    var xs = edges(S.n, W), ys = edges(S.n, H), c = 0, row = 0;
    while (c < S.n - 1 && x >= xs[c + 1]) c++;
    while (row < S.n - 1 && y >= ys[row + 1]) row++;
    return row * S.n + c;
  }
  var touch = null, swallow = false, SWIPE = 12;
  cv.addEventListener("pointerdown", function (e) {
    if (S.screen === "cut") { skipIntro(); return; }
    if (S.demo) { stopDemo(); return; }
    if (S.screen !== "play" && S.screen !== "lesson") return;
    if (S.screen === "lesson" && S.lessonDone) return;
    touch = { id: e.pointerId, x: e.clientX, y: e.clientY, cell: cellAt(e) };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cv.addEventListener("pointercancel", function () { touch = null; });
  cv.addEventListener("pointerup", function (e) {
    var t = touch; touch = null;
    if (!t || t.id !== e.pointerId || (S.screen !== "play" && S.screen !== "lesson") || S.lessonDone) return;
    swallow = true;
    var dx = e.clientX - t.x, dy = e.clientY - t.y;
    if (Math.abs(dx) < SWIPE && Math.abs(dy) < SWIPE) { slide(t.cell); return; }
    var n = S.n, r = Math.floor(t.cell / n), c = t.cell % n, to;
    if (Math.abs(dx) > Math.abs(dy)) to = dx > 0 ? (c < n - 1 ? t.cell + 1 : -1) : (c > 0 ? t.cell - 1 : -1);
    else to = dy > 0 ? (r < n - 1 ? t.cell + n : -1) : (r > 0 ? t.cell - n : -1);
    if (to !== S.gap) { sfx("err"); return; }
    slide(t.cell);
  });
  cv.addEventListener("click", function () {
    if (swallow) { swallow = false; return; }
    if (S.screen === "cut") { skipIntro(); return; }
    if (S.screen === "solved") { if (S.anim.done) { S.sel = 0; choose(); } else endAnim(); }
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopClock(true);
    else if (S.screen === "play") startClock();
  });

  /* for tests/e2e.test.mjs: where the pieces are, so a test can solve the puzzle with real key presses */
  window.PUZZLE = { state: function () {
    return { screen: S.screen, n: S.n, nextN: S.nextN, tiles: S.tiles.slice(), gap: S.gap, moves: S.moves,
      fromCamera: S.src === "camera", src: S.src, picKey: S.picKey, helped: S.helped, hasSave: S.hasSave, saved: S.hasSave,
      sel: S.sel, items: S.items.map(function (it) { return it[1]; }), demo: !!S.demo, hint: !!S.hint,
      mode: S.mode, lesson: S.lesson, lessonDone: S.lessonDone, animDone: !!(S.anim && S.anim.done),
      arcade: S.arcade, gameArcade: S.gameArcade, left: S.left, arcadeTotal: S.arcadeTotal,
      best: S.best[String(S.n)] || 0, bestTime: S.bestTime[String(S.n)] || 0,
      gallery: S.galleryIndex, pictures: BUILTINS.map(picName), fuse: document.getElementById("fuse").className,
      intro: S.intro ? { phase: S.intro.ms < 300 ? "cut" : S.intro.ms < 600 ? "drop" : "mix", ms: S.intro.ms, gap: S.gap, total: S.intro.total } : null,
      attract: S.attract ? { index: S.attract.index, n: S.attract.n, phase: S.attract.phase, moves: S.attract.i, plan: S.attract.plan.length } : null };
  } };

  if (!HAS_PAD) go("main"); else draw();
})();

</script>
</body>
</html>
