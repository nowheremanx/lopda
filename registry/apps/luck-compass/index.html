<script data-src="src/luck.js">
/* LuckyWay: the almanac's arithmetic, with no DOM and no PAD calls, so Node can test it.
   The day changes at 0:00 local time, as printed almanacs do; the old 23:00 子初 rule is
   deliberately not used. MIT License. Copyright (c) 2026 Haowei Wu. */
var LUCK = (function () {
  "use strict";

  var STEMS = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
  var BRANCHES = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];

  /* Gregorian date -> Julian day number, all in integers (Fliegel-Van Flandern).
     2000-01-01 is 2451545. */
  function jdn(y, m, d) {
    var a = Math.floor((14 - m) / 12);
    var yy = y + 4800 - a;
    var mm = m + 12 * a - 3;
    return d + Math.floor((153 * mm + 2) / 5) + 365 * yy +
      Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
  }

  /* the 60-day cycle: 0 is 甲子, so 2000-01-01 (JDN 2451545) is index 54, 戊午 */
  function dayIndex(y, m, d) {
    var n = (jdn(y, m, d) + 49) % 60;
    return n < 0 ? n + 60 : n;
  }

  function pillar(y, m, d) {
    var i = dayIndex(y, m, d), s = i % 10, b = i % 12;
    return { index: i, stem: s, branch: b, name: STEMS[s] + BRANCHES[b] };
  }

  /* The five positions an old almanac lists together, in degrees:
     0 北, 45 东北, 90 东, 135 东南, 180 南, 225 西南, 270 西, 315 西北.
     Rows are stems 甲..癸; columns are 喜神, 财神, 福神, 阳贵神, 阴贵神.
     喜/财/福 match 6tail's LunarUtil.POSITION_XI/CAI/FU (default) and lunisolar;
     阳贵/阴贵 match LunarUtil.POSITION_YANG_GUI / POSITION_YIN_GUI. The other
     福神 school in circulation (not used here) puts 福神 at 甲乙东南, 丙丁正东,
     戊正北, 己正南, 庚辛西南, 壬西北, 癸正西. */
  var GODS = [
    [45, 45, 0, 225, 45],
    [315, 45, 225, 225, 0],
    [225, 225, 315, 270, 315],
    [180, 225, 135, 315, 270],
    [135, 0, 45, 45, 225],
    [45, 0, 0, 0, 225],
    [315, 90, 225, 180, 45],
    [225, 90, 315, 45, 180],
    [180, 180, 135, 90, 135],
    [135, 180, 45, 135, 90]
  ];

  function gods(stem) {
    var row = GODS[((stem % 10) + 10) % 10];
    return { xi: row[0], cai: row[1], fu: row[2], yang: row[3], yin: row[4] };
  }

  /* the 45-degree sector a heading falls in; each sector reaches 22.5 degrees each way,
     so 337.5..360 and 0..22.5 are all north. null in, null out (no compass). */
  function sector(heading) {
    if (typeof heading !== "number" || !isFinite(heading)) return null;
    var h = ((heading % 360) + 360) % 360;
    return (Math.round(h / 45) % 8) * 45;
  }

  return {
    jdn: jdn,
    dayIndex: dayIndex,
    pillar: pillar,
    gods: gods,
    sector: sector,
    STEMS: STEMS.slice(),
    BRANCHES: BRANCHES.slice()
  };
})();
</script>

    { num: 21, grade: { zh: "上", en: "Good" }, verse: { zh: ["红色的花落在石阶上", "花期不长，但有人记得拍一张照片", "把今天也保存成温柔的样子"], en: ["Red blossom on the steps", "Brief, but a photo was taken", "Keep today looking gentle"] }, meaning: { zh: "今天不必太大，能保存的温暖就够了。", en: "Today need not be grand; gentle warmth is enough." } },
    { num: 22, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["一声远处的叫卖", "像是把街道喊醒了", "你也会顺着这声音，重新落地"], en: ["A vendor calls far away", "It wakes the street up", "You land back with it"] }, meaning: { zh: "把外界的噪音当作提醒，回到真实的脚步。", en: "Let the noise remind you where your feet are." } },
    { num: 23, grade: { zh: "中", en: "Fair" }, verse: { zh: ["一片白云压在屋檐下", "你把热水壶的蒸汽看得太认真", "其实只是在提醒你慢一点"], en: ["A cloud sits under the eaves", "You study the kettle’s steam", "It only says: go gently"] }, meaning: { zh: "别把一道小事看得太重，今天还长着呢。", en: "One small thing is not the whole of today." } },
    { num: 24, grade: { zh: "上", en: "Good" }, verse: { zh: ["篮子里放了几颗葡萄", "一颗一颗都像是提醒你", "做事也可以有一点轻松的节奏"], en: ["Grapes rest in the basket", "Each one is a small reminder", "Work can keep a light rhythm"] }, meaning: { zh: "适度放松，反而让结果更稳。", en: "Ease in the middle makes the result steadier." } },
    { num: 25, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["你在门口收了一片落叶", "它还留着一点点余温", "算是今天给你的好消息"], en: ["A leaf found at the door", "It still keeps some warmth", "Today’s piece of good news"] }, meaning: { zh: "一个小小的好消息，足够支撑你过一整天。", en: "One small good sign carries you through the day." } },
    { num: 26, grade: { zh: "中", en: "Fair" }, verse: { zh: ["枯树上的鸟把铃铛挂住", "叮当声不大，却顺着风进了院子", "提醒你，别把心事吵大"], en: ["A bird hangs a bell up there", "Its chime rides on the wind", "Do not let worry get loud"] }, meaning: { zh: "小事先放一放，心会更清楚。", en: "Set the small thing down; the mind clears." } },
    { num: 27, grade: { zh: "上", en: "Good" }, verse: { zh: ["你想起一个很早的约定", "那天的地面还没晒热", "今天就按它的样子走一遍"], en: ["An old promise comes to mind", "The ground was not warm yet", "Walk today in that spirit"] }, meaning: { zh: "老约定里藏着你想保留的那份安稳。", en: "The old promise holds the steadiness you want." } },
    { num: 28, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["收音机里播着远处的歌", "声音不大，却把屋子一点点填满", "在这柔和的地方，想法都能落下"], en: ["A far song on the radio", "Soft, but it fills the room", "Here, thoughts settle down"] }, meaning: { zh: "让环境安静一点，心里就会有地方落脚。", en: "Quieter room, and the mind finds its place." } },
    { num: 29, grade: { zh: "中", en: "Fair" }, verse: { zh: ["一页日历翻过一页", "你忽然想起要把某件事放下来", "那是今天最好的安排"], en: ["A calendar page turns", "You recall you can leave it", "That is today’s best plan"] }, meaning: { zh: "不是放弃，而是让优先级先理顺。", en: "Not giving up; putting the order right first." } },
    { num: 30, grade: { zh: "上", en: "Good" }, verse: { zh: ["院里有人种了几竿青竹", "它们在风里轻轻摇", "一直盯着你，就像在提醒：别太紧"], en: ["Green bamboo in the yard", "It sways in the wind", "It says: hold it loosely"] }, meaning: { zh: "放松一点，事情总会换一种更顺的方式。", en: "Relax a little; the thing will find a smoother way." } },
    { num: 31, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["一只小狗牵着旧绳子跑过", "它看起来没想太多", "你也跟着轻一点，今天就过了"], en: ["A dog runs with an old leash", "It seems to think of nothing", "Follow it; the day goes by"] }, meaning: { zh: "别给今天提前背上太重的担子。", en: "Do not carry tomorrow’s weight before today." } },
    { num: 32, grade: { zh: "上", en: "Good" }, verse: { zh: ["门口晒着一块旧布", "它还保留着昨天的太阳", "你拿起来，就像拿到了一个好理由"], en: ["Old cloth drying by the gate", "It keeps yesterday’s sun", "Lift it; a reason to begin"] }, meaning: { zh: "把小小的顺手当作出发，日子会跟着顺。", en: "Begin with the small easy task; the day follows." } },
    { num: 33, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["街角站着一只旧邮筒", "肚子里装着许多人的话", "你也写一张，轻轻放进去"], en: ["Old mailbox on the corner", "Full of other people’s words", "Write one, drop it in"] }, meaning: { zh: "说出口之前，先写在纸上会更清楚。", en: "Write it down first; it reads clearer on paper." } },
    { num: 34, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["楼下晾着一排衣裳", "风一吹，它们就点点头", "今天的好意也这样慢慢来"], en: ["Clothes drying on a line", "One wind and they all nod", "Kindness comes the same way"] }, meaning: { zh: "好心情常常是别人顺手递过来的。", en: "A good mood is often handed over by someone." } },
    { num: 35, grade: { zh: "上", en: "Good" }, verse: { zh: ["公交车在站台停了一会儿", "上来的人都有地方站", "你的事也会等到一个位置"], en: ["The bus waits at the stop", "Everyone finds a place", "Your turn will find a place"] }, meaning: { zh: "不必抢在前面，位置总会空出来。", en: "No need to push; a place opens in time." } },
    { num: 36, grade: { zh: "上", en: "Good" }, verse: { zh: ["菜市场的水声还没停", "有人挑葱，有人挑鱼", "你只管挑今天想吃的"], en: ["The market still sounds wet", "Some pick greens, some fish", "Pick what you want to eat"] }, meaning: { zh: "把选择缩小到一顿饭，就轻松了。", en: "Narrow the choice to one meal and it lightens." } },
    { num: 37, grade: { zh: "上", en: "Good" }, verse: { zh: ["巷口支着修鞋的小摊", "师傅把旧鞋翻过来又缝上", "有些东西值得再修一次"], en: ["A cobbler by the lane", "He turns the shoe and sews", "Some things deserve mending"] }, meaning: { zh: "旧的不一定要换掉，缝一缝还能走。", en: "Not everything old needs replacing; a stitch may do." } },
    { num: 38, grade: { zh: "中", en: "Fair" }, verse: { zh: ["老槐树把影子放在路上", "路过的人都在里面歇一脚", "你也可以借一点阴凉"], en: ["The old tree lays down shade", "People rest a step inside", "Borrow a little cool too"] }, meaning: { zh: "接受别人的好意，不会欠下什么。", en: "Taking a kindness does not put you in debt." } },
    { num: 39, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["一只蚂蚁搬着面包屑", "走走停停，却不丢下", "小事也能搬成大事"], en: ["An ant carries a crumb", "Stops, starts, never drops", "Small work grows big in time"] }, meaning: { zh: "慢一点没关系，方向对就行。", en: "Slow is fine, as long as the way is right." } },
    { num: 40, grade: { zh: "上", en: "Good" }, verse: { zh: ["热水瓶在桌角放了很久", "倒出来还是温的", "有些耐心会一直留着"], en: ["An old thermos on the shelf", "What pours out is still warm", "Some patience keeps its heat"] }, meaning: { zh: "早先的准备，会在今天替你暖手。", en: "An early kindness will warm your hands today." } },
    { num: 41, grade: { zh: "中", en: "Fair" }, verse: { zh: ["墙上的旧钟慢了两分钟", "你也跟着慢了半拍", "原来晚一点也没什么"], en: ["The clock runs a bit slow", "You slow half a beat with it", "A little late is still fine"] }, meaning: { zh: "时间没有你想的那么紧。", en: "Time is not as tight as you think." } },
    { num: 42, grade: { zh: "上", en: "Good" }, verse: { zh: ["自行车铃在巷子里响", "前面的人往边上让了让", "一句轻响就够开路"], en: ["A bicycle bell in the lane", "Someone steps aside for it", "One light ring opens the way"] }, meaning: { zh: "客气一点，路就会宽一点。", en: "A little courtesy widens the road." } },
    { num: 43, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["雨后的水洼装着整片天", "你绕着走，又回头看了一眼", "小地方也能藏住大风景"], en: ["A puddle holds the whole sky", "You walk round and look back", "Small things keep big views"] }, meaning: { zh: "不必走远，抬头就在眼前。", en: "No need to go far; it is right here." } },
    { num: 44, grade: { zh: "中", en: "Fair" }, verse: { zh: ["台灯照亮半张桌子", "另一半还留在暗处", "今天先看清这一半就好"], en: ["A lamp lights half the desk", "The other half stays dark", "See this half clearly first"] }, meaning: { zh: "不用一次照见所有事。", en: "You do not have to see everything at once." } },
    { num: 45, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["猫在窗台上伸了个懒腰", "它把太阳挪了挪位置", "你也可以换个姿势待着"], en: ["A cat stretches on the sill", "It moves the sun a bit", "You can rest another way"] }, meaning: { zh: "换个姿势，累的地方就松了。", en: "Shift your position and the tired part loosens." } },
    { num: 46, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["有人坐在门口穿针", "线头试了几次才过去", "耐心就是这样练出来的"], en: ["Someone threads a needle", "It goes in on the third try", "Patience is made like this"] }, meaning: { zh: "再来一次，往往就成了。", en: "One more try is usually the one that works." } },
    { num: 47, grade: { zh: "上", en: "Good" }, verse: { zh: ["磨刀人的吆喝从巷尾传来", "刀在石上来回走了几趟", "钝的东西也能重新快起来"], en: ["A grinder calls in the lane", "The blade goes to and fro", "Dull things sharpen again"] }, meaning: { zh: "歇一歇，不是生锈。", en: "Resting is not the same as rusting." } },
    { num: 48, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["豆浆摊的蒸汽升得很直", "老板问你要甜的还是咸的", "今天可以先问问自己"], en: ["Steam rises straight up", "Sweet or savoury, he asks", "Ask yourself the same first"] }, meaning: { zh: "先听自己的口味，再回答别人。", en: "Hear your own taste before you answer." } },
    { num: 49, grade: { zh: "中", en: "Fair" }, verse: { zh: ["雨把几个人赶进同一个站台", "谁也没说话，谁也没走", "等一等，天就会松口"], en: ["Rain pushes us under a roof", "Nobody speaks, nobody leaves", "Wait, and the sky gives way"] }, meaning: { zh: "一些难处，只要一起等一会儿。", en: "Some troubles only need waiting out together." } },
    { num: 50, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["布门帘被风掀起来", "屋里的味道跑出去一点", "进门前先把手上的事放下"], en: ["A cloth door curtain lifts", "The smell of home slips out", "Leave your work at the door"] }, meaning: { zh: "回家的时候，把外面的声音留在门外。", en: "At home, leave the outside noise outside." } },
    { num: 51, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["抽屉里翻出一张旧照片", "照片里的人也在看你", "你笑了，今天就有了靠山"], en: ["An old photo in the drawer", "The people in it look back", "A smile makes today stand"] }, meaning: { zh: "你走过的路，会在需要时扶你一把。", en: "The road behind you holds you up when needed." } },
    { num: 52, grade: { zh: "中", en: "Fair" }, verse: { zh: ["一锅粥在小火上咕嘟", "急不得，也不能走开", "有些事只需要看着它"], en: ["Porridge murmurs on low heat", "No hurrying, no walking off", "Some things just need a look"] }, meaning: { zh: "守着它，比催它更有用。", en: "Watching it does more than rushing it." } },
    { num: 53, grade: { zh: "上", en: "Good" }, verse: { zh: ["铅笔用到只剩一小截", "写出来的字还是清清楚楚", "短一点也能把话说完"], en: ["A pencil worn to a stub", "The words still come clear", "Short is enough to say it"] }, meaning: { zh: "手边剩下的，常常已经够用。", en: "What is left in reach is often enough." } },
    { num: 54, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["池塘的荷叶托着一颗水珠", "风一过，水珠滚来滚去", "最后还是稳稳落回去"], en: ["A leaf holds one water drop", "Wind rolls it to and fro", "It settles, steady again"] }, meaning: { zh: "晃一晃没关系，稳住就好。", en: "A wobble is fine; steady is what matters." } },
    { num: 55, grade: { zh: "上", en: "Good" }, verse: { zh: ["隔壁有人在练琴", "同一个地方错了两遍", "第三遍就顺了"], en: ["Someone practises next door", "The same bar slips twice", "The third try comes right"] }, meaning: { zh: "错的次数，也算在进步里。", en: "The wrong tries count as progress too." } },
    { num: 56, grade: { zh: "上", en: "Good" }, verse: { zh: ["楼梯的灯是声控的", "你咳一声，它就亮了", "有些回应要你先开口"], en: ["The stair light hears you", "You cough once and it glows", "Some answers need your voice"] }, meaning: { zh: "先出声，别等灯自己亮。", en: "Speak up; do not wait for the light." } },
    { num: 57, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["柚子剥开，香气先出来", "一瓣一瓣分给旁边的人", "今天的好运也是分着来的"], en: ["A pomelo opens, scent first", "Share the segments around", "Today’s luck divides too"] }, meaning: { zh: "分出去的那一份，最后会回来。", en: "The share you give out comes back." } },
    { num: 58, grade: { zh: "中", en: "Fair" }, verse: { zh: ["凉席铺在窗下的地板", "躺下去，背先凉了一下", "热的事也能慢慢变轻"], en: ["A mat by the window", "Lie down; your back cools", "Hot things grow light too"] }, meaning: { zh: "先让身体降下来，心才会跟上。", en: "Cool the body first; the mind follows." } },
    { num: 59, grade: { zh: "上", en: "Good" }, verse: { zh: ["巷子里的风比外面凉", "它拐了两个弯才到你这里", "绕远的路也算到了"], en: ["The lane’s wind is cooler", "It came by two corners", "The long way still arrives"] }, meaning: { zh: "来得晚一点，不等于没来。", en: "Arriving late is not the same as never." } },
    { num: 60, grade: { zh: "中", en: "Fair" }, verse: { zh: ["早市的豆腐还冒着热气", "摊主切得方方正正", "你也把今天切成小块"], en: ["Tofu steams at the stall", "The seller cuts it square", "Cut today into small pieces"] }, meaning: { zh: "大事切小了，就好办了。", en: "Cut the big thing small and it is doable." } },
    { num: 61, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["修表铺的灯很亮", "放大镜下的齿轮慢慢转", "细小的东西也值得认真"], en: ["The watch shop’s lamp burns", "Gears turn under a lens", "Small things deserve care"] }, meaning: { zh: "把细节照顾到，结果自然准。", en: "Tend the details and the result comes true." } },
    { num: 62, grade: { zh: "上", en: "Good" }, verse: { zh: ["挂历上的红字圈着某天", "那天还没到，也不远了", "先替它留出一点空"], en: ["A red circle on the calendar", "That day is not far off", "Leave a little room for it"] }, meaning: { zh: "给将来的事留一点位置。", en: "Make a little space for what is coming." } },
    { num: 63, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["竹椅在院里吱呀作响", "坐下去，它先让了让", "老东西总有它的脾气"], en: ["A bamboo chair creaks", "Sit, and it gives a little", "Old things have their temper"] }, meaning: { zh: "顺着它的性子，反而坐得久。", en: "Go with its grain and you sit longer." } },
    { num: 64, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["下雨时有人把伞递过来", "你只说了句改天还", "这一天就不算白过"], en: ["A hand offers an umbrella", "You only say you will return", "The day was not wasted"] }, meaning: { zh: "被记得的感觉，比伞更挡雨。", en: "Being remembered shelters you more than the umbrella." } },
    { num: 65, grade: { zh: "上", en: "Good" }, verse: { zh: ["雨停了，泥土的味道浮上来", "你站在门口深吸一口", "心里的尘土也落了一落"], en: ["Rain stops; wet earth rises", "You breathe deep at the door", "The dust inside settles too"] }, meaning: { zh: "让鼻子先安静下来。", en: "Let the nose quiet down first." } },
    { num: 66, grade: { zh: "中", en: "Fair" }, verse: { zh: ["玻璃罐里还剩几颗糖", "你挑了一颗最不显眼的", "甜味还是照旧"], en: ["A few sweets left in the jar", "You pick the plainest one", "It tastes just as sweet"] }, meaning: { zh: "不用挑最好的，也不会差。", en: "You need not pick the best; it will do." } },
    { num: 67, grade: { zh: "上", en: "Good" }, verse: { zh: ["火柴划了两下才着", "小小的火苗站得笔直", "有些开头就是要试两次"], en: ["The match catches on try two", "A small flame stands still", "Some starts need two tries"] }, meaning: { zh: "第一下没成，不算失败。", en: "The first try failing is not a failure." } },
    { num: 68, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["远处有火车经过", "声音从窗户缝里进来", "你忽然想起自己也能远行"], en: ["A train passes far away", "Sound slips in at the window", "You remember: you can travel"] }, meaning: { zh: "想去的地方，先记在心里。", en: "Keep the place you want to go in mind." } },
    { num: 69, grade: { zh: "中", en: "Fair" }, verse: { zh: ["井水打上来，桶壁挂着凉", "你先洗了把脸", "脑子里的热也退了"], en: ["Well water, the bucket cold", "You wash your face first", "The heat in your head cools"] }, meaning: { zh: "先降温，再想事。", en: "Cool down before thinking it through." } },
    { num: 70, grade: { zh: "上上", en: "Excellent" }, verse: { zh: ["蒲扇在手里慢慢摇", "风不大，却打发了整个黄昏", "慢的东西有慢的好处"], en: ["A palm fan waves slowly", "A breeze spends the dusk", "Slow things have their worth"] }, meaning: { zh: "不用快，时间也会过去。", en: "It need not be fast; time passes anyway." } },
    { num: 71, grade: { zh: "上", en: "Good" }, verse: { zh: ["米缸见了底，还剩一层", "够煮今天这一顿", "明天的事明天再买"], en: ["The rice jar runs low", "Enough to cook for today", "Buy tomorrow’s rice tomorrow"] }, meaning: { zh: "今天够用，就先安心。", en: "Enough for today is enough for now." } },
    { num: 72, grade: { zh: "上", en: "Good" }, verse: { zh: ["窗花贴歪了一点点", "太阳照过来，影子也是歪的", "歪着的花样也挺好看"], en: ["The window paper is crooked", "The sunlight slants with it", "The crooked pattern is fine"] }, meaning: { zh: "不必样样对齐，日子照样过。", en: "Not everything must line up; the day goes on." } },
    { num: 73, grade: { zh: "中", en: "Fair" }, verse: { zh: ["旧毛衣的袖口松了", "你把它往上卷了一卷", "旧东西也有旧东西的合身"], en: ["An old cuff has come loose", "You roll it up once", "Old things fit in old ways"] }, meaning: { zh: "不合适的时候，先改一改。", en: "When it does not fit, adjust it first." } },
    { num: 74, grade: { zh: "上", en: "Good" }, verse: { zh: ["几只麻雀停在电线上", "谁也不挤谁", "一排小点，安安稳稳"], en: ["Sparrows sit on the wire", "None of them crowds another", "A row of small, calm dots"] }, meaning: { zh: "各站各的位置，也很好。", en: "Each in its own place is good too." } },
    { num: 75, grade: { zh: "上", en: "Good" }, verse: { zh: ["木匠刨下的花卷成一团", "木头露出了新的颜色", "去掉一层，才看得清"], en: ["Wood shavings curl in piles", "The wood shows a new colour", "Take a layer off to see"] }, meaning: { zh: "有些答案，要先去掉一点。", en: "Some answers need a layer removed." } },

  function getDayList(monthGanZhi, dayGanZhi, ji) {
    var l = [];
    var dayIndex = jiaZiIndex(dayGanZhi);
    var month = hex(jiaZiIndex(monthGanZhi));
    var day = hex(dayIndex);
    var right = DAY_YI_JI;
    var index = right.indexOf(day + "=");
    while (index > -1) {
      right = right.substring(index + 3);
      var left = right;
      if (left.indexOf("=") > -1) left = left.substring(0, left.indexOf("=") - 2);
      var months = left.substring(0, left.indexOf(":")), matched = false, i, j;
      for (i = 0, j = months.length; i < j; i += 2) if (months.substring(i, i + 2) === month) { matched = true; break; }

        for (i = 0, j = values.length; i < j; i += 2) l.push(YI_JI[parseInt(values.substring(i, i + 2), 16)]);

      index = right.indexOf(day + "=");

    var god = GODS[mod(dayBranch - dragonStart, 12)];
    var opposite = mod(dayBranch + 6, 12), chongPillar = name(mod(p.day - 6, 60));
    var shaIndex = dayBranch % 4;
    var monthName = name(p.month), dayName = name(p.day);
    var peng = [PENGZU_GAN[p.day % 10], PENGZU_ZHI[dayBranch]];

    ["泰",0,7,"小往大来，吉亨。","天地交，泰；后以财成天地之道，辅相天地之宜，以左右民。","Heaven and earth meet: peace; share what you have."],

    ["同人",2,0,"同人于野，亨。利涉大川，利君子贞。","天与火，同人；君子以类族辨物。","Fire joins heaven; seek common purpose in the open."],
    ["大有",0,2,"元亨。","火在天上，大有；君子以遏恶扬善，顺天休命。","Fire shines in heaven; use abundance for what is good."],
    ["谦",6,7,"亨，君子有终。","地中有山，谦；君子以裒多益寡，称物平施。","A mountain lies within earth; make room for others."],
    ["豫",7,3,"利建侯行师。","雷出地奋，豫。先王以作乐崇德，殷荐之上帝，以配祖考。","Thunder rises from earth; prepare together with joyful purpose."],
    ["随",3,1,"元亨。利贞。无咎。","泽中有雷，随；君子以向晦入宴息。","Thunder rests in the lake; know when to follow and rest."],
    ["蛊",4,6,"元亨。利涉大川。先甲三日，后甲三日。","山下有风，蛊；君子以振民育德。","Wind below the mountain stirs decay; repair what was neglected."],
    ["临",1,7,"元亨。利贞。至于八月有凶。","泽上有地，临；君子以教思无穷，容保民无疆。","Earth overlooks the lake; guide with care, not force."],
    ["观",7,4,"盥而不荐，有孚颙若。","风行地上，观；先王以省方，观民设教。","Wind moves over earth; observe before offering guidance."],
    ["噬嗑",3,2,"亨。利用狱。","雷电噬嗑；先王以明罚敕法。","Thunder and lightning bite through; make fair, clear decisions."],
    ["贲",2,6,"亨。小利有攸往。","山下有火，贲；君子以明庶政，无敢折狱。","Fire below a mountain lends beauty; let substance lead."],
    ["剥",7,6,"不利有攸往。","山附地上，剥；上以厚下，安宅。","The mountain rests on earth; protect the foundations."],
    ["复",3,7,"亨。出入无疾，朋来无咎。反复其道，七日来复，利有攸往。","雷在地中，复；先王以至日闭关，商旅不行，后不省方。","Thunder returns beneath earth; a fresh beginning comes in time."],
    ["无妄",3,0,"元亨。利贞。其匪正有眚，不利有攸往。","天下雷行，物与无妄；先王以茂对时，育万物。","Thunder travels under heaven; act sincerely, without pretense."],
    ["大畜",0,6,"利贞，不家食吉，利涉大川。","天在山中，大畜；君子以多识前言往行，以畜其德。","Heaven is held within the mountain; cultivate what endures."],
    ["颐",3,6,"贞吉。观颐，自求口实。","山下有雷，颐；君子以慎言语，节饮食。","Thunder below a mountain; be mindful of words and nourishment."],
    ["大过",4,1,"栋桡，利有攸往，亨。","泽灭木，大过。君子以独立不惧，遁世无闷。","The lake overwhelms trees; stand firm through an unusual strain."],
    ["坎",5,5,"有孚，维心亨。行有尚。","水洊至，习坎；君子以常德行，习教事。","Water flows through danger; keep faith and move steadily."],
    ["离",2,2,"利贞。亨。畜牝牛，吉。","明两作离，大人以继明照于四方。","Brightness follows brightness; sustain clarity and care."],
    ["咸",6,1,"亨。利贞。取女吉。","山上有泽，咸；君子以虚受人。","Lake rests on mountain; openness allows mutual influence."],
    ["恒",4,3,"亨，无咎。利贞，利有攸往。","雷风，恒；君子以立不易方。","Thunder and wind endure; keep a steady course."],
    ["遁",6,0,"亨。小利贞。","天下有山，遁；君子以远小人，不恶而严。","A mountain stands beneath heaven; withdraw without rancor."],
    ["大壮",0,3,"利贞。","雷在天上，大壮；君子以非礼弗履。","Thunder sounds in heaven; strength needs restraint."],
    ["晋",7,2,"康侯用锡马蕃庶，昼日三接。","明出地上，晋；君子以自昭明德。","The sun rises over earth; make your good work visible."],
    ["明夷",2,7,"利艰贞。","明入地中，明夷；君子以莅众，用晦而明。","Light enters earth; protect your inner clarity in hard times."],
    ["家人",2,4,"利女贞。","风自火出，家人；君子以言有物，而行有恒。","Wind rises from fire; let words be honest and actions steady."],

    ["蹇",6,5,"利西南，不利东北；利见大人，贞吉。","山上有水，蹇；君子以反身修德。","Water on a mountain blocks the way; reflect and seek help."],
    ["解",5,3,"利西南，无所往，其来复吉。有攸往，夙吉。","雷雨作，解；君子以赦过宥罪。","Thunder and rain release tension; forgive and move on."],
    ["损",1,6,"有孚，元吉。无咎，可贞，利有攸往。曷之用？二簋可用享。","山下有泽，损；君子以惩忿窒欲。","Lake below mountain; set aside excess and simplify."],
    ["益",3,4,"利有攸往。利涉大川。","风雷，益；君子以见善则迁，有过则改。","Wind and thunder increase; learn from good and correct mistakes."],
    ["夬",0,1,"扬于王庭，孚号，有厉，告自邑，不利即戎，利有攸往。","泽上于天，夬；君子以施禄及下，居德则忌。","The lake rises to heaven; speak plainly and act fairly."],
    ["姤",4,0,"女壮，勿用取女。","天下有风，姤；后以施命诰四方。","Wind meets heaven; notice a meeting's force before committing."],
    ["萃",7,1,"王假有庙，利见大人，亨。利贞。用大牲吉，利有攸往。","泽上于地，萃；君子以除戎器，戒不虞。","The lake gathers on earth; come together and prepare well."],
    ["升",4,7,"元亨，用见大人，勿恤，南征吉。","地中生木，升；君子以顺德，积小以高大。","A tree grows within earth; rise through small steady steps."],
    ["困",5,1,"亨，贞大人吉，无咎，有言不信。","泽无水，困；君子以致命遂志。","The lake is dry; preserve purpose when resources are scarce."],
    ["井",4,5,"改邑不改井，无丧无得，往来井井。汔至亦未繘井。羸其瓶，凶。","木上有水，井；君子以劳民劝相。","Water in a well is shared; tend the source for everyone."],
    ["革",2,1,"已日乃孚，元亨。利贞。悔亡。","泽中有火，革；君子以治历明时。","Fire in the lake marks change; make reforms at the right time."],
    ["鼎",4,2,"元吉，亨。","木上有火，鼎；君子以正位凝命。","Fire cooks in a vessel; give good things a sound place."],
    ["震",3,3,"亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。","洊雷，震；君子以恐惧修省。","Thunder follows thunder; meet surprise with alert composure."],
    ["艮",6,6,"艮其背，不获其身，行其庭，不见其人，无咎。","兼山，艮；君子以思不出其位。","Mountains stand together; know where to pause."],
    ["渐",6,4,"女归吉，利贞。","山上有木，渐；君子以居贤德，善俗。","A tree grows on a mountain; let progress be gradual."],
    ["归妹",1,3,"征凶，无攸利。","泽上有雷，归妹；君子以永终知敝。","Thunder over the lake; consider the long course before joining."],
    ["丰",2,3,"亨。王假之，勿忧，宜日中。","雷电皆至，丰；君子以折狱致刑。","Thunder and lightning are full; use bright moments wisely."],
    ["旅",6,2,"小亨，旅贞吉。","山上有火，旅；君子以明慎用刑，而不留狱。","Fire on a mountain travels; be modest and careful away from home."],
    ["巽",4,4,"小亨。利有攸往。利见大人。","随风，巽；君子以申命行事。","Wind follows wind; gentle persistence carries a clear message."],
    ["兑",1,1,"亨。利贞。","丽泽，兑；君子以朋友讲习。","Lakes join; share learning and delight with friends."],
    ["涣",5,4,"亨，王假有庙，利涉大川，利贞。","风行水上，涣；先王以享于帝立庙。","Wind moves over water; let scattered things find a center."],
    ["节",1,5,"亨。苦节不可贞。","泽上有水，节；君子以制数度，议德行。","Water fills the lake; choose measures that are not severe."],
    ["中孚",1,4,"豚鱼吉，利涉大川，利贞。","泽上有风，中孚；君子以议狱缓死。","Wind moves over the lake; trust grows through sincerity."],
    ["小过",6,3,"亨。利贞。可小事，不可大事。飞鸟遗之音，不宜上宜下，大吉。","山上有雷，小过；君子以行过乎恭，丧过乎哀，用过乎俭。","Thunder on a mountain; attend to small matters, stay humble."],
    ["既济",2,5,"亨小。利贞。初吉终乱。","水在火上，既济；君子以思患而豫防之。","Water and fire are balanced; tend to details after success."],

  ];

  { yao: [["初九", "潜龙勿用。"], ["九二", "见龙在田，利见大人。"], ["九三", "君子终日乾乾，夕惕若；厉，无咎。"], ["九四", "或跃在渊，无咎。"], ["九五", "飞龙在天，利见大人。"], ["上九", "亢龙，有悔。"], ["用九", "见群龙无首，吉。"]],

  { yao: [["初六", "履霜，坚冰至。"], ["六二", "直方大，不习无不利。"], ["六三", "含章，可贞。或从王事，无成有终。"], ["六四", "括囊，无咎无誉。"], ["六五", "黄裳，元吉。"], ["上六", "龙战于野，其血玄黄。"], ["用六", "利永贞。"]],
    tuan: "至哉坤元，万物资生，乃顺承天。坤厚载物，德合无疆；含弘光大，品物咸亨。牝马地类，行地无疆，柔顺利贞。君子攸行，先迷失道，后顺得常。西南得朋，乃与类行，东北丧朋，乃终有庆。安贞之吉，应地无疆。",
    small: ["履霜坚冰，阴始凝也。驯致其道，至坚冰也。", "六二之动，直以方也。不习无不利，地道光也。", "含章可贞，以时发也。或从王事，知光大也。", "括囊无咎，慎不害也。", "黄裳元吉，文在中也。", "龙战于野，其道穷也。", "用六永贞，以大终也。"] },
  { yao: [["初九", "磐桓，利居贞，利建侯。"], ["六二", "屯如邅如，乘马班如，匪寇婚媾，女子贞不字，十年乃字。"], ["六三", "即鹿无虞，惟入于林中，君子几不如舍，往吝。"], ["六四", "乘马班如，求婚媾，往，吉无不利。"], ["九五", "屯其膏；小贞吉，大贞凶。"], ["上六", "乘马班如，泣血涟如。"]],
    tuan: "屯，刚柔始交而难生，动乎险中，大亨贞。雷雨之动满盈，天造草昧，宜建侯而不宁。",
    small: ["虽磐桓，志行正也。以贵下贱，大得民也。", "六二之难，乘刚也。十年乃字，反常也。", "即鹿无虞，以从禽也。君子舍之，往吝穷也。", "求而往，明也。", "屯其膏，施未光也。", "泣血涟如，何可长也。"] },
  { yao: [["初六", "发蒙，利用刑人，用说桎梏，以往吝。"], ["九二", "包蒙吉，纳妇吉，子克家。"], ["六三", "勿用取女，见金夫，不有躬，无攸利。"], ["六四", "困蒙，吝。"], ["六五", "童蒙，吉。"], ["上九", "击蒙，不利为寇，利御寇。"]],
    tuan: "蒙，山下有险，险而止，蒙。蒙亨，以亨行，时中也。匪我求童蒙，童蒙求我，志应也。初筮告，以刚中也。再三渎，渎则不告，渎蒙也。蒙以养正，圣功也。",

  { yao: [["初九", "需于郊，利用恒，无咎。"], ["九二", "需于沙，小有言，终吉。"], ["九三", "需于泥，致寇至。"], ["六四", "需于血，出自穴。"], ["九五", "需于酒食，贞吉。"], ["上六", "入于穴，有不速之客三人来，敬之终吉。"]],

  { yao: [["初六", "师出以律，否臧，凶。"], ["九二", "在师中吉，无咎；王三锡命。"], ["六三", "师或舆尸，凶。"], ["六四", "师左次，无咎。"], ["六五", "田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。"], ["上六", "大君有命，开国承家，小人勿用。"]],

  { yao: [["初六", "有孚，比之，无咎。有孚盈缶，终来有它，吉。"], ["六二", "比之自内，贞吉。"], ["六三", "比之匪人。"], ["六四", "外比之，贞吉。"], ["九五", "显比。王用三驱，失前禽，邑人不诫，吉。"], ["上六", "比之无首，凶。"]],

    small: ["比之初六，有它吉也。", "比之自内，不自失也。", "比之匪人，不亦伤乎！", "外比于贤，以从上也。", "显比之吉，位正中也。舍逆取顺，失前禽也。邑人不诫，上使中也。", "比之无首，无所终也。"] },
  { yao: [["初九", "复自道，何其咎，吉。"], ["九二", "牵复，吉。"], ["九三", "车说輹，夫妻反目。"], ["六四", "有孚，血去惕出，无咎。"], ["九五", "有孚挛如，富以其邻。"], ["上九", "既雨既处，尚得载，妇贞厉，月几望，君子征凶。"]],
    tuan: "小畜，柔得位而上下应之，曰小畜。健而巽，刚中而志行，乃亨。密云不雨，尚往也。自我西郊，施未行也。",
    small: ["复自道，其义吉也。", "牵复在中，亦不自失也。", "夫妻反目，不能正室也。", "有孚。惕出。上合志也。", "有孚挛如，不独富也。", "既雨既处，德积载也。君子征凶，有所疑也。"] },
  { yao: [["初九", "素履，往无咎。"], ["九二", "履道坦坦，幽人贞吉。"], ["六三", "眇能视，跛能履，履虎尾，咥人，凶。武人为于大君。"], ["九四", "履虎尾，愬愬终吉。"], ["九五", "夬履，贞厉。"], ["上九", "视履考详，其旋元吉。"]],
    tuan: "履，柔履刚也。说而应乎干，是以履虎尾，不咥人，亨，利贞。刚中正，履帝位而不疚，光明也。",
    small: ["素履之往，独行愿也。", "幽人贞吉，中不自乱也。", "眇能视，不足以有明也。跛能履，不足以与行也。咥人之凶，位不当也。武人为于大君，志刚也。", "愬愬终吉，志行也。", "夬履贞厉，位正当也。", "元吉在上，大有庆也。"] },
  { yao: [["初九", "拔茅茹以其汇，征吉。"], ["九二", "包荒。用冯河，不遐遗；朋亡。得尚于中行。"], ["九三", "无平不陂，无往不复，艰贞无咎。勿恤其孚，于食有福。"], ["六四", "翩翩，不富以其邻；不戒以孚。"], ["六五", "帝乙归妹，以祉，元吉。"], ["上六", "城复于隍，勿用师，自邑告命，贞吝。"]],
    tuan: "泰，小往大来，吉亨。则是天地交而万物通也，上下交而其志同也。内阳而外阴，内健而外顺，内君子而外小人，君子道长，小人道消也。",
    small: ["拔茅征吉，志在外也。", "包荒，得尚于中行，以光大也。", "无往不复，天地际也。", "翩翩不富，皆失实也。不戒以孚，中心愿也。", "以祉，元吉。中以行愿也。", "城复于隍，其命乱也。"] },
  { yao: [["初六", "拔茅茹以其汇，贞吉。亨。"], ["六二", "包承，小人吉，大人否。亨。"], ["六三", "包羞。"], ["九四", "有命，无咎，畴离祉。"], ["九五", "休否，大人吉。其亡其亡，系于包桑。"], ["上九", "倾否，先否后喜。"]],
    tuan: "否之匪人，不利君子贞，大往小来。则是天地不交而万物不通也，上下不交而天下无邦也。内阴而外阳，内柔而外刚，内小人而外君子，小人道长，君子道消也。",
    small: ["拔茅贞吉，志在君也。", "大人否，亨。不乱群也。", "包羞，位不当也。", "有命无咎，志行也。", "大人之吉，位正当也。", "否终则倾，何可长也。"] },
  { yao: [["初九", "同人于门，无咎。"], ["六二", "同人于宗，吝。"], ["九三", "伏戎于莽，升其高陵，三岁不兴。"], ["九四", "乘其庸，弗克攻，吉。"], ["九五", "同人，先号啕而后笑。大师克相遇。"], ["上九", "同人于郊，无悔。"]],
    tuan: "同人，柔得位得中，而应乎干，曰同人。同人曰，同人于野，亨。利涉大川，乾行也。文明以健，中正而应，君子正也。唯君子为能通天下之志。",
    small: ["出门同人，又谁咎也。", "同人于宗，吝道也。", "伏戎于莽，敌刚也。三岁不兴，安行也。", "乘其庸，义弗克也，其吉，则困而反则也。", "同人之先，以中直也。大师相遇，言相克也。", "同人于郊，志未得也。"] },
  { yao: [["初九", "无交害，匪咎，艰则无咎。"], ["九二", "大轝以载，有攸往，无咎。"], ["九三", "公用亨于天子，小人弗克。"], ["九四", "匪其尫，无咎。"], ["六五", "厥孚交如，威如；吉。"], ["上九", "自天佑之，吉无不利。"]],
    tuan: "大有，柔得尊位，大中而上下应之，曰大有。其德刚健而文明，应乎天而时行，是以元亨。",
    small: ["大有初九，无交害也。", "大轝以载，积中不败也。", "公用亨于天子，小人害也。", "匪其彭，无咎；明辨晰也。", "厥孚交如，信以发志也。威如之吉，易而无备也。", "大有上吉，自天佑也。"] },
  { yao: [["初六", "谦谦君子，用涉大川，吉。"], ["六二", "鸣谦，贞吉。"], ["九三", "劳谦君子，有终吉。"], ["六四", "无不利，㧑谦。"], ["六五", "不富，以其邻，利用侵伐，无不利。"], ["上六", "鸣谦，利用行师，征邑国。"]],
    tuan: "谦，亨，天道下济而光明，地道卑而上行。天道亏盈而益谦，地道变盈而流谦，鬼神害盈而福谦，人道恶盈而好谦。谦尊而光，卑而不可逾，君子之终也。",
    small: ["谦谦君子，卑以自牧也。", "鸣谦贞吉，中心得也。", "劳谦君子，万民服也。", "无不利㧑谦；不违则也。", "利用侵伐，征不服也。", "鸣谦，志未得也。可用行师，征邑国也。"] },
  { yao: [["初六", "鸣豫，凶。"], ["六二", "介于石，不终日，贞吉。"], ["六三", "盱豫，悔。迟有悔。"], ["九四", "由豫，大有得。勿疑。朋盍戠。"], ["六五", "贞疾，恒不死。"], ["上六", "冥豫，成有渝，无咎。"]],
    tuan: "豫，刚应而志行，顺以动，豫。豫，顺以动，故天地如之，而况建侯行师乎？天地以顺动，故日月不过，而四时不忒；圣人以顺动，则刑罚清而民服。豫之时义大矣哉！",
    small: ["初六鸣豫，志穷凶也。", "不终日，贞吉；以中正也。", "盱豫有悔，位不当也。", "由豫，大有得；志大行也。", "六五贞疾，乘刚也。恒不死，中未亡也。", "冥豫在上，何可长也。"] },
  { yao: [["初九", "官有渝，贞吉。出门交有功。"], ["六二", "系小子，失丈夫。"], ["六三", "系丈夫，失小子。随，有求得利，居贞。"], ["九四", "随有获，贞凶。有孚在道，以明，何咎。"], ["九五", "孚于嘉，吉。"], ["上六", "拘系之，乃从维之。王用亨于西山。"]],
    tuan: "随，刚来而下柔，动而说，随。大亨贞，无咎，而天下随时，随时之义大矣哉！",
    small: ["官有渝，从正吉也。出门交有功，不失也。", "系小子，弗兼与也。", "系丈夫，志舍下也。", "随有获，其义凶也。有孚在道，明功也。", "孚于嘉，吉；位正中也。", "拘系之，上穷也。"] },
  { yao: [["初六", "干父之蛊，有子考，无咎，厉终吉。"], ["九二", "干母之蛊，不可贞。"], ["九三", "干父之蛊，小有悔，无大咎。"], ["六四", "裕父之蛊，往见吝。"], ["六五", "干父之蛊，用誉。"], ["上九", "不事王侯，高尚其事。"]],
    tuan: "蛊，刚上而柔下，巽而止，蛊。蛊，元亨，而天下治也。利涉大川，往有事也。先甲三日，后甲三日，终则有始，天行也。",
    small: ["干父之蛊，意承考也。", "干母之蛊，得中道也。", "干父之蛊，终无咎也。", "裕父之蛊，往未得也。", "干父用誉，承以德也。", "不事王侯，志可则也。"] },
  { yao: [["初九", "咸临，贞吉。"], ["九二", "咸临，吉无不利。"], ["六三", "甘临，无攸利。既忧之，无咎。"], ["六四", "至临，无咎。"], ["六五", "知临，大君之宜，吉。"], ["上六", "敦临，吉无咎。"]],
    tuan: "临，刚浸而长。说而顺，刚中而应，大亨以正，天之道也。至于八月有凶，消不久也。",
    small: ["咸临贞吉，志行正也。", "咸临，吉无不利；未顺命也。", "甘临，位不当也。既忧之，咎不长也。", "至临无咎，位当也。", "大君之宜，行中之谓也。", "敦临之吉，志在内也。"] },
  { yao: [["初六", "童观，小人无咎，君子吝。"], ["六二", "窥观，利女贞。"], ["六三", "观我生，进退。"], ["六四", "观国之光，利用宾于王。"], ["九五", "观我生，君子无咎。"], ["上九", "观其生，君子无咎。"]],
    tuan: "大观在上，顺而巽，中正以观天下。观，盥而不荐，有孚颙若，下观而化也。观天之神道，而四时不忒，圣人以神道设教，而天下服矣。",
    small: ["初六童观，小人道也。", "窥观女贞，亦可丑也。", "观我生，进退；未失道也。", "观国之光，尚宾也。", "观我生，观民也。", "观其生，志未平也。"] },
  { yao: [["初九", "屦校灭趾，无咎。"], ["六二", "噬肤灭鼻，无咎。"], ["六三", "噬昔肉，遇毒；小吝，无咎。"], ["九四", "噬干胏，得金矢，利艰贞，吉。"], ["六五", "噬干肉，得黄金，贞厉，无咎。"], ["上九", "何校灭耳，凶。"]],
    tuan: "颐中有物，曰噬嗑，噬嗑而亨。刚柔分，动而明，雷电合而章。柔得中而上行，虽不当位，利用狱也。",
    small: ["屦校灭趾，不行也。", "噬肤灭鼻，乘刚也。", "遇毒，位不当也。", "利艰贞吉，未光也。", "贞厉无咎，得当也。", "何校灭耳，聪不明也。"] },
  { yao: [["初九", "贲其趾，舍车而徒。"], ["六二", "贲其须。"], ["九三", "贲如濡如，永贞吉。"], ["六四", "贲如皤如，白马翰如，匪寇婚媾。"], ["六五", "贲于丘园，束帛戋戋，吝，终吉。"], ["上九", "白贲，无咎。"]],
    tuan: "贲，亨；柔来而文刚，故亨。分刚上而文柔，故小利有攸往。刚柔交错，天文也；文明以止，人文也。观乎天文，以察时变；观乎人文，以化成天下。",
    small: ["舍车而徒，义弗乘也。", "贲其须，与上兴也。", "永贞之吉，终莫之陵也。", "六四，当位疑也。匪寇婚媾，终无尤也。", "六五之吉，有喜也。", "白贲无咎，上得志也。"] },
  { yao: [["初六", "剥床以足，蔑贞凶。"], ["六二", "剥床以辨，蔑贞凶。"], ["六三", "剥之，无咎。"], ["六四", "剥床以肤，凶。"], ["六五", "贯鱼，以宫人宠，无不利。"], ["上九", "硕果不食，君子德车，小人剥庐。"]],
    tuan: "剥，剥也，柔变刚也。不利有攸往，小人长也。顺而止之，观象也。君子尚消息盈虚，天行也。",
    small: ["剥床以足，以灭下也。", "剥床以辨，未有与也。", "剥之无咎，失上下也。", "剥床以肤，切近灾也。", "以宫人宠，终无尤也。", "君子得舆，民所载也。小人剥庐，终不可用也。"] },
  { yao: [["初九", "不远复，无祇悔，元吉。"], ["六二", "休复，吉。"], ["六三", "频复，厉无咎。"], ["六四", "中行独复。"], ["六五", "敦复，无悔。"], ["上六", "迷复，凶，有灾眚。用行师，终有大败，以其国君，凶；至于十年，不克征。"]],
    tuan: "复亨；刚反，动而以顺行，是以出入无疾，朋来无咎。反复其道，七日来复，天行也。利有攸往，刚长也。复其见天地之心乎？",
    small: ["不远之复，以修身也。", "休复之吉，以下仁也。", "频复之厉，义无咎也。", "中行独复，以从道也。", "敦复无悔，中以自考也。", "迷复之凶，反君道也。"] },
  { yao: [["初九", "无妄，往吉。"], ["六二", "不耕获，不菑畬，则利有攸往。"], ["六三", "无妄之灾，或系之牛，行人之得，邑人之灾。"], ["九四", "可贞，无咎。"], ["九五", "无妄之疾，勿药有喜。"], ["上九", "无妄，行有眚，无攸利。"]],
    tuan: "无妄，刚自外来，而为主于内。动而健，刚中而应，大亨以正，天之命也。其匪正有眚，不利有攸往。无妄之往，何之矣？ 天命不佑，行矣哉？",
    small: ["无妄之往，得志也。", "不耕获，未富也。", "行人得牛，邑人灾也。", "可贞无咎，固有之也。", "无妄之药，不可试也。", "无妄之行，穷之灾也。"] },
  { yao: [["初九", "有厉利已。"], ["九二", "舆说輹。"], ["九三", "良马逐，利艰贞，吉。日闲舆卫，利有攸往。"], ["六四", "童牛之告，元吉。"], ["六五", "豮豕之牙，吉。"], ["上九", "何天之衢，亨。"]],
    tuan: "大畜，刚健笃实辉光，日新其德，刚上而尚贤。能止健，大正也。不家食吉，养贤也。利涉大川，应乎天也。",
    small: ["有厉利已，不犯灾也。", "舆说輹，中无尤也。", "利有攸往，上合志也。", "六四元吉，有喜也。", "六五之吉，有庆也。", "何天之衢，道大行也。"] },
  { yao: [["初九", "舍尔灵龟，观我朵颐，凶。"], ["六二", "颠颐，拂经，于丘颐，征凶。"], ["六三", "拂颐，贞凶，十年勿用，无攸利。"], ["六四", "颠颐吉，虎视眈眈，其欲逐逐，无咎。"], ["六五", "拂经，居贞吉，不可涉大川。"], ["上九", "由颐，厉吉，利涉大川。"]],
    tuan: "颐贞吉，养正则吉也。观颐，观其所养也；自求口实，观其自养也。天地养万物，圣人养贤，以及万民；颐之时大矣哉！",
    small: ["观我朵颐，亦不足贵也。", "六二征凶，行失类也。", "十年勿用，道大悖也。", "颠颐之吉，上施光也。", "居贞之吉，顺以从上也。", "由颐厉吉，大有庆也。"] },
  { yao: [["初六", "藉用白茅，无咎。"], ["九二", "枯杨生稊，老夫得其女妻，无不利。"], ["九三", "栋桡，凶。"], ["九四", "栋隆，吉。有它吝。"], ["九五", "枯杨生华，老妇得其士夫，无咎无誉。"], ["上六", "过涉灭顶，凶，无咎。"]],
    tuan: "大过，大者过也。栋桡，本末弱也。刚过而中，巽而说行，利有攸往，乃亨。大过之时大矣哉！",
    small: ["藉用白茅，柔在下也。", "老夫女妻，过以相与也。", "栋桡之凶，不可以有辅也。", "栋隆之吉，不桡乎下也。", "枯杨生华，何可久也。老妇士夫，亦可丑也。", "过涉之凶，不可咎也。"] },
  { yao: [["初六", "习坎，入于坎窞，凶。"], ["九二", "坎有险，求小得。"], ["六三", "来之坎坎，险且枕，入于坎窞，勿用。"], ["六四", "尊酒簋，贰用缶。内约自牖，终无咎。"], ["九五", "坎不盈，禔既平，无咎。"], ["上六", "系用徽𬙊，寘于丛棘，三岁不得，凶。"]],
    tuan: "习坎，重险也。水流而不盈，行险而不失其信。维心亨，乃以刚中也。行有尚，往有功也。天险不可升也，地险山川丘陵也，王公设险以守其国，坎之时用大矣哉！",
    small: ["习坎入坎，失道凶也。", "求小得，未出中也。", "来之坎坎，终无功也。", "樽酒簋贰，刚柔济也。", "坎不盈，中未大也。", "上六失道，凶三岁也。"] },
  { yao: [["初九", "履错然，敬之无咎。"], ["六二", "黄离，元吉。"], ["九三", "日昃之离，不鼓缶而歌，则大耋之差，凶。"], ["九四", "突如其来如，焚如，死如，弃如。"], ["六五", "出涕沱若，戚嗟若，吉。"], ["上九", "王用出征，有嘉折首，获匪其丑，无咎。"]],
    tuan: "离，丽也；日月丽乎天，百谷草木丽乎土，重明以丽乎正，乃化成天下。柔丽乎中正，故亨；是以畜牝牛吉也。",
    small: ["履错之敬，以辟咎也。", "黄离元吉，得中道也。", "日昃之离，何可久也。", "突如其来如，无所容也。", "六五之吉，离王公也。", "王用出征，以正邦也。"] },
  { yao: [["初六", "咸其拇。"], ["六二", "咸其腓，凶，居吉。"], ["九三", "咸其股，执其随，往吝。"], ["九四", "贞吉悔亡，憧憧往来，朋从尔思。"], ["九五", "咸其脢，无悔。"], ["上六", "咸其辅，颊，舌。"]],
    tuan: "咸，感也。柔上而刚下，二气感应以相与，止而说，男下女，是以亨利贞，取女吉也。天地感而万物化生，圣人感人心而天下和平；观其所感，而天地万物之情可见矣！",
    small: ["咸其拇，志在外也。", "虽凶，居吉，顺不害也。", "咸其股，亦不处也。志在随人，所执下也。", "贞吉悔亡，未感害也。憧憧往来，未光大也。", "咸其脢，志末也。", "咸其辅，颊，舌，滕口说也。"] },
  { yao: [["初六", "浚恒，贞凶，无攸利。"], ["九二", "悔亡。"], ["九三", "不恒其德，或承之羞，贞吝。"], ["九四", "田无禽。"], ["六五", "恒其德，贞，妇人吉，夫子凶。"], ["上六", "震恒，凶。"]],
    tuan: "恒，久也。刚上而柔下，雷风相与，巽而动，刚柔皆应，恒。恒亨无咎，利贞；久于其道也，天地之道，恒久而不已也。利有攸往，终则有始也。日月得天，而能久照，四时变化，而能久成，圣人久于其道，而天下化成；观其所恒，而天地万物之情可见矣！",
    small: ["浚恒之凶，始求深也。", "九二悔亡，能久中也。", "不恒其德，无所容也。", "久非其位，安得禽也。", "妇人贞吉，从一而终也。夫子制义，从妇凶也。", "振恒在上，大无功也。"] },
  { yao: [["初六", "遁尾，厉，勿用有攸往。"], ["六二", "执之用黄牛之革，莫之胜说。"], ["九三", "系遁，有疾厉，畜臣妾吉。"], ["九四", "好遁君子吉，小人否。"], ["九五", "嘉遁，贞吉。"], ["上九", "肥遁，无不利。"]],
    tuan: "遁亨，遁而亨也。刚当位而应，与时行也。小利贞，浸而长也。遁之时义大矣哉！",
    small: ["遁尾之厉，不往何灾也。", "执用黄牛，固志也。", "系遁之厉，有疾惫也。畜臣妾吉，不可大事也。", "君子好遁，小人否也。", "嘉遁贞吉，以正志也。", "肥遁，无不利；无所疑也。"] },
  { yao: [["初九", "壮于趾，征凶，有孚。"], ["九二", "贞吉。"], ["九三", "小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。"], ["九四", "贞吉悔亡，藩决不羸，壮于大轝之腹。"], ["六五", "丧羊于易，无悔。"], ["上六", "羝羊触藩，不能退，不能遂，无攸利，艰则吉。"]],
    tuan: "大壮，大者壮也。刚以动，故壮。大壮利贞；大者正也。正大而天地之情可见矣！",
    small: ["壮于趾，其孚穷也。", "九二贞吉，以中也。", "小人用壮，君子罔也。", "藩决不羸，尚往也。", "丧羊于易，位不当也。", "不能退，不能遂，不详也。艰则吉，咎不长也。"] },
  { yao: [["初六", "晋如，摧如，贞吉。罔孚，裕无咎。"], ["六二", "晋如，愁如，贞吉。受兹介福，于其王母。"], ["六三", "众允，悔亡。"], ["九四", "晋如鼫鼠，贞厉。"], ["六五", "悔亡，矢得勿恤，往吉无不利。"], ["上九", "晋其角，维用伐邑，厉吉无咎，贞吝。"]],
    tuan: "晋，进也。明出地上，顺而丽乎大明，柔进而上行。是以康侯用锡马蕃庶，昼日三接也。",
    small: ["晋如，摧如；独行正也。裕无咎；未受命也。", "受兹介福，以中正也。", "众允之志，上行也。", "鼫鼠贞厉，位不当也。", "失得勿恤，往有庆也。", "维用伐邑，道未光也。"] },
  { yao: [["初九", "明夷于飞，垂其翼。君子于行，三日不食，有攸往，主人有言。"], ["六二", "明夷，夷于左股，用拯马壮，吉。"], ["九三", "明夷于南狩，得其大首，不可疾贞。"], ["六四", "入于左腹，获明夷之心，于出门庭。"], ["六五", "箕子之明夷，利贞。"], ["上六", "不明晦，初登于天，后入于地。"]],
    tuan: "明入地中，明夷。内文明而外柔顺，以蒙大难，文王以之。利艰贞，晦其明也，内难而能正其志，箕子以之。",
    small: ["君子于行，义不食也。", "六二之吉，顺以则也。", "南狩之志，乃大得也。", "入于左腹，获心意也。", "箕子之贞，明不可息也。", "初登于天，照四国也。后入于地，失则也。"] },
  { yao: [["初九", "闲有家，悔亡。"], ["六二", "无攸遂，在中馈，贞吉。"], ["九三", "家人嗃嗃，悔厉吉；妇子嘻嘻，终吝。"], ["六四", "富家，大吉。"], ["九五", "王假有家，勿恤。吉。"], ["上九", "有孚威如，终吉。"]],
    tuan: "家人，女正位乎内，男正位乎外，男女正，天地之大义也。家人有严君焉，父母之谓也。父父，子子，兄兄，弟弟，夫夫，妇妇，而家道正；正家而天下定矣。",
    small: ["闲有家，志未变也。", "六二之吉，顺以巽也。", "家人嗃嗃，未失也；妇子嘻嘻，失家节也。", "富家大吉，顺在位也。", "王假有家，交相爱也。", "威如之吉，反身之谓也。"] },
  { yao: [["初九", "悔亡，丧马勿逐，自复；见恶人无咎。"], ["九二", "遇主于巷，无咎。"], ["六三", "见舆曳，其牛𧤊，其人天且劓，无初有终。"], ["九四", "睽孤，遇元夫，交孚，厉无咎。"], ["六五", "悔亡，厥宗噬肤，往何咎。"], ["上九", "睽孤， 见豕负涂，载鬼一车， 先张之弧，后说之弧，匪寇婚媾，往遇雨则吉。"]],
    tuan: "睽，火动而上，泽动而下；二女同居，其志不同行；说而丽乎明，柔进而上行，得中而应乎刚；是以小事吉。天地睽，而其事同也；男女睽，而其志通也；万物睽，而其事类也；睽之时用大矣哉！",
    small: ["见恶人，以辟咎也。", "遇主于巷，未失道也。", "见舆曳，位不当也。无初有终，遇刚也。", "交孚无咎，志行也。", "厥宗噬肤，往有庆也。", "遇雨之吉，群疑亡也。"] },
  { yao: [["初六", "往蹇，来誉。"], ["六二", "王臣蹇蹇，匪躬之故。"], ["九三", "往蹇来反。"], ["六四", "往蹇来连。"], ["九五", "大蹇朋来。"], ["上六", "往蹇来硕，吉；利见大人。"]],
    tuan: "蹇，难也，险在前也。见险而能止，知矣哉！蹇利西南，往得中也；不利东北，其道穷也。利见大人，往有功也。当位贞吉，以正邦也。蹇之时用大矣哉！",
    small: ["往蹇来誉，宜待也。", "王臣蹇蹇，终无尤也。", "往蹇来反，内喜之也。", "往蹇来连，当位实也。", "大蹇朋来，以中节也。", "往蹇来硕，志在内也。利见大人，以从贵也。"] },
  { yao: [["初六", "无咎。"], ["九二", "田获三狐，得黄矢，贞吉。"], ["六三", "负且乘，致寇至，贞吝。"], ["九四", "解而拇，朋至斯孚。"], ["六五", "君子惟有解，吉；有孚于小人。"], ["上六", "公用射隼，于高墉之上，获之，无不利。"]],
    tuan: "解，险以动，动而免乎险，解。解利西南，往得众也。其来复吉，乃得中也。有攸往夙吉，往有功也。天地解，而雷雨作，雷雨作，而百果草木皆甲坼，解之时义大矣哉！",
    small: ["刚柔之际，义无咎也。", "九二贞吉，得中道也。", "负且乘，亦可丑也，自我致戎，又谁咎也。", "解而拇，未当位也。", "君子有解，小人退也。", "公用射隼，以解悖也。"] },
  { yao: [["初九", "祀事遄往，无咎，酌损之。"], ["九二", "利贞，征凶，弗损益之。"], ["六三", "三人行，则损一人；一人行，则得其友。"], ["六四", "损其疾，使遄有喜，无咎。"], ["六五", "或益之，十朋之龟弗克违，元吉。"], ["上九", "弗损益之，无咎，贞吉，利有攸往，得臣无家。"]],
    tuan: "损，损下益上，其道上行。损而有孚，元吉，无咎，可贞，利有攸往。曷之用？二簋可用享；二簋应有时。损刚益柔有时，损益盈虚，与时偕行。",
    small: ["已事遄往，尚合志也。", "九二利贞，中以为志也。", "一人行，三则疑也。", "损其疾，亦可喜也。", "六五元吉，自上佑也。", "弗损益之，大得志也。"] },
  { yao: [["初九", "利用为大作，元吉，无咎。"], ["六二", "或益之，十朋之龟弗克违，永贞吉。王用享于帝，吉。"], ["六三", "益之用凶事，无咎。有孚中行，告公用圭。"], ["六四", "中行，告公从。利用为依迁国。"], ["九五", "有孚惠心，勿问元吉。有孚惠我德。"], ["上九", "莫益之，或击之，立心勿恒，凶。"]],
    tuan: "益，损上益下，民说无疆，自上下下，其道大光。利有攸往，中正有庆。利涉大川，木道乃行。益动而巽，日进无疆。天施地生，其益无方。凡益之道，与时偕行。",
    small: ["元吉无咎，下不厚事也。", "或益之，自外来也。", "益用凶事，固有之也。", "告公从，以益志也。", "有孚惠心，勿问之矣。惠我德，大得志也。", "莫益之，偏辞也。或击之，自外来也。"] },
  { yao: [["初九", "壮于前趾，往不胜为咎。"], ["九二", "惕号，莫夜有戎，勿恤。"], ["九三", "壮于頄，有凶。君子夬夬，独行遇雨，若濡有愠，无咎。"], ["九四", "臀无肤，其行次且。牵羊悔亡，闻言不信。"], ["九五", "苋陆夬夬，中行无咎。"], ["上六", "无号，终有凶。"]],
    tuan: "夬，决也，刚决柔也。健而说，决而和，扬于王庭，柔乘五刚也。孚号有厉，其危乃光也。告自邑，不利即戎，所尚乃穷也。利有攸往，刚长乃终也。",
    small: ["不胜而往，咎也。", "莫夜有戎，得中道也。", "君子夬夬，终无咎也。", "其行次且，位不当也。闻言不信，聪不明也。", "中行无咎，中未光也。", "无号之凶，终不可长也。"] },
  { yao: [["初六", "系于金柅，贞吉，有攸往，见凶，羸豕，孚，蹢躅。"], ["九二", "包有鱼，无咎，不利宾。"], ["九三", "臀无肤，其行次且，厉，无大咎。"], ["九四", "包无鱼，起凶。"], ["九五", "以杞包瓜，含章，有陨自天。"], ["上九", "姤其角，吝，无咎。"]],
    tuan: "姤，遇也，柔遇刚也。勿用取女，不可与长也。天地相遇，品物咸章也。刚遇中正，天下大行也。姤之时义大矣哉！",
    small: ["系于金柅，柔道牵也。", "包有鱼，义不及宾也。", "其行次且，行未牵也。", "无鱼之凶，远民也。", "九五含章，中正也。有陨自天，志不舍命也。", "姤其角，上穷吝也。"] },
  { yao: [["初六", "有孚不终，乃乱乃萃，若号一握为笑，勿恤，往无咎。"], ["六二", "引吉，无咎，孚乃利用禴。"], ["六三", "萃如，嗟如，无攸利，往无咎，小吝。"], ["九四", "大吉，无咎。"], ["九五", "萃有位，无咎。匪孚，元永贞，悔亡。"], ["上六", "赍资涕洟，无咎。"]],
    tuan: "萃，聚也；顺以说，刚中而应，故聚也。王假有庙，致孝享也。利见大人亨，聚以正也。用大牲吉，利有攸往，顺天命也。观其所聚，而天地万物之情可见矣。",
    small: ["乃乱乃萃，其志乱也。", "引吉无咎，中未变也。", "往无咎，上巽也。", "大吉无咎，位不当也。", "萃有位，志未光也。", "赍咨涕洟，未安上也。"] },
  { yao: [["初六", "允升，大吉。"], ["九二", "孚乃利用禴，无咎。"], ["九三", "升虚邑。"], ["六四", "王用享于岐山，吉无咎。"], ["六五", "贞吉，升阶。"], ["上六", "冥升，利于不息之贞。"]],
    tuan: "柔以时升，巽而顺，刚中而应，是以大亨。用见大人，勿恤；有庆也。南征吉，志行也。",
    small: ["允升大吉，上合志也。", "九二之孚，有喜也。", "升虚邑，无所疑也。", "王用亨于岐山，顺事也。", "贞吉升阶，大得志也。", "冥升在上，消不富也。"] },
  { yao: [["初六", "臀困于株木，入于幽谷，三岁不觌。"], ["九二", "困于酒食，朱绂方来，利用亨祀，征凶，无咎。"], ["六三", "困于石，据于蒺蔾，入于其宫，不见其妻，凶。"], ["九四", "来荼荼，困于金轝，吝，有终。"], ["九五", "劓刖，困于赤绂，乃徐有说，利用祭祀。"], ["上六", "困于葛藟，于臲卼，曰动悔。有悔，征吉。"]],
    tuan: "困，刚掩也。险以说，困而不失其所，亨；其唯君子乎？ 贞大人吉，以刚中也。有言不信，尚口乃穷也。",
    small: ["入于幽谷，幽不明也。", "困于酒食，中有庆也。", "据于蒺藜，乘刚也。入于其宫，不见其妻，不祥也。", "来徐徐，志在下也。虽不当位，有与也。", "劓刖，志未得也。乃徐有说，以中直也。利用祭祀，受福也。", "困于葛藟，未当也。动悔，有悔，吉行也。"] },
  { yao: [["初六", "井泥不食，旧井无禽。"], ["九二", "井谷射鲋，瓮敝漏。"], ["九三", "井渫不食，为我心恻，可用汲，王明，并受其福。"], ["六四", "井甃，无咎。"], ["九五", "井冽，寒泉食。"], ["上六", "井收勿幕，有孚元吉。"]],
    tuan: "巽乎水而上水，井；井养而不穷也。改邑不改井，乃以刚中也。汔至亦未繘井，未有功也。羸其瓶，是以凶也。",
    small: ["井泥不食，下也。旧井无禽，时舍也。", "井谷射鲋，无与也。", "井渫不食，行恻也。求王明，受福也。", "井甃无咎，修井也。", "寒泉之食，中正也。", "元吉在上，大成也。"] },
  { yao: [["初九", "巩用黄牛之革。"], ["六二", "已日乃革之，征吉，无咎。"], ["九三", "征凶，贞厉，革言三就，有孚。"], ["九四", "悔亡，有孚改命，吉。"], ["九五", "大人虎变，未占有孚。"], ["上六", "君子豹变，小人革面，征凶，居贞吉。"]],
    tuan: "革，水火相息，二女同居，其志不相得，曰革。已日乃孚；革而信也。文明以说，大亨以正，革而当，其悔乃亡。天地革而四时成，汤武革命，顺乎天而应乎人，革之时义大矣哉！",
    small: ["巩用黄牛，不可以有为也。", "已日革之，行有嘉也。", "革言三就，又何之矣。", "改命之吉，信志也。", "大人虎变，其文炳也。", "君子豹变，其文蔚也。小人革面，顺以从君也。"] },
  { yao: [["初六", "鼎颠趾，利出否，得妾以其子，无咎。"], ["九二", "鼎有实，我仇有疾，不我能即，吉。"], ["九三", "鼎耳革，其行塞，雉膏不食，方雨亏悔，终吉。"], ["九四", "鼎折足，覆公𫗧，其刑渥，凶。"], ["六五", "鼎黄耳金铉，利贞。"], ["上九", "鼎玉铉，大吉，无不利。"]],
    tuan: "鼎，象也。以木巽火，亨饪也。圣人亨以享上帝，而大亨以养圣贤。巽而耳目聪明，柔进而上行，得中而应乎刚，是以元亨。",
    small: ["鼎颠趾，未悖也。利出否，以从贵也。", "鼎有实，慎所之也。我仇有疾，终无尤也。", "鼎耳革，失其义也。", "覆公𫗧，信如何也。", "鼎黄耳，中以为实也。", "玉铉在上，刚柔节也。"] },
  { yao: [["初九", "震来虩虩，后笑言哑哑，吉。"], ["六二", "震来厉，亿丧贝，跻于九陵，勿逐，七日得。"], ["六三", "震苏苏，震行无眚。"], ["九四", "震遂泥。"], ["六五", "震往来厉，亿无丧，有事。"], ["上六", "震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。"]],
    tuan: "震，亨。震来虩虩，恐致福也。笑言哑哑，后有则也。震惊百里，惊远而惧迩也。出可以守宗庙社稷，以为祭主也。",
    small: ["震来虩虩，恐致福也。笑言哑哑，后有则也。", "震来厉，乘刚也。", "震苏苏，位不当也。", "震遂泥，未光也。", "震往来厉，危行也。其事在中，大无丧也。", "震索索，中未得也。虽凶无咎，畏邻戒也。"] },
  { yao: [["初六", "艮其趾，无咎，利永贞。"], ["六二", "艮其腓，不拯其随，其心不快。"], ["九三", "艮其限，裂其夤，厉阍心。"], ["六四", "艮其身，无咎。"], ["六五", "艮其辅，言有孚，悔亡。"], ["上九", "敦艮，吉。"]],
    tuan: "艮，止也。时止则止，时行则行，动静不失其时，其道光明。艮其止，止其所也。上下敌应，不相与也。是以不获其身，行其庭不见其人，无咎也。",
    small: ["艮其趾，未失正也。", "不拯其随，未退听也。", "艮其限，危熏心也。", "艮其身，止诸躬也。", "艮其辅，以中正也。", "敦艮之吉，以厚终也。"] },
  { yao: [["初六", "鸿渐于干，小子厉，有言，无咎。"], ["六二", "鸿渐于磐，饮食衎衎，吉。"], ["九三", "鸿渐于陆，夫征不复，妇孕不育，凶；利御寇。"], ["六四", "鸿渐于木，或得其桷，无咎。"], ["九五", "鸿渐于陵，妇三岁不孕，终莫之胜，吉。"], ["上九", "鸿渐于陆，其羽可用为仪，吉。"]],
    tuan: "渐之进也，女归吉也。进得位，往有功也。进以正，可以正邦也。其位刚，得中也。止而巽，动不穷也。",
    small: ["小子之厉，义无咎也。", "饮食衎衎，不素饱也。", "夫征不复，离群丑也。妇孕不育，失其道也。利用御寇，顺相保也。", "或得其桷，顺以巽也。", "终莫之胜，吉；得所愿也。", "其羽可用为仪，吉；不可乱也。"] },
  { yao: [["初九", "归妹以娣，跛能履，征吉。"], ["九二", "眇能视，利幽人之贞。"], ["六三", "归妹以须，反归以娣。"], ["九四", "归妹愆期，迟归有时。"], ["六五", "帝乙归妹，其君之袂，不如其娣之袂良，月几望，吉。"], ["上六", "女承筐无实，士刲羊无血，无攸利。"]],
    tuan: "归妹，天地之大义也。天地不交，而万物不兴，归妹人之终始也。说以动，所归妹也。征凶，位不当也。无攸利，柔乘刚也。",
    small: ["归妹以娣，以恒也。跛能履吉，相承也。", "利幽人之贞，未变常也。", "归妹以须，未当也。", "愆期之志，有待而行也。", "帝乙归妹，不如其娣之袂良也。其位在中，以贵行也。", "上六无实，承虚筐也。"] },
  { yao: [["初九", "遇其配主，虽旬无咎，往有尚。"], ["六二", "丰其蔀，日中见斗，往得疑疾，有孚发若，吉。"], ["九三", "丰其沛，日中见沬，折其右肱，无咎。"], ["九四", "丰其蔀，日中见斗，遇其夷主，吉。"], ["六五", "来章，有庆誉，吉。"], ["上六", "丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。"]],
    tuan: "丰，大也。明以动，故丰。王假之，尚大也。勿忧宜日中，宜照天下也。日中则昃，月盈则食，天地盈虚，与时消息，而况于人乎？况于鬼神乎？",
    small: ["虽旬无咎，过旬灾也。", "有孚发若，信以发志也。", "丰其沛，不可大事也。折其右肱，终不可用也。", "丰其蔀，位不当也。日中见斗，幽不明也。遇其夷主，吉；行也。", "六五之吉，有庆也。", "丰其屋，天际翔也。窥其户，阒其无人，自藏也。"] },
  { yao: [["初六", "旅琐琐，斯其所取灾。"], ["六二", "旅即次，怀其资，得僮仆贞。"], ["九三", "旅焚其次，丧其僮仆，贞厉。"], ["九四", "旅于处，得其资斧，我心不快。"], ["六五", "射雉一矢亡，终以誉命。"], ["上九", "鸟焚其巢，旅人先笑后号咷。丧牛于易，凶。"]],
    tuan: "旅，小亨，柔得中乎外，而顺乎刚，止而丽乎明，是以小亨，旅贞吉也。旅之时义大矣哉！",
    small: ["旅琐琐，志穷灾也。", "得童仆贞，终无尤也。", "旅焚其次，亦以伤矣。以旅与下，其义丧也。", "旅于处，未得位也。得其资斧，心未快也。", "终以誉命，上逮也。", "以旅在上，其义焚也。丧牛于易，终莫之闻也。"] },
  { yao: [["初六", "进退，利武人之贞。"], ["九二", "巽在床下，用史巫纷若，吉无咎。"], ["九三", "频巽，吝。"], ["六四", "悔亡，田获三品。"], ["九五", "贞吉悔亡，无不利。无初有终，先庚三日，后庚三日，吉。"], ["上九", "巽在床下，丧其资斧，贞凶。"]],
    tuan: "重巽以申命，刚巽乎中正而志行。柔皆顺乎刚，是以小亨，利有攸往，利见大人。",
    small: ["进退，志疑也。利武人之贞，志治也。", "纷若之吉，得中也。", "频巽之吝，志穷也。", "田获三品，有功也。", "九五之吉，位正中也。", "巽在床下，上穷也。丧其资斧，正乎凶也。"] },
  { yao: [["初九", "和兑，吉。"], ["九二", "孚兑，吉，悔亡。"], ["六三", "来兑，凶。"], ["九四", "商兑，未宁，介疾有喜。"], ["九五", "孚于剥，有厉。"], ["上六", "引兑。"]],
    tuan: "兑，说也。刚中而柔外，说以利贞，是以顺乎天，而应乎人。说以先民，民忘其劳；说以犯难，民忘其死；说之大，民劝矣哉！",
    small: ["和兑之吉，行未疑也。", "孚兑之吉，信志也。", "来兑之凶，位不当也。", "九四之喜，有庆也。", "孚于剥，位正当也。", "上六引兑，未光也。"] },
  { yao: [["初六", "用拯马壮，吉，悔亡。"], ["九二", "涣奔其机，悔亡。"], ["六三", "涣其躬，无悔。"], ["六四", "涣其群，元吉。涣有丘，匪夷所思。"], ["九五", "涣汗其大号，涣王居，无咎。"], ["上九", "涣其血，去逖出，无咎。"]],
    tuan: "涣，亨。刚来而不穷，柔得位乎外而上同。王假有庙，王乃在中也。利涉大川，乘木有功也。",
    small: ["初六之吉，顺也。", "涣奔其机，得愿也。", "涣其躬，志在外也。", "涣其群，元吉；光大也。", "王居无咎，正位也。", "涣其血，远害也。"] },
  { yao: [["初九", "不出户庭，无咎。"], ["九二", "不出门庭，凶。"], ["六三", "不节若，则嗟若，无咎。"], ["六四", "安节，亨。"], ["九五", "甘节，吉；往有尚。"], ["上六", "苦节，贞凶，悔亡。"]],
    tuan: "节，亨，刚柔分，而刚得中。苦节不可贞，其道穷也。说以行险，当位以节，中正以通。天地节而四时成，节以制度，不伤财，不害民。",
    small: ["不出户庭，知通塞也。", "不出门庭，失时极也。", "不节之嗟，又谁咎也。", "安节之亨，承上道也。", "甘节之吉，居位中也。", "苦节贞凶，其道穷也。"] },
  { yao: [["初九", "虞吉，有它不燕。"], ["九二", "鸣鹤在阴，其子和之，我有好爵，吾与尔靡之。"], ["六三", "得敌，或鼓或罢，或泣或歌。"], ["六四", "月既望，马匹亡，无咎。"], ["九五", "有孚挛如，无咎。"], ["上九", "翰音登于天，贞凶。"]],
    tuan: "中孚，柔在内而刚得中。说而巽，孚，乃化邦也。豚鱼吉，信及豚鱼也。利涉大川，乘木舟虚也。中孚以利贞，乃应乎天也。",
    small: ["初九虞吉，志未变也。", "其子和之，中心愿也。", "可鼓或罢，位不当也。", "马匹亡，绝类上也。", "有孚挛如，位正当也。", "翰音登于天，何可长也。"] },
  { yao: [["初六", "飞鸟以凶。"], ["六二", "过其祖，遇其妣；不及其君，遇其臣；无咎。"], ["九三", "弗过防之，从或戕之，凶。"], ["九四", "无咎，弗过遇之。往厉必戒，勿用永贞。"], ["六五", "密云不雨，自我西郊，公弋取彼在穴。"], ["上六", "弗遇过之，飞鸟离之，凶，是谓灾眚。"]],
    tuan: "小过，小者过而亨也。过以利贞，与时行也。柔得中，是以小事吉也。刚失位而不中，是以不可大事也。有飞鸟之象焉，有飞鸟遗之音，不宜上宜下，大吉；上逆而下顺也。",
    small: ["飞鸟以凶，不可如何也。", "不及其君，臣不可过也。", "从或戕之，凶如何也。", "弗过遇之，位不当也。往厉必戒，终不可长也。", "密云不雨，已上也。", "弗遇过之，已亢也。"] },
  { yao: [["初九", "曳其轮，濡其尾，无咎。"], ["六二", "妇丧其茀，勿逐，七日得。"], ["九三", "高宗伐鬼方，三年克之，小人勿用。"], ["六四", "𦈡有衣袽，终日戒。"], ["九五", "东邻杀牛，不如西邻之禴祭，实受其福。"], ["上六", "濡其首，厉。"]],
    tuan: "既济，亨，小者亨也。利贞，刚柔正而位当也。初吉，柔得中也。终止则乱，其道穷也。",
    small: ["曳其轮，义无咎也。", "七日得，以中道也。", "三年克之，惫也。", "终日戒，有所疑也。", "东邻杀牛，不如西邻之时也；实受其福，吉大来也。", "濡其首厉，何可久也。"] },
  { yao: [["初六", "濡其尾，吝。"], ["九二", "曳其轮，贞吉。"], ["六三", "未济，征凶，利涉大川。"], ["九四", "贞吉，悔亡，震用伐鬼方，三年有赏于大国。"], ["六五", "贞吉，无悔，君子之光，有孚，吉。"], ["上九", "有孚于饮酒，无咎，濡其首，有孚失是。"]],
    tuan: "未济，亨；柔得中也。小狐汔济，未出中也。濡其尾，无攸利；不续终也。虽不当位，刚柔应也。",
    small: ["濡其尾，亦不知极也。", "九二贞吉，中以行正也。", "未济征凶，位不当也。", "贞吉悔亡，志行也。", "君子之光，其晖吉也。", "饮酒濡首，亦不知节也。"] }
];
</script>
<script data-src="src/guaread.js">
/* 八卦: one plain-language reading per hexagram, King Wen order. Written for this app (MIT) by reading each
   卦辞 with its 彖 and 大象 along the received commentaries (程颐《伊川易传》, 朱熹《周易本义》): what the
   figure shows and what the judgment advises. It explains the old text; it does not foretell anything.
   MIT License. Copyright (c) 2026 Haowei Wu. */
var GUAREAD = [
  /* 1 乾 */ "六爻全阳，像天一样刚健、运行不息。卦辞「元亨利贞」说的是大的开端、顺通、适宜、守正。大象劝人效法天：自强不息。爻辞从「潜龙」到「亢龙」，讲的是时机未到要沉住气，到了顶点要知道收。",
  /* 2 坤 */ "六爻全阴，像大地一样柔顺、承载万物。卦辞说像母马那样顺而能行、守正就好；先走在前面容易迷路，跟随得当才有所得。大象劝人厚德载物：宽厚包容。",
  /* 3 屯 */ "雷在下、云（水）在上，像万物刚破土、处处艰难的开头。卦辞说虽然通达可期，但先不要急着往前，宜立根基、找帮手。大象说君子在这时理清头绪、经营筹划。",
  /* 4 蒙 */ "山下出泉，像蒙昧初开的孩童。卦辞说不是老师去求学生，而是学生来求老师；诚心问一次就答，反复轻慢地问就不答了。大象劝人行动果决、培养品德。",
  /* 5 需 */ "云在天上还没下雨，所以是「等待」。前面有险（坎），硬闯不行。卦辞说心存诚信、守正就好，时机到了可以涉过大河。大象说君子此时吃好喝好、安心等待。",
  /* 6 讼 */ "天往上、水往下，两者背道而行，所以起争讼。卦辞说即使有理也要警惕，适可而止就好，争到底不好；宜请有德的人评断，不宜冒险。大象劝人做事一开始就谋划周全，免得日后争执。",
  /* 7 师 */ "地中藏水，像民众中蓄着兵力。师是军队。卦辞说用兵要守正，由老成持重的人统领才没有过失。大象说君子平日容纳百姓、养育众人。",
  /* 8 比 */ "水在地上，相亲相依，所以是「比」（亲近、依附）。卦辞说亲附是好事，但要再审察对方是否值得长久守正；迟迟不来的人就错过了。大象说先王以此建立邦国、亲近诸侯。",
  /* 9 小畜 */ "风在天上飘，云积得密却还没下雨。小畜是小有积蓄、力量还小，只能暂时蓄住。卦辞「密云不雨」说时候未到。大象劝人修养文采与德行，先把自己积累好。",
  /* 10 履 */ "上天下泽，上下有分。履是践行、走路。卦辞说踩在老虎尾巴上，老虎却不咬人，因为举止和顺有礼。大象劝人分清上下、安定人心：守礼而行。",
  /* 11 泰 */ "地在上、天在下，天气下降、地气上升，上下相交，所以通泰。卦辞「小往大来」，彖传说就是天地相交、万物相通，上下一心。大象说君主据此调理天地之道，辅助百姓。",
  /* 12 否 */ "天在上、地在下，各自不相往来，上下不通，所以闭塞。卦辞说这不是人的过错，是时势；君子守正也难有作为。大象劝人收敛德行、避开灾难，不要贪图荣禄。",
  /* 13 同人 */ "天与火同向上，同人是与人和同。卦辞说在旷野中与人和同，光明正大、不搞小圈子，就能通达，可以共渡难关。大象劝人分门别类、辨清事物，在同中看到异。",
  /* 14 大有 */ "火在天上，光照万物，所以大有：所有甚丰。卦辞只两个字「元亨」。大象劝人在富有时扬善抑恶，顺应天命。",
  /* 15 谦 */ "高山藏在地下，有而不自居，所以是谦。卦辞说谦而通达，君子能有好的结局。大象劝人取多补少，衡量事物公平施与。六爻都没有凶辞，是《易》里少见的。",
  /* 16 豫 */ "雷出地上，大地振奋，所以是豫：和乐、预备。卦辞说宜建立诸侯、出兵，意思是人心和顺时可以有所作为。大象说先王以此作乐、崇尚德行。",
  /* 17 随 */ "泽中有雷，雷随着时令潜藏到泽里，所以是随：随从、顺时。卦辞说随从得正就没有过失。大象劝人天黑了就回家休息：顺着时候作息。",
  /* 18 蛊 */ "山下有风，风遇山而回，事物积久生弊，所以是蛊：败坏之事。卦辞说正是要去整治它的时候，宜有作为；做事前后都要想周全（先甲三日、后甲三日）。大象劝人振奋民心、培养德行。",
  /* 19 临 */ "泽上有地，地临于泽，居高临下而亲近。临是来临、督导。卦辞说大为通达、宜守正，但提醒到了八月会有凶：盛时要想到衰。大象说君子教导、关怀百姓没有止境。",
  /* 20 观 */ "风行地上，遍及万物，所以是观：观察，也是给人观看。卦辞说祭祀时洗过手还没献祭的那一刻，诚敬庄严，让人仰望。大象说先王巡视四方、观察民情来设教化。",
  /* 21 噬嗑 */ "口中有物，咬合才能合拢，所以噬嗑：咬碎障碍。雷电交加，象征刑罚明断。卦辞说宜用刑狱解决问题。大象说先王以此严明刑罚、整饬法令。",
  /* 22 贲 */ "山下有火，照亮山上的草木，所以是贲：文饰。卦辞说文饰可以带来小的顺利，但本质更重要。大象劝人修明各项政务，但不敢凭文饰来判案。",
  /* 23 剥 */ "五阴在下，一阳在上将被剥尽，所以是剥落。卦辞说不宜有所往。大象说居上者应厚待下面，使住处安稳：根基稳了才不会被剥掉。",
  /* 24 复 */ "一阳在五阴之下重新生出，所以是复：回复。卦辞说出入没有妨碍，朋友来也没有过失，循着规律往返，七天就回来，宜有所往。大象说先王在冬至这天闭关静养，商旅不出行。",
  /* 25 无妄 */ "天下雷行，万物顺天而动，不敢妄为，所以是无妄：不虚妄、不乱来。卦辞说大为通达、宜守正；若不正就有灾祸，不宜有所往。大象说先王顺应天时养育万物。",
  /* 26 大畜 */ "天被包在山中，所蓄极大，所以是大畜：大的蓄积。卦辞说宜守正，不在家里吃闲饭而出去做事为好，可以涉过大河。大象劝人多学前人的言行，来蓄养德行。",
  /* 27 颐 */ "上下两阳像上下颚，中间四阴像口中，所以是颐：口，也是养。卦辞说守正则吉，看他养什么、怎样自己求食。大象劝人说话谨慎、饮食有节。",
  /* 28 大过 */ "中间四阳、两头两阴，像房梁中间粗两头弱，所以压弯了。大过是大大超过常度。卦辞说宜有所往、可以通达，非常之时要有非常之举。大象劝人独立不惧、避世也无烦闷。",
  /* 29 坎 */ "上下都是坎（水、险），险上加险，所以叫「习坎」：重重险阻。卦辞说心存诚信，内心通达，行动就值得推崇。大象劝人像水一样持续不断：常守德行、反复练习教化之事。",
  /* 30 离 */ "上下都是离（火、光明），光明相继，所以是离：附丽、光明。卦辞说宜守正，养母牛这样柔顺的品性就吉。大象说大人用连续不断的光明照临四方。",
  /* 31 咸 */ "山上有泽，山气与泽气相通，所以是咸：感应。卦辞说感应通达、宜守正，娶妻是吉的。大象劝人虚心接纳别人。",
  /* 32 恒 */ "雷风相随，长久不变，所以是恒：恒久。卦辞说恒久而通达、没有过失，宜守正、宜有所往。大象劝人立身不改方向。",
  /* 33 遁 */ "天下有山，山虽高而天退避在上，所以是遁：退避。卦辞说退避可以通达，小事宜守正。大象劝人远离小人，不必憎恶，但要严正。",
  /* 34 大壮 */ "雷在天上，声势盛大，所以是大壮：强盛。卦辞只说「利贞」：越是强盛越要守正。大象劝人不合礼的事不做。",
  /* 35 晋 */ "太阳升出地面，所以是晋：上进。卦辞说受宠的侯爵得到很多赏赐的马匹，一天之中被接见三次，是进身受赏的景象。大象劝人自己彰明光明的德行。",
  /* 36 明夷 */ "太阳落入地中，光明受伤，所以是明夷。卦辞说在艰难中守正有利。大象说君子面对众人时，把光明藏在里面，外表晦暗而内心清明。",
  /* 37 家人 */ "风从火中生出，由内而外，所以是家人：治家之道。卦辞说宜于女子守正。大象劝人说话要有内容、做事要有恒常：治家从自身言行做起。",
  /* 38 睽 */ "火往上、泽往下，彼此相背，所以是睽：乖离、不合。卦辞说小事还可以吉。大象劝人求大同、存小异。",
  /* 39 蹇 */ "山上有水，前有险阻，所以是蹇：行路艰难。卦辞说宜往西南（平地），不宜往东北（山），宜见贤人，守正则吉。大象劝人遇到阻碍时反过来检讨自己、修养德行。",
  /* 40 解 */ "雷雨大作，郁结散开，所以是解：解除。卦辞说宜往西南；无事可做就回来复原为吉，有事就早去早办为吉。大象劝人赦免过失、宽宥罪责。",
  /* 41 损 */ "山下有泽，泽水被减损去滋养山，所以是损：减损。卦辞说只要诚信，减损也大吉：两簋简单的祭品也可以献祭。大象劝人克制愤怒、遏止欲望。",
  /* 42 益 */ "风雷相助，所以是益：增益。卦辞说宜有所往，可以涉过大河。大象劝人见到好的就跟着改，有过错就改正。",
  /* 43 夬 */ "五阳在下，一阴在上将被决去，所以是夬：决断。卦辞说要在朝廷公开宣布，带着诚信呼号，同时警惕危险；先从自己城邑说起，不宜动武，宜有所往。大象劝人把恩惠施给下面，不要自居其德。",
  /* 44 姤 */ "一阴在下遇五阳，所以是姤：相遇。卦辞说这个女子太强盛，不要娶她：提防看似柔弱、实则会坐大的东西。大象说君主据此发布命令、诏告四方。",
  /* 45 萃 */ "泽在地上，水聚成泽，所以是萃：聚集。卦辞说君王到宗庙去，宜见贤人、宜守正，用大牲祭祀为吉。大象劝人整修兵器，防备意外：人多聚集时要有备。",
  /* 46 升 */ "地中生木，树木从地里一点点长高，所以是升：上升。卦辞说大为通达，宜见贤人，不必忧虑，往南去为吉。大象劝人顺着德行，积小成大。",
  /* 47 困 */ "泽中无水，水都漏到下面去了，所以是困：困窘。卦辞说处困而能通达，守正的大人吉、没有过失；只是这时说的话别人不信。大象劝人舍身也要实现志向。",
  /* 48 井 */ "木桶入水、提水而上，所以是井。卦辞说城邑可以迁，井却不迁，不增不减，来来往往的人都用它；但如果绳子快到水面了还没提上来，瓶子打破了，就凶。大象劝人慰劳百姓、劝人互助。",
  /* 49 革 */ "泽中有火，水火相息，所以是革：变革。卦辞说到了该变的那一天才会被人信服，大为通达、宜守正，悔恨就消失。大象说君子据此修订历法、明辨时令。",
  /* 50 鼎 */ "木上有火，像在鼎下烧柴煮食，所以是鼎：烹饪的礼器，也象征新秩序。卦辞「元吉，亨」。大象劝人端正自己的位置，凝聚使命。",
  /* 51 震 */ "上下都是雷，所以是震：震动。卦辞说雷声来时让人恐惧，过后却能谈笑自若；雷震百里，主祭的人却不会把手里的勺和酒丢掉：临危不乱。大象劝人因恐惧而修身反省。",
  /* 52 艮 */ "上下都是山，所以是艮：止。卦辞说止于背后，不看见自己的身体；走在庭院里，看不见对面的人，没有过失：该停时就停、心不外驰。大象劝人思考不越出自己的本分。",
  /* 53 渐 */ "山上有木，树木在山上慢慢长大，所以是渐：循序渐进。卦辞说女子出嫁按礼一步步来为吉，宜守正。大象劝人安居于贤德，改善风俗。",
  /* 54 归妹 */ "泽上有雷，少女随长男，所以是归妹：嫁出少女。卦辞说急进则凶，没有什么好处。大象劝人着眼长久的结果，知道事物会有弊端。",
  /* 55 丰 */ "雷电并至，声势与光明都盛大，所以是丰：丰盛。卦辞说通达，君王能达到这种境地，不必忧虑，应像日在中天那样照耀。大象说君子据此审理案件、施行刑罚。",
  /* 56 旅 */ "山上有火，火在山上移动不停，所以是旅：旅居在外。卦辞说小有通达，旅途中守正则吉。大象劝人用刑明察谨慎，不把案子拖着不判。",
  /* 57 巽 */ "上下都是风，风无孔不入，所以是巽：顺、入。卦辞说小有通达，宜有所往，宜见贤人。大象劝人反复申明命令、然后施行。",
  /* 58 兑 */ "上下都是泽，两泽相连互相滋润，所以是兑：喜悦。卦辞说通达、宜守正。大象劝人和朋友一起讲论、研习。",
  /* 59 涣 */ "风行水上，水被吹散，所以是涣：离散。卦辞说君王到宗庙去凝聚人心，可以涉过大河，宜守正。大象说先王祭祀上帝、建立宗庙：用共同的信仰把散了的人心聚起来。",
  /* 60 节 */ "泽上有水，泽的容量有限，水满就要节制，所以是节：节度。卦辞说有节度而通达，但过分苛刻的节制不可长久坚持。大象劝人制定规矩法度，衡量德行。",
  /* 61 中孚 */ "泽上有风，风吹水动，两阴在中、中心虚而诚，所以是中孚：内心诚信。卦辞说诚信能感化到猪和鱼都吉，可以涉过大河，宜守正。大象劝人审议案件、宽缓死刑。",
  /* 62 小过 */ "山上有雷，雷声过山，略有过分，所以是小过：小有过越。卦辞说可以做小事，不可做大事；飞鸟留下的鸣声，不宜向上，宜向下，大吉：宁可低一点。大象劝人行为稍过于恭敬，丧事稍过于哀伤，用度稍过于节俭。",
  /* 63 既济 */ "水在火上，六爻阴阳各得其位，所以是既济：事已成。卦辞说小事通达，宜守正；开始吉，最后会乱。大象劝人想到将来的祸患而预先防备。",
  /* 64 未济 */ "火在水上，六爻都不在应在的位置，所以是未济：事未成。卦辞说通达可期，但小狐狸快渡过河时却湿了尾巴，没有好处：功亏一篑。大象劝人谨慎辨别事物，让各自待在合适的位置。"
];

   words with its source named; our own words only say what a term is and how the page is read, never what it means

var EXPLAIN = (function () {
  "use strict";

  /* 老黄历: one entry per term on the page */
  var ALMANAC = [
    { term: { zh: "建除十二值", en: "The twelve day officers (建除)" },
      text: {
        zh: "每天轮一个字：建、除、满、平、定、执、破、危、成、收、开、闭。月建（这个月的地支）所在的那天是「建」，往后一天一个。名目最早见于《淮南子·天文训》：「寅为建，卯为除，辰为满，巳为平，主生；午为定，未为执，主陷；申为破，主衡……丑为闭，主太阴。」后来的历书按它排宜忌，体例见清代《协纪辨方书》。",
        en: "Each day takes one of twelve names, starting with 建 on the day whose branch matches the month's. The names go back to the Huainanzi (天文训); later almanacs, as set out in the Qing 协纪辨方书, use them to list what suits a day."
      } },
    { term: { zh: "黄道 · 黑道", en: "Yellow and black path days" },
      text: {
        zh: "十二位神按日轮值：青龙、明堂、天刑、朱雀、金匮、天德、白虎、玉堂、天牢、玄武、司命、勾陈。其中青龙、明堂、金匮、天德、玉堂、司命六位当值的日子叫黄道日，其余叫黑道日。每个月从哪天起青龙，跟月建走。这是旧历书的排法（见《协纪辨方书》），这里照排，不加评说。",
        en: "Twelve spirits take turns by day; six of them (青龙 明堂 金匮 天德 玉堂 司命) make a 'yellow path' day, the other six a 'black path' day. Old almanacs list them (协纪辨方书); this page only shows which one it is."
      } },
    { term: { zh: "冲 · 煞", en: "Clash and sha" },
      text: {
        zh: "「冲」是和当天地支相对的那个地支（相隔六位，如子午、卯酉），历书写成「冲某某（生肖）」。「煞」是按当天地支的三合局定的方位：申子辰煞南，寅午戌煞北，亥卯未煞西，巳酉丑煞东。都是历书的通行写法。",
        en: "The clash is the branch opposite the day's (six apart, like 子 and 午), printed with its zodiac animal. The sha is a direction set by the day's branch group. Both are standard almanac entries."
      } },
    { term: { zh: "彭祖百忌", en: "Pengzu's taboos" },
      text: {
        zh: "两句顺口溜，一句跟当天的天干，一句跟地支，如「甲不开仓财物耗散」。出自旧时民间通书，托名彭祖，并非彭祖本人所作。这里照录，当作历书的老样子看。",
        en: "Two old rhymes, one for the day's stem and one for its branch. They come from folk almanacs and are only attributed to Pengzu; shown here as the old page printed them."
      } },
    { term: { zh: "宜 · 忌", en: "Suits and avoid" },
      text: {
        zh: "宜忌按月建和当天干支查表得出，表的体例出自《协纪辨方书》，这里用的数据取自开源历法库 lunar-javascript（6tail，MIT 许可）。「馀事勿取」「诸事不宜」也是表里原有的字。",
        en: "The suits/avoid lists come from a table keyed by the month and the day, in the scheme of the 协纪辨方书; the data is from the open-source lunar-javascript library (6tail, MIT)."
      } }
  ];

  /* 八卦: how the cast is read. The rule by number of changing lines is a paraphrase of 朱熹《易学启蒙·考变占》. */
  var HOW = {
    zh: "三枚铜钱掷六次，从下往上成一卦。三个正面是老阳（九），三个反面是老阴（六），这两种是「动爻」，会变成相反的爻，得出「变卦」（又叫之卦）。卦辞是全卦的话，爻辞是每一爻的话；彖、象是《易传》对卦辞和爻辞的解说。",
    en: "Three coins thrown six times build the figure from the bottom. Three heads (9) or three tails (6) are changing lines and turn into their opposite, giving the changed hexagram. The judgment speaks for the whole figure, each line has its own text, and the 彖 and 象 are the classic commentaries on them."
  };
  var RULE_SOURCE = { zh: "读法按朱熹《易学启蒙·考变占》（意译）", en: "Reading rule after Zhu Xi, 易学启蒙 (paraphrased)" };
  /* by the number of changing lines, 0-6: what to read */
  var RULES = [
    { zh: "没有动爻：读本卦卦辞。", en: "No changing line: read the judgment of the hexagram." },
    { zh: "一爻动：读本卦这一爻的爻辞。", en: "One changing line: read that line of the hexagram." },
    { zh: "二爻动：读本卦这两爻的爻辞，以上面那一爻为主。", en: "Two: read both lines, the upper one first." },
    { zh: "三爻动：读本卦和变卦的卦辞，本卦为主，变卦为辅。", en: "Three: read the judgments of both hexagrams, the first one leading." },
    { zh: "四爻动：读变卦里两个没动的爻，以下面那一爻为主。", en: "Four: read the two unchanged lines of the changed hexagram, the lower one first." },
    { zh: "五爻动：读变卦里那一个没动的爻。", en: "Five: read the one unchanged line of the changed hexagram." },
    { zh: "六爻全动：乾读「用九」，坤读「用六」，其余读变卦卦辞。", en: "All six: 乾 reads 用九, 坤 reads 用六, the others the changed hexagram's judgment." }
  ];
  var LINE_NAMES = ["初", "二", "三", "四", "五", "上"];

  return { ALMANAC: ALMANAC, HOW: HOW, RULE_SOURCE: RULE_SOURCE, RULES: RULES, LINE_NAMES: LINE_NAMES };
})();
</script>

  else guaSkipped = true;
}
function updateHexagram(dt) {
  syncGuaDate();
  if (guaExplain) { updateGuaExplain(dt); return; }
  if (game.pressed("b")) { backToCounter(); return; }
  if (game.pressed("select")) {
    if (guaState.lines.length === 6) {
      guaExplain = true; guaExplainScroll = 0; guaExplainScroller.offset = 0;
      sfx("tap");
    }
    return;
  }
  if (guaState.lines.length === 6 && !guaState.animating) {
    var rows = guaResultRows(game.g), total = 0;
    for (var i = 0; i < rows.length; i++) total += rows[i].height;
    guaScroll = scrollUpdate(guaScroller, guaArea(), total, dt, game.g.lineHeight || 14);
    if (guaButtonsShown()) {
      if (game.pressed("left")) { guaChoice = 0; sfx("move"); }
      if (game.pressed("right")) { guaChoice = 1; sfx("move"); }
      var tap = game.pointer;
      if (tap.pressed && tap.y >= 176 && tap.y < 207) { guaChoice = tap.x < 108 ? 0 : 1; pickGuaChoice(); return; }
      if (game.pressed("a")) { pickGuaChoice(); return; }
    }
    if (game.pressed("start")) appendGua();
    return;
  }
  var p = game.pointer;
  if (p.pressed && !guaState.animating && guaState.lines.length < 6 && p.y >= 40 && p.y <= 205) tossGuaLine();
  if (game.pressed("a")) tossGuaLine();
}
function drawHexagram(g) {
  syncGuaDate();
  g.clear(g.PAPER);
  g.rect(0, 0, W, 19, g.INK);
  g.text(T({ zh: "八卦", en: "I Ching" }), CX, 2, { align: "center", color: g.PAPER });
  if (!guaState.loaded) {
    g.text(T({ zh: "存档读取中…", en: "Reading save…" }), CX, 96, { align: "center", color: g.DARK });
  } else if (guaState.lines.length === 6) {
    var rows = guaResultRows(g), total = 0, y = 22 - guaScroller.offset;
    for (var i = 0; i < rows.length; i++) total += rows[i].height;
    var area = guaArea();
    guaScroller.max = Math.max(0, total - area.h);
    guaScroll = guaScroller.offset;
    g.clip(area.x, area.y, area.w, area.h);
    for (i = 0; i < rows.length; i++) {
      var row = rows[i];
      if (row.type === "figure") {
        var c = row.changed;
        if (c) {
          drawGuaFigure(g, 42, y + 47, row.lines, 42);
          drawArrow(g, CX, y + 26);
          drawGuaFigure(g, 123, y + 47, c.lines, 42, true);
        } else drawGuaFigure(g, 87, y + 47, row.lines, 42);
      } else if (row.type === "text") {
        g.text(row.text, 10, y, { color: row.color });   /* a shadowed pixel font smears; the name stands out by its own line */
      } else if (row.type === "label") {
        g.text(row.text, 10, y, { color: g.INK });
      }
      y += row.height;
    }
    g.clip();
    drawScrollbar(g, guaScroller, area, total);
    if (guaButtonsShown()) {
      var labels = [T({ zh: "写入记事本", en: "To notes" }), T({ zh: "不写", en: "Skip" })], bx = [8, 110];
      for (var bi = 0; bi < 2; bi++) {
        g.rect(bx[bi], 176, 98, 31, bi === guaChoice ? g.INK : g.PAPER);
        g.frame(bx[bi], 176, 98, 31, g.INK);
        g.text(labels[bi], bx[bi] + 49, 185, { align: "center", color: bi === guaChoice ? g.PAPER : g.INK });
      }
    }
  } else {
    if (!guaState.lines.length) g.text(T({ zh: "心里想一个问题，再起卦", en: "Hold one question in mind, then cast" }), 6, 42,
      { align: "center", color: g.INK, width: 204 });   /* with a width, align centres inside it from x */
    else g.text(T({ zh: "占卦 " + guaState.lines.length + "/6", en: "Casting " + guaState.lines.length + "/6" }),
      CX, 34, { align: "center", color: g.INK });
    if (guaState.lines.length) drawGuaFigure(g, 77, 114 + (guaState.lines.length - 1) * 4, guaState.lines, 48);
    if (guaState.animating) drawTossCoins(g);
    if (guaState.failed && !guaState.animating) g.text(T({ zh: "存档读不出，今天不会保存",
      en: "Could not read the save; today won't be saved" }), CX, 190, { align: "center", color: g.DARK, width: 210 });
  }
  var key = guaState.lines.length !== 6 ? T({ zh: "A 起卦", en: "A cast" }) :
    guaAppendBusy ? T({ zh: "正在写入…", en: "Saving…" }) :
    guaButtonsShown() ? T({ zh: "←→选择 · A确认 · SELECT详解", en: "←→ pick · A ok · SELECT more" }) :
    guaState.written ? T({ zh: "已写入 · SELECT详解", en: "Saved · SELECT more" }) :
    guaAppendStatus === "denied" ? T({ zh: "没有写入 · SELECT详解", en: "Not saved · SELECT more" }) :
    T({ zh: "START记事本 · SELECT详解", en: "START notes · SELECT more" });
  var keyLines = g.wrap(key, W);
  for (var ki = 0; ki < keyLines.length; ki++)
    g.text(keyLines[ki], CX, 211 + ki * (g.lineHeight || 14), { align: "center", color: g.INK });
}
function guaExplainRows(g) {
  var lineHeight = g.lineHeight || 14, rows = [], width = 192;
  var primary = YI.primary(guaState.lines), data = ZHOUYI[primary.number - 1];
  function add(label, text, color) {
    if (label) {
      rows.push({ type: "label", text: label, color: g.INK, height: lineHeight });
      rows.push({ type: "gap", height: 2 });
    }
    var wrapped = g.wrap(text, width);
    for (var i = 0; i < wrapped.length; i++) rows.push({ type: "text", text: wrapped[i], color: color == null ? g.INK : color, height: lineHeight });
    rows.push({ type: "gap", height: 6 });
  }
  var reading = guaReading(guaState.lines), count = YI.changingLines(guaState.lines).length;
  add(T({ zh: "读法", en: "Reading rule" }), EXPLAIN.RULES[count][game.lang]);
  for (var r = 0; r < reading.length; r++) if (reading[r].kind === "text") {
    var quote = game.t(reading[r].text);
    /* The rule source is repeated at the end of this page, after the casting instructions. */
    add("", quote);
  }
  add(T({ zh: "彖", en: "Tuan" }), data.tuan);
  add(T({ zh: "怎么起卦", en: "How to cast" }), EXPLAIN.HOW[game.lang]);
  var source = g.wrap(EXPLAIN.RULE_SOURCE[game.lang], width);
  for (var j = 0; j < source.length; j++) rows.push({ type: "text", text: source[j], color: g.DARK, height: lineHeight });
  return rows;
}
function updateGuaExplain(dt) {
  if (game.pressed("b") || game.pressed("select")) { guaExplain = false; guaExplainScroll = 0; guaScroller.offset = 0; sfx("tap"); return; }
  var rows = guaExplainRows(game.g), total = 0;
  for (var i = 0; i < rows.length; i++) total += rows[i].height;
  guaExplainScroll = scrollUpdate(guaExplainScroller, { x: 10, y: 27, w: 196, h: 174 }, total, dt, game.g.lineHeight || 14);
}
function drawGuaExplain(g) {
  g.clear(g.PAPER);
  g.rect(0, 0, W, 19, g.INK);
  g.text(T({ zh: "八卦 · 详解", en: "I Ching · More" }), CX, 2, { align: "center", color: g.PAPER });
  var rows = guaExplainRows(g), total = 0, area = { x: 10, y: 27, w: 196, h: 174 };
  for (var i = 0; i < rows.length; i++) total += rows[i].height;
  guaExplainScroller.max = Math.max(0, total - area.h);
  guaExplainScroll = guaExplainScroller.offset;
  g.clip(area.x, area.y, area.w, area.h);
  var y = area.y - guaExplainScroll;
  for (i = 0; i < rows.length; i++) {
    var row = rows[i];
    if (row.type !== "gap") g.text(row.text, 10, y, { color: row.color });
    y += row.height;
  }
  g.clip();
  drawScrollbar(g, guaExplainScroller, area, total);
  g.text(T({ zh: "↑↓ 读 · B/SELECT 返回", en: "↑↓ read · B/SELECT back" }), CX, 211, { align: "center", color: g.INK });
}

game.scene("counter", {
  enter: function () { section = "counter"; syncMotion(); },
  update: updateCounter,
  draw: drawCounter
});
game.scene("fortune", {
  enter: function () { section = "fortune"; slipScroll = 0; syncMotion(); },
  update: updateFortune,
  draw: drawFortune
});
game.scene("almanac", {
  enter: function () { section = "almanac"; almanacScroll = 0; almanacScroller.offset = 0; syncMotion(); },
  update: updateAlmanac,
  draw: drawAlmanac
});
game.scene("compass", {
  enter: function () { section = "compass"; syncMotion(); },
  update: function (dt) {
    if (game.pressed("b") && !panel) { backToCounter(); return; }
    update(dt);
  },
  draw: function (g) {
    var dt = shownDate(), p = pillarOf(dt);
    g.clear(g.PAPER);
    drawHeader(g, headerText(dt, p));
    drawPlate(g);
    drawDial(g, p.stem);
    drawVial(g);
    drawThreads(g);
    drawFaceMark(g);
    drawNotice(g);
    drawFaced(g, p.stem);
    g.text(keyLine(), CX, 212, { align: "center", color: g.DARK });
    g.text(HINT, CX, 226, { align: "center", color: g.DARK });
    if (panel) drawPanel(g, p.stem);
  }
});
game.scene("hexagram", {
  enter: function () { section = "hexagram"; guaScroll = 0; guaSkipped = false; guaChoice = 0; syncGuaDate(); syncMotion(); },
  update: updateHexagram,
  draw: function (g) { if (guaExplain) drawGuaExplain(g); else drawHexagram(g); }
});

readSlip();
readGua();
game.start("counter");
</script>
