/* the carved mural of 镇妖塔 middle floor: three wave lines wound into a ring, the centre broken off.
   Drawn as a sprite flat on the wall; made by a loop so the rings stay round. */
ART.mural = (function () {
  var N = 14, rows = [], c = (N - 1) / 2, y, x;
  for (y = 0; y < N; y++) {
    var row = "";
    for (x = 0; x < N; x++) {
      var dx = x - c, dy = y - c, d = Math.sqrt(dx * dx + dy * dy), a = Math.atan2(dy, dx);
      var wave = Math.sin(a * 5) * 0.3, ch = ".";
      if (Math.abs(d - 6.3 - wave) < 0.55 || Math.abs(d - 4.5 + wave) < 0.5 || Math.abs(d - 2.9 - wave) < 0.5) ch = "3";
      /* the centre has come away; a crack runs out of it and the ring is chipped there */
      if (d < 2.1 + Math.sin(a * 3 + 1) * 0.7) ch = (x + y) % 3 === 0 ? "1" : ".";
      if (a > 0.5 && a < 0.8 && d > 2.5) ch = ".";
      row += ch;
    }
    rows.push(row);
  }
  return LoGame.sprite(rows);
})();

/* the jade pendant (玉佩): the mural's pattern on a small round disc, as a sprite 11 pixels across. Ink rim, mid body,
   a ring of waves in dark, a paper highlight on the rim and an eye (ink with a paper pupil) at the centre. It must
   read at this size: it lies on the ground in the pendant scene and is the only bright thing there. */
ART.pendant = (function () {
  var N = 11, rows = [], c = (N - 1) / 2, y, x;
  for (y = 0; y < N; y++) {
    var row = "";
    for (x = 0; x < N; x++) {
      var dx = x - c, dy = y - c, d = Math.sqrt(dx * dx + dy * dy), a = Math.atan2(dy, dx), ch = ".";
      if (d <= 5.4) ch = d > 4.5 ? "0" : "2";
      /* a ring of waves, and the paper rim catching the light at the top left */
      if (d <= 4.5 && Math.abs(d - 3.5 - Math.sin(a * 4) * 0.3) < 0.55) ch = "1";
      if (d <= 4.5 && d > 3.9 && dx + dy < -2.5) ch = "3";
      if (d < 2.1) ch = Math.abs(dy) < 1 && Math.abs(dx) <= 1.5 ? (dx === 0 && dy === 0 ? "3" : "0") : (Math.abs(dy) < 1.6 && Math.abs(dx) < 2.1 ? "0" : "2");
      row += ch;
    }
    rows.push(row);
  }
  return LoGame.sprite(rows);
})();

/* The close-up of the hand in the ending (no text on it): the hero's palm in his wide sleeve, the jade pendant on it,
   and the fingers closing over it. Three full-screen frames (160 x 144), painted by code like the mural so the
   rings stay round: ART.hand[0] open, [1] half closed, [2] closed with the pattern just showing under the fingers.
   Painted with a few shape helpers into a tone array, then turned into sprites. */
ART.hand = (function () {
  var W = 160, H = 144, cv, BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  function put(x, y, t) { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < W && y < H) cv[y * W + x] = t; }
  function get(x, y) { return cv[y * W + x]; }
  /* fill where inside(x, y) holds, within a box */
  function fill(x0, y0, x1, y1, inside, t) {
    for (var y = Math.max(0, Math.floor(y0)); y <= Math.min(H - 1, Math.ceil(y1)); y++)
      for (var x = Math.max(0, Math.floor(x0)); x <= Math.min(W - 1, Math.ceil(x1)); x++) if (inside(x, y)) cv[y * W + x] = t;
  }
  function disc(cx, cy, r, t) { fill(cx - r, cy - r, cx + r, cy + r, function (x, y) { return (x - cx) * (x - cx) + (y - cy) * (y - cy) <= r * r; }, t); }
  function ell(cx, cy, rx, ry, t) { fill(cx - rx, cy - ry, cx + rx, cy + ry, function (x, y) { var u = (x - cx) / rx, v = (y - cy) / ry; return u * u + v * v <= 1; }, t); }
  /* a thick line with round ends */
  function cap(x0, y0, x1, y1, r, t) {
    var n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2) + 1;
    for (var i = 0; i <= n; i++) disc(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, r, t);
  }
  /* polygon, even-odd */
  function poly(pts, t) {
    var ys = pts.map(function (p) { return p[1]; }), y0 = Math.max(0, Math.floor(Math.min.apply(null, ys))), y1 = Math.min(H - 1, Math.ceil(Math.max.apply(null, ys)));
    for (var y = y0; y <= y1; y++) {
      var xs = [];
      for (var i = 0; i < pts.length; i++) {
        var a = pts[i], b = pts[(i + 1) % pts.length];
        if ((a[1] <= y && b[1] > y) || (b[1] <= y && a[1] > y)) xs.push(a[0] + (y - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
      }
      xs.sort(function (p, q) { return p - q; });
      for (var k = 0; k + 1 < xs.length; k += 2) for (var x = Math.round(xs[k]); x <= Math.round(xs[k + 1]); x++) put(x, y, t);
    }
  }
  /* a shape with an ink outline: grow it by one pixel in ink, then paint it */
  function inked(draw, grow) { draw(grow, 0); draw(0, null); }
  /* a dithered tone on the pixels of tone `over` where a Bayer threshold passes (level 0..16) */
  function shade(x0, y0, x1, y1, over, t, level) {
    for (var y = Math.max(0, y0); y < Math.min(H, y1); y++) for (var x = Math.max(0, x0); x < Math.min(W, x1); x++)
      if (cv[y * W + x] === over && BAYER[(y & 3) * 4 + (x & 3)] < level) cv[y * W + x] = t;
  }

  /* the pendant at 36 pixels across: ink rim, jade body, a paper rim, three wavy rings (as in the mural) and the eye */
  function pendant(cx, cy) {
    var R0 = 18;
    disc(cx, cy, R0, 0);
    disc(cx, cy, R0 - 1.2, 2);
    fill(cx - R0, cy - R0, cx + R0, cy + R0, function (x, y) {
      var dx = x - cx, dy = y - cy, d = Math.sqrt(dx * dx + dy * dy), a = Math.atan2(dy, dx), w = Math.sin(a * 5) * 0.7;
      return (Math.abs(d - 13.6 - w) < 0.8) || (Math.abs(d - 10 + w) < 0.75) || (Math.abs(d - 7 - w) < 0.75);
    }, 0);
    /* the paper rim, brightest at the top left */
    fill(cx - R0, cy - R0, cx + R0, cy + R0, function (x, y) {
      var dx = x - cx, dy = y - cy, d = Math.sqrt(dx * dx + dy * dy);
      return d > R0 - 2.6 && d <= R0 - 1.2 && dx + dy < 6;
    }, 3);
    /* the eye */
    ell(cx, cy, 4.2, 2.6, 0); ell(cx, cy, 2.4, 1.6, 3); disc(cx, cy, 0.9, 0);
    fill(cx - 4, cy - 4, cx + 4, cy + 4, function (x, y) { return x === cx - 1 && y === cy - 1; }, 3);
  }

  /* the sleeve: a wide cuff hanging round the wrist, widening as it falls, with folds that sway */
  function sleeve(lift) {
    var top = 102 + lift, edge = function (y, g) { var t = (y - top) / (H - top); return 31 + t * 62 + Math.sin(t * 5) * 3 + g; };
    for (var y = top; y < H; y++) {

    for (var yb = top + 1; yb < top + 6; yb++) for (var xb = 80 - 31; xb <= 80 + 31; xb++) put(xb, yb, yb === top + 1 ? 3 : 2);

    shade(46, top + 2, 114, top + 6, 2, 3, 6);
    /* folds: a dark line with a lit side, each fanning out from the cuff at its own pace */
    [[-26, 8], [-17, 14], [-8, 6], [3, 12], [13, 7], [22, 14], [30, 9]].forEach(function (f, i) {
      for (var yy = top + 7 + (i % 3) * 3; yy < H; yy++) {

  function palm(frame) {

    ell(80, 78, 28, 25, 3);

    var curl = [[62, 74], [74, 78], [88, 77], [98, 72]];

<script data-src="src/world.js">
/* The 3D world: turns a map (src/town.js) into lo-3d meshes, lights and colliders, and draws a frame.
   Tile (col, row) covers x in [col, col+1] and z in [-row-1, -row]: north is +z, away from the camera. */
var World = (function () {
  var builder = Lo3D.builder;
  var CHUNK = 4;

  /* a stable 0..1 number per tile, for texture and scattered trees */
  function hash(x, y) {
    var h = (x * 374761393 + y * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  /* low-poly pines; the forest outside the town gets the cheaper kind */
  function tree(m, x, z, s, cheap) {
    if (cheap) { m.cone(x, 0, z, 0.6 * s, 1.7 * s, 5, 0.42, 0.1); return; }
    m.cone(x, 0, z, 0.1, 0.6 * s, 3, 0.3, 0);
    m.cone(x, 0.35 * s, z, 0.62 * s, 0.85 * s, 6, 0.42, 0.08);
    m.cone(x, 0.85 * s, z, 0.45 * s, 0.75 * s, 5, 0.5, 0);
  }

  /* a seven-storey pagoda standing at (x, y, z), k times the town tower's size, into builder m.
     Returns the height of its top. The battle's ultimate drops a phantom copy of it. */
  function pagoda(m, x, y, z, k, alb) {
    for (var i = 0; i < 7; i++) {
      var s = (1.5 - i * 0.14) * k, hgt = (1.5 - i * 0.08) * k;
      m.box(x - s, y, z - s, x + s, y + hgt, z + s, alb ? alb[0] : 1.2, false);
      m.roof(x - s - 0.55 * k, z - s - 0.55 * k, x + s + 0.55 * k, z + s + 0.55 * k, y + hgt, 0.45 * k, 0.01, alb ? alb[1] : 0.2);
      y += hgt + 0.3 * k;
    }
    m.cone(x, y - 0.3 * k, z, 0.35 * k, 2.2 * k, 4, alb ? alb[1] : 0.3, 0.125);
    return y;
  }

  function build(def) {
    var rows = def.map, MW = rows[0].length, MH = rows.length;
    var at = function (c, r) { return r < 0 || r >= MH || c < 0 || c >= MW ? null : rows[r][c]; };
    var solid = {}, chunks = {}, glow = builder(), lights = [], spots = [];
    function chunk(c, r) {
      var k = Math.floor(c / CHUNK) + "," + Math.floor(r / CHUNK);
      if (!chunks[k]) { chunks[k] = builder(); chunks[k].cx = (Math.floor(c / CHUNK) + 0.5) * CHUNK; chunks[k].cz = -(Math.floor(r / CHUNK) + 0.5) * CHUNK; }
      return chunks[k];
    }
    function ground(m, c, r, alb) { m.quad([c, 0, -r], [c + 1, 0, -r], [c + 1, 0, -r - 1], [c, 0, -r - 1], [0, 1, 0], alb); }

    /* the map itself, plus a band of forest around it and a clearing for the tower up north */
    var T = def.tower, M = 7;
    for (var r = T.y - 6; r < MH + M; r++) for (var c = -M; c < MW + M; c++) {
      var ch = at(c, r), m = chunk(c, r), h = hash(c, r);
      if (ch === null) {
        var dt = Math.abs(c + 0.5 - T.x) + Math.abs(r + 0.5 - T.y);
        var road = r < 0 && (c === 11 || c === 12) && r > T.y + 2;
        ground(m, c, r, road ? 0.8 : 0.42 + h * 0.06);
        if (!road && dt > 5.5 && h < 0.4) tree(m, c + 0.3 + h * 0.4, -r - 0.3 - hash(r, c) * 0.4, 0.9 + h * 0.6, true);
        continue;
      }
      if (ch !== "#" && ch !== "D") ground(m, c, r, ch === "," ? 0.92 + h * 0.04 : ch === "W" ? 0.8 : 0.5 + h * 0.06);
      if (ch === "T") { tree(m, c + 0.5, -r - 0.5, 1 + h * 0.3); solid[c + "," + r] = 1; }
      if (ch === "L") {
        m.box(c + 0.44, 0, -r - 0.56, c + 0.56, 1.3, -r - 0.44, 0.2);
        glow.box(c + 0.33, 1.3, -r - 0.67, c + 0.67, 1.72, -r - 0.33, 0.9);
        lights.push({ x: c + 0.5, y: 1.5, z: -r - 0.5, radius: 3.6, power: 1.1, base: 1.1, seed: h * 10 });
        solid[c + "," + r] = 1;
      }
      if (ch === "#" || ch === "D" || ch === "W") solid[c + "," + r] = 1;
    }

    /* houses: each rectangle of # and D; the door is on the south wall */
    var seen = {};
    for (r = 0; r < MH; r++) for (c = 0; c < MW; c++) {
      if ("#D".indexOf(at(c, r)) < 0 || seen[c + "," + r]) continue;
      var w = 0, d = 0;
      while ("#D".indexOf(at(c + w, r) || ".") >= 0) w++;
      while ("#D".indexOf(at(c, r + d) || ".") >= 0) d++;
      for (var yy = 0; yy < d; yy++) for (var xx = 0; xx < w; xx++) seen[(c + xx) + "," + (r + yy)] = 1;
      var m2 = chunk(c, r), x0 = c + 0.05, x1 = c + w - 0.05, zN = -r - 0.05, zS = -r - d + 0.05, hh = 1.5 + (w * d > 12 ? 0.3 : 0);
      m2.box(x0, 0, zS, x1, hh, zN, 1.5, false);
      m2.box(x0 - 0.05, 0, zS - 0.05, x1 + 0.05, 0.2, zN + 0.05, 0.7, 0.7);    /* stone footing */
      m2.roof(x0 - 0.35, zS - 0.4, x1 + 0.35, zN + 0.4, hh, 1.0, (w - d) / 2 > 0 ? (w - d) / 2 : 0.01, 0.34);

      for (var row = 0; row < A.h; row++) {
        for (var col = 0; col < A.w; col++) {
          var tone = A.px[row * A.w + col], end = col;
          if (tone === 255) continue;
          while (end + 1 < A.w && A.px[row * A.w + end + 1] === tone) end++;
          var ya = y0 + (A.h - 1 - row) * k, xa = x0 + col * k, xb = x0 + (end + 1) * k, a = tone === 3 ? 0.5 : tone === 2 ? 0.14 : 0.02;
          glow.quad([xa, ya, z], [xb, ya, z], [xb, ya + k, z], [xa, ya + k, z], [0, 0, -1], a);
          col = end;
        }
      }
    });
    return {
      def: def, kind: kind, chunks: Object.keys(chunks).map(function (k) { return chunks[k]; }), glow: glow, far: far,
      lights: lights, solid: solid, width: W, height: H, chests: chestsList, pillars: pillars, parsed: P
    };
  }

  /* ---------- drawing ---------- */
  var KIND = {
    road: { sky: [0.1, 0.42], amb: 0.26, dif: 0.42, fog: 0.35, near: 3, far: 24 },
    tower: { sky: [0.02, 0.07], amb: 0.22, dif: 0.32, fog: 0.08, near: 2, far: 18 },
    roof: { sky: [0.14, 0.5], amb: 0.3, dif: 0.46, fog: 0.4, near: 3, far: 26 },
    /* the road at dawn (the ending): a pale sky, mist low over the ground, the lanterns nearly out */
    dawn: { sky: [0.5, 0.86], amb: 0.52, dif: 0.46, fog: 0.62, near: 4, far: 30 }
  };
  var STARS = [];
  for (var s = 0; s < 40; s++) STARS.push([hash(s, 7) * 120 - 50, 18 + hash(s, 9) * 30, 70 + hash(s, 3) * 20]);
  var SHADOW = Lo3D.shadow(0.36, 8);
  var MAX_LIGHTS = 12;

  /* view: {x, y, z, yaw, pitch, dist, time, weather, dawn}; dawn: the road in the morning, no rain, lamps at view.lamp.
     actors: [{art, x, z, y, flip, sh, scale, alpha, snap, noShadow}] (cutscene actors use the last four: a sprite that fades,
     a big close sprite, one that casts no shadow);
     st: {opened: {chest index: true}, hero: {x, z}, lights: [extra point lights], after: function (R) drawn after present} */
  function render(R, w, view, actors, st) {
    var cam = R.camera, K = view.dawn ? KIND.dawn : KIND[w.kind], t = view.time || 0, lamp = view.lamp == null ? 1 : view.lamp;
    cam.x = view.x; cam.y = view.y || 0; cam.z = view.z; cam.yaw = view.yaw || 0; cam.pitch = view.pitch; cam.dist = view.dist; cam.focal = 136;
    R.sun = { dir: Lo3D.norm([-0.4, 0.7, -0.6]), ambient: K.amb, diffuse: K.dif };
    R.fog = { near: view.dist + K.near, far: view.dist + K.far, lum: K.fog };
    R.focus = { near: view.dist - 4, far: view.dist + 9 };
    R.near = 0.3;
    /* the nearest few lights only: each costs per pixel */
    var ls = w.lights.map(function (L) {
      L.power = L.base * lamp * (0.86 + 0.14 * Math.sin(t * 11 + L.seed * 7) * Math.sin(t * 4.3 + L.seed));
      var dx = L.x - view.x, dz = L.z - view.z;
      L.d = dx * dx + dz * dz;
      return L;
    }).filter(function (L) { return L.d < 13 * 13; });
    if (ls.length > MAX_LIGHTS) ls = ls.sort(function (a, b) { return a.d - b.d; }).slice(0, MAX_LIGHTS);
    /* a cutscene's own lights (the pendant, a glow on the hand) come on top; at most two, so the budget of 14 holds */
    if (st && st.lights) ls = ls.concat(st.lights.slice(0, 2));
    R.lights = ls;
    R.clear(function (yy) { return K.sky[0] + (K.sky[1] - K.sky[0]) * Math.min(1, yy / 60); });
    w.chunks.forEach(function (m) {
      var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, h = CHUNK / 2 + 0.5;
      for (var i = 0; i < 8; i++) {
        var p = R.project([m.cx + (i & 1 ? h : -h), i & 2 ? m.top : 0, m.cz + (i & 4 ? h : -h)]);
        if (!p) { x0 = -1e9; x1 = 1e9; y0 = -1e9; y1 = 1e9; break; }
        x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]);
      }
      if (x1 >= 0 && x0 < R.width && y1 >= 0 && y0 < R.height && (m.cz - view.z) < view.dist + 22) R.draw(m);
    });
    if (w.far.t.length) R.draw(w.far);
    R.draw(w.glow, null, { bias: 0.5 });
    /* a pillar in front of the hero (within a few tiles south of him) turns see-through, or it would hide him */
    w.pillars.forEach(function (p) {
      var dz = st && st.hero ? st.hero.z - p.z : 99, dx = st && st.hero ? Math.abs(st.hero.x - p.x) : 99;
      if (p.z - view.z > view.dist + 14 || view.z - p.z > view.dist) return;

    });
    w.chests.forEach(function (c) { R.draw(st && st.opened && st.opened[c.i] ? c.open : c.closed); });
    actors.forEach(function (a) {
      if (a.noShadow) return;
      var fn = function (p) { var k = a.sh || 1; return [p[0] * k + a.x, p[1], p[2] * k + a.z]; };
      /* the shadow of something that is only half there is half there too */
      if (a.alpha != null && a.alpha < 1) R.draw(SHADOW, fn, { alpha: a.alpha }); else R.draw(SHADOW, fn);
    });
    actors.forEach(function (a) {
      var o = { scale: a.scale || 1 / 16, flip: a.flip, crisp: !a.snap };
      if (a.snap) o.snap = true;
      if (a.alpha != null && a.alpha < 1) o.alpha = a.alpha;
      R.sprite(a.art, a.x, a.y || 0, a.z, o);

    if (view.weather === "rain") Weather.rain(R, view, t);
    return R.image;
  }

  return { parse: parse, build: build, render: render };
})();

<script data-src="src/weather.js">
/* Rain on the mountain road: slanted streaks falling round the camera's target and a few splashes on the ground.
   Drawn after R.present(), so it goes straight into the tone image (mid and paper) and is only hidden behind nearer
   surfaces. No Math.random: every drop is World.hash of its number, moved by the frame time t, so a frame is
   the same every time it is replayed. */
var Weather = (function () {
  var hash = World.hash, DROPS = 34, SPLASH = 10, FALL = 7.5, SPEED = 11;
  /* view: {x, z} (what the camera looks at); t: seconds */
  function rain(R, view, t) {
    var i, x, z, y, q;
    for (i = 0; i < DROPS; i++) {
      x = view.x + (hash(i, 31) - 0.5) * 16;
      z = view.z + (hash(i, 32) - 0.3) * 15;
      q = (t * SPEED * (0.85 + hash(i, 33) * 0.3) + hash(i, 34) * FALL) % FALL;
      y = FALL - q;
      R.streak([x, y, z], [x - 0.14, y - 0.6, z], hash(i, 35) < 0.5 ? 2 : 3);
    }
    for (i = 0; i < SPLASH; i++) {
      x = view.x + (hash(i, 41) - 0.5) * 12;
      z = view.z + (hash(i, 42) - 0.3) * 11;
      q = (t * 2.6 + hash(i, 43)) % 1;
      if (q < 0.3) R.dot([x, 0.03, z], 3, q < 0.15 ? 0.1 : 0.22);
    }
  }
  return { rain: rain };
})();
</script>
<script data-src="src/cut.js">
/* Cutscenes: a clock of their own (tween, after, every, wait, flash, shake, sfx), like Battle.T in
   src/battle.js, so a scene the player has seen before can be cut short.
     Cut.play(key, fn)  runs fn(Cut.T). The first time it plays in full. After that A cuts it short:
                        every pending tween and timer finishes at once, new ones finish as they are made,
                        and a dialogue that is open closes. One press of A is the whole skip.
     Cut.say(pages)     the dialogue inside a cutscene: [{name, say: [lines]}]; it resolves at once while skipping.
   lo-game only updates the top scene, so while a dialogue is open the map scene's update does not run.
   That is why the skip is watched by a lo-game timer (those run under overlays), and the clock itself is stepped
   by the map scene: Cut.step(dt). Keys of cutscenes seen go into Cut.seen; main.js saves them with the game. */
var Cut = (function () {
  var EASE = {
    linear: function (t) { return t; },
    out: function (t) { return 1 - (1 - t) * (1 - t); },
    "in": function (t) { return t * t; },
    inOut: function (t) { return t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t); }
  };
  var tweens = [], timers = [], none = function () {};
  var skip = false, open = 0, playing = false;
  var self = { seen: {}, onDone: null };

  function settle(w) { for (var p in w.to) w.obj[p] = w.to[p]; w.done(); }
  var T = {
    tween: function (obj, to, sec, ease) {
      return new Promise(function (res) {
        var w = { obj: obj, from: {}, to: to, dur: Math.max(1 / 60, sec), t: 0, ease: EASE[ease || "out"] || EASE.out, done: res };
        for (var p in to) w.from[p] = obj[p];
        if (skip) settle(w); else tweens.push(w);
      });
    },
    after: function (sec, fn) {
      if (skip) { fn(); return none; }
      var t = { left: sec, fn: fn };
      timers.push(t);
      return function () { t.dead = true; };
    },
    /* repeating timers drive motion only; a cut drops them */
    every: function (sec, fn) {
      if (skip) return none;
      var t = { left: sec, every: sec, fn: fn };
      timers.push(t);
      return function () { t.dead = true; };
    },
    wait: function (sec) { return new Promise(function (res) { T.after(sec, res); }); },
    flash: function (sec) { if (!skip) game.flash(sec); },
    shake: function (a, sec) { if (!skip) game.shake(a, sec); },
    sfx: function (name) { if (!skip) game.sfx(name); }
  };

  /* called by the map scene's update, also while the scene is busy with a cutscene */
  self.step = function (dt) {
    tweens = tweens.filter(function (w) {
      w.t = Math.min(1, w.t + dt / w.dur);
      var k = w.ease(w.t);
      for (var p in w.to) w.obj[p] = w.from[p] + (w.to[p] - w.from[p]) * k;
      if (w.t >= 1) { w.done(); return false; }
      return true;
    });
    var due = [];
    timers = timers.filter(function (t) {
      if (t.dead) return false;
      t.left -= dt;
      if (t.left > 0) return true;
      due.push(t);
      if (t.every) { t.left += t.every; return true; }
      return false;
    });
    due.forEach(function (t) { if (!t.dead) t.fn(); });
  };
  /* leaving the scene: nothing may fire later */
  self.reset = function () { tweens = []; timers = []; skip = false; open = 0; playing = false; };

  function cut() {
    skip = true;
    var tw = tweens, tm = timers;
    tweens = []; timers = [];
    tw.forEach(settle);
    tm.forEach(function (t) { if (!t.dead && !t.every) t.fn(); });
    /* an open dialogue closes; its Cut.say resolves and the script runs on, skipping */
    while (open > 0) { open--; game.pop(); }
  }

  self.say = function (pages, o) {
    if (skip) return Promise.resolve();
    open++;
    return game.say(pages, o || {}).then(function () { if (open > 0) open--; });
  };
  /* [{name, say: [lines]}]: one box per page */
  self.dialogue = async function (pages) {
    for (var i = 0; i < pages.length; i++) await self.say(pages[i].say, pages[i].name ? { name: pages[i].name } : {});
  };

  self.skipping = function () { return skip; };
  self.playing = function () { return playing; };
  self.T = T;

  self.play = async function (key, fn) {
    var again = !!self.seen[key], stop = null;
    self.seen[key] = true;
    skip = false; playing = true;
    if (again) stop = game.every(1 / 60, function () { if (!skip && game.ok()) cut(); });
    try { await fn(T); }
    finally {
      if (stop) stop();
      skip = false; playing = false;
      if (self.onDone) self.onDone(key);
    }
  };
  return self;
})();
</script>

     save: a save point before this part, which also restores HP and MP. found: items picked up in this part. */
  ROUTE: [
    { area: "road", save: true, found: { pill: 1 }, fights: [["fox"], ["imp", "fox"], ["golem"], ["imp", "golem"], ["fox", "fox", "imp"]] },
    { area: "tower", save: true, found: { pill: 2, ether: 1 }, fights: [["wraith"], ["bronze"], ["wraith", "golem"]] },
    { area: "upper", save: true, found: { pill: 1, ether: 1 }, fights: [["bronze", "imp"], ["wraith", "wraith"], ["bronze", "wraith"]] },
    { area: "top", save: true, found: { pill: 2, ether: 2 }, fights: [["mirage"]] }
  ]
};
</script>
<script data-src="src/rules.js">
/* Battle rules: pure arithmetic over BATTLE (src/battle-data.js). No drawing, no input, no timers,
   so the same code runs in the game and in the Node simulator (tests/zhenyao-sim.mjs).
   rng is a function returning 0..1. Every action changes the state and returns a list of events
   for the battle scene to animate:
     {kind: "damage", side: "enemy"|"hero", target, amount, weak, crit}
     {kind: "heal", hp}  {kind: "mana", mp}  {kind: "defend"}  {kind: "flee", ok}
     {kind: "gather"}  (the boss is charging)  {kind: "down", target}  (an enemy falls) */
var Rules = (function () {
  var B = BATTLE;

  function stats(level) {
    var b = B.HERO.base, g = B.HERO.grow, n = level - 1;
    return {
      maxHp: Math.round(b.hp + g.hp * n), maxMp: Math.round(b.mp + g.mp * n),
      atk: Math.round(b.atk + g.atk * n), def: Math.round(b.def + g.def * n), mag: Math.round(b.mag + g.mag * n)
    };
  }
  function spellsAt(level) { return B.SPELL_ORDER.filter(function (id) { return B.SPELLS[id].level <= level; }); }
  function levelFor(xp) { var l = 1; while (l + 1 < B.XP.length && xp >= B.XP[l + 1]) l++; return l; }

  function newHero(level) {
    level = level || 1;
    var s = stats(level), items = {};
    Object.keys(B.START_ITEMS).forEach(function (k) { items[k] = B.START_ITEMS[k]; });
    return { level: level, xp: B.XP[level], hp: s.maxHp, mp: s.maxMp, items: items };
  }
  /* a save point: back to full */
  function rest(hero) { var s = stats(hero.level); hero.hp = s.maxHp; hero.mp = s.maxMp; }

  function enemy(id) {
    var d = B.ENEMIES[id];
    return { id: id, def: d, name: d.name, hp: d.hp, maxHp: d.hp, weak: weakTo(d.element), turns: 0, gathering: false };
  }
  /* the element that overcomes e */
  function weakTo(e) {
    var k = Object.keys(B.ELEMENTS).filter(function (x) { return B.ELEMENTS[x].beats === e; });
    return k[0] || null;
  }
  /* two enemies of the same kind get 甲/乙 after their names */
  function start(hero, ids) {
    var foes = ids.map(enemy), seen = {};
    foes.forEach(function (f) { seen[f.id] = (seen[f.id] || 0) + 1; });
    var n = {};
    foes.forEach(function (f) { if (seen[f.id] > 1) { n[f.id] = (n[f.id] || 0) + 1; f.name += "甲乙丙"[n[f.id] - 1]; } });
    return { hero: hero, foes: foes, defending: false, round: 0, boss: foes.some(function (f) { return f.def.boss; }) };
  }
  function alive(b) { return b.foes.filter(function (f) { return f.hp > 0; }); }
  /* "win", "lose", or null while the fight goes on (fleeing is reported by the flee event) */
  function result(b) { return b.hero.hp <= 0 ? "lose" : alive(b).length ? null : "win"; }

  function vary(rng) { return 0.9 + rng() * 0.2; }
  function hurt(b, f, amount, ev) {
    f.hp = Math.max(0, f.hp - amount);
    ev.target = b.foes.indexOf(f);
    var out = [ev];
    if (f.hp === 0) out.push({ kind: "down", target: ev.target });
    return out;
  }

  /* what a spell would do to one enemy, before the random spread: for menus and the simulator */
  function spellDamage(hero, spellId, f) {
    var sp = B.SPELLS[spellId], s = stats(hero.level);
    return sp.power * s.mag / 10 * (sp.element && sp.element === f.weak ? 2 : 1);
  }
  function canCast(hero, spellId) { return spellsAt(hero.level).indexOf(spellId) >= 0 && hero.mp >= B.SPELLS[spellId].mp; }

  /* action: {type: "attack", target} | {type: "spell", id, target} | {type: "item", id} | {type: "defend"} | {type: "flee"}
     target is an index into b.foes; "all" spells ignore it */
  function heroAct(b, action, rng) {
    var h = b.hero, s = stats(h.level), ev = [];
    b.defending = false;
    b.round++;
    if (action.type === "attack") {
      var f = b.foes[action.target];
      var crit = rng() < B.CRIT_CHANCE;
      var dmg = Math.max(1, Math.round(s.atk * vary(rng) * (crit ? 1.5 : 1) - f.def.def * 0.5));
      ev = hurt(b, f, dmg, { kind: "damage", side: "enemy", amount: dmg, weak: false, crit: crit });
    } else if (action.type === "spell") {
      var sp = B.SPELLS[action.id];
      if (!canCast(h, action.id)) throw new Error("cannot cast " + action.id);
      h.mp -= sp.mp;
      var targets = sp.target === "all" ? alive(b) : [b.foes[action.target]];
      targets.forEach(function (t) {
        var weak = !!sp.element && sp.element === t.weak;
        var d = Math.max(1, Math.round(sp.power * s.mag / 10 * vary(rng) * (weak ? 2 : 1)));
        ev = ev.concat(hurt(b, t, d, { kind: "damage", side: "enemy", amount: d, weak: weak, crit: false }));
      });
    } else if (action.type === "item") {
      var it = B.ITEMS[action.id];
      if (!(h.items[action.id] > 0)) throw new Error("no " + action.id);
      h.items[action.id]--;
      if (it.hp) { var hp = Math.min(it.hp, s.maxHp - h.hp); h.hp += hp; ev.push({ kind: "heal", hp: hp }); }
      if (it.mp) { var mp = Math.min(it.mp, s.maxMp - h.mp); h.mp += mp; ev.push({ kind: "mana", mp: mp }); }
    } else if (action.type === "defend") {
      b.defending = true;
      var g = Math.min(B.DEFEND_MP, s.maxMp - h.mp);
      h.mp += g;
      ev.push({ kind: "defend" }, { kind: "mana", mp: g });
    } else if (action.type === "flee") {
      var ok = !b.boss && rng() < B.FLEE_CHANCE;
      ev.push({ kind: "flee", ok: ok });
      if (ok) b.fled = true;
    }
    return ev;
  }

  /* enemy i takes its turn. Returns {move: name of what it did, fx, events} */
  function enemyAct(b, i, rng) {
    var f = b.foes[i], d = f.def, h = b.hero, s = stats(h.level);
    f.turns++;
    if (d.charge && !f.gathering && f.turns % d.charge.every === 0) {
      f.gathering = true;
      return { move: d.charge.gather, fx: "gather", gather: true, events: [{ kind: "gather", target: i }] };
    }
    var mult = 1, move = d.move, big = false;
    if (f.gathering) { f.gathering = false; mult = d.charge.mult; move = d.charge.move; big = true; }
    var dmg = Math.max(1, Math.round((d.atk * vary(rng) * mult - s.def * 0.5) * (b.defending ? 0.5 : 1)));
    h.hp = Math.max(0, h.hp - dmg);
    return { move: move, fx: big ? "tidal" : d.fx, big: big, events: [{ kind: "damage", side: "hero", target: i, amount: dmg, weak: false, crit: big }] };
  }

  /* after a win: experience from every enemy. Returns [{level, learned: [spell ids]}] for each level gained */
  function reward(b) {
    var h = b.hero, xp = 0;
    b.foes.forEach(function (f) { xp += f.def.xp; });
    var before = h.level;
    h.xp += xp;
    var ups = [];
    for (var l = before + 1; l <= levelFor(h.xp); l++) {
      var old = stats(l - 1), now = stats(l);
      h.hp += now.maxHp - old.maxHp; h.mp += now.maxMp - old.maxMp;
      ups.push({ level: l, learned: B.SPELL_ORDER.filter(function (id) { return B.SPELLS[id].level === l; }) });
    }
    h.level = levelFor(h.xp);
    return { xp: xp, ups: ups };
  }

  return {
    stats: stats, spellsAt: spellsAt, levelFor: levelFor, newHero: newHero, rest: rest, weakTo: weakTo,
    start: start, alive: alive, result: result, heroAct: heroAct, enemyAct: enemyAct, reward: reward,
    spellDamage: spellDamage, canCast: canCast
  };
})();
</script>
<script data-src="src/fx.js">
/* Battle effects: particles, timed layers, and post-processing on the lo-3d tone image (R.image.px).
   They live in this game, not in lo-3d: no other app needs them yet, and a lo-3d release is permanent,
   so the API should be proven by a second user first.
   A layer is {life, draw(R, t), lights(t), dots(R, t), post(px, t)}; every part is optional, t counts up from 0. */
var FX = (function () {
  var W = 160, H = 144, tmp = new Uint8Array(W * H);
  var BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  var parts = [], layers = [];

  /* ---------- post-processing: px is a W*H array of tones 0-3 ---------- */
  function invert(px) { for (var i = 0; i < px.length; i++) px[i] = 3 - px[i]; }
  /* raster wave: each row slides sideways, like heat haze or a scanline effect on old hardware */
  function wave(px, amp, freq, phase, y0, y1) {
    tmp.set(px);
    y0 = Math.max(0, y0 || 0); y1 = Math.min(H, y1 == null ? H : y1);
    for (var y = y0; y < y1; y++) {
      var s = Math.round(amp * Math.sin(y * freq + phase)), row = y * W;
      if (!s) continue;
      for (var x = 0; x < W; x++) { var sx = x - s; px[row + x] = tmp[row + (sx < 0 ? 0 : sx >= W ? W - 1 : sx)]; }
    }
  }
  /* zoom by k around (cx, cy); nearest pixel, so it stays crisp */
  function zoom(px, k, cx, cy) {
    if (Math.abs(k - 1) < 0.01) return;
    tmp.set(px);
    for (var y = 0; y < H; y++) {
      var sy = Math.round(cy + (y - cy) / k); sy = sy < 0 ? 0 : sy >= H ? H - 1 : sy;
      for (var x = 0; x < W; x++) {
        var sx = Math.round(cx + (x - cx) / k); sx = sx < 0 ? 0 : sx >= W ? W - 1 : sx;
        px[y * W + x] = tmp[sy * W + sx];
      }
    }
  }
  /* big square pixels of size n */
  function mosaic(px, n) {
    n = Math.max(1, Math.round(n));
    if (n < 2) return;
    for (var y = 0; y < H; y += n) for (var x = 0; x < W; x += n) {
      var v = px[Math.min(H - 1, y + (n >> 1)) * W + Math.min(W - 1, x + (n >> 1))];
      for (var yy = y; yy < Math.min(H, y + n); yy++) for (var xx = x; xx < Math.min(W, x + n); xx++) px[yy * W + xx] = v;
    }
  }
  /* cover a fraction f (0..1) of the pixels with one tone, in Bayer order: a dithered fade */
  function cover(px, tone, f, x0, y0, x1, y1) {
    var th = f * 16;
    if (th <= 0) return;
    x0 = x0 || 0; y0 = y0 || 0; x1 = x1 == null ? W : x1; y1 = y1 == null ? H : y1;
    for (var y = y0; y < y1; y++) for (var x = x0; x < x1; x++) if (BAYER[(y & 3) * 4 + (x & 3)] < th) px[y * W + x] = tone;
  }
  /* n lines from radius r0 to r1 around (cx, cy): speed lines for a hit on the weakness */
  function rays(px, cx, cy, r0, r1, n, tone, rot) {
    for (var i = 0; i < n; i++) {
      var a = rot + i / n * Math.PI * 2 + (i % 3) * 0.07, c = Math.cos(a), s = Math.sin(a);
      var len = r1 - (i % 2) * (r1 - r0) * 0.35;
      for (var r = r0; r < len; r += 0.7) {
        var x = Math.round(cx + c * r), y = Math.round(cy + s * r);
        if (x >= 0 && y >= 0 && x < W && y < H) px[y * W + x] = tone;
      }
    }
  }
  /* a dithered disc of light or dark around (cx, cy), stronger at the centre */
  function glow(px, cx, cy, r, tone, k) {
    for (var y = Math.max(0, Math.floor(cy - r)); y < Math.min(H, cy + r); y++) for (var x = Math.max(0, Math.floor(cx - r)); x < Math.min(W, cx + r); x++) {
      var d = Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy)) / r;
      if (d < 1 && BAYER[(y & 3) * 4 + (x & 3)] < (1 - d) * 16 * k) px[y * W + x] = tone;
    }
  }

  /* ---------- particles: {x, y, z, vx, vy, vz, life, tone, size, grav, drag, trail} ---------- */
  function spawn(p) {
    p.age = 0; p.vx = p.vx || 0; p.vy = p.vy || 0; p.vz = p.vz || 0;
    p.life = p.life || 1; p.tone = p.tone == null ? 3 : p.tone;
    parts.push(p);
    return p;
  }
  function emit(n, fn) { for (var i = 0; i < n; i++) spawn(fn(i, Math.random())); }
  /* a ball of n particles flying out from a point */
  function burst(x, y, z, n, speed, o) {
    o = o || {};
    emit(n, function () {
      var a = Math.random() * Math.PI * 2, e = Math.random() * 2 - 1, s = speed * (0.4 + Math.random() * 0.6), c = Math.sqrt(1 - e * e);
      return { x: x, y: y, z: z, vx: Math.cos(a) * c * s, vy: e * s + (o.up || 0), vz: Math.sin(a) * c * s,
        life: (o.life || 0.6) * (0.6 + Math.random() * 0.6), tone: o.tone, size: o.size || 0, grav: o.grav || 0, drag: o.drag || 0, trail: o.trail };
    });
  }
  function stepParts(dt) {
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.age += dt;
      if (p.age >= p.life) { parts.splice(i, 1); continue; }
      p.px = p.x; p.py = p.y; p.pz = p.z;
      if (p.drag) { var k = Math.max(0, 1 - p.drag * dt); p.vx *= k; p.vy *= k; p.vz *= k; }
      p.vy -= (p.grav || 0) * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.floor != null && p.y < p.floor) { p.y = p.floor; p.vy = -p.vy * 0.3; p.vx *= 0.6; p.vz *= 0.6; }
    }
  }
  function drawParts(R) {
    parts.forEach(function (p) {
      /* blink out over the last fifth of a life */
      if (p.age > p.life * 0.8 && (Math.floor(p.age * 30) & 1)) return;
      if (p.trail) R.streak([p.x - p.vx * p.trail, p.y - p.vy * p.trail, p.z - p.vz * p.trail], [p.x, p.y, p.z], p.tone);
      else R.dot([p.x, p.y, p.z], p.tone, p.size);
    });
  }

  /* ---------- layers ---------- */
  /* returns a function that removes the layer; its .layer is the layer itself (for its clock, .t) */
  function layer(o) {
    o.t = 0; layers.push(o);
    var remove = function () { var i = layers.indexOf(o); if (i >= 0) layers.splice(i, 1); };
    remove.layer = o;
    return remove;
  }
  /* frozen: a hit-stop; only layers marked always (the hit-stop itself) move on */
  function step(dt, frozen) {
    if (!frozen) stepParts(dt);
    for (var i = layers.length - 1; i >= 0; i--) {
      var L = layers[i];
      if (frozen && !L.always) continue;
      L.t += dt;
      if (L.life && L.t >= L.life) layers.splice(i, 1);
    }
  }
  function each(name, a, b) { layers.forEach(function (L) { if (L[name]) L[name](a, L.t, b); }); }
  function lights() {
    var out = [];
    layers.forEach(function (L) { if (L.lights) out = out.concat(L.lights(L.t) || []); });
    return out;
  }
  function reset() { parts.length = 0; layers.length = 0; }

  /* ---------- small meshes ---------- */
  /* a flying-sword blade along +z, from the hilt (z -0.3) to the tip (z 0.55); diamond in section so it shows from any side.
     Two meshes, because each is drawn in a fixed tone (lo-3d `tone`): the blade in paper, the hilt and guard in dark and mid.
     Fixed tones keep the sword readable on any background, so the scene does not have to be darkened around it. */
  var BLADE_V = [[0, 0, 0.55], [0.08, 0, 0.1], [0, 0.08, 0.1], [-0.08, 0, 0.1], [0, -0.08, 0.1], [0, 0, -0.3], [0.17, 0, 0.06], [-0.17, 0, 0.06], [0, 0, 0.0]];
  var BLADE = { v: BLADE_V, t: [[0, 2, 1], [0, 3, 2], [0, 4, 3], [0, 1, 4]], two: true };
  var HILT = { v: BLADE_V, t: [[5, 1, 2], [5, 2, 3], [5, 3, 4], [5, 4, 1]], two: true };
  var GUARD = { v: BLADE_V, t: [[6, 8, 7], [6, 7, 8]], two: true };
  /* model -> world for a mesh pointing along d (unit vector), scaled by s, at p */
  function aim(p, d, s, spin) {
    var yaw = Math.atan2(d[0], d[2]), pitch = -Math.asin(Math.max(-1, Math.min(1, d[1])));
    return function (q) {
      var v = Lo3D.rotY(Lo3D.rotX(Lo3D.rotZ([q[0] * s, q[1] * s, q[2] * s], spin || 0), pitch), yaw);
      return [v[0] + p[0], v[1] + p[1], v[2] + p[2]];
    };
  }
  function at(p, s, ry) {
    return function (q) {
      var v = ry ? Lo3D.rotY(q, ry) : q;
      return [v[0] * s + p[0], v[1] * s + p[1], v[2] * s + p[2]];
    };
  }
  /* ---------- ribbon trails ---------- */
  /* Keep the last few positions of a moving thing: push(hist, p, n) adds p (unless it has not moved) and keeps n. */
  function push(hist, p, n) {
    var q = hist[hist.length - 1];
    if (q && Math.abs(q[0] - p[0]) + Math.abs(q[1] - p[1]) + Math.abs(q[2] - p[2]) < 1e-3) return;
    hist.push(p.slice());
    if (hist.length > n) hist.shift();
  }
  /* A trail drawn as a lo-3d ribbon along the recent positions (oldest first), tapering to nothing at the tail.
     The band always faces the camera (its `up` is the direction to the eye), so it never turns edge-on, and it is
     one-sided in lo-3d, hence `two: true`. The older half is drawn at alpha 0.5, the newer half solid: a fade
     built from two ribbons. `tone` keeps it paper white on any background (no darkening needed behind it). */
  function trail(R, hist, width, tone) {
    var n = hist.length;
    if (n < 3) return;
    var c = R.camera, up = Lo3D.rotY(Lo3D.rotX([0, 0, -1], -c.pitch), c.yaw), mid = n >> 1;
    [[0, mid, 0.5], [mid, n - 1, 1]].forEach(function (h) {
      var path = hist.slice(h[0], h[1] + 1);
      if (path.length < 2) return;
      var m = Lo3D.builder().ribbon(path, function (t) { return width * (h[0] + t * (h[1] - h[0])) / (n - 1); }, 1, up);
      R.draw(m, null, { tone: tone == null ? 3 : tone, alpha: h[2], two: true });
    });
  }
  var BALL = Lo3D.ico(1), CUBE = Lo3D.box(1, 1, 1);

  return {
    W: W, H: H, invert: invert, wave: wave, zoom: zoom, mosaic: mosaic, cover: cover, rays: rays, glow: glow,
    spawn: spawn, emit: emit, burst: burst, drawParts: drawParts, parts: parts,
    layer: layer, step: step, each: each, lights: lights, reset: reset,
    BLADE: BLADE, HILT: HILT, GUARD: GUARD, push: push, trail: trail, BALL: BALL, CUBE: CUBE, aim: aim, at: at
  };
})();
</script>
<script data-src="src/battle.js">
/* The battle scene: a 3D arena, the HUD and menus, and the turn loop. The rules are in src/rules.js;
   what every move looks like is in src/spells.js.
   game.go("battle", {ids, area, hero, back, from}) starts a fight. hero is a Rules hero (it is changed in place);
   from is a copy of the last frame, for the transition. When the fight ends it goes to args.back with
   {result: "win" | "lose" | "fled", hero}. */
var Battle = (function () {
  var S = null, ARENAS = {};
  var SKY = { road: [0.1, 0.42], tower: [0.04, 0.16], upper: [0.04, 0.16], top: [0.16, 0.5] };
  var HOME = { x: 0, y: 0, z: 1.0, yaw: -0.4, pitch: -0.17, dist: 6.6, focal: 124 };

  /* ---------- the animation clock ----------
     Battle animations wait and tween on this clock instead of lo-game's, so an animation the player has
     seen before can be cut short: cut() finishes every pending tween and timer at once, and while
     S.skip is set new ones finish as soon as they start. The rules have settled the result already. */
  var EASE = {
    linear: function (t) { return t; },
    out: function (t) { return 1 - (1 - t) * (1 - t); },
    "in": function (t) { return t * t; },
    inOut: function (t) { return t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t); }
  };
  var tweens = [], timers = [], none = function () {};
  var skipping = function () { return !!(S && S.skip); };
  function settle(w) { for (var p in w.to) w.obj[p] = w.to[p]; w.done(); }
  var T = {
    tween: function (obj, to, sec, ease) {
      return new Promise(function (res) {
        var w = { obj: obj, from: {}, to: to, dur: Math.max(1 / 60, sec), t: 0, ease: EASE[ease || "out"] || EASE.out, done: res };
        for (var p in to) w.from[p] = obj[p];
        if (skipping()) settle(w); else tweens.push(w);
      });
    },
    after: function (sec, fn) {
      if (skipping()) { fn(); return none; }
      var t = { left: sec, fn: fn };
      timers.push(t);
      return function () { t.dead = true; };
    },
    /* repeating timers drive motion only; a cut drops them */
    every: function (sec, fn) {
      if (skipping()) return none;
      var t = { left: sec, every: sec, fn: fn };
      timers.push(t);
      return function () { t.dead = true; };
    },
    wait: function (sec) { return new Promise(function (res) { T.after(sec, res); }); },
    flash: function (sec) { if (!skipping()) game.flash(sec); },

    for (x = -12; x < 12; x++) for (z = -12; z < 12; z++) {

        var ids = Rules.spellsAt(hero.level);
        var items = ids.map(function (id) {
          var sp = BATTLE.SPELLS[id];
          return { text: sp.name, right: String(sp.mp),
            info: (sp.element ? BATTLE.ELEMENTS[sp.element].name + " · " : "五行 · ") + (sp.target === "all" ? "全体" : "单体"),
            off: hero.mp < sp.mp };
        });
        for (;;) {
          var k = await chooseList(items, S.lastSpell || 0);
          if (k < 0) break;
          S.lastSpell = k;
          var sp = BATTLE.SPELLS[ids[k]];
          var tg = await chooseTarget(sp.target === "all");
          if (tg >= 0) return { type: "spell", id: ids[k], target: tg };
        }
      } else if (cmd === "item") {
        var its = BATTLE.ITEM_ORDER.map(function (id) {
          var it = BATTLE.ITEMS[id];
          return { text: it.name, right: "x" + (hero.items[id] || 0), info: it.hp ? "回复体力 " + it.hp : "回复法力 " + it.mp, off: !(hero.items[id] > 0) };
        });
        var j = await chooseList(its, 0);
        if (j >= 0) return { type: "item", id: BATTLE.ITEM_ORDER[j] };
      } else if (cmd === "defend") return { type: "defend" };
      else if (cmd === "flee") {
        if (S.b.boss) { game.sfx("err"); await say("逃不掉！", 0.8); continue; }
        return { type: "flee" };
      }
    }
  }
  async function say(text, sec) { S.menu = null; S.msg = text; await T.wait(sec == null ? 0.9 : sec); S.msg = ""; }

  async function run() {
    var args = S.args, b = S.b;
    await ANIM.intro(S, args.from);
    if (b.boss) await ANIM.bossIntro(S);
    await say(b.boss ? b.foes[0].name + "现身了！" : b.foes.length === 1 ? b.foes[0].name + "出现了！" : "出现了" + "一两三"[b.foes.length - 1] + "只妖怪！", 1.1);
    var result = null;
    while (!result) {
      var act = await heroTurn();
      S.menu = null;
      S.guard = 0;
      /* leaving 演武 always works */
      var ev = Rules.heroAct(b, act, args.demo && act.type === "flee" ? function () { return 0; } : Math.random);
      if (act.type === "spell") await play("spell:" + act.id, function () { return ANIM.hero(S, act, ev); });
      else await ANIM.hero(S, act, ev);
      if (b.fled) { result = "fled"; break; }
      result = Rules.result(b);
      if (b.defending) S.guard = 1;
      for (var i = 0; i < b.foes.length && !result && !args.demo; i++) {
        if (b.foes[i].hp <= 0) continue;
        var r = Rules.enemyAct(b, i, Math.random);
        await play("foe:" + r.move, function () { return ANIM.enemy(S, i, r); });
        result = Rules.result(b);
      }
    }
    S.menu = null; S.guard = 0;
    if (result === "win") await ANIM.victory(S, Rules.reward(b));
    else if (result === "lose") await ANIM.defeat(S);
    game.go(args.back || "title", Object.assign({ result: result, hero: b.hero }, args.backArgs || {}), { to: LoGame.INK });
  }

  /* main.js registers this as the "battle" scene once the game exists */
  var scene = {
    enter: function (args) { setup(args); run(); },
    update: function (dt) {
      if (S.canSkip && !S.skip && game.ok()) cut();
      stepClock(dt);
      if (S.frozen > 0) S.frozen -= dt;
      FX.step(dt, S.frozen > 0);
      S.nums = S.nums.filter(function (n) { n.t += dt; return n.t < n.life; });
      S.foes.forEach(function (f) { if (f.flash > 0) f.flash -= dt; });
      if (S.hero.flash > 0) S.hero.flash -= dt;
      if (S.poll) S.poll();
    },
    draw: function (g) { render(g); }
  };

  return {
    scene: scene, T: T, S: function () { return S; }, foeTop: foeTop, heroAt: heroAt, camTo: camTo, home: home, look: look,
    popup: popup, show: show, say: say, HOME: HOME,
    /* the animations seen; main.js saves them and merges the saved ones back in at boot */
    seen: function () { return SEEN; }
  };
})();
</script>
<script data-src="src/spells.js">
/* What every battle move looks like. Each animation is an async script: it moves the camera, adds
   FX layers and particles, and calls Battle.show(events) at the moment of impact, so numbers appear
   when the hit lands. The rules have already decided the outcome; nothing here changes it. */
var ANIM = (function () {
  var B = Battle, T = Battle.T, wait = T.wait;
  var PI = Math.PI;
  function clamp01(t) { return t < 0 ? 0 : t > 1 ? 1 : t; }
  function smooth(t) { t = clamp01(t); return t * t * (3 - 2 * t); }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  /* a point along a curve from a over c to b */
  function bez(a, c, b, t) { return mix(mix(a, c, t), mix(c, b, t), t); }
  function targets(ev) {
    var out = [];
    ev.forEach(function (e) { if (e.kind === "damage" && e.side === "enemy" && out.indexOf(e.target) < 0) out.push(e.target); });
    return out;
  }
  /* the middle of the enemy line, on the ground */
  function centre(S) {
    var x = 0, z = 0, n = 0;
    S.foes.forEach(function (f) { if (!f.gone) { x += f.x; z += f.z; n++; } });
    return n ? [x / n, 0, z / n] : [0, 0, 2.5];
  }
  function cast(S, on) { S.hero.pose = on ? B_ART.heroCast : null; }
  function title(S, text, sec) { S.title = text; T.after(sec || 1.2, function () { if (S.title === text) S.title = ""; }); }

  /* ---------- into the fight ---------- */
  async function intro(S, from) {
    var H = B.HOME, pic = from ? new Uint8Array(from) : null;
    Object.assign(S.cam, { yaw: H.yaw + 2.6, pitch: -0.8, dist: 19, y: 2.5 });
    S.hud = false;
    T.sfx("hit");
    T.after(0.3, function () { T.sfx("tick"); });
    T.after(0.55, function () { T.sfx("tick"); });
    /* the last picture twists, breaks into blocks, flashes twice and goes dark; then the arena fades in */
    FX.layer({ life: 1.6, always: true, post: function (px, t) {
      if (t < 0.85) {
        if (pic) px.set(pic);
        FX.wave(px, t * 16, 0.16, t * 28);
        FX.mosaic(px, 1 + t * 10);
        if ((t > 0.28 && t < 0.36) || (t > 0.55 && t < 0.63)) FX.invert(px);
        FX.cover(px, 0, (t - 0.55) / 0.3);
      } else FX.cover(px, 0, 1 - (t - 0.85) / 0.6);
    } });
    await wait(0.85);
    await B.camTo(H, 1.5, "out");
    S.hud = true;
  }

  async function bossIntro(S) {
    var p = B.foeTop(0, 0.6), H = B.HOME;
    S.hud = false;
    await T.tween(S, { bars: 1 }, 0.3);
    B.look(p, H.yaw + 0.5, 0.1, 6, 1.6, "inOut");
    /* mist rising around the shell */
    for (var k = 0; k < 4; k++) T.after(k * 0.3, function () {
      FX.emit(14, function () { var a = Math.random() * PI * 2; return { x: Math.cos(a) * 2.6, y: 0.2, z: 3.6 + Math.sin(a) * 1.4, vy: 0.6 + Math.random(), vx: Math.cos(a) * 0.3, life: 1.6, tone: 2, size: 0.12 }; });
    });
    await wait(1.7);
    T.sfx("lose");
    T.shake(3, 0.6);
    FX.layer({ life: 0.6, post: function (px, t) { FX.wave(px, 3 * (1 - t / 0.6), 0.3, t * 30); } });
    await wait(0.8);
    await B.home(0.8);
    await T.tween(S, { bars: 0 }, 0.3);
    S.hud = true;
  }

  /* ---------- hits ---------- */
  /* a hit on the weakness: the picture stops, flashes negative, and lines burst from the target */
  async function weak(S, i) {
    S.frozen = 0.3;
    T.sfx("coin");
    T.shake(3, 0.35);
    FX.layer({ life: 0.32, always: true, post: function (px, t) {
      var q = R.project(B.foeTop(i));
      if (t < 0.15) FX.invert(px);
      if (q) FX.rays(px, q[0], q[1], 12 + t * 50, 40 + t * 140, 18, t < 0.15 ? 3 : 0, i + t);
    } });
    await wait(0.32);
  }
  function down(S, i) {
    var f = S.foes[i];
    f.dying = true;
    /* lo-3d `alpha`: the foe fades out over the fall (Battle's render draws its sprite at alpha 1 - f.fade) instead of
       blinking; a cut to the result settles the tween, and the timer below removes it as before */
    T.tween(f, { fade: 1 }, 0.45, "linear");
    T.after(0.45, function () {
      f.gone = true; f.dying = false;
      var p = B.foeTop(i, 0.5);
      FX.burst(p[0], p[1], p[2], f.boss ? 90 : 26, f.boss ? 4 : 2.4, { tone: 3, life: 0.8, drag: 2 });
      FX.burst(p[0], p[1], p[2], f.boss ? 40 : 12, 1.4, { tone: 1, life: 0.9, drag: 1 });
      T.sfx("tick");
    });
  }

  /* ---------- the hero ---------- */
  async function attack(S, i, ev) {
    var h = S.hero, f = S.foes[i], x0 = h.x, z0 = h.z, H = B.HOME;
    B.camTo({ x: f.x * 0.5, z: 0.4, dist: 6.6, yaw: H.yaw + 0.2 }, 0.35);
    h.art = ART.heroUp1;
    T.sfx("move");
    await T.tween(h, { x: f.x - 0.25, z: f.z - 1.2 }, 0.28, "in");
    var c = B.foeTop(i, 0.5);
    FX.layer({ life: 0.22, dots: function (R, t) {
      var k = clamp01(t / 0.08);
      for (var s = -1; s <= 1; s++) R.streak([c[0] - 0.6 + s * 0.2, c[1] + 0.6, c[2] - 0.3], mix([c[0] - 0.6 + s * 0.2, c[1] + 0.6, c[2] - 0.3], [c[0] + 0.6 + s * 0.2, c[1] - 0.6, c[2] - 0.3], k), 3);
    } });
    FX.burst(c[0], c[1], c[2] - 0.2, 14, 3, { tone: 3, life: 0.3, trail: 0.05 });
    T.shake(2, 0.15);
    await B.show(ev);
    await T.tween(h, { x: x0, z: z0 }, 0.3, "out");
    h.art = ART.heroUp0;
    await B.home(0.35);
  }

  async function item(S, ev, id) {
    var h = S.hero, mana = id === "ether";
    title(S, BATTLE.ITEMS[id].name, 1.4);
    B.camTo({ x: h.x, y: 0.9, z: h.z + 0.5, yaw: B.HOME.yaw + PI * 0.85, dist: 4.6, pitch: -0.12 }, 0.5);
    await wait(0.4);
    T.sfx("coin");
    /* pills: light rises out of the ground; mana: motes are drawn in from all around */
    FX.emit(36, function (k, r) {
      var a = k / 36 * PI * 2, rad = mana ? 1.8 : 0.5;
      var p = { x: h.x + Math.cos(a) * rad, y: mana ? 0.3 + r * 1.4 : 0.05, z: h.z + Math.sin(a) * rad, life: 0.9 + r * 0.3, tone: 3, size: 0 };
      if (mana) { p.vx = -Math.cos(a) * 2; p.vz = -Math.sin(a) * 2; p.vy = 0.3; p.tone = 2; } else { p.vy = 1 + r * 1.5; p.vx = -Math.sin(a) * 0.4; p.vz = Math.cos(a) * 0.4; }
      return p;
    });
    FX.layer({ life: 1.0, lights: function (t) { return [{ x: h.x, y: 0.8, z: h.z - 0.4, radius: 3, power: 1.2 * Math.sin(t / 1.0 * PI) }]; } });
    await wait(0.6);
    await B.show(ev);
    await wait(0.4);
    await B.home(0.5);
  }

  async function defend(S, ev) {
    var h = S.hero;
    title(S, "防御", 1.0);
    T.sfx("tap");
    FX.emit(24, function (k) { var a = k / 24 * PI * 2; return { x: h.x, y: 0.5, z: h.z, vx: Math.cos(a) * 2.2, vz: Math.sin(a) * 1.4, life: 0.4, tone: 3, drag: 4 }; });
    await wait(0.3);
    await B.show(ev);
    await wait(0.3);
  }

  async function flee(S, ok) {
    var h = S.hero, z0 = h.z;
    h.art = ART.heroDown0;
    T.sfx("move");
    await T.tween(h, { z: ok ? -7 : -3.6 }, ok ? 0.6 : 0.35, "in");
    if (ok) { await B.say("逃走了。", 0.8); return; }
    T.sfx("err");
    T.shake(1, 0.2);
    h.art = ART.heroUp0;
    await T.tween(h, { z: z0 }, 0.25, "out");
    await B.say("没能逃掉！", 0.8);
  }

  /* ---------- spells ---------- */
  var SPELL = {};

  /* 飞剑诀: a halo of swords fans out behind the hero, facing the camera, then they fly at the target one by one */
  SPELL.sword = async function (S, ev) {
    var i = targets(ev)[0], h = S.hero, H = B.HOME, n = 8, swords = [];
    var yaw = H.yaw - 0.55, right = [Math.cos(yaw), 0, -Math.sin(yaw)], fwd = [Math.sin(yaw), 0, Math.cos(yaw)];
    var hub = [h.x + fwd[0] * 0.35, 1.25, h.z + fwd[2] * 0.35];
    cast(S, true);
    B.look([h.x, 1.15, h.z], yaw, -0.06, 4.0, 0.5);
    for (var k = 0; k < n; k++) swords.push({ a: k / n * PI * 2, fly: -1 });
    var L = FX.layer({
      draw: function (R, t) {
        var open = smooth(t / 0.45), turn = t * 1.2;
        swords.forEach(function (s, k) {
          if (s.done) return;
          var pos, dir;
          if (s.fly < 0) {
            var a = s.a + turn, c = Math.cos(a), sn = Math.sin(a), rad = 0.25 + open * 0.75;
            dir = [right[0] * c, sn, right[2] * c];
            pos = [hub[0] + dir[0] * rad, hub[1] + dir[1] * rad, hub[2] + dir[2] * rad];
            if (k === Math.floor(t * 20) % n) FX.spawn({ x: pos[0], y: pos[1], z: pos[2], vy: -0.6, life: 0.35, tone: 3 });
          } else {
            var u = clamp01((t - s.fly) / 0.32), tc = B.foeTop(i, 0.55), top = mix(s.from, tc, 0.5);
            top[1] += 1.6;
            pos = bez(s.from, top, tc, u);
            dir = Lo3D.norm(Lo3D.sub(bez(s.from, top, tc, Math.min(1, u + 0.05)), pos));
            if (u >= 1) { s.done = true; FX.burst(tc[0], tc[1], tc[2] - 0.3, 8, 2.5, { tone: 3, life: 0.3, trail: 0.04 }); T.shake(1, 0.08); return; }
            /* lo-3d `ribbon` (+ tone): a streak along the last positions instead of dot particles; it follows the
               blade exactly, so it does not lag behind the way a puff of particles does */
            s.hist = s.hist || [];
            FX.push(s.hist, pos, 8);
            FX.trail(R, s.hist, 0.32, 3);
          }
          s.pos = pos;
          /* lo-3d `tone`: the blade is drawn in fixed tones (paper blade, dark hilt, mid guard), so it reads on any
             background and the scene is no longer dimmed to make it stand out */
          var aimed = FX.aim(pos, dir, 1.5);
          R.draw(FX.BLADE, aimed, { tone: 3 });
          R.draw(FX.HILT, aimed, { tone: 1 });
          R.draw(FX.GUARD, aimed, { tone: 2 });
        });
      },
      lights: function () { return [{ x: hub[0], y: hub[1], z: hub[2] - 0.3, radius: 3.2, power: 0.9 }]; }
    });
    T.sfx("ok");
    await wait(1.0);
    B.look(B.foeTop(i, 0.4), H.yaw + 0.75, -0.16, 5.6, 0.55);
    for (k = 0; k < n; k++) {
      swords[k].from = swords[k].pos;
      swords[k].fly = L.layer.t;   /* launch now, on the layer's clock */
      if (k % 3 === 0) T.sfx("tick");
      await wait(0.07);
    }
    await wait(0.3);
    T.flash(0.05);
    await B.show(ev);
    cast(S, false);
    await wait(0.25);
    L();
    await B.home(0.5);
  };

  /* 寒潮: a wave sweeps from behind the hero across the enemies, then everything frosts over */
  SPELL.tide = async function (S, ev) {
    var H = B.HOME, front = -6, crest = 0;
    cast(S, true);
    B.camTo({ x: 0, y: 1.0, z: 0.8, yaw: H.yaw + 1.0, pitch: -0.26, dist: 9 }, 0.6);
    /* two meshes on one grid of points: the crest (the first row of quads, u = 0) and the body of the wave */
    var GRID = (function () {
      var v = [], crest = [], body = [], X = 14, U = 5;
      for (var u = 0; u <= U; u++) for (var x = 0; x <= X; x++) v.push([-7 + x, u / U, 0]);
      for (u = 0; u < U; u++) for (x = 0; x < X; x++) {
        var a = u * (X + 1) + x, b = a + 1, d = a + X + 1, e = d + 1;
        (u === 0 ? crest : body).push([a, b, e], [a, e, d]);
      }
      return { crest: { v: v, t: crest, two: true }, body: { v: v, t: body, c: body.map(function () { return 0.4; }), two: true } };
    })();
    var L = FX.layer({
      draw: function (R, t) {
        if (crest <= 0.01) return;
        var shape = function (p) {
          /* u = 0 is the crest, u = 1 the back of the wave; the crest leans forward */
          var u = p[1], hgt = crest * Math.pow(Math.sin(PI * (0.15 + u * 0.85)), 0.8) * (1 + 0.15 * Math.sin(p[0] * 1.3 + t * 9));
          return [p[0], hgt, front - u * 2.4 + (1 - u) * 0.5 * crest];
        };
        /* lo-3d `alpha`: the body of the wave is see-through water (the arena shows through it), and `tone` keeps the
           crest solid paper. Before, the wave was an opaque dark mesh and the whole scene was darkened around it. */
        R.draw(GRID.body, shape, { bias: 0.08, alpha: 0.5 });
        R.draw(GRID.crest, shape, { tone: 3 });
      },
      post: function (px, t) { if (S.ripple) FX.wave(px, S.ripple, 0.22, t * 14); }
    });
    T.sfx("ok");
    await wait(0.4);
    S.ripple = 0;
    /* the wave rises and runs forward */
    var hitDone = false, spray = T.every(0.05, function () {
      if (crest < 0.3) return;
      FX.emit(6, function () { return { x: -6 + Math.random() * 12, y: crest * 0.95, z: front + 0.3, vx: (Math.random() - 0.5), vy: 1.5 + Math.random() * 2, vz: 1.5, grav: 6, life: 0.6, tone: 3 }; });
    });
    var run = { f: front, c: 0 };
    var go = T.tween(run, { f: 7.5 }, 1.5, "linear");
    T.tween(run, { c: 3.0 }, 0.5, "out");
    var tick = T.every(1 / 60, function () {
      front = run.f; crest = run.c;
      if (!hitDone && front > 2.2) { hitDone = true; S.ripple = 3; T.shake(2, 0.4); B.show(ev); T.tween(S, { ripple: 0 }, 1.2, "linear"); }
    });
    await go;
    tick(); spray();
    crest = 0;
    /* frost: ice shards on every target, the picture whitens for a moment */
    T.sfx("tick");
    targets(ev).forEach(function (i) {
      var c = B.foeTop(i, 0.3);
      FX.burst(c[0], c[1], c[2], 18, 1.8, { tone: 3, life: 0.7, drag: 2.5 });
    });
    var ice = FX.layer({ life: 0.8, draw: function (R, t) {
      targets(ev).forEach(function (i, n) {
        var f = S.foes[i], s = smooth(t / 0.15) * (1 - smooth((t - 0.6) / 0.2));
        for (var k = 0; k < 4; k++) {
          var a = k / 4 * PI * 2 + n;
          /* `tone`: ice is paper white whatever is behind it (the scene is not darkened any more) */
          R.draw(FX.CUBE, (function (p) {
            var q = Lo3D.rotY(Lo3D.rotZ([p[0] * 0.18 * s, p[1] * 1.0 * s, p[2] * 0.18 * s], 0.35), a);
            return [q[0] + f.x + Math.cos(a) * 0.45, q[1] + 0.35 * s, q[2] + f.z + Math.sin(a) * 0.3];
          }), { tone: 3 });
        }
      });
    }, post: function (px, t) { FX.cover(px, 3, 0.35 * Math.sin(clamp01(t / 0.8) * PI)); } });
    await wait(0.8);
    L();
    cast(S, false);
    await B.home(0.5);
  };

  /* 青藤缚: vines spiral up around every enemy, squeeze, and pull back into the ground */
  SPELL.vine = async function (S, ev) {
    var H = B.HOME, tg = targets(ev), grow = { h: 0, r: 0.9, out: 0 };
    cast(S, true);
    /* a low camera drifting across from the right, so the hero does not stand in the way */
    B.camTo({ x: 0.3, y: 1.0, z: 1.8, pitch: -0.08, dist: 7.6 }, 0.5);
    T.tween(S.cam, { yaw: H.yaw + 0.75 }, 2.8, "inOut");
    T.sfx("ok");
    /* the ground cracks first */
    tg.forEach(function (i) {
      var f = S.foes[i];
      FX.emit(16, function (k) { var a = k / 16 * PI * 2; return { x: f.x + Math.cos(a) * 0.3, y: 0.02, z: f.z + Math.sin(a) * 0.3, vx: Math.cos(a) * 1.4, vz: Math.sin(a) * 1.4, drag: 3, life: 0.7, tone: 0, size: 0.06 }; });
    });
    T.shake(1, 0.3);
    var L = FX.layer({ draw: function (R, t) {
      if (grow.h < 0.04) return;
      tg.forEach(function (i, n) {
        var f = S.foes[i], top = f.art.h * f.scale * 1.05;
        for (var v = 0; v < 3; v++) {
          /* lo-3d `tube`: one smooth, tapering vine per spiral (13 points, 5 sides) instead of a chain of cubes, which
             was a dozen draws per vine and stayed blocky. The path is rebuilt every frame as it grows and squeezes;
             the radius function thins it towards the tip. */
          var path = [];
          for (var k = 0; k <= 12; k++) {
            var u = grow.h * k / 12, a = v / 3 * PI * 2 + u * 7 + n, rad = grow.r * (1 - u * 0.35) + grow.out;
