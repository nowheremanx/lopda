<script data-src="src/world.js">
/* The 3D world: turns a map (src/town.js) into lo-3d meshes, lights and colliders, and draws a frame.
   Tile (col, row) covers x in [col, col+1] and z in [-row-1, -row]: north is +z, away from the camera. */
var World = (function () {
  var sub = Lo3D.sub, cross = Lo3D.cross, dot = Lo3D.dot;
  var CHUNK = 4;

  /* a stable 0..1 number per tile, for texture and scattered trees */
  function hash(x, y) {
    var h = (x * 374761393 + y * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  /* a mesh under construction; every face is wound so it is seen from the side `out` points to */
  function builder() {
    var m = { v: [], t: [], c: [] };
    m.tri = function (a, b, c, out, alb) {
      var i = m.v.length;
      m.v.push(a, b, c);
      m.t.push(dot(cross(sub(b, a), sub(c, a)), out) <= 0 ? [i, i + 1, i + 2] : [i, i + 2, i + 1]);
      m.c.push(alb);
    };
    m.quad = function (a, b, c, d, out, alb) { m.tri(a, b, c, out, alb); m.tri(a, c, d, out, alb); };
    /* an axis-aligned box from (x0,y0,z0) to (x1,y1,z1); no bottom, top optional */
    m.box = function (x0, y0, z0, x1, y1, z1, alb, top) {
      m.quad([x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], [0, 0, -1], alb);
      m.quad([x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1], [0, 0, 1], alb);
      m.quad([x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0], [-1, 0, 0], alb);
      m.quad([x1, y0, z0], [x1, y0, z1], [x1, y1, z1], [x1, y1, z0], [1, 0, 0], alb);
      if (top !== false) m.quad([x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1], [0, 1, 0], top == null || top === true ? alb : top);
    };
    /* an n-sided cone standing at (x, y, z) */
    m.cone = function (x, y, z, r, h, n, alb, turn) {
      for (var i = 0; i < n; i++) {
        var a0 = (i / n + (turn || 0)) * Math.PI * 2, a1 = ((i + 1) / n + (turn || 0)) * Math.PI * 2, am = (a0 + a1) / 2;
        m.tri([x + Math.cos(a0) * r, y, z + Math.sin(a0) * r], [x + Math.cos(a1) * r, y, z + Math.sin(a1) * r], [x, y + h, z],
          [Math.cos(am), r / h, Math.sin(am)], alb);
      }
    };
    /* a four-sided roof: from a w x d rectangle at height y, rising to a ridge (ridge > 0) or a point */
    m.roof = function (x0, z0, x1, z1, y, h, ridge, alb) {
      var xm = (x0 + x1) / 2, zm = (z0 + z1) / 2, r = ridge || 0;
      var A = [xm - r, y + h, zm], B = [xm + r, y + h, zm];
      m.quad([x0, y, z0], [x1, y, z0], B, A, [0, 1, -1], alb);
      m.quad([x0, y, z1], [x1, y, z1], B, A, [0, 1, 1], alb);
      m.tri([x0, y, z0], [x0, y, z1], A, [-1, 1, 0], alb);
      m.tri([x1, y, z0], [x1, y, z1], B, [1, 1, 0], alb);
    };
    return m;
  }

  /* low-poly pines; the forest outside the town gets the cheaper kind */
  function tree(m, x, z, s, cheap) {
    if (cheap) { m.cone(x, 0, z, 0.6 * s, 1.7 * s, 5, 0.42, 0.1); return; }
    m.cone(x, 0, z, 0.1, 0.6 * s, 3, 0.3, 0);
    m.cone(x, 0.35 * s, z, 0.62 * s, 0.85 * s, 6, 0.42, 0.08);
    m.cone(x, 0.85 * s, z, 0.45 * s, 0.75 * s, 5, 0.5, 0);
  }

  /* a seven-storey pagoda standing at (x, y, z), k times the town tower's size, into builder m.
     Returns the height of its top. The battle's ultimate drops a phantom copy of it. */
  function pagoda(m, x, y, z, k, alb) {
    for (var i = 0; i < 7; i++) {
      var s = (1.5 - i * 0.14) * k, hgt = (1.5 - i * 0.08) * k;
      m.box(x - s, y, z - s, x + s, y + hgt, z + s, alb ? alb[0] : 1.2, false);
      m.roof(x - s - 0.55 * k, z - s - 0.55 * k, x + s + 0.55 * k, z + s + 0.55 * k, y + hgt, 0.45 * k, 0.01, alb ? alb[1] : 0.2);
      y += hgt + 0.3 * k;
    }
    m.cone(x, y - 0.3 * k, z, 0.35 * k, 2.2 * k, 4, alb ? alb[1] : 0.3, 0.125);
    return y;
  }

  function build(def) {
    var rows = def.map, MW = rows[0].length, MH = rows.length;
    var at = function (c, r) { return r < 0 || r >= MH || c < 0 || c >= MW ? null : rows[r][c]; };
    var solid = {}, chunks = {}, glow = builder(), lights = [], spots = [];
    function chunk(c, r) {
      var k = Math.floor(c / CHUNK) + "," + Math.floor(r / CHUNK);
      if (!chunks[k]) { chunks[k] = builder(); chunks[k].cx = (Math.floor(c / CHUNK) + 0.5) * CHUNK; chunks[k].cz = -(Math.floor(r / CHUNK) + 0.5) * CHUNK; }
      return chunks[k];
    }
    function ground(m, c, r, alb) { m.quad([c, 0, -r], [c + 1, 0, -r], [c + 1, 0, -r - 1], [c, 0, -r - 1], [0, 1, 0], alb); }

    /* the map itself, plus a band of forest around it and a clearing for the tower up north */
    var T = def.tower, M = 7;
    for (var r = T.y - 6; r < MH + M; r++) for (var c = -M; c < MW + M; c++) {
      var ch = at(c, r), m = chunk(c, r), h = hash(c, r);
      if (ch === null) {
        var dt = Math.abs(c + 0.5 - T.x) + Math.abs(r + 0.5 - T.y);
        var road = r < 0 && (c === 11 || c === 12) && r > T.y + 2;
        ground(m, c, r, road ? 0.8 : 0.42 + h * 0.06);
        if (!road && dt > 5.5 && h < 0.4) tree(m, c + 0.3 + h * 0.4, -r - 0.3 - hash(r, c) * 0.4, 0.9 + h * 0.6, true);
        continue;
      }
      if (ch !== "#" && ch !== "D") ground(m, c, r, ch === "," ? 0.92 + h * 0.04 : ch === "W" ? 0.8 : 0.5 + h * 0.06);
      if (ch === "T") { tree(m, c + 0.5, -r - 0.5, 1 + h * 0.3); solid[c + "," + r] = 1; }
      if (ch === "L") {
        m.box(c + 0.44, 0, -r - 0.56, c + 0.56, 1.3, -r - 0.44, 0.2);
        glow.box(c + 0.33, 1.3, -r - 0.67, c + 0.67, 1.72, -r - 0.33, 0.9);
        lights.push({ x: c + 0.5, y: 1.5, z: -r - 0.5, radius: 3.6, power: 1.1, base: 1.1, seed: h * 10 });
        solid[c + "," + r] = 1;
      }
      if (ch === "#" || ch === "D" || ch === "W") solid[c + "," + r] = 1;
    }

    /* houses: each rectangle of # and D; the door is on the south wall */
    var seen = {};
    for (r = 0; r < MH; r++) for (c = 0; c < MW; c++) {
      if ("#D".indexOf(at(c, r)) < 0 || seen[c + "," + r]) continue;
      var w = 0, d = 0;
      while ("#D".indexOf(at(c + w, r) || ".") >= 0) w++;
      while ("#D".indexOf(at(c, r + d) || ".") >= 0) d++;
      for (var yy = 0; yy < d; yy++) for (var xx = 0; xx < w; xx++) seen[(c + xx) + "," + (r + yy)] = 1;
      var m2 = chunk(c, r), x0 = c + 0.05, x1 = c + w - 0.05, zN = -r - 0.05, zS = -r - d + 0.05, hh = 1.5 + (w * d > 12 ? 0.3 : 0);
      m2.box(x0, 0, zS, x1, hh, zN, 1.5, false);
      m2.box(x0 - 0.05, 0, zS - 0.05, x1 + 0.05, 0.2, zN + 0.05, 0.7, 0.7);    /* stone footing */
      m2.roof(x0 - 0.35, zS - 0.4, x1 + 0.35, zN + 0.4, hh, 1.0, (w - d) / 2 > 0 ? (w - d) / 2 : 0.01, 0.34);
      for (xx = 0; xx < w; xx++) {
        var cx = c + xx + 0.5;
        if (at(c + xx, r + d - 1) === "D") {
          m2.quad([cx - 0.3, 0, zS - 0.01], [cx + 0.3, 0, zS - 0.01], [cx + 0.3, 1.0, zS - 0.01], [cx - 0.3, 1.0, zS - 0.01], [0, 0, -1], 0.12);
          spots.push({ x: c + xx, y: r + d - 1, say: ["门关着。"] });
        } else if (xx % 2 === 1) {
          /* a lit paper window, and the glow it throws on the street */
          glow.quad([cx - 0.25, 0.65, zS - 0.01], [cx + 0.25, 0.65, zS - 0.01], [cx + 0.25, 1.1, zS - 0.01], [cx - 0.25, 1.1, zS - 0.01], [0, 0, -1], 0.75);
          lights.push({ x: cx, y: 0.9, z: zS - 0.6, radius: 1.8, power: 0.55, base: 0.55, seed: cx });
        }
      }
    }

    /* the well in the square */
    var wl = def.map.join("\n").split("\n");
    for (r = 0; r < MH; r++) { c = wl[r].indexOf("WW"); if (c >= 0) break; }
    var wm = chunk(c, r), wx = c + 1, wz = -r - 1;
    wm.box(wx - 0.8, 0, wz - 0.8, wx + 0.8, 0.55, wz + 0.8, 1.1, false);
    wm.quad([wx - 0.8, 0.55, wz - 0.8], [wx + 0.8, 0.55, wz - 0.8], [wx + 0.8, 0.55, wz + 0.8], [wx - 0.8, 0.55, wz + 0.8], [0, 1, 0], 0.05);
    wm.box(wx - 0.75, 0.55, wz - 0.06, wx - 0.6, 1.6, wz + 0.06, 0.25);
    wm.box(wx + 0.6, 0.55, wz - 0.06, wx + 0.75, 1.6, wz + 0.06, 0.25);
    wm.roof(wx - 1.0, wz - 0.6, wx + 1.0, wz + 0.6, 1.6, 0.5, 0.6, 0.22);

    /* the tower, and a light at the top */
    var tw = builder(), tx = T.x, tz = -T.y;
    tw.box(tx - 2.2, 0, tz - 2.2, tx + 2.2, 0.5, tz + 2.2, 0.4);
    var y = pagoda(tw, tx, 0.5, tz, 1);
    glow.box(tx - 0.25, y - 1.6, tz - 1.0, tx + 0.25, y - 1.1, tz - 0.99, 1);
    lights.push({ x: tx, y: y - 1.3, z: tz - 1.6, radius: 3, power: 0.8, base: 0.8, seed: 3 });

    var list = Object.keys(chunks).map(function (k) { return chunks[k]; });
    return { def: def, chunks: list, glow: glow, tower: tw, lights: lights, solid: solid, spots: spots, width: MW, height: MH };
  }

  /* far-off points for stars: fixed positions, drawn over the sky only */
  var STARS = [];
  for (var s = 0; s < 40; s++) STARS.push([hash(s, 7) * 120 - 50, 18 + hash(s, 9) * 30, 70 + hash(s, 3) * 20]);
  var SHADOW = (function () { var m = builder(); m.cone(0, 0.03, 0, 0.36, 0.0001, 8, 0.02); return m; })();

  /* draw a frame. view: {x, y, z (what the camera looks at), yaw, pitch, dist, time}; actors: [{art, x, z, flip}] */
  function render(R, w, view, actors) {
    var cam = R.camera;
    cam.x = view.x; cam.y = view.y || 0; cam.z = view.z; cam.yaw = view.yaw || 0; cam.pitch = view.pitch; cam.dist = view.dist; cam.focal = 136;
    R.sun = { dir: Lo3D.norm([-0.4, 0.7, -0.6]), ambient: 0.3, diffuse: 0.5 };
    R.fog = { near: view.dist + 3, far: view.dist + 24, lum: 0.5 };
    R.focus = { near: view.dist - 4, far: view.dist + 9 };
    R.near = 0.3;
    /* lanterns flicker; only lights near the camera's target are worth their per-pixel cost */
    var t = view.time || 0;
    R.lights = w.lights.filter(function (L) {
      L.power = L.base * (0.86 + 0.14 * Math.sin(t * 11 + L.seed * 7) * Math.sin(t * 4.3 + L.seed));
      var dx = L.x - view.x, dz = L.z - view.z;
      return dx * dx + dz * dz < 13 * 13 || L.y > 5;
    });
    R.clear(function (yy) { return 0.12 + 0.38 * Math.min(1, yy / 60); });
    /* a chunk is drawn when the screen rectangle of its box (ground to treetops) overlaps the screen */
    w.chunks.forEach(function (m) {
      var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, h = CHUNK / 2 + 0.5;
      for (var i = 0; i < 8; i++) {
        var p = R.project([m.cx + (i & 1 ? h : -h), i & 2 ? 3 : 0, m.cz + (i & 4 ? h : -h)]);
        if (!p) { x0 = -1e9; x1 = 1e9; y0 = -1e9; y1 = 1e9; break; }
        x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]);
      }
      if (x1 >= 0 && x0 < R.width && y1 >= 0 && y0 < R.height && (m.cz - view.z) < view.dist + 22) R.draw(m);
    });
    R.draw(w.tower);
    R.draw(w.glow, null, { bias: 0.5 });
    actors.forEach(function (a) { R.draw(SHADOW, function (p) { return [p[0] + a.x, p[1], p[2] + a.z]; }); });
    actors.forEach(function (a) { R.sprite(a.art, a.x, 0, a.z, { scale: 1 / 16, flip: a.flip, crisp: true }); });
    R.present();
    STARS.forEach(function (p, i) { if ((i * 7 + Math.floor(t * 2)) % 23) R.dot([p[0] + view.x, p[1], p[2] + view.z], 3, 0); });
    return R.image;
  }

  return { build: build, render: render, hash: hash, builder: builder, tree: tree, pagoda: pagoda };
})();
</script>

<script data-src="src/rules.js">
/* Battle rules: pure arithmetic over BATTLE (src/battle-data.js). No drawing, no input, no timers,
   so the same code runs in the game and in the Node simulator (tests/zhenyao-sim.mjs).
   rng is a function returning 0..1. Every action changes the state and returns a list of events
   for the battle scene to animate:
     {kind: "damage", side: "enemy"|"hero", target, amount, weak, crit}
     {kind: "heal", hp}  {kind: "mana", mp}  {kind: "defend"}  {kind: "flee", ok}
     {kind: "gather"}  (the boss is charging)  {kind: "down", target}  (an enemy falls) */
var Rules = (function () {
  var B = BATTLE;

  function stats(level) {
    var b = B.HERO.base, g = B.HERO.grow, n = level - 1;
    return {
      maxHp: Math.round(b.hp + g.hp * n), maxMp: Math.round(b.mp + g.mp * n),
      atk: Math.round(b.atk + g.atk * n), def: Math.round(b.def + g.def * n), mag: Math.round(b.mag + g.mag * n)
    };
  }
  function spellsAt(level) { return B.SPELL_ORDER.filter(function (id) { return B.SPELLS[id].level <= level; }); }
  function levelFor(xp) { var l = 1; while (l + 1 < B.XP.length && xp >= B.XP[l + 1]) l++; return l; }

  function newHero(level) {
    level = level || 1;
    var s = stats(level), items = {};
    Object.keys(B.START_ITEMS).forEach(function (k) { items[k] = B.START_ITEMS[k]; });
    return { level: level, xp: B.XP[level], hp: s.maxHp, mp: s.maxMp, items: items };
  }
  /* a save point: back to full */
  function rest(hero) { var s = stats(hero.level); hero.hp = s.maxHp; hero.mp = s.maxMp; }

  function enemy(id) {
    var d = B.ENEMIES[id];
    return { id: id, def: d, name: d.name, hp: d.hp, maxHp: d.hp, weak: weakTo(d.element), turns: 0, gathering: false };
  }
  /* the element that overcomes e */
  function weakTo(e) {
    var k = Object.keys(B.ELEMENTS).filter(function (x) { return B.ELEMENTS[x].beats === e; });
    return k[0] || null;
  }

  function start(hero, ids) {

    foes.forEach(function (f) { seen[f.id] = (seen[f.id] || 0) + 1; });
    var n = {};
    foes.forEach(function (f) { if (seen[f.id] > 1) { n[f.id] = (n[f.id] || 0) + 1; f.name += "甲乙丙"[n[f.id] - 1]; } });
    return { hero: hero, foes: foes, defending: false, round: 0, boss: foes.some(function (f) { return f.def.boss; }) };
  }

      targets.forEach(function (t) {
        var weak = !!sp.element && sp.element === t.weak;
        var d = Math.max(1, Math.round(sp.power * s.mag / 10 * vary(rng) * (weak ? 2 : 1)));
        ev = ev.concat(hurt(b, t, d, { kind: "damage", side: "enemy", amount: d, weak: weak, crit: false }));
      });
    } else if (action.type === "item") {
      var it = B.ITEMS[action.id];
      if (!(h.items[action.id] > 0)) throw new Error("no " + action.id);
      h.items[action.id]--;
      if (it.hp) { var hp = Math.min(it.hp, s.maxHp - h.hp); h.hp += hp; ev.push({ kind: "heal", hp: hp }); }
      if (it.mp) { var mp = Math.min(it.mp, s.maxMp - h.mp); h.mp += mp; ev.push({ kind: "mana", mp: mp }); }
    } else if (action.type === "defend") {
      b.defending = true;
      var g = Math.min(B.DEFEND_MP, s.maxMp - h.mp);
      h.mp += g;
      ev.push({ kind: "defend" }, { kind: "mana", mp: g });
    } else if (action.type === "flee") {
      var ok = !b.boss && rng() < B.FLEE_CHANCE;
      ev.push({ kind: "flee", ok: ok });
      if (ok) b.fled = true;
    }
    return ev;
  }

  /* enemy i takes its turn. Returns {move: name of what it did, fx, events} */
  function enemyAct(b, i, rng) {
    var f = b.foes[i], d = f.def, h = b.hero, s = stats(h.level);
    f.turns++;
    if (d.charge && !f.gathering && f.turns % d.charge.every === 0) {
      f.gathering = true;
      return { move: d.charge.gather, fx: "gather", gather: true, events: [{ kind: "gather", target: i }] };
    }
    var mult = 1, move = d.move, big = false;
    if (f.gathering) { f.gathering = false; mult = d.charge.mult; move = d.charge.move; big = true; }
    var dmg = Math.max(1, Math.round((d.atk * vary(rng) * mult - s.def * 0.5) * (b.defending ? 0.5 : 1)));
    h.hp = Math.max(0, h.hp - dmg);
    return { move: move, fx: big ? "tidal" : d.fx, big: big, events: [{ kind: "damage", side: "hero", target: i, amount: dmg, weak: false, crit: big }] };
  }

  /* after a win: experience from every enemy. Returns [{level, learned: [spell ids]}] for each level gained */
  function reward(b) {
    var h = b.hero, xp = 0;
    b.foes.forEach(function (f) { xp += f.def.xp; });
    var before = h.level;
    h.xp += xp;
    var ups = [];
    for (var l = before + 1; l <= levelFor(h.xp); l++) {
      var old = stats(l - 1), now = stats(l);
      h.hp += now.maxHp - old.maxHp; h.mp += now.maxMp - old.maxMp;

    }
    h.level = levelFor(h.xp);
    return { xp: xp, ups: ups };
  }

  return {
    stats: stats, spellsAt: spellsAt, levelFor: levelFor, newHero: newHero, rest: rest, weakTo: weakTo,
    start: start, alive: alive, result: result, heroAct: heroAct, enemyAct: enemyAct, reward: reward,
    spellDamage: spellDamage, canCast: canCast
  };
})();
</script>
<script data-src="src/fx.js">
/* Battle effects: particles, timed layers, and post-processing on the lo-3d tone image (R.image.px).
   They live in this game, not in lo-3d: no other app needs them yet, and a lo-3d release is permanent,
   so the API should be proven by a second user first.
   A layer is {life, draw(R, t), lights(t), dots(R, t), post(px, t)}; every part is optional, t counts up from 0. */

  var W = 160, H = 144, tmp = new Uint8Array(W * H);

      for (var x = 0; x < W; x++) { var sx = x - s; px[row + x] = tmp[row + (sx < 0 ? 0 : sx >= W ? W - 1 : sx)]; }

      var sy = Math.round(cy + (y - cy) / k); sy = sy < 0 ? 0 : sy >= H ? H - 1 : sy;
      for (var x = 0; x < W; x++) {
        var sx = Math.round(cx + (x - cx) / k); sx = sx < 0 ? 0 : sx >= W ? W - 1 : sx;
        px[y * W + x] = tmp[sy * W + sx];

    n = Math.max(1, Math.round(n));

      var v = px[Math.min(H - 1, y + (n >> 1)) * W + Math.min(W - 1, x + (n >> 1))];
      for (var yy = y; yy < Math.min(H, y + n); yy++) for (var xx = x; xx < Math.min(W, x + n); xx++) px[yy * W + xx] = v;

    for (var y = y0; y < y1; y++) for (var x = x0; x < x1; x++) if (BAYER[(y & 3) * 4 + (x & 3)] < th) px[y * W + x] = tone;
  }

  function rays(px, cx, cy, r0, r1, n, tone, rot) {
    for (var i = 0; i < n; i++) {
      var a = rot + i / n * Math.PI * 2 + (i % 3) * 0.07, c = Math.cos(a), s = Math.sin(a);
      var len = r1 - (i % 2) * (r1 - r0) * 0.35;
      for (var r = r0; r < len; r += 0.7) {
        var x = Math.round(cx + c * r), y = Math.round(cy + s * r);

    parts.forEach(function (p) {

      if (p.age > p.life * 0.8 && (Math.floor(p.age * 30) & 1)) return;
      if (p.trail) R.streak([p.x - p.vx * p.trail, p.y - p.vy * p.trail, p.z - p.vz * p.trail], [p.x, p.y, p.z], p.tone);

  /* ---------- layers ---------- */
  /* returns a function that removes the layer; its .layer is the layer itself (for its clock, .t) */
  function layer(o) {
    o.t = 0; layers.push(o);

  /* ---------- small meshes ---------- */
  /* a flying-sword blade along +z, from the hilt (z -0.3) to the tip (z 0.55); diamond in section so it shows from any side */

    v: [[0, 0, 0.55], [0.08, 0, 0.1], [0, 0.08, 0.1], [-0.08, 0, 0.1], [0, -0.08, 0.1], [0, 0, -0.3], [0.17, 0, 0.06], [-0.17, 0, 0.06], [0, 0, 0.0]],
    t: [[0, 2, 1], [0, 3, 2], [0, 4, 3], [0, 1, 4], [5, 1, 2], [5, 2, 3], [5, 3, 4], [5, 4, 1], [6, 8, 7], [6, 7, 8]],
    c: [1.2, 1.2, 1.2, 1.2, 0.3, 0.3, 0.3, 0.3, 0.6, 0.6], two: true

  function aim(p, d, s, spin) {

    return function (q) {
      var v = Lo3D.rotY(Lo3D.rotX(Lo3D.rotZ([q[0] * s, q[1] * s, q[2] * s], spin || 0), pitch), yaw);

  }
  function at(p, s, ry) {
    return function (q) {
      var v = ry ? Lo3D.rotY(q, ry) : q;

  return {
    W: W, H: H, invert: invert, wave: wave, zoom: zoom, mosaic: mosaic, cover: cover, rays: rays, glow: glow,
    spawn: spawn, emit: emit, burst: burst, drawParts: drawParts, parts: parts,
    layer: layer, step: step, each: each, lights: lights, reset: reset,
    BLADE: BLADE, BALL: BALL, CUBE: CUBE, aim: aim, at: at
  };
})();
</script>
<script data-src="src/battle.js">
/* The battle scene: a 3D arena, the HUD and menus, and the turn loop. The rules are in src/rules.js;
   what every move looks like is in src/spells.js.
   game.go("battle", {ids, area, hero, back, from}) starts a fight. hero is a Rules hero (it is changed in place);
   from is a copy of the last frame, for the transition. When the fight ends it goes to args.back with
   {result: "win" | "lose" | "fled", hero}. */
var Battle = (function () {
  var S = null, ARENAS = {};
  var SKY = { road: [0.1, 0.42], tower: [0.04, 0.16], upper: [0.04, 0.16], top: [0.16, 0.5] };
  var HOME = { x: 0, y: 0, z: 1.0, yaw: -0.4, pitch: -0.17, dist: 6.6, focal: 124 };

  /* ---------- the animation clock ----------
     Battle animations wait and tween on this clock instead of lo-game's, so an animation the player has
     seen before can be cut short: cut() finishes every pending tween and timer at once, and while
     S.skip is set new ones finish as soon as they start. The rules have settled the result already. */
  var EASE = {
    linear: function (t) { return t; },
    out: function (t) { return 1 - (1 - t) * (1 - t); },
    "in": function (t) { return t * t; },
    inOut: function (t) { return t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t); }
  };
  var tweens = [], timers = [], none = function () {};
  var skipping = function () { return !!(S && S.skip); };
  function settle(w) { for (var p in w.to) w.obj[p] = w.to[p]; w.done(); }
  var T = {
    tween: function (obj, to, sec, ease) {
      return new Promise(function (res) {
        var w = { obj: obj, from: {}, to: to, dur: Math.max(1 / 60, sec), t: 0, ease: EASE[ease || "out"] || EASE.out, done: res };
        for (var p in to) w.from[p] = obj[p];
        if (skipping()) settle(w); else tweens.push(w);
      });
    },
    after: function (sec, fn) {
      if (skipping()) { fn(); return none; }
      var t = { left: sec, fn: fn };
      timers.push(t);
      return function () { t.dead = true; };
    },
    /* repeating timers drive motion only; a cut drops them */
    every: function (sec, fn) {
      if (skipping()) return none;
      var t = { left: sec, every: sec, fn: fn };
      timers.push(t);
      return function () { t.dead = true; };
    },
    wait: function (sec) { return new Promise(function (res) { T.after(sec, res); }); },
    flash: function (sec) { if (!skipping()) game.flash(sec); },
    shake: function (a, sec) { if (!skipping()) game.shake(a, sec); },
    sfx: function (name) { if (!skipping()) game.sfx(name); }
  };
  function stepClock(dt) {
    tweens = tweens.filter(function (w) {
      w.t = Math.min(1, w.t + dt / w.dur);
      var k = w.ease(w.t);
      for (var p in w.to) w.obj[p] = w.from[p] + (w.to[p] - w.from[p]) * k;
      if (w.t >= 1) { w.done(); return false; }
      return true;
    });
    var due = [];
    timers = timers.filter(function (t) {
      if (t.dead) return false;
      t.left -= dt;
      if (t.left > 0) return true;
      due.push(t);
      if (t.every) { t.left += t.every; return true; }
      return false;
    });
    due.forEach(function (t) { if (!t.dead) t.fn(); });
  }
  function cut() {
    S.skip = true; S.frozen = 0;
    var tw = tweens, tm = timers;
    tweens = []; timers = [];
    tw.forEach(settle);
    tm.forEach(function (t) { if (!t.dead && !t.every) t.fn(); });
  }

  /* animations seen in this session, by key ("spell:sword", "foe:狐火"); P3 saves them with the game */
  var SEEN = {};
  /* play an animation: the first time in full, after that A cuts to the result */
  async function play(key, fn) {
    S.canSkip = !!SEEN[key];
    SEEN[key] = true;
    S.skip = false;
    await fn();
    if (S.skip) tidy();
    S.canSkip = false; S.skip = false;
  }
  /* after a cut: everything an animation borrows goes back to rest */
  function tidy() {
    FX.reset();
    Object.assign(S.cam, HOME);
    S.light = 1; S.sky = 1; S.bars = 0; S.hud = true; S.ripple = 0; S.punch = 1; S.rays = null; S.title = ""; S.msg = "";
    var h = S.hero;
    h.pose = null; h.art = ART.heroUp0; h.x = S.heroHome[0]; h.z = S.heroHome[1];
    S.frozen = 0;

  }

  /* ---------- the arena, built once per area ---------- */
  function torch(m, glow, lights, x, z, h) {
    m.box(x - 0.08, 0, z - 0.08, x + 0.08, h, z + 0.08, 0.25);
    glow.box(x - 0.2, h, z - 0.2, x + 0.2, h + 0.35, z + 0.2, 0.95);
    lights.push({ x: x, y: h + 0.25, z: z, radius: 5.5, power: 0.9, base: 0.9, seed: x * 3 + z });
  }
  function buildArena(area) {
    var m = World.builder(), glow = World.builder(), lights = [], hash = World.hash, x, z, i, a;
    var inside = area === "tower" || area === "upper";
    /* the platform: stone tiles in a circle, a dark rim, then the ground around it */
    for (x = -12; x < 12; x++) for (z = -12; z < 12; z++) {
      var d = Math.sqrt((x + 0.5) * (x + 0.5) + (z + 0.5) * (z + 0.5)), h = hash(x + 40, z + 40);
      var alb = d < 4.3 ? ((x + z) & 1 ? 0.66 : 0.6) + h * 0.05 : d < 4.9 ? 0.32 : inside ? 0.42 + h * 0.06 : area === "top" ? 0.5 + h * 0.05 : 0.4 + h * 0.07;
      if (area === "top" && d > 7.5) continue;

      for (i = 0; i < 46; i++) {
        a = i / 46 * Math.PI * 2 + hash(i, 1) * 0.1;
        var r = 7 + hash(i, 2) * 5;
        if (Math.abs(Math.sin(a)) < 0.35 && Math.cos(a) < 0) continue;   /* the road behind the hero */
        World.tree(m, Math.cos(a) * r, Math.sin(a) * r, 1.2 + hash(i, 3) * 0.8, r > 9);
      }
      for (i = 0; i < 9; i++) { a = i / 9 * Math.PI * 2 + 0.3; m.cone(Math.cos(a) * 26, 0, Math.sin(a) * 26, 8, 7 + hash(i, 5) * 4, 5, 0.35, 0.1); }
      torch(m, glow, lights, -4.6, -0.6, 1.6); torch(m, glow, lights, 4.6, -0.6, 1.6);
    } else if (inside) {
      /* inside the tower: a ring of pillars, the wall far behind, braziers */
      for (i = 0; i < 8; i++) {
        a = (i + 0.5) / 8 * Math.PI * 2;
        x = Math.cos(a) * 7; z = Math.sin(a) * 7;
        m.box(x - 0.45, 0, z - 0.45, x + 0.45, 7, z + 0.45, area === "upper" ? 0.7 : 0.85);
      }
      for (i = 0; i < 24; i++) {
        var a0 = i / 24 * Math.PI * 2, a1 = (i + 1) / 24 * Math.PI * 2, R0 = 11;
        m.quad([Math.cos(a0) * R0, 0, Math.sin(a0) * R0], [Math.cos(a1) * R0, 0, Math.sin(a1) * R0], [Math.cos(a1) * R0, 8, Math.sin(a1) * R0], [Math.cos(a0) * R0, 8, Math.sin(a0) * R0],
          [-Math.cos((a0 + a1) / 2), 0, -Math.sin((a0 + a1) / 2)], i & 1 ? 0.55 : 0.5);
      }
      torch(m, glow, lights, -4.8, 0.4, 1.1); torch(m, glow, lights, 4.8, 0.4, 1.1);
      torch(m, glow, lights, -3.2, 4.6, 1.1); torch(m, glow, lights, 3.2, 4.6, 1.1);
    } else {
      /* the top of the tower: a railing around the roof, open sky */
      for (i = 0; i < 20; i++) {
        a = i / 20 * Math.PI * 2;
        x = Math.cos(a) * 7.3; z = Math.sin(a) * 7.3;
        m.box(x - 0.12, 0, z - 0.12, x + 0.12, 0.9, z + 0.12, 0.8);
      }
      torch(m, glow, lights, -5, 3, 1.3); torch(m, glow, lights, 5, 3, 1.3);
    }
    return { mesh: m, glow: glow, lights: lights, area: area };
  }
  var SHADOW = (function () { var m = World.builder(); m.cone(0, 0.03, 0, 1, 0.0001, 10, 0.02); return m; })();

  /* where the foes stand: one in the middle, or spread across the far side */
  var SPOTS = { 1: [[0, 2.6]], 2: [[-1.6, 2.4], [1.6, 2.4]], 3: [[-2.8, 2.2], [0, 3.0], [2.8, 2.2]] };

  function setup(args) {
    var area = args.area || "road";
    var A = ARENAS[area] || (ARENAS[area] = buildArena(area));
    var b = Rules.start(args.hero, args.ids);
    /* 演武 (the spell gallery): practice dummies that take every hit and never strike back */
    if (args.demo) b.foes.forEach(function (f) { f.hp = f.maxHp = 999; });
    var spots = SPOTS[b.foes.length];
    S = {
      args: args, b: b, A: A, area: area,
      cam: Object.assign({}, HOME), home: HOME,
      heroHome: [-1.2, -1.5], hero: { x: -1.2, y: 0, z: -1.5, art: ART.heroUp0, pose: null, flash: 0, hide: false, flip: false },
      foes: b.foes.map(function (f, i) {
        var boss = f.def.boss, art = B_ART[f.def.art];
        return { x: boss ? 0 : spots[i][0], y: 0, z: boss ? 4.4 : spots[i][1], art: art, scale: boss ? 0.1 : 0.115,
          ox: 0, oy: 0, oz: 0, flash: 0, hide: false, gone: false, shown: f.hp, boss: boss };
      }),
      view: { hp: args.hero.hp, mp: args.hero.mp },
      nums: [], msg: "", title: "", hud: true, bars: 0, sky: 1, light: 1, stars: area === "road" || area === "top",
      menu: null, poll: null, lastCmd: 0, guard: 0, frozen: 0
    };
    FX.reset();
    tweens = []; timers = [];
    return S;
  }

  /* ---------- helpers for src/spells.js ---------- */
  function foeTop(i, k) { var f = S.foes[i]; return [f.x + f.ox, f.y + f.oy + f.art.h * f.scale * (k == null ? 0.55 : k), f.z + f.oz]; }
  function heroAt(k) { var h = S.hero; return [h.x, h.y + 1.1 * (k == null ? 0.55 : k), h.z]; }
  function camTo(o, sec, ease) { return T.tween(S.cam, o, sec, ease || "inOut"); }
  function home(sec) { return camTo(HOME, sec == null ? 0.5 : sec); }
  /* a camera aimed at point p from angle yaw */
  function look(p, yaw, pitch, dist, sec, ease) { return camTo({ x: p[0], y: p[1], z: p[2], yaw: yaw, pitch: pitch, dist: dist }, sec, ease); }
  function popup(text, p, o) { S.nums.push(Object.assign({ text: String(text), p: p, t: 0, life: 1.0 }, o || {})); }

  /* show what the rules already decided: numbers, flashes, falls. Damage events for one foe, or all of them */
  async function show(events, only) {
    var weakHit = null;
    events.forEach(function (e) {
      if (e.kind === "damage" && e.side === "enemy" && (only == null || only === e.target)) {
        var f = S.foes[e.target];
        f.shown = Math.max(0, f.shown - e.amount);
        f.flash = 0.25;
        popup(e.amount, foeTop(e.target, 0.8), { big: e.weak || e.crit });
        if (e.weak) { popup("克制", foeTop(e.target, 1.15), { word: true }); weakHit = e.target; }
        else if (e.crit) popup("会心", foeTop(e.target, 1.15), { word: true });
      }
      if (e.kind === "damage" && e.side === "hero") {
        S.view.hp = Math.max(0, S.view.hp - e.amount);
        S.hero.flash = 0.3;
        popup(e.amount, heroAt(1.0), { big: e.crit });
      }
      if (e.kind === "heal") { S.view.hp += e.hp; popup("+" + e.hp, heroAt(1.0)); }
      if (e.kind === "mana" && e.mp) { S.view.mp += e.mp; popup("+" + e.mp, heroAt(0.6), { mp: true }); }
    });
    T.sfx("hit");
    if (weakHit != null) await ANIM.weak(S, weakHit);
    var downs = events.filter(function (e) { return e.kind === "down" && (only == null || only === e.target); });
    for (var i = 0; i < downs.length; i++) ANIM.down(S, downs[i].target);
    if (downs.length) await T.wait(0.5);
  }

  /* ---------- drawing ---------- */
  function render(g) {
    var A = S.A, c = S.cam, cam = R.camera, t = game.time;
    cam.x = c.x; cam.y = c.y; cam.z = c.z; cam.yaw = c.yaw; cam.pitch = c.pitch; cam.dist = c.dist; cam.focal = c.focal;
    var inside = S.area === "tower" || S.area === "upper";
    R.sun = { dir: Lo3D.norm([-0.45, 0.75, -0.5]), ambient: (inside ? 0.22 : 0.28) * S.light, diffuse: (inside ? 0.32 : 0.48) * S.light };
    R.fog = { near: c.dist + 4, far: c.dist + 26, lum: (inside ? 0.12 : 0.4) * S.sky };
    R.focus = { near: c.dist - 5, far: c.dist + 7 };
    R.near = 0.3;
    var sky = SKY[S.area];
    R.clear(function (y) { return (sky[0] + (sky[1] - sky[0]) * Math.min(1, y / 70)) * S.sky; });
    var ls = A.lights.map(function (L) {
      L.power = L.base * S.light * (0.82 + 0.18 * Math.sin(t * 11 + L.seed * 7) * Math.sin(t * 4.3 + L.seed));
      return L;
    });
    R.lights = ls.concat(FX.lights());
    R.draw(A.mesh);
    R.draw(A.glow, null, { bias: 0.5 * S.light });
    FX.each("draw", R);
    var h = S.hero;
    S.foes.forEach(function (f) {
      if (f.gone) return;
      var w = f.art.w * f.scale * 0.42;
      R.draw(SHADOW, function (p) { return [p[0] * w + f.x + f.ox, p[1], p[2] * w * 0.6 + f.z + f.oz]; });
    });
    if (!h.hide) R.draw(SHADOW, function (p) { return [p[0] * 0.38 + h.x, p[1], p[2] * 0.3 + h.z]; });
    S.foes.forEach(function (f, i) {
      if (f.gone || f.hide) return;
      if (f.dying && (Math.floor(t * 24) & 1)) return;
      /* floating foes bob; flashes turn the sprite white */
      var bob = f.boss ? Math.sin(t * 1.6) * 0.12 : f.art === B_ART.fox || f.art === B_ART.wraith ? 0.15 + Math.sin(t * 3 + i) * 0.08 : 0;
      R.sprite(f.art, f.x + f.ox, f.y + f.oy + bob, f.z + f.oz, { scale: f.scale, map: f.flash > 0 && (Math.floor(t * 30) & 1) ? [3, 3, 3, 3] : null });
    });
    if (!h.hide && !(h.flash > 0 && (Math.floor(t * 30) & 1))) R.sprite(h.pose || h.art, h.x, h.y, h.z, { scale: 1 / 14, flip: h.flip });
    R.present();
    if (S.stars) for (var s = 0; s < 30; s++) {
      var a = World.hash(s, 11) * Math.PI * 2, e = 0.25 + World.hash(s, 12) * 0.5;
      if ((s * 5 + Math.floor(t * 2)) % 19) R.dot([Math.cos(a) * 60, Math.sin(e) * 60, Math.sin(a) * 60], 3, 0);
    }
    if (S.guard > 0) {
      /* a ring of light around the hero while defending */
      for (var k = 0; k < 14; k++) { var aa = k / 14 * Math.PI * 2 + t * 2; R.dot([h.x + Math.cos(aa) * 0.55, 0.15 + (k & 1) * 0.5 + Math.sin(t * 4 + k) * 0.1, h.z + Math.sin(aa) * 0.35], 3, 0); }
    }
    FX.drawParts(R);
    FX.each("dots", R);
    FX.each("post", R.image.px);
    g.sprite(R.image, 0, 0);
    ui(g);
  }

  /* ---------- the HUD, numbers and menus ---------- */
  function bar(g, x, y, w, v, max) {
    g.rect(x, y, w, 4, g.INK);
    g.rect(x + 1, y + 1, Math.round((w - 2) * Math.max(0, Math.min(1, v / max))), 2, g.PAPER);
  }
  function outlined(g, text, x, y, color) {
    [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(function (d) { g.text(text, x + d[0], y + d[1], { align: "center", color: g.INK }); });
    g.text(text, x, y, { align: "center", color: color == null ? g.PAPER : color });
  }
  function ui(g) {
    var s = Rules.stats(S.b.hero.level);
    /* numbers float up from where they were hit */
    S.nums.forEach(function (n) {
      var p = R.project(n.p);
      if (!p) return;
      var y = p[1] - 8 - Math.min(1, n.t * 4) * 8 - (n.word ? 4 : 0);
      if (n.t > n.life * 0.75 && (Math.floor(n.t * 20) & 1)) return;
      outlined(g, n.text, p[0], y, n.mp ? g.MID : g.PAPER);
    });
    if (S.bars > 0) { var bh = Math.round(S.bars * 16); g.rect(0, 0, 160, bh, g.INK); g.rect(0, 144 - bh, 160, bh, g.INK); }
    if (S.title) { var tw = g.measure(S.title) + 16; g.window(80 - tw / 2, S.hud ? 18 : 20, tw, 20); g.text(S.title, 80, S.hud ? 21 : 23, { align: "center" }); }
    if (!S.hud) return;
    g.rect(0, 0, 160, 15, g.INK);
    g.text("体", 3, 1, { color: g.MID });
    g.text(String(Math.round(S.view.hp)), 16, 1, { color: g.PAPER });
    bar(g, 40, 6, 34, S.view.hp, s.maxHp);
    g.text("法", 82, 1, { color: g.MID });
    g.text(String(Math.round(S.view.mp)), 95, 1, { color: g.PAPER });
    bar(g, 116, 6, 40, S.view.mp, s.maxMp);
    var m = S.menu;
    if (m) menuDraw(g, m, s);
    else if (S.msg) { g.window(0, 114, 160, 30); g.text(S.msg, 80, 122, { align: "center" }); }
  }

  var CMDS = [["attack", "攻击"], ["spell", "法术"], ["item", "物品"], ["defend", "防御"], ["flee", "逃跑"]];
  function menuDraw(g, m, s) {
    var t = game.time;
    if (m.kind === "cmd") {
      g.window(0, 100, 160, 44);
      CMDS.forEach(function (c, i) {
        var x = 16 + (i % 2) * 48, y = 105 + Math.floor(i / 2) * 13;
        if (i === m.i) g.arrow(x - 8, y + 3, "right");
        g.text(c[1], x, y, { color: c[0] === "flee" && S.b.boss ? g.MID : g.INK });
      });
      g.rect(110, 104, 1, 36, g.MID);
      g.text("Lv" + S.b.hero.level, 135, 105, { align: "center" });
      g.text("五行", 135, 118, { align: "center", color: g.DARK });
      g.text("相克", 135, 130, { align: "center", color: g.DARK });
    } else if (m.kind === "list") {
      g.window(0, 100, 160, 44);
      for (var r = 0; r < 3; r++) {
        var k = m.top + r, it = m.items[k];
        if (!it) break;
        var y = 104 + r * 13;
        if (k === m.i) g.arrow(5, y + 3, "right");
        g.text(it.text, 13, y, { color: it.off ? g.MID : g.INK });
        if (it.right) g.text(it.right, 154, y, { align: "right", color: it.off ? g.MID : g.DARK });
      }
      if (m.top > 0) for (var u = 0; u < 4; u++) g.rect(153 - u, 102 + u, 1 + 2 * u, 1, g.INK);
      if (m.top + 3 < m.items.length && Math.floor(t * 3) % 2) g.arrow(150, 139, "down");
      var cur = m.items[m.i];
      if (cur && cur.info) { g.window(0, 15, 160, 22); g.text(cur.info, 80, 19, { align: "center" }); }
    } else if (m.kind === "target") {
      var ids = m.all ? Rules.alive(S.b).map(function (f) { return S.b.foes.indexOf(f); }) : [m.i];
      ids.forEach(function (i) {
        var p = R.project(foeTop(i, 1.05));
        if (p) g.arrow(p[0] - 3, p[1] - 9 + (Math.floor(t * 4) % 2), "down");
      });
      g.window(0, 112, 160, 32);
      if (m.all) g.text("全体", 80, 120, { align: "center" });
      else {
        var f = S.b.foes[m.i], weak = BATTLE.ELEMENTS[f.weak].name;
        g.text(f.name, 6, 116);
        g.text("怕" + weak, 154, 116, { align: "right", color: g.DARK });
        bar(g, 6, 133, 148, S.foes[m.i].shown, f.maxHp);
      }
    }
  }

  /* resolve a promise when fn() returns something, checked once per update */
  function poll(fn) { return new Promise(function (res) { S.poll = function () { var v = fn(); if (v !== undefined) { S.poll = null; res(v); } }; }); }

  function chooseCommand() {
    S.menu = { kind: "cmd", i: S.lastCmd };
    return poll(function () {
      var m = S.menu, d = game.dir(), i = m.i;
      if (d.x) i = (i % 2 === 0 ? i + 1 : i - 1);
      if (d.y) i = i + d.y * 2;
      if (i !== m.i && i >= 0 && i < CMDS.length) { m.i = i; game.sfx("move"); }
      if (game.ok()) { S.lastCmd = m.i; return CMDS[m.i][0]; }
    });
  }
  /* items: [{text, right, info, off}]; resolves with an index, or -1 for B */
  function chooseList(items, start) {
    S.menu = { kind: "list", items: items, i: start || 0, top: 0 };
    S.menu.top = Math.max(0, Math.min(S.menu.i - 1, items.length - 3));
    return poll(function () {
      var m = S.menu, d = game.dir();
      if (d.y) {
        var i = Math.max(0, Math.min(items.length - 1, m.i + d.y));
        if (i !== m.i) { m.i = i; game.sfx("move"); }
        if (m.i < m.top) m.top = m.i;
        if (m.i > m.top + 2) m.top = m.i - 2;
      }
      if (game.pressed("b")) { game.sfx("tap"); return -1; }
      if (game.ok()) {
        if (items[m.i].off) { game.sfx("err"); return; }
        game.sfx("ok");
        return m.i;
      }
    });
  }
  /* pick a living foe; resolves with its index, or -1 for B. all: just confirm every foe */
  function chooseTarget(all) {
    var live = function () { return S.b.foes.map(function (f, i) { return f.hp > 0 ? i : -1; }).filter(function (i) { return i >= 0; }); };
    var L = live(), start = S.lastTarget != null && L.indexOf(S.lastTarget) >= 0 ? S.lastTarget : L[0];
    S.menu = { kind: "target", i: start, all: all };
    var aim = function () { if (!all) camTo({ x: S.foes[S.menu.i].x * 0.4, yaw: HOME.yaw + S.foes[S.menu.i].x * 0.05 }, 0.25, "out"); };
    aim();
    return poll(function () {
      var m = S.menu, d = game.dir();
      if (d.x && !all) {
        var L2 = live(), k = (L2.indexOf(m.i) + d.x + L2.length) % L2.length;
        if (L2[k] !== m.i) { m.i = L2[k]; game.sfx("move"); aim(); }
      }
      if (game.pressed("b")) { game.sfx("tap"); camTo({ x: HOME.x, yaw: HOME.yaw }, 0.25); return -1; }
      if (game.ok()) { game.sfx("ok"); S.lastTarget = m.i; return m.i; }
    });
  }

  /* the hero's turn: menus until there is an action */
  async function heroTurn() {
    var hero = S.b.hero;
    for (;;) {
      S.view.hp = hero.hp; S.view.mp = hero.mp;
      var cmd = await chooseCommand();
      if (cmd === "attack") {
        var t = await chooseTarget(false);
        if (t >= 0) return { type: "attack", target: t };
      } else if (cmd === "spell") {
        var ids = Rules.spellsAt(hero.level);
        var items = ids.map(function (id) {
          var sp = BATTLE.SPELLS[id];
          return { text: sp.name, right: String(sp.mp),
            info: (sp.element ? BATTLE.ELEMENTS[sp.element].name + " · " : "五行 · ") + (sp.target === "all" ? "全体" : "单体"),
            off: hero.mp < sp.mp };
        });
        for (;;) {
          var k = await chooseList(items, S.lastSpell || 0);
          if (k < 0) break;
          S.lastSpell = k;
          var sp = BATTLE.SPELLS[ids[k]];
          var tg = await chooseTarget(sp.target === "all");
          if (tg >= 0) return { type: "spell", id: ids[k], target: tg };
        }
      } else if (cmd === "item") {
        var its = BATTLE.ITEM_ORDER.map(function (id) {
          var it = BATTLE.ITEMS[id];
          return { text: it.name, right: "x" + (hero.items[id] || 0), info: it.hp ? "回复体力 " + it.hp : "回复法力 " + it.mp, off: !(hero.items[id] > 0) };
        });
        var j = await chooseList(its, 0);
        if (j >= 0) return { type: "item", id: BATTLE.ITEM_ORDER[j] };
      } else if (cmd === "defend") return { type: "defend" };
      else if (cmd === "flee") {
        if (S.b.boss) { game.sfx("err"); await say("逃不掉！", 0.8); continue; }
        return { type: "flee" };
      }
    }
  }
  async function say(text, sec) { S.menu = null; S.msg = text; await T.wait(sec == null ? 0.9 : sec); S.msg = ""; }

  async function run() {
    var args = S.args, b = S.b;
    await ANIM.intro(S, args.from);
    if (b.boss) await ANIM.bossIntro(S);
    await say(b.boss ? b.foes[0].name + "现身了！" : b.foes.length === 1 ? b.foes[0].name + "出现了！" : "出现了" + "一两三"[b.foes.length - 1] + "只妖怪！", 1.1);
    var result = null;
    while (!result) {
      var act = await heroTurn();
      S.menu = null;
      S.guard = 0;
      /* leaving 演武 always works */
      var ev = Rules.heroAct(b, act, args.demo && act.type === "flee" ? function () { return 0; } : Math.random);
      if (act.type === "spell") await play("spell:" + act.id, function () { return ANIM.hero(S, act, ev); });
      else await ANIM.hero(S, act, ev);
      if (b.fled) { result = "fled"; break; }
      result = Rules.result(b);
      if (b.defending) S.guard = 1;
      for (var i = 0; i < b.foes.length && !result && !args.demo; i++) {
        if (b.foes[i].hp <= 0) continue;
        var r = Rules.enemyAct(b, i, Math.random);
        await play("foe:" + r.move, function () { return ANIM.enemy(S, i, r); });
        result = Rules.result(b);
      }
    }
    S.menu = null; S.guard = 0;
    if (result === "win") await ANIM.victory(S, Rules.reward(b));
    else if (result === "lose") await ANIM.defeat(S);
    game.go(args.back || "title", Object.assign({ result: result, hero: b.hero }, args.backArgs || {}), { to: LoGame.INK });
  }

  /* main.js registers this as the "battle" scene once the game exists */
  var scene = {
    enter: function (args) { setup(args); run(); },
    update: function (dt) {
      if (S.canSkip && !S.skip && game.ok()) cut();
      stepClock(dt);
      if (S.frozen > 0) S.frozen -= dt;
      FX.step(dt, S.frozen > 0);
      S.nums = S.nums.filter(function (n) { n.t += dt; return n.t < n.life; });
      S.foes.forEach(function (f) { if (f.flash > 0) f.flash -= dt; });
      if (S.hero.flash > 0) S.hero.flash -= dt;
      if (S.poll) S.poll();
    },
    draw: function (g) { render(g); }
  };

  return {
    scene: scene, T: T, S: function () { return S; }, foeTop: foeTop, heroAt: heroAt, camTo: camTo, home: home, look: look,
    popup: popup, show: show, say: say, HOME: HOME
  };
})();
</script>
<script data-src="src/spells.js">
/* What every battle move looks like. Each animation is an async script: it moves the camera, adds
   FX layers and particles, and calls Battle.show(events) at the moment of impact, so numbers appear
   when the hit lands. The rules have already decided the outcome; nothing here changes it. */
var ANIM = (function () {
  var B = Battle, T = Battle.T, wait = T.wait;
  var PI = Math.PI;
  function clamp01(t) { return t < 0 ? 0 : t > 1 ? 1 : t; }
  function smooth(t) { t = clamp01(t); return t * t * (3 - 2 * t); }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  /* a point along a curve from a over c to b */
  function bez(a, c, b, t) { return mix(mix(a, c, t), mix(c, b, t), t); }
  function targets(ev) {
    var out = [];
    ev.forEach(function (e) { if (e.kind === "damage" && e.side === "enemy" && out.indexOf(e.target) < 0) out.push(e.target); });
    return out;
  }
  /* the middle of the enemy line, on the ground */
  function centre(S) {
    var x = 0, z = 0, n = 0;
    S.foes.forEach(function (f) { if (!f.gone) { x += f.x; z += f.z; n++; } });
    return n ? [x / n, 0, z / n] : [0, 0, 2.5];
  }
  function cast(S, on) { S.hero.pose = on ? B_ART.heroCast : null; }
  function title(S, text, sec) { S.title = text; T.after(sec || 1.2, function () { if (S.title === text) S.title = ""; }); }

  /* ---------- into the fight ---------- */
  async function intro(S, from) {
    var H = B.HOME, pic = from ? new Uint8Array(from) : null;

    S.hud = false;
    T.sfx("hit");
    T.after(0.3, function () { T.sfx("tick"); });
    T.after(0.55, function () { T.sfx("tick"); });
    /* the last picture twists, breaks into blocks, flashes twice and goes dark; then the arena fades in */
    FX.layer({ life: 1.6, always: true, post: function (px, t) {
      if (t < 0.85) {
        if (pic) px.set(pic);
        FX.wave(px, t * 16, 0.16, t * 28);
        FX.mosaic(px, 1 + t * 10);
        if ((t > 0.28 && t < 0.36) || (t > 0.55 && t < 0.63)) FX.invert(px);
        FX.cover(px, 0, (t - 0.55) / 0.3);
      } else FX.cover(px, 0, 1 - (t - 0.85) / 0.6);
    } });
    await wait(0.85);
    await B.camTo(H, 1.5, "out");
    S.hud = true;
  }

  /* ---------- spells ---------- */
  var SPELL = {};

  /* 飞剑诀: a halo of swords fans out behind the hero, facing the camera, then they fly at the target one by one */
  SPELL.sword = async function (S, ev) {
    var i = targets(ev)[0], h = S.hero, H = B.HOME, n = 8, swords = [];
    var yaw = H.yaw - 0.55, right = [Math.cos(yaw), 0, -Math.sin(yaw)], fwd = [Math.sin(yaw), 0, Math.cos(yaw)];
    var hub = [h.x + fwd[0] * 0.35, 1.25, h.z + fwd[2] * 0.35];
    cast(S, true);
    B.look([h.x, 1.15, h.z], yaw, -0.06, 4.0, 0.5);
    for (var k = 0; k < n; k++) swords.push({ a: k / n * PI * 2, fly: -1 });
    /* the scene dims so the blades stand out in paper white */
    T.tween(S, { light: 0.45, sky: 0.6 }, 0.4);
    var L = FX.layer({
      draw: function (R, t) {
        var open = smooth(t / 0.45), turn = t * 1.2;
        swords.forEach(function (s, k) {
          if (s.done) return;
          var pos, dir;
          if (s.fly < 0) {
            var a = s.a + turn, c = Math.cos(a), sn = Math.sin(a), rad = 0.25 + open * 0.75;
            dir = [right[0] * c, sn, right[2] * c];
            pos = [hub[0] + dir[0] * rad, hub[1] + dir[1] * rad, hub[2] + dir[2] * rad];
            if (k === Math.floor(t * 20) % n) FX.spawn({ x: pos[0], y: pos[1], z: pos[2], vy: -0.6, life: 0.35, tone: 3 });
          } else {
            var u = clamp01((t - s.fly) / 0.32), tc = B.foeTop(i, 0.55), top = mix(s.from, tc, 0.5);
            top[1] += 1.6;
            pos = bez(s.from, top, tc, u);

            if (u >= 1) { s.done = true; FX.burst(tc[0], tc[1], tc[2] - 0.3, 8, 2.5, { tone: 3, life: 0.3, trail: 0.04 }); T.shake(1, 0.08); return; }
            if (k % 2 === 0) FX.spawn({ x: pos[0], y: pos[1], z: pos[2], life: 0.18, tone: 3 });
          }
          s.pos = pos;
          R.draw(FX.BLADE, FX.aim(pos, dir, 1.5), { bias: 0.9, two: true });
        });
      },
      lights: function () { return [{ x: hub[0], y: hub[1], z: hub[2] - 0.3, radius: 3.2, power: 0.9 }]; }
    });
    T.sfx("ok");
    await wait(1.0);
    B.look(B.foeTop(i, 0.4), H.yaw + 0.75, -0.16, 5.6, 0.55);
    for (k = 0; k < n; k++) {

      swords[k].fly = L.layer.t;   /* launch now, on the layer's clock */
      if (k % 3 === 0) T.sfx("tick");

    }
    await wait(0.3);
    T.flash(0.05);
    await B.show(ev);
    cast(S, false);
    T.tween(S, { light: 1, sky: 1 }, 0.5);
    await wait(0.25);
    L();
    await B.home(0.5);
  };

  /* 寒潮: a wave sweeps from behind the hero across the enemies, then everything frosts over */
  SPELL.tide = async function (S, ev) {
    var H = B.HOME, front = -6, crest = 0;
    cast(S, true);
    B.camTo({ x: 0, y: 1.0, z: 0.8, yaw: H.yaw + 1.0, pitch: -0.26, dist: 9 }, 0.6);
    T.tween(S, { sky: 0.7, light: 0.6 }, 0.5);
    var GRID = (function () {
      var v = [], t = [], c = [], X = 14, U = 5;
      for (var u = 0; u <= U; u++) for (var x = 0; x <= X; x++) v.push([-7 + x, u / U, 0]);
      for (u = 0; u < U; u++) for (x = 0; x < X; x++) {
        var a = u * (X + 1) + x, b = a + 1, d = a + X + 1, e = d + 1;
        t.push([a, b, e], [a, e, d]); c.push(u === 0 ? 1.6 : 0.4, u === 0 ? 1.6 : 0.4);   /* white crest, dark water */
      }
      return { v: v, t: t, c: c, two: true };
    })();
    var L = FX.layer({
      draw: function (R, t) {
        if (crest <= 0.01) return;
        R.draw(GRID, function (p) {
          /* u = 0 is the crest, u = 1 the back of the wave; the crest leans forward */
          var u = p[1], hgt = crest * Math.pow(Math.sin(PI * (0.15 + u * 0.85)), 0.8) * (1 + 0.15 * Math.sin(p[0] * 1.3 + t * 9));
          return [p[0], hgt, front - u * 2.4 + (1 - u) * 0.5 * crest];
        }, { bias: 0.08 });
      },
      post: function (px, t) { if (S.ripple) FX.wave(px, S.ripple, 0.22, t * 14); }
    });
    T.sfx("ok");
    await wait(0.4);
    S.ripple = 0;
    /* the wave rises and runs forward */
    var hitDone = false, spray = T.every(0.05, function () {
      if (crest < 0.3) return;
      FX.emit(6, function () { return { x: -6 + Math.random() * 12, y: crest * 0.95, z: front + 0.3, vx: (Math.random() - 0.5), vy: 1.5 + Math.random() * 2, vz: 1.5, grav: 6, life: 0.6, tone: 3 }; });
    });
    var run = { f: front, c: 0 };
    var go = T.tween(run, { f: 7.5 }, 1.5, "linear");
    T.tween(run, { c: 3.0 }, 0.5, "out");
    var tick = T.every(1 / 60, function () {
      front = run.f; crest = run.c;
      if (!hitDone && front > 2.2) { hitDone = true; S.ripple = 3; T.shake(2, 0.4); B.show(ev); T.tween(S, { ripple: 0 }, 1.2, "linear"); }
    });
    await go;
    tick(); spray();
    crest = 0;
    /* frost: ice shards on every target, the picture whitens for a moment */
    T.sfx("tick");
    targets(ev).forEach(function (i) {
      var c = B.foeTop(i, 0.3);
      FX.burst(c[0], c[1], c[2], 18, 1.8, { tone: 3, life: 0.7, drag: 2.5 });
    });
    var ice = FX.layer({ life: 0.8, draw: function (R, t) {
      targets(ev).forEach(function (i, n) {
        var f = S.foes[i], s = smooth(t / 0.15) * (1 - smooth((t - 0.6) / 0.2));
        for (var k = 0; k < 4; k++) {

          R.draw(FX.CUBE, (function (p) {
            var q = Lo3D.rotY(Lo3D.rotZ([p[0] * 0.18 * s, p[1] * 1.0 * s, p[2] * 0.18 * s], 0.35), a);
            return [q[0] + f.x + Math.cos(a) * 0.45, q[1] + 0.35 * s, q[2] + f.z + Math.sin(a) * 0.3];
          }), { bias: 0.3 });
        }
      });
    }, post: function (px, t) { FX.cover(px, 3, 0.35 * Math.sin(clamp01(t / 0.8) * PI)); } });
    await wait(0.8);
    L();
    cast(S, false);
    T.tween(S, { sky: 1, light: 1 }, 0.5);
    await B.home(0.5);
  };

    var L = FX.layer({
      draw: function (R) {
        var w = 1.6 * smooth((11 - seal.y) / 9);
        R.draw(FX.BALL, function (p) { return [p[0] * w + c[0], 0.02, p[2] * w + c[2]]; }, { albedo: 0.02 });
        R.draw(SEAL, function (p) { var q = Lo3D.rotY(p, seal.spin); return [q[0] * seal.s + c[0], q[1] * seal.s + seal.y, q[2] * seal.s + c[2]]; }, { bias: 0.3 });
      },
      /* the carved face glows on the ground beneath it */
      lights: function () { return [{ x: c[0], y: seal.y - 1.2, z: c[2] - 0.5, radius: 4 + Math.max(0, 6 - seal.y) * 0.4, power: 1.4 }]; },
      post: function (px) { if (seal.punch > 1.001) FX.zoom(px, seal.punch, 80, 80); }
    });
    T.tween(seal, { spin: 0.8 }, 1.6, "out");
    await T.tween(seal, { y: 5.5 }, 1.2, "out");
    /* a quick cut back, then the slam */
    B.camTo({ x: c[0], y: 1.2, z: 0.2, pitch: -0.3, dist: 9.5, yaw: H.yaw - 0.15 }, 0.25, "out");
    await wait(0.15);
    await T.tween(seal, { y: 0.55 }, 0.18, "in");
    T.sfx("hit");
    T.flash(0.05);
    T.shake(5, 0.5);
    seal.punch = 1.14;
    T.tween(seal, { punch: 1 }, 0.35, "out");
    FX.emit(30, function () {
      var a = Math.random() * PI * 2, s = 2 + Math.random() * 3;
      return { x: c[0] + Math.cos(a) * 1.4, y: 0.3, z: c[2] + Math.sin(a) * 1.4, vx: Math.cos(a) * s, vy: 2 + Math.random() * 3, vz: Math.sin(a) * s, grav: 9, floor: 0.05, life: 1.2, tone: Math.random() < 0.5 ? 0 : 1, size: 0.14 };
    });
    FX.emit(56, function (k) {
      var a = k / 56 * PI * 2;
      return { x: c[0] + Math.cos(a) * 1.6, y: 0.06, z: c[2] + Math.sin(a) * 1.6, vx: Math.cos(a) * 6, vz: Math.sin(a) * 6, drag: 2.2, life: 0.9, tone: 2, size: 0.08 };
    });
    await B.show(ev);
    await wait(0.4);
    await T.tween(seal, { y: -1.5 }, 0.5, "in");
    L();
    cast(S, false);
    T.tween(S, { sky: 1, light: 1 }, 0.5);
    await B.home(0.6);
  };

  /* 七级浮屠: the five elements gather above the arena and bring down a phantom of the tower */
  SPELL.pagoda = async function (S, ev) {
    var H = B.HOME, h = S.hero, c = centre(S), hp = B.heroAt(0.7), orbs = [], tw = { y: 16, spin: 0, show: 0, rise: 0 };
    var PAG = (function () { var m = World.builder(); World.pagoda(m, 0, 0, 0, 0.62, [1.1, 0.25]); return m; })();
    var storeys = [0.5, 1.4, 2.25, 3.05, 3.8, 4.5, 5.15];
    S.hud = false;
    T.tween(S, { bars: 1 }, 0.3);
    T.tween(S, { sky: 0.15, light: 0.25 }, 0.6);
    cast(S, true);
    /* close behind the hero's shoulder; the rise below starts from the same side, so the camera never
       crosses the enemy line on its way up */
    B.look([h.x, 0.9, h.z], H.yaw - 0.9, -0.05, 3.4, 0.7);
    var L = FX.layer({
      draw: function (R, t) {
        orbs.forEach(function (o) { R.draw(FX.BALL, FX.at(o.p, 0.13, t), { bias: 0.85 }); });
        if (tw.show && (tw.rise === 0 || Math.floor(t * 20) % 3)) R.draw(PAG, function (p) {
          var q = Lo3D.rotY(p, tw.spin);
          return [q[0] + c[0], q[1] + tw.y, q[2] + c[2]];
        }, { bias: 0.5 + tw.rise * 0.4 });
      },
      lights: function () {
        var out = orbs.map(function (o) { return { x: o.p[0], y: o.p[1], z: o.p[2], radius: 2.4, power: 0.7 }; });
        if (tw.show) storeys.forEach(function (y, k) { if (k % 2 === 0) out.push({ x: c[0], y: tw.y + y + 0.4, z: c[2] - 1.4, radius: 4.5, power: 1.1 }); });
        return out;
      },
      post: function (px, t) {
        if (S.rays) { var q = R.project(S.rays); if (q) FX.rays(px, q[0], q[1], 6, 40, 16, 3, t * 0.8); }
        if (S.ripple) FX.wave(px, S.ripple, 0.2, t * 20);
        if (S.punch > 1.001) FX.zoom(px, S.punch, 80, 72);
      }
    });
    /* five orbs, one per element */
    for (var k = 0; k < 5; k++) {
      (function (k) { orbs.push({ k: k, p: hp.slice() }); })(k);
      T.sfx("tick");
      await wait(0.2);
    }
    var orbit = T.every(1 / 60, function () {
      var t = game.time;
      orbs.forEach(function (o) {
        var a = o.k / 5 * PI * 2 + t * 4;
        var target = o.rise ? [c[0] + Math.cos(a) * 0.5 * (1 - o.rise), 1 + o.rise * 9, c[2] + Math.sin(a) * 0.5 * (1 - o.rise)] : [hp[0] + Math.cos(a) * 0.9, hp[1] + Math.sin(t * 3 + o.k) * 0.15, hp[2] + Math.sin(a) * 0.9];
        o.p = mix(o.p, target, 0.15);
      });
    });
    T.flash(0.05);
    await wait(0.3);
    /* they rise and merge high above the enemies */
    B.look([c[0], 5, c[2]], H.yaw - 0.5, 0.28, 9.5, 1.1);
    T.tween(S, { sky: 0.45 }, 1.0);
    orbs.forEach(function (o) { o.rise = 0; T.tween(o, { rise: 1 }, 1.0, "in"); });
    await wait(1.1);
    orbit();
    orbs.length = 0;
    S.rays = [c[0], 10, c[2]];
    T.sfx("ok");
    T.flash(0.06);
    T.tween(S, { sky: 0.6 }, 0.6);
    /* the phantom tower comes down slowly while the camera circles it */
    tw.show = 1;
    T.after(0.7, function () { S.rays = null; });
    S.cam.yaw = H.yaw + 0.9;
    B.look([c[0], 4.5, c[2]], H.yaw + 0.9, 0.05, 15, 0.6);
    T.tween(S.cam, { yaw: H.yaw + 0.9 + 2.3 }, 2.6, "inOut");
    T.tween(tw, { spin: 1.2 }, 2.6, "out");
    var motes = T.every(0.04, function () {
      FX.spawn({ x: c[0] + (Math.random() - 0.5) * 4, y: tw.y + Math.random() * 5, z: c[2] + (Math.random() - 0.5) * 4, vy: -1.5, life: 1.2, tone: 3 });
    });
    await T.tween(tw, { y: 3.2 }, 2.4, "out");
    S.rays = null;
    B.camTo({ y: 1.6, pitch: -0.2, dist: 12 }, 0.3);
    await wait(0.2);
    /* the slam */
    await T.tween(tw, { y: 0 }, 0.2, "in");
    motes();
    T.sfx("hit");
    T.flash(0.12);
    T.shake(6, 0.7);
    S.ripple = 4; S.punch = 1.25;
    T.tween(S, { ripple: 0 }, 1.2, "out");
    T.tween(S, { punch: 1 }, 0.5, "out");
    [[3, 9], [0, 6]].forEach(function (ring) {
      FX.emit(64, function (k) {
        var a = k / 64 * PI * 2;
        return { x: c[0] + Math.cos(a) * 2, y: 0.1, z: c[2] + Math.sin(a) * 2, vx: Math.cos(a) * ring[1], vz: Math.sin(a) * ring[1], drag: 1.5, life: 1.1, tone: ring[0], size: 0.1 };
      });
    });
    await B.show(ev);
    /* it dissolves into light and rises away */
    tw.rise = 1;
    T.tween(tw, { y: 9 }, 1.3, "in");
    var up = T.every(0.03, function () {
      FX.spawn({ x: c[0] + (Math.random() - 0.5) * 3, y: tw.y + Math.random() * 5, z: c[2] + (Math.random() - 0.5) * 3, vy: 2.5, life: 0.8, tone: 3 });
    });
    await wait(1.3);
    up();
    L();
    S.punch = 1; S.ripple = 0;
    cast(S, false);
    T.tween(S, { sky: 1, light: 1, bars: 0 }, 0.5);
    await B.home(0.8);
    S.hud = true;
  };

  async function hero(S, act, ev) {
    if (act.type === "attack") return attack(S, act.target, ev);
    if (act.type === "item") return item(S, ev, act.id);
    if (act.type === "defend") return defend(S, ev);
    if (act.type === "flee") return flee(S, ev[0].ok);
    var sp = BATTLE.SPELLS[act.id];
    S.view.mp = S.b.hero.mp;
    title(S, sp.name, sp.ultimate ? 1.2 : 1.4);
    await SPELL[act.id](S, ev);
  }

  /* ---------- the enemies ---------- */
  var FOE = {};
  /* lunge at the hero and back */
  async function lunge(S, i, hit) {
    var f = S.foes[i], h = S.hero;
    var dz = (h.z + 1.3) - f.z, dx = (h.x - f.x) * 0.7;
    await T.tween(f, { oz: dz, ox: dx }, 0.22, "in");
    await hit();
    await T.tween(f, { oz: 0, ox: 0 }, 0.3, "out");
  }
  FOE.lash = async function (S, i, r) {
    var p = B.heroAt(0.6);
    await lunge(S, i, async function () {
      FX.layer({ life: 0.2, dots: function (R, t) {
        var k = clamp01(t / 0.08);
        for (var s = 0; s < 3; s++) R.streak([p[0] + 0.5, p[1] + 0.5 - s * 0.2, p[2] - 0.2], mix([p[0] + 0.5, p[1] + 0.5 - s * 0.2, p[2] - 0.2], [p[0] - 0.5, p[1] - 0.3 - s * 0.2, p[2] - 0.2], k), 0);
      } });
      T.shake(2, 0.2);
      await B.show(r.events);
    });
  };
  /* fox fire: a small burning ball that lights the ground as it flies */
  FOE.ember = async function (S, i, r) {
    var a = B.foeTop(i, 0.6), b = B.heroAt(0.6), top = mix(a, b, 0.5), ball = { u: 0, p: a };
    top[1] += 1.2;
    var L = FX.layer({
      draw: function (R, t) { R.draw(FX.BALL, FX.at(ball.p, 0.18 + Math.sin(t * 30) * 0.03, t * 5), { bias: 0.9 }); },
      lights: function () { return [{ x: ball.p[0], y: ball.p[1], z: ball.p[2], radius: 3.5, power: 1.3 }]; }
    });
    var trail = T.every(1 / 60, function () {
      ball.p = bez(a, top, b, ball.u);
      FX.spawn({ x: ball.p[0], y: ball.p[1], z: ball.p[2], vy: 0.5, life: 0.35, tone: 3 });
    });
    await T.tween(ball, { u: 1 }, 0.55, "in");
    trail(); L();
    FX.burst(b[0], b[1], b[2], 20, 2.5, { tone: 3, life: 0.5, drag: 2, up: 0.8 });
    T.shake(2, 0.2);
    await B.show(r.events);
  };
  /* a boulder thrown high, landing on the hero */
  FOE.rock = async function (S, i, r) {
    var f = S.foes[i], a = B.foeTop(i, 1.0), b = B.heroAt(0.4), top = mix(a, b, 0.5), rk = { u: 0, p: a };
    top[1] += 3.5;
    await T.tween(f, { oy: 0.3 }, 0.2, "out");
    var L = FX.layer({ draw: function (R, t) { R.draw(FX.BALL, FX.at(rk.p, 0.32, t * 6), { albedo: 0.7 }); } });
    var fly = T.every(1 / 60, function () { rk.p = bez(a, top, b, rk.u); });
    T.tween(f, { oy: 0 }, 0.2);
    await T.tween(rk, { u: 1 }, 0.6, "in");
    fly(); L();
    FX.emit(18, function () { var q = Math.random() * PI * 2; return { x: b[0], y: 0.2, z: b[2], vx: Math.cos(q) * 2.5, vz: Math.sin(q) * 2.5, vy: 2, grav: 8, floor: 0.05, life: 0.8, tone: 1, size: 0.1 }; });
    T.shake(3, 0.3);
    await B.show(r.events);
  };
  /* a spray of cold water, and the picture wobbles */
  FOE.splash = async function (S, i, r) {
    var a = B.foeTop(i, 0.6), b = B.heroAt(0.6);
    for (var k = 0; k < 3; k++) {
      FX.emit(10, function () {
        var t = 0.5, v = [(b[0] - a[0]) / t, (b[1] - a[1]) / t + 2, (b[2] - a[2]) / t];
        return { x: a[0], y: a[1], z: a[2], vx: v[0] + (Math.random() - 0.5), vy: v[1] + Math.random(), vz: v[2], grav: 5, life: 0.55, tone: 3, trail: 0.03 };
      });
      await wait(0.08);
    }
    await wait(0.35);
    FX.layer({ life: 0.6, post: function (px, t) { FX.wave(px, 2 * (1 - t / 0.6), 0.3, t * 20); } });
    T.shake(2, 0.2);
    await B.show(r.events);
  };
  /* the boss draws in mist and light, the screen darkens: defend now */
  async function gather(S, i, r) {
    var p = B.foeTop(i, 0.75), H = B.HOME;
    B.look(p, H.yaw + 0.3, -0.05, 6.5, 0.6);
    T.tween(S, { sky: 0.5, light: 0.6 }, 0.6);
    var k = T.every(0.05, function () {
      FX.emit(3, function () {
        var a = Math.random() * PI * 2, d = 3 + Math.random() * 2;
        return { x: p[0] + Math.cos(a) * d, y: p[1] + (Math.random() - 0.5) * 3, z: p[2] + Math.sin(a) * d * 0.5, vx: -Math.cos(a) * d * 1.6, vy: 0, vz: -Math.sin(a) * d * 0.8, life: 0.6, tone: 3, trail: 0.05 };
      });
    });
    S.foes[i].glow = FX.layer({ lights: function (t) { return [{ x: p[0], y: p[1], z: p[2] - 1, radius: 5, power: 0.6 + 0.3 * Math.sin(t * 8) }]; } });
    S.msg = r.move;
    await wait(1.6);
    k();
    S.msg = "";
    T.tween(S, { sky: 1, light: 1 }, 0.5);
    await B.home(0.6);
  }
  /* the boss's big attack: a tidal blast across the whole arena */
  FOE.tidal = async function (S, i, r) {
    var f = S.foes[i], a = B.foeTop(i, 0.75), b = B.heroAt(0.5), H = B.HOME;
    if (f.glow) { f.glow(); f.glow = null; }
    S.hud = false;
    T.tween(S, { bars: 1 }, 0.25);
    B.look(mix(a, b, 0.5), H.yaw - 1.4, -0.1, 7, 0.5);
    await wait(0.5);
    T.sfx("lose");
    S.ripple = 5;
    var L = FX.layer({ post: function (px, t) { FX.wave(px, S.ripple, 0.25, t * 30); } });
    var beam = T.every(1 / 60, function () {
      FX.emit(5, function () {
        var v = Lo3D.scale(Lo3D.norm(Lo3D.sub(b, a)), 14);
        return { x: a[0], y: a[1], z: a[2], vx: v[0] + (Math.random() - 0.5) * 2, vy: v[1] + (Math.random() - 0.5) * 2, vz: v[2], life: 0.45, tone: Math.random() < 0.7 ? 3 : 2, trail: 0.03 };
      });
    });
    await wait(0.6);
    T.flash(0.1);
    T.shake(6, 0.6);
    await B.show(r.events);
    await wait(0.4);
    beam();
    await T.tween(S, { ripple: 0 }, 0.5);
    L();
    T.tween(S, { bars: 0 }, 0.3);
    await B.home(0.6);
    S.hud = true;
  };

  async function enemy(S, i, r) {
    if (r.gather) return gather(S, i, r);
    title(S, r.move, 1.0);
    await wait(0.25);
    await (FOE[r.fx] || FOE.lash)(S, i, r);
    await wait(0.15);
  }

  /* ---------- the end ---------- */
  async function victory(S, rw) {
    var h = S.hero, H = B.HOME;
    T.sfx("win");
    cast(S, true);
    S.cam.yaw = H.yaw;
    B.look([h.x, 0.8, h.z], H.yaw + PI * 0.92, -0.12, 4.4, 1.4, "inOut");
    await wait(1.2);
    var pages = ["胜利！", "得到修为 " + rw.xp + "。"];
    rw.ups.forEach(function (u) {
      pages.push("升到 " + u.level + " 级！");
      u.learned.forEach(function (id) { pages.push("学会了" + BATTLE.SPELLS[id].name + "！"); });
    });
    S.hud = false;
    await game.say(pages);
  }
  async function defeat(S) {
    T.sfx("lose");
    S.hud = false;
    T.tween(S, { sky: 0.3, light: 0.3 }, 1.2);
    FX.layer({ always: true, post: function (px, t) { FX.cover(px, 0, Math.min(0.6, t / 2)); } });
    await wait(1.0);
    S.hero.hide = true;
    await game.say("力竭了……");
  }

  return { intro: intro, bossIntro: bossIntro, weak: weak, down: down, hero: hero, enemy: enemy, victory: victory, defeat: defeat, SPELL: SPELL };
})();
</script>
<script data-src="src/main.js">
/* Scenes: the title (camera circling the tower) and the town, where the hero walks tile by tile.
   SELECT shows how long the last frame took to render, for checking speed on a phone. */
var game = LoGame.create({ width: 160, height: 144, lang: "zh" });
var R = Lo3D.create({ width: 160, height: 144 });
var town = World.build(TOWN);
var CAM = { pitch: -0.62, dist: 8.5 };
var perf = { show: false, ms: 0 };

function frame(g, view, actors) {
  var t0 = performance.now();
  g.sprite(World.render(R, town, view, actors), 0, 0);
  perf.ms = perf.ms * 0.9 + (performance.now() - t0) * 0.1;
  if (perf.show) { g.rect(0, 0, 50, 14, g.INK); g.text(perf.ms.toFixed(1) + " ms", 2, 1, { color: g.PAPER }); }
}
function toggles() { if (game.pressed("select")) perf.show = !perf.show; }

/* ---------- title ---------- */
game.scene("title", {
  enter: function () { busy = false; },
  draw: function (g) {
    var a = game.time * 0.12, T = town.def.tower;
    frame(g, { x: T.x, y: 4, z: -T.y, yaw: a, pitch: -0.22, dist: 17, time: game.time }, []);
    g.window(14, 82, 132, 52);
    g.text("镇妖塔·外传", 80, 88, { align: "center" });
    g.text("内置 LX-3D 协处理器", 80, 104, { align: "center", color: g.DARK });
    if (Math.floor(game.time * 2) % 2) g.text("按 A 开始", 80, 119, { align: "center" });
  },
  update: function () {
    toggles();
    if (busy || !game.ok()) return;
    game.sfx("ok");
    busy = true;
    game.choose(["进入小镇", "演武"], { y: 80 }).then(function (i) {
      busy = false;
      if (i === 0) game.go("town", { intro: true }, { to: LoGame.INK });
      if (i === 1) game.go("battle", { ids: ["golem", "wraith", "bronze"], area: "top", hero: galleryHero(), demo: true, back: "title", from: new Uint8Array(R.image.px) }, { fade: false });
    });
  }
});

/* ---------- 演武: every spell against practice dummies that never strike back ----------
   A showcase for players who only want to watch the effects; it stays in the finished game. */
function galleryHero() { var h = Rules.newHero(10); h.mp = 999; return h; }

/* For tests only, never on screen (the fight list would spoil the route): ZT.fight(part, k) starts fight k of
   BATTLE.ROUTE[part] with the hero a player would have there, every earlier fight won and item found. */
var ZT = {
  heroAt: function (p, k) {
    var h = Rules.newHero(1), xp = 0;
    BATTLE.ROUTE.forEach(function (part, pi) {
      if (pi > p) return;
      Object.keys(part.found).forEach(function (id) { h.items[id] = (h.items[id] || 0) + part.found[id]; });
      part.fights.forEach(function (ids, fi) {
        if (pi < p || fi < k) ids.forEach(function (id) { xp += BATTLE.ENEMIES[id].xp; });
      });
    });
    h.xp = xp; h.level = Rules.levelFor(xp);
    Rules.rest(h);
    return h;
  },
  fight: function (p, k) {
    var part = BATTLE.ROUTE[p];
    game.go("battle", { ids: part.fights[k], area: part.area, hero: ZT.heroAt(p, k), back: "title", from: new Uint8Array(R.image.px) }, { fade: false });
  }
};

/* ---------- town ---------- */
var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
var hero, people, cam, busy = false;

function blocked(c, r) {
  if (c < 0 || r < 0 || c >= town.width || r >= town.height) return true;
  if (town.solid[c + "," + r]) return true;
  return people.some(function (p) { return p.x === c && p.y === r; });
}
/* what stands on a tile: a person, a door, the well, a sign */
function thingAt(c, r) {
  var p = people.filter(function (q) { return q.x === c && q.y === r; })[0];
  if (p) return p;
  var all = TOWN.things.concat(town.spots), well = TOWN.map[r] && TOWN.map[r][c] === "W";
  for (var i = 0; i < all.length; i++) {
    var s = all[i];
    if ((s.x === c && s.y === r) || (well && TOWN.map[s.y][s.x] === "W")) return s;
  }
  return null;
}
async function talk(s) {
  busy = true;
  await game.say(s.say, s.name ? { name: s.name } : {});
  busy = false;
}
/* walking off the map's open edges reads the sign there */
function edge(c, r) {
  var row = r < 0 ? 0 : town.height - 1;
  return TOWN.things.filter(function (s) { return s.y === row && Math.abs(s.x - c) <= 1; })[0];
}

game.scene("town", {
  enter: async function (args) {
    var s = TOWN.start;
    hero = { c: s.x, r: s.y, x: s.x + 0.5, z: -s.y - 0.5, face: s.face, step: 0, moving: null };
    people = TOWN.people.map(function (p) { return { x: p.x, y: p.y, art: ART[p.art], name: p.name, say: p.say }; });
    cam = { x: hero.x, z: hero.z, pitch: CAM.pitch, dist: CAM.dist };
    if (args && args.intro) {
      /* the camera starts on the tower and comes down the road to the hero */
      busy = true;
      cam.x = TOWN.tower.x; cam.z = -TOWN.tower.y + 2; cam.pitch = -0.25; cam.dist = 14;
      await game.wait(0.6);
      await game.tween(cam, { x: hero.x, z: hero.z, pitch: CAM.pitch, dist: CAM.dist }, 3.2, "inOut");
      busy = false;
      await talk({ say: ["镇妖塔的封印松了。", "去镇上问问吧。"] });
    }
  },
  update: function (dt) {
    toggles();
    if (busy) return;
    if (hero.moving) {
      var m = hero.moving;
      m.t = Math.min(1, m.t + dt * 4.2);
      hero.x = m.x0 + (m.x1 - m.x0) * m.t; hero.z = m.z0 + (m.z1 - m.z0) * m.t;
      if (m.t >= 1) hero.moving = null;
    }
    if (!hero.moving) {
      var dir = null;
      ["up", "down", "left", "right"].forEach(function (d) { if (game.btn(d)) dir = dir || d; });
      if (dir) {
        hero.face = dir;
        var c = hero.c + DIRS[dir][0], r = hero.r + DIRS[dir][1];
        if (!blocked(c, r)) {
          hero.moving = { x0: hero.x, z0: hero.z, x1: c + 0.5, z1: -r - 0.5, t: 0 };
          hero.c = c; hero.r = r; hero.step++;
        } else if (game.pressed(dir)) {
          var e = (r < 0 || r >= town.height) && edge(c, r);
          if (e) talk(e); else game.sfx("tick");
        }
      } else if (game.pressed("a")) {
        var f = thingAt(hero.c + DIRS[hero.face][0], hero.r + DIRS[hero.face][1]);
        if (f) { game.sfx("tap"); talk(f); }
      }
    }
    /* the camera trails the hero a little */
    cam.x += (hero.x - cam.x) * Math.min(1, dt * 8);
    cam.z += (hero.z - cam.z) * Math.min(1, dt * 8);
  },
  draw: function (g) {
    var walk = hero.moving ? Math.floor(hero.moving.t * 2 + hero.step) % 2 : 0;
    var art = hero.face === "up" ? (walk ? ART.heroUp1 : ART.heroUp0)
      : hero.face === "down" ? (walk ? ART.heroDown1 : ART.heroDown0)
      : (walk ? ART.heroSide1 : ART.heroSide0);
    var actors = people.map(function (p) { return { art: p.art, x: p.x + 0.5, z: -p.y - 0.5 }; });
    actors.push({ art: art, x: hero.x, z: hero.z, flip: hero.face === "right" });
    frame(g, { x: cam.x, z: cam.z, pitch: cam.pitch, dist: cam.dist, time: game.time }, actors);
  }
});

game.scene("battle", Battle.scene);
game.start("title");
</script>
