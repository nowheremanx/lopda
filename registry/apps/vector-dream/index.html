<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>矢量梦</title>
<style>
  /* the stage is the toy's dark room; no paper shows even for the instant before the first fit */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1f2a14; color: #1f2a14; font-family: monospace; }
  body { position: relative; touch-action: none; }
  canvas { position: absolute; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  /* 13 px on the smallest stage and 15 px from 360 px across (set with the stage's layout); paper on ink */
  #hud, #legend, #card { position: absolute; background: #1f2a14; color: #a3ad7e; border: 1px solid #7d8a58; padding: 3px 5px; white-space: pre; line-height: 1.3; pointer-events: none; }
  /* the HUD and legend stay at the stage's corners, over the picture on a large stage, on purpose: they are the device's readout, not part of the room */
  #hud { left: 6px; top: 6px; font-size: 13px; display: none; }
  /* bottom-left, so it never covers the HUD; no pointer events, a drag over it still turns the view */
  #legend { left: 6px; bottom: 6px; font-size: 13px; }
  /* the scene's name for 1.2 s after A, over the top of the picture */
  #card { left: 50%; transform: translateX(-50%); font-size: 13px; display: none; }
</style>
</head>
<body>
<canvas id="c" width="160" height="144"></canvas>
<div id="hud"></div>
<div id="legend"></div>
<div id="card"></div>
<script data-lo-3d="1.2.0">

 *
 * Pipeline: triangles and billboard sprites are rasterised into a luminance buffer with a
 * z-buffer (flat sun shading and fog per surface, point lights per pixel), then a 4x4 Bayer
 * dither turns luminance into the four tones 0-3. The result is a lo-game sprite

 * 1.1.0 adds fixed tones and screen-door transparency (draw and sprite options tone, alpha), the mesh
 * builder (tri, quad, box, cone, roof, tube, ribbon), ground shadows, R.lookAt and whole-number sprite scales.
 * 1.2.0 adds r.band: surfaces shade in flat tone bands, dithered only near each band's edge; the

 * Reference: sdk/LO-3D.md

  "use strict";

  /* screen-door transparency: the same 16 levels as BAYER with the 2x2 levels swapped, so the pixels a
     half-transparent surface keeps still meet every dither threshold (alpha and dither would cancel out otherwise) */
  var SCREEN = [0, 2, 8, 10, 3, 1, 11, 9, 12, 14, 4, 6, 15, 13, 7, 5];
  var CLEAR = 255;   /* a transparent sprite pixel, as in lo-game */
  var FAR = 1e9;

  /* ---------------- vector helpers: points are [x, y, z] arrays ---------------- */
  function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }

     corners run counter-clockwise; `two: true` draws both sides. */

    var v = [], t = [], i, x = w / 2, y = h / 2, z = d / 2;
    for (i = 0; i < 8; i++) v.push([(i & 1 ? x : -x), (i & 2 ? y : -y), (i & 4 ? z : -z)]);
    var q = [[0, 2, 3, 1], [4, 5, 7, 6], [0, 1, 5, 4], [2, 6, 7, 3], [0, 4, 6, 2], [1, 3, 7, 5]];

    return { v: v, t: t };

    var g = (1 + Math.sqrt(5)) / 2, v = [[-1, g, 0], [1, g, 0], [-1, -g, 0], [1, -g, 0], [0, -1, g], [0, 1, g], [0, -1, -g], [0, 1, -g], [g, 0, -1], [g, 0, 1], [-g, 0, -1], [-g, 0, 1]];
    var t = [[0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11], [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8], [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9], [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]];
    for (var i = 0; i < v.length; i++) { var n = norm(v[i]); v[i] = [n[0] * r, n[1] * r, n[2] * r]; }

  }
  function move(mesh, dx, dy, dz) { return transform(mesh, function (p) { return [p[0] + dx, p[1] + dy, p[2] + dz]; }); }
  /* paint a whole mesh one albedo (0..1) */
  function paint(mesh, albedo) { var c = []; for (var i = 0; i < mesh.t.length; i++) c.push(albedo); return { v: mesh.v, t: mesh.t, c: c, two: mesh.two }; }

  function merge(list) {
    var v = [], t = [], c = [], two = false;
    list.forEach(function (m) {
      var base = v.length;

      m.t.forEach(function (tr, i) { t.push([tr[0] + base, tr[1] + base, tr[2] + base]); c.push(m.c ? m.c[i] : 1); });

     Every face is wound so that it is seen from the side `out` points to, so you never think about winding.
     Each method takes an albedo last and returns the builder; the builder itself is the mesh to draw. */
  function builder() {
    var m = { v: [], t: [], c: [] };

      m.tri([x0, y, z0], [x0, y, z1], A, [-1, 1, 0], alb);

      [[0, sub(path[0], path[1])], [n - 1, sub(path[n - 1], path[n - 2])]].forEach(function (e) {

  function shadow(r, n, albedo) {

  }

  /* ---------------- the renderer ---------------- */

      lum: lum, depth: depth,

            depth[k] = z;

            if (fix) fix[k] = -1;

            if (fog) { var f = Math.min(1, Math.max(0, (z - fNear) / fSpan)); l = l * (1 - f) + fLum * f; }
            lum[k] = l;

              else alb[k] = 0;
            }
          }
        }
      }
    }
    /* a screen-space line into the luminance buffer, no depth: wireframes */
    function line(A, B, l, tn) {
      var x0 = Math.round(A[0]), y0 = Math.round(A[1]), x1 = Math.round(B[0]), y1 = Math.round(B[1]);
      var dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy2 = y0 < y1 ? 1 : -1, e = dx + dy, guard = 0;
      while (guard++ < 600) {
        if (x0 >= 0 && y0 >= 0 && x0 < W && y0 < H) { lum[y0 * W + x0] = l; if (alb) alb[y0 * W + x0] = 0; if (fix) fix[y0 * W + x0] = tn; }
        if (x0 === x1 && y0 === y1) break;
        var e2 = 2 * e;
        if (e2 >= dy) { e += dy; x0 += sx; }
        if (e2 <= dx) { e += dx; y0 += sy2; }

  /* The hills keep their true height everywhere and are shaded dark near, light far (aerial haze).
     The lake is one flat plane at LAKE_Y over the whole grid, never a row of cells: the depth buffer cuts
     the shoreline where the ground rises through the plane, so it wanders with the land. Water is one flat
     tone with a few paper glints drifting on it. */
  function terrain(tm, cam) {
    var n = GN + 1, i, j, off = tm * 1.2, base = Math.floor(off / GS) * GS, fr = off - base;
    var px = [], py = [], pz = [], wet = [];
    for (j = 0; j < n; j++) for (i = 0; i < n; i++) {
      var x = (i - GN / 2) * GS, z = (j - GN / 2) * GS;
      var h = height(x, z - base);
      px.push(x); py.push(h); pz.push(z + fr); wet.push(h < LAKE_Y);
    }
    function id(i, j) { return j * n + i; }
    function at(k) { return [px[k], py[k], pz[k]]; }
    var land = { v: [], t: [], c: [], two: true }, lake = { v: [], t: [], two: true };
    for (j = 0; j < GN; j++) for (i = 0; i < GN; i++) {
      var a = id(i, j), b = id(i + 1, j), c = id(i, j + 1), d = id(i + 1, j + 1);
      var cx = (px[a] + px[d]) / 2, cz = (pz[a] + pz[d]) / 2;
      var far = Math.sqrt((cx - cam.x) * (cx - cam.x) + (cz - cam.z) * (cz - cam.z));
      var alb = Math.min(1.15, 0.45 + far * 0.09);   /* near slopes stay above the ink band: darker, they dithered rows of ink dots that read as stripes (owner, 2026-11-25) */
      var k = land.v.length;
      land.v.push(at(a), at(c), at(d), at(a), at(d), at(b));
      land.t.push([k, k + 1, k + 2], [k + 3, k + 4, k + 5]);
      land.c.push(alb, alb);
    }
    /* the water surface: one cell at a time so the renderer's near-plane skip only drops the bits under
       the eye, all at the same height */
    for (j = 0; j < GN; j++) for (i = 0; i < GN; i++) {
      var x0 = (i - GN / 2) * GS, x1 = x0 + GS, z0 = (j - GN / 2) * GS + fr, z1 = z0 + GS;
      lake.v.push([x0, LAKE_Y, z0], [x1, LAKE_Y, z0], [x1, LAKE_Y, z1], [x0, LAKE_Y, z0], [x1, LAKE_Y, z1], [x0, LAKE_Y, z1]);
      k = lake.v.length - 6;
      lake.t.push([k, k + 1, k + 2], [k + 3, k + 4, k + 5]);
    }
    /* in wireframe the full lattice would crowd out the hills, so the water is a few horizontal lines */
    var lakeWire = { v: [], t: [], two: true };
    for (j = 0; j <= GN; j += 2) {
      var wz = (j - GN / 2) * GS + fr, xW = -GN / 2 * GS, xE = GN / 2 * GS;
      k = lakeWire.v.length;
      lakeWire.v.push([xW, LAKE_Y, wz], [xE, LAKE_Y, wz], [xE, LAKE_Y, wz + 0.015],
                      [xW, LAKE_Y, wz], [xE, LAKE_Y, wz + 0.015], [xW, LAKE_Y, wz + 0.015]);
      lakeWire.t.push([k, k + 1, k + 2], [k + 3, k + 4, k + 5]);
    }
    /* a handful of short paper glints on the water; they drift slowly, and the depth buffer hides
       the ones that drift over land, so the dashes are cut by the real shoreline */
    var glints = [];
    for (var g = 0; g < GLINTS.length; g++) {
      var gl = GLINTS[g], ph = g * 1.7;
      glints.push([gl[0] + Math.sin(tm * 0.31 + ph) * 0.22, gl[1] + Math.cos(tm * 0.19 + ph) * 0.14,
                   gl[2] * (0.75 + 0.25 * Math.sin(tm * 0.5 + ph))]);
    }
    return { land: land, lake: lake, lakeWire: lakeWire, glints: glints };
  }
  function cube(s) {
    var v = [], t = [], i;
    for (i = 0; i < 8; i++) v.push([(i & 1 ? s : -s), (i & 2 ? s : -s), (i & 4 ? s : -s)]);
    var q = [[0, 2, 3, 1], [4, 5, 7, 6], [0, 1, 5, 4], [2, 6, 7, 3], [0, 4, 6, 2], [1, 3, 7, 5]];
    for (i = 0; i < 6; i++) t.push([q[i][0], q[i][1], q[i][2]], [q[i][0], q[i][2], q[i][3]]);
    return { v: v, t: t };
  }
  /* one albedo per face, so the crystal is a set of facets instead of a single flat value */
  function facets(mesh) {
    var c = [];
    for (var i = 0; i < mesh.t.length; i++) c.push(0.74 + (i % 5) * 0.07);
    return { v: mesh.v, t: mesh.t, c: c };
  }
  /* the sun as one clean disc: paper inside, a one-pixel ink rim. 255 is lo-3d's transparent sprite pixel. */
  var SUN_DISC = (function () {
    var n = 15, s = { w: n, h: n, px: new Uint8Array(n * n) };
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
      var dx = x - 7, dy = y - 7, rr = Math.sqrt(dx * dx + dy * dy);
      s.px[y * n + x] = rr <= 5.3 ? 3 : rr <= 6.3 ? 0 : 255;
    }
    return s;
  })();
  var KNOT = knot(), ICO = facets(Lo3D.ico(0.9)), CUBE = cube(0.18), SUN = Lo3D.ico(1.2);

  /* ---------- state ---------- */
  var yaw = 0.6, pitch = 0.35, dist = 4.2, scene = 0, wire = false;
  /* the flyover has its own eye: it flies forward (the land comes toward -z, so it looks along -z), a little above
     the hills ahead and looking down at them. The pad and a drag turn this eye instead of the orbit. */
  var FLY = { z: 3, ahead: [0, 0.5, 1, 1.5], yaw: 0, pitch: -0.35 };
  var FOG = { near: 2.5, far: 7, lum: 0.95 };
  /* a dusk sky: the top stays darker than the far hills, so a ridge shows against it */
  function sky(y) { return 0.34 + 0.48 * (y / H); }
  /* screensaver: 10 s without input starts the tour, which moves to the next scene every 25 s and sways
     the camera a little. Any key, drag or held arrow stops it; the sway fades out so the view never jumps. */
  var TOUR_IDLE = 10000, TOUR_SCENE = 25000;
  var lastInput = null, tour = false, tourAt = 0, tourFade = 0, inputFlag = false, clock = 0;

  /* ---------- scenes ---------- */
  function render(tm) {
    var cam = R.camera, o = { wire: wire };
    var sway = tourFade * Math.sin(tm * 0.22) * 0.1;
    /* the orbit scenes look at the origin; the flyover moves the eye, so put it back every frame */
    cam.x = cam.y = cam.z = 0; cam.yaw = yaw; cam.pitch = pitch + sway;
    cam.dist = dist + tourFade * Math.sin(tm * 0.17) * 0.3;
    R.fog = null;
    if (scene === 0) {
      R.clear(1);   /* flat paper: the old 0.92 dotted the whole background */
      R.draw(KNOT, function (p) { return rotX(rotY(p, tm * 0.7), tm * 0.4); }, o);
    } else if (scene === 1) {
      R.clear(sky);
      /* the eye rides over the highest ground just ahead of it, so it never dips into a hill;
         SELECT raises it (dist 3.2..5.6 -> 0.5..1.7 above the ground) */
      var ground = LAKE_Y, k;
      for (k = 0; k < FLY.ahead.length; k++) ground = Math.max(ground, height(0, FLY.z - FLY.ahead[k] - tm * 1.2));
      cam.dist = 0; cam.x = 0; cam.z = FLY.z; cam.y = ground + 0.5 + (dist - 3.2) * 0.5 + tourFade * Math.sin(tm * 0.22) * 0.06;
      cam.yaw = Math.PI + FLY.yaw; cam.pitch = FLY.pitch + sway * 0.35;
      /* the sun sits far away ahead of the eye, low enough to stay in the picture, and follows its yaw */
      var sunDir = rotY([0, 0, 1], cam.yaw);
      var sc = [sunDir[0] * 14, 2.4, sunDir[2] * 14];
      if (wire) {
        R.draw(SUN, function (p) { var q = rotY(rotX(p, tm * 0.3), tm * 0.5); return [q[0] + sc[0], q[1] + sc[1], q[2] + sc[2]]; }, { wire: true });
      } else {
        R.sprite(SUN_DISC, sc[0], sc[1], sc[2], { scale: 0.16, anchor: "center" });
      }
      R.fog = FOG; R.clearDepth();
      var terr = terrain(tm, cam);
      if (wire) {
        R.draw(terr.land, null, o);
        R.draw(terr.lakeWire, null, o);
      } else {
        R.draw(terr.land, null, {});
        R.draw(terr.lake, null, { tone: LAKE_TONE, two: true });
      }
    } else {
      R.clear(1);
      var spin = function (p) { return rotY(rotZ(p, tm * 0.3), tm * 0.6); };
      if (wire) {
        R.draw(ICO, spin, { wire: true, bias: 0.05 });
      } else {
        R.draw(ICO, spin, { bias: 0.08 });
        R.draw(ICO, spin, { wire: true, tone: 0 });
      }
      for (var i = 0; i < 6; i++) {
        var a = tm * 1.1 + i * Math.PI / 3, r = 1.7;
        var c = [Math.cos(a) * r, Math.sin(a * 2) * 0.35, Math.sin(a) * r];
        R.draw(CUBE, function (p) { var q = rotX(rotY(p, tm * 2 + i), tm * 1.5); return [q[0] + c[0], q[1] + c[1], q[2] + c[2]]; }, o);
      }
    }
    R.present();
    if (scene === 1 && !wire) {
      /* no ink crest lines: on a phone they read as black streaks across the slopes (owner, 2026-11-25);
         the distance shading alone separates the hills */
      for (var gl = 0; gl < terr.glints.length; gl++) {
        var g = terr.glints[gl];
        R.streak([g[0], LAKE_Y + 0.02, g[1]], [g[0] + g[2], LAKE_Y + 0.02, g[1]], 2);
        R.streak([g[0] + 0.12, LAKE_Y + 0.02, g[1] + 0.07], [g[0] + 0.12 + g[2] * 0.7, LAKE_Y + 0.02, g[1] + 0.07], 2);
      }
    }
    R.paint(img);
    ctx.putImageData(upscale(), X0, Y0);
  }

  /* ---------- input ---------- */
  function clampPitch() { pitch = Math.max(-1.2, Math.min(1.3, pitch)); }
  /* turn the orbit, or in the flyover the flying eye (a narrower range: it keeps the land in view).
     dy > 0 is the left key: the orbit swings the model left, the eye turns left (a smaller yaw). */
  function turn(dy, dp) {
    if (scene === 1) {
      FLY.yaw = Math.max(-1.2, Math.min(1.2, FLY.yaw - dy));
      FLY.pitch = Math.max(-0.9, Math.min(0.3, FLY.pitch + dp));
    } else { yaw += dy; pitch += dp; clampPitch(); }
  }
  if (typeof PAD !== "undefined") {
    PAD.on("press", function (b) {
      inputFlag = true;
      hideLegend();   /* any key: the player has found the pad */
      if (b === "a") { scene = (scene + 1) % 3; showCard(); PAD.sfx("tick"); }
      else if (b === "b") { wire = !wire; PAD.sfx("tick"); }
      else if (b === "start") { setInfo(!info); }
      else if (b === "select") { dist = dist > 5 ? 3.2 : dist + 0.8; }
    });
  }
  function held(b) { return typeof PAD !== "undefined" && PAD.isDown && PAD.isDown(b); }
  var drag = null;
  cv.addEventListener("pointerdown", function (e) {
    inputFlag = true; hideLegend();
    drag = { x: e.clientX, y: e.clientY, id: e.pointerId };
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  });
  cv.addEventListener("pointermove", function (e) {
    if (!drag || drag.id !== e.pointerId) return;
    inputFlag = true;
    /* the orbit turns the model with the finger; in the flyover the land follows the finger */
    var dx = (e.clientX - drag.x) * 0.012;
    turn(scene === 1 ? dx : -dx, (e.clientY - drag.y) * 0.012);
    drag.x = e.clientX; drag.y = e.clientY;
  });
  function endDrag() { drag = null; }
  cv.addEventListener("pointerup", endDrag); cv.addEventListener("pointercancel", endDrag);

  /* ---------- loop ---------- */
  var last = 0, frames = 0, fpsT = 0, fps = 0, start = 0;
  function frame(now) {
    fitStage();   /* the stage may be sized after the app's first frame */
    if (!start) { start = now; last = now; }
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    clock = now;
    if (cardShown && now - cardAt >= 1200) { cardShown = false; card.style.display = "none"; }
    if (lastInput == null) lastInput = now;
    /* the tour starts after the idle time, moves on every TOUR_SCENE, and any input puts it to sleep again */
    var acting = held("left") || held("right") || held("up") || held("down");
    if (inputFlag) { inputFlag = false; lastInput = now; if (tour) tour = false; }
    if (acting) { lastInput = now; if (tour) tour = false; }
    if (!tour && now - lastInput >= TOUR_IDLE) { tour = true; tourAt = now; scene = (scene + 1) % 3; }
    else if (tour && now - tourAt >= TOUR_SCENE) { tourAt = now; scene = (scene + 1) % 3; }
    tourFade += ((tour ? 1 : 0) - tourFade) * Math.min(1, dt * 3);
    if (held("left")) turn(dt * 1.6, 0);
    if (held("right")) turn(-dt * 1.6, 0);
    if (held("up")) turn(0, dt * 1.2);
    if (held("down")) turn(0, -dt * 1.2);
    if (!drag && !held("left") && !held("right")) yaw += dt * 0.15;   /* the orbit drifts; the flyover holds its course */
    render((now - start) / 1000);
    frames++; fpsT += dt;
    if (fpsT >= 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
    if (info) hud.textContent = T.scene + " " + T.names[scene] + "\n" + T.mode + " " + (wire ? T.wire : T.solid) + "\n" + T.fps + " " + fps + "  " + T.tri + " " + R.stats.tris;
    requestAnimationFrame(frame);
  }
  /* the tests' window on the app; the demo itself never reads it */
  window.VECDREAM = { fit: frameLayout, state: function () {
    return { scene: scene, wire: wire, info: info, tour: tour,
      hud: hud.style.display !== "none", legend: legend ? legend.style.display !== "none" : false,
      hudText: hud.textContent, card: cardShown, cardText: card.textContent,
      idle: lastInput == null ? 0 : clock - lastInput,
      layout: { k: K, vw: VW, vh: VH, x: X0, y: Y0, cw: CVW, ch: CVH, ui: UIPX } };
  } };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
