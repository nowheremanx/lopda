<script data-src="src/00-main.js">
/* 山脚小馆 — the game object and a few globals. */
var game = LoGame.create({ width: 216, height: 240, lang: "zh" });

/* Every scene gets two hooks for free: SELECT toggles the layout grid, and the
 * grid is painted after the scene so a stray label cannot hide it. */
var sceneBase = game.scene;
game.scene = function (name, def) {
  var update = def.update, draw = def.draw;
  def.update = function (dt) {
    if (game.pressed("select")) {
      UI.debugOn = !UI.debugOn;
      sayToast(UI.debugOn ? "布局网格：开" : "布局网格：关");
      game.sfx("tick");
    }
    if (update) update.call(this, dt);
  };
  def.draw = function (g) {
    if (draw) draw.call(this, g);
    if (UI.debugOn && typeof UI !== "undefined") UI.debug(g);
  };
  return sceneBase.call(game, name, def);
};
var T = game.t;
var W = 216, H = 240;
var SAVE_KEY = "diner";
var SAVE_VERSION = 1;
var busy = false;
var toast = { text: "", until: 0 };
function sayToast(text) { toast.text = text; toast.until = game.time + 2.6; }
document.documentElement.lang = game.lang === "zh" ? "zh-CN" : "en";
</script>

  for (var st = 0; st < 3; st++) {

      g.line(rx, ry, rx - 2, ry + 5, g.DARK);

  // lantern light: the bodies are on the plate, the halo moves

  g.dither(x - w / 2, y - h / 2, w, h, g.PAPER, pulse > 0.5 ? 1 : 2);
};

ART.pine = function (g, x, y, k) {
  var h = Math.round(38 * k);
  for (var j = 0; j < h; j++) {
    var half = Math.round(j * 0.34 * k);
    g.rect(x + Math.round(8 * k) - half, y + j, half * 2 + 1, 1, g.INK);
  }
  g.rect(x + Math.round(7 * k), y + h, Math.max(2, Math.round(3 * k)), Math.round(8 * k), g.DARK);
};

ART.scale = function (s, k) {
  var w = Math.max(1, Math.round(s.w * k)), h = Math.max(1, Math.round(s.h * k));
  var px = new Uint8Array(w * h);
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
    px[y * w + x] = s.px[Math.floor(y / k) * s.w + Math.floor(x / k)];
  }
  return { w: w, h: h, px: px };
};

  heroSide: ART.scale(ART.heroSide, 2),
  heroDown: ART.scale(ART.heroDown, 1.34),
  heroUp: ART.scale(ART.heroUp, 1.34),
  ahe: ART.scale(ART.ahe, 1.34),
  zhou: ART.scale(ART.zhou, 1.34),
  yan: ART.scale(ART.yan, 1.34),
  po: ART.scale(ART.po, 1.34),
  guestA: ART.scale(ART.guestA, 1.34),
  guestB: ART.scale(ART.guestB, 1.34),
  guestC: ART.scale(ART.guestC, 1.34),
  boar: ART.scale(ART.boar, 2),
  monkey: ART.scale(ART.monkey, 2),
  bamboo: ART.scale(ART.bamboo, 1.8)
};

/* ---------------- the mountain ---------------- */
ART.forest = function (g, map, t, s) {
  g.clear(g.MID);
  for (var r = 0; r < map.length; r++) {
    for (var c = 0; c < map[r].length; c++) {
      var ch = map[r][c], x = c * 12, y = 24 + r * 12;
      if (ch === "~") {
        g.rect(x, y, 12, 12, g.MID);
        g.rect(x, y + 2, 12, 1, g.DARK);
        g.rect(x + 2 + ((Math.floor(t * 2) + r) % 6), y + 6, 5, 1, g.PAPER);
        g.rect(x + 7, y + 9, 3, 1, g.DARK);
        if ((r + c) % 3 === 0) g.rect(x + 2, y + 10, 1, 2, g.DARK);
      } else if (ch === "#") {
        g.rect(x, y, 12, 12, g.PAPER);
        g.rect(x + 1, y + 5, 10, 7, g.DARK);
        g.rect(x + 3, y + 3, 6, 4, g.DARK);
        g.dither(x + 2, y + 6, 8, 4, g.INK, 1);
        g.rect(x + 3, y + 6, 2, 1, g.MID);
      } else if (ch === ",") {
        g.rect(x, y, 12, 12, g.MID);
        g.rect(x + 2, y + 3, 2, 1, g.DARK);
        g.rect(x + 7, y + 8, 3, 1, g.DARK);
        if ((r + c) % 3 === 0) g.rect(x + 4, y + 6, 4, 1, g.PAPER);
        if ((r * 5 + c) % 7 === 0) g.rect(x + 9, y + 2, 2, 2, g.DARK);
      } else {
        g.rect(x, y, 12, 12, g.PAPER);
        if ((r * 7 + c * 3) % 5 === 0) g.rect(x + 2, y + 4, 2, 1, g.MID);
        if ((r * 3 + c * 5) % 7 === 0) g.rect(x + 7, y + 8, 2, 2, g.MID);
        if ((r * 11 + c * 7) % 13 === 0) {
          g.rect(x + 4, y + 2, 1, 3, g.DARK);
          g.rect(x + 6, y + 3, 1, 2, g.DARK);
          g.rect(x + 5, y + 1, 2, 1, g.MID);
        }
        if (ch === "*") {
          g.rect(x + 5, y + 4, 2, 4, g.DARK);
          g.rect(x + 3, y + 3, 6, 2, g.INK);
          g.pixel(x + 5, y + 2, g.PAPER);
          g.pixel(x + 4, y + 3, g.PAPER);
        }
        if ((r + c) % 9 === 0) {
          g.rect(x + 8, y + 5, 1, 3, g.DARK);
          g.rect(x + 9, y + 7, 1, 2, g.DARK);
        }
      }
    }
  }
  if (s && s.weather === "rain") {
    for (var i = 0; i < 11; i++) {
      var rx = (i * 47 + Math.floor(t * 22)) % 216;
      var ry = 24 + ((i * 59 + Math.floor(t * 27)) % 192);
      g.line(rx, ry, rx - 1, ry + 3, g.DARK);
    }
    g.dither(0, 24, 216, 30, g.INK, 1);
  } else if (s && s.weather === "fog") {
    g.dither(0, 24, 216, 40, g.PAPER, 1);
    g.dither(0, 64, 216, 24, g.PAPER, 1);
  } else {
    g.dither(0, 24, 216, 46, g.PAPER, 1);
  }
};

ART.tree = function (g, x, y, t) {
  var sway = Math.sin(t * 1.2 + x) > 0 ? 1 : 0;
  // trunk and roots
  g.rect(x + 5, y + 14, 4, 18, g.DARK);
  g.rect(x + 4, y + 14, 2, 18, g.INK);
  g.rect(x + 3, y + 28, 7, 3, g.INK);
  g.rect(x + 2, y + 30, 4, 1, g.DARK);
  g.rect(x + 8, y + 30, 4, 1, g.DARK);
  // layered canopy
  g.rect(x - 4, y + 6 + sway, 20, 8, g.INK);
  g.rect(x - 2, y + 2 + sway, 16, 8, g.INK);
  g.rect(x + 1, y - 2 + sway, 10, 6, g.INK);
  g.rect(x - 6, y + 11 + sway, 24, 5, g.DARK);
  g.dither(x - 2, y + 4 + sway, 16, 8, g.DARK, 1);
  g.dither(x + 2, y + 1 + sway, 8, 5, g.MID, 1);
  // leaf clusters
  g.rect(x - 3, y + 7 + sway, 3, 2, g.MID);
  g.rect(x + 11, y + 9 + sway, 4, 2, g.MID);
  g.rect(x + 4, y + 13 + sway, 3, 1, g.MID);
  g.rect(x + 14, y + 4 + sway, 2, 2, g.DARK);
  g.rect(x - 5, y + 9 + sway, 2, 2, g.DARK);
};

ART.bush = function (g, x, y, t) {
  var sway = Math.sin(t * 2 + x) > 0 ? 1 : 0;
  g.rect(x + 1, y + 8 + sway, 10, 5, g.INK);
  g.rect(x + 3, y + 5 + sway, 6, 5, g.INK);
  g.dither(x + 3, y + 6 + sway, 7, 4, g.DARK, 1);
  g.rect(x + 5, y + 7 + sway, 3, 2, g.MID);
  g.rect(x + 9, y + 10, 2, 3, g.DARK);
};

ART.bambooPlant = function (g, x, y, t) {
  var sway = Math.sin(t * 1.5 + x) > 0 ? 1 : 0;
  g.rect(x + 5, y - 6, 3, 30, g.DARK);
  g.rect(x + 4, y - 6, 1, 30, g.INK);
  for (var i = 0; i < 4; i++) {
    var ly = y - 2 + i * 6;
    g.rect(x + 8 + sway, ly, 6, 1, g.INK);
    g.rect(x - 1 + sway, ly + 2, 5, 1, g.INK);
    g.rect(x + 10 + sway, ly - 2, 4, 1, g.DARK);
  }
};

ART.shrine = function (g, x, y, t) {
  g.rect(x + 2, y + 4, 3, 24, g.DARK);
  g.rect(x + 19, y + 4, 3, 24, g.DARK);
  g.rect(x, y, 24, 3, g.INK);
  g.rect(x + 3, y + 4, 18, 2, g.INK);
  g.rect(x - 2, y + 6, 28, 2, g.DARK);
  g.rect(x + 4, y + 10, 16, 1, g.DARK);
  g.rect(x + 9, y + 12, 6, 14, g.PAPER);
  g.text("山", x + 12, y + 13, { align: "center", color: g.DARK });
  if (Math.floor(t * 2) % 2 === 0) g.pixel(x + 12, y + 28, g.PAPER);
};

ART.node = function (g, kind, x, y, t) {
  var blink = Math.floor(t * 3 + x) % 4 === 0;
  if (kind === "mushroom") {
    g.rect(x + 2, y + 6, 8, 5, g.INK);
    g.rect(x + 3, y + 7, 6, 3, g.PAPER);
    g.rect(x + 1, y + 4, 5, 4, g.DARK);
    g.rect(x + 6, y + 2, 5, 4, g.DARK);
    g.pixel(x + 3, y + 5, g.PAPER); g.pixel(x + 8, y + 3, g.PAPER);
  } else if (kind === "greens") {
    g.rect(x + 3, y + 8, 6, 2, g.INK);
    g.rect(x + 2, y + 3, 4, 6, g.DARK);
    g.rect(x + 6, y + 1, 4, 8, g.DARK);
    g.rect(x + 8, y + 5, 3, 5, g.MID);
  } else if (kind === "rice") {
    g.rect(x + 3, y + 2, 1, 9, g.DARK);
    g.rect(x + 7, y + 1, 1, 10, g.DARK);
    for (var i = 0; i < 3; i++) {
      g.rect(x + 1, y + 3 + i * 3, 3, 2, g.PAPER);
      g.rect(x + 8, y + 2 + i * 3, 3, 2, g.PAPER);
    }
  } else if (kind === "fish") {
    g.rect(x + 2, y + 5, 8, 4, g.INK);
    g.rect(x + 3, y + 6, 6, 2, g.MID);
    g.rect(x + 9, y + 4, 2, 2, g.INK);
    g.pixel(x + 4, y + 6, g.PAPER);
    g.rect(x + 1, y + 9, 3, 1, g.PAPER);
  } else if (kind === "bamboo") {
    g.rect(x + 4, y + 2, 4, 10, g.DARK);
    g.rect(x + 5, y + 2, 2, 10, g.PAPER);
    g.rect(x + 3, y + 6, 6, 1, g.INK);
    g.rect(x + 8, y + 1, 3, 3, g.INK);
  } else if (kind === "rare") {
    g.rect(x + 4, y + 6, 1, 6, g.PAPER);
    g.rect(x + 7, y + 4, 1, 8, g.PAPER);
    g.rect(x + 3, y + 3, 5, 4, g.INK);
    g.rect(x + 6, y + 1, 5, 4, g.INK);
    if (blink) g.dither(x + 1, y + 1, 10, 10, g.PAPER, 2);
  }
  if (blink) {
    g.pixel(x + 1, y + 1, g.PAPER);
    g.pixel(x + 10, y + 2, g.PAPER);
  }
};

ART.monster = function (g, id, x, y, t) {
  if (id === "boar") {
    g.dither(x - 4, y + 9, 20, 3, g.DARK, 1);
    g.sprite(ART.boar, x - 8, y - 4 + (Math.sin(t * 3) > 0 ? 1 : 0));
    g.pixel(x + 2, y, g.PAPER);
  } else if (id === "monkey") {
    g.dither(x - 2, y + 10, 16, 2, g.DARK, 1);
    g.sprite(ART.monkey, x - 4, y - 3 + (Math.sin(t * 4) > 0 ? 1 : 0));
  } else if (id === "bamboo") {
    g.dither(x - 3, y + 10, 18, 2, g.DARK, 1);
    g.sprite(ART.bamboo, x - 4, y - 12 + (Math.sin(t * 2) > 0 ? 1 : 0));
  } else if (id === "boss") {
    g.dither(x - 12, y + 10, 36, 3, g.INK, 2);
    ART.boss(g, x - 20, y - 34, t, false);
  }
};

ART.enemyBig = function (g, id, x, y, t, hurt) {
  var bob = Math.sin(t * 3) > 0 ? 1 : 0;
  if (id === "boss") { ART.boss(g, x, y, t, hurt); return; }
  var s = id === "boar" ? ART.big.boar : id === "monkey" ? ART.big.monkey : ART.big.bamboo;
  g.dither(x + 2, y + s.h - 2, s.w - 4, 3, g.DARK, 1);
  if (hurt) g.sprite(s, x, y + bob, { map: [g.PAPER, g.PAPER, g.PAPER, g.PAPER] });
  else g.sprite(s, x, y + bob);
  if (id === "boar") {
    g.pixel(x + 20, y + 14 + bob, g.PAPER);
    g.rect(x + 5, y + 20 + bob, 7, 1, g.PAPER);
  } else if (id === "monkey") {
    g.pixel(x + 18, y + 14 + bob, g.PAPER);
  } else {
    g.pixel(x + 18, y + 14 + bob, g.PAPER);
  }
};

/* ---------------- battle ---------------- */
ART.battleBg = function (g, kind, t) {
  g.clear(g.PAPER);
  var deep = kind === "deep";
  // sky
  g.dither(0, 0, 216, deep ? 44 : 50, g.MID, deep ? 2 : 1);
  if (deep) {
    g.rect(0, 0, 216, 30, g.DARK);
    g.dither(0, 0, 216, 30, g.INK, 1);
  } else {
    g.rect(0, 0, 216, 24, g.PAPER);
  }
  // far hills
  g.line(0, 62, 28, 40, deep ? g.DARK : g.DARK);
  g.line(28, 40, 56, 62, g.DARK);
  g.line(44, 62, 80, 34, g.DARK);
  g.line(80, 34, 116, 62, g.DARK);
  g.line(104, 62, 144, 42, g.DARK);
  g.line(144, 42, 184, 62, g.DARK);
  g.line(170, 62, 206, 48, g.DARK);
  g.line(206, 48, 216, 56, g.DARK);
  g.dither(46, 44, 30, 16, g.DARK, 1);
  g.dither(128, 46, 34, 14, g.DARK, 1);
  // distant pines
  ART.pine(g, 6, 24, 0.7);
  ART.pine(g, 38, 30, 0.55);
  ART.pine(g, 168, 28, 0.65);
  ART.pine(g, 198, 22, 0.8);
  // mist
  g.dither(0, 62, 216, 10, g.PAPER, 2);
  g.dither(0, 78, 216, 6, g.PAPER, 1);
  // trees at the sides
  ART.pine(g, -10, 28, 1.3);
  ART.pine(g, 190, 30, 1.4);
  if (!deep) {
    ART.tree(g, -8, 62, t);
    ART.tree(g, 202, 58, t);
  }
  // ground
  g.rect(0, 104, 216, 46, g.PAPER);
  g.dither(0, 104, 216, 7, g.MID, 1);
  g.rect(0, 104, 216, 1, g.DARK);
  for (var i = 0; i < 18; i++) {
    var gx = (i * 37) % 216, gy = 112 + (i * 17) % 30;
    g.rect(gx, gy, 5, 1, g.MID);
    if (i % 3 === 0) g.rect(gx + 2, gy - 2, 1, 2, g.DARK);
  }
  // a little path
  g.rect(72, 104, 72, 2, g.MID);
  g.dither(72, 106, 72, 3, g.DARK, 1);
  // light shafts
  if (!deep) {
    for (var b = 0; b < 4; b++) {
      var bx = 18 + b * 18;
      for (var j = 0; j < 6; j++) g.rect(bx + j * 2, 8 + j * 9, 4, 8, g.PAPER);
    }
  }
  if (deep) {
    ART.shrine(g, 92, 56, t);
    g.dither(0, 72, 216, 30, g.PAPER, 2);
    g.rect(0, 104, 216, 46, g.DARK);
    g.dither(0, 104, 216, 8, g.INK, 1);
    for (var r = 0; r < 10; r++) g.rect((r * 29) % 216, 112 + (r * 7) % 30, 6, 1, g.MID);
  } else {
    // flowers
    for (var f = 0; f < 6; f++) {
      g.rect(10 + f * 34, 128 + (f % 3) * 5, 2, 2, g.MID);
      g.pixel(11 + f * 34, 127 + (f % 3) * 5, g.PAPER);
    }
  }
  // fireflies
  for (var j2 = 0; j2 < 8; j2++) {
    var fx = (j2 * 43 + Math.sin(t * 0.8 + j2) * 9) % 216;
    var fy = 52 + (j2 * 19) % 48;
    if (Math.floor(t * 2 + j2) % 3) g.pixel(fx, fy, g.PAPER);
  }
};

ART.enemyBig = function (g, id, x, y, t, hurt) {
  var bob = Math.sin(t * 3) > 0 ? 1 : 0;
  if (id === "boss") { ART.boss(g, x, y, t, hurt); return; }
  var s = id === "boar" ? ART.big.boar : id === "monkey" ? ART.big.monkey : ART.big.bamboo;
  g.dither(x + 2, y + s.h - 2, s.w - 4, 3, g.DARK, 1);

  if (id === "boar") {
    g.pixel(x + 20, y + 14 + bob, g.PAPER);

  } else if (id === "monkey") {
    g.pixel(x + 18, y + 14 + bob, g.PAPER);
  } else {
    g.pixel(x + 18, y + 14 + bob, g.PAPER);
  }
};

/* ---------------- battle ---------------- */
ART.battleBg = function (g, kind, t) {
  ART.plate(g, PLATES.mountain, 0, 0);
  var deep = kind === "deep";
  // the fight stands on a stage cut into the mountain plate
  g.rect(0, 108, 216, 132, deep ? g.DARK : g.PAPER);
  g.dither(0, 108, 216, 6, g.MID, 1);
  g.rect(0, 108, 216, 1, g.DARK);
  for (var i = 0; i < 18; i++) {
    var gx = (i * 37) % 216, gy = 114 + (i * 17) % 30;

    if (i % 3 === 0) g.rect(gx + 2, gy - 2, 1, 2, deep ? g.DARK : g.INK);
  }

  g.rect(72, 108, 72, 2, g.MID);
  g.dither(72, 110, 72, 3, g.DARK, 1);
  if (deep) {

    g.dither(0, 0, 216, 44, g.INK, 1);
    ART.shrine(g, 92, 56, t);
    g.dither(0, 72, 216, 36, g.PAPER, 1);
    for (var r = 0; r < 10; r++) g.rect((r * 29) % 216, 114 + (r * 7) % 30, 6, 1, g.MID);
  } else {

    }
  }
  // fireflies
  for (var j2 = 0; j2 < 8; j2++) {
    var fx = (j2 * 43 + Math.sin(t * 0.8 + j2) * 9) % 216;

    if (Math.floor(t * 2 + j2) % 3) g.pixel(fx, fy, g.PAPER);

ART.enemy = function (g, id, x, y, t, hurt) {
  var bob = Math.sin(t * 3) > 0 ? 1 : 0;
  if (id === "boss") {
    ART.boss(g, x, y, t, hurt);
    return;
  }
  var s = id === "boar" ? ART.boar : id === "monkey" ? ART.monkey : ART.bamboo;
  g.dither(x + 2, y + s.h - 2, s.w - 4, 3, g.DARK, 1);
  if (hurt) g.sprite(s, x, y + bob, { map: [g.PAPER, g.PAPER, g.PAPER, g.PAPER] });
  else g.sprite(s, x, y + bob);
  if (id === "boar") {
    g.pixel(x + 12, y + 8 + bob, g.PAPER);
    g.rect(x + 3, y + 11 + bob, 4, 1, g.PAPER);
  } else if (id === "monkey") {
    g.pixel(x + 10, y + 8 + bob, g.PAPER);
  } else {
    g.pixel(x + 10, y + 8 + bob, g.PAPER);
  }
};

ART.boss = function (g, x, y, t, hurt) {
  var bob = Math.sin(t * 1.6) > 0 ? 1 : 0;
  var c = hurt ? g.PAPER : g.DARK;
  g.dither(x + 4, y + 40, 34, 4, g.INK, 2);
  // body
  g.circle(x + 20, y + 26, 18, c, true);
  g.circle(x + 20, y + 18, 13, c, true);
  g.rect(x + 3, y + 28, 34, 14, c);
  // arms
  g.rect(x - 2, y + 24 + bob, 7, 16, c);
  g.rect(x + 35, y + 24 + bob, 7, 16, c);
  // legs
  g.rect(x + 8, y + 38, 8, 8, c);
  g.rect(x + 24, y + 38, 8, 8, c);
  // fur dither
  g.dither(x + 4, y + 10, 32, 28, hurt ? g.DARK : g.INK, 1);
  // horns
  g.rect(x + 8, y + 2, 4, 10, g.INK);
  g.rect(x + 28, y + 2, 4, 10, g.INK);
  g.rect(x + 6, y - 2, 4, 5, g.PAPER);
  g.rect(x + 30, y - 2, 4, 5, g.PAPER);
  // face
  g.rect(x + 11, y + 12, 6, 4, g.INK);
  g.rect(x + 23, y + 12, 6, 4, g.INK);
  if (!hurt) {
    g.pixel(x + 13, y + 13, g.PAPER); g.pixel(x + 25, y + 13, g.PAPER);
  }
  g.rect(x + 14, y + 20, 12, 3, g.INK);
  g.rect(x + 12, y + 24, 4, 2, g.PAPER);
  g.rect(x + 24, y + 24, 4, 2, g.PAPER);
  // moss
  g.dither(x + 8, y + 32, 24, 6, g.MID, 2);
};

/* ---------------- portraits ---------------- */
function portraitBase(g, x, y, opts) {
  opts = opts || {};
  var hair = opts.hair == null ? g.INK : opts.hair;
  // hair behind the head
  g.rect(x + 2, y + 12, 76, 64, hair);
  // neck and robe
  g.rect(x + 32, y + 64, 16, 12, g.PAPER);
  g.rect(x + 8, y + 76, 64, 24, g.DARK);
  g.rect(x + 14, y + 76, 52, 4, g.MID);
  // face
  g.rect(x + 18, y + 22, 44, 32, g.PAPER);
  g.rect(x + 16, y + 30, 48, 22, g.PAPER);
  g.rect(x + 22, y + 52, 36, 8, g.PAPER);
  g.rect(x + 26, y + 58, 28, 4, g.PAPER);
  // fringe and side locks
  g.rect(x + 12, y + 10, 56, 16, hair);
  g.rect(x + 10, y + 24, 8, 40, hair);
  g.rect(x + 62, y + 24, 8, 40, hair);
  // eyes
  g.rect(x + 26, y + 38, 5, 3, g.INK);
  g.rect(x + 47, y + 38, 5, 3, g.INK);
  g.rect(x + 27, y + 38, 2, 1, g.PAPER);
  g.rect(x + 48, y + 38, 2, 1, g.PAPER);
  g.rect(x + 25, y + 34, 8, 2, opts.stern ? g.INK : g.DARK);
  g.rect(x + 45, y + 34, 8, 2, opts.stern ? g.INK : g.DARK);
  // nose, mouth, blush
  g.rect(x + 39, y + 44, 3, 6, g.DARK);
  g.rect(x + 35, y + 54, 10, 2, g.INK);
  if (opts.smile) {
    g.pixel(x + 33, y + 53, g.INK);
    g.pixel(x + 46, y + 53, g.INK);
  }
  g.dither(x + 21, y + 47, 7, 5, g.MID, 2);
  g.dither(x + 52, y + 47, 7, 5, g.MID, 2);
  return { hair: hair };
}

ART.portrait = function (g, who, x, y) {
  if (who === "ahe") {
    portraitBase(g, x, y, { smile: true });
    // bun and pin
    g.rect(x + 30, y + 2, 20, 10, g.INK);
    g.rect(x + 33, y + 0, 14, 4, g.DARK);
    g.rect(x + 45, y - 4, 2, 8, g.PAPER);
    // fringe parting
    g.rect(x + 36, y + 10, 2, 12, g.INK);
    g.rect(x + 44, y + 10, 2, 12, g.INK);
    // flower
    g.rect(x + 62, y + 18, 2, 2, g.PAPER);

/* ---------------- food and things ---------------- */
ART.steam = function (g, x, y, t) {
  var a = Math.floor(t * 3) % 3;
  g.rect(x, y - a, 2, 3, g.PAPER);
  g.rect(x + 3, y - 2 - a, 2, 3, g.PAPER);
  g.rect(x + 6, y - 1 - a, 2, 2, g.PAPER);
};

ART.dish = function (g, id, x, y, t) {
  var d = DATA.DISHES[id];
  var kind = d ? d.kind : "soup";
  g.rect(x + 1, y + 10, 18, 2, g.INK);
  g.rect(x + 3, y + 12, 14, 1, g.MID);
  if (kind === "soup" || kind === "pot") {
    g.rect(x + 3, y + 6, 14, 5, g.INK);
    g.rect(x + 4, y + 7, 12, 3, g.PAPER);
    g.rect(x + 6, y + 7, 8, 1, g.MID);
    if (kind === "pot") {
      g.rect(x + 2, y + 4, 16, 3, g.INK);
      g.rect(x + 4, y + 5, 12, 2, g.DARK);
      g.rect(x - 1, y + 6, 4, 2, g.INK);
      g.rect(x + 17, y + 6, 4, 2, g.INK);
    }
    ART.steam(g, x + 7, y + 4, t);
  } else if (kind === "cake") {
    g.circle(x + 10, y + 7, 6, g.INK, true);
    g.circle(x + 10, y + 7, 5, g.PAPER, true);
    g.dither(x + 6, y + 4, 8, 6, g.MID, 1);
    ART.steam(g, x + 8, y + 0, t);
  } else if (kind === "rice") {
    g.rect(x + 4, y + 2, 12, 8, g.DARK);
    g.rect(x + 5, y + 3, 10, 6, g.PAPER);
    g.rect(x + 5, y + 2, 10, 1, g.INK);
    g.rect(x + 7, y + 4, 2, 1, g.MID);
    g.rect(x + 11, y + 6, 2, 1, g.MID);
  } else if (kind === "grill") {
    g.rect(x + 3, y + 4, 14, 7, g.MID);
    g.rect(x + 4, y + 5, 12, 2, g.PAPER);
    for (var i = 0; i < 3; i++) g.rect(x + 5 + i * 4, y + 4, 1, 7, g.INK);
    g.rect(x + 5, y + 9, 10, 1, g.INK);
    ART.steam(g, x + 7, y + 2, t);
  } else if (kind === "stir") {
    g.rect(x + 2, y + 8, 16, 3, g.INK);
    g.rect(x + 4, y + 6, 12, 4, g.DARK);
    g.rect(x + 6, y + 5, 3, 3, g.PAPER);
    g.rect(x + 11, y + 6, 3, 2, g.MID);
    ART.steam(g, x + 8, y + 2, t);
  } else {
    g.rect(x + 3, y + 6, 14, 5, g.INK);
    g.rect(x + 5, y + 7, 10, 3, g.PAPER);
    g.circle(x + 10, y + 6, 4, g.PAPER, true);
    g.dither(x + 6, y + 3, 8, 4, g.PAPER, 2);
    ART.steam(g, x + 7, y + 0, t);
  }
};

ART.ing = function (g, id, x, y) {
  if (id === "mushroom") {
    g.rect(x + 4, y + 4, 4, 6, g.INK);
    g.rect(x + 5, y + 5, 2, 5, g.PAPER);
    g.rect(x + 2, y + 1, 8, 3, g.DARK);
    g.rect(x + 3, y + 2, 6, 1, g.PAPER);
    g.pixel(x + 3, y + 2, g.PAPER); g.pixel(x + 7, y + 2, g.PAPER);
  } else if (id === "fish") {
    g.rect(x + 2, y + 4, 7, 4, g.INK);
    g.rect(x + 3, y + 5, 5, 2, g.MID);
    g.rect(x + 9, y + 3, 2, 2, g.INK);
    g.rect(x + 9, y + 7, 2, 2, g.INK);
    g.pixel(x + 4, y + 5, g.PAPER);
  } else if (id === "rice") {
    for (var i = 0; i < 5; i++) g.rect(x + 2 + (i * 3) % 7, y + 3 + (i * 5) % 7, 2, 3, g.PAPER);
    g.rect(x + 2, y + 9, 8, 1, g.DARK);
  } else if (id === "bamboo") {
    g.rect(x + 4, y + 2, 4, 9, g.DARK);
    g.rect(x + 5, y + 2, 2, 9, g.PAPER);
    g.rect(x + 3, y + 6, 6, 1, g.INK);
    g.rect(x + 8, y + 1, 3, 3, g.INK);
  } else if (id === "greens") {
    g.rect(x + 3, y + 7, 6, 2, g.INK);
    g.rect(x + 2, y + 2, 4, 6, g.DARK);
    g.rect(x + 6, y + 1, 4, 7, g.DARK);
    g.rect(x + 7, y + 4, 3, 4, g.MID);
  } else if (id === "meat") {
    g.rect(x + 2, y + 3, 8, 6, g.MID);
    g.rect(x + 3, y + 4, 6, 2, g.PAPER);
    g.rect(x + 3, y + 7, 6, 1, g.DARK);
    g.rect(x + 1, y + 4, 2, 1, g.PAPER);
  } else {
    g.rect(x + 5, y + 3, 2, 7, g.PAPER);
    g.rect(x + 3, y + 2, 4, 3, g.INK);
    g.rect(x + 7, y + 5, 3, 3, g.MID);
    g.dither(x + 2, y + 2, 8, 8, g.PAPER, 1);
  }
};

ART.weatherIcon = function (g, id, x, y, t) {
  if (id === "sunny") {
    g.circle(x + 6, y + 6, 4, g.PAPER, true);
    g.circle(x + 6, y + 6, 3, g.INK, true);
    for (var i = 0; i < 4; i++) {
      g.pixel(x + 6 + (i < 2 ? -6 + i * 12 : 0), y + 6 + (i < 2 ? 0 : -5 + (i - 2) * 10), g.PAPER);
    }
  } else if (id === "rain") {
    g.rect(x + 1, y + 3, 10, 4, g.DARK);
    g.rect(x + 3, y + 1, 4, 3, g.DARK);
    for (var j = 0; j < 3; j++) {
      var dy = (Math.floor(t * 6) + j * 3) % 6;
      g.line(x + 2 + j * 4, y + 8 + dy, x + 1 + j * 4, y + 10 + dy, g.PAPER);
    }
  } else {
    for (var k = 0; k < 3; k++) g.rect(x + 1 + (k % 2) * 2, y + 2 + k * 3, 9, 1, g.PAPER);
    g.rect(x + 4, y + 4, 4, 1, g.MID);
  }
};

ART.coin = function (g, x, y) {
  g.circle(x + 3, y + 3, 3, g.INK, true);
  g.rect(x + 2, y + 3, 3, 2, g.PAPER);
  g.pixel(x + 3, y + 2, g.PAPER);
};

ART.heart = function (g, x, y, filled) {
  var c = filled ? g.INK : g.MID;
  g.rect(x + 1, y + 1, 2, 2, c); g.rect(x + 4, y + 1, 2, 2, c);
  g.rect(x + 1, y + 2, 5, 2, c);
  g.rect(x + 2, y + 4, 3, 1, c);
  g.pixel(x + 3, y + 5, c);
  if (!filled) { g.pixel(x + 3, y + 1, g.PAPER); g.pixel(x + 4, y + 2, g.PAPER); }
};

ART.star = function (g, x, y, c) {
  c = c == null ? g.PAPER : c;
  g.pixel(x + 3, y, c); g.rect(x + 2, y + 1, 3, 1, c); g.rect(x + 1, y + 2, 5, 1, c);
  g.rect(x + 2, y + 3, 3, 1, c); g.pixel(x + 1, y + 4, c); g.pixel(x + 5, y + 4, c);
};

/* ---------------- ending ---------------- */
ART.ending = function (g, t, kind) {
  g.clear(g.PAPER);
  g.dither(0, 0, 216, 54, g.MID, 1);
  g.dither(154, 10, 40, 38, g.MID, 1);
  g.circle(174, 28, 16, g.INK, true);
  g.circle(174, 28, 14, g.PAPER, true);
  for (var er = 0; er < 8; er++) {
    var ea = er * Math.PI / 4;
    g.line(174 + Math.cos(ea) * 20, 28 + Math.sin(ea) * 20, 174 + Math.cos(ea) * 24, 28 + Math.sin(ea) * 24, g.DARK);
  }
  g.line(0, 78, 38, 48, g.DARK); g.line(38, 48, 76, 78, g.DARK);
  g.line(52, 78, 96, 42, g.DARK); g.line(96, 42, 140, 78, g.DARK);
  g.line(124, 78, 164, 52, g.DARK); g.line(164, 52, 204, 78, g.DARK);
  g.rect(0, 78, 216, 162, g.PAPER);
  g.dither(0, 78, 216, 10, g.MID, 1);
  ART.pine(g, -2, 42, 1.1);
  ART.pine(g, 190, 46, 1.2);
  ART.facade(g, 48, 62, null, t);
  // birds
  for (var b = 0; b < 3; b++) {
    var bx = 40 + b * 34 + Math.sin(t + b) * 3, by = 34 + b * 6;
    g.line(bx, by, bx + 3, by - 2, g.DARK);
    g.line(bx + 3, by - 2, bx + 6, by, g.DARK);
  }
  // the people who stayed
  g.sprite(ART.big.heroDown, 72, 140);
  if (kind !== "bad") {
    g.sprite(ART.big.ahe, 90, 142);
    g.sprite(ART.big.zhou, 108, 142);
    g.sprite(ART.big.yan, 126, 142);
    g.sprite(ART.big.po, 144, 142);
  }
  g.sprite(ART.cat, 160, 146);
  for (var i = 0; i < 20; i++) {
    var px = (i * 41 + t * 6) % 216;
    var py = 80 + ((i * 27 + t * 4) % 84);
    if (Math.floor(t * 2 + i) % 3) {
      g.rect(px, py, 2, 1, i % 2 ? g.PAPER : g.MID);
      if (i % 4 === 0) g.pixel(px + 1, py + 1, g.DARK);
    }
  }
};

/* decode a plate once, then draw it like any other lo-game sprite */
function plateSprite(p) {
  if (p._sprite) return p._sprite;
  var bin = atob(p.runs), px = new Uint8Array(p.w * p.h), o = 0;
  for (var i = 0; i < bin.length; i++) {
    var b = bin.charCodeAt(i), n = (b >> 2) + 1, v = b & 3;
    for (var k = 0; k < n; k++) px[o++] = v;
  }
  p._sprite = { w: p.w, h: p.h, px: px };
  return p._sprite;
}
ART.plate = function (g, p, x, y) {
  g.sprite(plateSprite(p), x || 0, y || 0);
};

<script data-src="src/30-ui.js">
/* The UI kit: every screen lays out inside the same five bands.
 *
 *   y=4   header    24 high   title, weather, reputation, money
 *   y=32  body     158 high   the screen's one job
 *   y=194 action    22 high   the buttons that work here
 *   y=224 footer    12 high   one line naming the keys
 *
 * Screens never place text at a raw x/y again without asking `UI.text` to fit
 * it.  That one rule is what stops the old "今日 / 山菇汤 / 酒" pile-up: a
 * measured header, a list that scrolls inside its own box, and order tags
 * drawn in the wall band instead of on top of the tables.
 */
var UI = (function () {
  var R = {
    W: 216, H: 240,
    header: { x: 6, y: 4, w: 204, h: 24 },
    body: { x: 6, y: 32, w: 204, h: 158 },
    action: { x: 6, y: 194, w: 204, h: 22 },
    footer: { x: 6, y: 224, w: 204, h: 12 },
    pad: 6, gap: 4, row: 15
  };

  function ellipsis(g, str, maxW) {
    str = String(str == null ? "" : str);
    if (g.measure(str) <= maxW) return str;
    var dots = "…";
    if (g.measure(dots) > maxW) return "";
    var out = "";
    var chars = Array.from(str);
    for (var i = 0; i < chars.length; i++) {
      var next = out + chars[i];
      if (g.measure(next + dots) > maxW) break;
      out = next;
    }
    return out + dots;
  }

  function text(g, str, x, y, o) {
    o = o || {};
    var s = String(str == null ? "" : str);
    if (o.fit) s = ellipsis(g, s, o.fit);
    var opt = { color: o.color, align: o.align, width: o.width, shadow: o.shadow };
    return g.text(s, x, y, opt);
  }

  function right(g, str, xRight, y, o) {
    o = o || {};
    return text(g, str, xRight, y, { color: o.color, align: "right", fit: o.fit });
  }

  function header(g, s, title) {
    g.window(R.header.x, R.header.y, R.header.w, R.header.h, { thin: true });
    s = s || { day: 1, weather: "sunny", rep: 1, money: 0 };
    var rightEdge = 202;
    var money = String(s.money == null ? 0 : s.money);
    var moneyW = g.measure(money);
    text(g, "文", rightEdge, 6, { color: g.DARK, align: "right" });
    right(g, money, rightEdge - 10, 6);
    ART.coin(g, rightEdge - 10 - moneyW - 10, 8);
    var x = rightEdge - 10 - moneyW - 18;
    var rep = "名声 " + s.rep;
    right(g, rep, x, 6, { color: g.DARK });
    x -= g.measure(rep) + 8;
    var weather = DATA.WEATHER[s.weather] ? DATA.WEATHER[s.weather].name : "";
    right(g, weather, x, 6, { color: g.DARK });
    x -= g.measure(weather) + 3;
    ART.weatherIcon(g, s.weather, x - 9, 8, game.time);
    x -= 12;
    text(g, title || ("第 " + s.day + " 天"), 10, 6, { fit: Math.max(20, x - 12) });
  }

  function footer(g, str, color) {
    // a paper strip keeps the hint readable over the night floor and the wood
    g.rect(0, R.footer.y - 4, R.W, R.H - (R.footer.y - 4), g.PAPER);
    g.rect(0, R.footer.y - 4, R.W, 1, g.MID);
    text(g, str, R.footer.x + R.footer.w / 2, R.footer.y, {
      align: "center", color: color == null ? g.DARK : color, fit: R.footer.w
    });
  }

  function panel(g, x, y, w, h, title) {
    g.window(x, y, w, h);
    if (title) {
      var tw = g.measure(title) + 4;
      g.rect(x + 5, y + 2, tw, 12, g.PAPER);
      text(g, title, x + 7, y + 1, { color: g.DARK, fit: w - 12 });
    }
  }

  function label(g, str, x, y, color) {
    text(g, str, x, y, { color: color == null ? g.DARK : color, fit: R.body.w });
  }

  function value(g, str, xRight, y, color) {
    right(g, str, xRight, y, { color: color });
  }

  /* one row of columns: [{x,w,align,text,color}], each one clipped to its cell */
  function columns(g, y, cols) {
    for (var i = 0; i < cols.length; i++) {
      var c = cols[i], fit = c.w == null ? null : c.w;
      if (fit) {
        g.clip(c.x, y - 1, c.w, 14);
        text(g, c.text, c.align === "right" ? c.x + c.w : c.x, y, {
          align: c.align || "left", color: c.color, fit: fit
        });
        g.clip();
      } else {
        text(g, c.text, c.x, y, { align: c.align || "left", color: c.color });
      }
    }
  }

  function bar(g, x, y, w, h, v, max, color) {
    g.rect(x, y, w, h, g.MID);
    var f = max ? Math.max(0, Math.min(1, v / max)) : 0;
    if (f > 0) g.rect(x, y, Math.max(1, Math.round(w * f)), h, color == null ? g.INK : color);
  }

  /* a scrolling list: `draw(g, index, y)` paints one row; the kit owns the
   * window, the cursor, the scroll and the up/down hints. */
  function list(g, o) {
    var rowH = o.rowH || R.row;
    var visible = Math.max(1, Math.floor(o.h / rowH));
    var scroll = o.scroll == null ? 0 : o.scroll;
    if (o.sel < scroll) scroll = o.sel;
    if (o.sel >= scroll + visible) scroll = o.sel - visible + 1;
    if (typeof o.onScroll === "function") o.onScroll(scroll);
    g.clip(o.x, o.y, o.w, o.h);
    for (var i = 0; i < visible && scroll + i < o.count; i++) {
      var idx = scroll + i, y = o.y + i * rowH;
      if (idx === o.sel) g.rect(o.x, y - 1, o.w, rowH - 1, g.INK);
      o.draw(g, idx, y, idx === o.sel);
    }
    g.clip();
    if (scroll > 0) g.text("▲", o.x + o.w - 10, o.y + 1, { color: g.DARK });
    if (scroll + visible < o.count) g.text("▼", o.x + o.w - 10, o.y + o.h - 12, { color: g.DARK });

  }

  /* a table order tag in the wall band: table number, dish, patience */
  function orderTag(g, x, y, label, frac, selected, number) {
    g.window(x, y, 52, 16, { thin: true });
    if (selected) g.rect(x + 1, y + 1, 50, 14, g.INK);
    text(g, label, x + 3, y + 1, { color: selected ? g.PAPER : g.INK, fit: 38 });
    if (number) right(g, String(number), x + 48, y + 1, { color: selected ? g.PAPER : g.DARK, fit: 8 });
    g.rect(x + 3, y + 13, 46, 2, selected ? g.DARK : g.MID);
    var w = Math.max(0, Math.min(1, frac));
    if (w > 0) g.rect(x + 3, y + 13, Math.max(1, Math.round(46 * w)), 2, selected ? g.PAPER : (w < 0.35 ? g.INK : g.DARK));
  }

  function actionBar(g, items, sel, y) {
    y = y == null ? R.action.y : y;
    g.window(R.action.x, y, R.action.w, R.action.h, { thin: true });
    var n = items.length || 1;
    var cell = Math.floor((R.action.w - 8) / n);
    for (var i = 0; i < items.length; i++) {
      var it = items[i], x = R.action.x + 4 + i * cell;
      if (i === sel) {
        g.rect(x, y + 2, cell - 2, 18, g.INK);
        text(g, it.label, x + 4, y + 4, { color: g.PAPER, fit: cell - 8 });
      } else {
        text(g, it.label, x + 4, y + 4, { color: it.disabled ? g.DARK : g.INK, fit: cell - 8 });
      }
    }
  }

  function toast(g, y) {
    if (game.time < toast.until && toast.text) {
      y = y == null ? 168 : y;
      var w = Math.min(184, g.measure(toast.text) + 16);
      g.window((R.W - w) / 2, y, w, 20, { thin: true });
      text(g, toast.text, R.W / 2, y + 2, { align: "center", fit: w - 12 });
    }
  }

  function help(g, page) {
    g.clear(g.PAPER);
    header(g, S || { day: 1, weather: "sunny", rep: 1, money: 0 }, "说明");
    g.window(6, 32, 204, 184);
    text(g, "怎么玩", 14, 36, { color: g.DARK });
    var lines = [
      "早上有 2 个行动：出门、备菜。",
      "先出门采买，回来再备菜；",
      "出门去后山采食材、打山兽。",
      "傍晚开门，客人点单，按 A 上菜。",
      "打烊后看账，第四天和第七天交租。",
      "第七天山神宴：备好三道菜。",
      "",
      "方向键 选    A 好    B 返回",
      "START 暂停 / 存档",
      "",
      "钱、好感和名声都会留到第二天。",
      "常客好感 3 心，会来帮你。"
    ];
    for (var i = 0; i < lines.length; i++) {
      text(g, lines[i], 14, 52 + i * 15, { color: i === 7 ? g.DARK : g.INK, fit: 188 });
    }
    footer(g, "A / B 返回");
  }

  /* optional: the 8-pixel grid and the four bands, for catching a stray label */
  function debug(g) {
    for (var x = 0; x < R.W; x += 8) g.rect(x, 0, 1, R.H, g.MID);
    for (var y = 0; y < R.H; y += 8) g.rect(0, y, R.W, 1, g.MID);
    g.frame(R.header.x, R.header.y, R.header.w, R.header.h, g.INK);
    g.frame(R.body.x, R.body.y, R.body.w, R.body.h, g.INK);
    g.frame(R.action.x, R.action.y, R.action.w, R.action.h, g.INK);
    text(g, "H", 8, 4, { color: g.INK });
    text(g, "B", 8, 32, { color: g.INK });
    text(g, "A", 8, 194, { color: g.INK });

  }

  return {
    R: R, debugOn: false,
    ellipsis: ellipsis, text: text, right: right,

    stars: function (g, x, y, n) { for (var i = 0; i < 5; i++) ART.star(g, x + i * 8, y, i < n ? g.INK : g.MID); },
    money: function (g, x, y, n) { ART.coin(g, x, y); text(g, String(n), x + 10, y - 2, { fit: 60 }); },
    arrow: function (g, x, y, color) { g.arrow(x, y, "right", color == null ? g.INK : color); }
  };
})();

<script data-src="src/40-state.js">
/* Save state and the rules that are not drawing. */
var S = null;

function fresh() {
  var ing = {};
  for (var i = 0; i < DATA.ING_ORDER.length; i++) ing[DATA.ING_ORDER[i]] = 0;
  ing.mushroom = 4; ing.rice = 2; ing.greens = 2;
  var unlocked = {};
  for (var d = 0; d < DATA.DISH_ORDER.length; d++) {
    if (DATA.DISHES[DATA.DISH_ORDER[d]].unlock === "base") unlocked[DATA.DISH_ORDER[d]] = true;
  }
  var npc = {};
  for (var n = 0; n < DATA.NPC_ORDER.length; n++) npc[DATA.NPC_ORDER[n]] = 0;
  return {
    v: SAVE_VERSION, phase: "morning", day: 1, money: 80, rep: 1, ap: 2,
    weather: DATA.WEATHER_BY_DAY[0],
    ingredients: ing, menu: [], stock: {}, unlocked: unlocked,
    upgrades: {}, npc: npc, staff: null, seen: {}, flags: {},
    stats: { served: 0, lost: 0, earned: 0, tips: 0, days: 0 },
    rentPaid: 0, debt: 0, lastLedger: null
  };
}

function save() { if (S) game.save(SAVE_KEY, S); }
function seen(id) { return !!(S && S.seen[id]); }
function mark(id) { if (S) { S.seen[id] = 1; save(); } }
function flag(id) { return !!(S && S.flags[id]); }
function setFlag(id, v) { if (S) { S.flags[id] = v == null ? 1 : v; save(); } }

function ing(id) { return S.ingredients[id] || 0; }
function addIng(id, n) {
  S.ingredients[id] = Math.max(0, (S.ingredients[id] || 0) + n);
}
function takeIng(id, n) {
  if ((S.ingredients[id] || 0) < n) return false;
  S.ingredients[id] -= n;
  return true;
}
function mainIng(id) {
  var need = DATA.DISHES[id].need;
  for (var k in need) if (Object.prototype.hasOwnProperty.call(need, k)) return k;
  return null;
}
function maxPortions(id) {
  var need = DATA.DISHES[id].need, n = 5;
  for (var k in need) if (Object.prototype.hasOwnProperty.call(need, k)) {
    n = Math.min(n, Math.floor((S.ingredients[k] || 0) / need[k]));
  }
  return Math.max(0, n);
}
function canCookPlan(plan) {
  var used = {};
  for (var id in plan) if (Object.prototype.hasOwnProperty.call(plan, id) && plan[id] > 0) {
    var need = DATA.DISHES[id].need;
    for (var k in need) if (Object.prototype.hasOwnProperty.call(need, k)) {
      used[k] = (used[k] || 0) + need[k] * plan[id];
    }
  }
  for (var u in used) if (Object.prototype.hasOwnProperty.call(used, u) && used[u] > (S.ingredients[u] || 0)) return false;
  return true;
}
function cookPlan(plan) {
  var kinds = 0;
  for (var kk in plan) if (Object.prototype.hasOwnProperty.call(plan, kk) && plan[kk] > 0) kinds++;
  if (kinds > 4) return false;
  if (!canCookPlan(plan)) return false;
  for (var id in plan) if (Object.prototype.hasOwnProperty.call(plan, id) && plan[id] > 0) {
    var need = DATA.DISHES[id].need;
    for (var k in need) if (Object.prototype.hasOwnProperty.call(need, k)) takeIng(k, need[k] * plan[id]);
  }
  S.menu = [];
  S.stock = {};
  for (var id2 in plan) if (Object.prototype.hasOwnProperty.call(plan, id2) && plan[id2] > 0) {
    S.menu.push(id2);
    S.stock[id2] = plan[id2];
  }
  S.menu.sort(function (a, b) { return DATA.DISH_ORDER.indexOf(a) - DATA.DISH_ORDER.indexOf(b); });
  save();
  return true;
}
function stockOf(id) { return (S.stock && S.stock[id]) || 0; }
function stockTotal() {
  var n = 0;
  for (var id in S.stock) if (Object.prototype.hasOwnProperty.call(S.stock, id)) n += S.stock[id];
  return n;
}
function useStock(id) {
  if (!S.stock[id] || S.stock[id] <= 0) return false;
  S.stock[id]--;
  if (S.stock[id] <= 0) delete S.stock[id];
  return true;
}
function menuDishes() { return S.menu.slice(); }
function addRep(n) { S.rep = Math.max(0, S.rep + n); save(); }
function addMoney(n) { S.money = Math.max(0, S.money + n); save(); }
function addNpc(id, n) { S.npc[id] = Math.max(0, Math.min(5, (S.npc[id] || 0) + n)); save(); }
function hasUpgrade(id) { return !!(S.upgrades && S.upgrades[id]); }
function canBuy(id) {
  var u = DATA.UPGRADES[id];
  return !hasUpgrade(id) && S.money >= u.cost && S.rep >= u.rep;
}
function buyUpgrade(id) {
  if (!canBuy(id)) return false;
  S.money -= DATA.UPGRADES[id].cost;
  S.upgrades[id] = true;
  if (id === "stove") { unlockDish("grilled_fish"); unlockDish("pork"); }
  save();
  return true;
}
function unlockDish(id) { if (S && DATA.DISHES[id]) { S.unlocked[id] = true; save(); } }
function unlockedDishes() { return DATA.DISH_ORDER.filter(function (id) { return S.unlocked[id]; }); }
function hasHelper() { return availableHelpers().length > 0; }
function availableHelpers() {
  return DATA.NPC_ORDER.filter(function (id) { return id !== "po" && (S.npc[id] || 0) >= 3; });
}
function helperName() {
  return S.staff ? DATA.NPCS[S.staff].name : "";
}
function dayWeather(day) { return DATA.WEATHER_BY_DAY[Math.min(DATA.WEATHER_BY_DAY.length, Math.max(1, day)) - 1]; }
function rentFor(day) { return DATA.RENT[day] || 0; }
function startDay(day) {
  S.day = day;
  S.phase = "morning";
  S.weather = dayWeather(day);
  S.ap = 2;
  S.menu = [];
  S.stock = {};
  S.staff = null;
  S.flags.prepared = false;
  S.flags.opened = false;
  S.flags.forest = false;
  S.stats.days++;
  save();
}
function endDay() {
  // carry nothing except money, people and upgrades
  S.menu = [];
  S.stock = {};
  save();
}
function serveCount() {
  var base = 4 + DATA.WEATHER[S.weather].customers + (hasUpgrade("sign") ? 1 : 0) + Math.floor(S.rep / 3);
  return Math.max(3, Math.min(9, base));
}
function tableCount() { return 4; }
function totalDishes() { return unlockedDishes().length; }
function storySeen(id) { return !!S.seen[id]; }

<script data-src="src/50-title.js">
/* Title and the help screen. */
var TITLE_SEL = 0;

function titleOptions() {
  var opts = [];
  if (bootSave) opts.push({ id: "continue", label: "继续" });
  opts.push({ id: "new", label: bootSave ? "新局" : "开始" });
  opts.push({ id: "help", label: "说明" });
  return opts;
}

game.scene("title", {
  enter: function () {
    TITLE_SEL = 0;
    game.ambience(null);
    if (typeof stopMusic === "function") stopMusic(); else game.musicStop();
  },
  update: function () {
    if (!booted) return;
    var opts = titleOptions();
    if (game.repeat("left")) { TITLE_SEL = (TITLE_SEL + opts.length - 1) % opts.length; game.sfx("move"); }
    if (game.repeat("right")) { TITLE_SEL = (TITLE_SEL + 1) % opts.length; game.sfx("move"); }
    if (game.pressed("a") || game.pressed("start")) {
      var id = opts[TITLE_SEL].id;
      game.sfx("tap");
      if (id === "continue") {
        S = bootSave;
        if (S.phase === "night") game.go("night");
        else if (S.phase === "ending") game.go("ending");
        else game.go("morning");
      } else if (id === "new") {
        S = fresh();
        startDay(1);
        game.go("morning");
      } else {
        game.go("help", { from: "title" });
      }
    }
  },

<script data-src="src/51-morning.js">
/* Morning: two actions before opening. */
var MORNING_SEL = 0;

function morningActions() {
  return [
    { label: "出门", id: "forest", disabled: S.ap <= 0 },
    { label: "菜单", id: "prep", disabled: S.ap <= 0 || !!S.flags.prepared },
    { label: "店铺", id: "shop", disabled: false },
    { label: "帮手", id: "helper", disabled: !hasHelper() || !!S.staff },
    { label: "开门", id: "open", disabled: false }
  ];
}

function helperEffect(id) {
  return id === "ahe" ? "帮上菜" : id === "zhou" ? "送两条鱼" : id === "yan" ? "送一块肉" : "";
}

function chooseHelper() {
  var ids = availableHelpers();
  if (!ids.length) { game.sfx("err"); return; }
  busy = true;
  var labels = ids.map(function (id) { return DATA.NPCS[id].name + "（" + helperEffect(id) + "）"; });
  game.choose(labels, { title: "今天请谁帮忙？", cancel: true }).then(function (i) {
    if (i >= 0) {
      S.staff = ids[i];
      if (S.staff === "zhou") addIng("fish", 2);
      if (S.staff === "yan") addIng("meat", 1);
      save();
      game.sfx("ok");
      sayToast(DATA.NPCS[S.staff].name + "来帮忙了");
    }
    busy = false;
  });
}

function morningAct(i) {
  if (busy) return;
  var acts = morningActions();
  if (!acts[i] || acts[i].disabled) { game.sfx("err"); return; }
  if (acts[i].id === "prep") { game.sfx("tap"); game.go("prep"); return; }
  if (acts[i].id === "forest") {
    if (S.ap === 1 && !S.flags.prepared) {
      busy = true;
      game.choose(["先备菜", "还是出门"], { title: "还没备菜，要空着灶开门吗？", cancel: true }).then(function (c) {
        busy = false;
        if (c === 0) game.go("prep");
        else if (c === 1) { S.ap--; save(); game.sfx("move"); game.go("forest"); }
      });
      return;
    }
    S.ap--;
    save();
    game.sfx("move");
    game.go("forest");
    return;
  }
  if (acts[i].id === "shop") { game.sfx("tap"); game.go("shop"); return; }
  if (acts[i].id === "helper") { chooseHelper(); return; }
  if (acts[i].id === "open") {
    if (stockTotal() <= 0) {
      busy = true;
      game.say("灶上还是空的。先去备菜吧。").then(function () { busy = false; });
      return;
    }
    S.flags.opened = 1;
    save();
    game.sfx("ok");
    game.go("service");
  }
}

game.scene("morning", {
  enter: function () {
    MORNING_SEL = 0;
    game.ambience(S.weather === "rain" ? "rain" : null, 0.35);
    if (typeof playMusic === "function") playMusic("shop");
    if (typeof MorningStory === "function") {
      busy = true;
      MorningStory().then(function () { busy = false; });
    }
  },
  update: function () {
    if (busy) return;
    var acts = morningActions();
    if (game.repeat("left")) { MORNING_SEL = (MORNING_SEL + acts.length - 1) % acts.length; game.sfx("move"); }
    if (game.repeat("right")) { MORNING_SEL = (MORNING_SEL + 1) % acts.length; game.sfx("move"); }
    // up/down still move the same row on a one-row bar
    if (game.pressed("a")) morningAct(MORNING_SEL);
    if (game.pressed("b")) game.go("help", { from: "morning" });
    if (game.pressed("start")) {
      game.sfx("tap");

  },

    UI.text(g, "菜单：" + menuText, 10, 149, { fit: 196 });
    UI.text(g, "库存 " + stockTotal() + " 份　　行动 " + S.ap + "/2" + (S.staff ? "　　帮手 " + helperName() : ""), 10, 163, { color: g.DARK, fit: 196 });
    var regCount = DATA.NPC_ORDER.filter(function (id) { return (S.npc[id] || 0) >= 3; }).length;
    UI.text(g, "预计客 " + serveCount() + " 位　常客 " + regCount + " 人", 10, 177, { color: g.DARK, fit: 196 });

<script data-src="src/52-prep.js">
/* Prep: choose today's dishes and how many portions to cook. */
var PREP_PLAN = {}, PREP_SEL = 0, PREP_SCROLL = 0;

function prepList() { return unlockedDishes(); }
function prepNeedUsed() {
  var used = {};
  for (var id in PREP_PLAN) if (Object.prototype.hasOwnProperty.call(PREP_PLAN, id)) {
    var need = DATA.DISHES[id].need;
    for (var k in need) if (Object.prototype.hasOwnProperty.call(need, k)) used[k] = (used[k] || 0) + need[k] * PREP_PLAN[id];
  }
  return used;
}
function prepRoom(id) {
  var need = DATA.DISHES[id].need, used = prepNeedUsed(), n = 5;
  for (var k in need) if (Object.prototype.hasOwnProperty.call(need, k)) {
    var mine = (PREP_PLAN[id] || 0) * need[k];
    var avail = (S.ingredients[k] || 0) - ((used[k] || 0) - mine);
    n = Math.min(n, Math.floor(avail / need[k]));
  }
  return Math.max(0, n);
}
function prepTotal() {
  var n = 0;
  for (var id in PREP_PLAN) if (Object.prototype.hasOwnProperty.call(PREP_PLAN, id)) n += PREP_PLAN[id];
  return n;
}
function prepConfirm() {
  var kinds = 0;
  for (var id in PREP_PLAN) if (Object.prototype.hasOwnProperty.call(PREP_PLAN, id) && PREP_PLAN[id] > 0) kinds++;
  if (kinds > 4) { game.sfx("err"); sayToast("菜单最多四道菜"); return; }
  if (prepTotal() <= 0) { game.sfx("err"); return; }
  if (!canCookPlan(PREP_PLAN)) { game.sfx("err"); return; }
  if (!cookPlan(PREP_PLAN)) { game.sfx("err"); return; }
  S.ap--;
  S.flags.prepared = 1;
  save();
  game.sfx("ok");
  sayToast("备好了 " + stockTotal() + " 份");
  game.go("morning");
}

game.scene("prep", {
  enter: function () {
    if (S.flags.prepared) { game.go("morning"); return; }
    PREP_PLAN = {};
    PREP_SEL = 0;
    PREP_SCROLL = 0;
  },
  update: function () {
    if (busy) return;
    var list = prepList();
    if (!list.length) return;
    if (game.repeat("up")) { PREP_SEL = (PREP_SEL + list.length - 1) % list.length; game.sfx("move"); }
    if (game.repeat("down")) { PREP_SEL = (PREP_SEL + 1) % list.length; game.sfx("move"); }
    if (PREP_SEL < PREP_SCROLL) PREP_SCROLL = PREP_SEL;
    if (PREP_SEL > PREP_SCROLL + 4) PREP_SCROLL = PREP_SEL - 4;
    var id = list[PREP_SEL];
    if (game.repeat("left")) {
      PREP_PLAN[id] = Math.max(0, (PREP_PLAN[id] || 0) - 1);
      game.sfx("tick");
    }
    if (game.repeat("right")) {
      var room = prepRoom(id);
      if ((PREP_PLAN[id] || 0) < room) { PREP_PLAN[id] = (PREP_PLAN[id] || 0) + 1; game.sfx("tick"); }
      else game.sfx("err");
    }
    if (game.pressed("a")) prepConfirm();
    if (game.pressed("b")) { game.sfx("tap"); game.go("morning"); }
    if (game.pressed("start")) { game.sfx("tap"); game.go("morning"); }
  },
  draw: function (g) {
    g.clear(g.PAPER);
    UI.header(g, S, "备菜");
    // pantry: seven tiny icons were unreadable at 1x, so the counts are text
    g.window(6, 32, 204, 30, { thin: true });
    for (var i = 0; i < DATA.ING_ORDER.length; i++) {
      var k = DATA.ING_ORDER[i];
      var row = i < 4 ? 0 : 1;
      var px0 = 12 + (i < 4 ? i : i - 4) * 48, py0 = 35 + row * 14;
      var nm = DATA.ING[k].name;
      UI.text(g, nm, px0, py0, { color: g.DARK });
      UI.text(g, String(ing(k)), px0 + g.measure(nm) + 5, py0, { color: ing(k) > 0 ? g.INK : g.DARK });
    }
    // dish list: the kit owns the window, cursor, scroll and arrows
    var list = prepList();
    g.window(6, 66, 204, 100);
    UI.text(g, "今日菜单", 12, 68, { color: g.DARK });
    var kinds = 0;
    for (var kk in PREP_PLAN) if (Object.prototype.hasOwnProperty.call(PREP_PLAN, kk) && PREP_PLAN[kk] > 0) kinds++;
    UI.text(g, "菜" + kinds + "/4", 126, 68, { color: g.DARK });
    UI.right(g, "共" + prepTotal() + "份", 204, 68, { color: g.DARK });
    PREP_SCROLL = UI.list(g, {
      x: 8, y: 82, w: 200, h: 75, rowH: 15, count: list.length, sel: PREP_SEL, scroll: PREP_SCROLL,
      onScroll: function (v) { PREP_SCROLL = v; },
      draw: function (gg, idx, y, selected) {
        var id = list[idx], col = selected ? gg.PAPER : gg.INK;
        ART.dish(gg, id, 12, y, game.time);
        UI.columns(gg, y, [
          { x: 36, w: 60, text: DATA.DISHES[id].name, color: col },
          { x: 100, w: 32, text: DATA.DISHES[id].price + "文", color: selected ? gg.PAPER : gg.DARK },
          { x: 136, w: 30, text: "定 " + (PREP_PLAN[id] || 0), color: col },
          { x: 174, w: 28, text: "可 " + prepRoom(id), color: selected ? gg.PAPER : gg.DARK }
        ]);
      }
    });
    // detail
    var id2 = list[PREP_SEL];
    if (id2) {
      g.window(6, 170, 204, 46);
      g.text(DATA.DISHES[id2].name, 10, 172);
      UI.text(g, DATA.DISHES[id2].desc, 10, 186, { fit: 196 });
      var need = DATA.DISHES[id2].need, parts = [];
      for (var nk in need) if (Object.prototype.hasOwnProperty.call(need, nk)) parts.push(DATA.ING[nk].name + "×" + need[nk]);
      UI.text(g, parts.join(" ") + "　定" + (PREP_PLAN[id2] || 0) + "　可" + prepRoom(id2), 10, 202, { color: g.DARK, fit: 196 });
    }
    UI.footer(g, "↑↓ 选　←→ 份数　A 备好　B 返回");
    UI.toast(g);
  }
});

<script data-src="src/53-forest.js">
/* The mountain: one screen, three actions, a basket and a knife. */
var FOREST_MAP = [
  "TTTTTTTTDTTTTTTTTT",
  "T.......,........T",
  "T..TT...,...TT...T",
  "T..TT...,...TT...T",
  "T.......,........T",
  "T..~~~..,........T",
  "T..~~~..,........T",
  "T.......,........T",
  "T...TT..,..TT....T",
  "T...TT..,..TT....T",
  "T.......,........T",
  "T..S....,........T",
  "T.......,........T",
  "T.......,........T",
  "T.......,........T",
  "TTTTTTTTETTTTTTTTT"
];
var DEEP_MAP = [
  "TTTTTTTTTTTTTTTTTT",
  "T................T",
  "T.......~~.......T",
  "T.......~~.......T",
  "T..TT........TT..T",
  "T..TT...S....TT..T",
  "T................T",
  "T......#..#......T",
  "T................T",
  "T................T",
  "T...TT......TT...T",
  "T...TT......TT...T",
  "T................T",
  "T................T",
  "T................T",
  "TTTTTTTTTTTTTTTTTT"
];
var FOREST_DECOR = [[2, 3, "bamboo"], [15, 4, "bamboo"], [6, 9, "bamboo"], [12, 12, "bamboo"]];
var NODE_SPOTS = {
  mushroom: [[3, 1], [14, 1], [5, 4], [15, 7], [4, 13], [12, 11]],
  greens: [[2, 7], [13, 4], [6, 12], [15, 13]],
  rice: [[12, 5], [3, 8], [10, 13]],
  fish: [[3, 7], [4, 7], [14, 5], [15, 8]],
  bamboo: [[2, 9], [15, 10], [6, 3]]
};
var DEEP_SPOTS = {
  rare: [[3, 2], [14, 2], [4, 9], [14, 9]],
  mushroom: [[2, 6], [15, 6], [6, 12], [11, 13]]
};
var FOREST_MONSTERS = [
  { id: "boar", x: 4, y: 7 },
  { id: "monkey", x: 13, y: 6 },
  { id: "bamboo", x: 11, y: 10 }
];

var trip = null;

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function someOf(arr, n) { return shuffle(arr).slice(0, n); }

function newTrip() {
  var t = {
    area: "forest", stamina: 4, staminaMax: 4, basket: 0, basketMax: 10,
    nodes: [], monsters: [], shrine: false, deep: false,
    player: { x: 8, y: 13, fx: 8, fy: 13, t: 1, dir: "up", cool: 0 },
    fx: []
  };
  var n = { mushroom: 3, greens: 2, rice: 2, fish: 1, bamboo: 1 };
  if (S.weather === "rain") n.mushroom++;
  for (var k in n) if (Object.prototype.hasOwnProperty.call(n, k)) {
    var spots = someOf(NODE_SPOTS[k] || [], n[k]);
    for (var i = 0; i < spots.length; i++) t.nodes.push({ kind: k, x: spots[i][0], y: spots[i][1] });
  }
  t.monsters = someOf(FOREST_MONSTERS, 2).map(function (m) { return { id: m.id, x: m.x, y: m.y }; });
  return t;
}

function deepTrip(t) {
  t.area = "deep";
  t.deep = true;
  t.player = { x: 8, y: 14, fx: 8, fy: 14, t: 1, dir: "up", cool: 0 };
  t.nodes = [];
  for (var k in DEEP_SPOTS) if (Object.prototype.hasOwnProperty.call(DEEP_SPOTS, k)) {
    var spots = someOf(DEEP_SPOTS[k], k === "rare" ? 2 : 2);
    for (var i = 0; i < spots.length; i++) t.nodes.push({ kind: k, x: spots[i][0], y: spots[i][1] });
  }
  t.monsters = [{ id: "boss", x: 8, y: 4 }];
  if (S.flags.boss) t.monsters = [];
  t.shrine = false;
}

function forestMap() { return trip.area === "deep" ? DEEP_MAP : FOREST_MAP; }
function mapChar(x, y) {
  var m = forestMap();
  if (y < 0 || y >= m.length || x < 0 || x >= m[0].length) return "T";
  return m[y][x];
}
function solidAt(x, y) {
  var c = mapChar(x, y);
  return c === "T" || c === "~" || c === "#";
}
function nodeAt(x, y) {
  for (var i = 0; i < trip.nodes.length; i++) if (trip.nodes[i].x === x && trip.nodes[i].y === y) return trip.nodes[i];
  return null;
}
function monsterAt(x, y) {
  for (var i = 0; i < trip.monsters.length; i++) if (trip.monsters[i].x === x && trip.monsters[i].y === y) return trip.monsters[i];
  return null;
}
function yieldOf(kind) {
  if (kind === "mushroom") return 2 + (S.weather === "rain" ? 1 : 0) + (Math.random() < 0.3 ? 1 : 0);
  if (kind === "fish") return 1 + (Math.random() < 0.5 ? 1 : 0);
  if (kind === "rare") return 1;
  return 2;
}
function addBasket(n) { trip.basket = Math.min(trip.basketMax, trip.basket + n); }

async function endTrip(msg) {
  if (!trip) return;
  busy = true;
  if (msg) sayToast(msg);
  await game.wait(0.7);
  game.go("morning");
}

async function gatherNode(node) {
  if (busy) return;
  busy = true;
  var n = yieldOf(node.kind);
  addIng(node.kind, n);
  addBasket(n);
  trip.stamina--;
  trip.nodes.splice(trip.nodes.indexOf(node), 1);
  trip.fx.push({ text: "+" + n + " " + DATA.ING[node.kind].one, x: node.x * 12, y: 24 + node.y * 12 - 4, until: game.time + 1.2 });
  game.sfx("coin");
  save();
  if (trip.stamina <= 0) { await endTrip("没力气了，回店吧"); return; }
  if (trip.basket >= trip.basketMax) { await endTrip("篮子满了，回店吧"); return; }
  busy = false;
}

async function startBattle(m) {
  trip.stamina--;
  busy = true;
  var res = await game.push("battle", { enemy: m.id, from: trip.area, boss: m.id === "boss" });
  if (!res) res = { result: "flee" };
  if (res.result === "win") {
    trip.monsters.splice(trip.monsters.indexOf(m), 1);
    if (res.drops) for (var i = 0; i < res.drops.length; i++) addBasket(res.drops[i][1]);
    sayToast(m.id === "boss" ? "山魈倒下了。山珍到手。" : "打赢了，食材到手");
    if (m.id === "boss") {
      S.flags.boss = 1;
      unlockDish("god_soup");
      save();
    }
  } else if (res.result === "lose") {
    S.money = Math.max(0, S.money - 5);
    var ids = DATA.ING_ORDER.filter(function (id) { return ing(id) > 0; });
    if (ids.length) addIng(ids[Math.floor(Math.random() * ids.length)], -1);
    save();
    busy = true;
    await game.say(["眼前一黑……", "醒来时，你已经在店里。篮子轻了，钱也少了。"]);
    game.go("morning");
    return;
  } else {
    // ran away: step back
    trip.player.x = trip.player.fx;
    trip.player.y = trip.player.fy;
    trip.player.t = 1;
  }
  busy = false;
  if (trip.stamina <= 0) await endTrip("没力气了，回店吧");
  else if (trip.basket >= trip.basketMax) await endTrip("篮子满了，回店吧");
}

function arrive(x, y) {
  var m = monsterAt(x, y);
  if (m) { startBattle(m); return; }
  var n = nodeAt(x, y);
  if (n) { gatherNode(n); return; }
  if (mapChar(x, y) === "S") {
    if (!trip.shrine) {
      trip.shrine = true;
      if (trip.stamina < trip.staminaMax) trip.stamina = Math.min(trip.staminaMax, trip.stamina + 2);
      game.sfx("ok");
      sayToast("山神泉：力气回来了");
    }
    return;
  }
  if (mapChar(x, y) === "D") {
    if (trip.area === "forest") {
      if (S.flags.deep) {
        game.sfx("move");
        deepTrip(trip);
      } else {
        game.sfx("err");
        sayToast("雾太深，还进不去");
        trip.player.x = 8; trip.player.y = 1; trip.player.fx = 8; trip.player.fy = 1;
      }
    }
  }
}

game.scene("forest", {
  enter: function () {
    trip = newTrip();
    busy = false;
    game.ambience(S.weather === "rain" ? "rain" : "stream", 0.35);
    if (typeof playMusic === "function") playMusic("forest");
  },
  update: function (dt) {
    if (!trip || busy) return;
    if (game.pressed("b")) {
      if (trip.area === "deep") {
        game.sfx("move");
        trip.area = "forest";
        trip.player = { x: 8, y: 1, fx: 8, fy: 1, t: 1, dir: "down", cool: 0.2 };
        return;
      }
      endTrip("回店");
      return;
    }
    var p = trip.player;
    if (p.t < 1) {
      p.t = Math.min(1, p.t + dt / 0.13);
      if (p.t >= 1) { p.fx = p.x; p.fy = p.y; arrive(p.x, p.y); }
      return;
    }
    p.cool -= dt;
    if (p.cool > 0) return;
    var dx = 0, dy = 0;
    if (game.btn("up")) dy = -1;
    else if (game.btn("down")) dy = 1;
    else if (game.btn("left")) dx = -1;
    else if (game.btn("right")) dx = 1;
    if (!dx && !dy) return;
    p.dir = dy < 0 ? "up" : dy > 0 ? "down" : dx < 0 ? "left" : "right";
    var nx = p.x + dx, ny = p.y + dy;
    if (solidAt(nx, ny)) { p.cool = 0.12; game.sfx("err"); return; }
    p.fx = p.x; p.fy = p.y;
    p.x = nx; p.y = ny; p.t = 0; p.cool = 0.13;
    game.sfx("tick");
  },
  draw: function (g) {
    if (!trip) return;
    var map = forestMap();
    ART.forest(g, map, game.time, trip.area === "deep" ? { weather: "fog" } : S);
    g.clip(0, 24, 216, 192);
    if (trip.area === "deep") {
      g.dither(0, 24, 216, 26, g.INK, 1);
      g.dither(0, 190, 216, 26, g.INK, 1);
      g.dither(0, 24, 18, 192, g.INK, 1);
      g.dither(198, 24, 18, 192, g.INK, 1);
    }
    var items = [];
    for (var r = 0; r < map.length; r++) for (var c = 0; c < map[r].length; c++) {
      var ch = map[r][c], x = c * 12, y = 24 + r * 12;
      if (ch === "T") items.push({ y: y + 12, fn: (function (xx, yy) { return function () { ART.tree(g, xx, yy - 8, game.time); }; })(x, y) });
      if (ch === "S") items.push({ y: y + 12, fn: (function (xx, yy) { return function () { ART.shrine(g, xx - 6, yy - 14, game.time); }; })(x, y) });
      if (ch === "D") items.push({ y: y + 12, fn: (function (xx, yy) { return function () { ART.shrine(g, xx - 6, yy + 2, game.time); }; })(x, y) });
      if (ch === "E") items.push({ y: y + 12, fn: (function (xx, yy) { return function () {
        g.rect(xx - 6, yy + 2, 24, 2, g.DARK); g.rect(xx - 3, yy + 4, 18, 1, g.MID);
        g.rect(xx - 2, yy - 2, 2, 5, g.DARK); g.rect(xx + 12, yy - 2, 2, 5, g.DARK);
      }; })(x, y) });
      if (ch === "T" && (r * 3 + c) % 11 === 0) items.push({ y: y + 14, fn: (function (xx, yy) { return function () { ART.bush(g, xx, yy, game.time); }; })(x, y) });
    }
    for (var d = 0; d < FOREST_DECOR.length; d++) {
      var dec = FOREST_DECOR[d];
      if (trip.area === "forest") {
        items.push({ y: 24 + dec[1] * 12 + 12, fn: (function (xx, yy) { return function () { ART.bambooPlant(g, xx, yy - 8, game.time); }; })(dec[0] * 12, 24 + dec[1] * 12) });
      }
    }
    for (var n = 0; n < trip.nodes.length; n++) {
      var nd = trip.nodes[n];
      items.push({ y: 24 + nd.y * 12 + 12, fn: (function (node) { return function () { ART.node(g, node.kind, node.x * 12, 24 + node.y * 12, game.time); }; })(nd) });
    }
    for (var m = 0; m < trip.monsters.length; m++) {
      var mo = trip.monsters[m];
      items.push({ y: 24 + mo.y * 12 + 12, fn: (function (mon) { return function () { ART.monster(g, mon.id, mon.x * 12, 24 + mon.y * 12, game.time); }; })(mo) });
    }
    var p = trip.player;
    items.push({ y: 24 + p.y * 12 + 12, fn: function () {
      var px = LoGame.lerp(p.fx, p.x, p.t) * 12;
      var py = LoGame.lerp(p.fy, p.y, p.t) * 12 + 18;

    } });
    items.sort(function (a, b) { return a.y - b.y; });
    for (var i = 0; i < items.length; i++) items[i].fn();
    // pickups float up
    for (var f = 0; f < trip.fx.length; f++) {
      var fx = trip.fx[f];
      if (game.time < fx.until) g.text(fx.text, fx.x, fx.y - (fx.until - game.time) * 8, { color: g.PAPER });

    g.clip();
    // HUD
    g.window(6, 4, 204, 22, { thin: true });
    g.text(trip.area === "deep" ? "后山深处" : "后山", 10, 6);

    UI.toast(g);
  }
});

<script data-src="src/54-battle.js">
/* A short, turn-based fight. The restaurant is the main course; this is how you get meat. */
var B = null;

function battleAtk() { return 6 + (hasUpgrade("whetstone") ? 2 : 0); }
function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

function battleFx(text, x, y, color) {
  B.fx.push({ text: text, x: x, y: y, color: color == null ? 3 : color, until: game.time + 0.9 });
}

function battleMsg(text) { B.msg = text; }

async function enemyTurn() {
  if (B.stun > 0) {
    B.stun--;
    battleMsg("它被粉末迷了眼，扑了个空。");
    game.sfx("miss");
    await game.wait(0.5);
    B.mode = "menu";
    return;
  }
  var dmg;
  if (B.boss && B.turn % 3 === 0) {
    battleMsg("山魈捶地，整座山都在响！");
    dmg = rnd(9, 13);
  } else {
    battleMsg(B.def.name + "扑了上来。");
    dmg = rnd(Math.max(2, B.def.atk - 1), B.def.atk + 2);
  }
  B.enemyOff = -6;
  await game.wait(0.12);
  B.enemyOff = 0;
  game.sfx("hit");
  game.shake(2, 0.18);
  B.heroHp = Math.max(0, B.heroHp - dmg);
  battleFx("-" + dmg, 36, 100, 0);
  await game.wait(0.45);
  B.turn++;
  if (B.heroHp <= 0) {
    B.result = "lose";
    B.mode = "end";
    battleMsg("眼前一黑……");
    game.sfx("lose");
    return;
  }
  B.mode = "menu";
}

async function playerAction(i) {
  if (B.mode !== "menu") return;
  if (i === 4) { // flee
    if (B.boss) { game.sfx("err"); battleMsg("山魈挡在路前，跑不掉。"); return; }
    B.mode = "busy";
    battleMsg("你转身就跑……");
    await game.wait(0.4);
    if (Math.random() < 0.55) {
      B.result = "flee";
      B.mode = "end";
      battleMsg("你退回了林子。");
    } else {
      battleMsg("没跑掉！");
      await game.wait(0.2);
      await enemyTurn();
    }
    return;
  }
  var cost = i === 1 ? 2 : (i === 2 || i === 3) ? 1 : 0;
  if (B.qi < cost) { game.sfx("err"); battleMsg("气不够了。"); return; }
  B.mode = "busy";
  B.qi -= cost;
  if (i === 0) {
    battleMsg("你挥刀砍去。");
    await game.wait(0.15);
    var dmg0 = Math.max(1, battleAtk() + rnd(0, 3) - B.def.def);
    B.hp = Math.max(0, B.hp - dmg0);
    B.hurtUntil = game.time + 0.12;
    game.sfx("hit"); game.flash(0.04); game.shake(1, 0.12);
    battleFx("-" + dmg0, 142, 64, 0);
  } else if (i === 1) {
    battleMsg("快刀！");
    await game.wait(0.12);
    var dmg1 = Math.max(1, battleAtk() * 2 + rnd(0, 4) - B.def.def);
    B.hp = Math.max(0, B.hp - dmg1);
    B.hurtUntil = game.time + 0.16;
    game.sfx("hit"); game.flash(0.07); game.shake(3, 0.18);
    battleFx("-" + dmg1, 138, 54, 0);
  } else if (i === 2) {
    battleMsg("你撒出一把药粉。");
    B.stun = 1;
    game.sfx("miss");
    await game.wait(0.35);
  } else {
    if (B.heroHp >= B.heroMax) { game.sfx("err"); battleMsg("伤已经好了。"); B.mode = "menu"; B.qi += cost; return; }
    var heal = Math.min(10, B.heroMax - B.heroHp);
    B.heroHp += heal;
    battleMsg("你给自己包扎了一下。");
    battleFx("+" + heal, 36, 96, 3);
    game.sfx("ok");
    await game.wait(0.45);
  }
  await game.wait(0.25);
  if (B.hp <= 0) {
    victory();
    return;
  }
  await enemyTurn();
}

function victory() {
  B.result = "win";
  B.mode = "end";
  var lines = [];
  var drops = [];
  for (var i = 0; i < B.def.drops.length; i++) {
    var d = B.def.drops[i], n = rnd(d[1], d[2]);
    if (n > 0) { addIng(d[0], n); drops.push([d[0], n]); lines.push(DATA.ING[d[0]].name + "×" + n); }
  }
  var money = rnd(B.def.money - 2, B.def.money + 2);
  addMoney(money);
  B.drops = drops;
  B.money = money;
  if (B.boss) {
    S.flags.boss = 1;
    unlockDish("god_soup");
    addRep(2);
  }
  save();
  battleMsg("赢了！" + (lines.length ? lines.join("　") + "　" : "") + money + " 文");
  game.sfx("win");
}

game.scene("battle", {
  enter: function (args) {
    var def = DATA.ENEMIES[args.enemy];
    B = {
      id: args.enemy, def: def, boss: !!args.boss, from: args.from || "forest",
      hp: def.hp, maxHp: def.hp, heroHp: 30, heroMax: 30, qi: 3, qiMax: 3,
      turn: 1, stun: 0, mode: "menu", sel: 0, msg: def.intro,
      fx: [], hurtUntil: 0, enemyOff: 0, result: null, drops: [], money: 0
    };
    busy = false;
    game.ambience(args.from === "deep" ? "wind" : "stream", 0.3);
    if (typeof playMusic === "function") playMusic("battle");
  },
  exit: function () {
    if (typeof playMusic === "function") playMusic("forest");
  },
  update: function (dt) {
    if (!B) return;
    if (B.mode === "menu") {
      if (game.repeat("left")) { B.sel = (B.sel + 3) % 4; game.sfx("move"); }
      if (game.repeat("right")) { B.sel = (B.sel + 1) % 4; game.sfx("move"); }
      if (game.repeat("up")) { B.sel = (B.sel + 2) % 4; game.sfx("move"); }
      if (game.repeat("down")) { B.sel = (B.sel + 2) % 4; game.sfx("move"); }
      if (game.pressed("a")) playerAction(B.sel);
      if (game.pressed("b")) playerAction(4);
    } else if (B.mode === "end") {
      if (game.pressed("a") || game.pressed("b")) {
        game.sfx("tap");
        game.pop({ result: B.result, drops: B.drops, money: B.money });
      }
    }
  },
  draw: function (g) {
    if (!B) return;
    ART.battleBg(g, B.from === "deep" ? "deep" : "forest", game.time);
    // enemy
    var ex = B.from === "deep" ? 122 : B.id === "boar" ? 116 : 122;
    var ey = B.id === "boss" ? 54 : B.id === "bamboo" ? 54 : 72;
    ART.enemyBig(g, B.id, ex + B.enemyOff, ey, game.time, game.time < B.hurtUntil);
    // hero
    g.dither(34, 106, 24, 3, g.DARK, 1);
    var hx = 32 + (B.heroHp > 0 ? Math.sin(game.time * 2) * 0.5 : 0);
    g.sprite(ART.big.heroSide, hx, 72, { flip: false });
    // top bars
    g.window(6, 6, 96, 26, { thin: true });
    g.text("小满", 10, 8);
    g.text(B.heroHp + "/" + B.heroMax, 96, 8, { align: "right", color: g.DARK });
    g.rect(10, 20, 84, 3, g.MID); g.rect(10, 20, Math.round(84 * B.heroHp / B.heroMax), 3, g.INK);
    g.text("气", 10, 26, { color: g.DARK });
    for (var q = 0; q < B.qiMax; q++) g.rect(24 + q * 8, 27, 5, 4, q < B.qi ? g.INK : g.MID);
    g.window(114, 6, 96, 26, { thin: true });
    g.text(B.def.name, 118, 8);
    g.text(B.hp + "/" + B.maxHp, 204, 8, { align: "right", color: g.DARK });
    g.rect(118, 20, 84, 3, g.MID); g.rect(118, 20, Math.round(84 * B.hp / B.maxHp), 3, g.INK);
    // message
    g.window(4, 144, 208, 30);
    g.text(B.msg, 10, 148, { width: 196 });
    // commands
    g.window(4, 176, 208, 46);
    var cmds = [
      ["攻击", ""], ["快刀", "2气"], ["撒粉", "1气"], ["包扎", "1气"]
    ];
    for (var i = 0; i < 4; i++) {
      var cx = i % 2 === 0 ? 10 : 110, cy = i < 2 ? 179 : 192;
      if (i === B.sel) {
        g.rect(cx - 4, cy - 1, 94, 14, g.INK);
        g.text(cmds[i][0], cx, cy, { color: g.PAPER });
        g.text(cmds[i][1], cx + 86, cy, { align: "right", color: g.PAPER });
      } else {
        var need = i === 1 ? 2 : (i === 2 || i === 3) ? 1 : 0;
        g.text(cmds[i][0], cx, cy, { color: B.qi < need ? g.DARK : g.INK });
        g.text(cmds[i][1], cx + 86, cy, { align: "right", color: g.DARK });
      }
    }
    // fx
    for (var f = 0; f < B.fx.length; f++) {
      var fx = B.fx[f];
      if (game.time < fx.until) {
        var dy = (fx.until - game.time) * 12;
        g.text(fx.text, fx.x, fx.y - dy, { color: fx.color });
      }
    }
    B.fx = B.fx.filter(function (v) { return game.time < v.until; });
    g.text("A 选　B 收手", 108, 226, { align: "center", color: g.DARK });
    if (B.mode === "end") {
      g.window(44, 100, 128, 22, { thin: true });
      g.text("A 继续", 108, 105, { align: "center" });
    }
  }
});
</script>
<script data-src="src/55-service.js">
/* Evening service: four tables, a clock, and a finite number of portions. */
var SERV = null;

function clk(min) {
  var h = Math.floor(min / 60) % 24, m = Math.floor(min % 60);
  return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
}
function tablePos(i) {
  return ART.TABLES[i];
}
function seatPos(i) {
  var p = tablePos(i);
  return { x: p[0] + 16, y: p[1] - 20 };
}
function randomDish() {
  // A passing customer does not order the feast dish; it is cooked for the
  // mountain god's table.  Without this, the highest-appeal dish is eaten by
  // the first walk-in and the seventh night's three guests never get theirs.
  var pool = S.menu.filter(function (id) { return !DATA.DISHES[id].vipOnly; });
  if (!pool.length) return null;
  var total = 0, i;
  for (i = 0; i < pool.length; i++) total += DATA.DISHES[pool[i]].appeal;
  var r = Math.random() * total;
  for (i = 0; i < pool.length; i++) {
    r -= DATA.DISHES[pool[i]].appeal;
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}
function bestDish() {
  var best = null;
  for (var i = 0; i < S.menu.length; i++) {
    if (!best || DATA.DISHES[S.menu[i]].price > DATA.DISHES[best].price) best = S.menu[i];
  }
  return best;
}
function hasDish(id) { return S.menu.indexOf(id) >= 0; }

function makeCustomer(dish, who) {
  var pat = (who ? 22 : 17) + (hasUpgrade("table") ? 4 : 0);
  return {
    dish: dish, who: who || null, state: "queue", seat: -1,
    patience: pat, maxPatience: pat,
    x: 202, y: 132, fx: 202, fy: 132, tx: 202, ty: 132, t: 1,
    eatT: 0, variant: Math.floor(Math.random() * 3)
  };
}

function buildSchedule() {
  var list = [];
  var n = serveCount();
  var first = 18 * 60 + 10, span = 200;
  for (var i = 0; i < n; i++) {
    var dish = randomDish();
    if (!dish) break;
    list.push({ time: first + Math.round(i * span / n) + rnd(-3, 3), dish: dish, who: null });
  }
  function add(who, dish, time) {
    if (!dish) return;
    list.push({ time: time, dish: dish, who: who });
  }
  if (S.day === 1 && !seen("svc_ahe")) add("ahe", hasDish("mushroom_soup") ? "mushroom_soup" : bestDish(), 19 * 60);
  if (S.day === 2 && !seen("svc_zhou")) add("zhou", hasDish("grilled_fish") ? "grilled_fish" : bestDish(), 19 * 60 + 20);
  if (S.day === 3 && !seen("svc_yan")) add("yan", hasDish("pork") ? "pork" : hasDish("bamboo_pork") ? "bamboo_pork" : bestDish(), 20 * 60);
  if (S.day === 5 && !seen("svc_critic")) add("critic", hasDish("mushroom_pot") ? "mushroom_pot" : bestDish(), 20 * 60);
  if (S.day === 7) {
    add("po", hasDish("god_soup") ? "god_soup" : bestDish(), 18 * 60 + 30);
    add("zhou", hasDish("grilled_fish") ? "grilled_fish" : bestDish(), 19 * 60 + 30);
    add("ahe", hasDish("mushroom_soup") ? "mushroom_soup" : bestDish(), 20 * 60 + 30);
  }
  list.sort(function (a, b) { return a.time - b.time; });
  return list;
}

function freeSeat() {
  for (var i = 0; i < SERV.seats; i++) if (!SERV.tables[i]) return i;
  return -1;
}
function seatCustomer(c, seat) {
  var p = seatPos(seat);
  c.seat = seat;
  c.state = "sit";
  c.fx = c.x; c.fy = c.y;
  c.tx = p.x; c.ty = p.y;
  c.t = 0;
  SERV.tables[seat] = c;
}
function queueCustomer(c) {
  if (SERV.queue.length >= (2 + (hasUpgrade("table") ? 1 : 0))) { lostCustomer(c, "门口排不下了"); return; }
  c.state = "queue";
  c.x = 202; c.y = 132 + SERV.queue.length * 18;
  c.fx = c.x; c.fy = c.y;
  c.t = 1;
  SERV.queue.push(c);
  SERV.customers.push(c);
}
function lostCustomer(c, msg) {
  SERV.lost++;
  SERV.repDelta--;
  if (c.who) {
    if (S.day === 7) S.flags.vipFail = (S.flags.vipFail || 0) + 1;
    SERV.storyQueue.push({ who: c.who, dish: c.dish, lost: true });
  }
  if (msg) sayToast(msg);
}
function payCustomer(c) {
  var d = DATA.DISHES[c.dish];
  if (!d) return;
  var tip = 1 + (c.patience > c.maxPatience * 0.5 ? 1 : 0) + (c.who ? 1 : 0);
  S.money += d.price + tip;
  SERV.earned += d.price;
  SERV.tips += tip;
  SERV.served++;
  SERV.repDelta++;
  sayToast("+" + (d.price + tip) + " 文");
  var fp = c.seat >= 0 ? seatPos(c.seat) : { x: c.x, y: c.y };
  SERV.fx.push({ text: "+" + (d.price + tip) + "文", x: fp.x, y: fp.y - 18, until: game.time + 1.2 });
  if (tip > 1) SERV.fx.push({ text: "好", x: fp.x + 28, y: fp.y - 20, until: game.time + 1.2 });
  if (S.day === 7 && c.who) {
    if (!S.flags["vip_" + c.who]) {
      var ok = (c.who === "po" && c.dish === "god_soup") || (c.who === "zhou" && c.dish === "grilled_fish") || (c.who === "ahe" && c.dish === "mushroom_soup");
      if (ok) S.flags.vip = (S.flags.vip || 0) + 1;
      else S.flags.vipFail = (S.flags.vipFail || 0) + 1;
      S.flags["vip_" + c.who] = 1;
    }
    if (!seen("svc7_" + c.who)) SERV.storyQueue.push({ who: c.who, dish: c.dish, lost: false });
  } else if (c.who && !seen("svc_" + c.who)) {
    SERV.storyQueue.push({ who: c.who, dish: c.dish, lost: false });
  }
}
function startLeaving(c) {
  if (c.seat >= 0 && SERV.tables[c.seat] === c) SERV.tables[c.seat] = null;
  c.queue = false;
  var qi = SERV.queue.indexOf(c);
  if (qi >= 0) SERV.queue.splice(qi, 1);
  c.state = "leave";
  c.fx = c.x; c.fy = c.y;
  c.tx = 202; c.ty = 132;
  c.t = 0;
}
function removeCustomer(c) {
  var i = SERV.customers.indexOf(c);
  if (i >= 0) SERV.customers.splice(i, 1);
}
function seatFromQueue() {
  if (!SERV.queue.length) return;
  var seat = freeSeat();
  if (seat < 0) return;
  var c = SERV.queue.shift();
  c.state = "sit";
  c.seat = seat;
  var p = seatPos(seat);
  c.fx = c.x; c.fy = c.y;
  c.tx = p.x; c.ty = p.y;
  c.t = 0;
  SERV.tables[seat] = c;
}

async function serveSeat(i) {
  if (SERV.busy || SERV.menuOpen || SERV.paused) return;
  var c = SERV.tables[i];
  if (!c || c.state !== "wait") { game.sfx("err"); return; }
  if (stockOf(c.dish) <= 0) {
    game.sfx("err");
    sayToast("「" + DATA.DISHES[c.dish].name + "」卖完了");
    c.patience -= 4;
    if (c.patience <= 0) { lostCustomer(c, "客人等走了"); startLeaving(c); seatFromQueue(); }
    return;
  }
  SERV.busy = true;
  SERV.waiter.action = "serve";
  var p = seatPos(i);
  SERV.waiter.fx = SERV.waiter.x; SERV.waiter.fy = SERV.waiter.y;
  SERV.waiter.tx = p.x; SERV.waiter.ty = p.y + 2; SERV.waiter.t = 0;
  await game.wait(0.24);
  if (useStock(c.dish)) {
    c.state = "eat";
    c.eatT = 2.3;
    game.sfx("ok");
    SERV.fx.push({ text: "上菜", x: p.x, y: p.y - 8, until: game.time + 0.8 });
  }
  await game.wait(0.24);
  SERV.waiter.fx = SERV.waiter.x; SERV.waiter.fy = SERV.waiter.y;
  SERV.waiter.tx = 120; SERV.waiter.ty = 144; SERV.waiter.t = 0;
  SERV.waiter.action = "";
  await game.wait(0.24);
  SERV.busy = false;
}

async function autoServe() {
  if (SERV.busy || SERV.menuOpen || SERV.paused) return false;
  for (var i = 0; i < SERV.seats; i++) {
    var c = SERV.tables[i];
    if (c && c.state === "wait" && stockOf(c.dish) > 0) {
      if (!useStock(c.dish)) continue;
      c.state = "eat";
      c.eatT = 2.1;
      SERV.fx.push({ text: "阿禾", x: seatPos(i).x, y: seatPos(i).y - 10, until: game.time + 1 });
      game.sfx("tick");
      if (c.who && (S.day === 7 ? !S.flags["vip_" + c.who] : !seen("svc_" + c.who))) {
        SERV.storyQueue.push({ who: c.who, dish: c.dish, lost: false });
      }
      return true;
    }
  }
  return false;
}

function finishService(early) {
  if (SERV.done) return;
  SERV.done = true;
  // pay the people already eating, lose the rest
  for (var i = 0; i < SERV.customers.length; i++) {
    var c = SERV.customers[i];
    if (c.state === "eat") payCustomer(c);
    else if (c.state !== "leave") lostCustomer(c, null);
  }
  var rep = Math.round(SERV.served / 3) - SERV.lost;
  addRep(rep);
  SERV.repDelta = rep;
  S.phase = "night";
  S.lastLedger = {
    served: SERV.served, lost: SERV.lost, earned: SERV.earned, tips: SERV.tips,
    repDelta: rep, leftover: stockTotal(), early: !!early
  };
  S.stats.served += SERV.served;
  S.stats.lost += SERV.lost;
  S.stats.earned += SERV.earned;
  S.stats.tips += SERV.tips;
  save();
  game.go("night");
}

game.scene("service", {
  enter: function () {
    var seats = tableCount();
    SERV = {
      clock: 1080, end: 1320, seats: seats, sel: 0,
      tables: new Array(seats).fill(null), queue: [], customers: [],
      schedule: buildSchedule(), spawnAt: 0,
      served: 0, lost: 0, earned: 0, tips: 0, repDelta: 0,
      busy: false, menuOpen: false, paused: false, pauseSel: 0,
      done: false, storyQueue: [], fx: [], staffTimer: 5,
      waiter: { x: 120, y: 144, fx: 120, fy: 144, tx: 120, ty: 144, t: 1, action: "" }
    };
    game.ambience(S.weather === "rain" ? "rain" : null, 0.3);
    if (typeof playMusic === "function") playMusic("service");
    save();
  },
  update: function (dt) {
    if (!SERV || SERV.done) return;
    if (SERV.paused) {
      if (game.repeat("left") || game.repeat("up")) { SERV.pauseSel = (SERV.pauseSel + 1) % 2; game.sfx("move"); }
      if (game.repeat("right") || game.repeat("down")) { SERV.pauseSel = (SERV.pauseSel + 1) % 2; game.sfx("move"); }
      if (game.pressed("a")) {
        if (SERV.pauseSel === 0) { SERV.paused = false; game.sfx("tap"); }
        else { game.sfx("tap"); finishService(true); }
      }
      if (game.pressed("start")) { SERV.paused = false; game.sfx("tap"); }
      return;
    }
    if (SERV.menuOpen) {
      if (game.pressed("b") || game.pressed("a") || game.pressed("start")) { SERV.menuOpen = false; game.sfx("tap"); }
      return;
    }
    if (game.pressed("start")) { SERV.paused = true; SERV.pauseSel = 0; game.sfx("tap"); return; }
    if (game.pressed("b")) { SERV.menuOpen = true; game.sfx("tap"); return; }
    if (SERV.busy) return;
    if (game.repeat("left")) { SERV.sel = (SERV.sel + SERV.seats - 1) % SERV.seats; game.sfx("move"); }
    if (game.repeat("right")) { SERV.sel = (SERV.sel + 1) % SERV.seats; game.sfx("move"); }
    if (game.pressed("a")) serveSeat(SERV.sel);
    // story
    if (SERV.storyQueue.length) {
      var st = SERV.storyQueue.shift();
      if (st.lost) { SERV.busy = false; return; }
      SERV.busy = true;
      var p = S.day === 7 ? FestivalStory(st.who, st.dish, false) : ServiceStory(st.who, st.dish, false);
      if (p && p.then) p.then(function () { SERV.busy = false; });
      else SERV.busy = false;
      return;
    }
    // clock
    SERV.clock += dt / 0.45;
    if (SERV.clock >= SERV.end) { finishService(false); return; }
    // arrivals
    while (SERV.spawnAt < SERV.schedule.length && SERV.clock >= SERV.schedule[SERV.spawnAt].time) {
      var sc = SERV.schedule[SERV.spawnAt++];
      if (!sc.dish) continue;
      var c = makeCustomer(sc.dish, sc.who);
      var seat = freeSeat();
      if (seat >= 0) { SERV.customers.push(c); seatCustomer(c, seat); }
      else queueCustomer(c);
    }
    // people
    for (var i = SERV.customers.length - 1; i >= 0; i--) {
      var c = SERV.customers[i];
      if (c.t < 1) {
        c.t = Math.min(1, c.t + dt / 0.38);
        c.x = LoGame.lerp(c.fx, c.tx, c.t);
        c.y = LoGame.lerp(c.fy, c.ty, c.t);
        if (c.t >= 1 && c.state === "sit") { c.state = "wait"; c.patience = c.maxPatience; }
        if (c.t >= 1 && c.state === "leave") { removeCustomer(c); seatFromQueue(); }
        continue;
      }
      if (c.state === "wait" || c.state === "queue") {
        c.patience -= dt;
        if (c.patience <= 0) {
          lostCustomer(c, c.state === "queue" ? "等位的客人走了" : "客人等走了");
          startLeaving(c);
          seatFromQueue();
        }
      } else if (c.state === "eat") {
        c.eatT -= dt;
        if (c.eatT <= 0) { payCustomer(c); startLeaving(c); seatFromQueue(); }
      }
    }
    // waiter
    var w = SERV.waiter;
    if (w.t < 1) {
      w.t = Math.min(1, w.t + dt / 0.3);
      w.x = LoGame.lerp(w.fx, w.tx, w.t);
      w.y = LoGame.lerp(w.fy, w.ty, w.t);
    }
    // staff
    if (S.staff === "ahe") {
      SERV.staffTimer -= dt;
      if (SERV.staffTimer <= 0) {
        autoServe();
        SERV.staffTimer = 6;
      }
    }
    // floating text
    SERV.fx = SERV.fx.filter(function (v) { return game.time < v.until; });
  },
  draw: function (g) {
    if (!SERV) return;
    ART.room(g, S, "service", game.time, SERV.sel);
    // customers
    for (var i = 0; i < SERV.customers.length; i++) {
      var c = SERV.customers[i];
      if (c.state === "leave" || c.state === "sit" || c.state === "wait" || c.state === "queue") drawCustomer(g, c);
      if (c.state === "eat") {
        drawCustomer(g, c);
        var tp = tablePos(c.seat);
        g.rect(tp[0] + 18, tp[1] - 2, 8, 4, g.INK);
        g.rect(tp[0] + 19, tp[1] - 3, 6, 2, g.PAPER);
        ART.steam(g, tp[0] + 20, tp[1] - 6, game.time);
      }
      if (c.state === "wait") drawOrder(g, c);
      if (c.state === "queue") drawQueueOrder(g, c);
    }
    // waiter
    var w = SERV.waiter;
    g.dither(w.x, w.y + 17, 12, 2, g.DARK, 1);
    g.sprite(w.action === "serve" ? ART.big.heroSide : ART.big.heroDown, w.x - 2, w.y - 6, { flip: w.tx < 100 });
    if (w.action === "serve") {
      g.rect(w.x + 10, w.y + 4, 12, 3, g.INK);
      g.rect(w.x + 13, w.y + 2, 6, 2, g.PAPER);
    }
    // staff
    if (S.staff === "ahe") {
      g.sprite(ART.big.ahe, 24, 152);
    }
    // header
    UI.header(g, S, clk(SERV.clock));
    // footer / action bar
    g.window(6, 194, 204, 20, { thin: true });
    g.text("A 上菜　B 菜单", 12, 197);
    g.text("客 " + SERV.served + " / 走 " + SERV.lost, 204, 197, { align: "right", color: g.DARK });
    UI.footer(g, "←→ 选桌　START 暂停");
    // floating text
    for (var f = 0; f < SERV.fx.length; f++) {
      var fx = SERV.fx[f];
      if (game.time < fx.until) g.text(fx.text, fx.x, fx.y - (fx.until - game.time) * 8, { color: g.INK });
    }
    UI.toast(g, 30);
    if (SERV.menuOpen) drawMenu(g);
    if (SERV.paused) drawPause(g);
  }
});
