<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>打地鼠</title>
<!-- Lo-PDA example app (lopda/1): pixel sprites on a canvas, touch input, sounds through PAD.sfx. MIT License. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a3ad7e; color: #1f2a14; font-family: monospace; }
  #w { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px; box-sizing: border-box; }
  #hud { display: flex; justify-content: space-between; width: 100%; max-width: 360px; font-size: 16px; font-weight: bold; }
  #hud span { border: 2px solid #1f2a14; background: #7d8a58; padding: 2px 8px; }
  #stage { position: relative; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; border: 3px solid #1f2a14; touch-action: none; }
  #ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #a3ad7e; border: 3px solid #1f2a14; text-align: center; padding: 12px; box-sizing: border-box; }
  #ov h1 { margin: 0; font-size: 28px; letter-spacing: 4px; }
  #ov p { margin: 0; font-size: 14px; line-height: 1.6; }
  #ov canvas { border: 0; }
  button { font: inherit; font-weight: bold; padding: 8px 20px; background: #1f2a14; color: #a3ad7e; border: 0; box-shadow: 3px 3px 0 #4a5a32; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="w">
  <div id="hud"><span id="sc">分 0</span><span id="tm">30 秒</span><span id="bs">最高 0</span></div>
  <div id="stage">
    <canvas id="c" width="120" height="150"></canvas>
    <div id="ov">
      <canvas id="logo" width="32" height="32"></canvas>
      <h1 id="ot">打地鼠</h1>
      <p id="op">30 秒。点冒头的地鼠。<br>戴头盔的要砸两下。</p>
      <button id="go" type="button">开始</button>
    </div>
  </div>
</div>
<script>
(function () {
  var INK = "#1f2a14", DARK = "#4a5a32", MID = "#7d8a58", PAPER = "#a3ad7e";
  var TONE = { "0": INK, "1": DARK, "2": MID, "3": PAPER };

  /* 16x16 pixel sprites: 0 ink, 1 dark, 2 mid, 3 paper, . clear */
  var ART = {
    mole: ["................", "......0000......", "....00111100....", "...0111111110...", "..011111111110..", "..013011110310..", "..010011110010..", "..011111111110..", "..011122221110..", "..011220022110..", "..012222222210..", "..011223322110..", "..011111111110..", "..011111111110..", "..011111111110..", "..011111111110.."],
    dizzy: ["................", "......0000......", "....00111100....", "...0111111110...", "..010101101010..", "..011011110110..", "..010101101010..", "..011111111110..", "..011122221110..", "..011220022110..", "..012220022210..", "..012200002210..", "..011111111110..", "..011111111110..", "..011111111110..", "..011111111110.."],
    helmet: ["....00000000....", "...0222222220...", "..023322222220..", ".00000000000000."],
    paw: ["0.0.0", "01110", ".000."],
    strike: ["................", "................", "................", "................", "................", "................", "000000..........", "011110..........", "013310..........", "011110000000000.", "011110222222220.", "011110111111110.", "011110000000000.", "013310..........", "011110..........", "000000.........."],
    raised: ["......0000000000", "......0111111110", "......0131111310", "......0131111310", "......0111111110", "......0000000000", ".........0210...", ".........0210...", ".........0210...", ".........0210...", ".........0210...", ".........0210...", ".........0210...", ".........0210...", ".........0000...", "................"],
    spark: ["..0..", "..0..", "00.00", "..0..", "..0.."],
    plus: ["...", ".0.", "000", ".0.", "..."]
  };
  var DIGIT = ["111101101101111", "010110010010111", "111001111100111", "111001111001111", "101101111001001", "111100111001111", "111100111101111", "111001010010010", "111101111101111", "111101111001111"];

  function sprite(rows) {
    var c = document.createElement("canvas"), x = c.getContext("2d");
    c.width = rows[0].length; c.height = rows.length;
    rows.forEach(function (r, y) {
      for (var i = 0; i < r.length; i++) if (TONE[r[i]]) { x.fillStyle = TONE[r[i]]; x.fillRect(i, y, 1, 1); }
    });
    return c;
  }
  var SP = {}; Object.keys(ART).forEach(function (k) { SP[k] = sprite(ART[k]); });

  var cv = document.getElementById("c"), g = cv.getContext("2d");
  g.imageSmoothingEnabled = false;
  var W = 120, H = 150, TOP = 18, CW = 40, CH = 44;
  var holes = [], hammers = [], pops = [];
  var playing = false, score = 0, best = 0, combo = 0, endAt = 0, nextSpawn = 0, lastSec = -1, startAt = 0;

  /* fixed tufts of grass, same every game */
  var tufts = []; (function () { var s = 7; for (var i = 0; i < 26; i++) { s = (s * 73 + 41) % 997; tufts.push([s % 116 + 2, TOP + (s * 7) % (H - TOP - 4)]); } })();

  for (var i = 0; i < 9; i++) holes.push({ x: (i % 3) * CW, y: TOP + Math.floor(i / 3) * CH, s: "down", t: 0, stay: 0, helmet: false });

  function blit(img, x, y, k) { g.drawImage(img, Math.round(x), Math.round(y), img.width * (k || 2), img.height * (k || 2)); }
  function oval(cx, cy, rx, ry, color) {
    g.fillStyle = color;
    for (var dy = -ry; dy <= ry; dy++) {
      var w = Math.round(rx * Math.sqrt(1 - (dy * dy) / ((ry + 0.5) * (ry + 0.5))));
      g.fillRect(cx - w, cy + dy, w * 2, 1);
    }
  }
  function number(n, x, y) {
    String(n).split("").forEach(function (d, i) {
      var m = DIGIT[+d];
      for (var p = 0; p < 15; p++) if (m[p] === "1") { g.fillStyle = INK; g.fillRect(x + i * 4 + (p % 3), y + Math.floor(p / 3), 1, 1); }
    });
  }

  function rise(h, now) {
    /* 0 = hidden, 1 = fully up */
    var k = (now - h.t) / 120;
    if (h.s === "rise") return Math.min(1, k);
    if (h.s === "up") return 1;
    if (h.s === "sink") return Math.max(0, 1 - k);
    if (h.s === "hit") return 1;
    return 0;
  }

  function draw(now) {
    g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
    g.fillStyle = MID; tufts.forEach(function (t) { g.fillRect(t[0], t[1], 1, 2); g.fillRect(t[0] + 2, t[1] - 1, 1, 3); });
    holes.forEach(function (h, i) {
      var cx = h.x + 20, cy = h.y + 34;
      oval(cx, cy, 16, 6, MID);
      oval(cx, cy, 14, 4, INK);
      var r = rise(h, now);
      if (r > 0) {
        var top = cy - 28 * r + 2 - (h.s === "hit" ? -6 : 0);
        g.save(); g.beginPath(); g.rect(h.x, h.y - 20, CW, cy - h.y + 20); g.clip();
        blit(h.s === "hit" ? SP.dizzy : SP.mole, cx - 16, top - 2);
        if (h.helmet && h.s !== "hit") blit(SP.helmet, cx - 16, top - 2);
        g.restore();
        if (r === 1 && h.s !== "hit") { blit(SP.paw, cx - 13, cy - 4, 2); blit(SP.paw, cx + 3, cy - 4, 2); }
        if (h.s === "hit") {
          var a = (now - h.t) / 90;
          blit(SP.spark, cx - 3 + Math.round(Math.cos(a) * 12), top - 4 + Math.round(Math.sin(a) * 3), 1);
          blit(SP.spark, cx - 3 - Math.round(Math.cos(a) * 12), top - 4 - Math.round(Math.sin(a) * 3), 1);
        }
      }
    });
    hammers = hammers.filter(function (m) { return now - m.t < 260; });
    hammers.forEach(function (m) {
      var h = holes[m.i], cx = h.x + 20, cy = h.y + 34;
      /* head lands on the mole's head, or on the ground for a miss */
      var land = m.helm ? cy - 22 : m.hit ? cy - 16 : cy + 2;
      if (now - m.t < 70) blit(SP.raised, cx - 14, land - 46);
      else blit(SP.strike, cx - 6, land - 32);
    });
    pops = pops.filter(function (p) { return now - p.t < 600; });
    pops.forEach(function (p) {
      var y = Math.round(p.y - (now - p.t) / 30);
      blit(SP.plus, p.x - 4, y, 1); number(p.n, p.x, y);
    });
  }

  function spawn(now) {
    var up = holes.filter(function (h) { return h.s !== "down"; }).length;
    var left = (endAt - now) / 30000;
    if (up >= 3) return;
    var free = holes.filter(function (h) { return h.s === "down"; });
    var h = free[Math.floor(Math.random() * free.length)];
    h.s = "rise"; h.t = now;
    h.stay = 550 + 550 * left + Math.random() * 300;
    h.helmet = now - startAt > 8000 && Math.random() < 0.22;
  }

  function step(now) {
    holes.forEach(function (h) {
      if (h.s === "rise" && now - h.t >= 120) { h.s = "up"; h.t = now; }
      else if (h.s === "up" && now - h.t >= h.stay) { h.s = "sink"; h.t = now; combo = 0; }
      else if (h.s === "sink" && now - h.t >= 120) { h.s = "down"; }
      else if (h.s === "hit" && now - h.t >= 420) { h.s = "down"; }
    });
    if (now >= nextSpawn) {
      spawn(now);
      var left = (endAt - now) / 30000;
      nextSpawn = now + 380 + 520 * left + Math.random() * 200;
    }
    var sec = Math.ceil((endAt - now) / 1000);
    if (sec !== lastSec) {
      lastSec = sec; document.getElementById("tm").textContent = Math.max(0, sec) + " 秒";
      if (sec <= 5 && sec > 0) PAD.sfx("tick");
    }
    if (now >= endAt) finish();
  }

  function whack(i) {
    if (!playing) return;
    var now = performance.now(), h = holes[i];
    var m = { i: i, t: now, hit: false }; hammers.push(m);
    if ((h.s === "rise" || h.s === "up") && rise(h, now) > 0.4) {
      m.hit = true;
      if (h.helmet) { h.helmet = false; h.stay += 300; PAD.sfx("hit"); m.hit = false; m.helm = true; return; }
      combo++;
      var add = combo % 5 === 0 ? 2 : 1;
      score += add; h.s = "hit"; h.t = now;
      pops.push({ x: h.x + 18, y: h.y + 2, n: add, t: now });
      PAD.sfx(add > 1 ? "coin" : "hit");
      document.getElementById("sc").textContent = "分 " + score;
    } else { combo = 0; PAD.sfx("miss"); }
  }

  function start() {
    var now = performance.now();
    score = 0; combo = 0; startAt = now; endAt = now + 30000; nextSpawn = now + 400; lastSec = -1;
    holes.forEach(function (h) { h.s = "down"; h.helmet = false; });
    document.getElementById("sc").textContent = "分 0";
    document.getElementById("ov").classList.add("hide");
    playing = true; PAD.sfx("ok");
  }
  function finish() {
    playing = false;
    var record = score > best;
    if (record) { best = score; PAD.save("best", best); }
    document.getElementById("bs").textContent = "最高 " + best;
    document.getElementById("ot").textContent = record ? "新纪录" : "时间到";
    document.getElementById("op").innerHTML = "砸中 " + score + " 分。" + (record ? "" : "<br>最高 " + best + " 分。");
    document.getElementById("go").textContent = "再来一局";
    document.getElementById("ov").classList.remove("hide");
    PAD.sfx(record ? "win" : "lose");
  }

  function loop(now) {
    if (playing) step(now);
    draw(now);
    requestAnimationFrame(loop);
  }

  function fit() {
    var st = document.getElementById("w"), hud = document.getElementById("hud");
    var aw = st.clientWidth - 22, ah = st.clientHeight - hud.offsetHeight - 30;
    var k = Math.min(aw / W, ah / H); if (k >= 2) k = Math.floor(k); k = Math.max(1, k);
    cv.style.width = Math.round(W * k) + "px"; cv.style.height = Math.round(H * k) + "px";
    var lg = document.getElementById("logo"); lg.style.width = lg.style.height = Math.round(32 * Math.max(2, Math.floor(k))) + "px";
  }

  cv.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height - TOP;
    if (y < 0) y = 0;
    var col = Math.min(2, Math.floor(x / CW)), row = Math.min(2, Math.floor(y / CH));
    whack(row * 3 + col);
  });
  document.getElementById("go").addEventListener("click", start);
  var lg = document.getElementById("logo").getContext("2d"); lg.imageSmoothingEnabled = false;
  lg.drawImage(SP.mole, 0, 0, 32, 32);
  PAD.load("best").then(function (v) { best = +v || 0; document.getElementById("bs").textContent = "最高 " + best; });
  addEventListener("resize", fit); fit();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
