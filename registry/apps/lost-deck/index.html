<script data-src="src/10-render.js">
/* Lost Deck: the raycaster. One ray per screen column walks the map grid (DDA), finds the first wall
   or door and draws a textured strip; floor and ceiling are cast row by row; sprites are scaled
   billboards clipped against a depth buffer. Light falls off with distance in four tones, the
   fraction between two tones spread by a 4 x 4 ordered dither. Everything lands in a small tone
   buffer that the game copies onto lo-game's screen. MIT License. */
(function () {
  "use strict";
  var LD = window.LD;
  var W = 160, VH = 128;
  var FOV = 0.66;                     /* half the view plane: about 66 degrees across */
  var PROJ = (W / 2) / FOV;           /* pixels per unit of height at distance 1 */
  var fb = new Uint8Array(W * VH);
  var zbuf = new Float32Array(W);
  var BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(function (v) { return (v + 0.5) / 16; });

  /* a ray from (px, py) along (rx, ry); returns the perpendicular distance and what it hit.
     Doors sit half way into their cell and slide open along it; the cells beside them show a striped jamb. */
  var hit = { d: 0, tex: 0, u: 0, side: 0, cx: 0, cy: 0 };
  function cast(M, px, py, rx, ry, seen) {
    var mx = px | 0, my = py | 0;
    var ddx = rx === 0 ? 1e30 : Math.abs(1 / rx), ddy = ry === 0 ? 1e30 : Math.abs(1 / ry);
    var sx, sy, sdx, sdy;
    if (rx < 0) { sx = -1; sdx = (px - mx) * ddx; } else { sx = 1; sdx = (mx + 1 - px) * ddx; }
    if (ry < 0) { sy = -1; sdy = (py - my) * ddy; } else { sy = 1; sdy = (my + 1 - py) * ddy; }
    var side = 0, prevDoor = false, w = M.w, cells = M.cells;
    for (var n = 0; n < 64; n++) {
      if (sdx < sdy) { sdx += ddx; mx += sx; side = 0; } else { sdy += ddy; my += sy; side = 1; }
      if (mx < 0 || my < 0 || mx >= w || my >= M.h) { hit.d = 60; hit.tex = 1; hit.u = 0; hit.side = side; return hit; }
      var i = my * w + mx, c = cells[i];
      if (seen) seen[i] = 1;
      if (c === 0) { prevDoor = false; continue; }
      if (c >= 10 && c <= 14) {
        /* a door: its plane runs through the middle of the cell */
        var open = M.open[i], t, f;
        if (M.axis[i] === 0) {           /* the door faces x: plane at x = mx + 0.5 */
          if (rx === 0) { prevDoor = true; continue; }
          t = (mx + 0.5 - px) / rx; f = py + t * ry - my;
        } else {
          if (ry === 0) { prevDoor = true; continue; }
          t = (my + 0.5 - py) / ry; f = px + t * rx - mx;
        }
        if (t > 0 && f >= 0 && f < 1 && f >= open) {
          hit.d = t; hit.tex = c; hit.u = f - open; hit.side = M.axis[i]; hit.cx = mx; hit.cy = my; return hit;
        }
        prevDoor = true;
        continue;
      }
      var d = side === 0 ? sdx - ddx : sdy - ddy, u;
      if (side === 0) { u = py + d * ry; } else { u = px + d * rx; }
      u -= Math.floor(u);
      if ((side === 0 && rx < 0) || (side === 1 && ry > 0)) u = 1 - u;
      hit.d = d; hit.tex = prevDoor ? "jamb" : c; hit.u = u; hit.side = side; hit.cx = mx; hit.cy = my;
      return hit;
    }
    hit.d = 60; hit.tex = 1; return hit;
  }

  function texOf(id, time) {
    var t = LD.TEX[id];
    if (Array.isArray(t)) t = t[Math.floor(time * 2) % t.length];
    return t;
  }

  /* how much darker a point is: distance falloff, plus the torch cone on dark decks */
  function shadeK(view, x) {
    if (!view.dark) return view.fog;
    var cx = (x - W / 2) / (W / 2);
    return view.fog + view.dark * Math.min(1, cx * cx * 2.2);
  }

  /* draw the view. view: {x, y, a, bob, fog, dark, time, flash}; M: the map; sprites: [{x, y, s, h, z, flash}] */
  function render(M, view, sprites) {
    var px = view.x, py = view.y, dx = Math.cos(view.a), dy = Math.sin(view.a);
    var plx = -dy * FOV, ply = dx * FOV;
    var hz = (VH >> 1) + (view.bob | 0), time = view.time;
    var FL = LD.FLOOR, CE = LD.CEIL, SL = LD.SLIME, fp = FL.px, cp = CE.px, sp = SL.px;
    var col = new Float32Array(W);
    for (var x0 = 0; x0 < W; x0++) col[x0] = shadeK(view, x0);
    var base = view.light || 0;
    /* floor and ceiling */
    var rx0 = dx - plx, ry0 = dy - ply, rx1 = dx + plx, ry1 = dy + ply;
    for (var y = 0; y < VH; y++) {
      var p = y - hz, isFloor = p > 0;
      if (p === 0) { for (var xh = 0; xh < W; xh++) fb[y * W + xh] = 0; continue; }
      var rowD = (PROJ * 0.5) / Math.abs(p);
      var stx = rowD * (rx1 - rx0) / W, sty = rowD * (ry1 - ry0) / W;
      var fx = px + rowD * rx0, fy = py + rowD * ry0, row = y * W, by = (y & 3) * 4;
      var far = rowD > 3.2;   /* far away the grating would only shimmer: show its average tone */
      for (var x = 0; x < W; x++) {
        var cxI = fx | 0, cyI = fy | 0;
        var tu = ((fx - cxI) * 16) | 0, tv = ((fy - cyI) * 16) | 0, ti = tv * 16 + tu, tone;
        if (isFloor) {
          tone = (M.slime && cxI >= 0 && cyI >= 0 && cxI < M.w && cyI < M.h && M.slime[cyI * M.w + cxI]) ? sp[ti] : far ? 2 : fp[ti];
        } else tone = far && cp[ti] < 3 ? 1 : cp[ti];
        var s = (rowD * col[x] - base + BAYER[by + (x & 3)]) | 0;
        tone -= s < 0 ? 0 : s;
        fb[row + x] = tone < 0 ? 0 : tone;
        fx += stx; fy += sty;
      }
    }
    /* walls */
    for (var x2 = 0; x2 < W; x2++) {
      var cam = 2 * x2 / W - 1, rdx = dx + plx * cam, rdy = dy + ply * cam;
      var h = cast(M, px, py, rdx, rdy, M.seen);
      var d = h.d < 0.05 ? 0.05 : h.d;
      zbuf[x2] = d;
      var tex = texOf(h.tex, time), tw = tex.w, tp = tex.px;
      var lh = PROJ / d, top = hz - lh / 2;
      var y0 = top < 0 ? 0 : Math.ceil(top), y1 = Math.min(VH, Math.ceil(hz + lh / 2));
      var u = (h.u * tw) | 0; if (u >= tw) u = tw - 1;
      var kd = d * col[x2] + (h.side ? 0.55 : 0) - base, step = tex.h / lh;
      for (var y2 = y0; y2 < y1; y2++) {
        var v = ((y2 - top) * step) | 0; if (v >= tex.h) v = tex.h - 1;
        var t2 = tp[v * tw + u];
        var s2 = (kd + BAYER[(y2 & 3) * 4 + (x2 & 3)]) | 0;
        t2 -= s2 < 0 ? 0 : s2;
        fb[y2 * W + x2] = t2 < 0 ? 0 : t2;
      }
    }
    /* sprites, far to near */
    var inv = 1 / (plx * dy - dx * ply), list = [];
    for (var k = 0; k < sprites.length; k++) {
      var o = sprites[k], ox = o.x - px, oy = o.y - py;
      var tx = inv * (dy * ox - dx * oy), ty = inv * (-ply * ox + plx * oy);
      if (ty < 0.12) continue;
      o._tx = tx; o._ty = ty; list.push(o);
    }
    list.sort(function (a, b) { return b._ty - a._ty; });
    for (var m = 0; m < list.length; m++) drawSprite(list[m], hz, view);
    return { fb: fb, zbuf: zbuf };
  }

  function drawSprite(o, hz, view) {
    var s = o.s; if (!s) return;
    var ty = o._ty, sxc = (W / 2) * (1 + o._tx / ty);
    var hpx = PROJ * o.h / ty, wpx = hpx * s.w / s.h * (o.wide || 1);
    var bottom = hz + PROJ * (0.5 - (o.z || 0)) / ty, top = bottom - hpx, left = sxc - wpx / 2;
    var x0 = Math.max(0, Math.ceil(left)), x1 = Math.min(W, Math.ceil(left + wpx));
    var y0 = Math.max(0, Math.ceil(top)), y1 = Math.min(VH, Math.ceil(bottom));
    if (x0 >= x1 || y0 >= y1) return;
    var kd = o.glow ? -1 : ty * shadeK(view, sxc | 0) * 0.6 - (view.light || 0), sw = s.w, sh = s.h, px = s.px;
    var flash = o.flash, fx = sw / wpx, fy = sh / hpx;
    for (var x = x0; x < x1; x++) {
      if (zbuf[x] < ty) continue;
      var u = ((x - left) * fx) | 0; if (u >= sw) u = sw - 1;
      if (o.flip) u = sw - 1 - u;
      for (var y = y0; y < y1; y++) {
        var v = ((y - top) * fy) | 0; if (v >= sh) v = sh - 1;
        var t = px[v * sw + u];
        if (t === 255) continue;
        if (flash) t = 3;
        else {
          var sh2 = (kd + BAYER[(y & 3) * 4 + (x & 3)]) | 0;
          t -= sh2 < 0 ? 0 : sh2; if (t < 0) t = 0;
        }
        fb[y * W + x] = t;
      }
    }
  }

  LD.R = { W: W, VH: VH, PROJ: PROJ, FOV: FOV, render: render, cast: cast, fb: fb, zbuf: zbuf, BAYER: BAYER };
})();
</script>
<script data-src="src/20-world.js">
/* Lost Deck: the world. A deck is a grid of cells (walls, doors, floor) and a list of things on it:
   the player, robots, spores, pickups, crates, bolts in flight. This file moves them, lets them see and
   chase the player, fires the player's weapons and keeps the deck's score. No drawing here.
   MIT License. */
(function () {
  "use strict";
  var LD = window.LD;

  /* map characters -> cell codes. 1-7 walls, 10 door, 11-13 doors that need a card, 14 lift (the exit),
     15 a wall that slides away when you press B on it (a secret) */
  var CELL = { "#": 1, "P": 2, "C": 3, "W": 4, "M": 5, "T": 6, "K": 7, "D": 10, "1": 11, "2": 12, "3": 13, "E": 14, "S": 15 };
  var SOLID_WALL = function (c) { return (c >= 1 && c <= 7) || c === 14 || c === 15; };

  var FOES = {
    crawler: { hp: 2, spd: 2.1, r: 0.28, h: 0.5, sight: 10, melee: { dmg: 7, range: 0.78, cd: 0.8 } },
    spore: { hp: 1, spd: 0.85, r: 0.3, h: 0.5, z: 0.22, sight: 8, burst: { near: 0.85, dmg: 22, radius: 1.6 } },
    sentry: { hp: 6, spd: 0, r: 0.36, h: 0.8, sight: 12, shoot: { cd: 2.0, n: 1, spd: 4.0, dmg: 9 } },
    guard: { hp: 10, spd: 1.25, r: 0.32, h: 0.95, sight: 12, keep: 2.6, shoot: { cd: 2.8, n: 3, gap: 0.22, spd: 4.5, dmg: 6 } },
    node: { hp: 8, spd: 0, r: 0.32, h: 0.75, sight: 0 },
    core: { hp: 44, spd: 0, r: 0.62, h: 1.4, sight: 30 }
  };
  var ITEMS = {
    a: { kind: "ammo", n: 8, s: "ammo", h: 0.26 }, A: { kind: "ammo", n: 20, s: "ammoBig", h: 0.32 },
    h: { kind: "med", n: 15, s: "med", h: 0.26 }, H: { kind: "med", n: 40, s: "medBig", h: 0.34 },
    u: { kind: "card", n: 1, h: 0.3 }, o: { kind: "card", n: 2, h: 0.3 }, v: { kind: "card", n: 3, h: 0.3 },
    G: { kind: "gun", n: 12, s: "scatter", h: 0.22 }
  };
  var DECOR = {
    i: { s: "column", h: 1.0, r: 0.3, solid: true }, k: { s: "crate", h: 0.55, r: 0.36, solid: true },
    l: { s: "lamp", h: 0.9, r: 0.15, solid: true, glow: true }, b: { s: "bones", h: 0.2, r: 0 }
  };
  var WEAPONS = {
    wrench: { rate: 0.42, dmg: 3, range: 1.15, ammo: 0 },
    rivet: { rate: 0.27, dmg: 2, ammo: 1 },
    scatter: { rate: 0.78, dmg: 2, ammo: 3, pellets: 7, cone: 0.13 }
  };

  function World(deck, hooks) {
    this.deck = deck; this.hooks = hooks || {};
    var rows = deck.map, h = rows.length, w = 0;
    rows.forEach(function (r) { w = Math.max(w, r.length); });
    var M = this.M = { w: w, h: h, cells: new Uint8Array(w * h), open: new Float32Array(w * h), axis: new Uint8Array(w * h),
      timer: new Float32Array(w * h), seen: new Uint8Array(w * h), slime: null, dist: new Int16Array(w * h) };
    this.things = []; this.time = 0; this.kills = 0; this.foes = 0; this.secrets = 0; this.secretsFound = 0;
    this.cards = [false, false, false, false]; this.logs = []; this.fx = [];
    var P = this.P = { x: 1.5, y: 1.5, a: (deck.face || 0) * Math.PI / 180, hp: 100, ammo: deck.ammo != null ? deck.ammo : 30,
      guns: { wrench: true, rivet: true, scatter: !!deck.scatter }, gun: "rivet", cd: 0, kick: 0, hurt: 0, hurtDir: 0,
      bob: 0, moving: 0, gas: 0, pick: 0, dead: false, turnV: 0 };
    if (deck.slime) M.slime = new Uint8Array(w * h);
    var termN = 0;
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var ch = rows[y].charAt(x) || "#", i = y * w + x;
      if (CELL[ch] != null) {
        M.cells[i] = CELL[ch];
        if (ch === "S") this.secrets++;
        if (ch === "T") this.logs[i] = termN++;
        continue;
      }
      var cx = x + 0.5, cy = y + 0.5;
      if (ch === "~") { if (M.slime) M.slime[i] = 1; continue; }
      if (ch === "@") { P.x = cx; P.y = cy; continue; }
      if (ch === "c") this.addFoe("crawler", cx, cy);
      else if (ch === "f") this.addFoe("spore", cx, cy);
      else if (ch === "s") this.addFoe("sentry", cx, cy);
      else if (ch === "g") this.addFoe("guard", cx, cy);
      else if (ch === "n") this.addFoe("node", cx, cy);
      else if (ch === "B") this.addFoe("core", cx, cy);
      else if (ch === "z") this.things.push({ kind: "vent", x: cx, y: cy });
      else if (ch === "x") this.things.push({ kind: "barrel", x: cx, y: cy, hp: 2, r: 0.33, solid: true });
      else if (ITEMS[ch]) this.things.push({ kind: "item", it: ITEMS[ch], ch: ch, x: cx, y: cy });
      else if (DECOR[ch]) { var d = DECOR[ch]; this.things.push({ kind: "decor", d: d, x: cx, y: cy, r: d.r, solid: d.solid }); }
    }
    /* door orientation: a door between two walls on the left and right blocks travel north-south */
    for (var j = 0; j < w * h; j++) {
      var c = M.cells[j]; if (c < 10 || c > 14) continue;
      var jx = j % w, jy = (j / w) | 0;
      M.axis[j] = this.wallAt(jx - 1, jy) && this.wallAt(jx + 1, jy) ? 1 : 0;
    }
    if (M.slime) for (var k = 0; k < rows.length; k++) for (var q = 0; q < rows[k].length; q++) {
      var cc = rows[k].charAt(q);
      if (cc === "~" || (deck.slimeUnder && deck.slimeUnder.indexOf(cc) >= 0)) M.slime[k * w + q] = 1;
    }
    this.pcell = -1;
    this.flow();
  }
  var W = World.prototype;

  W.addFoe = function (type, x, y, spawned) {
    var F = FOES[type];
    var e = { kind: "foe", type: type, F: F, x: x, y: y, hp: F.hp, r: F.r, awake: !!spawned, cd: 0.6 + Math.random(), t: Math.random() * 10,
      see: false, seeT: 0, flash: 0, stagger: 0, act: 0, dead: false, deadT: 0, spawned: !!spawned, burst: 0, burstT: 0, solid: type === "sentry" || type === "node" || type === "core" };
    if (!spawned) this.foes++;
    this.things.push(e);
    return e;
  };

  W.cell = function (x, y) { var M = this.M; return x < 0 || y < 0 || x >= M.w || y >= M.h ? 1 : M.cells[y * M.w + x]; };
  W.wallAt = function (x, y) { return SOLID_WALL(this.cell(x, y)); };
  /* can something stand in this cell? doors only when they are nearly open */
  W.blockedCell = function (x, y) {
    var c = this.cell(x, y);
    if (c === 0) return false;
    if (c >= 10 && c <= 13) return this.M.open[y * this.M.w + x] < 0.85;
    return true;
  };
  W.blocked = function (x, y, r) {
    return this.blockedCell((x - r) | 0, (y - r) | 0) || this.blockedCell((x + r) | 0, (y - r) | 0) ||
      this.blockedCell((x - r) | 0, (y + r) | 0) || this.blockedCell((x + r) | 0, (y + r) | 0);
  };
  /* can a bolt or a look pass through this cell right now? */
  W.opaque = function (x, y) {
    var c = this.cell(x, y);
    if (c === 0) return false;
    if (c >= 10 && c <= 13) return this.M.open[y * this.M.w + x] < 0.6;
    return true;
  };
  W.sightLine = function (x0, y0, x1, y1) {
    var dx = x1 - x0, dy = y1 - y0, d = Math.sqrt(dx * dx + dy * dy), n = Math.ceil(d / 0.2);
    for (var i = 1; i < n; i++) { var t = i / n; if (this.opaque((x0 + dx * t) | 0, (y0 + dy * t) | 0)) return false; }
    return true;
  };

  /* distance (in cells) from every reachable cell to the player, for robots that lost sight of you */
  W.flow = function () {
    var M = this.M, w = M.w, dist = M.dist, P = this.P;
    var pc = (P.y | 0) * w + (P.x | 0);
    if (pc === this.pcell) return;
    this.pcell = pc;
    dist.fill(-1);
    var q = new Int32Array(w * M.h), qh = 0, qt = 0;
    dist[pc] = 0; q[qt++] = pc;
    while (qh < qt) {
      var i = q[qh++], x = i % w, y = (i / w) | 0, nd = dist[i] + 1;
      for (var k = 0; k < 4; k++) {
        var nx = x + (k === 0 ? 1 : k === 1 ? -1 : 0), ny = y + (k === 2 ? 1 : k === 3 ? -1 : 0);
        if (nx < 0 || ny < 0 || nx >= w || ny >= M.h) continue;
        var j = ny * w + nx, c = M.cells[j];
        if (dist[j] >= 0) continue;
        if (c !== 0 && c !== 10 && !(c >= 11 && c <= 13 && M.open[j] > 0.5)) continue;
        dist[j] = nd; q[qt++] = j;
      }
    }
  };

  /* ---------------- doors ---------------- */
  W.tryDoor = function (x, y, byPlayer) {
    var M = this.M, i = y * M.w + x, c = this.cell(x, y);
    if (c === 14) { if (byPlayer && !this.done) this.hooks.exit && this.hooks.exit(); return true; }
    if (c === 15 && byPlayer) {
      M.cells[i] = 0; this.secretsFound++; this.pcell = -1;
      this.hooks.secret && this.hooks.secret(this.secretsFound, this.secrets);
      return true;
    }
    if (c === 6 && byPlayer) { this.hooks.terminal && this.hooks.terminal(this.logs[i]); return true; }
    if (c < 10 || c > 13) return false;
    if (c > 10 && !this.cards[c - 10]) {
      if (byPlayer) this.hooks.locked && this.hooks.locked(c - 10);
      return true;
    }
    if (M.open[i] < 1 && M.timer[i] <= 0) { M.timer[i] = 0.01; this.hooks.door && this.hooks.door(x + 0.5, y + 0.5); }
    else if (M.open[i] >= 1) M.timer[i] = 0.01;
    return true;
  };
  W.updateDoors = function (dt) {
    var M = this.M, n = M.w * M.h, P = this.P;
    for (var i = 0; i < n; i++) {
      var c = M.cells[i]; if (c < 10 || c > 13) continue;
      if (M.timer[i] > 0) {
        if (M.open[i] < 1) { M.open[i] = Math.min(1, M.open[i] + dt * 2.2); if (M.open[i] >= 1) M.timer[i] = 0.01; }
        else {
          M.timer[i] += dt;
          if (M.timer[i] > 3.5) {
            var x = i % M.w, y = (i / M.w) | 0;
            if (!this.doorBusy(x, y)) { M.timer[i] = -1; this.hooks.door && this.hooks.door(x + 0.5, y + 0.5); } else M.timer[i] = 2.5;
          }
        }
      } else if (M.timer[i] < 0) {
        M.open[i] = Math.max(0, M.open[i] - dt * 2.2);
        if (M.open[i] <= 0) M.timer[i] = 0;
        if (this.doorBusy(i % M.w, (i / M.w) | 0)) M.timer[i] = 0.01;   /* never close on anyone: open again */
      }
    }
  };

  /* is anything (you, a robot, a pickup) even partly inside this door's cell? */
  W.doorBusy = function (x, y) {
    var P = this.P;
    function over(o, r) { return o.x + r > x && o.x - r < x + 1 && o.y + r > y && o.y - r < y + 1; }
    if (!P.dead && over(P, 0.3)) return true;
    for (var k = 0; k < this.things.length; k++) {
      var o = this.things[k];
      if (((o.kind === "foe" && !o.dead) || o.kind === "item") && over(o, (o.r || 0.2) + 0.05)) return true;
    }
    return false;
  };

  /* ---------------- moving round things against the grid ---------------- */
  W.slide = function (o, dx, dy, r) {
    var moved = false;
    if (dx && !this.blocked(o.x + dx, o.y, r) && !this.bumpThing(o, o.x + dx, o.y, r)) { o.x += dx; moved = true; }
    if (dy && !this.blocked(o.x, o.y + dy, r) && !this.bumpThing(o, o.x, o.y + dy, r)) { o.y += dy; moved = true; }
    return moved;
  };
  W.bumpThing = function (self, x, y, r) {
    for (var i = 0; i < this.things.length; i++) {
      var o = this.things[i];
      if (o === self || !o.solid || o.dead) continue;
      var dx = o.x - x, dy = o.y - y, rr = o.r + r;
      if (dx * dx + dy * dy < rr * rr) {
        var odx = o.x - self.x, ody = o.y - self.y;
        if (dx * dx + dy * dy < odx * odx + ody * ody) return true;   /* only block moving closer */
      }
    }
    return false;
  };

  /* ---------------- the player ---------------- */
  W.update = function (dt, input) {
    if (this.done) return;
    var P = this.P;
    this.time += dt;
    if (!P.dead) this.movePlayer(dt, input);
    this.updateDoors(dt);
    this.flow();
    for (var i = 0; i < this.things.length; i++) {
      var o = this.things[i];
      if (o.kind === "foe") this.updateFoe(o, dt);
      else if (o.kind === "bolt") this.updateBolt(o, dt);
      else if (o.kind === "item" && !P.dead) this.touchItem(o);
    }
    for (var f = 0; f < this.fx.length; f++) this.fx[f].t += dt;
    this.fx = this.fx.filter(function (e) { return e.t < e.life; });
    this.things = this.things.filter(function (o) { return !o.gone; });
    P.cd = Math.max(0, P.cd - dt); P.kick = Math.max(0, P.kick - dt); P.hurt = Math.max(0, P.hurt - dt);
    P.gas = Math.max(0, P.gas - dt); P.pick = Math.max(0, P.pick - dt);
  };

  W.movePlayer = function (dt, input) {
    var P = this.P;
    /* turning eases in, so a tap nudges the aim and a hold swings round */
    var turn = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    if (input.strafe) turn = 0;
    if (turn) P.turnV = Math.min(1, P.turnV + dt * 6); else P.turnV = 0;
    P.a += turn * dt * (0.9 + 1.9 * P.turnV);
    var fwd = (input.up ? 1 : 0) - (input.down ? 1 : 0);
    var str = input.strafe ? (input.right ? 1 : 0) - (input.left ? 1 : 0) : 0;
    var ca = Math.cos(P.a), sa = Math.sin(P.a);
    var spd = fwd > 0 ? 3.0 : 2.3;
    var mx = (ca * fwd * spd - sa * str * 2.6) * dt, my = (sa * fwd * spd + ca * str * 2.6) * dt;
    var r = 0.24;
    if (mx || my) {
      var bx = P.x, by = P.y;
      this.slide(P, mx, my, r);
      var got = Math.hypot(P.x - bx, P.y - by);
      P.moving = Math.min(1, P.moving + dt * 5);
      P.bob += got * 3.4;
      /* walking into a door opens it */
      if (fwd > 0 && got < Math.hypot(mx, my) * 0.5) {
        /* ahead, or straight along x or y when you come at it slanted */
        var tries = [[P.x + ca * 0.6, P.y + sa * 0.6], [P.x + ca * 0.6, P.y], [P.x, P.y + sa * 0.6]];
        for (var q = 0; q < 3; q++) {
          var fx = tries[q][0] | 0, fy = tries[q][1] | 0, c = this.cell(fx, fy);
          if (c >= 10 && c <= 14) { this.tryDoor(fx, fy, true); break; }
        }
      }
    } else P.moving = Math.max(0, P.moving - dt * 4);
    if (input.use) this.use();
    if (input.swap) this.swap();
    if (input.fire) this.fire();
  };

  /* B: press whatever is in front: a door, a terminal, a loose panel, the lift */
  W.use = function () {
    var P = this.P, ca = Math.cos(P.a), sa = Math.sin(P.a);
    for (var d = 0.3; d <= 1.25; d += 0.15) {
      var x = (P.x + ca * d) | 0, y = (P.y + sa * d) | 0, c = this.cell(x, y);
      if (c === 0) continue;
      if (this.tryDoor(x, y, true)) return;
      break;
    }
    this.hooks.nothing && this.hooks.nothing();
  };
  W.swap = function () {
    var P = this.P, order = ["rivet", "scatter", "wrench"], i = order.indexOf(P.gun);
    for (var k = 1; k <= 3; k++) {
      var g = order[(i + k) % 3];
      if (P.guns[g] && (g === "wrench" || P.ammo >= WEAPONS[g].ammo)) { P.gun = g; this.hooks.swap && this.hooks.swap(g); return; }
    }
  };

  /* ---------------- shooting ---------------- */
  W.fire = function () {
    var P = this.P;
    if (P.cd > 0 || P.dead) return;
    var Wp = WEAPONS[P.gun];
    if (Wp.ammo && P.ammo < Wp.ammo) {
      P.gun = P.guns.rivet && P.ammo >= 1 ? "rivet" : "wrench";
      this.hooks.empty && this.hooks.empty(P.gun);
      P.cd = 0.3;
      return;
    }
    P.cd = Wp.rate; P.kick = 0.16;
    P.ammo -= Wp.ammo;
    this.hooks.shot && this.hooks.shot(P.gun);
    if (P.gun === "wrench") {
      var best = null, bd = Wp.range;
      for (var i = 0; i < this.things.length; i++) {
        var o = this.things[i];
        if (!(o.kind === "foe" && !o.dead) && o.kind !== "barrel") continue;
        var dx = o.x - P.x, dy = o.y - P.y, dd = Math.sqrt(dx * dx + dy * dy) - (o.r || 0);
        var ang = Math.abs(angDiff(Math.atan2(dy, dx), P.a));
        if (dd < bd && ang < 0.55) { bd = dd; best = o; }
      }
      if (best) { this.hurtThing(best, Wp.dmg); this.hooks.clang && this.hooks.clang(); }
      return;
    }
    this.noise(P.x, P.y, 8);
    var n = Wp.pellets || 1;
    for (var k = 0; k < n; k++) {
      var a = P.a + (n > 1 ? (k / (n - 1) - 0.5) * 2 * Wp.cone + (Math.random() - 0.5) * 0.03 : (Math.random() - 0.5) * 0.012);
      this.hitscan(a, Wp.dmg);
    }
  };
  W.hitscan = function (a, dmg) {
    var P = this.P, dx = Math.cos(a), dy = Math.sin(a);
    var wall = LD.R.cast(this.M, P.x, P.y, dx, dy, null).d;
    var best = null, bd = wall;
    for (var i = 0; i < this.things.length; i++) {
      var o = this.things[i];
      if (!((o.kind === "foe" && !o.dead) || o.kind === "barrel")) continue;
      var vx = o.x - P.x, vy = o.y - P.y, along = vx * dx + vy * dy;
      if (along <= 0 || along > bd) continue;
      var perp = Math.abs(vx * dy - vy * dx);
      if (perp < o.r * 1.3 + 0.05) { bd = along; best = o; }   /* a little forgiving: the d-pad aims coarsely */
    }
    var hx = P.x + dx * (bd - 0.08), hy = P.y + dy * (bd - 0.08);
    this.fx.push({ s: "spark", x: hx, y: hy, z: 0.3 + Math.random() * 0.15, h: 0.16, t: 0, life: 0.12, glow: true });
    if (best) this.hurtThing(best, dmg);
  };
  function angDiff(a, b) { var d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
  W.angDiff = angDiff;

  W.noise = function (x, y, r) {
    for (var i = 0; i < this.things.length; i++) {
      var o = this.things[i];
      if (o.kind === "foe" && !o.awake && Math.hypot(o.x - x, o.y - y) < r) o.awake = true;
    }
  };

  W.hurtThing = function (o, dmg) {
    if (o.kind === "barrel") { o.hp -= dmg; if (o.hp <= 0 && !o.gone) { o.gone = true; this.explode(o.x, o.y, 1.8, 30); } return; }
    if (o.dead) return;
    if (o.type === "core" && this.shielded()) { o.flash = 0.06; this.hooks.ping && this.hooks.ping(); return; }
    o.hp -= dmg; o.flash = 0.12; o.awake = true;
    if (o.type === "crawler" || o.type === "guard") o.stagger = 0.14;
    if (o.hp <= 0) this.kill(o); else this.hooks.hit && this.hooks.hit(o);
  };
  W.shielded = function () {
    for (var i = 0; i < this.things.length; i++) { var o = this.things[i]; if (o.type === "node" && !o.dead) return true; }
    return false;
  };
  W.kill = function (o) {
    o.dead = true; o.deadT = 0; o.solid = false;
    if (!o.spawned) this.kills++;
    this.hooks.kill && this.hooks.kill(o);
    if (o.type === "spore") { o.gone = true; this.explode(o.x, o.y, o.F.burst.radius, o.F.burst.dmg, true); }
    if (o.type === "guard") this.things.push({ kind: "item", it: ITEMS.a, ch: "a", x: o.x, y: o.y });
    if (o.type === "core") this.hooks.coreDown && this.hooks.coreDown(o);
  };
  W.explode = function (x, y, rad, dmg, gas) {
    this.fx.push({ s: gas ? "puff" : "boom", x: x, y: y, z: 0.05, h: gas ? 0.9 : 1.0, t: 0, life: gas ? 0.6 : 0.45, glow: !gas, grow: true });
    this.hooks.boom && this.hooks.boom(x, y, gas);
    var P = this.P, pd = Math.hypot(P.x - x, P.y - y);
    if (pd < rad && this.sightLine(x, y, P.x, P.y)) {
      this.hurtPlayer(Math.round(dmg * (1 - pd / rad * 0.6)), x, y);
      if (gas) P.gas = 2.2;
    }
    for (var i = 0; i < this.things.length; i++) {
      var o = this.things[i];
      if (o.gone || o.dead || (o.kind !== "foe" && o.kind !== "barrel")) continue;
      if (o.type === "core") continue;
      var d = Math.hypot(o.x - x, o.y - y);
      if (d < rad) this.hurtThing(o, Math.max(1, Math.round(dmg / 6 * (1 - d / rad * 0.5))));
    }
  };
  W.hurtPlayer = function (dmg, fx, fy) {
    var P = this.P;
    if (P.dead || dmg <= 0) return;
    if (this.deck.easy) dmg = Math.ceil(dmg * 0.6);
    P.hp -= dmg; P.hurt = 0.35;
    P.hurtDir = angDiff(Math.atan2(fy - P.y, fx - P.x), P.a);
    this.hooks.hurt && this.hooks.hurt(dmg);
    if (P.hp <= 0) { P.hp = 0; P.dead = true; this.hooks.dead && this.hooks.dead(); }
  };

  W.touchItem = function (o) {
    var P = this.P;
    if (Math.hypot(o.x - P.x, o.y - P.y) > 0.55) return;
    var it = o.it, took = false;
    if (it.kind === "ammo") { if (P.ammo < 99) { P.ammo = Math.min(99, P.ammo + it.n); took = true; } }
    else if (it.kind === "med") { if (P.hp < 100) { P.hp = Math.min(100, P.hp + it.n); took = true; } }
    else if (it.kind === "card") { this.cards[it.n] = true; took = true; }
    else if (it.kind === "gun") { P.guns.scatter = true; P.gun = "scatter"; P.ammo = Math.min(99, P.ammo + it.n); took = true; }
    if (took) { o.gone = true; P.pick = 0.25; this.hooks.pickup && this.hooks.pickup(it); }
    else if (!o.told) { o.told = true; this.hooks.full && this.hooks.full(it); }
  };

  /* ---------------- robots, spores and the core ---------------- */
  W.updateFoe = function (e, dt) {
    var P = this.P, F = e.F;
    e.t += dt; e.flash = Math.max(0, e.flash - dt); e.act = Math.max(0, e.act - dt);
    if (e.dead) { e.deadT += dt; return; }
    var dx = P.x - e.x, dy = P.y - e.y, dist = Math.sqrt(dx * dx + dy * dy);
    e.seeT -= dt;
    if (e.seeT <= 0) {
      e.seeT = 0.2 + Math.random() * 0.1;
      e.see = !P.dead && dist < (e.awake ? 30 : F.sight) && this.sightLine(e.x, e.y, P.x, P.y);
      if (e.see && !e.awake) { e.awake = true; e.cd = Math.max(e.cd, 0.5); this.hooks.wake && this.hooks.wake(e); }
    }
    if (e.type === "core") return this.updateCore(e, dt, dist);
    if (!e.awake || P.dead) return;
    e.cd -= dt;
    if (e.stagger > 0) { e.stagger -= dt; return; }
    /* attacks */
    if (F.melee && dist < F.melee.range + e.r && e.cd <= 0) {
      e.cd = F.melee.cd; e.act = 0.25; this.hurtPlayer(F.melee.dmg, e.x, e.y);
    }
    if (F.burst && dist < F.burst.near) { this.kill(e); return; }
    if (F.shoot) {
      if (e.burst > 0) {
        e.burstT -= dt;
        if (e.burstT <= 0) { e.burst--; e.burstT = F.shoot.gap; this.shoot(e, F.shoot); }
      } else if (e.see && e.cd <= 0 && dist < 14) {
        e.cd = F.shoot.cd * (0.8 + Math.random() * 0.4);
        e.burst = F.shoot.n; e.burstT = 0.25; e.act = 0.25 + F.shoot.n * (F.shoot.gap || 0.1);
      }
    }
    /* moving */
    if (!F.spd) return;
    var tx, ty;
    if (e.see) { tx = P.x; ty = P.y; }
    else {
      var M = this.M, cx = e.x | 0, cy = e.y | 0, bestD = M.dist[cy * M.w + cx], bx = -1, by = -1;
      if (bestD < 0) bestD = 9999;
      for (var k = 0; k < 4; k++) {
        var nx = cx + (k === 0 ? 1 : k === 1 ? -1 : 0), ny = cy + (k === 2 ? 1 : k === 3 ? -1 : 0);
        if (nx < 0 || ny < 0 || nx >= M.w || ny >= M.h) continue;
        var nd = M.dist[ny * M.w + nx];
        if (nd >= 0 && nd < bestD) { bestD = nd; bx = nx; by = ny; }
      }
      if (bx < 0) return;
      tx = bx + 0.5; ty = by + 0.5;
      var c = this.cell(bx, by);
      if (c === 10) this.tryDoor(bx, by, false);
    }
    var mx = tx - e.x, my = ty - e.y, md = Math.sqrt(mx * mx + my * my) || 1;
    var spd = F.spd;
    if (F.keep && e.see) {
      if (dist < F.keep - 0.4) spd = -F.spd * 0.7;
      else if (dist < F.keep + 0.4) {
        /* step sideways while holding the distance */
        var side = Math.sin(e.t * 0.9 + e.x) > 0 ? 1 : -1;
        mx = -dy * side; my = dx * side; md = dist || 1; spd = F.spd * 0.35;
      }
    }
    if (e.act > 0 && F.shoot) spd = 0;
    if (F.melee && dist < F.melee.range * 0.8) spd = 0;
    var stepX = mx / md * spd * dt, stepY = my / md * spd * dt;
    /* keep a little room between robots */
    for (var j = 0; j < this.things.length; j++) {
      var o = this.things[j];
      if (o === e || o.kind !== "foe" || o.dead) continue;
      var ox = e.x - o.x, oy = e.y - o.y, od = ox * ox + oy * oy, rr = (e.r + o.r);
      if (od < rr * rr && od > 0.0001) { od = Math.sqrt(od); stepX += ox / od * dt * 0.8; stepY += oy / od * dt * 0.8; }
    }
    if (e.type === "spore") { stepX += Math.sin(e.t * 2.1) * dt * 0.3; stepY += Math.cos(e.t * 1.7) * dt * 0.3; }
    if (!this.slide(e, stepX, stepY, e.r * 0.9)) {
      /* stuck on a corner: try sliding along it */
      this.slide(e, stepX * 0.5 + (Math.random() - 0.5) * dt, stepY * 0.5 + (Math.random() - 0.5) * dt, e.r * 0.9);
    }
  };
  W.shoot = function (e, S) {
    var P = this.P, a = Math.atan2(P.y - e.y, P.x - e.x) + (Math.random() - 0.5) * 0.08;
    this.bolt(e.x, e.y, a, S.spd, S.dmg, e.r + 0.1);
    this.hooks.zap && this.hooks.zap(e);
  };
  W.bolt = function (x, y, a, spd, dmg, off) {
    var dx = Math.cos(a), dy = Math.sin(a);
    this.things.push({ kind: "bolt", x: x + dx * off, y: y + dy * off, vx: dx * spd, vy: dy * spd, dmg: dmg, t: 0 });
  };
  W.updateBolt = function (b, dt) {
    var P = this.P;
    b.t += dt;
    var steps = 3;
    for (var s = 0; s < steps; s++) {
      b.x += b.vx * dt / steps; b.y += b.vy * dt / steps;
      if (this.opaque(b.x | 0, b.y | 0) || b.t > 6) { b.gone = true; this.fx.push({ s: "spark", x: b.x - b.vx * 0.02, y: b.y - b.vy * 0.02, z: 0.3, h: 0.2, t: 0, life: 0.15, glow: true }); return; }
      if (!P.dead && Math.hypot(P.x - b.x, P.y - b.y) < 0.32) { b.gone = true; this.hurtPlayer(b.dmg, b.x - b.vx, b.y - b.vy); return; }
      for (var i = 0; i < this.things.length; i++) {
        var o = this.things[i];
        if (o.kind === "barrel" && !o.gone && Math.hypot(o.x - b.x, o.y - b.y) < o.r) { b.gone = true; this.hurtThing(o, 2); return; }
      }
    }
  };
  /* the core: shielded while its nodes stand; rings of bolts, aimed shots once it is hurt, crawlers from the vents */
  W.updateCore = function (e, dt, dist) {
    if (!e.awake) return;
    e.ring = (e.ring == null ? 2 : e.ring) - dt;
    e.aim = (e.aim == null ? 1.5 : e.aim) - dt;
    e.spawn = (e.spawn == null ? 5 : e.spawn) - dt;
    var hurt = e.hp < e.F.hp / 2, shielded = this.shielded();
    if (e.ring <= 0) {
      e.ring = hurt ? 2.2 : 3.0; e.act = 0.3;
      var n = hurt ? 12 : 9, off = e.t * 0.7;
      for (var k = 0; k < n; k++) this.bolt(e.x, e.y, off + k * 2 * Math.PI / n, 2.6, 8, e.r + 0.1);
      this.hooks.zap && this.hooks.zap(e);
    }
    if ((hurt || !shielded) && e.aim <= 0 && e.see) { e.aim = hurt ? 1.1 : 1.8; this.shoot(e, { spd: 4.6, dmg: 9 }); }
    if (e.spawn <= 0) {
      e.spawn = shielded ? 7 : 5;
      var alive = 0, vents = [];
      for (var i = 0; i < this.things.length; i++) {
        var o = this.things[i];
        if (o.kind === "foe" && o.spawned && !o.dead) alive++;
        if (o.kind === "vent") vents.push(o);
      }
      if (alive < 3 && vents.length) {
        var v = vents[(Math.random() * vents.length) | 0], P = this.P;
        if (Math.hypot(v.x - P.x, v.y - P.y) > 2.5) {
          var f = this.addFoe(Math.random() < 0.3 ? "spore" : "crawler", v.x, v.y, true);
          this.fx.push({ s: "puff", x: v.x, y: v.y, z: 0, h: 0.6, t: 0, life: 0.5, grow: true });
          this.hooks.spawn && this.hooks.spawn(f);
        }
      }
    }
  };

  /* ---------------- what the renderer should draw ---------------- */
  W.sprites = function () {
    var S = LD.SPR, out = [], t = this.time, P = this.P;
    for (var i = 0; i < this.things.length; i++) {
      var o = this.things[i];
      if (o.kind === "foe") {
        var e = o, s, h = e.F.h, z = e.F.z || 0;
        if (e.dead) {
          if (e.type === "core") continue;
          var k = Math.min(1, e.deadT / 0.35);
          if (k >= 1) { out.push({ x: e.x, y: e.y, s: S.debris, h: 0.2 }); continue; }
          h = h * (1 - k * 0.8); z = z * (1 - k);
        }
        var fr = Math.floor(e.t * (e.type === "crawler" ? 8 : 4)) & 1;
        if (e.type === "crawler") s = e.act > 0 ? S.crawlerBite : S.crawler[e.awake ? fr : 0];
        else if (e.type === "spore") { s = S.spore[fr]; z += Math.sin(e.t * 3) * 0.05; }
        else if (e.type === "sentry") s = e.act > 0 ? S.sentryFire : S.sentry;
        else if (e.type === "guard") s = e.act > 0 ? S.guardFire : S.guard[e.awake && e.stagger <= 0 ? fr : 0];
        else if (e.type === "node") s = S.node[fr];
        else if (e.type === "core") {
          s = e.flash > 0 || e.act > 0 ? S.coreHurt : S.core;
          out.push({ x: e.x, y: e.y, s: s, h: h, z: z, flash: e.flash > 0 && !this.shielded() });
          if (this.shielded() && (Math.floor(t * 10) & 1)) out.push({ x: e.x + (P.x - e.x) * 0.02, y: e.y + (P.y - e.y) * 0.02, s: S.shield, h: h * 1.1, z: -0.03, glow: true });
          continue;
        }
        out.push({ x: e.x, y: e.y, s: s, h: h, z: z, flash: e.flash > 0 && !e.dead, flip: e.type === "crawler" && (Math.floor(e.t * 2) & 1) && !e.awake });
      } else if (o.kind === "bolt") out.push({ x: o.x, y: o.y, s: S.bolt[Math.floor(o.t * 12) & 1], h: 0.2, z: 0.32, glow: true });
      else if (o.kind === "item") {
        var it = o.it, sp = it.kind === "card" ? S.card[it.n] : S[it.s];
        out.push({ x: o.x, y: o.y, s: sp, h: it.h, z: it.kind === "card" ? 0.08 + Math.sin(t * 3) * 0.04 : 0 });
      } else if (o.kind === "barrel") out.push({ x: o.x, y: o.y, s: S.barrel, h: 0.62 });
      else if (o.kind === "decor") out.push({ x: o.x, y: o.y, s: S[o.d.s], h: o.d.h, glow: o.d.glow });
    }
    for (var f = 0; f < this.fx.length; f++) {
      var x = this.fx[f], spr = S[x.s];
      if (Array.isArray(spr)) spr = spr[Math.min(spr.length - 1, Math.floor(x.t / x.life * spr.length))];
      var g = x.grow ? 0.6 + x.t / x.life * 0.8 : 1;
      out.push({ x: x.x, y: x.y, s: spr, h: x.h * g, z: x.z, glow: x.glow });
    }
    return out;
  };

  LD.World = World; LD.WEAPONS = WEAPONS; LD.FOES = FOES;
})();
</script>

<script data-src="src/60-game.js">
/* Lost Deck: the game. Title, deck list, briefing, play, pause map, results, the end.
   The view is the raycaster's tone buffer copied onto lo-game's 160 x 160 screen, with the HUD below it.
   MIT License. */
(function () {
  "use strict";
  var LD = window.LD, R = LD.R;
  var game = LoGame.create({ width: 160, height: 160, lang: "zh" });
  var T = game.t, g = game.g;
  var W = 160, VH = R.VH;
  document.documentElement.lang = game.lang === "zh" ? "zh-CN" : "en";
  function t(zh, en, vars) { return T({ zh: zh, en: en }, vars); }

  /* ---------------- the save ----------------
     {v: 1, unlocked: n, best: {"<deck>": {time, kills, foes, secrets, total, marks: [time, kills, secrets]}}, tips: {}}
     A save from a newer version is never written over; a save that cannot be read is left alone too. */
  var SAVE_V = 1;
  var save = { v: SAVE_V, unlocked: 1, best: {}, tips: {} }, saveOk = false, saveMsg = null;
  function loadSave() {
    return game.load("save").then(function (v) {
      if (v == null) { saveOk = true; return; }
      if (typeof v !== "object" || typeof v.v !== "number") { saveMsg = t("存档格式不对，这次不保存。", "Save not understood; not saving."); return; }
      if (v.v > SAVE_V) { saveMsg = t("存档来自新版本，请更新游戏。", "Save is from a newer version. Update the game."); return; }
      save.unlocked = Math.max(1, Math.min(LD.DECKS.length + 1, v.unlocked | 0));
      save.best = v.best && typeof v.best === "object" ? v.best : {};
      save.tips = v.tips && typeof v.tips === "object" ? v.tips : {};
      saveOk = true;
    }, function () { saveMsg = t("存档读不出来，这次不保存。", "Save could not be read; not saving."); });
  }
  function writeSave() {
    if (!saveOk) return;
    game.save("save", { v: SAVE_V, unlocked: save.unlocked, best: save.best, tips: save.tips });
    try { if (typeof PAD !== "undefined" && PAD.setSchema) PAD.setSchema(SAVE_V); } catch (e) {}
  }

  /* ---------------- sounds: soft on purpose, they repeat a lot ---------------- */
  var SFX = {
    rivet: { wave: "noise", from: 2200, to: 400, ms: 90, attack: 1, vol: 0.45 },
    scatter: { wave: "noise", from: 900, to: 90, ms: 230, attack: 1, vol: 0.7 },
    swing: { wave: "triangle", from: 320, to: 140, ms: 90, vol: 0.4 },
    clang: { wave: "square", duty: 1, from: 760, to: 700, ms: 70, vol: 0.3 },
    hit: { wave: "triangle", from: 520, to: 180, ms: 70, vol: 0.5 },
    kill: { wave: "noise", from: 700, to: 60, ms: 280, vol: 0.6 },
    door: { wave: "noise", from: 180, to: 420, ms: 380, attack: 40, vol: 0.3 },
    hurt: { wave: "square", duty: 2, from: 220, to: 80, ms: 170, vol: 0.45 },
    card: { wave: "triangle", from: 660, to: 1320, ms: 180, vol: 0.55 },
    zap: { wave: "triangle", from: 1300, to: 380, ms: 130, vol: 0.32 },
    boom: { wave: "noise", from: 420, to: 30, ms: 650, attack: 2, vol: 0.85 },
    puff: { wave: "noise", from: 260, to: 90, ms: 420, attack: 20, vol: 0.45 },
    wake: { wave: "triangle", from: 180, to: 360, ms: 220, vol: 0.28, vibrato: { depth: 1, rate: 14 } },
    ping: { wave: "triangle", from: 1600, to: 1500, ms: 70, vol: 0.28 },
    lift: { wave: "triangle", from: 200, to: 600, ms: 900, attack: 80, vol: 0.5, vibrato: { depth: 0.4, rate: 5 } },
    step: { wave: "noise", from: 120, to: 80, ms: 40, vol: 0.12 }
  };
  var lastSfx = {};
  function sfx(name) {
    var now = game.time;
    if (lastSfx[name] != null && now - lastSfx[name] < 0.06) return;
    lastSfx[name] = now;
    game.sfx(SFX[name] || name);
  }

  /* ---------------- copying the tone buffer onto the screen ---------------- */
  function blit(fb, y0, h) {
    for (var y = 0; y < h; y++) {
      var row = y * W, x = 0;
      while (x < W) {
        var c = fb[row + x], s = x;
        while (x < W && fb[row + x] === c) x++;
        g.rect(s, y0 + y, x - s, 1, c);
      }
    }
  }
  /* a grid sprite into the tone buffer at a whole-number scale */
  function stampFb(fb, s, x0, y0, k, tone) {
    for (var y = 0; y < s.h; y++) for (var x = 0; x < s.w; x++) {
      var v = s.px[y * s.w + x]; if (v === 255) continue;
      if (tone != null) v = tone;
      for (var yy = 0; yy < k; yy++) {
        var py = y0 + y * k + yy; if (py < 0 || py >= VH) continue;
        for (var xx = 0; xx < k; xx++) { var px = x0 + x * k + xx; if (px >= 0 && px < W) fb[py * W + px] = v; }
      }
    }
  }

  /* big text: draw it once with the pixel font, read the pixels back, keep them as a bitmap */
  var bigCache = {};
  function bigText(str, cx, y, k, tone) {
    var b = bigCache[str];
    if (!b) {
      var w = Math.ceil(g.measure(str)), h = 14;
      g.rect(0, 0, w + 2, h, 3);
      g.text(str, 0, 0, { color: 0 });
      var px = [];
      for (var yy = 0; yy < h; yy++) for (var xx = 0; xx < w; xx++) if (g.get(xx, yy) === 0) px.push(xx, yy);
      b = bigCache[str] = { w: w, px: px };
      g.rect(0, 0, w + 2, h, 3);
    }
    var x0 = Math.round(cx - b.w * k / 2);
    for (var i = 0; i < b.px.length; i += 2) g.rect(x0 + b.px[i] * k, y + b.px[i + 1] * k, k, k, tone);
  }

  var ICON = {};
  Object.keys(LD.ICON).forEach(function (k) { ICON[k] = LoGame.sprite(LD.ICON[k]); });

  /* ---------------- stars, for the title and the lift ---------------- */
  var stars = [];
  for (var si = 0; si < 60; si++) stars.push({ x: Math.random() * 160, y: Math.random() * 160, z: 0.3 + Math.random() * 0.7 });
  function drawStars(dt, speed) {
    g.clear(0);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y += dt * speed * s.z * 30; if (s.y > 160) { s.y -= 160; s.x = Math.random() * 160; }
      g.pixel(s.x, s.y, s.z > 0.75 ? 3 : s.z > 0.5 ? 2 : 1);
    }
  }
  function hint(str, y) { g.text(str, 80, y, { color: 3, align: "center" }); }
  function clock(sec) { sec = Math.max(0, Math.floor(sec)); var m = Math.floor(sec / 60), s = sec % 60; return m + ":" + (s < 10 ? "0" : "") + s; }
  function dname(d) { return T(d.name); }

  /* ---------------- title ---------------- */
  var titleSel = 0;
  game.scene("title", {
    enter: function () { game.music(LD.MUSIC.title); game.ambience(null); },
    update: function () {
      var items = titleItems();
      var d = game.dir();
      if (d.y) { titleSel = (titleSel + d.y + items.length) % items.length; sfx("tick"); }
      if (game.pressed("a") || game.pressed("start")) {
        sfx("ok");
        var it = items[titleSel];
        if (it.id === "go") startDeck(Math.min(save.unlocked, LD.DECKS.length) - 1);
        else if (it.id === "decks") game.go("decks");
        else if (it.id === "help") game.go("help");
      }
    },
    draw: function (gg) {
      drawStars(1 / 60, 0.25);
      /* the station: a ring and a spine, drawn in dark */
      var cx = 80, cy = 58;
      for (var a = 0; a < 64; a++) { var ang = a / 64 * Math.PI * 2; g.pixel(cx + Math.cos(ang) * 34, cy + Math.sin(ang) * 10, 1); g.pixel(cx + Math.cos(ang) * 33, cy + Math.sin(ang) * 9.5, 1); }
      g.rect(cx - 2, cy - 24, 4, 48, 1); g.rect(cx - 8, cy - 4, 16, 8, 1); g.rect(cx - 6, cy - 2, 12, 4, 2);
      if (Math.floor(game.time * 1.5) & 1) g.pixel(cx, cy - 25, 3);
      bigText(t("失联站", "LOST DECK"), 80, 14, game.lang === "zh" ? 3 : 2, 3);
      var items = titleItems(), y0 = 92;
      for (var i = 0; i < items.length; i++) {
        var sel = i === titleSel, y = y0 + i * 16;
        if (sel) g.rect(30, y - 1, 100, 15, 3);
        g.text(items[i].label, 80, y, { color: sel ? 0 : 2, align: "center" });
      }
      g.text(saveMsg || t("A 确定  上下 选", "A select  UP/DOWN"), 80, 146, { color: saveMsg ? 3 : 1, align: "center" });
    }
  });
  function titleItems() {
    var n = Math.min(save.unlocked, LD.DECKS.length);
    var first = save.unlocked > 1 ? t("继续：第{n}层", "Go on: deck {n}", { n: n }) : t("出发", "Start");
    return [{ id: "go", label: first }, { id: "decks", label: t("选层", "Decks") }, { id: "help", label: t("操作", "Controls") }];
  }

  /* ---------------- controls ---------------- */
  game.scene("help", {
    update: function () { if (game.pressed("a") || game.pressed("b") || game.pressed("start") || game.pointer.pressed) { sfx("tap"); game.go("title"); } },
    draw: function () {
      g.clear(3);
      g.text(t("操作", "Controls"), 80, 6, { align: "center" });
      g.rect(8, 22, 144, 1, 0);
      var rows = [
        [t("上 下", "UP DOWN"), t("前进 后退", "walk")],
        [t("左 右", "LEFT RIGHT"), t("转身", "turn")],
        [t("A 按住", "A hold"), t("开火", "fire")],
        [t("B", "B"), t("按开关 读终端", "use, read")],
        [t("B+左右", "B+L/R"), t("横移", "sidestep")],
        [t("SELECT", "SELECT"), t("换武器", "weapon")],
        [t("START", "START"), t("暂停 地图", "pause, map")]
      ];
      for (var i = 0; i < rows.length; i++) {
        g.text(rows[i][0], 10, 28 + i * 15);
        g.text(rows[i][1], 150, 28 + i * 15, { align: "right", color: 1 });
      }
      g.text(t("走向门就会开。", "Doors open as you walk in."), 80, 132, { align: "center", color: 1 });
      g.text(t("A 返回", "A back"), 80, 146, { align: "center", color: 1 });
    }
  });

  /* ---------------- deck list ---------------- */
  var deckSel = 0;
  game.scene("decks", {
    enter: function () { deckSel = Math.min(save.unlocked, LD.DECKS.length) - 1; },
    update: function () {
      var d = game.dir(), n = LD.DECKS.length;
      if (d.y) { deckSel = (deckSel + d.y + n) % n; sfx("tick"); }
      if (game.pressed("b")) { sfx("tap"); game.go("title"); }
      if (game.pressed("a") || game.pressed("start")) {
        if (deckSel < save.unlocked) { sfx("ok"); startDeck(deckSel); } else sfx("err");
      }
    },
    draw: function () {
      g.clear(3);
      g.text(t("选层", "Decks"), 6, 4);
      var got = 0;
      Object.keys(save.best).forEach(function (k) { var b = save.best[k]; if (b && b.marks) b.marks.forEach(function (m) { if (m) got++; }); });
      g.text(t("标记 {a}/{b}", "Marks {a}/{b}", { a: got, b: LD.DECKS.length * 3 }), 154, 4, { align: "right", color: 1 });
      g.rect(0, 19, 160, 1, 0);
      var top = Math.max(0, Math.min(deckSel - 3, LD.DECKS.length - 7));
      for (var i = top; i < Math.min(LD.DECKS.length, top + 7); i++) {
        var D = LD.DECKS[i], y = 22 + (i - top) * 17, sel = i === deckSel, open = i < save.unlocked, b = save.best[D.id];
        if (sel) g.rect(0, y - 1, 160, 16, 0);
        var c = sel ? 3 : open ? 0 : 1;
        g.text((i + 1) + " " + (open ? dname(D) : "------"), 6, y + 1, { color: c });
        if (b) {
          for (var m = 0; m < 3; m++) {
            var mx = 122 + m * 10;
            if (b.marks[m]) g.rect(mx, y + 3, 7, 7, c); else g.frame(mx, y + 3, 7, 7, c);
          }
        } else if (open) g.text(t("新", "new"), 154, y + 1, { color: c, align: "right" });
      }
      var D2 = LD.DECKS[deckSel], b2 = save.best[D2.id];
      g.rect(0, 141, 160, 1, 0);
      var line = deckSel >= save.unlocked ? t("先通过上一层", "Clear the deck before") :
        b2 ? t("最快 {a}  标准 {b}", "Best {a}  par {b}", { a: clock(b2.time), b: clock(D2.par) }) : t("标准 {b}", "Par {b}", { b: clock(D2.par) });
      g.text(line, 80, 145, { align: "center", color: 1 });
    }
  });

  /* ---------------- briefing ---------------- */
  var deckIdx = 0;
  function startDeck(i) { deckIdx = i; game.go("brief", null, { to: 0 }); }
  game.scene("brief", {
    enter: function () { this.t = 0; game.musicStop(); game.ambience("wind", 0.25); },
    update: function (dt) {
      this.t += dt;
      if (game.pressed("b")) { sfx("tap"); game.go("decks"); return; }
      if (game.pressed("a") || game.pressed("start") || game.pointer.pressed) {
        var D = LD.DECKS[deckIdx], full = T(D.brief).length;
        if (this.t * 30 < full) { this.t = 99; return; }
        sfx("ok"); game.go("play", null, { to: 0 });
      }
    },
    draw: function () {
      var D = LD.DECKS[deckIdx];
      g.clear(0);
      g.text(t("第{n}层", "DECK {n}", { n: deckIdx + 1 }), 8, 8, { color: 2 });
      g.text(dname(D), 8, 22, { color: 3 });
      g.rect(8, 38, 144, 1, 1);
      var txt = T(D.brief), n = Math.min(txt.length, Math.floor(this.t * 30));
      g.text(txt.slice(0, n), 8, 44, { color: 3, width: 144 });
      if (n >= txt.length) {
        g.text(t("目标", "Goal"), 8, 112, { color: 2 });
        g.text(T(D.goal), 8, 126, { color: 3 });
        if (Math.floor(this.t * 2) & 1) g.text(t("A 出发", "A go"), 152, 146, { color: 3, align: "right" });
        else g.text(t("A 出发", "A go"), 152, 146, { color: 2, align: "right" });
      }
      if (Math.floor(this.t * 3) & 1 && n < txt.length) g.rect(8, 150, 5, 2, 3);
    }
  });

  /* ---------------- play ---------------- */
  var world = null, toast = null, toastT = 0, bigMsg = null, bigT = 0, bHeld = 0, bMoved = false, pending = null, endT = 0;
  function say(msg, sec) { toast = msg; toastT = sec || 2.2; }
  function tip(id, msg) { if (save.tips[id]) return; save.tips[id] = 1; say(msg, 3.2); }
  var GUN_NAME = { wrench: { zh: "扳手", en: "Wrench" }, rivet: { zh: "铆钉枪", en: "Rivet gun" }, scatter: { zh: "散钉枪", en: "Scatter" } };
  var CARD_NAME = [null, { zh: "方块", en: "square" }, { zh: "圆形", en: "circle" }, { zh: "三角", en: "triangle" }];
  var FOE_TIP = {
    crawler: { zh: "爬行机：贴身咬，一钉倒。", en: "Crawler: bites. One rivet does it." },
    spore: { zh: "孢子：靠近会炸，远打。", en: "Spore: bursts near you. Shoot early." },
    sentry: { zh: "哨兵：不动，打光弹，可躲。", en: "Sentry: fixed. Sidestep its bolts." },

  };
  var hooks = {
    door: function () { sfx("door"); },
    locked: function (k) { sfx("err"); say(t("要{c}门卡。", "Needs the {c} card.", { c: T(CARD_NAME[k]) })); },
    exit: function () { if (!pending) { pending = "exit"; endT = 0; sfx("lift"); } },
    secret: function (n, m) { sfx("win"); say(t("暗格 {n}/{m}", "Secret {n}/{m}", { n: n, m: m }), 2.5); },
    terminal: function (i) {
      var D = LD.DECKS[deckIdx], log = D.logs && D.logs[i];
      sfx("tap");
      if (log) game.say(T(log), { name: t("终端", "TERMINAL") });
    },
    nothing: function () {},
    swap: function (gname) { sfx("tick"); say(T(GUN_NAME[gname]), 1); },
    empty: function (gname) { sfx("miss"); say(t("没钉了，换{g}", "Out of rivets: {g}", { g: T(GUN_NAME[gname]) }), 1.6); },
    shot: function (gname) { sfx(gname === "wrench" ? "swing" : gname); },
    clang: function () { sfx("clang"); },
    hit: function () { sfx("hit"); },
    kill: function (e) { sfx("kill"); },
    ping: function () { sfx("ping"); tip("shield", t("核心有盾，先打节点。", "Shielded. Break the nodes first.")); },
    boom: function (x, y, gas) { sfx(gas ? "puff" : "boom"); if (!gas) game.shake(2, 0.25); },
    hurt: function (d) { sfx("hurt"); if (d >= 12) game.shake(2, 0.2); },
    dead: function () { pending = "dead"; endT = 0; game.musicStop(); },
    pickup: function (it) {
      if (it.kind === "card") { sfx("card"); say(t("拿到{c}门卡", "Got the {c} card", { c: T(CARD_NAME[it.n]) }), 2.4); }
      else if (it.kind === "gun") { sfx("card"); say(t("散钉枪！SELECT 换枪", "Scatter gun! SELECT swaps"), 3); }
      else if (it.kind === "ammo") { sfx("coin"); say(t("铆钉 +{n}", "Rivets +{n}", { n: it.n }), 1.2); }
      else { sfx("coin"); say(t("医疗 +{n}", "Med +{n}", { n: it.n }), 1.2); }
    },
    full: function (it) { if (it.kind === "med") say(t("生命已满", "Health full"), 1.2); else if (it.kind === "ammo") say(t("铆钉已满", "Rivets full"), 1.2); },
    wake: function (e) { sfx("wake"); if (FOE_TIP[e.type]) tip("foe-" + e.type, T(FOE_TIP[e.type])); },
    zap: function () { sfx("zap"); },
    spawn: function () { sfx("puff"); },
    coreDown: function () { pending = "core"; endT = 0; game.musicStop(); }
  };

  game.scene("play", {
    enter: function () {
      var D = LD.DECKS[deckIdx];
      world = new LD.World(D, hooks);
      toast = null; toastT = 0; pending = null; endT = 0; bHeld = 0; bMoved = false;
      bigMsg = t("第{n}层 {name}", "DECK {n} {name}", { n: deckIdx + 1, name: dname(D) }); bigT = 2.2;
      game.music(D.boss ? LD.MUSIC.boss : LD.MUSIC.deck);
      game.ambience("wind", D.dark ? 0.35 : 0.18);
      if (deckIdx === 0) game.after(2.4, function () { tip("move", t("上下走，左右转，A开火。", "UP/DOWN walk, LEFT/RIGHT turn, A fires.")); });
      if (D.dark) game.after(2.4, function () { tip("dark", t("停电了，只有手电。", "Power is out. Only your torch.")); });
    },
    update: function (dt) {
      if (!world) return;
      toastT -= dt; bigT -= dt;
      if (pending) { endT += dt; world.update(dt * (pending === "dead" ? 0.3 : 1), {}); return this.finish(); }
      if (game.pressed("start")) { sfx("tap"); game.push("pause"); return; }
      /* B: a short press uses what is in front; held with LEFT or RIGHT it sidesteps */
      var input = { up: game.btn("up"), down: game.btn("down"), left: game.btn("left"), right: game.btn("right") };
      if (game.pressed("b")) { bHeld = 0; bMoved = false; }
      if (game.btn("b")) { bHeld += dt; if (input.left || input.right) bMoved = true; input.strafe = true; }
      if (game.released("b") && !bMoved && bHeld < 0.4) input.use = true;
      input.fire = game.btn("a") || (game.pointer.down && game.pointer.y < VH);
      input.swap = game.pressed("select");
      world.update(dt, input);
      var P = world.P;
      if (P.hp > 0 && P.hp <= 25) tip("low", t("生命低，找医疗包。", "Low health. Find a med kit."));
      if (deckIdx === 0 && world.time > 12) tip("use", t("B 读终端，推松动墙板。", "B reads terminals, pushes loose panels."));
    },
    finish: function () {
      if (pending === "exit" && endT > 1.0) { pending = null; finishDeck(); }
      else if (pending === "dead" && endT > 1.8) { pending = null; game.go("dead", null, { to: 0 }); }
      else if (pending === "core" && endT > 3.2) { pending = null; finishDeck(); }
      else if (pending === "core" && Math.random() < 0.08) { sfx("boom"); game.shake(3, 0.3); }
    },
    draw: function () {
      if (!world) return;
      var D = LD.DECKS[deckIdx], P = world.P;
      var bob = Math.sin(P.bob) * 1.5 * P.moving;
      var view = { x: P.x, y: P.y, a: P.a, bob: bob * 0.6, fog: D.fog || 0.42, dark: D.dark || 0, time: world.time, light: 0 };
      if (P.kick > 0.08 && P.gun !== "wrench") view.light = 0.6;
      R.render(world.M, view, world.sprites());
      var fb = R.fb;
      drawGun(fb, P, bob);
      if (P.gas > 0) gasOverlay(fb, P.gas);
      if (P.hurt > 0) hurtOverlay(fb, P);
      if (pending === "dead") fadeFb(fb, Math.min(1, endT / 1.5));
      if (pending === "exit") fadeFb(fb, Math.min(1, endT / 0.9));
      if (pending === "core") flashFb(fb, endT);
      blit(fb, 0, VH);
      drawHud(P);
      if (toastT > 0 && toast) {
        var lines = g.wrap(toast, 150), w = 0;
        for (var li = 0; li < lines.length; li++) w = Math.max(w, g.measure(lines[li]));
        w = Math.min(158, w + 8);
        g.rect(80 - w / 2, 2, w, lines.length * 13 + 3, 0);
        for (var lj = 0; lj < lines.length; lj++) g.text(lines[lj], 80, 3 + lj * 13, { color: 3, align: "center" });
      }
      if (bigT > 0 && bigMsg) {
        var w2 = Math.min(156, g.measure(bigMsg) + 10);
        g.rect(80 - w2 / 2, 96, w2, 18, 0); g.frame(80 - w2 / 2, 96, w2, 18, 2);
        g.text(bigMsg, 80, 99, { color: 3, align: "center" });
      }
    }
  });

  function drawGun(fb, P, bob) {
    var s = LD.GUN[P.gun], k = 2;
    var kick = P.kick > 0 ? (P.gun === "wrench" ? -10 * Math.sin(P.kick / 0.16 * Math.PI) : 4 * P.kick / 0.16) : 0;
    var x0 = 80 - s.w * k / 2 + Math.round(Math.cos(P.bob * 0.5) * 3 * P.moving) + (P.gun === "wrench" ? 18 : 10);
    var y0 = VH - s.h * k + 4 + Math.round(Math.abs(bob) * 2) + Math.round(kick);
    if (P.kick > 0.06 && P.gun !== "wrench") {
      /* muzzle flash */
      var fx = x0 + (P.gun === "scatter" ? 21 : 25), fy = y0 - 2, r = P.gun === "scatter" ? 10 : 6;
      for (var yy = -r; yy <= r; yy++) for (var xx = -r; xx <= r; xx++) {
        var d = xx * xx + yy * yy; if (d > r * r) continue;
        var py = fy + yy, px = fx + xx; if (py < 0 || py >= VH || px < 0 || px >= W) continue;
        fb[py * W + px] = d < r * r * 0.35 ? 3 : ((xx + yy) & 1) ? 3 : fb[py * W + px];
      }
    }
    stampFb(fb, s, x0, y0, k);
    /* a small sight in the middle: shots go exactly there */
    var cy = VH >> 1, ticks = [[-3, 0], [-2, 0], [2, 0], [3, 0], [0, -3], [0, -2], [0, 2], [0, 3]];
    for (var i = 0; i < ticks.length; i++) {
      var j = (cy + ticks[i][1]) * W + 80 + ticks[i][0];
      fb[j] = fb[j] < 2 ? 3 : 0;   /* light on dark walls, dark on light ones */
    }
  }
  function hurtOverlay(fb, P) {
    var k = P.hurt / 0.35, edge = Math.round(4 + 14 * k), side = P.hurtDir;
    var left = side < -0.4 ? 2 : 1, right = side > 0.4 ? 2 : 1;
    for (var y = 0; y < VH; y++) for (var x = 0; x < W; x++) {
      var e = Math.min(x * right, (W - 1 - x) * left, y * 2, (VH - 1 - y) * 2);
      if (e < edge * 1.6 && ((x + y) & 1)) fb[y * W + x] = 0;
    }
  }
  function gasOverlay(fb, gas) {
    var lvl = Math.min(1, gas / 1.4);
    for (var y = 0; y < VH; y++) for (var x = 0; x < W; x++) {
      if (R.BAYER[(y & 3) * 4 + (x & 3)] < lvl * 0.55) fb[y * W + x] = Math.max(0, Math.min(1, fb[y * W + x]));
    }
  }
  function fadeFb(fb, k) {
    for (var y = 0; y < VH; y++) for (var x = 0; x < W; x++) {
      var v = fb[y * W + x] - Math.floor(k * 3 + R.BAYER[(y & 3) * 4 + (x & 3)]);
      fb[y * W + x] = v < 0 ? 0 : v;
    }
  }
  function flashFb(fb, t2) {
    if (t2 > 2.2) fadeFb(fb, Math.min(1, (t2 - 2.2) / 1));
    else if ((Math.floor(t2 * 12) & 3) === 0) for (var i = 0; i < fb.length; i++) fb[i] = 3 - fb[i];
  }

  function drawHud(P) {
    g.rect(0, VH, W, 160 - VH, 3);
    g.rect(0, VH, W, 1, 0);
    var y1 = VH + 3;
    /* health: icon, number and a bar */
    g.sprite(ICON.hp, 3, y1 + 3);
    g.text(String(P.hp), 13, y1, { color: P.hp <= 25 && (Math.floor(game.time * 4) & 1) ? 1 : 0 });
    g.frame(3, y1 + 15, 44, 5, 0); g.rect(4, y1 + 16, Math.round(42 * P.hp / 100), 3, 0);
    /* rivets */
    g.sprite(ICON.rivet, 54, y1 + 3);
    g.text(P.gun === "wrench" && P.ammo === 0 ? "--" : String(P.ammo), 64, y1);
    g.text(T(GUN_NAME[P.gun]), 54, y1 + 14, { color: 1 });
    /* cards */
    for (var k = 1; k <= 3; k++) {
      var x = 116 + (k - 1) * 14;
      if (world.cards[k]) g.sprite(ICON["card" + k], x, y1 + 2); else g.sprite(ICON.empty, x, y1 + 2);
    }
    g.text(t("敌{a}/{b}", "{a}/{b}", { a: world.kills, b: world.foes }), 157, y1 + 14, { color: 1, align: "right" });
  }

  /* ---------------- pause and the map ---------------- */
  var pauseSel = 0;
  game.scene("pause", {
    enter: function () { pauseSel = 0; },
    update: function () {
      var d = game.dir();
      if (d.y) { pauseSel = (pauseSel + d.y + 3) % 3; sfx("tick"); }
      if (game.pressed("b") || game.pressed("start")) { sfx("tap"); game.pop(); return; }
      if (game.pressed("a")) {
        sfx("ok");
        if (pauseSel === 0) game.pop();
        else if (pauseSel === 1) { game.pop(); game.go("play", null, { to: 0 }); }
        else { game.pop(); game.go("decks"); }
      }
    },
    draw: function () {
      g.rect(0, 0, 160, VH, 0);
      drawMap(world, 4, 4, 152, 80);
      var items = [t("继续", "Resume"), t("重来这一层", "Restart deck"), t("选层", "Decks")];
      for (var j = 0; j < 3; j++) {
        var yj = 87 + j * 13, s2 = j === pauseSel;
        if (s2) g.rect(0, yj, 96, 13, 3);
        g.text(items[j], 6, yj, { color: s2 ? 0 : 2 });
      }
      g.text(clock(world.time), 154, 88, { color: 2, align: "right" });
      g.text(t("暗格{a}/{b}", "Sec {a}/{b}", { a: world.secretsFound, b: world.secrets }), 154, 101, { color: 2, align: "right" });
      g.text(t("敌{a}/{b}", "Foe {a}/{b}", { a: world.kills, b: world.foes }), 154, 114, { color: 2, align: "right" });
    }
  });
  function drawMap(Wd, x0, y0, w, h) {
    var M = Wd.M, k = Math.max(2, Math.min(Math.floor(w / M.w), Math.floor(h / M.h), 7));
    var ox = x0 + Math.floor((w - M.w * k) / 2), oy = y0 + Math.floor((h - M.h * k) / 2);
    for (var y = 0; y < M.h; y++) for (var x = 0; x < M.w; x++) {
      var i = y * M.w + x; if (!M.seen[i]) continue;
      var c = M.cells[i], px = ox + x * k, py = oy + y * k;
      if (c === 0) g.rect(px, py, k, k, 1);
      else if (c >= 10 && c <= 13) { g.rect(px, py, k, k, 2); if (c > 10 && !Wd.cards[c - 10]) g.rect(px + 1, py + 1, k - 2, k - 2, 0); }
      else if (c === 14) g.rect(px, py, k, k, (Math.floor(game.time * 3) & 1) ? 3 : 2);
      else g.rect(px, py, k, k, 2);
    }
    /* floor cells next to seen walls count as seen, so rooms fill in as you look at them */
    var P = Wd.P, cx = ox + P.x * k, cy = oy + P.y * k;
    g.rect(cx - 1, cy - 1, 3, 3, 3);
    g.line(cx, cy, cx + Math.cos(P.a) * k * 1.6, cy + Math.sin(P.a) * k * 1.6, 3);
  }

  /* ---------------- the end of a deck ---------------- */
  var result = null;
  function finishDeck() {
    var D = LD.DECKS[deckIdx];
    var r = { time: world.time, kills: world.kills, foes: world.foes, secrets: world.secretsFound, total: world.secrets };
    r.marks = [r.time <= D.par, r.kills >= r.foes, r.secrets >= r.total];
    var old = save.best[D.id], newBest = !old || r.time < old.time;
    if (old) {
      r.best = { time: Math.min(old.time, r.time), kills: Math.max(old.kills, r.kills), foes: r.foes, secrets: Math.max(old.secrets, r.secrets), total: r.total,
        marks: [old.marks[0] || r.marks[0], old.marks[1] || r.marks[1], old.marks[2] || r.marks[2]] };
    } else r.best = { time: r.time, kills: r.kills, foes: r.foes, secrets: r.secrets, total: r.total, marks: r.marks.slice() };
    r.newBest = newBest && !!old;
    save.best[D.id] = r.best;
    save.unlocked = Math.max(save.unlocked, deckIdx + 2);
    writeSave();
    result = r;
    game.go(D.boss ? "ending" : "results", null, { to: 0 });
  }
  game.scene("results", {
    enter: function () { this.t = 0; game.music(LD.MUSIC.clear, { loop: false }); game.ambience(null); },
    update: function (dt) {
      this.t += dt;
      if (this.t < 0.6) return;
      if (game.pressed("a") || game.pressed("start")) { sfx("ok"); if (deckIdx + 1 < LD.DECKS.length) startDeck(deckIdx + 1); else game.go("title"); }
      else if (game.pressed("b")) { sfx("tap"); game.go("decks"); }
    },
    draw: function () {
      var D = LD.DECKS[deckIdx], r = result, k = Math.min(1, this.t / 1.2);
      drawStars(1 / 60, 3);
      g.text(t("第{n}层 通过", "DECK {n} CLEAR", { n: deckIdx + 1 }), 80, 10, { color: 3, align: "center" });
      g.text(dname(D), 80, 24, { color: 2, align: "center" });
      var rows = [
        [t("用时", "Time"), clock(r.time * k), t("标准 {p}", "par {p}", { p: clock(D.par) }), r.marks[0]],
        [t("消灭", "Kills"), Math.round(r.kills * k) + "/" + r.foes, "", r.marks[1]],
        [t("暗格", "Secrets"), Math.round(r.secrets * k) + "/" + r.total, "", r.marks[2]]
      ];
      for (var i = 0; i < 3; i++) {
        var y = 46 + i * 22;
        g.text(rows[i][0], 12, y, { color: 2 });
        g.text(rows[i][1], 108, y, { color: 3, align: "right" });
        if (rows[i][2]) g.text(rows[i][2], 108, y + 11, { color: 2, align: "right" });
        if (this.t > 1.3 + i * 0.25) { if (rows[i][3]) g.rect(132, y + 2, 9, 9, 3); else g.frame(132, y + 2, 9, 9, 2); }
      }
      if (r.newBest && this.t > 2) g.text(t("新纪录", "New best"), 80, 112, { color: 3, align: "center" });
      if (this.t > 1.6) {
        var next = deckIdx + 1 < LD.DECKS.length ? t("A 下一层", "A next deck") : t("A 返回", "A back");
        g.text(next + "   " + t("B 选层", "B decks"), 80, 144, { color: 2, align: "center" });
      }
    }
  });
  game.scene("dead", {
    enter: function () { this.t = 0; game.ambience(null); },
    update: function (dt) {
      this.t += dt;
      if (this.t < 0.8) return;
      if (game.pressed("a") || game.pressed("start")) { sfx("ok"); game.go("play", null, { to: 0 }); }
      else if (game.pressed("b")) { sfx("tap"); game.go("decks"); }
    },
    draw: function () {
      g.clear(0);
      for (var y = 0; y < 160; y += 2) if (Math.random() < 0.5) g.rect(0, y, 160, 1, 1);
      g.text(t("信号中断", "SIGNAL LOST"), 80, 60, { color: 3, align: "center" });
      g.text(t("第{n}层 {t}", "Deck {n}  {t}", { n: deckIdx + 1, t: clock(world ? world.time : 0) }), 80, 78, { color: 2, align: "center" });
      if (this.t > 0.8) g.text(t("A 再来  B 选层", "A retry  B decks"), 80, 140, { color: 2, align: "center" });
    }
  });
  game.scene("ending", {
    enter: function () { this.t = 0; game.music(LD.MUSIC.title); game.ambience(null); },
    update: function (dt) {
      this.t += dt;
      if (this.t > 2 && (game.pressed("a") || game.pressed("start") || game.pressed("b"))) { sfx("ok"); game.go("title"); }
    },
    draw: function () {
      drawStars(1 / 60, 0.6);
      var lines = LD.ENDING[game.lang] || LD.ENDING.zh, y = 20;
      var shown = Math.floor(this.t * 0.7);
      for (var i = 0; i < Math.min(lines.length, shown + 1); i++) { y += g.text(lines[i], 5, y, { color: i === shown ? 2 : 3, align: "center", width: 150 }) + 4; }
      if (this.t > 2) g.text(t("A 返回", "A back"), 80, 146, { color: 2, align: "center" });
    }
  });

  loadSave().then(function () { game.start("title"); });
  LD.game = game;
  LD.dbg = function () { return world; };   /* for the tests */
  LD.dbgStart = function (i) { deckIdx = i; game.go("play", null, { fade: false }); };
})();
</script>
</body>
